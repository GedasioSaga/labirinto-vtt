<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pino de minigame e seus jogos</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitetura · Labirinto · 18/10/2026 · tiro em 28/10/2026</p>
    <h1>Pino de minigame: um tipo, vários jogos</h1>

    <svg viewBox="0 0 1100 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pino-minigame-jogos-title pino-minigame-jogos-desc">
      <title id="pino-minigame-jogos-title">Pino de minigame e seus jogos</title>
      <desc id="pino-minigame-jogos-desc">O pino guarda um desafio de um jogo escolhido entre dança, pesca e tiro; arquivo, painel do mestre e cartão do jogador são comuns, e cada jogo traz a própria pilha de rede e tela, ligada aos mesmos encaixes da sala.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- zonas -->
      <rect x="24" y="48" width="520" height="360" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="40" y="52" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="104" y="61" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">COMUM A TODO JOGO</text>

      <rect x="584" y="48" width="232" height="360" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="600" y="52" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="648" y="61" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">UM POR JOGO</text>

      <!-- setas (antes das caixas) -->
      <path d="M 240,112 H 404 Q 412,112 412,120 V 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="288" y="92" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="101" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LÊ E GRAVA</text>

      <line x1="240" y1="232" x2="320" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="260" y="212" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="280" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EDITA</text>

      <path d="M 412,264 V 344 Q 412,352 404,352 H 240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="296" y="332" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="324" y="341" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESUMO</text>

      <path d="M 520,216 H 552 Q 560,216 560,208 V 120 Q 560,112 568,112 H 600" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="520" y1="232" x2="600" y2="232" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M 520,248 H 552 Q 560,248 560,256 V 344 Q 560,352 568,352 H 600" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <path d="M 800,112 H 832 Q 840,112 840,120 V 208 Q 840,216 848,216 H 880" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="232" x2="880" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 800,352 H 832 Q 840,352 840,344 V 256 Q 840,248 848,248 H 880" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arquivo do mapa -->
      <rect x="40" y="80" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="80" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="48" y="86" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="66" y="95" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISCO</text>
      <text x="140" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Arquivo do mapa</text>
      <text x="140" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mapFile.ts · um ramo por jogo</text>

      <!-- Painel do mestre -->
      <rect x="40" y="200" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="200" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="206" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="60" y="215" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="140" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Painel do mestre</text>
      <text x="140" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MinigameControls · Dança | Pesca | Tiro</text>

      <!-- Cartão do jogador -->
      <rect x="40" y="320" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="320" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="326" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="68" y="335" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOGADOR</text>
      <text x="140" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cartão do pino</text>
      <text x="140" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">minigameVisivel {jogo, entrada}</text>

      <!-- Pino (foco) -->
      <rect x="320" y="200" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="200" width="200" height="64" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="328" y="206" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="344" y="215" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TIPO</text>
      <text x="420" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pino de minigame</text>
      <text x="420" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pin.minigame · danca | pesca | tiro</text>

      <!-- Dança -->
      <rect x="600" y="80" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="80" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="608" y="86" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="624" y="95" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOGO</text>
      <text x="700" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dança</text>
      <text x="700" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">protocolo · host · tela · placar</text>

      <!-- Pesca -->
      <rect x="600" y="200" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="200" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="608" y="206" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="624" y="215" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOGO</text>
      <text x="700" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pesca</text>
      <text x="700" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">protocolo · host · tela · placar</text>

      <!-- Tiro -->
      <rect x="600" y="320" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="320" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="608" y="326" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="624" y="335" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOGO</text>
      <text x="700" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tiro</text>
      <text x="700" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">protocolo · host · tela · placar</text>

      <!-- Encaixes na sala -->
      <rect x="880" y="192" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="192" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="888" y="198" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="904" y="207" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SALA</text>
      <text x="970" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Encaixes na sala</text>
      <text x="970" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hostSession · hostBridge</text>
      <text x="970" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">playerConnection · Visão</text>

      <!-- nota editorial -->
      <text x="880" y="304" fill="#4f5d75" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">
        <tspan x="880" dy="0">Cada jogo repete estes</tspan>
        <tspan x="880" dy="16">encaixes. O tiro (3º) ainda</tspan>
        <tspan x="880" dy="16">copia: o registro fica a decidir.</tspan>
      </text>

      <!-- legenda -->
      <line x1="24" y1="440" x2="1076" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="24" y="468" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>
      <rect x="112" y="456" width="20" height="16" rx="3" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
      <text x="140" y="468" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">onde o jogo é escolhido</text>
      <rect x="320" y="456" width="20" height="16" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="348" y="468" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">parte do app</text>
      <rect x="456" y="456" width="20" height="16" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="484" y="468" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">disco</text>
    </svg>
  </div>
</body>
</html>
