<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motor por sistema</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1120px; width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitetura · Sistema Dragon Ball Tales, 02/11/2026</p>
    <h1>Um ponto só escolhe o motor: o One Piece segue intocado e o Dragon Ball roda nas pastas dbt/</h1>

    <svg viewBox="0 0 1112 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sistema-dragon-ball-title sistema-dragon-ball-desc">
      <title id="sistema-dragon-ball-title">Motor por sistema: One Piece e Dragon Ball</title>
      <desc id="sistema-dragon-ball-desc">O sistema ativo da aventura ou pasta passa por motorDoSistema, que manda o motor padrão para o código do One Piece de sempre e o motor dragon-ball-tales para a ficha Scouter, o livro, o mundo (NPCs, Comparar, Arena) e a batalha próprios, todos alimentados pelos dados e pelo livro gerados das fontes transcritas.</desc>
      <defs>
        <marker id="sistema-dragon-ball-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="sistema-dragon-ball-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="sistema-dragon-ball-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zona: só com o motor dragon-ball-tales (pintada antes de tudo) -->
      <rect x="444" y="32" width="456" height="360" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="456" y="52" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SÓ COM O MOTOR DRAGON-BALL-TALES · PASTAS DBT/</text>

      <!-- Conectores primeiro -->
      <!-- Sistema ativo pergunta o motor -->
      <line x1="176" y1="220" x2="224" y2="220" stroke="#4f5d75" stroke-width="1" marker-end="url(#sistema-dragon-ball-arrow)"/>

      <!-- Ramo padrão: o código de sempre -->
      <line x1="304" y1="256" x2="304" y2="312" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#sistema-dragon-ball-arrow)"/>
      <rect x="312" y="278" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="334" y="287" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PADRAO</text>

      <!-- Ramo dragon-ball-tales: quatro versões próprias -->
      <path d="M384 196 H396 A8 8 0 0 0 404 188 V108 A8 8 0 0 1 412 100 H464" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#sistema-dragon-ball-arrow)"/>
      <path d="M384 212 H420 A8 8 0 0 0 428 204 V188 A8 8 0 0 1 436 180 H464" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#sistema-dragon-ball-arrow)"/>
      <path d="M384 228 H420 A8 8 0 0 1 428 236 V252 A8 8 0 0 0 436 260 H464" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#sistema-dragon-ball-arrow)"/>
      <path d="M384 244 H396 A8 8 0 0 1 404 252 V332 A8 8 0 0 0 412 340 H464" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#sistema-dragon-ball-arrow)"/>

      <!-- Dados gerados alimentam as quatro -->
      <line x1="720" y1="100" x2="664" y2="100" stroke="#4f5d75" stroke-width="1" marker-end="url(#sistema-dragon-ball-arrow)"/>
      <line x1="720" y1="180" x2="664" y2="180" stroke="#4f5d75" stroke-width="1" marker-end="url(#sistema-dragon-ball-arrow)"/>
      <line x1="720" y1="260" x2="664" y2="260" stroke="#4f5d75" stroke-width="1" marker-end="url(#sistema-dragon-ball-arrow)"/>
      <line x1="720" y1="340" x2="664" y2="340" stroke="#4f5d75" stroke-width="1" marker-end="url(#sistema-dragon-ball-arrow)"/>

      <!-- Fontes viram dados pelo gerador -->
      <line x1="936" y1="220" x2="880" y2="220" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#sistema-dragon-ball-arrow)"/>
      <rect x="884" y="196" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="908" y="205" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GERADOR</text>

      <!-- Nós -->
      <!-- Sistema ativo (entrada) -->
      <rect x="32" y="192" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="192" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="104" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sistema ativo</text>
      <text x="104" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">aventura ou pasta</text>

      <!-- motorDoSistema (foco) -->
      <rect x="224" y="184" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="224" y="184" width="160" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="304" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">motorDoSistema</text>
      <text x="304" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lib/motores.ts</text>
      <text x="304" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">padrao | dragon-ball-tales</text>

      <!-- One Piece (ramo padrão) -->
      <rect x="224" y="312" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="224" y="312" width="160" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="304" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One Piece</text>
      <text x="304" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">código de sempre</text>

      <!-- Ficha -->
      <rect x="464" y="72" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="464" y="72" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="564" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ficha Scouter</text>
      <text x="564" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">registroDeFichas · FichaDBT</text>

      <!-- Livro -->
      <rect x="464" y="152" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="464" y="152" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="564" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Livro de regras</text>
      <text x="564" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">livroDragonBall · LivrosScreen</text>

      <!-- Mundo -->
      <rect x="464" y="232" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="464" y="232" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="564" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mundo do livro</text>
      <text x="564" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NPCs · Comparar · Arena</text>

      <!-- Batalha -->
      <rect x="464" y="312" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="464" y="312" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="564" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Batalha DBT</text>
      <text x="564" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">batalhaDBTStore · App.tsx</text>

      <!-- Dados gerados (armazém) -->
      <rect x="720" y="72" width="160" height="296" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="72" width="160" height="296" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="800" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dados gerados</text>
      <text x="800" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lib/dbt/dados/</text>
      <text x="800" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lib/dbt/livro/</text>

      <!-- Fontes transcritas (externo) -->
      <rect x="936" y="192" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="936" y="192" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1008" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fontes do livro</text>
      <text x="1008" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">docs/fontes/</text>
      <text x="1008" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dragon-ball-tales</text>

      <!-- Legenda: faixa horizontal no pé -->
      <line x1="24" y1="416" x2="1088" y2="416" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="24" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>
      <line x1="120" y1="440" x2="152" y2="440" stroke="#4f5d75" stroke-width="1" marker-end="url(#sistema-dragon-ball-arrow)"/>
      <text x="164" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">motor dragon-ball-tales escolhe a versão própria</text>
      <line x1="432" y1="440" x2="464" y2="440" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#sistema-dragon-ball-arrow)"/>
      <text x="476" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">sem motor = padrão / gerado por script</text>
      <rect x="704" y="434" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="728" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">o ponto único que decide (arquivo compartilhado: só aditivo)</text>
    </svg>
  </div>
</body>
</html>
