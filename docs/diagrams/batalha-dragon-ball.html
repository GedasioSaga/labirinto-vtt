<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batalha Dragon Ball</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1000px; width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Fluxo de dados · Batalha Dragon Ball Tales, 02/11/2026</p>
    <h1>A ação do jogador passa pelo host, vira resultado no motor puro e volta como registro, ficha e vista</h1>

    <svg viewBox="0 0 992 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="batalha-dragon-ball-title batalha-dragon-ball-desc">
      <title id="batalha-dragon-ball-title">Batalha Dragon Ball: o caminho de uma ação</title>
      <desc id="batalha-dragon-ball-desc">O jogador escolhe uma opção e manda batalhaDBT pela rede; o host confere com podeComandar e só então passa à store DBT, que também recebe os comandos do mestre; a store chama o motor puro reduzir, grava a linha do registro com a reversão para desfazer, ajusta PV e PK na ficha, e o host recorta a vista do jogador a partir da cena e das fichas e a devolve como batalhaDBT.estado.</desc>
      <defs>
        <marker id="batalha-dragon-ball-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="batalha-dragon-ball-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="batalha-dragon-ball-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Conectores primeiro -->
      <!-- Pedido do jogador pela rede -->
      <line x1="192" y1="156" x2="288" y2="156" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#batalha-dragon-ball-arrow-link)"/>
      <rect x="206" y="136" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="145" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BATALHADBT.*</text>

      <!-- Host libera para a store -->
      <line x1="464" y1="156" x2="536" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#batalha-dragon-ball-arrow)"/>
      <rect x="480" y="136" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="145" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LIBERA</text>

      <!-- Mestre comanda direto -->
      <line x1="624" y1="72" x2="624" y2="128" stroke="#4f5d75" stroke-width="1" marker-end="url(#batalha-dragon-ball-arrow)"/>
      <rect x="632" y="94" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="656" y="103" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMANDO</text>

      <!-- Store chama o motor puro e recebe o resultado -->
      <line x1="712" y1="144" x2="784" y2="144" stroke="#4f5d75" stroke-width="1" marker-end="url(#batalha-dragon-ball-arrow)"/>
      <rect x="724" y="124" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="748" y="133" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REDUZIR</text>
      <line x1="784" y1="168" x2="712" y2="168" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#batalha-dragon-ball-arrow)"/>
      <rect x="720" y="176" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="748" y="185" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULTADO</text>

      <!-- Store grava a linha do registro -->
      <line x1="624" y1="184" x2="624" y2="280" stroke="#4f5d75" stroke-width="1" marker-end="url(#batalha-dragon-ball-arrow)"/>
      <rect x="632" y="240" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="650" y="249" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LINHA</text>

      <!-- Store ajusta PV e PK na ficha -->
      <path d="M680 184 V224 A8 8 0 0 0 688 232 H864 A8 8 0 0 1 872 240 V280" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#batalha-dragon-ball-arrow)"/>
      <rect x="752" y="212" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="776" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PV · PK</text>

      <!-- Host lê a cena da store para o recorte -->
      <path d="M568 184 V224 A8 8 0 0 1 560 232 H384 A8 8 0 0 0 376 240 V280" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#batalha-dragon-ball-arrow)"/>
      <rect x="448" y="212" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="472" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RECORTE</text>

      <!-- Desfazer: a reversão da linha volta a ficha -->
      <line x1="712" y1="308" x2="784" y2="308" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#batalha-dragon-ball-arrow)"/>
      <rect x="724" y="288" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="748" y="297" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DESFAZ</text>

      <!-- A vista lê as fichas (PV e PK atuais) -->
      <path d="M872 336 V368 A8 8 0 0 1 864 376 H384 A8 8 0 0 1 376 368 V336" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#batalha-dragon-ball-arrow)"/>
      <rect x="592" y="356" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="624" y="365" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FICHAS LIDAS</text>

      <!-- Vista volta ao jogador pela rede -->
      <path d="M288 308 H120 A8 8 0 0 1 112 300 V184" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#batalha-dragon-ball-arrow-link)"/>
      <rect x="56" y="236" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="80" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">.ESTADO</text>

      <!-- Nós -->
      <!-- Mestre (entrada) -->
      <rect x="536" y="24" width="176" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="536" y="24" width="176" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="624" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mestre</text>
      <text x="624" y="60" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PainelDoMestreDBT</text>

      <!-- Jogador (entrada) -->
      <rect x="32" y="128" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="128" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="112" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Jogador escolhe</text>
      <text x="112" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">opção da vista</text>

      <!-- Host confere (foco) -->
      <rect x="288" y="128" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="128" width="176" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="376" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Host confere</text>
      <text x="376" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">podeComandar</text>
      <text x="376" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">batalhaDBTNoHost</text>

      <!-- Store DBT -->
      <rect x="536" y="128" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="536" y="128" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="624" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Store DBT</text>
      <text x="624" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">batalhaDBTStore.comando</text>

      <!-- Motor puro (foco) -->
      <rect x="784" y="128" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="784" y="128" width="176" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="872" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Motor puro</text>
      <text x="872" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lib/dbt/batalha/motor</text>
      <text x="872" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reduzir · d20, CA, Ki</text>

      <!-- Vista do jogador -->
      <rect x="288" y="280" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="280" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="376" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vista do jogador</text>
      <text x="376" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vistaParaJogadorDBT</text>

      <!-- Registro -->
      <rect x="536" y="280" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="536" y="280" width="176" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="624" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Registro</text>
      <text x="624" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">linha + reversão</text>

      <!-- Ficha -->
      <rect x="784" y="280" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="784" y="280" width="176" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="872" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ficha</text>
      <text x="872" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pv · pk · histórico</text>

      <!-- Legenda: faixa horizontal no pé -->
      <line x1="24" y1="408" x2="968" y2="408" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="24" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>
      <line x1="120" y1="432" x2="152" y2="432" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#batalha-dragon-ball-arrow-link)"/>
      <text x="164" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">rede: agir, responder, passar, desfazer, estado</text>
      <line x1="448" y1="432" x2="480" y2="432" stroke="#4f5d75" stroke-width="1" marker-end="url(#batalha-dragon-ball-arrow)"/>
      <text x="492" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">dentro do app do mestre</text>
      <rect x="652" y="426" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="676" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">onde mora a regra: quem pode e o que acontece</text>
    </svg>
  </div>
</body>
</html>
