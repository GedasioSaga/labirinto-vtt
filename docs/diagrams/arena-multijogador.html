<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena multijogador: motor v4</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1000px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitetura · Arena multijogador, F2 (07/11/2026)</p>
    <h1>Até 12 lados sobre a mesma regra da batalha: cada conta joga só a própria ficha e recebe a luta pelo papel dela</h1>

    <svg viewBox="0 0 992 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arena-multijogador-title arena-multijogador-desc">
      <title id="arena-multijogador-title">Arena multijogador: o motor v4 de N lados</title>
      <desc id="arena-multijogador-desc">As contas inscritas (quem joga, arbitra ou assiste) abrem a luta em criarLuta, que monta a mesa em memória com até 12 lados e as cópias das fichas; cada jogada da conta passa por aplicarJogadaNaLuta, que recusa quem não joga e a ficha de outra conta e refaz o pedido sobre a regra da batalha do app, sem mudá-la; depois de cada jogada o fim confere o único lado de pé, a conta sumida há 3 minutos sai da ordem e a luta segue, e a vista sai recortada por papel para cada destinatário.</desc>
      <defs>
        <marker id="arena-multijogador-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arena-multijogador-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arena-multijogador-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Conectores primeiro -->
      <!-- Abrir a luta: inscrições → criarLuta → mesa -->
      <line x1="216" y1="52" x2="280" y2="52" stroke="#4f5d75" stroke-width="1" marker-end="url(#arena-multijogador-arrow)"/>
      <rect x="222" y="32" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="248" y="41" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ABERTURA</text>
      <line x1="464" y1="52" x2="528" y2="52" stroke="#4f5d75" stroke-width="1" marker-end="url(#arena-multijogador-arrow)"/>
      <rect x="476" y="32" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="496" y="41" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MONTA</text>
      <line x1="620" y1="80" x2="620" y2="144" stroke="#4f5d75" stroke-width="1" marker-end="url(#arena-multijogador-arrow)"/>
      <rect x="628" y="104" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="652" y="113" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓPIAS</text>

      <!-- Jogar: conta → aplicarJogadaNaLuta → regra → fim → vista -->
      <line x1="216" y1="172" x2="280" y2="172" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arena-multijogador-arrow-link)"/>
      <rect x="224" y="152" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="248" y="161" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JOGADA</text>
      <line x1="464" y1="172" x2="528" y2="172" stroke="#4f5d75" stroke-width="1" marker-end="url(#arena-multijogador-arrow)"/>
      <rect x="472" y="152" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="496" y="161" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REFEITA</text>
      <line x1="712" y1="172" x2="776" y2="172" stroke="#4f5d75" stroke-width="1" marker-end="url(#arena-multijogador-arrow)"/>
      <rect x="720" y="152" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="744" y="161" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEPOIS</text>
      <line x1="868" y1="200" x2="868" y2="264" stroke="#4f5d75" stroke-width="1" marker-end="url(#arena-multijogador-arrow)"/>
      <rect x="876" y="224" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="900" y="233" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ESTADO</text>

      <!-- Quem some: as fichas saem da ordem pela mesma regra -->
      <path d="M464 292 H612 A8 8 0 0 0 620 284 V200" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arena-multijogador-arrow)"/>
      <rect x="496" y="272" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="536" y="281" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TIRA DA ORDEM</text>

      <!-- Nós -->
      <rect x="32" y="24" width="184" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="24" width="184" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="124" y="48" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Contas inscritas</text>
      <text x="124" y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">jogador · árbitro · espectador</text>

      <rect x="280" y="24" width="184" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="24" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="372" y="48" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">criarLuta</text>
      <text x="372" y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">times ou todos · 12 contas</text>

      <rect x="528" y="24" width="184" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="24" width="184" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="620" y="48" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mesa em memória</text>
      <text x="620" y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lados a..l · perímetro 16x10</text>

      <rect x="32" y="144" width="184" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="144" width="184" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="124" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Conta joga</text>
      <text x="124" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">montar · andar · agir · seq</text>

      <rect x="280" y="144" width="184" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="144" width="184" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="372" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">aplicarJogadaNaLuta</text>
      <text x="372" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">naoJoga · naoEDaConta</text>

      <rect x="528" y="144" width="184" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="144" width="184" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="620" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Regra da batalha</text>
      <text x="620" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">criarBatalhaStore · igual</text>

      <rect x="776" y="144" width="184" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="776" y="144" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="868" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">fimDaLuta</text>
      <text x="868" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vence o único lado de pé</text>

      <rect x="280" y="264" width="184" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="264" width="184" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="372" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Conta sumiu 3 min</text>
      <text x="372" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tirarAusentes · sairDaLuta</text>

      <rect x="776" y="264" width="184" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="776" y="264" width="184" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="868" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">vistaDaLuta</text>
      <text x="868" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">jogador · assistindo · árbitro</text>

      <!-- Legenda: faixa horizontal no pé -->
      <line x1="24" y1="356" x2="968" y2="356" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="24" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>
      <line x1="100" y1="376" x2="132" y2="376" stroke="#4f5d75" stroke-width="1" marker-end="url(#arena-multijogador-arrow)"/>
      <text x="144" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">dado da luta (puro)</text>
      <line x1="276" y1="376" x2="308" y2="376" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arena-multijogador-arrow-link)"/>
      <text x="320" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">chega pelo DO (F4)</text>
      <rect x="452" y="370" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="476" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">novo: regra por conta e vista por papel</text>
      <rect x="712" y="370" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="736" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">reaproveitado do treino</text>
      <rect x="872" y="370" width="16" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="896" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">pelo alarme</text>
    </svg>
  </div>
</body>
</html>
