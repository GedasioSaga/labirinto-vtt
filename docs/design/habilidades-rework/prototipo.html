<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de habilidades (protótipo)</title>
<style>
/* Tokens: os mesmos do protótipo de itens aprovado (tema escuro quente do app, latão, creme, papel),
   mais uma cor por família de peça. A cor da peça nunca anda sozinha: vem com ícone e nome. */
:root {
  --lb-fundo: #1b1510;
  --lb-fundo-painel: #211a13;
  --lb-fundo-alto: #2a2119;
  --lb-fundo-hover: #33281c;
  --lb-campo: #15100b;
  --lb-filete: rgba(239, 230, 212, 0.09);
  --lb-filete-forte: rgba(239, 230, 212, 0.17);
  --lb-creme: #efe6d4;
  --lb-creme-dim: #bfb39e;
  --lb-creme-tenue: #978c79;
  --lb-latao: #e0a84b;
  --lb-latao-claro: #f4c477;
  --lb-latao-suave: rgba(224, 168, 75, 0.13);
  --lb-latao-filete: rgba(224, 168, 75, 0.34);
  --lb-latao-contraste: #1f1606;
  --lb-dano: #ec7a68;
  --lb-dano-suave: rgba(236, 122, 104, 0.15);
  --lb-cura: #8cc095;
  --lb-cura-suave: rgba(140, 192, 149, 0.15);
  --lb-selo: #b8a0de;
  --lb-selo-suave: rgba(184, 160, 222, 0.16);
  --lb-agua: #86b6d6;
  --lb-agua-suave: rgba(134, 182, 214, 0.15);
  --lb-couro: #c99a6e;
  --lb-musgo: #a9bd72;
  --lb-ameixa: #d993b6;
  --papel: #ede3cd;
  --papel-tinta: #2a2119;
  --papel-tenue: #665b4b;
  --papel-dano: #8f2e22;
  --papel-cura: #2b6a3c;
  --papel-selo: #5a3f8c;
  --papel-gasto: #2c5578;
  --papel-filete: rgba(42, 33, 25, 0.16);
  --rasgo: polygon(0 3px, 6% 0, 13% 4px, 21% 1px, 28% 3px, 37% 0, 45% 4px, 52% 1px, 60% 3px, 68% 0, 76% 4px, 84% 1px, 92% 3px, 100% 0, calc(100% - 3px) 30%, 100% 60%, calc(100% - 2px) 100%, 92% calc(100% - 3px), 84% 100%, 76% calc(100% - 4px), 68% calc(100% - 1px), 60% calc(100% - 3px), 52% 100%, 45% calc(100% - 4px), 37% calc(100% - 1px), 28% calc(100% - 3px), 21% 100%, 13% calc(100% - 4px), 6% calc(100% - 1px), 0 calc(100% - 3px), 2px 60%, 0 30%);
  --f-display: 'Sitka Banner', 'Sitka Display', Sitka, Constantia, Georgia, serif;
  --f-texto: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
  --f-num: Bahnschrift, 'DIN Alternate', 'Segoe UI Variable Small', 'Segoe UI', system-ui, sans-serif;
  --t-xs: 11.5px;
  --t-sm: 12.5px;
  --t-md: 14px;
  --t-lg: 16px;
  --t-xl: 21px;
  --t-titulo: 30px;
  --r-p: 6px;
  --r-m: 10px;
  --r-g: 14px;
  --r-total: 999px;
  --sombra-flutua: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 6px 14px rgba(0, 0, 0, 0.42), 0 22px 48px rgba(0, 0, 0, 0.55);
  --sombra-foco: 0 0 0 2px var(--lb-fundo), 0 0 0 4px var(--lb-latao);
  --bisel: inset 0 1px 0 rgba(255, 240, 210, 0.07);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --rapido: 120ms;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; font-family: var(--f-texto); font-size: var(--t-md); line-height: 1.5; color: var(--lb-creme); background: var(--lb-fundo); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
button:disabled, [aria-disabled='true'] { cursor: not-allowed; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
:focus-visible { outline: none; box-shadow: var(--sombra-foco); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ------------------------------------------------ faixa do protótipo (não é do app) */
.proto { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-height: 40px; padding: 6px 20px; background: #110d09; border-bottom: 1px dashed var(--lb-filete-forte); font-size: var(--t-sm); color: var(--lb-creme-tenue); }
.proto strong { color: var(--lb-creme-dim); font-weight: 600; }
.proto__sobra { margin-left: auto; }

/* ------------------------------------------------ cabeçalho com as abas */
.topo { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 22px; padding: 0 20px; background: linear-gradient(180deg, #221a12, #1d1610); border-bottom: 1px solid var(--lb-filete); }
.marca { display: flex; align-items: center; gap: 9px; font-family: var(--f-display); font-size: 19px; color: var(--lb-creme); white-space: nowrap; }
.marca svg { width: 22px; height: 22px; color: var(--lb-latao); }
.abas { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.aba { position: relative; display: inline-flex; align-items: center; gap: 7px; min-height: 52px; padding: 0 14px; color: var(--lb-creme-tenue); font-weight: 500; white-space: nowrap; transition: color var(--rapido) ease; }
.aba::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--lb-latao); transform: scaleX(0); transition: transform 200ms var(--ease-out); }
.aba[aria-selected='true'] { color: var(--lb-creme); }
.aba[aria-selected='true']::after { transform: scaleX(1); }
.aba:focus-visible { box-shadow: inset 0 0 0 2px var(--lb-latao); border-radius: var(--r-p); }
.aba__ponto { width: 7px; height: 7px; border-radius: 50%; background: var(--lb-latao); }
@media (hover: hover) and (pointer: fine) { .aba:hover { color: var(--lb-creme); } }

/* ------------------------------------------------ página */
.pg { max-width: 1480px; margin: 0 auto; padding: 26px 24px 120px; }
.pg:focus, .pg:focus-visible { outline: none; box-shadow: none; }
.faixa-acum { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 14px; padding: 10px 14px; }
.faixa-acum > b { font-size: var(--t-sm); font-weight: 600; }
.faixa-acum .filtro .nota { margin-left: 4px; }
.faixa-acum > .nota { flex: 1 1 260px; }
.pg-cab { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 20px; }
.pg-cab__txt { flex: 1 1 420px; min-width: 0; }
.pg-titulo { font-family: var(--f-display); font-size: var(--t-titulo); font-weight: 400; line-height: 1.1; overflow-wrap: anywhere; }
.pg-sub { margin-top: 6px; max-width: 80ch; color: var(--lb-creme-dim); font-size: 15px; }
.pg-acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.migalha { display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px; font-size: var(--t-sm); color: var(--lb-creme-tenue); min-height: 30px; padding: 0 8px 0 2px; border-radius: var(--r-p); }
.migalha .ic { width: 14px; height: 14px; }
@media (hover: hover) and (pointer: fine) { .migalha:hover { color: var(--lb-creme); } }

/* ------------------------------------------------ primitivos */
.bt { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border-radius: var(--r-p); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete-forte); color: var(--lb-creme); font-weight: 500; white-space: nowrap; box-shadow: var(--bisel); transition: transform var(--rapido) var(--ease-out), background-color var(--rapido) ease, border-color var(--rapido) ease; }
.bt:active:not(:disabled) { transform: scale(0.97); }
.bt:disabled { opacity: 0.45; }
.bt--primario { background: linear-gradient(180deg, var(--lb-latao-claro), var(--lb-latao)); border-color: rgba(0, 0, 0, 0.35); color: var(--lb-latao-contraste); font-weight: 650; }
.bt--latao { background: var(--lb-latao-suave); border-color: var(--lb-latao-filete); color: var(--lb-latao-claro); font-weight: 600; }
.bt--agua { background: var(--lb-agua-suave); border-color: rgba(134, 182, 214, 0.38); color: var(--lb-agua); font-weight: 600; }
.bt--fantasma { background: transparent; border-color: transparent; box-shadow: none; color: var(--lb-creme-dim); }
.bt--p { min-height: 30px; padding: 0 10px; font-size: var(--t-sm); }
.bt--ic { width: 34px; padding: 0; }
.bt--p.bt--ic { width: 30px; }
.bt .ic { width: 15px; height: 15px; }
.bt kbd { font: 500 10.5px / 1 var(--f-num); padding: 2px 5px; border-radius: 3px; border: 1px solid currentColor; opacity: 0.55; }
@media (hover: hover) and (pointer: fine) {
  .bt:hover:not(:disabled) { border-color: var(--lb-latao-filete); background-color: var(--lb-fundo-hover); }
  .bt--primario:hover:not(:disabled) { background: linear-gradient(180deg, #f8cf8a, #e6b05a); }
  .bt--fantasma:hover:not(:disabled) { background: rgba(255, 236, 200, 0.06); border-color: transparent; color: var(--lb-creme); }
}

.entrada { width: 100%; min-height: 36px; padding: 6px 10px; border-radius: var(--r-p); background: var(--lb-campo); border: 1px solid var(--lb-filete-forte); color: var(--lb-creme); transition: border-color var(--rapido) ease; }
.entrada:focus-visible { border-color: var(--lb-latao); box-shadow: 0 0 0 3px var(--lb-latao-suave); }
.entrada[aria-invalid='true'] { border-color: var(--lb-dano); }
select.entrada { padding-right: 28px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--lb-creme-tenue) 50%), linear-gradient(135deg, var(--lb-creme-tenue) 50%, transparent 50%); background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
select.entrada option { background: var(--lb-fundo-painel); }
textarea.entrada { min-height: 64px; resize: vertical; line-height: 1.45; }

.campo { display: grid; gap: 5px; align-content: start; min-width: 0; }
.campo > label, .campo__rot { font-size: var(--t-sm); color: var(--lb-creme-dim); }
.campo__ajuda { font-size: var(--t-xs); color: var(--lb-creme-tenue); }
.campo__erro { font-size: var(--t-xs); color: var(--lb-dano); }

.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: var(--r-m); background: var(--lb-campo); border: 1px solid var(--lb-filete); }
.seg button { min-height: 30px; padding: 0 12px; border-radius: 7px; color: var(--lb-creme-dim); font-size: var(--t-sm); font-weight: 500; transition: background-color var(--rapido) ease, color var(--rapido) ease; }
.seg button[aria-checked='true'] { background: var(--lb-fundo-alto); color: var(--lb-creme); box-shadow: inset 0 0 0 1px var(--lb-latao-filete), var(--bisel); }
@media (hover: hover) and (pointer: fine) { .seg button:hover:not([aria-checked='true']) { color: var(--lb-creme); } }

.marca-caixa { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 30px; }
.marca-caixa input { width: 17px; height: 17px; margin: 0; accent-color: var(--lb-latao); flex: none; }

.etiqueta { display: inline-flex; align-items: center; gap: 5px; min-height: 22px; padding: 0 8px; border-radius: var(--r-total); font-size: var(--t-xs); font-weight: 500; background: rgba(255, 236, 200, 0.06); color: var(--lb-creme-dim); white-space: nowrap; }
.etiqueta .ic { width: 12px; height: 12px; }
.etiqueta--latao { background: var(--lb-latao-suave); color: var(--lb-latao-claro); }
.etiqueta--dano { background: var(--lb-dano-suave); color: var(--lb-dano); }
.etiqueta--cura { background: var(--lb-cura-suave); color: var(--lb-cura); }
.etiqueta--selo { background: var(--lb-selo-suave); color: var(--lb-selo); }

.medalhao { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #3b2f20, #241b12 70%); border: 1px solid var(--lb-latao-filete); color: var(--lb-latao-claro); box-shadow: var(--bisel); }
.medalhao .ic { width: 21px; height: 21px; stroke-width: 1.5; }
.medalhao--p { width: 30px; height: 30px; }
.medalhao--p .ic { width: 16px; height: 16px; }

.painel { border-radius: var(--r-g); background: var(--lb-fundo-painel); border: 1px solid var(--lb-filete); }
.painel__cab { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 14px 16px 0; }
.painel__tit { font-family: var(--f-display); font-size: 19px; font-weight: 400; }
.painel__sub { font-size: var(--t-sm); color: var(--lb-creme-tenue); }
.painel__corpo { padding: 12px 16px 16px; }
.nota { font-size: var(--t-sm); color: var(--lb-creme-tenue); }
.vazio { display: grid; justify-items: start; gap: 10px; padding: 28px 18px; border-radius: var(--r-m); border: 1px dashed var(--lb-filete-forte); color: var(--lb-creme-dim); }

/* ------------------------------------------------ o cartão de papel (o mesmo da página Itens) */
.papel { position: relative; padding: 20px 20px 18px; background: var(--papel); color: var(--papel-tinta); clip-path: var(--rasgo); }
.papel__topo { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.papel__foto { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--papel-filete); color: var(--papel-tinta); background: rgba(255, 255, 255, 0.35); }
.papel__foto .ic { width: 26px; height: 26px; stroke-width: 1.5; }
.papel__nome { font-family: var(--f-display); font-size: 24px; font-weight: 400; line-height: 1.1; overflow-wrap: anywhere; }
.papel__tipo { margin-top: 2px; font: 500 var(--t-sm) / 1.3 var(--f-num); color: var(--papel-tenue); letter-spacing: 0.02em; }
.papel__rot { margin-top: 14px; font-size: var(--t-xs); font-weight: 600; color: var(--papel-tenue); }
.papel__numeros { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px 12px; padding-top: 10px; border-top: 1px dashed var(--papel-filete); }
.papel__numeros dt { font-size: var(--t-xs); color: var(--papel-tenue); }
.papel__numeros dd { font: 600 14px / 1.3 var(--f-num); overflow-wrap: anywhere; }
.papel__desc { margin-top: 3px; font-size: 13.5px; line-height: 1.5; font-style: italic; color: var(--papel-tenue); }
.faixa-confira { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 12px 14px; border-radius: var(--r-m); background: var(--lb-latao-suave); border: 1px solid var(--lb-latao-filete); color: var(--lb-creme-dim); font-size: 13.5px; }
.faixa-confira .ic { color: var(--lb-latao-claro); width: 18px; height: 18px; margin-top: 1px; }
.faixa-confira b { color: var(--lb-creme); }
.tinta-dano { color: var(--papel-dano); font-weight: 650; }
.tinta-cura { color: var(--papel-cura); font-weight: 650; }
.tinta-selo { color: var(--papel-selo); font-weight: 650; }
.tinta-gasto { color: var(--papel-gasto); font-weight: 650; }

/* O que acontece: uma linha por peça, com a cor da família no fio da esquerda; clicar leva até a peça. */
.acontece { margin-top: 6px; display: grid; gap: 2px; }
.acontece__linha { display: grid; grid-template-columns: 3px minmax(0, 1fr); gap: 10px; width: 100%; padding: 6px 6px 6px 0; border-radius: 4px; font-size: 14px; line-height: 1.5; color: var(--papel-tinta); text-align: left; }
.acontece__linha::before { content: ''; border-radius: 2px; background: var(--cor-peca, var(--papel-tenue)); }
.acontece__linha:focus-visible { box-shadow: 0 0 0 2px var(--papel-tinta); }
@media (hover: hover) and (pointer: fine) { button.acontece__linha:hover { background: rgba(42, 33, 25, 0.06); } }
.acontece__vazio { font-size: 14px; color: var(--papel-tenue); font-style: italic; }
.na-batalha { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--papel-filete); display: grid; gap: 6px; }
.na-batalha li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; font-size: 13px; color: var(--papel-tenue); }
.na-batalha .ic { width: 15px; height: 15px; margin-top: 2px; color: var(--papel-gasto); }
.avisos-papel { margin-top: 10px; display: grid; gap: 4px; }
.avisos-papel li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; font-size: 13px; color: var(--papel-dano); }
.avisos-papel .ic { width: 15px; height: 15px; margin-top: 2px; }

/* ------------------------------------------------ Habilidades (catálogo) */
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
.busca { position: relative; flex: 1 1 240px; max-width: 360px; }
.busca .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--lb-creme-tenue); pointer-events: none; }
.busca .entrada { padding-left: 34px; padding-right: 36px; }
.busca kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font: 500 11px / 1 var(--f-num); padding: 3px 6px; border-radius: 4px; border: 1px solid var(--lb-filete-forte); color: var(--lb-creme-tenue); }
.filtros { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.filtro { display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 0 12px; border-radius: var(--r-total); border: 1px solid var(--lb-filete-forte); color: var(--lb-creme-dim); font-size: var(--t-sm); transition: background-color var(--rapido) ease, border-color var(--rapido) ease, color var(--rapido) ease; }
.filtro b { font: 500 var(--t-xs) / 1 var(--f-num); color: var(--lb-creme-tenue); }
.filtro[aria-pressed='true'] { background: var(--lb-latao-suave); border-color: var(--lb-latao-filete); color: var(--lb-creme); }
.filtro[aria-pressed='true'] b { color: var(--lb-latao-claro); }
@media (hover: hover) and (pointer: fine) { .filtro:hover:not([aria-pressed='true']) { color: var(--lb-creme); border-color: var(--lb-latao-filete); } }

.lista { display: grid; gap: 4px; }
.linha { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding-right: 10px; border-radius: var(--r-m); border: 1px solid transparent; transition: background-color var(--rapido) ease, border-color var(--rapido) ease; }
.linha[data-nova] { background: var(--lb-latao-suave); border-color: var(--lb-latao-filete); }
.linha__abrir { display: grid; grid-template-columns: 40px minmax(160px, 230px) minmax(0, 1fr); gap: 14px; align-items: center; min-height: 64px; padding: 8px 4px 8px 12px; border-radius: var(--r-m); }
.linha__abrir:focus-visible { box-shadow: inset 0 0 0 2px var(--lb-latao); }
.linha__nome { display: grid; gap: 3px; min-width: 0; }
.linha__nome strong { font-family: var(--f-display); font-size: 18px; font-weight: 400; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linha__nome .etiqueta { justify-self: start; }
.linha__resumo { min-width: 0; display: grid; gap: 5px; }
.linha__resumo p { color: var(--lb-creme-dim); font-size: 13.5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.linha__pecas { display: flex; flex-wrap: wrap; gap: 4px; }
.chip-peca { display: inline-flex; align-items: center; gap: 5px; min-height: 20px; padding: 0 7px 0 5px; border-radius: 4px; font-size: var(--t-xs); color: var(--lb-creme-dim); background: rgba(255, 236, 200, 0.05); box-shadow: inset 2px 0 0 var(--cor-peca); }
.chip-peca .ic { width: 12px; height: 12px; color: var(--cor-peca); }
.linha__acoes { display: flex; gap: 6px; }
@media (hover: hover) and (pointer: fine) { .linha:hover { background: rgba(255, 236, 200, 0.035); } }

/* ------------------------------------------------ Editor */
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 24px; align-items: start; }
.editor__form { display: grid; gap: 16px; min-width: 0; }
.secao { padding: 18px 20px 20px; border-radius: var(--r-g); background: var(--lb-fundo-painel); border: 1px solid var(--lb-filete); }
.secao__cab { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 14px; }
.secao__tit { font-family: var(--f-display); font-size: 20px; font-weight: 400; }
.secao__sub { font-size: var(--t-sm); color: var(--lb-creme-tenue); max-width: 62ch; }
.grade-campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px 16px; }
.grade-campos .largo { grid-column: 1 / -1; }

.acoes-cartao { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.acao-c { position: relative; display: grid; gap: 4px; align-content: start; min-height: 84px; padding: 11px 12px; border-radius: var(--r-m); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete-forte); box-shadow: var(--bisel); transition: transform var(--rapido) var(--ease-out), border-color var(--rapido) ease, background-color var(--rapido) ease; }
.acao-c:active { transform: scale(0.98); }
.acao-c[aria-checked='true'] { background: linear-gradient(180deg, #3a2d1b, #2c2216); border-color: var(--lb-latao); box-shadow: inset 0 0 0 1px var(--lb-latao), var(--bisel); }
.acao-c__nome { font-weight: 650; font-size: 14.5px; }
.acao-c__faz { font-size: var(--t-xs); color: var(--lb-creme-tenue); line-height: 1.35; }
.acao-c__grupo { grid-column: 1 / -1; margin-top: 4px; font-size: var(--t-xs); font-weight: 600; color: var(--lb-creme-tenue); }
.acao-c__grupo:first-child { margin-top: 0; }
@media (hover: hover) and (pointer: fine) { .acao-c:hover:not([aria-checked='true']) { border-color: var(--lb-latao-filete); background: var(--lb-fundo-hover); } }

.icones { display: flex; flex-wrap: wrap; gap: 6px; }
.icone-op { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--lb-filete-forte); color: var(--lb-creme-dim); background: var(--lb-campo); transition: border-color var(--rapido) ease, color var(--rapido) ease; }
.icone-op[aria-checked='true'] { border-color: var(--lb-latao); color: var(--lb-latao-claro); box-shadow: inset 0 0 0 1px var(--lb-latao); }
.icone-op .ic { width: 20px; height: 20px; stroke-width: 1.5; }

/* ------------------------------------------------ peças: cada uma se lê como uma frase com campos dentro */
.pecas { display: grid; gap: 10px; }
.peca { --cor-peca: var(--lb-latao); position: relative; display: grid; gap: 12px; padding: 14px 16px 16px 20px; border-radius: var(--r-m); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete-forte); box-shadow: var(--bisel); scroll-margin-top: 90px; }
/* o encaixe: um fio da cor da família e um dente, como peça que se encaixa na técnica */
.peca::before { content: ''; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 4px; border-radius: var(--r-m) 0 0 var(--r-m); background: var(--cor-peca); }
.peca::after { content: ''; position: absolute; left: -6px; top: 22px; width: 9px; height: 14px; border-radius: 0 7px 7px 0; background: var(--cor-peca); }
.peca[data-entra] { animation: entra 200ms var(--ease-out); }
.peca[data-brilho] { animation: brilho 900ms ease; }
.secao[data-brilho] { animation: brilho-secao 900ms ease; }
@keyframes brilho-secao { 0% { box-shadow: 0 0 0 2px var(--lb-latao-filete); } 100% { box-shadow: 0 0 0 2px transparent; } }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } }
@keyframes brilho { 0% { border-color: var(--cor-peca); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cor-peca) 30%, transparent); } 100% { border-color: var(--lb-filete-forte); box-shadow: var(--bisel); } }
.peca__cab { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.peca__cab .medalhao { color: var(--cor-peca); border-color: color-mix(in srgb, var(--cor-peca) 45%, transparent); }
.peca__tit { font-weight: 650; font-size: 15px; line-height: 1.25; }
.peca__faz { font-size: var(--t-xs); color: var(--lb-creme-tenue); }
.peca__acoes { display: flex; gap: 2px; }
.peca__corpo { display: grid; gap: 12px; }

.frase { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; color: var(--lb-creme-dim); line-height: 1.4; }
.frase > b { color: var(--lb-creme); font-weight: 600; }
.frase .entrada { width: auto; min-height: 32px; padding-top: 4px; padding-bottom: 4px; }
.frase select.entrada { max-width: 100%; }
.frase input.entrada[type='number'] { width: 70px; text-align: center; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.frase input.entrada[type='number']::-webkit-inner-spin-button { opacity: 0.4; }
.frase input.entrada[type='text'] { width: 180px; }
.frase__seta { color: var(--lb-creme-tenue); }
.frase--sub { padding-left: 14px; border-left: 1px dashed var(--lb-filete-forte); }
.rot-linha { font-size: var(--t-xs); font-weight: 600; color: var(--lb-creme-tenue); }

.respostas, .itens-peca { display: grid; gap: 6px; }
.resposta, .item-peca { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 8px 8px 12px; border-radius: var(--r-p); background: var(--lb-campo); border: 1px solid var(--lb-filete); color: var(--lb-creme-dim); }
.resposta[data-entra], .item-peca[data-entra] { animation: entra 180ms var(--ease-out); }
.resposta .entrada, .item-peca .entrada { width: auto; min-height: 30px; padding-top: 3px; padding-bottom: 3px; }
.resposta input.entrada[type='number'], .item-peca input.entrada[type='number'] { width: 64px; text-align: center; font-family: var(--f-num); }
.resposta input.entrada[type='text'], .item-peca input.entrada[type='text'] { width: 150px; }
.resposta__nome { width: 130px !important; font-weight: 600; }
.resposta .bt--ic, .item-peca .bt--ic { margin-left: auto; }
.pergunta-bloco { display: grid; gap: 8px; padding: 10px 0 2px; }
.pergunta-bloco + .pergunta-bloco { border-top: 1px dashed var(--lb-filete-forte); padding-top: 12px; }

.elementos { display: flex; flex-wrap: wrap; gap: 6px; }
.elem { --cor-el: var(--lb-latao); display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 12px 0 8px; border-radius: var(--r-total); border: 1px solid var(--lb-filete-forte); background: var(--lb-campo); color: var(--lb-creme-dim); font-size: var(--t-sm); font-weight: 500; transition: border-color var(--rapido) ease, background-color var(--rapido) ease, color var(--rapido) ease, transform var(--rapido) var(--ease-out); }
.elem:active { transform: scale(0.97); }
.elem .ic { color: var(--cor-el); }
.elem[aria-pressed='true'] { border-color: var(--cor-el); color: var(--lb-creme); background: color-mix(in srgb, var(--cor-el) 14%, var(--lb-campo)); }
@media (hover: hover) and (pointer: fine) { .elem:hover:not([aria-pressed='true']) { color: var(--lb-creme); border-color: var(--lb-latao-filete); } }
.elem-linha { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; padding: 8px 8px 8px 10px; border-radius: var(--r-p); background: var(--lb-campo); border: 1px solid var(--lb-filete); }
.elem-linha .medalhao--p { color: var(--cor-el); border-color: color-mix(in srgb, var(--cor-el) 45%, transparent); }
.elem-linha .frase { gap: 5px 7px; font-size: 13.5px; }

.por-peca { display: grid; gap: 10px; padding: 14px; border-radius: var(--r-m); border: 1px dashed var(--lb-filete-forte); }
.por-peca__tit { font-size: var(--t-sm); color: var(--lb-creme-dim); font-weight: 600; }
.tipos-peca { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
.tipo-peca { --cor-peca: var(--lb-latao); display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 2px 10px; align-items: center; min-height: 54px; padding: 8px 10px; border-radius: var(--r-p); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete); box-shadow: inset 3px 0 0 var(--cor-peca); text-align: left; transition: border-color var(--rapido) ease, background-color var(--rapido) ease, transform var(--rapido) var(--ease-out); }
.tipo-peca:active { transform: scale(0.98); }
.tipo-peca .medalhao--p { grid-row: span 2; color: var(--cor-peca); border-color: color-mix(in srgb, var(--cor-peca) 45%, transparent); }
.tipo-peca b { font-size: 13.5px; font-weight: 600; line-height: 1.2; }
.tipo-peca small { font-size: var(--t-xs); color: var(--lb-creme-tenue); line-height: 1.3; }
@media (hover: hover) and (pointer: fine) { .tipo-peca:hover { border-color: color-mix(in srgb, var(--cor-peca) 55%, transparent); background: var(--lb-fundo-hover); } }

.previa { position: sticky; top: 72px; display: grid; gap: 12px; max-height: calc(100vh - 88px); overflow: auto; overscroll-behavior: contain; padding-bottom: 6px; scrollbar-width: thin; }
.previa__rot { font-size: var(--t-sm); color: var(--lb-creme-tenue); display: flex; justify-content: space-between; gap: 8px; }
.estado-salvo { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-sm); color: var(--lb-creme-tenue); }
.estado-salvo i { width: 7px; height: 7px; border-radius: 50%; background: var(--lb-cura); }
.estado-salvo[data-sujo] i { background: var(--lb-latao); }

.modelos { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.modelo { --cor-peca: var(--lb-creme-tenue); position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 3px 10px; align-items: start; padding: 10px 12px; border-radius: var(--r-m); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete-forte); text-align: left; transition: border-color var(--rapido) ease, background-color var(--rapido) ease, transform var(--rapido) var(--ease-out); }
.modelo:active { transform: scale(0.98); }
.modelo .medalhao--p { grid-row: span 2; color: var(--cor-peca); border-color: color-mix(in srgb, var(--cor-peca) 45%, transparent); }
.modelo b { font-size: 14px; font-weight: 650; line-height: 1.25; }
.modelo small { font-size: var(--t-xs); color: var(--lb-creme-tenue); line-height: 1.35; }
.modelo[aria-checked='true'] { border-color: var(--lb-latao); background: linear-gradient(180deg, #3a2d1b, #2c2216); box-shadow: inset 0 0 0 1px var(--lb-latao); }
@media (hover: hover) and (pointer: fine) { .modelo:hover:not([aria-checked='true']) { border-color: var(--lb-latao-filete); background: var(--lb-fundo-hover); } }

/* ------------------------------------------------ Testar no boneco */
.teste { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 22px; align-items: start; }
.ajustes { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 16px; margin-bottom: 16px; border-radius: var(--r-m); background: var(--lb-fundo-painel); border: 1px solid var(--lb-filete); color: var(--lb-creme-dim); font-size: 13.5px; }
.ajustes label { display: inline-flex; align-items: center; gap: 8px; }
.ajustes .entrada { width: auto; min-height: 32px; padding-top: 3px; padding-bottom: 3px; }
.ajustes input.entrada[type='number'] { width: 66px; text-align: center; font-family: var(--f-num); }
.rodadas { display: grid; gap: 12px; }
.rodada { display: grid; gap: 10px; padding: 14px 16px 16px; border-radius: var(--r-m); background: var(--lb-fundo-painel); border: 1px solid var(--lb-filete); }
.rodada[data-entra] { animation: entra 220ms var(--ease-out); }
.rodada__cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.rodada__cab h3 { font-family: var(--f-display); font-size: 19px; font-weight: 400; }
.rodada__cab span { font-size: var(--t-sm); color: var(--lb-creme-tenue); }
.registro { display: grid; gap: 3px; }
.registro li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; padding: 4px 0; font-size: 13.5px; color: var(--lb-creme-dim); border-bottom: 1px solid var(--lb-filete); }
.registro li:last-child { border-bottom: 0; }
.registro li > span:first-child { font-size: var(--t-xs); color: var(--lb-creme-tenue); padding-top: 2px; }
.registro li[data-t='dano'] > span:last-child b { color: var(--lb-dano); }
.registro li[data-t='cura'] > span:last-child b { color: var(--lb-cura); }
.registro li[data-t='marca'] > span:last-child b { color: var(--lb-selo); }
.registro li[data-t='aviso'] > span:last-child { color: var(--lb-latao-claro); }
.registro li[data-t='nao'] > span:last-child { color: var(--lb-creme-tenue); font-style: italic; }
.registro li[data-t='desce'] > span:last-child b { color: var(--lb-ameixa); }
.pergunta-batalha { display: grid; gap: 12px; padding: 14px 16px; border-radius: var(--r-m); background: linear-gradient(180deg, rgba(224, 168, 75, 0.08), transparent), var(--lb-fundo-alto); border: 1px solid var(--lb-latao-filete); }
.pergunta-batalha__q { display: grid; gap: 6px; }
.pergunta-batalha__q > span { font-weight: 600; font-size: 14px; }
.pergunta-batalha__pe { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.placar { position: sticky; top: 72px; display: grid; gap: 12px; }
.lutador { display: grid; gap: 10px; padding: 14px 16px 16px; }
.lutador__cab { display: flex; align-items: center; gap: 10px; }
.lutador__cab b { font-family: var(--f-display); font-size: 19px; font-weight: 400; }
.lutador__cab small { margin-left: auto; font-size: var(--t-xs); color: var(--lb-creme-tenue); }
.medidor { display: grid; gap: 4px; }
.medidor__rot { display: flex; justify-content: space-between; font-size: var(--t-sm); color: var(--lb-creme-dim); }
.medidor__rot b { font: 500 14px / 1.2 var(--f-num); color: var(--lb-creme); }
.medidor__barra { height: 8px; border-radius: 4px; background: var(--lb-campo); overflow: hidden; }
.medidor__barra i { display: block; height: 100%; border-radius: 4px; background: var(--cor, var(--lb-cura)); transform-origin: left; transition: transform 320ms var(--ease-out); }
.pilulas { display: flex; flex-wrap: wrap; gap: 4px; }
.grafico { display: grid; gap: 6px; padding-top: 10px; border-top: 1px dashed var(--lb-filete-forte); }
.grafico__tit { font-size: var(--t-sm); color: var(--lb-creme-dim); }
.grafico svg { width: 100%; height: auto; overflow: visible; }
.grafico .barra-g { fill: var(--lb-ameixa); }
.grafico .barra-g[data-base] { fill: var(--lb-creme-tenue); }
.grafico .eixo { stroke: var(--lb-filete-forte); stroke-width: 1; }
.grafico text { fill: var(--lb-creme-tenue); font: 500 11px var(--f-num); }
.grafico text.valor { fill: var(--lb-creme); font-size: 12px; }
.grafico .alvo-hover { fill: transparent; }
.grafico .alvo-hover:hover + .dica-g, .grafico .alvo-hover:focus + .dica-g { opacity: 1; }
.dica-g { opacity: 0; pointer-events: none; transition: opacity 120ms ease; }
.dica-g rect { fill: #30261a; stroke: var(--lb-filete-forte); }
.dica-g text { fill: var(--lb-creme); font-size: 11.5px; }

/* ------------------------------------------------ Como era x como fica */
.casos { display: grid; gap: 18px; }
.caso { display: grid; gap: 14px; padding: 20px; border-radius: var(--r-g); background: var(--lb-fundo-painel); border: 1px solid var(--lb-filete); }
.caso__tit { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.caso__tit h2, .caso__tit h3 { font-family: var(--f-display); font-size: 21px; font-weight: 400; }
.caso__tit p { color: var(--lb-creme-tenue); font-size: var(--t-sm); }
.caso__lados { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.caso__lado { display: grid; gap: 8px; align-content: start; }
.caso__rot { font-size: var(--t-sm); font-weight: 600; }
.caso__rot[data-c='antes'] { color: var(--lb-dano); }
.caso__rot[data-c='agora'] { color: var(--lb-cura); }
.antes { display: grid; gap: 6px; padding: 12px; border-radius: var(--r-m); background: #18130e; border: 1px solid var(--lb-filete); font-size: var(--t-sm); color: var(--lb-creme-tenue); }
.antes__campo { display: inline-block; padding: 1px 7px; margin: 0 4px 4px 0; border-radius: 4px; background: rgba(239, 230, 212, 0.05); }
.antes__campo[data-ruim] { color: var(--lb-dano); background: var(--lb-dano-suave); outline: 1.5px dashed var(--lb-dano); outline-offset: 1px; }
.agora { display: grid; gap: 6px; padding: 12px; border-radius: var(--r-m); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete-forte); font-size: 13.5px; color: var(--lb-creme-dim); }
.tabela { width: 100%; min-width: 640px; border-collapse: collapse; font-size: 13.5px; }
.tabela th, .tabela td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--lb-filete); }
.tabela th { font-size: var(--t-sm); font-weight: 600; color: var(--lb-creme-tenue); }
.tabela td:first-child { width: 96px; }
.tabela td:nth-child(2) { color: var(--lb-creme-dim); width: 48%; }
.caso--decisoes { border-color: var(--lb-latao-filete); background: linear-gradient(180deg, rgba(224, 168, 75, 0.06), transparent 240px), var(--lb-fundo-painel); }
.decisoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px; counter-reset: dec; }
.decisoes li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px 10px; align-items: start; padding: 10px 12px; border-radius: var(--r-m); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete); }
.decisoes li b { font-weight: 600; font-size: 13.5px; }
.decisoes li p { grid-column: 2; font-size: 13px; color: var(--lb-creme-dim); }
.decisao__n { grid-row: span 2; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font: 600 12px / 1 var(--f-num); color: var(--lb-latao-claro); background: var(--lb-latao-suave); }

/* ------------------------------------------------ avisos (com Desfazer) */
.avisos { position: fixed; right: 22px; bottom: 22px; z-index: 80; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.aviso { pointer-events: auto; display: flex; align-items: center; gap: 12px; max-width: min(480px, calc(100vw - 32px)); min-height: 48px; padding: 8px 8px 8px 14px; border-radius: var(--r-m); background: #30261a; border: 1px solid var(--lb-filete-forte); box-shadow: var(--sombra-flutua); transform: translateY(0); opacity: 1; transition: transform 220ms var(--ease-out), opacity 220ms var(--ease-out); }
.aviso[data-entrando] { transform: translateY(110%); opacity: 0; }
.aviso[data-saindo] { transform: translateY(40%); opacity: 0; transition-duration: 140ms; }
.aviso p { flex: 1; font-size: 13.5px; }
.aviso > .ic { color: var(--lb-cura); }

@media (max-width: 1180px) {
  .editor, .teste { grid-template-columns: minmax(0, 1fr); }
  .previa, .placar { position: static; max-height: none; }
  .caso__lados { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .pg { padding: 20px 16px 120px; }
  .marca span { display: none; }
  .linha { grid-template-columns: minmax(0, 1fr); padding: 0 0 10px; }
  .linha__abrir { grid-template-columns: 40px minmax(0, 1fr); }
  .linha__resumo { grid-column: 1 / -1; }
  .linha__acoes { padding-left: 66px; }
  .decisoes { grid-template-columns: minmax(0, 1fr); }
  .registro li { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .frase input.entrada[type='text'] { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .peca[data-entra], .resposta[data-entra], .item-peca[data-entra], .rodada[data-entra] { animation: aparece 160ms ease; }
  .peca[data-brilho] { animation: none; outline: 2px solid var(--cor-peca); outline-offset: 2px; }
  .secao[data-brilho] { animation: none; outline: 2px solid var(--lb-latao-filete); outline-offset: 2px; }
  @keyframes aparece { from { opacity: 0; } }
  .medidor__barra i { transition: none; }
  .aba::after { transition: none; }
  .aviso, .aviso[data-entrando], .aviso[data-saindo] { transform: none; }
  .bt:active:not(:disabled), .acao-c:active, .tipo-peca:active, .modelo:active, .elem:active { transform: none; }
}
</style>

<body>
<div class="proto" role="region" aria-label="Sobre este protótipo">

  <button type="button" class="bt bt--p bt--fantasma proto__sobra" data-acao="recomecar">Voltar ao começo</button>
</div>
<header class="topo">
  <div class="marca"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 3.5h17v17h-13v-9h9v5h-5"/></svg><span>Labirinto</span></div>
  <nav class="abas" role="tablist" aria-label="Telas do protótipo">
    <button type="button" role="tab" class="aba" id="aba-catalogo" data-aba="catalogo" aria-controls="tela">Habilidades</button>
    <button type="button" role="tab" class="aba" id="aba-ficha" data-aba="ficha" aria-controls="tela">Na ficha</button>

/** Os 22 modelos de técnica de hoje continuam no "Começar de um modelo", agrupados como hoje. */
const MODELOS_DE_HOJE = [
  ['Ataque', ['Golpe simples', 'Golpe em área', 'Giro', 'Disparo em linha', 'Explosão à distância', 'Golpe perfurante', 'Golpe duplo', 'Corte que sangra', 'Dreno de vida', 'Overload']],
  ['Cura e apoio', ['Cura', 'Cura em área', 'Purificar', 'Reviver', 'Buff em aliado', 'Barreira']],
  ['Condição', ['Atordoar com teste', 'Enfraquecer']],
  ['Reação', ['Esquiva perfeita', 'Bloqueio', 'Aparar', 'Contra-golpe']],
];
function habDoModeloDeHoje(nome) {
  const h = habEmBranco(nome);
  const grupo = MODELOS_DE_HOJE.find(([, l]) => l.includes(nome))[0];
  if (grupo === 'Cura e apoio') {
    h.categoria = 'apoio'; h.alcance.pega = 'aliados'; h.dano.da = false;
    if (nome.startsWith('Cura')) h.efeitos = [efeitoNovo('cura')];
    if (nome === 'Cura em área') h.alcance.forma = 'volta';
    if (nome === 'Purificar') h.efeitos = [efeitoNovo('tiraSelos')];
    if (nome === 'Reviver') h.efeitos = [efeitoNovo('revive')];
    if (nome === 'Buff em aliado') h.pecas = [pecaNova('status')];
    if (nome === 'Barreira') h.efeitos = [{ ...efeitoNovo('cura'), rec: 'escudo', v: 40 }];
  } else if (grupo === 'Reação') {
    h.categoria = 'reacao';
    h.defesa.como = nome === 'Esquiva perfeita' ? 'anula' : nome === 'Bloqueio' ? 'pct' : 'd20';
    if (nome === 'Contra-golpe') h.defesa.devolve = 'metade';
  } else if (grupo === 'Condição') {
    h.efeitos = [{ ...efeitoNovo('selo'), cond: nome === 'Enfraquecer' ? 'enfraquecido' : 'atordoado' }];
    if (nome === 'Atordoar com teste') h.acerto.teste = 'cd';
  } else {
    if (nome === 'Overload') h.categoria = 'overload';
    if (nome === 'Golpe em área') h.alcance.forma = 'ponto';
    if (nome === 'Giro') h.alcance.forma = 'volta';
    if (nome === 'Disparo em linha') { h.alcance.forma = 'linha'; h.alcance.casas = 4; }
    if (nome === 'Explosão à distância') { h.alcance.forma = 'ponto'; h.alcance.casas = 5; }
    if (nome === 'Golpe perfurante') h.golpe.bate = 'perfurante';
    if (nome === 'Golpe duplo') h.dano.segundo = true;
    if (nome === 'Corte que sangra') h.golpe.bate = 'cortante';
    if (nome === 'Dreno de vida') h.efeitos = [efeitoNovo('rouba')];
  }
  return h;
}

function acumuladoresDoCatalogo() {
  const nomes = new Set();
  [...todasAsHabs(), E.rascunho].forEach((h) => h && h.pecas.forEach((p) => { if (p.tipo === 'acumulador' && p.nome.trim()) nomes.add(p.nome.trim()); }));
  return [...nomes];
}

/* =============================================================== corpo de cada peça */
function corpoPergunta(p, c, h) {
  const blocos = p.perguntas.map((q, j) => {
    const cq = `${c}.perguntas.${j}`;
    const resp = q.respostas.map((r, k) => {
      const cr = `${cq}.respostas.${k}`;
      return `<li class="resposta" data-k2="${r.id}">
        ${txt(`${cr}.nome`, r.nome, `Nome da resposta ${k + 1}`, 'Resposta', 24, ' resposta__nome')}
        <span>bate como</span>${sel(`${cr}.bate`, r.bate, [['', 'o golpe já bate'], ...TIPOS_QUE_BATEM.map(([k2, n]) => [k2, n])], `Tipo do golpe na resposta ${r.nome}`)}
        <span>dano</span>${num(`${cr}.dano`, r.dano, `Dano a mais na resposta ${r.nome}`, -200, 200)}
        <span>deixa</span>${sel(`${cr}.cond`, r.cond, opsCond(), `Condição na resposta ${r.nome}`)}
        ${r.cond ? `<span>por</span>${num(`${cr}.turnos`, r.turnos, `Turnos da condição na resposta ${r.nome}`, 1, 20)}<span>${pl(r.turnos, 'turno', 'turnos')}</span>` : ''}
        <span>passa do Escudo</span>${num(`${cr}.perf`, r.perf, `Porcentagem que passa do Escudo na resposta ${r.nome}`, 0, 100)}<span>%</span>
        ${q.respostas.length > 2 ? btTirar('tirar-resposta', `data-i="${j}" data-j="${k}"`, `Tirar a resposta ${r.nome}`) : ''}
      </li>`;
    }).join('');
    return `<div class="pergunta-bloco">
      <div class="frase"><b>Pergunta ${p.perguntas.length > 1 ? j + 1 : ''}</b>${txt(`${cq}.texto`, q.texto, `Texto da pergunta ${j + 1}`, 'Como o golpe bate?', 60, '')}
        ${p.perguntas.length > 1 ? btTirar('tirar-pergunta', `data-i="${j}"`, `Tirar a pergunta ${j + 1}`) : ''}</div>
      <ul class="respostas">${resp}</ul>
      <div>${q.respostas.length < 6 ? `<button type="button" class="bt bt--p" data-acao="mais-resposta" data-i="${j}">${glifo('mais')}Resposta</button>` : '<span class="nota">Até 6 respostas por pergunta.</span>'}</div>
    </div>`;
  }).join('');
  return `${blocos}
    <div class="frase">${p.perguntas.length < 3 ? `<button type="button" class="bt bt--p bt--fantasma" data-acao="mais-pergunta">${glifo('mais')}Outra pergunta</button>` : ''}</div>
    <div class="frase"><span>Quando um NPC usa:</span>${seg(`${c}.npc`, p.npc, [['mestre', 'o mestre responde'], ['primeira', 'vale a primeira resposta']], 'Quando um NPC usa')}</div>`;
}

function corpoImbuir(p, c) {
  const chips = p.elementos.map((e, k) => `<button type="button" class="elem" style="--cor-el:${e.cor}" aria-pressed="${e.ligado}" data-acao="elemento" data-i="${k}">${glifo(e.ic)}${esc(e.nome || 'Sem nome')}</button>`).join('');
  const linhas = p.elementos.map((e, k) => {
    if (!e.ligado) return '';
    const ce = `${c}.elementos.${k}`;
    return `<li class="elem-linha" style="--cor-el:${e.cor}" data-k2="${e.id}">
      <span class="medalhao medalhao--p">${glifo(e.ic)}</span>
      <div class="frase">
        <span>Se aceitar</span>${e.proprio ? txt(`${ce}.nome`, e.nome, 'Nome do elemento', 'Sangue', 20) : `<b>${esc(e.nome)}</b>`}<span>:</span>
        ${num(`${ce}.dano`, e.dano, `Dano a mais com ${e.nome}`, -100, 200)}<span>de dano, deixa</span>${sel(`${ce}.cond`, e.cond, opsCond(), `Condição de ${e.nome}`)}
        ${e.cond ? `<span>por</span>${num(`${ce}.turnos`, e.turnos, `Turnos de ${e.nome}`, 1, 20)}<span>${pl(e.turnos, 'turno', 'turnos')}</span>` : ''}
        <span>e custa</span>${num(`${ce}.sp`, e.sp, `SP de ${e.nome}`, 0, 200)}<span>SP</span>
        ${caixa(`${ce}.desv`, e.desv, 'o alvo reage com desvantagem')}
      </div>
      ${e.proprio ? btTirar('tirar-elemento', `data-i="${k}"`, `Tirar o elemento ${e.nome}`) : ''}
    </li>`;
  }).join('');
  const algum = p.elementos.some((e) => e.ligado);
  return `<div class="campo"><span class="rot-linha">Elementos que o dono pode pôr no golpe</span><div class="elementos" role="group" aria-label="Elementos">${chips}
      <button type="button" class="elem" data-acao="elemento-proprio">${glifo('mais')}Elemento próprio</button></div></div>
    ${algum ? `<ul class="itens-peca">${linhas}</ul>` : '<p class="nota">Ligue pelo menos um elemento. Sem elemento, a batalha não pergunta nada.</p>'}
    <p class="nota">Um elemento por golpe. "Não" é sempre uma das respostas; recusar não gasta SP.</p>`;
}

function corpoGatilho(p, c) {
  const efeitos = p.efeitos.map((e, k) => {
    const ce = `${c}.efeitos.${k}`;
    let corpo = '';
    if (e.tipo === 'atributo') corpo = `<span>Sobe</span>${sel(`${ce}.atr`, e.atr, STATUS, 'Atributo')}${num(`${ce}.v`, e.v, 'Quanto sobe', -200, 200)}<span>por</span>${num(`${ce}.turnos`, e.turnos, 'Por quantos turnos', 1, 20)}<span>${pl(e.turnos, 'turno', 'turnos')}</span>`;
    else if (e.tipo === 'recuperar') corpo = `<span>Recupera</span>${num(`${ce}.v`, e.v, 'Quanto recupera', 1, 500)}<span>de</span>${sel(`${ce}.rec`, e.rec, [['vida', 'Vida'], ['sp', 'SP']], 'Vida ou SP')}<span>por turno, durante</span>${num(`${ce}.turnos`, e.turnos, 'Durante quantos turnos', 1, 20)}<span>${pl(e.turnos, 'turno', 'turnos')}</span>`;
    else if (e.tipo === 'escudo') corpo = `<span>Ganha</span>${num(`${ce}.v`, e.v, 'Quanto de Escudo', 1, 500)}<span>de Escudo</span>`;
    else if (e.tipo === 'condSi') corpo = `<span>O dono fica</span>${sel(`${ce}.cond`, e.cond, opsCond(false), 'Condição no dono')}<span>por</span>${num(`${ce}.turnos`, e.turnos, 'Turnos', 1, 20)}<span>${pl(e.turnos, 'turno', 'turnos')}</span>`;
    else if (e.tipo === 'condAlvo') corpo = `<span>O alvo fica</span>${sel(`${ce}.cond`, e.cond, opsCond(false), 'Condição no alvo')}<span>por</span>${num(`${ce}.turnos`, e.turnos, 'Turnos', 1, 20)}<span>${pl(e.turnos, 'turno', 'turnos')}</span>`;
    else corpo = `<span>Avisa o mestre:</span>${txt(`${ce}.txt`, e.txt, 'Texto do aviso', 'O que o mestre precisa saber', 80, '')}`;
    return `<li class="item-peca" data-k2="${e.id}">${corpo}${p.efeitos.length > 1 ? btTirar('tirar-efeito-gatilho', `data-i="${k}"`, 'Tirar este efeito') : ''}</li>`;
  }).join('');
  const quandoExtra = p.quando === 'rodada' ? `${num(`${c}.n`, p.n, 'Qual rodada', 1, 30)}` : p.quando === 'vidaAbaixo' ? `${num(`${c}.n`, p.n, 'Porcentagem da vida', 1, 99)}<span>%</span>` : '';
  return `<div class="frase"><b>Quando</b>${sel(`${c}.quando`, p.quando, GATILHOS, 'Quando dispara')}${quandoExtra}
      ${p.quando === 'rodada' ? '' : seg(`${c}.vezes`, p.vezes, [['sempre', 'toda vez'], ['umaPorBatalha', 'uma vez por batalha']], 'Quantas vezes')}</div>
    ${p.quando === 'aoCair' ? `<div class="frase frase--sub">${caixa(`${c}.ficaCom`, p.ficaCom, 'em vez de cair, fica com')}${p.ficaCom ? `${num(`${c}.ficaComN`, p.ficaComN, 'Vida que fica', 1, 100)}<span>de vida</span>` : ''}</div>` : ''}
    <div class="frase">${caixa(`${c}.pergunta`, p.pergunta, 'Pergunta antes de disparar (Ativar ou Agora não), como as passivas da batalha hoje')}</div>
    <div class="campo"><span class="rot-linha">Faz</span><ul class="itens-peca">${efeitos}</ul></div>
    <div class="frase">${p.efeitos.length < 5 ? sel(`_mais-efeito-gatilho.${c}`, '', [['', '+ efeito'], ...EFEITOS_DO_GATILHO], 'Pôr mais um efeito') : ''}</div>`;
}

function corpoRaca(p, c) {
  return `<div class="frase">${caixa(`${c}.corta`, p.corta, 'Corta')}${p.corta ? `${num(`${c}.cortaPct`, p.cortaPct, 'Porcentagem cortada', 1, 90)}<span>% de todo dano que o dono recebe</span>` : '<span>uma parte do dano recebido</span>'}</div>
    <div class="frase">${caixa(`${c}.soma`, p.soma, 'Soma')}${p.soma ? `${num(`${c}.somaN`, p.somaN, 'Dano somado', 1, 200)}<span>no dano</span>${sel(`${c}.somaEm`, p.somaEm, [['fisico', 'dos golpes físicos (Impacto, Cortante, Perfurante)'], ['corpo', 'só dos golpes corpo a corpo']], 'Em que golpes')}` : '<span>dano nos golpes físicos</span>'}</div>
    <div class="frase">${caixa(`${c}.desvia`, p.desvia, 'Não pode desviar:')}${p.desvia ? sel(`${c}.desviaQuem`, p.desviaQuem, [['dono', 'o próprio dono (grande demais)'], ['alvo', 'quem o dono acerta']], 'Quem não pode desviar') : ''}</div>
    <p class="nota">Sem botão e sem custo: vale desde o começo da batalha, como a raça na ficha.</p>`;
}

function listaMods(c, mods, rot) {
  const linhas = mods.map((m, k) => `<li class="item-peca" data-k2="${m.id}">${sel(`${c}.${k}.atr`, m.atr, STATUS, `${rot}: atributo`)}${num(`${c}.${k}.v`, m.v, `${rot}: quanto`, -200, 200)}${btTirar('tirar-mod', `data-lista="${c}" data-i="${k}"`, `Tirar ${nomeStatus(m.atr)}`)}</li>`).join('');
  return `<ul class="itens-peca">${linhas}</ul><div><button type="button" class="bt bt--p" data-acao="mais-mod" data-lista="${c}">${glifo('mais')}Atributo</button></div>`;
}

function corpoTransformacao(p, c, h) {
  const over = h.categoria === 'overload';
  return `${over ? `<p class="frase"><span class="etiqueta etiqueta--selo">${glifo('overload')}Overload</span><span>1 por batalha. Ligar não erra e ninguém desvia: só outra Overload defende.</span></p>` : ''}
    <div class="frase"><b>Dura</b>${seg(`${c}.durar`, p.dura > 0 ? 'turnos' : 'sempre', [['turnos', 'alguns turnos'], ['sempre', 'até desligar']], 'Quanto dura')}
      ${p.dura > 0 ? `${num(`${c}.dura`, p.dura, 'Quantos turnos', 1, 20)}<span>${pl(p.dura, 'turno', 'turnos')}</span>` : ''}</div>
    ${over ? '' : `<div class="frase"><span>Pode ligar</span>${num(`${c}.usos`, p.usos, 'Usos por batalha', 1, 10)}<span>${pl(p.usos, 'vez', 'vezes')} por batalha</span></div>`}
    <div class="frase"><span>Ações a mais em cada vez:</span>${num(`${c}.acoes`, p.acoes, 'Ações a mais', 0, 3)}<span>${p.acoes > 0 ? `(ataca ${p.acoes + 1} vezes por vez)` : '(age normal)'}</span></div>
    <div class="frase"><span>Técnicas da forma (só dá para usar enquanto durar):</span>${p.libera.map((id, k) => `<span class="etiqueta etiqueta--selo">${esc(nomeHab(id))}<button type="button" class="bt bt--p bt--ic bt--fantasma" style="min-height:20px;width:20px" data-acao="tirar-libera" data-i="${k}" aria-label="Tirar ${esc(nomeHab(id))}">${glifo('x')}</button></span>`).join('')}
      ${sel(`_mais-libera.${c}`, '', [['', '+ técnica'], ...opsHabs(h.id).slice(1).filter(([id]) => !p.libera.includes(id))], 'Pôr uma técnica da forma')}</div>
    <div class="campo"><span class="rot-linha">Muda os atributos enquanto durar (os Modificadores da aba Transformações)</span>${listaMods(`${c}.mods`, p.mods, 'Muda')}</div>
    <div class="frase"><span>Dano recebido</span>${num(`${c}.danoRecebido`, p.danoRecebido, 'Dano recebido em porcentagem', -90, 200)}<span>% (negativo = leva menos);</span>
      <span>deslocamento</span>${num(`${c}.desloc`, p.desloc, 'Deslocamento a mais', -6, 6)}<span>casas, no máximo</span>${num(`${c}.deslocMax`, p.deslocMax, 'Deslocamento máximo', 0, 12)}<span>(0 = sem teto)</span></div>
    <div class="frase"><span>Grupo</span>${txt(`${c}.grupo`, p.grupo, 'Grupo da forma', 'Dragão', 24)}<span class="nota">formas do mesmo grupo trocam uma pela outra</span></div>
    ${over ? `<div class="frase">${caixa(`${c}.naoErra`, p.naoErra, 'Os golpes enquanto durar também não erram (só outra Overload defende)')}</div>` : ''}
    <div class="frase">${caixa(`${c}.marca`, p.marca, 'Cada ataque deixa uma marca no alvo; o próximo golpe na marca dá o dobro e a marca some')}</div>
    <div class="frase">${caixa(`${c}.fadiga`, p.fadiga, 'Quando acaba, vem a Fadiga')}${p.fadiga ? `<span>por</span>${num(`${c}.fadigaTurnos`, p.fadigaTurnos, 'Turnos da Fadiga', 1, 10)}<span>${pl(p.fadigaTurnos, 'turno', 'turnos')}</span>` : ''}</div>
    ${p.fadiga ? `<div class="campo frase--sub"><span class="rot-linha">A Fadiga tira</span>${listaMods(`${c}.fadigaMods`, p.fadigaMods, 'Fadiga')}</div>` : ''}`;
}

function corpoStatus(p, c) {
  const itens = p.itens.map((m, k) => {
    const cm = `${c}.itens.${k}`;
    const valor = m.modo === 'fixo' ? num(`${cm}.v`, m.v, 'Quanto', -200, 200) : `${num(`${cm}.pct`, m.pct, 'Porcentagem', -200, 200)}<span>% de</span>${sel(`${cm}.de`, m.de, ATRIBUTOS, 'De qual atributo')}`;
    return `<li class="item-peca" data-k2="${m.id}">${sel(`${cm}.atr`, m.atr, STATUS, 'Atributo')}${seg(`${cm}.modo`, m.modo, [['fixo', 'fixo'], ['formula', 'fórmula']], 'Fixo ou fórmula')}${valor}
      <span>por</span>${sel(`${cm}.dura`, m.dura, [['turnos', 'alguns turnos'], ['batalha', 'até o fim da batalha'], ['permanente', 'para sempre (grava na ficha)']], 'Quanto tempo')}
      ${m.dura === 'turnos' ? `${num(`${cm}.turnos`, m.turnos, 'Turnos', 1, 20)}<span>${pl(m.turnos, 'turno', 'turnos')}</span>` : ''}
      ${p.itens.length > 1 ? btTirar('tirar-status', `data-i="${k}"`, `Tirar ${nomeStatus(m.atr)}`) : ''}</li>`;
  }).join('');
  return `<div class="frase"><b>Em quem</b>${seg(`${c}.quem`, p.quem, [['si', 'o dono'], ['aliado', 'um aliado'], ['todos', 'todos os aliados']], 'Em quem')}</div>
    <ul class="itens-peca">${itens}</ul>
    <div><button type="button" class="bt bt--p" data-acao="mais-status">${glifo('mais')}Atributo</button></div>
    <p class="nota">Fórmula usa o valor da hora: se a Determinação subir na batalha, o bônus sobe junto. Negativo tira.</p>`;
}

function corpoDiminui(p, c) {
  const teto = `${caixa(`${c}.teto`, p.teto, 'e para em')}${p.teto ? `${num(`${c}.tetoN`, p.tetoN, 'Teto da perda', 1, 500)}<span>${p.modo === 'pct' ? '%' : ''} no total</span>` : '<span>um teto (opcional)</span>'}`;
  let ritmo = '';
  if (p.ritmo === 'umaVez') ritmo = `<div class="frase frase--sub"><span>Perde tudo no golpe e fica assim por</span>${num(`${c}.dura`, p.dura, 'Por quantos turnos', 1, 20)}<span>${pl(p.dura, 'turno', 'turnos')}.</span></div>`;
  else if (p.ritmo === 'cadaTurno') ritmo = `<div class="frase frase--sub"><span>Perde de novo no começo de cada vez do alvo, somando,</span>${teto}</div>`;
  else ritmo = `<div class="frase frase--sub"><b>Depois de</b>${num(`${c}.depoisN`, p.depoisN, 'Depois de quantos turnos', 1, 20)}<span>${pl(p.depoisN, 'turno', 'turnos')}</span>${sel(`${c}.depoisVezes`, p.depoisVezes, [['uma', 'uma vez'], ['cada', 'a cada turno']], 'Quantas vezes')}<span class="frase__seta" aria-hidden="true">→</span><span>perde ${p.v}${p.modo === 'pct' ? '%' : ''} de ${nomeStatus(p.atr)}</span>${p.depoisVezes === 'cada' ? teto : ''}</div>`;
  return `<div class="frase"><b>Ao acertar, o alvo perde</b>${num(`${c}.v`, p.v, 'Quanto perde', 1, 500)}${seg(`${c}.modo`, p.modo, [['fixo', 'pontos'], ['pct', '%']], 'Pontos ou porcentagem')}<span>de</span>${sel(`${c}.atr`, p.atr, STATUS, 'Qual atributo ou status')}</div>
    <div class="campo"><span class="rot-linha">Ritmo</span>${seg(`${c}.ritmo`, p.ritmo, [['umaVez', 'de uma vez'], ['cadaTurno', 'a cada turno'], ['depois', 'depois de X turnos']], 'Ritmo da perda')}</div>
    ${ritmo}
    <div class="frase"><b>Volta ao normal</b>${sel(`${c}.volta`, p.volta, p.ritmo === 'umaVez' ? [['turnos', 'quando acabam os turnos'], ['batalha', 'no fim da batalha'], ['curar', 'quando tirarem a condição']] : [['turnos', 'depois de alguns turnos'], ['batalha', 'no fim da batalha'], ['curar', 'quando tirarem a condição']], 'Quando volta ao normal')}
      ${p.volta === 'turnos' && p.ritmo !== 'umaVez' ? `${num(`${c}.voltaN`, p.voltaN, 'Volta depois de quantos turnos', 1, 20)}<span>${pl(p.voltaN, 'turno', 'turnos')} depois do golpe</span>` : ''}</div>
    <div class="frase"><span>No alvo aparece como a condição</span>${txt(`${c}.nome`, p.nome, 'Nome da condição no alvo', 'Lento', 24)}</div>
    <p class="nota">Mesmo jeito do gatilho das condições da 0.6.4. Golpe novo no mesmo alvo recomeça a contagem; não soma por cima.</p>`;
}

function corpoAcumulador(p, c, h) {
  const sobe = p.sobe.map((s, k) => `<li class="item-peca" data-k2="${s.id}">${sel(`${c}.sobe.${k}.como`, s.como, COMO_SOBE, 'Como sobe')}${s.como === 'tecnica' ? sel(`${c}.sobe.${k}.tecnica`, s.tecnica, opsHabs('', 'qual técnica'), 'Qual técnica') : ''}<span>soma</span>${num(`${c}.sobe.${k}.n`, s.n, 'Quanto soma', 1, 10)}${p.sobe.length > 1 ? btTirar('tirar-sobe', `data-i="${k}"`, 'Tirar este jeito de subir') : ''}</li>`).join('');
  const nivel = p.nivelDa === 'dano' ? `<span>cada nível +</span>${num(`${c}.nivelV`, p.nivelV, 'Dano por nível', 1, 100)}<span>de dano em todo golpe</span>`
    : p.nivelDa === 'atributo' ? `<span>cada nível +</span>${num(`${c}.nivelV`, p.nivelV, 'Pontos por nível', 1, 100)}<span>de</span>${sel(`${c}.nivelAtr`, p.nivelAtr, STATUS, 'Qual atributo')}` : '<span>só libera (usado por requisitos)</span>';
  return `<div class="frase"><b>O medidor</b>${txt(`${c}.nome`, p.nome, 'Nome do acumulador', 'Fúria', 24)}<span>vai até o nível</span>${num(`${c}.max`, p.max, 'Vai até o nível', 1, 10)}<span>e começa a batalha em</span>${num(`${c}.comeca`, p.comeca, 'Começa a batalha em', 0, 10)}</div>
    <div class="campo"><span class="rot-linha">Como sobe</span><ul class="itens-peca">${sobe}</ul><div><button type="button" class="bt bt--p" data-acao="mais-sobe">${glifo('mais')}Outro jeito de subir</button></div></div>
    <div class="frase"><b>Como desce</b>${sel(`${c}.desce`, p.desce, COMO_DESCE, 'Como desce')}</div>
    <div class="frase"><b>Cada nível dá</b>${seg(`${c}.nivelDa`, p.nivelDa, [['dano', 'Dano'], ['atributo', 'Atributo'], ['nada', 'Nada']], 'Cada nível dá')}${nivel}</div>
    <div class="frase"><b>Ao chegar a</b>${num(`${c}.chegaN`, p.chegaN, 'Ao chegar a quanto', 1, 10)}<span class="frase__seta" aria-hidden="true">→</span>
      ${sel(`${c}.chegaFaz`, p.chegaFaz, [['nada', 'nada a mais'], ['libera', 'libera a técnica'], ['aviso', 'avisa o mestre']], 'O que faz ao chegar')}${p.chegaFaz === 'libera' ? sel(`${c}.chegaHab`, p.chegaHab, opsHabs(h.id, 'escolha a técnica'), 'Técnica liberada') : ''}</div>
    <p class="nota">É o mesmo acumulador da janela "Acumuladores" da ficha: nasce aqui e aparece na faixa da aba Habilidades do dono. Qualquer técnica pode pedir um nível dele em Requisitos.</p>`;
}

function corpoMarca(p, c) {
  return `<div class="frase"><b>Marca</b>${sel(`${c}.quando`, p.quando, [['aoAcertar', 'sempre que acertar'], ['pergunta', 'ao acertar, pergunta "Marcar?"'], ['tiro', 'só em golpe à distância']], 'Quando marca')}<span>com o nome</span>${txt(`${c}.nome`, p.nome, 'Nome da marca', 'Marcado', 20)}</div>
    ${p.quando === 'pergunta' ? `<div class="frase frase--sub"><span>Para marcar, paga</span>${num(`${c}.paga`, p.paga, 'SP para marcar', 0, 200)}<span>SP e passa num teste de</span>${sel(`${c}.teste`, p.teste, [['', 'sem teste'], ...ATRIBUTOS], 'Teste para marcar')}</div>` : ''}

  const cat = categoria(h.categoria);
  const outra = h.outraAcao ? (h.outraAcao === 'perguntar' ? ' Pergunta na hora que ação gasta.' : ` Gasta a ação ${(OUTRA_ACAO.find(([k]) => k === h.outraAcao) || ['', ''])[1]}.`) : '';
  f.push({ cor: 'var(--papel-tenue)', linha: 'acao', html: `<b>${cat.nome}</b>: ${cat.faz.replace(' Agora com peças.', '')}${h.categoria === 'reacao' ? (h.reacaoVale === 'reacao' ? ' Só no lugar da reação.' : ' Na vez ou na reação.') : ''}${outra}` });
  if (ehAtaque(h)) {
    const g = h.golpe;
    const bate = g.bate ? `bate como <b>${nomeBate(g.bate)}</b>${g.quando === 'teste' ? ` (pega se o alvo falhar em ${nomeAtr(g.testeAtr)} contra CD ${g.testeCd})` : g.quando === 'soTipo' ? ' (só o tipo, sem efeito)' : ''}${g.bate === 'impacto' && g.empurra ? `, empurra ${g.empurra} ${pl(g.empurra, 'casa', 'casas')}` : ''}` : 'sem tipo de golpe';
    const causa = g.causa.length ? `; causa ${juntar(g.causa.map((k) => (TIPOS_QUE_CAUSAM.find(([id]) => id === k) || ['', k])[1]))}` : '';
    const dano = fraseDoDano(h);
    const teste = { reage: 'o alvo reage normal', naoErra: 'não erra', cd: `o alvo testa ${nomeAtr(h.acerto.atr)} contra CD ${h.acerto.cd}`, disputa: 'disputa d20 contra d20' }[h.categoria === 'overload' ? 'naoErra' : h.acerto.teste];
    f.push({ cor: 'var(--papel-dano)', linha: 'golpe', html: `Golpe ${alcanceDe(h.alcance)}${dano ? ` de ${dano}` : ', sem dano'}, ${bate}${causa}; ${teste}.` });
  } else if (h.categoria === 'reacao') {
    const d = h.defesa;
    const como = { anula: 'anula o golpe', pct: `toma só ${d.pct}% do dano`, d20: `rola d20 e anula com ${d.anulaCom} ou mais`, inteiro: 'toma o golpe inteiro' }[d.como];
    const dev = d.devolve !== 'nada' ? `; devolve ${{ metade: 'metade', terco: 'um terço', tudo: 'tudo' }[d.devolve]} em quem atacou` : '';
    f.push({ cor: 'var(--papel-dano)', linha: 'acerto', html: `Defesa: ${como}${dev}${d.curaPct ? `; ${d.curaPct}% do que chegava vira vida` : ''}${d.overload ? '; vale contra Overload' : ''}${d.surpresa ? '; vale contra Surpresa' : ''}.` });
  } else if (h.categoria === 'apoio') {
    f.push({ cor: 'var(--papel-cura)', linha: 'alcance', html: `Apoio ${alcanceDe(h.alcance)}: ninguém reage.` });
  }
  if (h.efeitos.length) f.push({ cor: 'var(--papel-selo)', linha: 'efeitos', html: `${maiuscula(juntar(h.efeitos.map(fraseDoEfeito)))}.` });
  h.pecas.forEach((p) => f.push({ cor: PECAS[p.tipo].cor, peca: p.id, html: frasePeca(p, h) }));
  const c = h.custo;
  const valor = c.conta === 'formula' ? esc(c.formula || 'fórmula') : `${c.v}${c.conta === 'pctMax' ? '% do máximo' : c.conta === 'pctAtual' ? '% do atual' : ''}`;
  const custo = c.gasta === 'nada' ? 'Não gasta nada' : `Custa <span class="tinta-gasto">${valor} de ${c.gasta === 'sp' ? 'SP' : 'HP'}</span>`;
  const limite = h.categoria === 'overload' ? '; 1 vez por batalha' : c.limite === 'recarga' ? `; espera ${c.n} ${pl(c.n, 'rodada', 'rodadas')} para usar de novo` : c.limite === 'usos' ? `; até ${c.n} ${pl(c.n, 'uso', 'usos')} por batalha` : '';
  const mant = c.mantida ? `; técnica mantida: cobra <span class="tinta-gasto">${c.mantidaV} de ${c.mantidaRec === 'sp' ? 'SP' : 'HP'}</span> a cada vez` : '';
  const depois = c.depois ? `; depois de usar perde <span class="tinta-dano">${c.depoisV} de HP</span>` : '';
  const item = c.item ? `; gasta ${c.itemN} ${esc(c.itemNome)} da mochila` : '';
  if (!(h.categoria === 'passiva' && c.gasta === 'nada')) f.push({ cor: 'var(--papel-gasto)', linha: 'custo', html: `${custo}${limite}${mant}${depois}${item}.` });
  const req = [];
  if (h.requisitos.todos.length) req.push(juntar(h.requisitos.todos.map(fraseReq)));
  if (h.requisitos.umDestes.length) req.push(`um destes: ${juntar(h.requisitos.umDestes.map(fraseReq), 'ou')}`);
  if (req.length) f.push({ cor: 'var(--papel-tenue)', linha: 'requisitos', html: `Só usa se: ${req.join('; e ')}.` });
  if (h.opcoes.length) f.push({ cor: 'var(--papel-tenue)', linha: 'campos', html: `Na hora, escolhe uma opção: ${juntar(h.opcoes.map((o) => `<b>${esc(o.nome || 'sem nome')}</b>${o.faz ? ` (${esc(o.faz)})` : ''}`), 'ou')}.` });
  if (h.evolucao.modo !== 'nao' && h.evolucao.para) f.push({ cor: 'var(--papel-tenue)', linha: 'evolucao', html: h.evolucao.modo === 'vira' ? `Cumpridos os requisitos, vira <b>${esc(nomeHab(h.evolucao.para))}</b> até usar uma vez; depois volta.` : `Evolui para <b>${esc(nomeHab(h.evolucao.para))}</b> ${h.evolucao.quando === 'usos' ? `depois de ${h.evolucao.n} usos` : h.evolucao.quando === 'requisitos' ? 'quando cumprir os requisitos' : 'quando o mestre mandar'}.` });
  if (h.jogadores.esconder) f.push({ cor: 'var(--papel-tenue)', linha: 'jogadores', html: `Escondida dos jogadores${h.jogadores.revelar ? '; revela sozinha quando o mestre usar' : ''}.` });
  return f;
}
function fraseReq(r) {
  const nao = r.nao ? 'não ' : '';
  const gasta = r.gasta && REQ_QUE_GASTA.includes(r.tipo) ? ' (e gasta)' : '';
  switch (r.tipo) {
    case 'sp': return `${nao}ter ${r.n} de SP${gasta}`;
    case 'vidaUsa': return `${nao}ter a vida ${r.comp === 'abaixo' ? 'abaixo' : 'acima'} de ${r.pct}%`;
    case 'vidaAlvo': return `${nao}ter o alvo com a vida ${r.comp === 'abaixo' ? 'abaixo' : 'acima'} de ${r.pct}%`;
    case 'acumulador': return `${nao}ter ${r.n} de <b>${esc(r.nome)}</b>${gasta}`;
    case 'ligada': return `${nao}estar com <b>${esc(nomeHab(r.hab))}</b> ligada`;
    case 'forma': return `${nao}estar na forma <b>${esc(nomeHab(r.hab))}</b>`;
    case 'tecnica': return `ser ligada pela técnica <b>${esc(nomeHab(r.hab))}</b> (não aparece sozinha)`;
    case 'parte': return `ser a parte ${r.n} de <b>${esc(nomeHab(r.forma))}</b> (a ${r.n - 1}ª antes)`;
    case 'rodada': return `${r.comp === 'aPartir' ? 'a partir da' : 'até a'} rodada ${r.n}`;
    case 'seloSi': return `${nao}estar ${cond(r.cond).nome}`;
    case 'seloAlvo': return `${nao}ter o alvo ${cond(r.cond).nome}`;
    case 'teste': return `passar num teste de ${nomeAtr(r.atr)} CD ${r.cd}`;
    case 'personalizado': return `${esc(r.txt || 'personalizado')} (o mestre confirma)`;
    default: return `${nao}${nomeReq(r.tipo).toLowerCase()}${gasta}`;
  }
}

/** O que o jogador vê aparecer na batalha por causa desta técnica. */
function naBatalha(h) {
  const l = [];
  h.pecas.forEach((p) => {
    if (p.tipo === 'pergunta') p.perguntas.forEach((q) => l.push(`Antes do golpe: "${esc(q.texto)}" com ${juntar(q.respostas.map((r) => esc(r.nome)), 'ou')}.`));
    if (p.tipo === 'imbuir' && p.elementos.some((e) => e.ligado)) l.push(`Em todo golpe do dono, enquanto ligada: "Imbuir?" ${juntar([...p.elementos.filter((e) => e.ligado).map((e) => esc(e.nome)), 'Não'], 'ou')}.`);
    if (p.tipo === 'gatilho' && p.efeitos.some((e) => e.tipo === 'aviso')) l.push('O mestre recebe um aviso quando a passiva dispara.');
    if (p.tipo === 'transformacao') l.push(`Na ficha do dono aparece "${esc(h.nome)}" com os turnos que faltam${p.fadiga ? '; no fim, a Fadiga' : ''}.`);
    if (p.tipo === 'acumulador') l.push(`Na ficha do dono, o medidor "${esc(p.nome)}" de 0 a ${p.max}.`);
    if (p.tipo === 'diminui') l.push(`No alvo, a pílula "${esc(p.nome || 'Lento')}" mostra quanto de ${nomeAtr(p.atr)} ele perdeu.`);
    if (p.tipo === 'marca' && p.quando === 'pergunta') l.push('Ao acertar: "Marcar?" Sim ou Não.');
    if (p.tipo === 'devolve' && p.escolha) l.push('Na reação: "Defender ou devolver?"');
  });
  if (h.opcoes.length) l.push(`Ao usar: escolher entre ${juntar(h.opcoes.map((o) => esc(o.nome)), 'ou')}.`);
  return l;
}

function avisosDe(h) {
  const a = [];
  if (!h.nome.trim()) a.push('Sem nome: a habilidade não aparece na lista.');
  (h.confira || []).forEach((t) => a.push(`Confira: "${t}" veio do texto antigo e não virou peça; ficou na descrição.`));
  h.pecas.forEach((p) => {
    if (p.tipo === 'pergunta' && p.perguntas.some((q) => q.respostas.some((r) => !r.nome.trim()))) a.push('Uma resposta está sem nome.');
    if (p.tipo === 'imbuir' && !p.elementos.some((e) => e.ligado)) a.push('Imbuir sem elemento ligado.');
    if (p.tipo === 'transformacao' && p.libera.some((id) => !todasAsHabs().some((x) => x.id === id))) a.push('Uma técnica da forma não existe mais.');
    if (p.tipo === 'acumulador' && p.chegaN > p.max) a.push(`"Ao chegar a ${p.chegaN}" passa do máximo (${p.max}): nunca acontece.`);
    if (p.tipo === 'acumulador' && p.chegaFaz === 'libera' && !p.chegaHab) a.push('O acumulador libera uma técnica, mas nenhuma foi escolhida.');
    if (p.tipo === 'raca' && !p.corta && !p.soma && !p.desvia) a.push('Passiva de raça sem nada ligado.');
  });
  if (temPeca(h, 'transformacao') && !['overload', 'mantida'].includes(h.categoria)) a.push('Transformação pede a ação Overload ou Ligar e manter.');
  if (temPeca(h, 'devolve') && h.categoria !== 'reacao') a.push('"Devolve o golpe" só vale com a ação Reação.');
  [...h.requisitos.todos, ...h.requisitos.umDestes].forEach((r) => {
    if (r.tipo === 'acumulador' && !acumuladoresDoCatalogo().includes(r.nome)) a.push(`Nenhuma técnica cria o acumulador "${r.nome}".`);
    if (['forma', 'tecnica', 'ligada'].includes(r.tipo) && r.hab === h.id) a.push('A técnica não pode pedir ela mesma.');
  });
  return a;
}

/** Tipo na batalha (o rótulo só de leitura do editor de hoje), tirado das peças. */
function tipoNaBatalha(h) {
  if (h.categoria === 'reacao') return 'Reação';
  if (h.categoria === 'passiva') return 'Passiva';
  if (h.categoria === 'apoio') return 'Buff';
  if (h.categoria === 'mantida') return temPeca(h, 'transformacao') ? 'Transformação' : 'Ligada';
  if (temPeca(h, 'invocacao')) return 'Invocação';
  return 'Ativa';
}

function renderPapel(h) {
  const cat = categoria(h.categoria);
  const linhas = frasesDe(h);
  const corpo = linhas.map((l) => {
    const destino = l.peca ? `peca-${l.peca}` : l.linha ? `sec-${l.linha}` : '';
    return destino ? `<li><button type="button" class="acontece__linha" style="--cor-peca:${l.cor}" data-acao="ir" data-v="${destino}"><span>${l.html}</span></button></li>` : `<li class="acontece__linha" style="--cor-peca:${l.cor}"><span>${l.html}</span></li>`;
  }).join('');
  const nb = naBatalha(h);
  const av = avisosDe(h);
  const c = h.custo;
  const numeros = [['Ação', cat.nome], ['Na batalha', tipoNaBatalha(h)], ['Custo', c.gasta === 'nada' ? 'nada' : `${c.conta === 'formula' ? 'fórmula' : c.v} ${c.gasta === 'sp' ? 'SP' : 'HP'}`], ['Peças', String(h.pecas.length)]];
  if (ehAtaque(h) && h.dano.da) numeros.splice(2, 0, ['Dano', h.dano.conta === 'vida' ? `${h.dano.vidaPct}%` : `${danoBase(h.dano, DONO_BASE.atr)}`]);
  return `<article class="papel" aria-labelledby="papel-nome">
    <div class="papel__topo"><span class="papel__foto">${glifo(h.icone)}</span><div><h2 class="papel__nome" id="papel-nome">${esc(h.nome || 'Sem nome')}</h2><p class="papel__tipo">${esc(cat.nome)}${h.marcas.length ? ` · ${esc(h.marcas.join(', '))}` : ''}</p></div></div>
    <p class="papel__rot">O que acontece (escrito pelas peças)</p>
    <ul class="acontece">${corpo}</ul>
    ${h.texto ? `<p class="papel__rot">Descrição para ambientar</p><p class="papel__desc">${esc(h.texto)}</p>` : ''}
    ${nb.length ? `<ul class="na-batalha" aria-label="O que aparece na batalha">${nb.map((t) => `<li>${glifo('olho')}<span>${t}</span></li>`).join('')}</ul>` : ''}
    ${av.length ? `<ul class="avisos-papel" aria-label="Avisos">${av.map((t) => `<li>${glifo('aviso')}<span>${esc(t)}</span></li>`).join('')}</ul>` : ''}
    <dl class="papel__numeros">${numeros.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
  </article>`;
}

/* =============================================================== estado */
let E;
const UI = { aba: 'catalogo', busca: '', filtro: 'todas', entrou: null, brilho: null, nova: null, desfazer: [], teste: null, novaLinha: null, fichaAba: 'habilidades', trazer: false, trazerDe: 'kaito' };
function comecar() {
  const habs = catalogoDeExemplo();
  // destino: onde o Salvar grava. O editor é o mesmo para o catálogo do livro e para a ficha.
  E = { habs, fichas: fichasDeExemplo(habs), rascunho: null, salvo: '', destino: 'catalogo', tambem: false };
  abrirNoEditor('h-cacada', false);
  UI.aba = 'catalogo'; UI.busca = ''; UI.filtro = 'todas'; UI.nova = null; UI.desfazer = []; UI.teste = null; UI.fichaAba = 'habilidades'; UI.trazer = false;
}
const habsDe = (destino) => (destino === 'ficha' ? E.fichas.ryoko.habs : E.habs);
function abrirNoEditor(id, ir = true, destino = 'catalogo') {
  const h = habsDe(destino).find((x) => x.id === id);
  E.rascunho = clone(h);
  E.salvo = JSON.stringify(h);
  E.destino = destino; E.tambem = false;

}
const sujo = () => JSON.stringify(E.rascunho) !== E.salvo;

/* =============================================================== tela: Habilidades (o catálogo) */
const textoSimples = (html) => html.replace(/<[^>]+>/g, '');
function telaCatalogo() {
  const q = UI.busca.trim().toLowerCase();
  const daBusca = E.habs.filter((h) => !q || h.nome.toLowerCase().includes(q) || textoSimples(frasesDe(h).map((f) => f.html).join(' ')).toLowerCase().includes(q));
  const filtros = [['todas', 'Todas'], ...CATEGORIAS.map((c) => [c.id, c.nome])].map(([id, nome]) => {
    const n = id === 'todas' ? daBusca.length : daBusca.filter((h) => h.categoria === id).length;
    return `<button type="button" class="filtro" aria-pressed="${UI.filtro === id}" data-acao="filtro" data-v="${id}">${esc(nome)} <b>${n}</b></button>`;
  }).join('');
  const lista = daBusca.filter((h) => UI.filtro === 'todas' || h.categoria === UI.filtro);
  const linhas = lista.map((h) => {
    const fr = frasesDe(h);
    const resumo = textoSimples((fr.find((f) => f.peca) || fr[1] || fr[0] || { html: '' }).html);
    const chips = h.pecas.map((p) => `<span class="chip-peca" style="--cor-peca:${PECAS[p.tipo].cor}">${glifo(PECAS[p.tipo].ic)}${esc(PECAS[p.tipo].nome)}</span>`).join('');
    return `<li class="linha"${UI.novaLinha === h.id ? ' data-nova' : ''}>
      <button type="button" class="linha__abrir" data-acao="abrir" data-v="${h.id}" aria-label="Abrir ${esc(h.nome)} no editor">
        <span class="medalhao">${glifo(h.icone)}</span>
        <span class="linha__nome"><strong>${esc(h.nome)}</strong><span class="etiqueta${h.categoria === 'overload' ? ' etiqueta--selo' : ''}">${esc(categoria(h.categoria).nome)}</span>${h.convertida ? '<span class="etiqueta etiqueta--latao">Convertida: confira</span>' : ''}</span>
        <span class="linha__resumo"><p>${esc(resumo)}</p>${chips ? `<span class="linha__pecas">${chips}</span>` : ''}</span>
      </button>
      <span class="linha__acoes"><button type="button" class="bt bt--p" data-acao="abrir" data-v="${h.id}">${glifo('lapis')}Editar</button><button type="button" class="bt bt--p bt--agua" data-acao="testar-de" data-v="${h.id}">${glifo('boneco')}Testar</button></span>
    </li>`;
  }).join('');
  const vazio = `<div class="vazio"><p>${q ? `Nenhuma habilidade com "${esc(UI.busca)}".` : 'Nenhuma habilidade nesta categoria.'}</p><button type="button" class="bt bt--p" data-acao="limpar-busca">Limpar a busca e o filtro</button></div>`;
  return `<div class="pg-cab"><div class="pg-cab__txt"><h1 class="pg-titulo">Habilidades</h1><p class="pg-sub">Técnicas, passivas, raças e formas do livro. Arma e item continuam nascendo no editor do item, na página Itens.</p></div>
      <div class="pg-acoes"><button type="button" class="bt bt--primario" data-acao="nova">${glifo('mais')}Nova habilidade</button></div></div>
    <div class="barra"><label class="busca"><span class="sr">Buscar habilidade</span>${glifo('busca')}<input class="entrada" type="search" id="busca" data-acao-input="busca" value="${esc(UI.busca)}" placeholder="Buscar por nome ou pelo que faz" autocomplete="off"><kbd>/</kbd></label></div>
    <div class="filtros" role="group" aria-label="Filtrar por ação">${filtros}</div>
    ${lista.length ? `<ul class="lista">${linhas}</ul>` : vazio}`;
}

/* =============================================================== tela: o editor (uma tela só: tudo existe uma vez) */
function secao(id, tit, sub, corpo) {
  return `<section class="secao" id="sec-${id}" aria-labelledby="st-${id}"><div class="secao__cab"><h2 class="secao__tit" id="st-${id}">${tit}</h2>${sub ? `<p class="secao__sub">${sub}</p>` : ''}</div>${corpo}</section>`;
}
const ICONES = ['estrela', 'punho', 'espada', 'fogo', 'gelo', 'raio', 'veneno', 'luz', 'trevas', 'vento', 'forma', 'raca', 'overload', 'cura', 'escudo', 'alvo', 'marca', 'invocacao'];
const MODELOS_NOVOS = ['h-chifre', 'h-imbuir', 'h-folego', 'h-ogro', 'h-cacada', 'h-foco', 'h-hibrida', 'h-furia', 'h-corte', 'h-armadura'];

function blocoComecar(h) {
  if (UI.nova !== h.id) return '';
  const novos = MODELOS_NOVOS.map((id) => {
    const m = E.habs.find((x) => x.id === id);
    if (!m) return '';
    const p = m.pecas[0];
    const d = p ? PECAS[p.tipo] : { cor: 'var(--lb-creme-tenue)', ic: m.icone, nome: categoria(m.categoria).nome };
    return `<button type="button" class="modelo" role="radio" aria-checked="${UI.modelo === id}" style="--cor-peca:${d.cor}" data-acao="modelo" data-v="${id}"><span class="medalhao medalhao--p">${glifo(d.ic)}</span><b>${esc(m.nome)}</b><small>${esc(d.nome)}</small></button>`;
  }).join('');
  const hoje = MODELOS_DE_HOJE.map(([g, l]) => `<optgroup label="${esc(g)}">${l.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join('')}</optgroup>`).join('');
  return secao('comecar', 'Começar de', 'Só aparece enquanto a habilidade é nova. Escolher troca as peças; o nome que você já escreveu fica.', `
    <div class="modelos" role="radiogroup" aria-label="Modelos com as mecânicas novas">
      <button type="button" class="modelo" role="radio" aria-checked="${!UI.modelo}" data-acao="modelo" data-v=""><span class="medalhao medalhao--p">${glifo('mais')}</span><b>Em branco</b><small>Só a ação e o golpe</small></button>${novos}</div>
    <div class="frase" style="margin-top:12px"><span>Ou um dos 22 modelos de hoje:</span><select class="entrada" data-acao-change="modelo-hoje" aria-label="Modelos de hoje"><option value="">escolha</option>${hoje}</select></div>`);
}

function blocoTopo(h) {
  const confira = h.convertida ? `<div class="faixa-confira" role="note">${glifo('aviso')}<div><b>Convertida do texto antigo na leitura.</b> As linhas e peças abaixo vieram do texto; o que não deu para ler ficou na descrição: ${h.confira.map((t) => `"${esc(t)}"`).join(', ')}. Confira e marque como conferida.</div><button type="button" class="bt bt--p bt--latao" data-acao="conferido">Conferida</button></div>` : '';
