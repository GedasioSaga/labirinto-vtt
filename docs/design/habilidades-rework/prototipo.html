function gradeDoAlcance(a) {
  const N = 9, m = 4;
  const r = Math.min(a.casas, 4);
  const pinta = (x, y) => {
    const dx = x - m, dy = y - m, d = Math.max(Math.abs(dx), Math.abs(dy));
    if (dx === 0 && dy === 0) return 'voce';
    switch (a.forma) {
      case 'linha': return dx === 0 && dy < 0 && -dy <= r ? 'area' : '';
      case 'volta': return d <= r ? 'area' : '';
      case 'quadrado': return dy < 0 && -dy <= r && Math.abs(dx) <= Math.floor(r / 2) ? 'area' : '';
      case 'cruz': return (dx === 0 || dy === 0) && d <= r ? 'area' : '';
      case 'leque': return dy < 0 && -dy <= r && Math.abs(dx) <= -dy ? 'area' : '';
      case 'anel': return d === r ? 'area' : d < r ? '' : '';
      case 'ponto': return Math.max(Math.abs(dx), Math.abs(dy + r)) <= 1 ? 'area' : d <= r ? 'alc' : '';
      case 'ficha': return Math.max(Math.abs(dx - 1), Math.abs(dy + r)) <= 1 ? 'area' : d <= r ? 'alc' : '';
      default: return d <= r ? (dx === 0 && dy === -r ? 'area' : 'alc') : '';
    }
  };
  const cel = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const t = a.pega === 'usa' ? (x === m && y === m ? 'voce' : '') : pinta(x, y);
    const cor = t === 'voce' ? 'var(--lb-agua)' : t === 'area' ? 'var(--lb-latao)' : t === 'alc' ? 'rgba(224,168,75,.3)' : 'rgba(239,230,212,.05)';
    cel.push(`<rect x="${x * 11}" y="${y * 11}" width="10" height="10" rx="${t === 'voce' ? 5 : 1.5}" fill="${cor}"/>`);
  }
  return `<svg viewBox="0 0 98 98" width="118" height="118" role="img" aria-label="Desenho do alcance: ${esc(alcanceDe(a))}">${cel.join('')}</svg>`;
}

function linhaReq(r, c, k, grupo) {
  let p = '';
  if (r.tipo === 'sp' || r.tipo === 'pagaVida' || r.tipo === 'concentracao') p = num(`${c}.n`, r.n, 'Quanto', 1, 999);
  else if (r.tipo === 'vidaUsa' || r.tipo === 'vidaAlvo') p = `${sel(`${c}.comp`, r.comp, [['abaixo', 'abaixo de'], ['acima', 'acima de']], 'Abaixo ou acima')}${num(`${c}.pct`, r.pct, 'Porcentagem', 1, 99)}<span>%</span>`;
  else if (r.tipo === 'acumulador') p = `${sel(`${c}.nome`, r.nome, acumuladoresDoCatalogo().map((n) => [n, n]), 'Qual acumulador')}<span>no nível</span>${num(`${c}.n`, r.n, 'Nível', 1, 10)}`;
  else if (r.tipo === 'ligada' || r.tipo === 'tecnica') p = sel(`${c}.hab`, r.hab, opsHabs(E.rascunho.id).slice(1), 'Qual técnica');
  else if (r.tipo === 'forma') p = sel(`${c}.hab`, r.hab, opsFormas(E.rascunho.id), 'Qual forma');
  else if (r.tipo === 'parte') p = `<span>parte</span>${num(`${c}.n`, r.n, 'Qual parte', 2, 6)}<span>de</span>${sel(`${c}.forma`, r.forma, opsFormas(E.rascunho.id), 'De qual forma')}<span class="nota">a parte anterior precisa vir antes</span>`;
  else if (r.tipo === 'rodada') p = `${sel(`${c}.comp`, r.comp, [['aPartir', 'a partir da'], ['ate', 'até a']], 'A partir ou até')}${num(`${c}.n`, r.n, 'Rodada', 1, 30)}`;
  else if (r.tipo === 'seloSi' || r.tipo === 'seloAlvo') p = sel(`${c}.cond`, r.cond, opsCond(false), 'Qual condição');
  else if (r.tipo === 'teste') p = `${sel(`${c}.atr`, r.atr, ATRIBUTOS, 'Atributo')}<span>CD</span>${num(`${c}.cd`, r.cd, 'CD', 1, 40)}`;
  else if (r.tipo === 'personalizado') p = txt(`${c}.txt`, r.txt, 'O que precisa', 'Estar na água', 60);
  const novo = (REQUISITOS.find(([id]) => id === r.tipo) || [])[2];
  return `<li class="item-peca"><b>${esc(nomeReq(r.tipo))}</b>${novo ? '<span class="etiqueta etiqueta--latao">novo</span>' : ''}${p}
    ${['tecnica', 'parte', 'personalizado', 'mestre', 'teste', 'disputa'].includes(r.tipo) ? '' : caixa(`${c}.nao`, r.nao, 'não ter')}${REQ_QUE_GASTA.includes(r.tipo) ? caixa(`${c}.gasta`, r.gasta, 'e gasta') : ''}
    ${btTirar('tirar-req', `data-g="${grupo}" data-i="${k}"`, `Tirar ${nomeReq(r.tipo)}`)}</li>`;
}
function blocoRequisitos(h) {

const ABAS_DA_FICHA = [['habilidades', 'Habilidades'], ['pericias', 'Perícias', 7], ['vantagens', 'Vantagens', 3], ['desvantagens', 'Desvantagens', 2], ['transformacoes', 'Transformações'], ['mochila', 'Mochila e equipamento']];
const ehTransformacao = (h) => temPeca(h, 'transformacao');
function custoCurto(h) {

function faixaDosAcumuladores(ficha) {

const SO_TEXTO = {
  pericias: 'Perícias ficam como estão: descrição e o atributo que usam. A batalha não lê regra delas, então não viram peças.',

        <button type="button" class="bt" data-acao="trazer" aria-expanded="${UI.trazer}" aria-controls="trazer">${glifo('copia')}Trazer de outra ficha</button></div>
      ${painelTrazer()}
      ${lista.length ? `<ul class="lista">${lista.map(cartaoDaFicha).join('')}</ul>` : `<div class="vazio"><p>${trans ? 'Nenhuma transformação nesta ficha.' : 'Nenhuma habilidade nesta ficha.'}</p></div>`}`;
  } else {
    corpo = `<div class="vazio" style="margin-top:14px"><p>${esc(SO_TEXTO[UI.fichaAba])}</p><button type="button" class="bt bt--p" data-acao="aba" data-v="comoera">Ver em Como era x como fica</button></div>`;
  }
  return `<div class="pg-cab"><div class="pg-cab__txt"><h1 class="pg-titulo">Ficha da ${esc(ficha.nome)}</h1><p class="pg-sub">A aba Habilidades da ficha só lista. "+ Habilidade", tocar numa habilidade e "Trazer de outra ficha" abrem o mesmo editor da página Habilidades.</p></div></div>
    <div class="filtros" role="group" aria-label="Abas da ficha">${abas}</div>${corpo}`;
}

/* =============================================================== Testar no boneco: 2 a 5 rodadas, sem sorte (todo golpe acerta, o d20 da defesa rola 10) */
const GOLPE_COMUM = { nome: 'Golpe comum', golpe: { bate: 'impacto', quando: 'sempre', causa: [] }, dano: { da: true, conta: 'formula', base: 30, atr: 'forca', parte: 'metade', mults: [] }, alcance: { forma: 'alvo', casas: 1 } };
const POR_VEZ = { sangrando: 10, queimando: 10, envenenado: 10 };
function testeNovo() { return { rodadas: 3, bate: 60, vidaPct: 100, reqOk: true, feitas: [], agora: escolhaPadrao(E.rascunho) }; }
function escolhaPadrao(h) {
  const e = { resp: {}, imbuir: '', ligar: true, marcar: true, devolver: 'defender', opcao: 0 };
  h.pecas.forEach((p) => {
    if (p.tipo === 'pergunta') p.perguntas.forEach((q) => { e.resp[q.id] = 0; });
    if (p.tipo === 'imbuir') e.imbuir = (p.elementos.find((x) => x.ligado) || { id: '' }).id;
  });
  return e;
}
const pecaDe = (h, tipo) => h.pecas.find((p) => p.tipo === tipo);
const pecasDe = (h, tipo) => h.pecas.filter((p) => p.tipo === tipo);

function valorDaQueda(q, r) {
  const p = q.p;
  if (r < q.inicio) return 0;
  const base = BONECO_BASE.atr[p.atr] || 0;
  const unid = p.modo === 'pct' ? Math.floor(base * p.v / 100) : p.v;
  const teto = p.teto ? (p.modo === 'pct' ? Math.floor(base * p.tetoN / 100) : p.tetoN) : Infinity;
  const k = r - q.inicio + 1;
  const desdeUltimo = r - q.ultimo + 1;
  if (p.ritmo === 'umaVez') return p.volta === 'turnos' && desdeUltimo > p.dura ? 0 : unid;
  if (p.volta === 'turnos' && desdeUltimo > p.voltaN) return 0;
  if (p.ritmo === 'cadaTurno') return Math.min(unid * k, teto);
  if (k <= p.depoisN) return 0;
  return p.depoisVezes === 'uma' ? unid : Math.min(unid * (k - p.depoisN), teto);
}

function simular(h, T) {
  const vidaMax = DONO_BASE.vida;
  const D = { vida: Math.max(1, Math.round(vidaMax * T.vidaPct / 100)), sp: DONO_BASE.sp, escudo: 0, mods: [], conds: [], recs: [], trans: null, transUsada: false, imbuirLigado: false, acum: {}, usado: {}, liberou: {}, overloadUsado: false };
  const B = { vida: BONECO_BASE.vida, escudo: BONECO_BASE.escudo, conds: [], quedas: [], marca: 0 };
  const acums = pecasDe(h, 'acumulador');
  acums.forEach((a) => { D.acum[a.nome] = a.comeca; });
  const atr = (k) => (DONO_BASE.atr[k] || 0) + D.mods.filter((m) => m.atr === k).reduce((s, m) => s + m.v, 0) + D.conds.reduce((s, c) => s + ((c.mods || []).filter((m) => m.atr === k).reduce((a, m) => a + m.v, 0)), 0)
    + acums.filter((a) => a.nivelDa === 'atributo' && a.nivelAtr === k).reduce((s, a) => s + a.nivelV * (D.acum[a.nome] || 0), 0);
  const diminui = pecaDe(h, 'diminui');
  const acompanha = diminui ? diminui.atr : 'vida';
  const valorBoneco = (r) => (acompanha === 'vida' ? B.vida : (BONECO_BASE.atr[acompanha] || 0) - B.quedas.reduce((s, q) => s + valorDaQueda(q, r), 0));
  const serie = [{ rot: 'Início', v: acompanha === 'vida' ? B.vida : BONECO_BASE.atr[acompanha] }];
  const rodadas = [];
  const raca = pecaDe(h, 'raca');
  const trans = pecaDe(h, 'transformacao');
  const imb = pecaDe(h, 'imbuir');
  const reqs = [...h.requisitos.todos, ...h.requisitos.umDestes];
  const podeUsar = !reqs.length || T.reqOk;
  const L = [];
  const log = (t, txt) => L.push([t, txt]);
  const subirAcum = (como, n = 1) => acums.forEach((a) => a.sobe.filter((s) => s.como === como).forEach((s) => {
    const antes = D.acum[a.nome];
    D.acum[a.nome] = Math.min(a.max, antes + s.n * n);
    if (D.acum[a.nome] !== antes) log('acum', `<b>${esc(a.nome)}</b> ${antes} → ${D.acum[a.nome]}.`);
    if (D.acum[a.nome] >= a.chegaN && antes < a.chegaN && a.chegaFaz !== 'nada') log('aviso', a.chegaFaz === 'libera' ? `${esc(a.nome)} chegou a ${a.chegaN}: libera <b>${esc(nomeHab(a.chegaHab))}</b>.` : `${esc(a.nome)} chegou a ${a.chegaN}: aviso ao mestre.`);
  }));
  const aplicarEfeitoGatilho = (e, p) => {
    if (e.tipo === 'atributo') { D.mods.push({ atr: e.atr, v: e.v, restam: e.turnos, de: 'passiva' }); log('cura', `${nomeAtr(e.atr)} <b>${sinal(e.v)}</b> por ${e.turnos} ${pl(e.turnos, 'turno', 'turnos')}.`); }
    else if (e.tipo === 'recuperar') { D.recs.push({ rec: e.rec, v: e.v, restam: e.turnos }); }
    else if (e.tipo === 'escudo') { D.escudo += e.v; log('cura', `Ganha <b>${e.v} de Escudo</b> (agora ${D.escudo}).`); }
    else if (e.tipo === 'condSi') { D.conds.push({ nome: cond(e.cond).nome, restam: e.turnos, mods: e.cond === 'fortalecido' ? [{ atr: 'dano', v: 10 }] : [] }); log('marca', `A Ryoko fica <b>${esc(cond(e.cond).nome)}</b>.`); }
    else if (e.tipo === 'condAlvo') { porCond(cond(e.cond).nome, e.cond, e.turnos); }
    else log('aviso', `Aviso ao mestre: ${esc(e.txt)}`);
    return p;
  };
  const disparar = (quando, extra = () => true) => pecasDe(h, 'gatilho').filter((p) => p.quando === quando && extra(p)).forEach((p) => {
    if (p.vezes === 'umaPorBatalha' && D.usado[p.id]) return;
    D.usado[p.id] = true;
    log('cura', `${p.pergunta ? 'A passiva pergunta "Ativar?" (no teste: Ativar). ' : ''}Passiva dispara sozinha: ${esc(GATILHOS.find(([k]) => k === quando)[1].toLowerCase())}${quando === 'vidaAbaixo' ? ` ${p.n}%` : ''}.`);
    p.efeitos.forEach((e) => aplicarEfeitoGatilho(e, p));
  });
  function porCond(nome, id, turnos) {
    const ja = B.conds.find((c) => c.nome === nome);
    if (ja) ja.restam = Math.max(ja.restam, turnos);
    else B.conds.push({ nome, id, restam: turnos, porVez: POR_VEZ[id] || 0 });
    log('marca', `O boneco fica <b>${esc(nome)}</b>${turnos ? ` por ${turnos} ${pl(turnos, 'turno', 'turnos')}` : ''}.`);
  }
  const statusAplicar = (p) => p.itens.forEach((m) => {
    const v = m.modo === 'formula' ? Math.floor(atr(m.de) * m.pct / 100) : m.v;
    D.mods.push({ atr: m.atr, v, restam: m.dura === 'turnos' ? m.turnos : Infinity, de: 'status' });
    log('cura', `${p.quem === 'si' ? 'Ryoko' : 'O aliado'}: ${nomeAtr(m.atr)} <b>${sinal(v)}</b>${m.modo === 'formula' ? ` (${m.pct}% da ${nomeAtr(m.de)})` : ''} ${duraTxt(m)}.`);
  });

  for (let r = 1; r <= Math.min(T.feitas.length, T.rodadas); r++) {
    L.length = 0;
    const esc1 = T.feitas[r - 1];
    // ---- começo da vez da Ryoko
    if (r === 1) {
      disparar('inicio');
      if (h.categoria === 'passiva') pecasDe(h, 'status').forEach(statusAplicar);
      if (raca) log('nao', `Passiva de raça ligada desde o começo${raca.corta ? `: corta ${raca.cortaPct}% do dano recebido` : ''}${raca.soma ? `; +${raca.somaN} no dano físico` : ''}.`);
    }
    disparar('comeco');
    disparar('rodada', (p) => p.n === r);
    D.recs = D.recs.filter((x) => {
      if (x.rec === 'vida') { const a = D.vida; D.vida = Math.min(vidaMax, D.vida + x.v); log('cura', `Recupera <b>${D.vida - a} de vida</b> (${a} → ${D.vida}).`); }
      else { const a = D.sp; D.sp = Math.min(DONO_BASE.sp, D.sp + x.v); log('cura', `Recupera <b>${D.sp - a} de SP</b>.`); }
      x.restam -= 1; return x.restam > 0;
    });
    subirAcum('comeco');
    const pagar = (v) => { if (h.custo.gasta !== 'sp' || !v) return true; if (D.sp < v) return false; D.sp -= v; return true; };
    // ---- ligar transformação, forma ou imbuir
    if (!podeUsar && r === 1) log('nao', `Não usa ${esc(h.nome)}: falta ${juntar(reqs.map(fraseReq).map(textoSimples))}.`);
    if (podeUsar && trans && !D.trans && !D.transUsada && esc1.ligar) {
      if (pagar(h.custo.v)) {
        D.trans = { restam: trans.dura > 0 ? trans.dura : Infinity };
        D.transUsada = h.categoria === 'overload';
        trans.mods.forEach((m) => D.mods.push({ atr: m.atr, v: m.v, restam: Infinity, de: 'trans' }));
        log('marca', `Liga <b>${esc(h.nome)}</b>${h.categoria === 'overload' ? ' (Overload: ninguém desvia)' : ''}${trans.mods.length ? `: ${trans.mods.map((m) => `${nomeAtr(m.atr)} ${sinal(m.v)}`).join(', ')}` : ''}${trans.dura > 0 ? `; dura ${trans.dura} ${pl(trans.dura, 'turno', 'turnos')}` : ''}.`);
        if (trans.libera.length) log('nao', `Liberada enquanto durar: ${juntar(trans.libera.map(nomeHab))}.`);
      } else log('nao', `Sem SP para ligar ${esc(h.nome)}.`);
    }
    if (podeUsar && imb && h.categoria === 'mantida' && !D.imbuirLigado && !trans) { if (pagar(h.custo.v)) { D.imbuirLigado = true; log('marca', `Liga <b>${esc(h.nome)}</b>: a partir de agora, cada golpe pergunta "Imbuir?".`); } }
    if (podeUsar && h.categoria === 'apoio' && r === 1) { if (pagar(h.custo.v)) { pecasDe(h, 'status').forEach(statusAplicar); h.efeitos.filter((e) => e.tipo === 'cura').forEach((e) => { log('cura', `Cura ${e.v} de ${e.rec.toUpperCase()} no aliado.`); }); } }
    // ---- ataques
    const extras = D.trans && trans ? trans.acoes : 0;
    for (let a = 0; a <= extras; a++) {
      const usaEsta = podeUsar && ehAtaque(h) && !(h.categoria === 'overload' && D.overloadUsado);
      let g = GOLPE_COMUM;
      const liberada = D.trans && trans ? trans.libera.map((id) => todasAsHabs().find((x) => x.id === id)).find((x) => x && ehAtaque(x)) : null;
      if (usaEsta && pagar(h.custo.v)) {
        g = h;
        if (h.categoria === 'overload') D.overloadUsado = true;
        pecasDe(h, 'status').filter((p) => !D.usado[p.id]).forEach((p) => { D.usado[p.id] = true; statusAplicar(p); });
      } else if (liberada) g = liberada;
      const daH = g === h;
      let bate = g.golpe.bate;
      let base = g.dano.da === false ? 0 : g.dano.conta === 'vida' ? Math.floor(B.vida * g.dano.vidaPct / 100) : g.dano.base + (g.dano.parte === 'metade' ? Math.floor(atr(g.dano.atr) / 2) : g.dano.parte === 'inteiro' ? atr(g.dano.atr) : 0);
      const conta = [`${g.dano.conta === 'vida' ? `${g.dano.vidaPct}% da vida` : `${g.dano.base}${g.dano.parte !== 'nada' ? ` + ${g.dano.parte === 'metade' ? '½ ' : ''}${nomeAtr(g.dano.atr)}` : ''}`} (${base})`];
      let perf = bate === 'perfurante' ? (g.dano.perf === 'parte' ? g.dano.perfPct : 100) : 0;
      const condsDoGolpe = [];
      if (daH) pecasDe(h, 'pergunta').forEach((p) => p.perguntas.forEach((q) => {
        const rsp = q.respostas[esc1.resp[q.id] || 0];
        if (!rsp) return;
        log('nao', `"${esc(q.texto)}" → <b>${esc(rsp.nome)}</b>.`);
        if (rsp.bate) bate = rsp.bate;
        if (rsp.dano) { base += rsp.dano; conta.push(`${sinal(rsp.dano)} da resposta`); }
        if (rsp.perf) perf = rsp.perf;
        if (rsp.cond) condsDoGolpe.push([cond(rsp.cond).nome, rsp.cond, rsp.turnos]);
      }));
      const imbuirVale = imb && (h.categoria !== 'mantida' || D.imbuirLigado);
      if (imbuirVale && esc1.imbuir) {
        const el = imb.elementos.find((x) => x.id === esc1.imbuir && x.ligado);
        if (el) {
          if (D.sp >= el.sp) {
            D.sp -= el.sp;
            base += el.dano; conta.push(`${sinal(el.dano)} de ${el.nome}`);
            if (el.cond) condsDoGolpe.push([cond(el.cond).nome, el.cond, el.turnos]);
            log('nao', `"Imbuir?" → <b>${esc(el.nome)}</b> (${el.sp} SP)${el.desv ? '; o boneco reagiria com desvantagem' : ''}.`);
          } else log('nao', `Sem SP para imbuir ${esc(el.nome)}.`);
        }
      } else if (imbuirVale) log('nao', '"Imbuir?" → Não.');
      if (raca && raca.soma && ['impacto', 'cortante', 'perfurante'].includes(bate)) { base += raca.somaN; conta.push(`+${raca.somaN} da raça`); }
      const somaDano = atr('dano');
      if (somaDano) { base += somaDano; conta.push(`${sinal(somaDano)} de bônus`); }
      acums.forEach((ac) => { if (ac.nivelDa === 'dano' && D.acum[ac.nome]) { base += ac.nivelV * D.acum[ac.nome]; conta.push(`+${ac.nivelV * D.acum[ac.nome]} de ${ac.nome}`); } });
      if (daH && g.dano.mults) g.dano.mults.forEach((m) => { base *= m.x; conta.push(`×${m.x} ${m.nome}`); });
      if (B.marca > 0) {
        const mult = trans && trans.marca ? 2 : (pecaDe(h, 'marca') || { mult: 2 }).mult;
        base *= mult; conta.push(`×${mult} da marca`);
        B.marca = 0;
        log('marca', 'Acerta a <b>marca</b>: o dano dobra e a marca some.');
      }
      const direto = Math.round(base * perf / 100);
      const resto = base - direto;
      const seg = Math.min(B.escudo, resto);
      B.escudo -= seg;
      const antes = B.vida;
      B.vida = Math.max(0, B.vida - direto - (resto - seg));
      log('dano', `${extras ? `Ataque ${a + 1}: ` : ''}<b>${esc(g.nome)}</b>${bate ? ` (${nomeBate(bate)})` : ''}: ${conta.length > 1 ? conta.join(' ') : conta[0].replace(/ \(\d+\)$/, '')} = <b>${base} de dano</b>${seg ? `; o Escudo segura ${seg}` : ''}${direto && perf < 100 ? `; ${direto} direto` : ''}. Vida do boneco ${antes} → ${B.vida}.`);
      if (antes > 0 && B.vida === 0) log('aviso', 'O boneco cai. Numa batalha de verdade a luta com ele acabava aqui.');
      if (daH) {
        if (bate === 'impacto' && h.golpe.quando !== 'soTipo') condsDoGolpe.push(['Atordoado', 'atordoado', 1]);
        if (bate === 'cortante' && h.golpe.quando !== 'soTipo') condsDoGolpe.push(['Sangrando', 'sangrando', 3]);
        h.golpe.causa.forEach((k) => condsDoGolpe.push([cond(CAUSA_VIRA[k]).nome, CAUSA_VIRA[k], ((h.golpe.cfg || {})[k] || CAUSA_PARTIDA[k]).vezes]));
        h.efeitos.forEach((e) => {
          if (e.tipo === 'selo' && e.quem === 'alvo') condsDoGolpe.push([e.cond === 'outro' ? (e.nome || 'Outro') : cond(e.cond).nome, e.cond, e.tempo === 'vezes' ? e.vezes : 9]);
          if (e.tipo === 'rouba') { const ganho = Math.floor(base * e.pct / 100); D.vida = Math.min(vidaMax, D.vida + ganho); log('cura', `Rouba <b>${ganho} de vida</b>.`); }
          if (e.tipo === 'usaRecupera') log('cura', `A Ryoko recupera ${e.v} de ${e.rec.toUpperCase()}.`);
        });
        if (diminui) {
          const ja = B.quedas.find((q) => q.p.id === diminui.id);
          if (ja) { ja.ultimo = r; log('desce', `O golpe novo não soma por cima: <b>${esc(diminui.nome)}</b> continua e o tempo para voltar recomeça.`); }
          else { B.quedas.push({ p: diminui, inicio: r, ultimo: r }); log('desce', `O boneco fica <b>${esc(diminui.nome)}</b>: ${textoSimples(frasePeca(diminui, h)).split('.')[0].replace('Ao acertar, o alvo ', '')}.`); }
        }
        const mk = pecaDe(h, 'marca');
        if (mk && (mk.quando !== 'pergunta' || esc1.marcar)) { B.marca = 1; log('marca', `Deixa <b>${esc(mk.nome)}</b> no boneco.`); }
      }
      if (D.trans && trans && trans.marca) { B.marca = 1; log('marca', 'Deixa a <b>marca</b> no boneco: o próximo golpe nela dá o dobro.'); }
      [...new Map(condsDoGolpe.map((c) => [c[0], c])).values()].forEach(([nome, id, t]) => porCond(nome, id, t));
      disparar('aoAcertar');
      subirAcum('acertar');
      if (raca && raca.desvia && raca.desviaQuem === 'alvo') log('nao', 'O boneco não pode desviar (raça).');
    }
    // ---- vez do boneco
    B.conds = B.conds.filter((c) => {
      if (c.porVez) { const a = B.vida; B.vida = Math.max(0, B.vida - c.porVez); log('dano', `${esc(c.nome)}: o boneco perde <b>${c.porVez}</b> (${a} → ${B.vida}).`); }
      c.restam -= 1; return c.restam > 0;
    });
    if (diminui) {
      const antes = valorBoneco(r - 1 < 1 ? 0 : r - 1);
      const agora = valorBoneco(r);
      log('desce', `${nomeAtr(acompanha)} do boneco: <b>${antes} → ${agora}</b>${agora < (BONECO_BASE.atr[acompanha] || 0) ? ` (${esc(diminui.nome)})` : ''}.`);
    }
    let golpe = T.bate;
    const notas = [];
    if (h.categoria === 'reacao' && podeUsar) {
      const dv = pecaDe(h, 'devolve');
      if (dv) {
        const saida = dv.escolha ? esc1.devolver : 'defender';
        if (saida === 'defender') { golpe = Math.round(golpe * (100 - dv.defende) / 100); notas.push(`Defender: segura ${dv.defende}%`); }
        else { const volta = Math.floor(golpe / dv.div) + (dv.somaAtr ? atr(dv.somaAtr) : 0); B.vida = Math.max(0, B.vida - volta); notas.push(`Devolve ${volta} no boneco (${golpe} ÷ ${dv.div}${dv.somaAtr ? ` + ${nomeAtr(dv.somaAtr)}` : ''})`); }
      } else {
        const d = h.defesa;
        const fica = d.como === 'anula' ? 0 : d.como === 'pct' ? d.pct : d.como === 'd20' ? (10 + atr('agilidade') / 10 >= d.anulaCom ? 0 : 100) : 100;
        const antesG = golpe; golpe = Math.round(golpe * fica / 100); notas.push(`${h.nome}: toma ${fica}%`);
        if (d.devolve !== 'nada') { const volta = Math.floor(antesG / ({ metade: 2, terco: 3, tudo: 1 }[d.devolve])); B.vida = Math.max(0, B.vida - volta); notas.push(`devolve ${volta}`); }
      }
    }
    if (raca && raca.corta) { const c = Math.round(golpe * raca.cortaPct / 100); golpe -= c; notas.push(`a raça corta ${c}`); }
    if (D.trans && trans && trans.danoRecebido) { const c = Math.round(golpe * trans.danoRecebido / 100); golpe += c; notas.push(`a forma ${c < 0 ? 'corta' : 'soma'} ${Math.abs(c)}`); }
    const segD = Math.min(D.escudo, golpe); D.escudo -= segD; golpe -= segD; if (segD) notas.push(`o Escudo segura ${segD}`);
    const antesV = D.vida;
    D.vida -= golpe;
    if (raca && raca.desvia && raca.desviaQuem === 'dono') notas.push('a Ryoko não pode desviar');
    log('dano', `O boneco bate de volta com ${T.bate}${notas.length ? ` (${notas.join('; ')})` : ''}: a Ryoko perde <b>${golpe}</b>. Vida ${antesV} → ${Math.max(0, D.vida)}.`);
    if (golpe > 0) { disparar('aoReceber'); subirAcum('receber'); acums.filter((ac) => ac.desce === 'receber').forEach((ac) => { D.acum[ac.nome] = 0; }); }
    disparar('vidaAbaixo', (p) => D.vida > 0 && D.vida < vidaMax * p.n / 100);
    if (D.vida <= 0) {
      const cai = pecasDe(h, 'gatilho').find((p) => p.quando === 'aoCair' && !(p.vezes === 'umaPorBatalha' && D.usado[p.id]));
      if (cai) { disparar('aoCair'); if (cai.ficaCom) { D.vida = cai.ficaComN; log('cura', `Em vez de cair, fica com <b>${cai.ficaComN} de vida</b>.`); } }
      if (D.vida <= 0) { D.vida = 0; log('aviso', 'A Ryoko cai.'); }
    }
    // ---- fim da rodada
    D.mods = D.mods.filter((m) => { if (m.restam !== Infinity) m.restam -= 1; return m.restam > 0; });
    D.conds = D.conds.filter((c) => { c.restam -= 1; if (c.restam <= 0) log('nao', `${esc(c.nome)} acaba.`); return c.restam > 0; });
    if (D.trans && trans) {
      if (D.trans.restam !== Infinity) D.trans.restam -= 1;
      if (h.custo.mantida) { D.sp = Math.max(0, D.sp - h.custo.mantidaV); log('nao', `Mantida: cobra ${h.custo.mantidaV} de SP.`); }
      if (D.trans.restam <= 0) {
        D.trans = null;
        D.mods = D.mods.filter((m) => m.de !== 'trans');
        acums.filter((ac) => ac.desce === 'desligar').forEach((ac) => { D.acum[ac.nome] = 0; });
        log('marca', `<b>${esc(h.nome)}</b> acaba.`);
        if (trans.fadiga) { D.conds.push({ nome: 'Fadiga', restam: trans.fadigaTurnos, mods: trans.fadigaMods.map((m) => ({ atr: m.atr, v: m.v })) }); log('dano', `Vem a <b>Fadiga</b> por ${trans.fadigaTurnos} ${pl(trans.fadigaTurnos, 'turno', 'turnos')}${trans.fadigaMods.length ? ` (${trans.fadigaMods.map((m) => `${nomeAtr(m.atr)} ${sinal(m.v)}`).join(', ')})` : ''}.`); }
      }
    }
    serie.push({ rot: `R${r}`, v: valorBoneco(r) });
    rodadas.push({ n: r, escolha: esc1, linhas: L.slice(), dono: { vida: Math.max(0, D.vida), sp: D.sp, escudo: D.escudo, mods: D.mods.map((m) => ({ ...m })), conds: D.conds.map((c) => ({ ...c })), trans: D.trans ? { ...D.trans } : null, acum: { ...D.acum } }, boneco: { vida: B.vida, escudo: B.escudo, conds: B.conds.map((c) => ({ ...c })), marca: B.marca, valor: valorBoneco(r) } });
  }
  return { rodadas, serie, acompanha, atr };
}

function graficoDaSerie(s, nome) {
  const W = 340, H = 132, base = 104, topo = 18;
  const max = Math.max(1, ...s.map((p) => p.v));
  const passo = W / s.length;
  const larg = Math.min(46, passo - 14);
  const barras = s.map((p, i) => {
    const h = Math.max(2, (p.v / max) * (base - topo));
    const x = i * passo + (passo - larg) / 2;
    const y = base - h;
    const raio = Math.min(4, h);
    const d = `M${x},${base} V${y + raio} Q${x},${y} ${x + raio},${y} H${x + larg - raio} Q${x + larg},${y} ${x + larg},${y + raio} V${base} Z`;
    const rotulo = i === 0 || i === s.length - 1 || p.v !== s[i - 1].v;
    const dica = `${p.rot}: ${p.v}`;
    return `<g><path class="barra-g"${i === 0 ? ' data-base' : ''} d="${d}"/>${rotulo ? `<text class="valor" x="${x + larg / 2}" y="${y - 5}" text-anchor="middle">${p.v}</text>` : ''}<text x="${x + larg / 2}" y="${base + 16}" text-anchor="middle">${p.rot}</text>
      <rect class="alvo-hover" x="${i * passo}" y="0" width="${passo}" height="${base}" tabindex="0" aria-label="${esc(dica)}"/><g class="dica-g"><rect x="${Math.min(W - 92, Math.max(0, x + larg / 2 - 46))}" y="0" width="92" height="20" rx="4"/><text x="${Math.min(W - 46, Math.max(46, x + larg / 2))}" y="14" text-anchor="middle">${esc(dica)}</text></g></g>`;
  }).join('');
  return `<figure class="grafico"><figcaption class="grafico__tit">${esc(nome)}, rodada a rodada</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(nome)}: ${s.map((p) => `${p.rot} ${p.v}`).join(', ')}"><line class="eixo" x1="0" x2="${W}" y1="${base}" y2="${base}"/>${barras}</svg></figure>`;
}

function medidor(rot, v, max, cor) {
  return `<div class="medidor"><div class="medidor__rot"><span>${rot}</span><b>${v}${max ? ` / ${max}` : ''}</b></div>${max ? `<div class="medidor__barra" aria-hidden="true"><i style="--cor:${cor};transform:scaleX(${limitar(v / max, 0, 1)})"></i></div>` : ''}</div>`;
}

function blocoDaPergunta(h, T, n) {
  const e = T.agora;
  const qs = [];
  const usaGolpe = ehAtaque(h) && (!h.requisitos.todos.length && !h.requisitos.umDestes.length || T.reqOk);
  if (usaGolpe) pecasDe(h, 'pergunta').forEach((p) => p.perguntas.forEach((q) => qs.push(`<div class="pergunta-batalha__q"><span>${esc(q.texto)}</span>${segTeste(`resp.${q.id}`, e.resp[q.id] || 0, q.respostas.map((r, k) => [k, r.nome || `Resposta ${k + 1}`]), q.texto)}</div>`)));
  const imb = pecaDe(h, 'imbuir');
  if (imb && imb.elementos.some((x) => x.ligado)) qs.push(`<div class="pergunta-batalha__q"><span>Imbuir?</span>${segTeste('imbuir', e.imbuir, [...imb.elementos.filter((x) => x.ligado).map((x) => [x.id, `${x.nome} (${x.sp} SP)`]), ['', 'Não']], 'Imbuir')}</div>`);
  const tr = pecaDe(h, 'transformacao');
  const ultima = simular(h, T).rodadas.slice(-1)[0];
  if (tr && !(ultima && ultima.dono.trans) && !(h.categoria === 'overload' && T.feitas.some((f, i) => f.ligar && i < T.feitas.length))) qs.push(`<div class="pergunta-batalha__q"><span>Ligar ${esc(h.nome)} nesta rodada?</span>${segTeste('ligar', e.ligar ? 1 : 0, [[1, 'Ligar'], [0, 'Agora não']], 'Ligar')}</div>`);
  const mk = pecaDe(h, 'marca');
  if (mk && mk.quando === 'pergunta') qs.push(`<div class="pergunta-batalha__q"><span>Marcar? (${mk.paga} SP)</span>${segTeste('marcar', e.marcar ? 1 : 0, [[1, 'Marcar'], [0, 'Agora não']], 'Marcar')}</div>`);
  const dv = pecaDe(h, 'devolve');
  if (dv && dv.escolha && h.categoria === 'reacao') qs.push(`<div class="pergunta-batalha__q"><span>O boneco bate. Defender ou devolver?</span>${segTeste('devolver', e.devolver, [['defender', `Defender (segura ${dv.defende}%)`], ['devolver', `Devolver ÷ ${dv.div}`]], 'Defender ou devolver')}</div>`);
  if (h.opcoes.length) qs.push(`<div class="pergunta-batalha__q"><span>Qual opção?</span>${segTeste('opcao', e.opcao, h.opcoes.map((o, k) => [k, o.nome || `Opção ${k + 1}`]), 'Opção')}</div>`);
  return `<section class="pergunta-batalha" aria-labelledby="pb-tit"><h3 id="pb-tit" class="rodada__cab" style="font-family:var(--f-display);font-size:19px;font-weight:400">Rodada ${n}: o que a Ryoko vê na batalha</h3>
    ${qs.length ? qs.join('') : '<p class="nota">Nada para perguntar nesta rodada: a técnica faz tudo sozinha.</p>'}
    <div class="pergunta-batalha__pe"><button type="button" class="bt bt--primario" data-acao="jogar">${glifo('play')}Jogar a rodada ${n}</button><button type="button" class="bt" data-acao="jogar-tudo">Jogar até a rodada ${T.rodadas}</button></div></section>`;
}
function segTeste(c, v, ops, rot) {
  return `<div class="seg" role="radiogroup" aria-label="${esc(rot)}">${ops.map(([k, n]) => { const ok = String(k) === String(v); return `<button type="button" role="radio" aria-checked="${ok}" tabindex="${ok ? 0 : -1}" data-acao="escolha" data-c="${esc(c)}" data-v="${esc(k)}">${esc(n)}</button>`; }).join('')}</div>`;
}

function telaTeste() {
  const h = E.rascunho;
  const T = UI.teste || (UI.teste = testeNovo());
  const sim = simular(h, T);
  const temReq = h.requisitos.todos.length || h.requisitos.umDestes.length;
  const rods = sim.rodadas.map((r, i) => `<article class="rodada"${i === sim.rodadas.length - 1 && UI.rodadaNova ? ' data-entra' : ''} aria-labelledby="rd-${r.n}"><div class="rodada__cab"><h3 id="rd-${r.n}">Rodada ${r.n}</h3><span>Ryoko com ${r.dono.vida} de vida e ${r.dono.sp} de SP; boneco com ${r.boneco.vida}</span></div>
      <ol class="registro">${r.linhas.map(([t, txt]) => `<li data-t="${t}"><span>${{ dano: 'dano', cura: 'ganha', marca: 'condição', aviso: 'aviso', nao: 'nota', desce: 'perde', acum: 'acumulador' }[t] || ''}</span><span>${txt}</span></li>`).join('')}</ol></article>`).join('');
  const fim = sim.rodadas.length >= T.rodadas;
  const ult = sim.rodadas.slice(-1)[0];
  const dono = ult ? ult.dono : { vida: Math.round(DONO_BASE.vida * T.vidaPct / 100), sp: DONO_BASE.sp, escudo: 0, mods: [], conds: [], trans: null, acum: Object.fromEntries(pecasDe(h, 'acumulador').map((a) => [a.nome, a.comeca])) };
  const bon = ult ? ult.boneco : { vida: BONECO_BASE.vida, escudo: BONECO_BASE.escudo, conds: [], marca: 0, valor: sim.serie[0].v };
  const pilulasDono = [...dono.mods.map((m) => `<span class="etiqueta ${m.v < 0 ? 'etiqueta--dano' : 'etiqueta--cura'}">${esc(nomeAtr(m.atr))} ${sinal(m.v)}${m.restam !== Infinity ? ` · ${m.restam}t` : ''}</span>`), ...dono.conds.map((c) => `<span class="etiqueta etiqueta--selo">${esc(c.nome)} · ${c.restam}t</span>`), dono.trans ? `<span class="etiqueta etiqueta--latao">${esc(h.nome)}${dono.trans.restam !== Infinity ? ` · faltam ${dono.trans.restam}` : ' · ligada'}</span>` : ''].join('');
  const pilulasBon = [...bon.conds.map((c) => `<span class="etiqueta etiqueta--selo">${esc(c.nome)} · ${c.restam}t</span>`), bon.marca ? '<span class="etiqueta etiqueta--dano">Marca</span>' : '', sim.acompanha !== 'vida' && bon.valor < (BONECO_BASE.atr[sim.acompanha] || 0) ? `<span class="etiqueta etiqueta--dano">${esc(pecaDe(h, 'diminui').nome)} · ${esc(nomeAtr(sim.acompanha))} ${bon.valor}</span>` : ''].join('');
  const acums = Object.entries(dono.acum).map(([n, v]) => medidor(esc(n), v, (pecasDe(h, 'acumulador').find((a) => a.nome === n) || { max: 5 }).max, 'var(--lb-musgo)')).join('');
  return `<div class="pg-cab"><div class="pg-cab__txt"><h1 class="pg-titulo">Testar no boneco</h1><p class="pg-sub">Testando <b>${esc(h.nome || 'Sem nome')}</b>, do jeito que está no editor (mesmo sem salvar). Todo golpe acerta e o d20 da defesa rola 10: o teste mostra a regra, não a sorte. Nada muda nas fichas.</p></div>
      <div class="pg-acoes"><button type="button" class="bt" data-acao="aba" data-v="editor">${glifo('lapis')}Voltar ao editor</button><button type="button" class="bt bt--fantasma" data-acao="teste-recomecar"${T.feitas.length ? '' : ' disabled'}>${glifo('turno')}Recomeçar o teste</button></div></div>
    <div class="ajustes" role="group" aria-label="Ajustes do teste">
      <label>Rodadas ${numTeste('rodadas', T.rodadas, 2, 5)}</label>
      <label>O boneco bate de volta com ${numTeste('bate', T.bate, 0, 400)}</label>
      <label>A Ryoko começa com ${numTeste('vidaPct', T.vidaPct, 5, 100)} % da vida</label>
      ${temReq ? `<label class="marca-caixa"><input type="checkbox" data-acao-change="teste-req"${T.reqOk ? ' checked' : ''}><span>Os requisitos estão cumpridos (${esc(textoSimples(juntar([...h.requisitos.todos, ...h.requisitos.umDestes].map(fraseReq))))})</span></label>` : ''}
    </div>
    <div class="teste">
      <div class="rodadas">${rods}${fim ? `<div class="vazio"><p>Fim das ${T.rodadas} rodadas. Mude a técnica no editor e volte: o teste refaz as mesmas escolhas.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="bt bt--latao" data-acao="aba" data-v="editor">${glifo('lapis')}Voltar ao editor</button><button type="button" class="bt" data-acao="teste-recomecar">${glifo('turno')}Recomeçar o teste</button></div></div>` : blocoDaPergunta(h, T, sim.rodadas.length + 1)}</div>
      <aside class="placar" aria-label="Placar" aria-live="polite">
        <section class="painel lutador"><div class="lutador__cab"><span class="medalhao medalhao--p">${glifo('boneco')}</span><b>Boneco de treino</b><small>sem reação</small></div>
          ${medidor('Vida', bon.vida, BONECO_BASE.vida, 'var(--lb-dano)')}${medidor('Escudo', bon.escudo, BONECO_BASE.escudo, 'var(--lb-agua)')}
          ${pilulasBon ? `<div class="pilulas">${pilulasBon}</div>` : ''}
          ${graficoDaSerie(sim.serie, sim.acompanha === 'vida' ? 'Vida do boneco' : `${nomeAtr(sim.acompanha)} do boneco`)}</section>
        <section class="painel lutador"><div class="lutador__cab"><span class="medalhao medalhao--p">${glifo('ficha')}</span><b>Ryoko</b><small>Força 60 · Agilidade 33</small></div>
          ${medidor('Vida', dono.vida, DONO_BASE.vida, 'var(--lb-cura)')}${medidor('SP', dono.sp, DONO_BASE.sp, 'var(--lb-latao)')}${dono.escudo ? medidor('Escudo', dono.escudo, 0) : ''}${acums}
          ${pilulasDono ? `<div class="pilulas">${pilulasDono}</div>` : '<p class="nota">Sem mudança nos atributos.</p>'}</section>
      </aside>
    </div>`;
}
function numTeste(c, v, min, max) { return `<input class="entrada" type="number" inputmode="numeric" data-teste="${c}" value="${v}" min="${min}" max="${max}">`; }

/* =============================================================== desenhar a tela */
const CHAVES_DE_FOCO = ['id', 'data-c', 'data-v', 'data-acao', 'data-acao-change', 'data-acao-input', 'data-acao-enter', 'data-i', 'data-j', 'data-g', 'data-teste', 'data-lista'];
function seletorDe(el) {
  if (!el || el === document.body) return null;
  if (el.id) return `#${CSS.escape(el.id)}`;
  const partes = CHAVES_DE_FOCO.filter((k) => el.hasAttribute(k)).map((k) => `[${k}="${CSS.escape(el.getAttribute(k))}"]`);
  return partes.length ? `${el.tagName.toLowerCase()}${partes.join('')}` : null;
}
function render() {
  const tela = $('#tela');
  const ativo = document.activeElement;
  const seletor = UI.focar || (tela.contains(ativo) ? seletorDe(ativo) : null);
  const cursor = ativo && 'selectionStart' in ativo && ativo.type !== 'number' ? [ativo.selectionStart, ativo.selectionEnd] : null;
  UI.focar = null;
  tela.innerHTML = UI.aba === 'catalogo' ? telaCatalogo() : UI.aba === 'ficha' ? telaFicha() : UI.aba === 'editor' ? telaEditor() : UI.aba === 'teste' ? telaTeste() : telaComoEra();
  tela.setAttribute('aria-labelledby', `aba-${UI.aba}`);
  $$('.aba').forEach((b) => { const ok = b.dataset.aba === UI.aba; b.setAttribute('aria-selected', String(ok)); b.tabIndex = ok ? 0 : -1; });
  document.title = `${UI.aba === 'editor' || UI.aba === 'teste' ? `${E.rascunho.nome || 'Sem nome'} · ` : ''}Habilidades, protótipo`;
  if (seletor) {
    const alvo = $(seletor, tela) || null;
    if (alvo && !alvo.disabled) {
      alvo.focus({ preventScroll: true });
      if (cursor && 'setSelectionRange' in alvo && alvo.type !== 'number') { try { alvo.setSelectionRange(cursor[0], cursor[1]); } catch (_) { /* campo sem seleção */ } }
    }
  }
  UI.entrou = null; UI.brilho = null; UI.novaLinha = null; UI.rodadaNova = false;
}

function anunciar(t) { const a = $('#anuncio'); a.textContent = ''; requestAnimationFrame(() => { a.textContent = t; }); }

/* =============================================================== avisos (toast) com Desfazer */
function avisar(texto, desfazer) {
  const caixa = $('#avisos');
  const el = document.createElement('div');
  el.className = 'aviso';
  el.setAttribute('role', 'status');
  el.innerHTML = `${glifo('visto')}<p>${esc(texto)}</p>${desfazer ? '<button type="button" class="bt bt--p bt--latao">Desfazer</button>' : ''}<button type="button" class="bt bt--p bt--ic bt--fantasma" aria-label="Fechar o aviso">${glifo('x')}</button>`;
  el.setAttribute('data-entrando', '');
  caixa.append(el);
  while (caixa.children.length > 3) caixa.firstElementChild.remove();
  requestAnimationFrame(() => requestAnimationFrame(() => el.removeAttribute('data-entrando')));
  let fora = null;
  const fechar = () => {
    if (!el.isConnected || el.hasAttribute('data-saindo')) return;
    clearTimeout(fora);
    el.setAttribute('data-saindo', '');
    setTimeout(() => el.remove(), semMovimento() ? 0 : 160);
  };
  const prazo = () => { clearTimeout(fora); fora = setTimeout(fechar, desfazer ? 7000 : 3200); };
  el.addEventListener('mouseenter', () => clearTimeout(fora));
  el.addEventListener('mouseleave', prazo);
  el.addEventListener('focusin', () => clearTimeout(fora));
  el.addEventListener('focusout', prazo);
  const [btD, btF] = desfazer ? $$('button', el) : [null, $('button', el)];
  if (btD) btD.addEventListener('click', () => { desfazer(); fechar(); });
  btF.addEventListener('click', fechar);
  el.fechar = fechar;
  prazo();
  anunciar(texto);
}

/* =============================================================== mexer no rascunho */
function partes(caminho) { return caminho.split('.').map((k) => (/^\d+$/.test(k) ? Number(k) : k)); }
function pegar(obj, caminho) { return partes(caminho).reduce((o, k) => (o == null ? undefined : o[k]), obj); }
function por(obj, caminho, valor) {
  const ks = partes(caminho);
  let o = obj;
  ks.slice(0, -1).forEach((k, i) => { if (o[k] == null || typeof o[k] !== 'object') o[k] = typeof ks[i + 1] === 'number' ? [] : {}; o = o[k]; });
  o[ks[ks.length - 1]] = valor;
}
let ultimaFoto = { c: null, t: 0 };
/** Guarda o estado antes de mudar. Digitação no mesmo campo vira uma foto só. */
function foto(c = null) {
  const agora = Date.now();
  if (c && ultimaFoto.c === c && agora - ultimaFoto.t < 1200) { ultimaFoto.t = agora; return; }
  ultimaFoto = { c, t: agora };
  UI.desfazer.push(JSON.stringify(E.rascunho));
  if (UI.desfazer.length > 60) UI.desfazer.shift();
}
function desfazer() {
  if (!UI.desfazer.length) { avisar('Nada para desfazer.'); return; }
  E.rascunho = JSON.parse(UI.desfazer.pop());
  ultimaFoto = { c: null, t: 0 };
  render();
  anunciar('Desfeito.');
}
function trocarRascunho(fazer) {

    irPara('editor');
  });
}
function gravarEm(lista, h) {

}

}

const opcaoNova = () => ({ id: novoId('o'), nome: '', faz: '' });

/** Ações dentro de uma peça: o índice vem da peça (data-pi). */

      render();
      const novo = $(`#peca-${p.id}`);
      if (novo) { novo.scrollIntoView({ behavior: semMovimento() ? 'auto' : 'smooth', block: 'center' }); const campo = $('input, select, button.elem, [role="radio"]', $('.peca__corpo', novo)); if (campo) campo.focus({ preventScroll: true }); }
      anunciar(`Peça "${PECAS[v].nome}" posta. O cartão já mostra o que ela faz.`);
      return;
    }
    case 'tirar-req': tirarComDesfazer(h.requisitos[el.dataset.g], i, `Requisito "${nomeReq(h.requisitos[el.dataset.g][i].tipo)}"`); return;
    case 'mais-opcao': { foto(); const o = opcaoNova(); h.opcoes.push(o); UI.focar = `[data-c="opcoes.${h.opcoes.length - 1}.nome"]`; break; }
    case 'tirar-opcao': tirarComDesfazer(h.opcoes, i, 'Opção'); return;
    case 'mais-campo': foto(); h.campos.push({ id: novoId('c'), nome: '', valor: '' }); UI.focar = `[data-c="campos.${h.campos.length - 1}.nome"]`; break;
    case 'tirar-campo': tirarComDesfazer(h.campos, i, 'Campo'); return;
    case 'modelo': {
      UI.modelo = v;
      const m = v ? E.habs.find((x) => x.id === v) : habEmBranco('Habilidade nova');
      aplicarModelo(m);
      UI.focar = `[data-acao="modelo"][data-v="${v}"]`;
      anunciar(`Começou de ${v ? m.nome : 'em branco'}.`);
      break;
    }
    case 'conferido': foto(); h.convertida = false; h.confira = []; avisar('Marcada como conferida. Salve para gravar.'); UI.focar = '#campo-nome'; break;
    case 'ir': irAte(v); return;
    case 'desfazer': desfazer(); return;
    case 'salvar': salvar(); return;
    case 'testar': UI.teste = UI.teste || testeNovo(); irPara('teste'); return;
    default: return;
  }
  render();
}

function irAte(id) {
  const alvo = document.getElementById(id);
  if (!alvo) return;
  alvo.scrollIntoView({ behavior: semMovimento() ? 'auto' : 'smooth', block: 'start' });
  alvo.removeAttribute('data-brilho');
  void alvo.offsetWidth;
  alvo.setAttribute('data-brilho', '');
  setTimeout(() => alvo.removeAttribute('data-brilho'), 950);
  const campo = $('input, select, textarea, [role="radio"][aria-checked="true"], button.elem', alvo);
  if (campo) campo.focus({ preventScroll: true });
}

function acaoDoTeste(acao, el) {
  const T = UI.teste;
  const h = E.rascunho;
  switch (acao) {
    case 'escolha': {
      const c = el.dataset.c, v = el.dataset.v;
      if (c.startsWith('resp.')) T.agora.resp[c.slice(5)] = Number(v);
      else if (c === 'ligar' || c === 'marcar') T.agora[c] = v === '1';
      else if (c === 'opcao') T.agora.opcao = Number(v);
      else T.agora[c] = v;
      UI.focar = `[data-acao="escolha"][data-c="${CSS.escape(c)}"][data-v="${CSS.escape(v)}"]`;
      break;
    }
    case 'jogar': case 'jogar-tudo': {
      const ate = acao === 'jogar' ? T.feitas.length + 1 : T.rodadas;
      while (T.feitas.length < ate) T.feitas.push(clone(T.agora));
      UI.rodadaNova = true;
      render();
      const ult = $$('.rodada').pop();
      if (ult) ult.scrollIntoView({ behavior: semMovimento() ? 'auto' : 'smooth', block: 'nearest' });
      const prox = $('[data-acao="jogar"]') || $('.rodadas .vazio .bt');
      if (prox) prox.focus({ preventScroll: true });
      const r = simular(h, T).rodadas.slice(-1)[0];
      anunciar(`Rodada ${T.feitas.length} jogada. Boneco com ${r.boneco.vida} de vida; Ryoko com ${r.dono.vida}.`);
      return;
    }
    case 'teste-recomecar': UI.teste = { ...testeNovo(), rodadas: T.rodadas, bate: T.bate, vidaPct: T.vidaPct, reqOk: T.reqOk }; UI.focar = '[data-acao="jogar"]'; break;
    default: return;
  }
  render();
}

/* =============================================================== eventos */
document.addEventListener('click', (ev) => {
  const aba = ev.target.closest('.aba');
  if (aba) { irPara(aba.dataset.aba, false); aba.focus(); return; }
  const el = ev.target.closest('[data-acao]');
  if (!el || el.disabled || !$('#tela').contains(el) && el.dataset.acao !== 'recomecar') return;
  const acao = el.dataset.acao;
  switch (acao) {
    case 'recomecar': comecar(); irPara('catalogo'); avisar('Voltou ao começo: os exemplos estão como vieram.'); return;
    case 'aba': irPara(el.dataset.v); return;
    case 'filtro': UI.filtro = el.dataset.v; UI.focar = `[data-acao="filtro"][data-v="${el.dataset.v}"]`; render(); return;
    case 'limpar-busca': UI.busca = ''; UI.filtro = 'todas'; UI.focar = '#busca'; render(); return;
    case 'abrir': {
      const id = el.dataset.v, destino = el.dataset.destino || 'catalogo';
      if (E.rascunho.id === id && E.destino === destino && UI.aba !== 'editor') { irPara('editor'); return; }
      trocarRascunho(() => abrirNoEditor(id, true, destino));
      return;
    }
    case 'testar-de': { const id = el.dataset.v, destino = el.dataset.destino || 'catalogo'; trocarRascunho(() => { abrirNoEditor(id, false, destino); UI.teste = testeNovo(); irPara('teste'); }); return; }
    case 'nova': novaHabilidade(); return;
    case 'nova-ficha': novaHabilidade('ficha', el.dataset.v); return;
    case 'ficha-aba': UI.fichaAba = el.dataset.v; UI.focar = `[data-acao="ficha-aba"][data-v="${el.dataset.v}"]`; render(); return;
    case 'trazer': UI.trazer = !UI.trazer; UI.focar = '[data-acao="trazer"]'; render(); return;
    case 'trazer-de': UI.trazerDe = el.dataset.v; UI.focar = `[data-acao="trazer-de"][data-v="${el.dataset.v}"]`; render(); return;
    case 'trazer-hab': {
      const de = el.dataset.de;
      const origem = (de === 'catalogo' ? E.habs : E.fichas[de].habs).find((x) => x.id === el.dataset.v);
      trocarRascunho(() => {
        const copia = clone(origem);
        // do catálogo, a cópia é a mesma habilidade (mesmo id); de outra ficha, nasce outra
        if (de !== 'catalogo') { copia.id = novoId('h-'); copia.pecas.forEach((p) => { p.id = novoId('p'); }); }
        E.rascunho = copia; E.salvo = ''; E.destino = 'ficha'; E.tambem = false;
        UI.nova = null; UI.desfazer = []; UI.teste = null; UI.trazer = false;
        irPara('editor');
        avisar(`Cópia de "${origem.nome}" aberta. Salve para pôr na ficha da ${E.fichas.ryoko.nome}.`);
      });
      return;
    }
    case 'acum-dono': {
      const id = el.dataset.v, p = el.dataset.p;
      trocarRascunho(() => { abrirNoEditor(id, true, 'ficha'); irAte(`peca-${p}`); });
      return;
    }
    default: break;
  }
  if (UI.aba === 'teste') acaoDoTeste(acao, el);
  else if (UI.aba === 'editor') acaoDoEditor(acao, el);
});

function valorDoCampo(el) {
  if (el.dataset.t === 'b') return el.checked;
  if (el.dataset.t === 'n') {
    if (el.value === '' || el.value === '-') return null;
    const min = Number(el.min), max = Number(el.max);
    return limitar(inteiro(el.value, 0), Number.isFinite(min) ? min : -9999, Number.isFinite(max) ? max : 9999);
  }
  return el.value;
}
/** Grava um campo do editor. Devolve true se a tela precisa ser redesenhada inteira. */
function gravarCampo(el, final) {
  const h = E.rascunho;
  const c = el.dataset.c;
  if (c === '_mais-efeito') { if (!el.value) return false; foto(); const e = efeitoNovo(el.value); h.efeitos.push(e); UI.entrou = e.id; UI.focar = '[data-c="_mais-efeito"]'; anunciar(`Efeito posto: ${(EFEITOS.find(([k]) => k === el.value) || ['', ''])[1]}.`); return true; }
  if (c.startsWith('_mais-efeito-gatilho.')) { if (!el.value) return false; foto(); const p = pegar(h, c.slice(21)); const e = efeitoDoGatilhoNovo(el.value); p.efeitos.push(e); UI.entrou = e.id; UI.focar = `[data-c="${CSS.escape(c)}"]`; return true; }
  if (c.startsWith('_mais-libera.')) { if (!el.value) return false; foto(); pegar(h, c.slice(13)).libera.push(el.value); UI.focar = `[data-c="${CSS.escape(c)}"]`; return true; }
  const v = valorDoCampo(el);
  if (v === null) return false;
  if (pegar(h, c) === v) return final && el.dataset.t === 'n';
  foto(el.dataset.t === 'b' ? null : c);
  por(h, c, v);
  if (el.dataset.t === 'n' && final && String(v) !== el.value) el.value = v;
  return el.hasAttribute('data-f') || (final && el.dataset.t === 'n');
}

document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.id === 'busca') { UI.busca = el.value; render(); return; }
  if (UI.aba === 'editor' && el.dataset.c && !el.hasAttribute('data-f') && el.tagName !== 'SELECT') { gravarCampo(el, false); renderPapelSo(); }
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (UI.aba === 'teste') {
    const T = UI.teste;
    if (el.dataset.teste) {
      const min = Number(el.min), max = Number(el.max);
      T[el.dataset.teste] = limitar(inteiro(el.value, min), min, max);
      if (T.feitas.length > T.rodadas) T.feitas.length = T.rodadas;
      setTimeout(render, 0);
    } else if (el.dataset.acaoChange === 'teste-req') { T.reqOk = el.checked; UI.focar = '[data-acao-change="teste-req"]'; render(); }
    return;
  }
  if (UI.aba !== 'editor') return;
  const h = E.rascunho;
  if (el.dataset.acaoChange === 'tambem') { E.tambem = el.checked; anunciar(el.checked ? 'Ao salvar, grava também no catálogo do livro.' : 'Ao salvar, grava só na ficha.'); return; }
  if (el.dataset.acaoChange === 'mais-req') {
    if (!el.value) return;
    foto();
    const g = el.dataset.g;
    const r = requisitoNovo(el.value);
    h.requisitos[g].push(r);
    UI.entrou = r.id;
    UI.focar = `[data-acao-change="mais-req"][data-g="${g}"]`;
    anunciar(`Requisito posto: ${nomeReq(el.value)}.`);
    render();
    return;
  }
  if (el.dataset.acaoChange === 'modelo-hoje') {
    if (!el.value) return;
    UI.modelo = '';
    aplicarModelo(habDoModeloDeHoje(el.value));
    anunciar(`Começou do modelo ${el.value}.`);
    UI.focar = '[data-acao-change="modelo-hoje"]';
    render();
    return;
  }
  // o número grava ao sair do campo: redesenha depois que o foco já andou, para o Tab não se perder
  if (el.dataset.c && gravarCampo(el, true)) { if (el.dataset.t === 'n') setTimeout(render, 0); else render(); }
  else renderPapelSo();
});

const emCampoDeTexto = (el) => el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && ['text', 'search', 'number'].includes(el.type)));
document.addEventListener('keydown', (ev) => {
  const el = ev.target;
  const mod = ev.ctrlKey || ev.metaKey;
  if (mod && ev.key.toLowerCase() === 's' && UI.aba === 'editor') { ev.preventDefault(); if (el.dataset && el.dataset.c) gravarCampo(el, true); salvar(); return; }
  if (mod && ev.key.toLowerCase() === 'z' && !ev.shiftKey && UI.aba === 'editor' && !emCampoDeTexto(el)) { ev.preventDefault(); desfazer(); return; }
  if (ev.key === '/' && UI.aba === 'catalogo' && !emCampoDeTexto(el)) { ev.preventDefault(); $('#busca').focus(); return; }
  if (ev.key === 'Escape') {
    if (el.id === 'busca' && el.value) { UI.busca = ''; UI.focar = '#busca'; render(); return; }
    const ultimo = $('#avisos').lastElementChild;
    if (ultimo && ultimo.fechar) { ultimo.fechar(); return; }
  }
  if (ev.key === 'Enter' && el.dataset && el.dataset.acaoEnter === 'marca') {
    ev.preventDefault();
    const t = el.value.trim();
    const h = E.rascunho;
    if (!t) return;
    if (h.marcas.some((m) => m.toLowerCase() === t.toLowerCase())) { avisar(`"${t}" já é uma marca desta habilidade.`); return; }
    foto(); h.marcas.push(t); UI.focar = '[data-acao-enter="marca"]'; render();
    return;
  }
  // grupos de opção (seg, ação, imagem, modelos, escolhas do teste): setas andam e escolhem
  if (['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp', 'Home', 'End'].includes(ev.key) && el.getAttribute && el.getAttribute('role') === 'radio') {
    const grupo = el.closest('[role="radiogroup"]');
    if (!grupo) return;
    const radios = $$('[role="radio"]', grupo).filter((r) => !r.disabled);
    const k = radios.indexOf(el);
    const n = radios.length;
    const novo = ev.key === 'Home' ? 0 : ev.key === 'End' ? n - 1 : (k + (ev.key === 'ArrowRight' || ev.key === 'ArrowDown' ? 1 : -1) + n) % n;
    ev.preventDefault();
    radios[novo].focus();
    radios[novo].click();
    return;
  }
  if (['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(ev.key) && el.classList && el.classList.contains('aba')) {
    const abas = $$('.aba');
    const k = abas.indexOf(el);
    const novo = ev.key === 'Home' ? 0 : ev.key === 'End' ? abas.length - 1 : (k + (ev.key === 'ArrowRight' ? 1 : -1) + abas.length) % abas.length;
    ev.preventDefault();
    irPara(abas[novo].dataset.aba, false);
    abas[novo].focus();
  }
});

comecar();
render();
</script>
</body>
</html>
