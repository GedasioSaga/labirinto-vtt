<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca organizada: Habilidades e Itens (protótipo)</title>
<style>
/* Os tokens do app (--lb-*) e do grimório (--lb-gr-*), iguais aos do protótipo do editor
   (docs/design/habilidades/editor/prototipo.html), mais as tintas do papel. */
:root {
  --lb-color-ink: #121214;
  --lb-color-stone-solid: #1a1a1e;
  --lb-color-stone-raised: #232328;
  --lb-color-stone-hover: #2c2c33;
  --lb-color-stone-sunken: #141417;
  --lb-color-line: rgba(255, 255, 255, 0.08);
  --lb-color-line-strong: rgba(255, 255, 255, 0.16);
  --lb-color-parchment: #eceae4;
  --lb-color-parchment-dim: #a2a09a;
  --lb-color-parchment-faint: #858480;
  --lb-color-brass: #e0a44a;
  --lb-color-brass-bright: #f3ba66;
  --lb-color-brass-soft: rgba(224, 164, 74, 0.14);
  --lb-color-brass-contrast: #1c1608;
  --lb-color-ember: #e2645a;
  --lb-color-ember-soft: rgba(226, 100, 90, 0.14);
  --lb-color-online: #7fb48a;
  --lb-color-online-soft: rgba(127, 180, 138, 0.14);
  --lb-color-tide: #79a9cc;
  --lb-color-tide-soft: rgba(121, 169, 204, 0.14);
  --lb-color-arcane: #ab93d6;
  --lb-color-arcane-soft: rgba(171, 147, 214, 0.15);
  --lb-font-display: 'Sitka Banner', 'Sitka Display', Sitka, Constantia, Georgia, 'Times New Roman', serif;
  --lb-font-sans: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
  --lb-font-utility: 'Bahnschrift', 'DIN Alternate', 'Segoe UI Variable Small', 'Segoe UI', system-ui, sans-serif;
  --lb-font-size-xs: 10.5px;
  --lb-font-size-sm: 11.5px;
  --lb-font-size-md: 13px;
  --lb-font-size-lg: 15px;
  --lb-font-size-xl: 20px;
  --lb-font-tracking-wide: 0.06em;
  --lb-radius-sm: 6px;
  --lb-radius-md: 9px;
  --lb-radius-lg: 14px;
  --lb-radius-full: 999px;
  --lb-shadow-float: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 14px rgba(0, 0, 0, 0.44), 0 20px 46px rgba(0, 0, 0, 0.55);
  --lb-shadow-focus: 0 0 0 2px var(--lb-color-stone-solid), 0 0 0 4px var(--lb-color-brass);
  --lb-shadow-bevel: inset 0 1px 0 rgba(255, 255, 255, 0.07);
  --lb-motion-fast: 110ms;
  --lb-gr-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --lb-gr-cartao: #211c15;
  --lb-gr-cartao-alto: #29231a;
  --lb-gr-campo: #15120e;
  --lb-gr-filete: rgba(236, 234, 228, 0.09);
  --lb-gr-filete-forte: rgba(236, 234, 228, 0.16);
  --lb-gr-filete-latao: rgba(224, 164, 74, 0.26);
  --lb-gr-gravado: #c8b089;
  --lb-gr-latao-1: #f6cb84;
  --lb-gr-latao-2: #e0a44a;
  --lb-gr-hover: rgba(255, 236, 200, 0.06);
  --lb-gr-hover-forte: rgba(255, 236, 200, 0.1);
  --bt-papel: var(--lb-color-parchment);
  --bt-rasgo-caixa: polygon(0 3px, 6% 0, 13% 4px, 21% 1px, 28% 3px, 37% 0, 45% 4px, 52% 1px, 60% 3px, 68% 0, 76% 4px, 84% 1px, 92% 3px, 100% 0, calc(100% - 3px) 30%, 100% 60%, calc(100% - 2px) 100%, 92% calc(100% - 3px), 84% 100%, 76% calc(100% - 4px), 68% calc(100% - 1px), 60% calc(100% - 3px), 52% 100%, 45% calc(100% - 4px), 37% calc(100% - 1px), 28% calc(100% - 3px), 21% 100%, 13% calc(100% - 4px), 6% calc(100% - 1px), 0 calc(100% - 3px), 2px 60%, 0 30%);
  --papel-tinta: #26221c;
  --papel-dano: #8a2c22;
  --papel-cura: #2d6a3e;
  --papel-selo: #5a3f8c;
  --papel-custo: #2c5578;
  --papel-tenue: #5d5a54;
  --mu-erro-texto: #f0897f;
  --mu-lombada: 236px;
  --rail: 206px;
  --lado: 388px;
  --barra-lista: 96px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--lb-font-sans); font-size: var(--lb-font-size-md); line-height: 1.45; color: var(--lb-color-parchment); background: var(--lb-color-ink); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
[aria-disabled='true'], button:disabled { cursor: not-allowed; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
:focus-visible { outline: none; box-shadow: var(--lb-shadow-focus); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-family: var(--lb-font-utility); font-variant-numeric: tabular-nums; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ------------------------------------------------------------ barra do protótipo (não é do app) */
.proto { min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #0c0c0e; border-bottom: 1px dashed var(--lb-gr-filete-forte); font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); white-space: nowrap; overflow-x: auto; }
.proto strong { color: var(--lb-color-parchment); font-weight: 600; }
.proto__grupo { display: flex; align-items: center; gap: 4px; }
.proto__b { min-height: 28px; padding: 0 10px; border-radius: var(--lb-radius-full); border: 1px solid var(--lb-gr-filete-forte); color: var(--lb-color-parchment-dim); transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-gr-ease-out); }
.proto__b:active { transform: scale(0.97); }
.proto__b[aria-pressed='true'] { background: var(--lb-color-brass-soft); border-color: var(--lb-gr-filete-latao); color: var(--lb-color-parchment); }
.proto__sobra { margin-left: auto; }

/* ------------------------------------------------------------ o livro: lombada + página */
.livro { display: grid; grid-template-columns: var(--mu-lombada) minmax(0, 1fr); min-height: calc(100vh - 44px); }
.lombada { position: sticky; top: 0; align-self: start; height: calc(100vh - 44px); padding: 22px 14px; background: linear-gradient(180deg, #17150f, #121110); border-right: 1px solid var(--lb-gr-filete); }
.lombada__tit { font-family: var(--lb-font-display); font-size: 19px; line-height: 1.15; padding: 0 8px; }
.lombada__sub { padding: 2px 8px 16px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.marc { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 34px; padding: 0 10px; border-radius: var(--lb-radius-sm); color: var(--lb-color-parchment-faint); text-align: left; text-decoration: none; }
.marc--vivo { color: var(--lb-color-parchment-dim); }
.marc[aria-current='page'] { background: var(--lb-color-brass-soft); color: var(--lb-color-parchment); box-shadow: inset 2px 0 0 var(--lb-color-brass); }
@media (hover: hover) and (pointer: fine) { .marc--vivo:hover:not([aria-current='page']) { background: var(--lb-gr-hover); color: var(--lb-color-parchment); } }
.lombada__nota { margin-top: 14px; padding: 0 10px; font-size: var(--lb-font-size-xs); color: var(--lb-color-parchment-faint); }

.pg { padding: 26px 30px 120px; max-width: 1520px; }
.pg-cab { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 18px; }
.pg-cab__txt { flex: 1 1 380px; min-width: 0; }
.pg-titulo { font-family: var(--lb-font-display); font-size: 30px; font-weight: 400; line-height: 1.1; }
.pg-sub { margin-top: 6px; max-width: 64ch; color: var(--lb-color-parchment-dim); font-size: 14px; line-height: 1.55; }
.pg-acoes { display: flex; gap: 8px; align-items: center; }

/* ------------------------------------------------------------ primitivos (os do editor) */
.bt { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 34px; padding: 0 13px; border-radius: var(--lb-radius-sm); background: var(--lb-gr-cartao-alto); color: var(--lb-color-parchment); border: 1px solid var(--lb-gr-filete-forte); font-weight: 500; white-space: nowrap; text-decoration: none; transition: background-color var(--lb-motion-fast) ease, border-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-gr-ease-out); }
.bt:active:not([aria-disabled='true']) { transform: scale(0.97); }
.bt[aria-disabled='true'] { opacity: 0.45; }
.bt--primario { background: linear-gradient(180deg, var(--lb-gr-latao-1), var(--lb-gr-latao-2)); border-color: rgba(0, 0, 0, 0.35); color: var(--lb-color-brass-contrast); font-weight: 600; box-shadow: var(--lb-shadow-bevel); }
.bt--fantasma { background: transparent; border-color: transparent; color: var(--lb-color-parchment-dim); }
.bt--latao { background: var(--lb-color-brass-soft); border-color: var(--lb-gr-filete-latao); color: var(--lb-color-brass-bright); font-weight: 600; }
.bt--perigo { background: transparent; border-color: transparent; color: var(--mu-erro-texto); }
.bt--p { min-height: 28px; padding: 0 9px; font-size: var(--lb-font-size-sm); }
.bt--ic { width: 30px; min-height: 30px; padding: 0; background: transparent; border-color: transparent; color: var(--lb-color-parchment-faint); }
.bt .ic { width: 15px; height: 15px; }
.bt kbd { font: 500 10px / 1 var(--lb-font-utility); padding: 2px 4px; border-radius: 3px; border: 1px solid currentColor; opacity: 0.55; }
.bt__n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--lb-radius-full); background: var(--lb-color-brass-soft); color: var(--lb-color-brass-bright); font: 600 10.5px / 1 var(--lb-font-utility); }
@media (hover: hover) and (pointer: fine) {
  .bt:hover:not([aria-disabled='true']) { border-color: var(--lb-gr-filete-latao); }
  .bt--fantasma:hover:not([aria-disabled='true']), .bt--ic:hover { background: var(--lb-gr-hover); border-color: transparent; color: var(--lb-color-parchment); }
  .bt--perigo:hover:not([aria-disabled='true']) { background: var(--lb-color-ember-soft); border-color: transparent; }
}
.entrada { width: 100%; min-height: 34px; padding: 5px 10px; border-radius: var(--lb-radius-sm); background: var(--lb-gr-campo); border: 1px solid var(--lb-gr-filete-forte); color: var(--lb-color-parchment); transition: border-color var(--lb-motion-fast) ease; }
.entrada:focus-visible { border-color: var(--lb-color-brass); box-shadow: none; }
.entrada[aria-invalid='true'] { border-color: var(--lb-color-ember); }
textarea.entrada { resize: vertical; min-height: 72px; line-height: 1.5; }
select.entrada { width: auto; padding-right: 24px; }
.link { color: var(--lb-color-brass-bright); text-decoration: underline; text-decoration-color: var(--lb-gr-filete-latao); text-underline-offset: 3px; border-radius: 3px; font-size: inherit; }
@media (hover: hover) and (pointer: fine) { .link:hover { text-decoration-color: currentColor; } }
.dica { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.erro { font-size: var(--lb-font-size-sm); color: var(--mu-erro-texto); }

/* ------------------------------------------------------------ as três colunas */
.bib { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr) var(--lado); gap: 22px; align-items: start; }

/* a coluna das fichas: filtro "quem tem" e alvo do arrasto */
.rail { position: sticky; top: 12px; display: grid; gap: 2px; max-height: calc(100vh - 24px); overflow: auto; padding: 2px 2px 12px; }
.rail__tit { font-family: var(--lb-font-display); font-size: 16px; padding: 2px 8px 6px; }
.rail__sep { margin: 12px 8px 4px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.ficha { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: 9px; width: 100%; min-height: 36px; padding: 4px 8px; border-radius: var(--lb-radius-sm); text-align: left; color: var(--lb-color-parchment-dim); transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, box-shadow var(--lb-motion-fast) ease; }
.ficha--geral { grid-template-columns: 24px minmax(0, 1fr) auto; }
.ficha__nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ficha__n { font: 500 var(--lb-font-size-sm) / 1 var(--lb-font-utility); color: var(--lb-color-parchment-faint); font-variant-numeric: tabular-nums; }
.ficha__dica { grid-column: 2 / -1; font-size: var(--lb-font-size-xs); line-height: 1.3; color: var(--lb-color-brass-bright); }
.ficha[aria-pressed='true'] { background: var(--lb-color-brass-soft); color: var(--lb-color-parchment); box-shadow: inset 2px 0 0 var(--lb-color-brass); }
.ficha[data-alvo='sim'] { background: var(--lb-color-brass-soft); color: var(--lb-color-parchment); box-shadow: inset 0 0 0 1px var(--lb-color-brass); }
.ficha[data-alvo='nao'] { box-shadow: inset 0 0 0 1px var(--lb-gr-filete-forte); }
.ficha[data-alvo='nao'] .ficha__dica { color: var(--lb-color-parchment-faint); }
.ficha.is-recebeu { animation: brilho 1.6s ease-out; }
.ficha .simb { width: 22px; height: 22px; display: grid; place-items: center; color: var(--lb-color-parchment-faint); }
@media (hover: hover) and (pointer: fine) { .ficha:hover:not([aria-pressed='true']) { background: var(--lb-gr-hover); color: var(--lb-color-parchment); } }
.rail__nota { margin: 10px 8px 0; font-size: var(--lb-font-size-xs); color: var(--lb-color-parchment-faint); line-height: 1.45; }
.rail.is-arrastando .ficha:not(.ficha--geral) { box-shadow: inset 0 0 0 1px var(--lb-gr-filete); }

.av { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font: 600 10.5px / 1 var(--lb-font-utility); color: #191612; background: var(--cor, #a2a09a); flex: none; }

/* a lista: barra + grupos + linhas */
.lista-col { min-width: 0; }
.barra { position: sticky; top: 0; z-index: 3; display: grid; gap: 10px; padding: 10px 0 12px; background: var(--lb-color-ink); box-shadow: 0 1px 0 var(--lb-gr-filete); }
.barra__l1 { display: flex; gap: 8px; align-items: center; }
.busca { position: relative; flex: 1 1 auto; display: flex; align-items: center; }
.busca .ic { position: absolute; left: 10px; color: var(--lb-color-parchment-faint); pointer-events: none; }
.busca .entrada { padding-left: 32px; padding-right: 34px; }
.busca kbd, .busca .bt--ic { position: absolute; right: 6px; }
.busca kbd { font: 500 11px / 1 var(--lb-font-utility); padding: 3px 6px; border-radius: 4px; border: 1px solid var(--lb-gr-filete-forte); color: var(--lb-color-parchment-faint); }
.ordem { display: inline-flex; align-items: center; gap: 6px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); white-space: nowrap; }
.ficha-select { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 11px; border-radius: var(--lb-radius-full); border: 1px solid var(--lb-gr-filete-forte); color: var(--lb-color-parchment-dim); font-size: var(--lb-font-size-sm); transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-gr-ease-out); }
.chip small { font: 500 10.5px / 1 var(--lb-font-utility); color: var(--lb-color-parchment-faint); font-variant-numeric: tabular-nums; }
.chip:active { transform: scale(0.97); }
.chip[aria-pressed='true'] { background: var(--lb-color-brass-soft); border-color: var(--lb-gr-filete-latao); color: var(--lb-color-parchment); }
.chip[aria-pressed='true'] small { color: var(--lb-color-brass-bright); }
.chip[data-zero] { opacity: 0.5; }
.chips__sep { width: 1px; height: 18px; background: var(--lb-gr-filete-forte); margin: 0 4px; }
@media (hover: hover) and (pointer: fine) { .chip:hover:not([aria-pressed='true']) { color: var(--lb-color-parchment); background: var(--lb-gr-hover); } }
.resumo { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.resumo b { color: var(--lb-color-parchment-dim); font-weight: 500; }

.grupo { margin-top: 6px; }
.grupo__cab { position: sticky; top: var(--barra-lista); z-index: 2; display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 12px 6px 6px; background: var(--lb-color-ink); text-align: left; }
.grupo__cab .ic { align-self: center; width: 12px; height: 12px; color: var(--lb-color-parchment-faint); transition: transform var(--lb-motion-fast) ease; }
.grupo__cab[aria-expanded='false'] .ic { transform: rotate(-90deg); }
.grupo__nome { font-family: var(--lb-font-display); font-size: 17px; line-height: 1.2; }
.grupo__n { font: 500 var(--lb-font-size-sm) / 1 var(--lb-font-utility); color: var(--lb-color-parchment-faint); font-variant-numeric: tabular-nums; }
.grupo__dica { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.livro-sep { display: flex; align-items: center; gap: 10px; margin: 22px 6px 0; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.livro-sep::after { content: ''; flex: 1; height: 1px; background: var(--lb-gr-filete); }

.linhas { display: grid; gap: 1px; }
.linha { position: relative; display: grid; grid-template-columns: 20px minmax(0, 1fr) 40px 56px; align-items: center; column-gap: 12px; min-height: 54px; padding: 7px 10px 7px 12px; border-radius: 8px; cursor: default; transition: background-color var(--lb-motion-fast) ease; }
.linha__ic { display: grid; place-items: center; color: var(--cor, var(--lb-color-parchment-dim)); }
.linha__ic .ic { width: 17px; height: 17px; }
.linha__main { min-width: 0; display: grid; gap: 1px; }
.linha__l1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.linha__nome { font-family: var(--lb-font-display); font-size: 16px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.linha__chips { margin-left: auto; display: flex; gap: 4px; flex: none; }
.linha__frase { font-size: 12.5px; line-height: 1.4; color: var(--lb-color-parchment-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linha__frase--texto { font-style: italic; color: var(--lb-color-parchment-faint); }
.linha[aria-selected='true'] { background: var(--lb-gr-cartao-alto); box-shadow: inset 2px 0 0 var(--lb-color-brass); }
.linha[aria-selected='true'] .linha__frase { color: var(--lb-color-parchment); }
.linha.is-arrastada { opacity: 0.45; }
.linha.is-novo { animation: brilho 1.6s ease-out; }
@keyframes brilho { from { box-shadow: inset 0 0 0 1.5px var(--lb-color-brass); } to { box-shadow: inset 0 0 0 1.5px rgba(224, 164, 74, 0); } }
@media (hover: hover) and (pointer: fine) { .linha:hover:not([aria-selected='true']) { background: var(--lb-gr-hover); } .linha { cursor: grab; } }
.ch { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 4px; background: var(--lb-color-stone-raised); border: 1px solid var(--lb-gr-filete); font: 500 11px / 1 var(--lb-font-utility); color: var(--lb-color-parchment-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ch[data-c='sp'] { color: var(--lb-color-tide); }
.ch[data-c='over'] { color: var(--lb-color-ember); border-color: rgba(226, 100, 90, 0.3); }
.ch[data-c='dano'] { color: #e89a8f; }
.ch[data-c='fraco'] { color: var(--lb-color-parchment-faint); background: transparent; }
.marca { flex: none; font: 500 var(--lb-font-size-xs) / 1.6 var(--lb-font-utility); padding: 0 6px; border-radius: var(--lb-radius-full); background: var(--lb-color-tide-soft); color: var(--lb-color-tide); }
.gl { display: inline-flex; align-items: center; gap: 3px; justify-self: start; color: var(--lb-color-parchment-faint); font: 500 10.5px / 1 var(--lb-font-utility); }
.glifo { width: 24px; height: 24px; flex: none; }
.gl--falta .glifo { opacity: 0.9; }
.donos { display: flex; justify-content: flex-end; }
.donos .av { width: 20px; height: 20px; font-size: 10px; box-shadow: 0 0 0 2px var(--lb-color-ink); }
.donos .av + .av { margin-left: -5px; }
.linha[aria-selected='true'] .donos .av { box-shadow: 0 0 0 2px var(--lb-gr-cartao-alto); }
.donos__mais { margin-left: 3px; align-self: center; font: 500 10.5px / 1 var(--lb-font-utility); color: var(--lb-color-parchment-faint); }

/* vazio, carregando, erro */
.vazio { display: grid; justify-items: start; gap: 12px; padding: 28px 22px; margin-top: 12px; border: 1px dashed var(--lb-gr-filete-forte); border-radius: var(--lb-radius-md); color: var(--lb-color-parchment-dim); max-width: 62ch; }
.vazio h2 { font-family: var(--lb-font-display); font-size: 18px; font-weight: 400; color: var(--lb-color-parchment); }
.vazio__acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.esq { height: 54px; margin-top: 1px; border-radius: 8px; background: linear-gradient(90deg, var(--lb-color-stone-sunken), var(--lb-color-stone-solid), var(--lb-color-stone-sunken)); background-size: 200% 100%; animation: esq 1.4s linear infinite; }
@keyframes esq { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.faixa { display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin-bottom: 14px; border-radius: var(--lb-radius-md); background: var(--lb-color-ember-soft); border: 1px solid rgba(226, 100, 90, 0.35); color: var(--lb-color-parchment); }
.faixa .ic { color: var(--lb-color-ember); }
.faixa p { flex: 1; }

/* ------------------------------------------------------------ a coluna da direita: papel, ações, quem tem */
.lado { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; padding: 2px 2px 20px; display: grid; gap: 14px; align-content: start; scrollbar-width: thin; }
.papel { position: relative; padding: 18px 20px 16px; background: var(--bt-papel); color: var(--papel-tinta); clip-path: var(--bt-rasgo-caixa); }
.papel__nome { font-family: var(--lb-font-display); font-size: 23px; line-height: 1.15; overflow-wrap: anywhere; padding-right: 64px; }
.papel__linha { margin-top: 3px; font: 500 var(--lb-font-size-sm) / 1.4 var(--lb-font-utility); color: var(--papel-tenue); letter-spacing: 0.02em; }
.papel__frase { margin-top: 10px; font-size: 14px; line-height: 1.55; }
.papel__desc { margin-top: 9px; font-size: 12.5px; line-height: 1.5; font-style: italic; color: var(--papel-tenue); }
.papel__extras { margin-top: 9px; display: grid; gap: 2px; font-size: var(--lb-font-size-sm); color: var(--papel-tenue); }
.papel__extras b { color: var(--papel-tinta); font-weight: 600; }
.papel__selo { position: absolute; top: 14px; right: 14px; padding: 1px 7px; border: 1.5px solid var(--papel-selo); border-radius: 4px; font: 600 var(--lb-font-size-xs) / 1.5 var(--lb-font-utility); letter-spacing: var(--lb-font-tracking-wide); color: var(--papel-selo); transform: rotate(4deg); }
.papel__selo[data-c='over'] { border-color: var(--papel-dano); color: var(--papel-dano); }
.papel__selo[data-c='acervo'] { border-color: var(--papel-custo); color: var(--papel-custo); }
.pd[data-c='d'] { color: var(--papel-dano); font-weight: 600; }
.pd[data-c='k'] { color: var(--papel-cura); font-weight: 600; }
.pd[data-c='s'] { color: var(--papel-selo); font-weight: 600; }
.pd[data-c='c'] { color: var(--papel-custo); font-weight: 600; }
.alc { display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--lb-color-line); border-radius: 12px; background: #121215; }
.alc .glifo { width: 66px; height: 66px; }
.alc p { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }
.alc b { color: var(--lb-color-parchment); font-weight: 500; }
.alc--falta { grid-template-columns: 1fr; border-style: dashed; }
.acoes { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 6px; }
.acoes .bt { min-height: 38px; }
.motivo { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.sec { display: grid; gap: 8px; }
.sec__tit { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec__tit h3 { font-family: var(--lb-font-display); font-size: 16px; font-weight: 400; }
.quem { display: grid; gap: 2px; }
.quem li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 36px; padding: 2px 4px 2px 6px; border-radius: var(--lb-radius-sm); }
.quem li:nth-child(odd) { background: rgba(255, 255, 255, 0.02); }
.quem__onde { display: block; font-size: var(--lb-font-size-xs); color: var(--lb-color-parchment-faint); }
.rodape { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding-top: 12px; border-top: 1px solid var(--lb-gr-filete); }
.lado__vazio { padding: 22px 18px; border: 1px dashed var(--lb-gr-filete-forte); border-radius: var(--lb-radius-md); color: var(--lb-color-parchment-dim); }

/* o teste no boneco (de mentira) */
.teste { border: 1px solid var(--lb-color-line); border-radius: 12px; background: #121215; overflow: hidden; }
.teste__cab { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--lb-gr-filete); }
.teste__cab h3 { font-family: var(--lb-font-display); font-size: 15px; font-weight: 400; margin-right: auto; }
.teste__corpo { display: grid; gap: 10px; padding: 10px 12px 12px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }
.teste__linha { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.dado { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 6px; background: var(--lb-gr-cartao-alto); border: 1px solid var(--lb-gr-filete-latao); color: var(--lb-color-brass-bright); font: 600 14px / 1 var(--lb-font-utility); }
.dado[data-rola] { animation: rola 240ms var(--lb-gr-ease-out); }
@keyframes rola { from { transform: rotate(-90deg) scale(0.92); opacity: 0.4; } to { transform: none; opacity: 1; } }
.barras { display: grid; gap: 5px; }
.barra-v { display: grid; grid-template-columns: 54px minmax(0, 1fr) 78px; gap: 8px; align-items: center; }
.barra-v__t { position: relative; height: 7px; border-radius: 4px; background: var(--lb-gr-campo); overflow: hidden; box-shadow: inset 0 0 0 1px var(--lb-gr-filete); }
.barra-v__f { position: absolute; inset: 0 auto 0 0; width: 100%; border-radius: 4px; background: #d0574d; transform-origin: left center; transition: transform 320ms var(--lb-gr-ease-out); }
.barra-v--escudo .barra-v__f { background: var(--lb-color-tide); }
.barra-v .num { text-align: right; color: var(--lb-color-parchment); }

/* a ferramenta aberta: lista de propostas */
.rev { display: grid; gap: 12px; }
.rev__cab { display: grid; gap: 4px; }
.rev__cab h2 { font-family: var(--lb-font-display); font-size: 20px; font-weight: 400; line-height: 1.2; }
.rev__cab p { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }
.rev__lista { display: grid; gap: 6px; }
.prop { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px 10px; padding: 10px 12px; border-radius: var(--lb-radius-md); background: var(--lb-gr-cartao); border: 1px solid var(--lb-gr-filete); }
.prop[data-dec='nao'], .prop[data-dec='depois'] { background: transparent; }
.prop__gl { grid-row: span 3; align-self: start; padding-top: 2px; color: var(--lb-color-parchment-faint); }
.prop__gl .glifo { width: 28px; height: 28px; }
.prop__nome { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.prop__nome .link { font-family: var(--lb-font-display); font-size: 15px; color: var(--lb-color-parchment); text-decoration-color: var(--lb-gr-filete-forte); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prop__oque { font-size: 12.5px; color: var(--lb-color-parchment); }
.prop__trecho { font-size: var(--lb-font-size-sm); font-style: italic; color: var(--lb-color-parchment-faint); }
.cert { flex: none; font: 500 var(--lb-font-size-xs) / 1.6 var(--lb-font-utility); padding: 0 6px; border-radius: var(--lb-radius-full); }
.cert[data-c='alta'] { background: var(--lb-color-online-soft); color: var(--lb-color-online); }
.cert[data-c='media'] { background: var(--lb-color-brass-soft); color: var(--lb-color-brass-bright); }
.cert[data-c='baixa'] { background: var(--lb-color-ember-soft); color: var(--mu-erro-texto); }
.seg { justify-self: start; display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; margin-top: 4px; border-radius: var(--lb-radius-sm); background: var(--lb-gr-campo); border: 1px solid var(--lb-gr-filete); }
.seg__o { min-height: 26px; padding: 0 10px; border-radius: 4px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-gr-ease-out); }
.seg__o:active { transform: scale(0.97); }
.seg__o[aria-checked='true'] { background: var(--lb-gr-cartao-alto); color: var(--lb-color-brass-bright); box-shadow: inset 0 0 0 1px var(--lb-gr-filete-latao); }
@media (hover: hover) and (pointer: fine) { .seg__o:hover:not([aria-checked='true']) { color: var(--lb-color-parchment); background: var(--lb-gr-hover); } }
.rev__pe { position: sticky; bottom: -20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 0 20px; background: var(--lb-color-ink); box-shadow: 0 -1px 0 var(--lb-gr-filete); }
.rev__pe .dica { margin-left: auto; }

/* ------------------------------------------------------------ menus, "Dar a...", janelas, avisos */
.pop { position: fixed; z-index: 40; min-width: 240px; padding: 6px; border-radius: var(--lb-radius-md); background: var(--lb-color-stone-raised); border: 1px solid var(--lb-gr-filete-forte); box-shadow: var(--lb-shadow-float); opacity: 0; transform: scale(0.97) translateY(-4px); transform-origin: top right; transition: opacity 150ms var(--lb-gr-ease-out), transform 150ms var(--lb-gr-ease-out); }
.pop[data-lado='esq'] { transform-origin: top left; }
.pop[data-aberto] { opacity: 1; transform: none; }
.pop[data-saindo] { transition-duration: 100ms; }
.pop.sem-anim { transition: none; }
.menu__item { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; width: 100%; padding: 8px 10px; border-radius: var(--lb-radius-sm); text-align: left; }
.menu__item .ic { color: var(--lb-color-parchment-faint); }
.menu__nome { color: var(--lb-color-parchment); }
.menu__faz { grid-column: 2 / 3; font-size: var(--lb-font-size-xs); color: var(--lb-color-parchment-faint); }
.menu__n { grid-row: 1 / span 2; grid-column: 3; font: 500 var(--lb-font-size-sm) / 1.2 var(--lb-font-utility); color: var(--lb-color-brass-bright); text-align: right; white-space: nowrap; }
.menu__item[aria-disabled='true'] { opacity: 0.5; }
.menu__item[aria-disabled='true'] .menu__n { color: var(--lb-color-online); }
.menu__item:focus-visible, .menu__item[data-ativo] { background: var(--lb-gr-hover-forte); box-shadow: none; }
.menu__nota { padding: 8px 10px 4px; margin-top: 4px; border-top: 1px solid var(--lb-gr-filete); font-size: var(--lb-font-size-xs); color: var(--lb-color-parchment-faint); max-width: 330px; }
.dar { width: 300px; padding: 8px; }
.dar .entrada { margin-bottom: 6px; }
.dar__lista { max-height: 340px; overflow: auto; }
.dar__grupo { padding: 8px 8px 3px; font-size: var(--lb-font-size-xs); color: var(--lb-color-parchment-faint); }
.dar__op { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 6px 8px; border-radius: var(--lb-radius-sm); cursor: pointer; }
.dar__op[aria-selected='true'] { background: var(--lb-gr-hover-forte); box-shadow: inset 0 0 0 1px var(--lb-gr-filete-latao); }
.dar__op[aria-disabled='true'] { cursor: not-allowed; color: var(--lb-color-parchment-faint); }
.dar__op small { font-size: var(--lb-font-size-xs); color: var(--lb-color-parchment-faint); }
.dar__op[aria-disabled='true'] small { color: var(--lb-color-online); }
.dar__vazio { padding: 12px 8px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }

.fundo { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: rgba(6, 6, 8, 0.62); opacity: 0; transition: opacity 200ms ease; }
.fundo[data-aberto] { opacity: 1; }
.janela { width: min(460px, 100%); display: grid; gap: 14px; padding: 20px 22px; border-radius: var(--lb-radius-lg); background: var(--lb-color-stone-solid); border: 1px solid var(--lb-gr-filete-forte); box-shadow: var(--lb-shadow-float); transform: scale(0.96); transition: transform 200ms var(--lb-gr-ease-out); }
.fundo[data-aberto] .janela { transform: none; }
.janela h2 { font-family: var(--lb-font-display); font-size: var(--lb-font-size-xl); font-weight: 400; }
.janela p { color: var(--lb-color-parchment-dim); }
.campo { display: grid; gap: 5px; }
.campo label { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }
.janela__pe { display: flex; justify-content: flex-end; gap: 8px; }

.avisos { position: fixed; right: 22px; bottom: 22px; z-index: 60; display: grid; gap: 8px; justify-items: end; }
.aviso { display: flex; align-items: center; gap: 12px; max-width: 460px; min-height: 46px; padding: 8px 8px 8px 14px; border-radius: var(--lb-radius-md); background: var(--lb-color-stone-raised); border: 1px solid var(--lb-gr-filete-forte); box-shadow: var(--lb-shadow-float); transform: translateY(0); opacity: 1; transition: transform 200ms var(--lb-gr-ease-out), opacity 200ms var(--lb-gr-ease-out); }
.aviso[data-entrando] { transform: translateY(110%); opacity: 0; }
.aviso[data-saindo] { transform: translateY(40%); opacity: 0; transition-duration: 140ms; }
.aviso p { flex: 1; }
.aviso .ic { color: var(--lb-color-online); }

.fantasma { position: fixed; top: -200px; left: -400px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: var(--lb-radius-full); background: var(--lb-gr-cartao-alto); border: 1px solid var(--lb-color-brass); color: var(--lb-color-parchment); font-family: var(--lb-font-display); font-size: 15px; }

@media (max-width: 1500px) {
  :root { --rail: 184px; --lado: 344px; }
  .bib { gap: 18px; }
  .pg { padding-left: 24px; padding-right: 24px; }
  .linha__chips .ch[data-c='fraco'] { display: none; }
}
@media (max-width: 1365px) {
  :root { --lado: 356px; }
  .bib { grid-template-columns: minmax(0, 1fr) var(--lado); }
  .rail { display: none; }
  .ficha-select { display: inline-flex; }
}

  .livro { grid-template-columns: minmax(0, 1fr); }
  .lombada { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .pop, .janela, .aviso, .aviso[data-entrando], .aviso[data-saindo] { transform: none !important; }
  .dado[data-rola], .esq { animation: none; }
  .barra-v__f { transition: none; }
}

</div>

  <main class="pg" id="pg">

        <span id="bt-nova-lugar"></span>
      </div>
    </header>
    <div id="faixa"></div>
    <div class="bib" id="bib">
      <aside class="rail" id="rail" aria-label="Fichas: filtrar por quem tem, ou soltar aqui para dar"></aside>
      <section class="lista-col" aria-labelledby="pg-titulo">
        <div class="barra" id="barra">
          <div class="barra__l1">
            <div class="busca">
              <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
              <label class="sr" for="busca" id="busca-rot">Buscar</label>

              <button type="button" class="bt bt--ic" id="busca-limpar" data-a="limpar-busca" aria-label="Limpar a busca" hidden><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
            </div>
            <label class="ordem ficha-select">Quem tem <select class="entrada" id="ficha-select" data-a="onde-select"></select></label>

              </select>
            </label>
          </div>
          <div class="chips" id="chips" role="group" aria-label="Mostrar só um grupo"></div>
        </div>
        <p class="sr" role="status" id="anuncio"></p>
        <div id="lista"></div>
      </section>
      <aside class="lado" id="lado" aria-label="A escolhida"></aside>
    </div>
  </main>
</div>
<div class="avisos" id="avisos" role="region" aria-label="Avisos (F8)"></div>
<div id="camada"></div>
<span class="fantasma" id="fantasma" aria-hidden="true"></span>

/* ============================================================ o alcance (formaNaTela.ts, como no editor) */
const LADO = 13, MEIO = 6;
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const cheb = (ax, ay, bx, by) => Math.max(Math.abs(ax - bx), Math.abs(ay - by));
function celulas(al) {
  const area = new Set(), alcance = new Set(), k = (x, y) => `${x},${y}`;
  const [dx, dy] = DIRS[0];
  const n = al.n || 1, raio = al.raio ?? 1;
  const dentro = (x, y) => x >= 0 && y >= 0 && x < LADO && y < LADO;
  const varre = (fn) => { for (let y = 0; y < LADO; y++) for (let x = 0; x < LADO; x++) fn(x, y); };
  switch (al.f) {
    case 'alvo': varre((x, y) => { const d = cheb(x, y, MEIO, MEIO); if (d >= 1 && d <= n) alcance.add(k(x, y)); }); break;
    case 'linha': for (let i = 1; i <= n; i++) { const x = MEIO + dx * i, y = MEIO + dy * i; if (dentro(x, y)) area.add(k(x, y)); } break;
    case 'volta': varre((x, y) => { const d = cheb(x, y, MEIO, MEIO); if (d >= 1 && d <= n) area.add(k(x, y)); }); break;
    case 'cruz': for (const [ax, ay] of DIRS) for (let i = 1; i <= n; i++) { const x = MEIO + ax * i, y = MEIO + ay * i; if (dentro(x, y)) area.add(k(x, y)); } break;
    case 'leque': for (let i = 1; i <= n; i++) for (let j = -(i - 1); j <= i - 1; j++) { const x = MEIO + dx * i - dy * j, y = MEIO + dy * i + dx * j; if (dentro(x, y)) area.add(k(x, y)); } break;
    case 'ponto': case 'ficha': {
      varre((x, y) => { const d = cheb(x, y, MEIO, MEIO); if (d >= (al.f === 'ficha' ? 1 : 0) && d <= n) alcance.add(k(x, y)); });
      const c = { x: MEIO, y: Math.max(0, MEIO - Math.min(n, 3)) };
      varre((x, y) => { if (cheb(x, y, c.x, c.y) <= raio) area.add(k(x, y)); });
      break;
    }
    case 'si': area.add(k(MEIO, MEIO)); break;
  }
  return { area, alcance };
}
const glifoCache = new Map();
/* pequeno = o símbolo da forma (tamanho fixo, como no editor); real = a grade 13x13 com o tamanho de verdade */
function glifo(al, verde, real) {
  const chave = `${al.f}|${al.n}|${al.raio}|${verde ? 1 : 0}|${real ? 1 : 0}`;
  if (glifoCache.has(chave)) return glifoCache.get(chave);
  const usado = real ? al : { f: al.f, n: 2, raio: 1 };
  const { area, alcance } = celulas(usado);
  const cor = verde ? '#8fe08f' : '#3b8ff0';
  const de = real ? 0 : 3, ate = real ? 12 : 9, passo = real ? 26 / 13 : 3.7, lado = real ? 1.6 : 3.1;
  // uma <path> por cor (e não 49 <rect>): a lista inteira fica com ~10x menos nós para o navegador arrumar
  const porCor = new Map();
  for (let y = de; y <= ate; y++) for (let x = de; x <= ate; x++) {
    const k = `${x},${y}`;
    const fill = x === MEIO && y === MEIO ? '#eceae4' : area.has(k) ? cor : alcance.has(k) ? (verde ? 'rgba(143,224,143,0.42)' : 'rgba(59,143,240,0.42)') : 'rgba(255,255,255,0.07)';
    porCor.set(fill, (porCor.get(fill) || '') + `M${((x - de) * passo + 0.3).toFixed(2)} ${((y - de) * passo + 0.3).toFixed(2)}h${lado}v${lado}h-${lado}z`);
  }
  const s = [...porCor].map(([fill, d]) => `<path fill="${fill}" d="${d}"/>`).join('');
  const svg = `<svg class="glifo" viewBox="0 0 26 26" aria-hidden="true">${s}</svg>`;
  glifoCache.set(chave, svg);
  return svg;
}
const GLIFO_FALTA = '<svg class="glifo" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="4" fill="none" stroke="rgba(236,234,228,0.28)" stroke-dasharray="3 2.4"/><path d="M10.4 10.2a2.7 2.7 0 1 1 3.6 2.5c-.7.3-1 .8-1 1.5v.5M13 17.6v.1" fill="none" stroke="rgba(236,234,228,0.5)" stroke-width="1.4" stroke-linecap="round"/></svg>';
function fraseAlcance(al) {
  const n = al.n, c = (x) => `${x} ${x === 1 ? 'casa' : 'casas'}`;
  switch (al.f) {

    case 'linha': return `em linha reta, ${c(n)} à frente`;

    case 'ficha': return `numa ficha a até ${c(n)} e ${c(al.raio || 1)} em volta dela`;

}

/* ============================================================ desenhar: chips e lista */
function desenharChips(base) {
  if (S.estado !== 'normal') { document.getElementById('chips').innerHTML = ''; return; }
  const n = (g) => base.filter((e) => e.g === g).length;
  let h = `<button type="button" class="chip" data-a="grupo" data-v="todos" aria-pressed="${S.grupo === 'todos'}">${PAGINAS[S.pagina].todas} <small>${fmt(base.length)}</small></button>`;
  let jaSep = false;
  for (const g of grupos()) {
    if (g.livro && !jaSep) { h += '<span class="chips__sep" aria-hidden="true"></span>'; jaSep = true; }
    const q = n(g.id);
    h += `<button type="button" class="chip" data-a="grupo" data-v="${g.id}" aria-pressed="${S.grupo === g.id}"${q === 0 ? ' data-zero' : ''}>${g.nome} <small>${fmt(q)}</small></button>`;
  }
  document.getElementById('chips').innerHTML = h;
}
function htmlLinha(e) {
  const sel = S.sel[S.pagina] === e.id;
  const cor = COR[iconeDe(e)] || COR[e.g];
  const frase = e.texto || e.livro ? `<span class="linha__frase linha__frase--texto">${esc(plano(e.fr))}</span>` : `<span class="linha__frase">${esc(plano(e.fr))}</span>`;
  return `<div class="linha${S.novos.has(e.id) ? ' is-novo' : ''}" role="option" id="op-${e.id}" data-id="${e.id}" aria-selected="${sel}" tabindex="${sel ? 0 : -1}" draggable="${podeGravar()}" aria-keyshortcuts="D T E">
    <span class="linha__ic" style="--cor:${cor}">${ic(iconeDe(e))}</span>
    <span class="linha__main"><span class="linha__l1"><span class="linha__nome">${esc(e.nome)}</span>${e.acervo ? '<span class="marca">Do Acervo</span>' : ''}<span class="linha__chips">${chipsDe(e)}</span></span>${frase}</span>
    ${glDe(e)}${donosDe(e)}
  </div>`;
}
function desenharLista() {
  const alvo = document.getElementById('lista');
  const focoNaLista = document.activeElement && document.activeElement.closest && document.activeElement.closest('#lista');
  const focoId = focoNaLista && document.activeElement.dataset ? document.activeElement.dataset.id : null;
  const base = filtradas();
  desenharChips(base);
  const nome = PAGINAS[S.pagina].umNome;
  if (S.estado === 'lendo') {
    alvo.innerHTML = `<div aria-busy="true"><p class="sr">Lendo o livro…</p>${'<div class="esq"></div>'.repeat(9)}</div>`;
    return;
  }
  if (S.estado === 'erro') {
    alvo.innerHTML = `<div class="vazio"><h2>O livro não foi lido</h2><p>As ${nome[1]} aparecem aqui assim que o arquivo for lido. Feche o arquivo no outro programa e tente de novo.</p><div class="vazio__acoes"><button type="button" class="bt" data-a="tentar">Tentar de novo</button></div></div>`;
    return;
  }
  if (S.estado === 'vazio') {
    alvo.innerHTML = `<div class="vazio"><h2>O livro desta pasta ainda não tem ${nome[1]}</h2><p>Traga as que já estão nas fichas dos jogadores, ou crie a primeira do zero.</p><div class="vazio__acoes"><button type="button" class="bt" data-a="vazio-juntar">Juntar das fichas da pasta</button><button type="button" class="bt bt--primario" data-a="vazio-nova">${ic('mais')}${PAGINAS[S.pagina].nova}</button></div></div>`;
    return;
  }
  const lista = S.grupo === 'todos' ? base : base.filter((e) => e.g === S.grupo);
  anunciar(`${plural(lista.length, nome[0], nome[1])} na lista.`);
  if (!lista.length) {
    alvo.innerHTML = htmlNada();
    return;
  }
  const ord = ordenar(lista);
  let h = '<div role="listbox" aria-label="' + esc(PAGINAS[S.pagina].titulo) + '" id="listbox">';
  let jaSep = false, resta = limiteDaLista;
  for (const g of grupos()) {
    const doGrupo = ord.filter((e) => e.g === g.id).slice(0, Math.max(0, resta));

    h += `<div class="grupo" role="group" aria-labelledby="gc-${g.id}">
      <button type="button" class="grupo__cab" id="gc-${g.id}" data-a="dobrar" data-v="${g.id}" aria-expanded="${aberto}">${ic('seta')}<span class="grupo__nome">${g.nome}</span><span class="grupo__n">${fmt(ord.filter((e) => e.g === g.id).length)}</span><span class="grupo__dica">${g.dica}</span></button>

/* ============================================================ desenhar: a coluna da direita */
function papelHtml(e) {
  let linha, frase = comPecas(e.fr), selo = '';
  if (e.tipo === 'tecnica') {
    const adj = e.golpe && ADJ[e.golpe] ? ` ${ADJ[e.golpe]}` : '';
    linha = rotuloAcao(e) + adj;
    const custo = custoTxt(e);
    if (custo) frase += ` <span class="pd" data-c="c">${esc(custo)}</span>`;
    if (e.ac === 'overload') selo = '<span class="papel__selo" data-c="over">Overload</span>';
  } else if (e.tipo === 'pericia') linha = `Perícia de ${e.attr}`;
  else if (e.tipo === 'vantagem') linha = 'Vantagem';
  else if (e.tipo === 'desvantagem') linha = 'Desvantagem';
  else if (e.texto) linha = `${SINGULAR[e.g]}, sem efeito na batalha`;
  else if (e.tipo === 'arma') linha = `Arma ${e.cat === 'fogo' ? 'de fogo' : 'branca'}, dano ${e.dano}, ação ${e.ac}`;
  else linha = SINGULAR[e.g];
  if (e.acervo) selo = '<span class="papel__selo" data-c="acervo">Do Acervo</span>';
  const extras = [];
  if (e.req) extras.push(`<span><b>Pede:</b> ${esc(e.req)}.</span>`);
  if (e.extra) extras.push(`<span><b>Evolução:</b> ${esc(e.extra.replace(/^Evolui para /, ''))}</span>`);
  if (e.ligado) extras.push(`<span><b>Ligado ao Acervo:</b> ${esc(e.ligado)}</span>`);
  const desc = e.desc && !e.livro && normal(e.desc) !== normal(plano(e.fr)) ? `<p class="papel__desc">${esc(e.desc)}</p>` : '';
  return `<article class="papel" aria-label="Cartão de ${esc(e.nome)}">${selo}<h2 class="papel__nome">${esc(e.nome)}</h2><p class="papel__linha">${esc(linha)}</p><p class="papel__frase">${frase}</p>${desc}${extras.length ? `<p class="papel__extras">${extras.join('')}</p>` : ''}</article>`;
}
function alcanceHtml(e) {
  if (!temAlcance(e)) return '';
  if (!e.al) {
    if (!e.alP) return '';
    return `<div class="alc alc--falta"><p><b>Sem alcance ainda:</b> a mesa não confere a distância deste. ${podeGravar() ? '<button type="button" class="link" data-a="abrir-ferramenta" data-v="alcance">Dar alcance aos antigos</button> propõe um pelo texto.' : ''}</p></div>`;
  }
  return `<div class="alc">${glifo(e.al, ehVerde(e), true)}<p><b>Alcance:</b> ${esc(fraseAlcance(e.al))}.<br><span class="dica">${ehVerde(e) ? 'Verde: não dá dano.' : 'Azul forte: onde pega. Azul claro: até onde mira.'}</span></p></div>`;
}
function testavel(e) {
  if (e.tipo === 'tecnica') {
    if (e.g === 'passiva') return 'Passiva ainda não tem peças: o app lê a descrição. Não dá para testar.';
    if (e.g === 'reacao') return null;
    return null;
  }
  if (e.livro) return 'Perícias, vantagens e desvantagens viram vantagem ou desvantagem em testes: não há o que testar no boneco.';
  if (e.texto) return 'Este item não faz nada na batalha (é só texto): não há o que testar.';
  return null;
}
function desenharLado() {

  if (S.estado === 'lendo') { lado.innerHTML = '<div class="esq" style="height:220px"></div><div class="esq" style="height:38px"></div>'; return; }

  if (!e) {

    <section class="sec" aria-labelledby="quem-tit">
      <div class="sec__tit"><h3 id="quem-tit">Quem tem</h3><span class="dica">${donos.length ? `${plural(donos.length, 'ficha', 'fichas')}, ${onde.aba}` : 'só no livro'}</span></div>
      ${donos.length ? `<ul class="quem">${donos.map((f) => `<li>${av(f)}<span>${esc(f.nome)}<span class="quem__onde">${esc(f.sub)}</span></span><button type="button" class="bt bt--fantasma bt--p" data-a="tirar" data-v="${f.id}"${parado ? ' aria-disabled="true"' : ''}>Tirar da ficha</button></li>`).join('')}</ul>`
        : `<p class="dica">Ninguém tem ainda. Use “Dar a…” ou arraste a linha até um nome da coluna Fichas.</p>`}
    </section>
    <div class="rodape">
      <span class="dica">${e.acervo ? 'Mora no Acervo do app; o livro só mostra.' : 'Mora no livro desta pasta.'}</span>
      <button type="button" class="bt bt--perigo bt--p" data-a="apagar"${parado ? ' aria-disabled="true"' : ''}>${ic('lixo')}${e.acervo ? 'Apagar do Acervo' : 'Apagar do livro'}</button>
    </div>`;

/* ============================================================ o teste no boneco (de mentira, mínimo) */
const BONECO = { hp: 1000, escudo: 100 };
function htmlTeste(e) {
  const T = S.teste;
  const quem = [...e.donos][0] ? FICHA[[...e.donos][0]] : FICHA.aira;
  const res = T.res;
  let corpo;
  if (!res) corpo = `<p>${e.g === 'apoio' || ehVerde(e) ? `${esc(quem.nome)} usa em um aliado de treino.` : `${esc(quem.nome)} usa no boneco (HP 1000, Escudo 100). O boneco rola o d20 da reação.`}</p>`;
  else corpo = `<div class="teste__linha">${res.d !== null ? `<span class="dado" data-rola>${res.d}</span>` : ''}<span>${esc(res.txt)}</span></div>${res.barras ? `<div class="barras">
      <div class="barra-v barra-v--escudo"><span>Escudo</span><span class="barra-v__t"><span class="barra-v__f" style="transform:scaleX(${res.escudo / BONECO.escudo})"></span></span><span class="num">${res.escudo} / ${BONECO.escudo}</span></div>
      <div class="barra-v"><span>HP</span><span class="barra-v__t"><span class="barra-v__f" style="transform:scaleX(${res.hp / BONECO.hp})"></span></span><span class="num">${res.hp} / ${BONECO.hp}</span></div></div>` : ''}`;
  return `<section class="teste" aria-labelledby="teste-tit">
    <div class="teste__cab"><h3 id="teste-tit">Testar no boneco</h3><button type="button" class="bt bt--p" data-a="rolar">${ic('play')}${res ? 'Rolar de novo' : 'Usar agora'}</button><button type="button" class="bt bt--ic" data-a="fechar-teste" aria-label="Fechar o teste">${ic('x')}</button></div>
    <div class="teste__corpo" role="status">${corpo}</div>
  </section>`;
}
function rolarTeste(e) {
  const quem = [...e.donos][0] ? FICHA[[...e.donos][0]] : FICHA.aira;
  if (e.g === 'apoio' || e.g === 'reacao' || (ehVerde(e) && !e.danoN)) {
    S.teste.res = { d: null, txt: `${quem.nome} usou ${e.nome}: ${plano(e.fr)}`, barras: false };
    return;
  }
  if (!e.danoN) { S.teste.res = { d: null, txt: `${e.nome} não tem dano em número; o boneco recebe só o efeito: ${plano(e.fr)}`, barras: false }; return; }
  const d = 1 + Math.floor(Math.random() * 20);
  let mult = 1, como;
  if (e.ac === 'overload') { como = 'Overload não erra: o boneco toma tudo.'; }
  else if (d >= 20) { mult = 0; como = 'contra-atacou: não tomou nada.'; }
  else if (d >= 15) { mult = 0; como = 'esquivou: não tomou nada.'; }
  else if (d >= 10) { mult = 0.5; como = 'defendeu: tomou metade.'; }
  else { como = 'não reagiu a tempo: tomou tudo.'; }
  const dano = Math.round(e.danoN * mult);
  const fura = e.golpe === 'perfurante';
  const noEscudo = fura ? 0 : Math.min(BONECO.escudo, dano);
  const escudo = BONECO.escudo - noEscudo, hp = BONECO.hp - (dano - noEscudo);
  S.teste.res = { d: e.ac === 'overload' ? null : d, txt: `${e.ac === 'overload' ? '' : `d20 ${d}: `}${como} Dano ${dano}${fura && dano ? ', direto no HP (perfurante)' : ''}.`, barras: true, escudo, hp };
}

    feito: (n) => `${plural(n, 'arma ficou igual', 'armas ficaram iguais')} em todo lugar.` },

/* ============================================================ dar, tirar, apagar (com Desfazer) */
function dar(e, fichaId) {
  if (!podeGravar() || e.donos.has(fichaId)) return;
  e.donos.add(fichaId);
  S.ultimaFicha = fichaId;
  S.recebeu = fichaId;
  const f = FICHA[fichaId], onde = ondeEntra(e);
  empilhar(() => e.donos.delete(fichaId), onde.curto === 'Mochila' ? `${e.nome} foi para a mochila de ${f.nome}.` : `${e.nome} foi para a ficha de ${f.nome}, ${onde.aba}.`);
  renderTudo();
}
function tirar(e, fichaId) {
  e.donos.delete(fichaId);
  empilhar(() => e.donos.add(fichaId), `${e.nome} saiu da ficha de ${FICHA[fichaId].nome}.`);
  renderTudo();
}
function remover(e) {
  const lista = entradas(), i = lista.indexOf(e);
  if (i >= 0) lista.splice(i, 1);
  return i;
}
function apagar(e) {
  const lista = entradas();
  const vis = [...document.querySelectorAll('#lista .linha')].map((el) => el.dataset.id);
  const pos = vis.indexOf(e.id);
  const i = remover(e);
  S.sel[S.pagina] = vis[pos + 1] || vis[pos - 1] || null;
  empilhar(() => { lista.splice(i, 0, e); S.sel[S.pagina] = e.id; }, `${e.nome} saiu do livro.`);
  renderTudo();
}
function empilhar(desfazer, texto) {
  const item = { desfazer, feito: false };
  S.pilha.push(item);
  avisar(texto, item);
}
function desfazerItem(item) {
  if (!item || item.feito) return;
  item.feito = true;
  if (item.fecharAviso) item.fecharAviso();
  item.desfazer();
  S.pilha = S.pilha.filter((x) => x !== item);
  renderTudo();
  avisar('Desfeito.', null);
}

/* ============================================================ avisos (como o Sonner: Desfazer, pausa no ponteiro, F8) */
function avisar(texto, item) {
  const zona = document.getElementById('avisos');
  const el = document.createElement('div');
  el.className = 'aviso';
  el.setAttribute('role', 'status');
  el.dataset.entrando = '';
  el.innerHTML = `${ic('check')}<p>${esc(texto)}</p>${item ? '<button type="button" class="bt bt--p">Desfazer</button>' : ''}<button type="button" class="bt bt--ic" aria-label="Fechar o aviso">${ic('x')}</button>`;
  zona.appendChild(el);
  while (zona.children.length > 3) zona.firstElementChild.remove();
  requestAnimationFrame(() => requestAnimationFrame(() => delete el.dataset.entrando));
  let resta = item ? 6000 : 2500, inicio = Date.now(), timer;
  const fechar = () => { clearTimeout(timer); el.dataset.saindo = ''; setTimeout(() => el.remove(), 150); };
  const correr = () => { inicio = Date.now(); timer = setTimeout(fechar, resta); };
  el.addEventListener('pointerenter', () => { clearTimeout(timer); resta -= Date.now() - inicio; });
  el.addEventListener('pointerleave', correr);
  const [bDesf, bX] = item ? el.querySelectorAll('button') : [null, el.querySelector('button')];
  if (item) item.fecharAviso = fechar;
  if (bDesf) bDesf.addEventListener('click', () => desfazerItem(item));

  correr();
}

/* ============================================================ menus flutuantes */
let pop = null;
function fecharPop(devolver = true) {

function abrirPop(gatilho, html, { lado = 'dir', teclado = false, classe = '' } = {}) {
  fecharPop(false);

  el.innerHTML = html;

  const w = el.offsetWidth, h = el.offsetHeight;
  let left = lado === 'dir' ? r.right - w : r.left;
  left = Math.max(8, Math.min(left, innerWidth - w - 8));
  let top = r.bottom + 6;
  if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 6);
  el.style.left = left + 'px'; el.style.top = top + 'px';
  gatilho.setAttribute('aria-expanded', 'true');

  if (teclado) el.dataset.aberto = ''; else requestAnimationFrame(() => { if (pop && pop.el === el) el.dataset.aberto = ''; });

}

/* o "Dar a..." (lista de fichas com busca) */
function abrirDar(gatilho, teclado) {
  const e = selecionada();
  if (!e) return;
  const el = abrirPop(gatilho, `<label class="sr" for="dar-busca">Buscar ficha</label><input id="dar-busca" class="entrada" placeholder="Buscar ficha" autocomplete="off" role="combobox" aria-controls="dar-lista" aria-expanded="true" aria-autocomplete="list"><div class="dar__lista" id="dar-lista" role="listbox" aria-label="Dar ${esc(e.nome)} a"></div><p class="menu__nota">Variações de NPC herdam do modelo: dê ao modelo para dar a todas.</p>`, { classe: 'dar', teclado });

    const livres = vis.filter((f) => !e.donos.has(f.id));
    if (!livres.some((f) => f.id === ativo)) ativo = livres[0] ? livres[0].id : null;
    const grupo = (g, rot) => { const fs = vis.filter((f) => f.g === g); return fs.length ? `<p class="dar__grupo" role="presentation">${rot}</p>${fs.map((f) => { const tem = e.donos.has(f.id); return `<div class="dar__op" role="option" id="dar-${f.id}" data-ficha="${f.id}" aria-selected="${f.id === ativo}"${tem ? ' aria-disabled="true"' : ''}>${av(f)}<span>${esc(f.nome)}</span><small>${tem ? 'já tem' : f.id === S.ultimaFicha ? 'a última' : ''}</small></div>`; }).join('')}` : ''; };
    const lista = el.querySelector('#dar-lista');
    lista.innerHTML = vis.length ? grupo('jog', 'Jogadores') + grupo('npc', 'NPCs de combate') : `<p class="dar__vazio">Nenhuma ficha com “${esc(campo.value.trim())}”.</p>`;

/* ============================================================ desenhar tudo */

      || (marca.noLado && document.getElementById('bt-dar')) || document.getElementById('op-' + S.sel[S.pagina]);

}
function escolher(id, focar) {

  const antes = S.sel[S.pagina];
  S.sel[S.pagina] = id;
  if (S.teste && S.teste.id !== id) S.teste = null;
  const a = antes && document.getElementById('op-' + antes);
  if (a) { a.setAttribute('aria-selected', 'false'); a.tabIndex = -1; }
  const b = document.getElementById('op-' + id);
  if (b) { b.setAttribute('aria-selected', 'true'); b.tabIndex = 0; if (focar) { b.focus({ preventScroll: true }); b.scrollIntoView({ block: 'nearest' }); } }
  desenharLado();
}

/* ============================================================ eventos */
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]');
  if (pop && !ev.target.closest('.pop') && b !== pop.gatilho) fecharPop(false);
  const linha = ev.target.closest('.linha');
  if (linha) { escolher(linha.dataset.id, true); return; }
  if (!b) return;
  if (b.getAttribute('aria-disabled') === 'true') { ev.preventDefault(); return; }
  const a = b.dataset.a, v = b.dataset.v;
  const teclado = ev.detail === 0;
  switch (a) {
    case 'pagina': if (S.pagina !== v) { S.pagina = v; S.grupo = 'todos'; S.busca = ''; S.ordem = 'livro'; S.lado = 'cartao'; S.teste = null; document.getElementById('busca').value = ''; document.getElementById('ordem').value = 'livro'; renderTudo(); window.scrollTo(0, 0); } break;
    case 'estado': S.estado = v; S.lado = 'cartao'; renderTudo(); break;
    case 'tentar': S.estado = 'lendo'; renderTudo(); setTimeout(() => { S.estado = 'normal'; renderTudo(); }, 700); break;
    case 'grupo': S.grupo = v; desenharLista(); break;
    case 'onde': S.onde = S.onde === v && FICHA[v] ? 'todas' : v; desenharRail(); desenharLista(); document.querySelector(`.ficha[data-v="${v}"]`)?.focus(); break;
    case 'dobrar': if (S.fechados.has(v)) S.fechados.delete(v); else S.fechados.add(v); desenharLista(); document.getElementById('gc-' + v)?.focus(); break;
    case 'limpar-busca': S.busca = ''; document.getElementById('busca').value = ''; desenharLista(); document.getElementById('busca').focus(); syncBusca(); break;
    case 'limpar-tudo': S.busca = ''; S.grupo = 'todos'; S.onde = 'todas'; document.getElementById('busca').value = ''; syncBusca(); desenharRail(); desenharLista(); break;
    case 'ferramentas': if (pop && pop.gatilho === b) fecharPop(); else abrirFerramentas(b, teclado); break;
    case 'abrir-ferramenta': fecharPop(false); abrirFerramenta(v); break;
    case 'voltar': S.lado = 'cartao'; S.revisao = null; desenharLado(); { const l = document.getElementById('op-' + S.sel[S.pagina]); if (l) l.focus({ preventScroll: true }); } break;
    case 'decidir': S.revisao.decs[b.dataset.id] = v; { const y = document.getElementById('lado').scrollTop; desenharLado(); document.getElementById('lado').scrollTop = y; document.querySelector(`.seg__o[data-id="${b.dataset.id}"][data-v="${v}"]`)?.focus({ preventScroll: true }); } break;
    case 'confirmar': confirmarRevisao(); break;
    case 'ver': { const id = v; S.lado = 'revisao'; S.sel[S.pagina] = id; desenharLista(); const l = document.getElementById('op-' + id); if (l) l.scrollIntoView({ block: 'center' }); } break;
    case 'dar': if (pop && pop.gatilho === b) fecharPop(); else abrirDar(b, teclado); break;
    case 'testar': { const e = selecionada(); S.teste = S.teste && S.teste.id === e.id ? null : { id: e.id, res: null }; desenharLado(); } break;
    case 'rolar': rolarTeste(selecionada()); desenharLado(); document.querySelector('[data-a="rolar"]')?.focus(); break;
    case 'fechar-teste': S.teste = null; desenharLado(); document.querySelector('[data-a="testar"]')?.focus(); break;
    case 'editar': janelaEditar(selecionada()); break;
    case 'novo-item': janelaEditar(null); break;
    case 'tirar': tirar(selecionada(), v); break;
    case 'apagar': janelaApagar(selecionada()); break;
    case 'vazio-juntar': S.estado = 'normal'; renderTudo(); abrirFerramenta('juntar'); break;
    case 'vazio-nova': S.estado = 'normal'; renderTudo(); if (S.pagina === 'itens') janelaEditar(null); else window.open('../habilidades/editor/prototipo.html', '_blank', 'noopener'); break;
  }
});
document.getElementById('ordem').addEventListener('change', (ev) => { S.ordem = ev.target.value; desenharLista(); });
document.getElementById('ficha-select').addEventListener('change', (ev) => { S.onde = ev.target.value; desenharRail(); desenharLista(); });
const campoBusca = document.getElementById('busca');
function syncBusca() {
  const tem = campoBusca.value !== '';
  document.getElementById('busca-kbd').hidden = tem;
  document.getElementById('busca-limpar').hidden = !tem;
}
campoBusca.addEventListener('input', () => { S.busca = campoBusca.value; syncBusca(); desenharLista(); });
campoBusca.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && campoBusca.value) { ev.preventDefault(); ev.stopPropagation(); campoBusca.value = ''; S.busca = ''; syncBusca(); desenharLista(); }
  if (ev.key === 'ArrowDown') { const l = document.querySelector('#lista .linha'); if (l) { ev.preventDefault(); escolher(l.dataset.id, true); } }
});

document.addEventListener('keydown', (ev) => {
  const emCampo = ev.target.matches('input, textarea, select');
  // janela aberta: Esc fecha e Tab não sai dela
  if (janela) {
    if (ev.key === 'Escape') { ev.preventDefault(); fecharJanela(); }
    if (ev.key === 'Tab') {
      const foc = [...janela.fundo.querySelectorAll('button, input, textarea, select')].filter((x) => !x.disabled);
      const i = foc.indexOf(document.activeElement);
      if (ev.shiftKey && i <= 0) { ev.preventDefault(); foc[foc.length - 1].focus(); }
      else if (!ev.shiftKey && i === foc.length - 1) { ev.preventDefault(); foc[0].focus(); }
    }
    return;
  }
  // menu aberto: setas, Home/End, Esc
  if (pop) {
    if (ev.key === 'Escape') { ev.preventDefault(); fecharPop(); return; }
    if (pop.el.querySelector('[role="menu"]')) {
      const itens = [...pop.el.querySelectorAll('.menu__item:not([aria-disabled="true"])')];
      const i = itens.indexOf(document.activeElement);
      if (ev.key === 'ArrowDown') { ev.preventDefault(); itens[(i + 1) % itens.length]?.focus(); }
      else if (ev.key === 'ArrowUp') { ev.preventDefault(); itens[(i - 1 + itens.length) % itens.length]?.focus(); }
      else if (ev.key === 'Home') { ev.preventDefault(); itens[0]?.focus(); }
      else if (ev.key === 'End') { ev.preventDefault(); itens[itens.length - 1]?.focus(); }
      else if (ev.key === 'Tab') { fecharPop(false); }
      return;
    }
    if (ev.key === 'Tab') fecharPop(false);
    return;
  }
  if (ev.key === 'F8') { const b = document.querySelector('#avisos .aviso:last-child button'); if (b) { ev.preventDefault(); b.focus(); } return; }
  if (!emCampo && (ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); desfazerItem(S.pilha[S.pilha.length - 1]); return; }
  if (!emCampo && ev.key === '/' && S.estado === 'normal') { ev.preventDefault(); campoBusca.focus(); campoBusca.select(); return; }
  if (ev.key === 'Escape' && S.lado === 'revisao') { ev.preventDefault(); S.lado = 'cartao'; S.revisao = null; desenharLado(); return; }
  // na lista: setas, Home/End e as letras das ações
  const linha = ev.target.closest && ev.target.closest('.linha');
  if (linha) {
    const todas = [...document.querySelectorAll('#lista .linha')];
    const i = todas.indexOf(linha);
    let prox = null;
    if (ev.key === 'ArrowDown') prox = todas[i + 1];
    else if (ev.key === 'ArrowUp') prox = todas[i - 1];
    else if (ev.key === 'Home') prox = todas[0];
    else if (ev.key === 'End') prox = todas[todas.length - 1];
    if (prox) { ev.preventDefault(); escolher(prox.dataset.id, true); return; }
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const k = ev.key.toLowerCase();
    if (k === 'd') { ev.preventDefault(); document.getElementById('bt-dar')?.click(); }
    else if (k === 't') { const b = document.querySelector('[data-a="testar"]'); if (b && b.getAttribute('aria-disabled') !== 'true') { ev.preventDefault(); b.click(); } }
    else if (k === 'e') { const b = document.querySelector('[data-a="editar"], [data-editar]'); if (b) { ev.preventDefault(); b.click(); } }
    else if (ev.key === 'Delete') { const b = document.querySelector('[data-a="apagar"]'); if (b && b.getAttribute('aria-disabled') !== 'true') { ev.preventDefault(); b.click(); } }
  }
  // radiogroup das propostas: setas trocam a escolha
  const seg = ev.target.closest && ev.target.closest('.seg');
  if (seg && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) {
    const ops = [...seg.querySelectorAll('.seg__o')];
    const i = ops.indexOf(ev.target);
    const n = ops[(i + (ev.key === 'ArrowRight' ? 1 : -1) + ops.length) % ops.length];
    ev.preventDefault(); n.click();
  }
});

/* arrastar uma linha até um nome da coluna Fichas */
let arrastando = null;
document.addEventListener('dragstart', (ev) => {
  const linha = ev.target.closest && ev.target.closest('.linha');
  if (!linha || !podeGravar()) return;
  arrastando = achar(linha.dataset.id);
  linha.classList.add('is-arrastada');
  document.getElementById('rail').classList.add('is-arrastando');
  const f = document.getElementById('fantasma');
  f.innerHTML = `${ic(iconeDe(arrastando))}${esc(arrastando.nome)}`;
  ev.dataTransfer.effectAllowed = 'copy';
  ev.dataTransfer.setData('text/plain', arrastando.id);
  ev.dataTransfer.setDragImage(f, 16, 16);
});
/* o fim do arrasto roda no dragend e também no drop: depois de dar, a linha de origem é redesenhada
   e o dragend dela não chega mais ao documento */
function fimDoArrasto() {
  document.querySelectorAll('.is-arrastada').forEach((x) => x.classList.remove('is-arrastada'));
  document.getElementById('rail').classList.remove('is-arrastando');
  limparAlvos();
  arrastando = null;
}
document.addEventListener('dragend', fimDoArrasto);
function limparAlvos() { document.querySelectorAll('.ficha[data-alvo]').forEach((x) => { delete x.dataset.alvo; const d = x.querySelector('.ficha__dica'); if (d) d.hidden = true; }); }
const rail = document.getElementById('rail');
rail.addEventListener('dragover', (ev) => {
  const alvo = ev.target.closest('.ficha[data-ficha]');
  if (!arrastando || !alvo) return;
  const f = FICHA[alvo.dataset.ficha];
  const tem = arrastando.donos.has(f.id);
  ev.preventDefault();
  ev.dataTransfer.dropEffect = tem ? 'none' : 'copy';
  if (alvo.dataset.alvo !== (tem ? 'nao' : 'sim')) {
    limparAlvos();
    alvo.dataset.alvo = tem ? 'nao' : 'sim';
    const d = alvo.querySelector('.ficha__dica');
    d.textContent = tem ? `${f.nome.split(' ')[0]} já tem` : `Soltar: dar a ${f.nome.split(' ')[0]}`;
    d.hidden = false;
  }
});
rail.addEventListener('dragleave', (ev) => { const alvo = ev.target.closest('.ficha[data-ficha]'); if (alvo && !alvo.contains(ev.relatedTarget)) { delete alvo.dataset.alvo; const d = alvo.querySelector('.ficha__dica'); if (d) d.hidden = true; } });
rail.addEventListener('drop', (ev) => {
  const alvo = ev.target.closest('.ficha[data-ficha]');
  if (!arrastando || !alvo) return;
  ev.preventDefault();
  const e = arrastando;
  fimDoArrasto();
  if (!e.donos.has(alvo.dataset.ficha)) dar(e, alvo.dataset.ficha);
});

/* o menu aberto não fica boiando longe do botão quando a página rola */
addEventListener('scroll', () => { if (pop) fecharPop(false); }, { passive: true });
/* a barra da lista fica grudada no topo; os cabeçalhos dos grupos grudam logo abaixo dela */
new ResizeObserver(([en]) => document.documentElement.style.setProperty('--barra-lista', Math.round(en.target.getBoundingClientRect().height) + 'px')).observe(document.getElementById('barra'));

/* a primeira pintura leva só o topo da lista; o resto entra na tarefa seguinte (a primeira arrumação
   da página fria passava de 200 ms com as 119 linhas de uma vez) */
// 1ª tarefa: só a moldura fixa, que já usa as três famílias de letra (achar a fonte no Windows é o caro);
// 2ª: o cabeçalho, as fichas, o topo da lista e o papel; 3ª: o resto da lista.
document.body.offsetHeight;
setTimeout(() => {
  limiteDaLista = 26;
  renderTudo();
  syncBusca();
  limiteDaLista = Infinity;
  setTimeout(() => requestAnimationFrame(() => desenharLista()), 0);
}, 0);
</script>
