<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Condições (protótipo)</title>
<style>
/* Tokens: os mesmos dos protótipos aprovados de itens e habilidades (tema escuro quente do app, latão, creme, papel),
   mais uma cor por família de peça. A cor da peça nunca anda sozinha: vem com ícone e nome. */
:root {
  --lb-fundo: #1b1510;
  --lb-fundo-painel: #211a13;
  --lb-fundo-alto: #2a2119;
  --lb-fundo-hover: #33281c;
  --lb-campo: #15100b;
  --lb-filete: rgba(239, 230, 212, 0.09);
  --lb-filete-forte: rgba(239, 230, 212, 0.17);
  --lb-creme: #efe6d4;
  --lb-creme-dim: #bfb39e;
  --lb-creme-tenue: #978c79;
  --lb-latao: #e0a84b;
  --lb-latao-claro: #f4c477;
  --lb-latao-suave: rgba(224, 168, 75, 0.13);
  --lb-latao-filete: rgba(224, 168, 75, 0.34);
  --lb-latao-contraste: #1f1606;
  --lb-dano: #ec7a68;
  --lb-dano-suave: rgba(236, 122, 104, 0.15);
  --lb-cura: #8cc095;
  --lb-cura-suave: rgba(140, 192, 149, 0.15);
  --lb-selo: #b8a0de;
  --lb-selo-suave: rgba(184, 160, 222, 0.16);
  --lb-agua: #86b6d6;
  --lb-agua-suave: rgba(134, 182, 214, 0.15);
  --lb-couro: #c99a6e;
  --lb-musgo: #a9bd72;
  --lb-ameixa: #d993b6;
  --lb-gelo: #9cc7e6;
  --pastilha-tinta: #22180e;
  --papel: #ede3cd;
  --papel-tinta: #2a2119;
  --papel-tenue: #665b4b;
  --papel-dano: #8f2e22;
  --papel-cura: #2b6a3c;
  --papel-selo: #5a3f8c;
  --papel-gasto: #2c5578;
  --papel-filete: rgba(42, 33, 25, 0.16);
  --rasgo: polygon(0 3px, 6% 0, 13% 4px, 21% 1px, 28% 3px, 37% 0, 45% 4px, 52% 1px, 60% 3px, 68% 0, 76% 4px, 84% 1px, 92% 3px, 100% 0, calc(100% - 3px) 30%, 100% 60%, calc(100% - 2px) 100%, 92% calc(100% - 3px), 84% 100%, 76% calc(100% - 4px), 68% calc(100% - 1px), 60% calc(100% - 3px), 52% 100%, 45% calc(100% - 4px), 37% calc(100% - 1px), 28% calc(100% - 3px), 21% 100%, 13% calc(100% - 4px), 6% calc(100% - 1px), 0 calc(100% - 3px), 2px 60%, 0 30%);
  --f-display: 'Sitka Banner', 'Sitka Display', Sitka, Constantia, Georgia, serif;
  --f-texto: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
  --f-num: Bahnschrift, 'DIN Alternate', 'Segoe UI Variable Small', 'Segoe UI', system-ui, sans-serif;
  --t-xs: 11.5px;
  --t-sm: 12.5px;
  --t-md: 14px;
  --t-titulo: 30px;
  --r-p: 6px;
  --r-m: 10px;
  --r-g: 14px;
  --r-total: 999px;
  --sombra-flutua: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 6px 14px rgba(0, 0, 0, 0.42), 0 22px 48px rgba(0, 0, 0, 0.55);
  --sombra-foco: 0 0 0 2px var(--lb-fundo), 0 0 0 4px var(--lb-latao);
  --bisel: inset 0 1px 0 rgba(255, 240, 210, 0.07);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --rapido: 120ms;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; font-family: var(--f-texto); font-size: var(--t-md); line-height: 1.5; color: var(--lb-creme); background: var(--lb-fundo); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
button:disabled { cursor: not-allowed; }
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
:focus-visible { outline: none; box-shadow: var(--sombra-foco); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ------------------------------------------------ faixa do protótipo (não é do app) */
.proto { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-height: 40px; padding: 6px 20px; background: #110d09; border-bottom: 1px dashed var(--lb-filete-forte); font-size: var(--t-sm); color: var(--lb-creme-tenue); }
.proto strong { color: var(--lb-creme-dim); font-weight: 600; }
.proto__sobra { margin-left: auto; }

/* ------------------------------------------------ cabeçalho com as abas */
.topo { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 22px; padding: 0 20px; background: linear-gradient(180deg, #221a12, #1d1610); border-bottom: 1px solid var(--lb-filete); }
.marca { display: flex; align-items: center; gap: 9px; font-family: var(--f-display); font-size: 19px; white-space: nowrap; }
.marca svg { width: 22px; height: 22px; color: var(--lb-latao); }
.abas { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.aba { position: relative; display: inline-flex; align-items: center; min-height: 52px; padding: 0 14px; color: var(--lb-creme-tenue); font-weight: 500; white-space: nowrap; transition: color var(--rapido) ease; }
.aba::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--lb-latao); transform: scaleX(0); transition: transform 200ms var(--ease-out); }
.aba[aria-selected='true'] { color: var(--lb-creme); }
.aba[aria-selected='true']::after { transform: scaleX(1); }
.aba:focus-visible { box-shadow: inset 0 0 0 2px var(--lb-latao); border-radius: var(--r-p); }
@media (hover: hover) and (pointer: fine) { .aba:hover { color: var(--lb-creme); } }

/* ------------------------------------------------ página */
.pg { max-width: 1480px; margin: 0 auto; padding: 26px 24px 120px; }
.pg:focus, .pg:focus-visible { outline: none; box-shadow: none; }
.pg-cab { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 20px; }
.pg-cab__txt { flex: 1 1 420px; min-width: 0; }
.pg-titulo { font-family: var(--f-display); font-size: var(--t-titulo); font-weight: 400; line-height: 1.1; overflow-wrap: anywhere; display: flex; align-items: center; gap: 12px; }
.pg-sub { margin-top: 6px; max-width: 78ch; color: var(--lb-creme-dim); font-size: 15px; }
.pg-acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.migalha { display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px; font-size: var(--t-sm); color: var(--lb-creme-tenue); min-height: 30px; padding: 0 8px 0 2px; border-radius: var(--r-p); }
.migalha .ic { width: 14px; height: 14px; }
@media (hover: hover) and (pointer: fine) { .migalha:hover { color: var(--lb-creme); } }

/* ------------------------------------------------ primitivos */
.bt { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border-radius: var(--r-p); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete-forte); color: var(--lb-creme); font-weight: 500; white-space: nowrap; box-shadow: var(--bisel); transition: transform var(--rapido) var(--ease-out), background-color var(--rapido) ease, border-color var(--rapido) ease; }
.bt:active:not(:disabled) { transform: scale(0.97); }
.bt:disabled { opacity: 0.45; }
.bt--primario { background: linear-gradient(180deg, var(--lb-latao-claro), var(--lb-latao)); border-color: rgba(0, 0, 0, 0.35); color: var(--lb-latao-contraste); font-weight: 650; }
.bt--latao { background: var(--lb-latao-suave); border-color: var(--lb-latao-filete); color: var(--lb-latao-claro); font-weight: 600; }
.bt--agua { background: var(--lb-agua-suave); border-color: rgba(134, 182, 214, 0.38); color: var(--lb-agua); font-weight: 600; }
.bt--fantasma { background: transparent; border-color: transparent; box-shadow: none; color: var(--lb-creme-dim); }
.bt--p { min-height: 30px; padding: 0 10px; font-size: var(--t-sm); }
.bt--ic { width: 34px; padding: 0; }
.bt--p.bt--ic { width: 30px; }
.bt .ic { width: 15px; height: 15px; }
.bt kbd { font: 500 10.5px / 1 var(--f-num); padding: 2px 5px; border-radius: 3px; border: 1px solid currentColor; opacity: 0.55; }
@media (hover: hover) and (pointer: fine) {
  .bt:hover:not(:disabled) { border-color: var(--lb-latao-filete); background-color: var(--lb-fundo-hover); }
  .bt--primario:hover:not(:disabled) { background: linear-gradient(180deg, #f8cf8a, #e6b05a); }
  .bt--fantasma:hover:not(:disabled) { background: rgba(255, 236, 200, 0.06); border-color: transparent; color: var(--lb-creme); }
}

.entrada { width: 100%; min-height: 36px; padding: 6px 10px; border-radius: var(--r-p); background: var(--lb-campo); border: 1px solid var(--lb-filete-forte); color: var(--lb-creme); transition: border-color var(--rapido) ease; }
.entrada:focus-visible { border-color: var(--lb-latao); box-shadow: 0 0 0 3px var(--lb-latao-suave); }
.entrada[aria-invalid='true'] { border-color: var(--lb-dano); }
select.entrada { padding-right: 28px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--lb-creme-tenue) 50%), linear-gradient(135deg, var(--lb-creme-tenue) 50%, transparent 50%); background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
select.entrada option, select.entrada optgroup { background: var(--lb-fundo-painel); }

.campo { display: grid; gap: 5px; align-content: start; min-width: 0; }
.campo > label, .campo__rot { font-size: var(--t-sm); color: var(--lb-creme-dim); }
.campo__erro { font-size: var(--t-xs); color: var(--lb-dano); }

.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: var(--r-m); background: var(--lb-campo); border: 1px solid var(--lb-filete); }
.seg button { min-height: 30px; padding: 0 12px; border-radius: 7px; color: var(--lb-creme-dim); font-size: var(--t-sm); font-weight: 500; transition: background-color var(--rapido) ease, color var(--rapido) ease; }
.seg button[aria-checked='true'] { background: var(--lb-fundo-alto); color: var(--lb-creme); box-shadow: inset 0 0 0 1px var(--lb-latao-filete), var(--bisel); }
@media (hover: hover) and (pointer: fine) { .seg button:hover:not([aria-checked='true']) { color: var(--lb-creme); } }

.marca-caixa { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 30px; }
.marca-caixa input { width: 17px; height: 17px; margin: 0; accent-color: var(--lb-latao); flex: none; }

.etiqueta { display: inline-flex; align-items: center; gap: 5px; min-height: 22px; padding: 0 8px; border-radius: var(--r-total); font-size: var(--t-xs); font-weight: 500; background: rgba(255, 236, 200, 0.06); color: var(--lb-creme-dim); white-space: nowrap; }
.etiqueta .ic { width: 12px; height: 12px; }
.etiqueta--latao { background: var(--lb-latao-suave); color: var(--lb-latao-claro); }
.etiqueta--dano { background: var(--lb-dano-suave); color: var(--lb-dano); }
.etiqueta--cura { background: var(--lb-cura-suave); color: var(--lb-cura); }
.etiqueta--novo { min-height: 18px; padding: 0 6px; background: var(--lb-latao-suave); color: var(--lb-latao-claro); font-size: 10.5px; }

.medalhao { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #3b2f20, #241b12 70%); border: 1px solid var(--lb-latao-filete); color: var(--lb-latao-claro); box-shadow: var(--bisel); }
.medalhao .ic { width: 21px; height: 21px; stroke-width: 1.5; }
.medalhao--p { width: 30px; height: 30px; }
.medalhao--p .ic { width: 16px; height: 16px; }

/* A pastilha: o mesmo desenho que o mapa, a ficha e a batalha mostram (disco da cor, desenho escuro por cima). */
.pastilha { --tam: 28px; display: inline-grid; place-items: center; width: var(--tam); height: var(--tam); flex: none; border-radius: 50%; background: var(--cor); color: var(--pastilha-tinta); box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.38), inset 0 -2px 0 rgba(0, 0, 0, 0.12); }
.pastilha svg { width: 62%; height: 62%; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
.pastilha b { font: 700 calc(var(--tam) * 0.44) / 1 var(--f-num); }

.painel { border-radius: var(--r-g); background: var(--lb-fundo-painel); border: 1px solid var(--lb-filete); }
.nota { font-size: var(--t-sm); color: var(--lb-creme-tenue); }
.vazio { display: grid; justify-items: start; gap: 10px; padding: 28px 18px; border-radius: var(--r-m); border: 1px dashed var(--lb-filete-forte); color: var(--lb-creme-dim); }

/* ------------------------------------------------ o cartão de papel (o mesmo das páginas Itens e Habilidades) */
.papel { position: relative; padding: 20px 20px 18px; background: var(--papel); color: var(--papel-tinta); clip-path: var(--rasgo); }
.papel__topo { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.papel__nome { font-family: var(--f-display); font-size: 24px; font-weight: 400; line-height: 1.1; overflow-wrap: anywhere; }
.papel__tipo { margin-top: 2px; font: 500 var(--t-sm) / 1.3 var(--f-num); color: var(--papel-tenue); letter-spacing: 0.02em; }
.papel__rot { margin-top: 14px; font-size: var(--t-xs); font-weight: 600; color: var(--papel-tenue); }
.papel__numeros { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px 12px; padding-top: 10px; border-top: 1px dashed var(--papel-filete); }
.papel__numeros dt { font-size: var(--t-xs); color: var(--papel-tenue); }
.papel__numeros dd { font: 600 14px / 1.3 var(--f-num); overflow-wrap: anywhere; }
.tinta-dano { color: var(--papel-dano); font-weight: 650; }
.tinta-cura { color: var(--papel-cura); font-weight: 650; }
.tinta-selo { color: var(--papel-selo); font-weight: 650; }
.tinta-gasto { color: var(--papel-gasto); font-weight: 650; }
.acontece { margin-top: 6px; display: grid; gap: 2px; }
.acontece__linha { display: grid; grid-template-columns: 3px minmax(0, 1fr); gap: 10px; width: 100%; padding: 6px 6px 6px 0; border-radius: 4px; font-size: 14px; line-height: 1.5; color: var(--papel-tinta); text-align: left; }
.acontece__linha::before { content: ''; border-radius: 2px; background: var(--cor-peca, var(--papel-tenue)); }
.acontece__linha:focus-visible { box-shadow: 0 0 0 2px var(--papel-tinta); }
@media (hover: hover) and (pointer: fine) { button.acontece__linha:hover { background: rgba(42, 33, 25, 0.06); } }
.acontece__vazio { font-size: 14px; color: var(--papel-tenue); font-style: italic; }
.na-batalha { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--papel-filete); display: grid; gap: 6px; }
.na-batalha li, .avisos-papel li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; font-size: 13px; color: var(--papel-tenue); }
.na-batalha .ic { width: 15px; height: 15px; margin-top: 2px; color: var(--papel-gasto); }
.avisos-papel { margin-top: 10px; display: grid; gap: 4px; }
.avisos-papel li { color: var(--papel-dano); }
.avisos-papel .ic { width: 15px; height: 15px; margin-top: 2px; }

/* ------------------------------------------------ Condições (catálogo): lista à esquerda, a escolhida à direita */
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
.busca { position: relative; flex: 1 1 240px; max-width: 380px; }
.busca .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--lb-creme-tenue); pointer-events: none; }
.busca .entrada { padding-left: 34px; padding-right: 36px; }
.busca kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font: 500 11px / 1 var(--f-num); padding: 3px 6px; border-radius: 4px; border: 1px solid var(--lb-filete-forte); color: var(--lb-creme-tenue); }
.filtros { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; }
.filtros__rot { font-size: var(--t-xs); color: var(--lb-creme-tenue); margin-right: 2px; }
.filtro { --cor-peca: var(--lb-latao); display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 0 12px; border-radius: var(--r-total); border: 1px solid var(--lb-filete-forte); color: var(--lb-creme-dim); font-size: var(--t-sm); transition: background-color var(--rapido) ease, border-color var(--rapido) ease, color var(--rapido) ease; }
.filtro .ic { width: 13px; height: 13px; color: var(--cor-peca); }
.filtro b { font: 500 var(--t-xs) / 1 var(--f-num); color: var(--lb-creme-tenue); }
.filtro[aria-pressed='true'] { background: var(--lb-latao-suave); border-color: var(--lb-latao-filete); color: var(--lb-creme); }
.filtro[aria-pressed='true'] b { color: var(--lb-latao-claro); }
@media (hover: hover) and (pointer: fine) { .filtro:hover:not([aria-pressed='true']) { color: var(--lb-creme); border-color: var(--lb-latao-filete); } }
.filtros--pecas .filtro { min-height: 28px; padding: 0 10px; }

.cat { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 24px; align-items: start; margin-top: 16px; }
.lista { display: grid; gap: 3px; }
.linha { display: grid; grid-template-columns: 34px minmax(130px, 190px) minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%; min-height: 60px; padding: 8px 12px; border-radius: var(--r-m); border: 1px solid transparent; text-align: left; transition: background-color var(--rapido) ease, border-color var(--rapido) ease; }
.linha[aria-pressed='true'] { background: linear-gradient(180deg, #2f2416, #261d13); border-color: var(--lb-latao-filete); }
.linha[data-nova] { background: var(--lb-latao-suave); border-color: var(--lb-latao-filete); }
.linha:focus-visible { box-shadow: inset 0 0 0 2px var(--lb-latao); }
.linha__nome { display: grid; gap: 3px; min-width: 0; }
.linha__nome strong { font-family: var(--f-display); font-size: 18px; font-weight: 400; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linha__nome span { display: flex; flex-wrap: wrap; gap: 4px; }
.linha__resumo { min-width: 0; display: grid; gap: 5px; }
.linha__resumo p { color: var(--lb-creme-dim); font-size: 13.5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.linha__pecas { display: flex; flex-wrap: wrap; gap: 4px; }
.linha__qtd { font-size: var(--t-xs); color: var(--lb-creme-tenue); white-space: nowrap; }
@media (hover: hover) and (pointer: fine) { .linha:hover:not([aria-pressed='true']) { background: rgba(255, 236, 200, 0.035); } }
.chip-peca { --cor-peca: var(--lb-latao); display: inline-flex; align-items: center; gap: 5px; min-height: 20px; padding: 0 7px 0 5px; border-radius: 4px; font-size: var(--t-xs); color: var(--lb-creme-dim); background: rgba(255, 236, 200, 0.05); box-shadow: inset 2px 0 0 var(--cor-peca); }
.chip-peca .ic { width: 12px; height: 12px; color: var(--cor-peca); }
.lado { position: sticky; top: 72px; display: grid; gap: 12px; max-height: calc(100vh - 88px); overflow: auto; overscroll-behavior: contain; padding-bottom: 6px; scrollbar-width: thin; }
.lado__acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.lado__nota { font-size: var(--t-sm); color: var(--lb-creme-tenue); }

/* ------------------------------------------------ Editor */
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 24px; align-items: start; }
.editor__form { display: grid; gap: 16px; min-width: 0; }
.secao { padding: 18px 20px 20px; border-radius: var(--r-g); background: var(--lb-fundo-painel); border: 1px solid var(--lb-filete); scroll-margin-top: 90px; }
.secao__cab { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 14px; }
.secao__tit { font-family: var(--f-display); font-size: 20px; font-weight: 400; }
.secao__sub { font-size: var(--t-sm); color: var(--lb-creme-tenue); max-width: 62ch; }
.secao[data-brilho] { animation: brilho-secao 900ms ease; }
@keyframes brilho-secao { 0% { box-shadow: 0 0 0 2px var(--lb-latao-filete); } 100% { box-shadow: 0 0 0 2px transparent; } }
.identidade { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px 22px; align-items: start; }
.identidade__previa { display: grid; justify-items: center; gap: 8px; padding: 14px 18px; border-radius: var(--r-m); background: var(--lb-campo); border: 1px solid var(--lb-filete); min-width: 132px; }

.identidade__campos { display: grid; gap: 14px; min-width: 0; }
.linha-campos { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: end; }
.cores, .desenhos { display: flex; flex-wrap: wrap; gap: 6px; }
.cor-op { position: relative; width: 34px; height: 34px; border-radius: 50%; background: var(--cor); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3); transition: transform var(--rapido) var(--ease-out); }

.cor-op[aria-checked='true'] { box-shadow: 0 0 0 2px var(--lb-fundo-painel), 0 0 0 4px var(--lb-creme); }

.cor-op i { position: absolute; right: -3px; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--lb-latao-claro); box-shadow: 0 0 0 2px var(--lb-fundo-painel); }
.desenho-op { position: relative; display: grid; place-items: center; width: 38px; height: 38px; border-radius: var(--r-p); border: 1px solid var(--lb-filete-forte); background: var(--lb-campo); color: var(--lb-creme-dim); transition: border-color var(--rapido) ease, color var(--rapido) ease, transform var(--rapido) var(--ease-out); }

.desenho-op .ic { width: 19px; height: 19px; stroke-width: 1.8; }
.desenho-op[aria-checked='true'] { border-color: var(--lb-latao); color: var(--lb-latao-claro); box-shadow: inset 0 0 0 1px var(--lb-latao); }
.desenho-op i { position: absolute; right: 2px; top: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--lb-latao-claro); }
@media (hover: hover) and (pointer: fine) { .desenho-op:hover:not([aria-checked='true']) { color: var(--lb-creme); border-color: var(--lb-latao-filete); } }
.legenda-novo { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-xs); color: var(--lb-creme-tenue); }
.legenda-novo i { width: 7px; height: 7px; border-radius: 50%; background: var(--lb-latao-claro); }

/* peças: cada uma se lê como uma frase com campos dentro (a mesma peça do editor de habilidades) */
.pecas { display: grid; gap: 10px; }
.peca { --cor-peca: var(--lb-latao); position: relative; display: grid; gap: 12px; padding: 14px 16px 16px 20px; border-radius: var(--r-m); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete-forte); box-shadow: var(--bisel); scroll-margin-top: 90px; }
.peca::before { content: ''; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 4px; border-radius: var(--r-m) 0 0 var(--r-m); background: var(--cor-peca); }
.peca::after { content: ''; position: absolute; left: -6px; top: 22px; width: 9px; height: 14px; border-radius: 0 7px 7px 0; background: var(--cor-peca); }
.peca[data-entra] { animation: entra 200ms var(--ease-out); }
.peca[data-brilho] { animation: brilho 900ms ease; }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } }
@keyframes brilho { 0% { border-color: var(--cor-peca); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cor-peca) 30%, transparent); } 100% { border-color: var(--lb-filete-forte); box-shadow: var(--bisel); } }
.peca__cab { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.peca__cab .medalhao { color: var(--cor-peca); border-color: color-mix(in srgb, var(--cor-peca) 45%, transparent); }
.peca__tit { font-weight: 650; font-size: 15px; line-height: 1.25; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.peca__faz { font-size: var(--t-xs); color: var(--lb-creme-tenue); }
.peca__acoes { display: flex; gap: 2px; }
.peca__corpo { display: grid; gap: 12px; }
.frase { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; color: var(--lb-creme-dim); line-height: 1.4; }
.frase > b { color: var(--lb-creme); font-weight: 600; }
.frase .entrada { width: auto; min-height: 32px; padding-top: 4px; padding-bottom: 4px; }
.frase select.entrada { max-width: 100%; }
.frase input.entrada[type='number'], .item-peca input.entrada[type='number'] { width: 68px; text-align: center; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.frase--sub { padding-left: 14px; border-left: 1px dashed var(--lb-filete-forte); }
.rot-linha { font-size: var(--t-xs); font-weight: 600; color: var(--lb-creme-tenue); }
.itens-peca { display: grid; gap: 6px; }
.item-peca { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 8px 8px 12px; border-radius: var(--r-p); background: var(--lb-campo); border: 1px solid var(--lb-filete); color: var(--lb-creme-dim); }
.item-peca[data-entra] { animation: entra 180ms var(--ease-out); }
.item-peca b { color: var(--lb-creme); font-weight: 600; }
.item-peca .entrada { width: auto; min-height: 30px; padding-top: 3px; padding-bottom: 3px; }
.item-peca > .bt--ic:last-child { margin-left: auto; }
.item-peca--lido { background: transparent; border-style: dashed; }
.item-peca__quebra { flex-basis: 100%; height: 0; }

.bloqs { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; }
.bloq { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 1px 10px; align-items: center; min-height: 52px; padding: 8px 10px; border-radius: var(--r-p); background: var(--lb-campo); border: 1px solid var(--lb-filete); cursor: pointer; transition: border-color var(--rapido) ease, background-color var(--rapido) ease; }
.bloq input { grid-row: span 2; width: 17px; height: 17px; margin: 0; accent-color: var(--lb-couro); }
.bloq b { font-size: 13.5px; font-weight: 600; color: var(--lb-creme); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.bloq small { font-size: var(--t-xs); color: var(--lb-creme-tenue); line-height: 1.3; }
.bloq:has(input:checked) { border-color: color-mix(in srgb, var(--lb-couro) 60%, transparent); background: color-mix(in srgb, var(--lb-couro) 9%, var(--lb-campo)); }
.bloq:has(input:focus-visible) { box-shadow: var(--sombra-foco); }
.chips-cond { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip-cond { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 2px 0 4px; border-radius: var(--r-total); background: var(--lb-campo); border: 1px solid var(--lb-filete-forte); font-size: var(--t-sm); color: var(--lb-creme); }
.chip-cond .bt--ic { width: 24px; min-height: 24px; border-radius: 50%; }

.por-peca { display: grid; gap: 10px; padding: 14px; border-radius: var(--r-m); border: 1px dashed var(--lb-filete-forte); }
.por-peca__tit { font-size: var(--t-sm); color: var(--lb-creme-dim); font-weight: 600; }
.tipos-peca { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; }
.tipo-peca { --cor-peca: var(--lb-latao); display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 2px 10px; align-items: center; min-height: 54px; padding: 8px 10px; border-radius: var(--r-p); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete); box-shadow: inset 3px 0 0 var(--cor-peca); text-align: left; transition: border-color var(--rapido) ease, background-color var(--rapido) ease, transform var(--rapido) var(--ease-out); }
.tipo-peca:active { transform: scale(0.98); }
.tipo-peca .medalhao--p { grid-row: span 2; color: var(--cor-peca); border-color: color-mix(in srgb, var(--cor-peca) 45%, transparent); }
.tipo-peca b { font-size: 13.5px; font-weight: 600; line-height: 1.2; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tipo-peca small { font-size: var(--t-xs); color: var(--lb-creme-tenue); line-height: 1.3; }
@media (hover: hover) and (pointer: fine) { .tipo-peca:hover { border-color: color-mix(in srgb, var(--cor-peca) 55%, transparent); background: var(--lb-fundo-hover); } }

.onde { display: grid; gap: 6px; }
.onde li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 13.5px; color: var(--lb-creme-dim); }
.onde .ic { margin-top: 2px; color: var(--lb-creme-tenue); }
.usos { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--lb-filete-forte); }
.usos > span:first-child { font-size: var(--t-sm); color: var(--lb-creme-tenue); margin-right: 2px; }

.previa { position: sticky; top: 72px; display: grid; gap: 12px; max-height: calc(100vh - 88px); overflow: auto; overscroll-behavior: contain; padding-bottom: 6px; scrollbar-width: thin; }
.previa__rot { font-size: var(--t-sm); color: var(--lb-creme-tenue); display: flex; justify-content: space-between; gap: 8px; }
.estado-salvo { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-sm); color: var(--lb-creme-tenue); }
.estado-salvo i { width: 7px; height: 7px; border-radius: 50%; background: var(--lb-cura); }
.estado-salvo[data-sujo] i { background: var(--lb-latao); }

/* ------------------------------------------------ Testar no boneco (ao vivo: refaz a cada mudança) */
.boneco { display: grid; gap: 12px; padding: 14px 16px 16px; }
.boneco__cab { display: flex; align-items: center; gap: 10px; }
.boneco__cab b { font-family: var(--f-display); font-size: 19px; font-weight: 400; }
.boneco__cab small { margin-left: auto; font-size: var(--t-xs); color: var(--lb-creme-tenue); text-align: right; }
.ajustes { display: grid; gap: 8px; padding: 10px 12px; border-radius: var(--r-m); background: var(--lb-campo); border: 1px solid var(--lb-filete); color: var(--lb-creme-dim); font-size: 13px; }
.ajustes__linha { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.ajustes .entrada { width: auto; min-height: 30px; padding-top: 2px; padding-bottom: 2px; font-size: 13px; }
.ajustes input.entrada[type='number'] { width: 60px; text-align: center; font-family: var(--f-num); }
.ajustes .seg button { min-height: 26px; padding: 0 10px; }
.tempo { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; }
.tempo li { display: grid; justify-items: center; gap: 4px; padding: 8px 2px 7px; border-radius: var(--r-p); background: var(--lb-campo); border: 1px solid var(--lb-filete); }
.tempo__r { font-size: var(--t-xs); color: var(--lb-creme-tenue); }
.tempo__p { position: relative; display: grid; place-items: center; width: 30px; height: 30px; }
.tempo__p .pastilha { --tam: 26px; }
.tempo__p em { position: absolute; right: -6px; bottom: -3px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--lb-creme); color: var(--pastilha-tinta); font: 700 10.5px / 17px var(--f-num); font-style: normal; text-align: center; }
.tempo__fora { width: 24px; height: 24px; border-radius: 50%; border: 1.5px dashed var(--lb-filete-forte); }
.tempo li[data-saiu] .pastilha { opacity: 0.5; }
.tempo__v { font: 500 12px / 1.2 var(--f-num); color: var(--lb-creme); }
.tempo__e { font-size: 10.5px; color: var(--lb-creme-tenue); line-height: 1.1; text-align: center; }
.rodadas { display: grid; gap: 8px; }
.rodada { display: grid; gap: 8px; padding: 10px 12px 12px; border-radius: var(--r-m); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete); }
.rodada[data-fora] { background: transparent; border-style: dashed; }
.rodada__cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.rodada__cab h3 { font-family: var(--f-display); font-size: 17px; font-weight: 400; }
.rodada__cab span { font-size: var(--t-xs); color: var(--lb-creme-tenue); }
.medidores { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; }
.medidor { display: grid; gap: 3px; }
.medidor__rot { display: flex; justify-content: space-between; gap: 6px; font-size: var(--t-xs); color: var(--lb-creme-dim); }
.medidor__rot b { font: 500 13px / 1.2 var(--f-num); color: var(--lb-creme); }
.medidor__rot b small { font-size: 11px; color: var(--lb-creme-tenue); font-weight: 400; }
.medidor__barra { position: relative; height: 6px; border-radius: 3px; background: var(--lb-campo); overflow: hidden; }
.medidor__barra i { position: absolute; inset: 0; border-radius: 3px; background: var(--cor); transform-origin: left; transition: transform 200ms var(--ease-out); }
.medidor__barra s { position: absolute; top: -1px; bottom: -1px; width: 2px; margin-left: -1px; background: var(--lb-creme-tenue); }
.registro { display: grid; gap: 2px; }
.registro li { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; padding: 3px 0; font-size: 13px; color: var(--lb-creme-dim); border-bottom: 1px solid var(--lb-filete); }
.registro li:last-child { border-bottom: 0; }
.registro li > span:first-child { font-size: var(--t-xs); color: var(--lb-creme-tenue); padding-top: 1px; }
.registro li[data-t='dano'] b { color: var(--lb-dano); }
.registro li[data-t='cura'] b { color: var(--lb-cura); }
.registro li[data-t='cond'] b { color: var(--lb-selo); }
.registro li[data-t='atr'] b { color: var(--lb-agua); }
.registro li[data-t='teste'] b { color: var(--lb-latao-claro); }
.registro li[data-t='nao'] > span:last-child { color: var(--lb-creme-tenue); }

/* ------------------------------------------------ Como era x como fica */
.casos { display: grid; gap: 18px; }
.caso { display: grid; gap: 14px; padding: 20px; border-radius: var(--r-g); background: var(--lb-fundo-painel); border: 1px solid var(--lb-filete); }
.caso__tit { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.caso__tit h2 { font-family: var(--f-display); font-size: 21px; font-weight: 400; }
.caso__tit p { color: var(--lb-creme-tenue); font-size: var(--t-sm); }
.caso__lados { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.caso__lado { display: grid; gap: 8px; align-content: start; }
.caso__rot { font-size: var(--t-sm); font-weight: 600; }
.caso__rot[data-c='antes'] { color: var(--lb-dano); }
.caso__rot[data-c='agora'] { color: var(--lb-cura); }
.antes { display: grid; gap: 6px; padding: 12px; border-radius: var(--r-m); background: #18130e; border: 1px solid var(--lb-filete); font-size: var(--t-sm); color: var(--lb-creme-tenue); }
.antes__campo { display: inline-block; padding: 1px 7px; margin: 0 4px 4px 0; border-radius: 4px; background: rgba(239, 230, 212, 0.05); }
.antes__campo[data-ruim] { color: var(--lb-dano); background: var(--lb-dano-suave); outline: 1.5px dashed var(--lb-dano); outline-offset: 1px; }
.agora { display: grid; gap: 8px; padding: 12px; border-radius: var(--r-m); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete-forte); font-size: 13.5px; color: var(--lb-creme-dim); }
.tabela { width: 100%; min-width: 680px; border-collapse: collapse; font-size: 13.5px; }
.tabela th, .tabela td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--lb-filete); }
.tabela th { font-size: var(--t-sm); font-weight: 600; color: var(--lb-creme-tenue); }
.tabela td:first-child { width: 150px; }
.tabela td:nth-child(2) { color: var(--lb-creme-dim); width: 44%; }
.caso--decisoes { border-color: var(--lb-latao-filete); background: linear-gradient(180deg, rgba(224, 168, 75, 0.06), transparent 240px), var(--lb-fundo-painel); }
.decisoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px; }
.decisoes li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px 10px; align-items: start; align-content: start; padding: 10px 12px; border-radius: var(--r-m); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete); }
.decisoes li b { font-weight: 600; font-size: 13.5px; }
.decisoes li p { grid-column: 2; font-size: 13px; color: var(--lb-creme-dim); }
.decisao__n { grid-row: span 2; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font: 600 12px / 1 var(--f-num); color: var(--lb-latao-claro); background: var(--lb-latao-suave); }

/* ------------------------------------------------ avisos (com Desfazer) */
.avisos { position: fixed; right: 22px; bottom: 22px; z-index: 80; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.aviso { pointer-events: auto; display: flex; align-items: center; gap: 12px; max-width: min(480px, calc(100vw - 32px)); min-height: 48px; padding: 8px 8px 8px 14px; border-radius: var(--r-m); background: #30261a; border: 1px solid var(--lb-filete-forte); box-shadow: var(--sombra-flutua); transform: translateY(0); opacity: 1; transition: transform 220ms var(--ease-out), opacity 220ms var(--ease-out); }
.aviso[data-entrando] { transform: translateY(110%); opacity: 0; }
.aviso[data-saindo] { transform: translateY(40%); opacity: 0; transition-duration: 140ms; }
.aviso p { flex: 1; font-size: 13.5px; }
.aviso > .ic { color: var(--lb-cura); }

@media (max-width: 1180px) {
  .editor, .cat { grid-template-columns: minmax(0, 1fr); }
  .previa, .lado { position: static; max-height: none; }
  .caso__lados { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .pg { padding: 20px 16px 120px; }
  .marca span { display: none; }
  .linha { grid-template-columns: 34px minmax(0, 1fr); }
  .linha__resumo { grid-column: 1 / -1; }
  .linha__qtd { display: none; }
  .identidade { grid-template-columns: minmax(0, 1fr); }
  .identidade__previa { justify-self: start; }
  .linha-campos { grid-template-columns: minmax(0, 1fr); }
  .decisoes { grid-template-columns: minmax(0, 1fr); }
  .registro li { grid-template-columns: minmax(0, 1fr); gap: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .peca[data-entra], .item-peca[data-entra] { animation: aparece 160ms ease; }
  .peca[data-brilho] { animation: none; outline: 2px solid var(--cor-peca); outline-offset: 2px; }
  .secao[data-brilho] { animation: none; outline: 2px solid var(--lb-latao-filete); outline-offset: 2px; }
  @keyframes aparece { from { opacity: 0; } }
  .medidor__barra i, .aba::after { transition: none; }
  .aviso, .aviso[data-entrando], .aviso[data-saindo] { transform: none; }
  .bt:active:not(:disabled), .tipo-peca:active, .cor-op:active, .desenho-op:active { transform: none; }
}
</style>
</head>
<body>
<div class="proto" role="region" aria-label="Sobre este protótipo">
  <strong>Protótipo das condições refeitas</strong>
  <span>Tudo funciona com dados de exemplo, só nesta página. Recarregar volta tudo ao começo.</span>
  <button type="button" class="bt bt--p bt--fantasma proto__sobra" data-acao="recomecar">Voltar ao começo</button>
</div>
<header class="topo">
  <div class="marca"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 3.5h17v17h-13v-9h9v5h-5"/></svg><span>Labirinto</span></div>
  <nav class="abas" role="tablist" aria-label="Telas do protótipo">
    <button type="button" role="tab" class="aba" id="aba-catalogo" data-aba="catalogo" aria-controls="tela">Condições</button>
    <button type="button" role="tab" class="aba" id="aba-editor" data-aba="editor" aria-controls="tela">Editor da condição</button>
    <button type="button" role="tab" class="aba" id="aba-comoera" data-aba="comoera" aria-controls="tela">Como era x como fica</button>
  </nav>
</header>
<main class="pg" id="tela" role="tabpanel" tabindex="-1"></main>

<div class="sr" id="anuncio" aria-live="polite"></div>

<script>
'use strict';

/* =============================================================== utilidades */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const clone = (o) => JSON.parse(JSON.stringify(o));
const pl = (n, um, varios) => (Math.abs(Number(n)) === 1 ? um : varios);
const limitar = (n, min, max) => Math.min(max, Math.max(min, n));
const inteiro = (v, padrao = 0) => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : padrao; };
const semMovimento = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const sinal = (n) => (n > 0 ? `+${n}` : n < 0 ? `−${Math.abs(n)}` : '0');

/* =============================================================== o boneco: joga 2 a 5 rodadas com a condição, do jeito que está */
function relevantes(cd) {
  const ps = cd.pecas;
  const dc = ps.find((p) => p.tipo === 'danoCura');
  const ss = cd.saidas;
  return {
    d20: ss.some((s) => s.tipo === 'teste' || (s.tipo === 'pagar' && s.como !== 'pagar')),
    golpe: Boolean((dc && dc.recOn) || ps.some((p) => p.tipo === 'marca' || (p.tipo === 'bloqueio' && p.itens.naoAlvo) || (p.tipo === 'vez' && p.recurso === 'escudo')) || ss.some((s) => s.tipo === 'dano') || cd.prazo.modo === 'proximoGolpe'),
    cura: Boolean((dc && dc.curaOn) || ss.some((s) => s.tipo === 'cura')),
    bate: Boolean((dc && (dc.cauOn || dc.cddOn)) || ss.some((s) => s.tipo === 'agir')),
    deNovo: cd.prazo.deNovo === 'pilha' || (cd.prazo.deNovo === 'renova' && cd.prazo.modo === 'turnos'),
    tenta: ss.some((s) => s.tipo === 'pagar'),
    perto: ps.some((p) => p.tipo === 'aura'),
    ja: ps.some((p) => p.tipo === 'contra' && p.apaga.length),

}
function unidadeDoAtr(p) {
  const base = BONECO.atr[p.atr] || 0;
  return p.conta === 'pct' ? Math.round(base * p.v / 100) : p.v;
}

  const base = BONECO.atr[p.atr] || 0;

function simular(cd, T) {
  const R = relevantes(cd);
  const ps = cd.pecas;
  const pz = cd.prazo;
  const dc = ps.find((p) => p.tipo === 'danoCura');
  const mk = ps.find((p) => p.tipo === 'marca');
  const gat = ps.find((p) => p.tipo === 'gatilho');
  const au = ps.find((p) => p.tipo === 'aura');

  const bl = ps.find((p) => p.tipo === 'bloqueio');
  const bloq = (k) => Boolean(bl && bl.itens[k]);
  const atrsPecas = ps.filter((p) => p.tipo === 'atributo');
  const atrIds = [...new Set(atrsPecas.map((p) => p.atr))];
  const nome = cd.nome.trim() || 'a condição';
  const st = { vida: BONECO.vida, sp: BONECO.sp, escudo: 0, ativa: true, restam: pz.modo === 'turnos' ? pz.n : Infinity, pilhas: 1, conta: 0, gatFeito: false, marca: Boolean(mk), acum: {}, outras: [] };
  const valorAtr = (atr) => {

    atrsPecas.filter((p) => p.atr === atr).forEach((p) => {

      if (p.faz === 'maximo') v = Math.min(v, p.v);
    });
    return Math.max(0, v);
  };
  const aplicarVez = (p, L) => {
    const rot = { vida: 'vida', sp: 'SP', escudo: 'Escudo' }[p.recurso];
    const max = p.recurso === 'sp' ? BONECO.sp : BONECO.vida;
    const atual = p.recurso === 'vida' ? st.vida : p.recurso === 'sp' ? st.sp : st.escudo;
    let n = p.conta === 'fixo' ? p.v : Math.round((p.conta === 'pctMax' ? max : atual) * p.v / 100);
    n *= st.pilhas;
    const quando = { entrar: 'Ao entrar', comeco: 'Começo da vez', fim: 'Fim da vez' }[p.quando];
    const pilhas = st.pilhas > 1 ? ` (${st.pilhas} pilhas)` : '';
    if (p.faz === 'tira') {
      if (p.recurso === 'vida') {
        const seg = p.direto ? 0 : Math.min(st.escudo, n);
        st.escudo -= seg;
        st.vida = Math.max(0, st.vida - (n - seg));
        L.push(['dano', `${quando}: perde <b>${n - seg} de vida</b>${seg ? ` (o Escudo segura ${seg})` : ''}${pilhas}.`]);
      } else if (p.recurso === 'sp') {
        const tirado = Math.min(st.sp, n);
        st.sp -= tirado;
        L.push(['dano', `${quando}: perde <b>${tirado} de SP</b>${pilhas}.`]);
      } else {
        st.escudo = Math.max(0, st.escudo - n);
        L.push(['dano', `${quando}: perde <b>${n} de Escudo</b>${pilhas}.`]);
      }
      if (p.rouba && p.recurso !== 'escudo') L.push(['cura', `Quem pôs ${nome} ganha <b>${n} de ${rot}</b>.`]);
    } else {
      if (p.recurso === 'vida') { const antes = st.vida; st.vida = Math.min(BONECO.vida, st.vida + n); L.push(['cura', `${quando}: ganha <b>${st.vida - antes} de vida</b>${st.vida - antes < n ? ' (já estava cheio)' : ''}${pilhas}.`]); }
      else if (p.recurso === 'sp') { const antes = st.sp; st.sp = Math.min(BONECO.sp, st.sp + n); L.push(['cura', `${quando}: ganha <b>${st.sp - antes} de SP</b>${pilhas}.`]); }

    if (!st.ativa) return;
    const antes = atrIds.map((a) => [a, valorAtr(a)]);
    st.ativa = false;
    L.push(['cond', `<b>Sai</b>: ${motivo}.`]);
    antes.forEach(([a, v]) => { if (v !== BONECO.atr[a]) L.push(['atr', `${nomeAtr(a)} volta a <b>${BONECO.atr[a]}</b>.`]); });

  // antes da rodada 1: a condição entra
  const entrada = [];
  entrada.push(['cond', `O boneco fica <b>${esc(nome)}</b> (${prazoCurto(pz)}).`]);
  if (ct && R.ja && T.ja) entrada.push(['cond', `Ele estava ${esc(nomeCond(ct.apaga[0]))}: <b>apaga</b>.`]);
  ps.filter((p) => p.tipo === 'vez' && p.quando === 'entrar').forEach((p) => aplicarVez(p, entrada));
  atrIds.forEach((a) => { const v = valorAtr(a); if (v !== BONECO.atr[a]) entrada.push(['atr', `${nomeAtr(a)} ${BONECO.atr[a]} → <b>${v}</b>.`]); });
  const rodadas = [];
  for (let r = 1; r <= T.rodadas; r++) {
    const L = [];
    const comecou = st.ativa;
    const perdeu = st.ativa && bloq('perdeVez');
    if (st.ativa) {
      ps.filter((p) => p.tipo === 'vez' && p.quando === 'comeco').forEach((p) => aplicarVez(p, L));
      atrsPecas.filter((p) => (p.faz === 'tira' || p.faz === 'soma') && (p.ritmo === 'cada' || (p.ritmo === 'aPartir' && r >= p.aPartirN))).forEach((p) => {
        const s = p.faz === 'tira' ? -1 : 1;
        const antes = valorAtr(p.atr);
        let acc = (st.acum[p.id] || 0) + s * unidadeDoAtr(p) * st.pilhas;
        if (p.teto) acc = s * Math.min(Math.abs(acc), tetoDoAtr(p));
        st.acum[p.id] = acc;
        const depois = valorAtr(p.atr);
        L.push(['atr', depois === antes ? `${nomeAtr(p.atr)} já está no teto: fica em <b>${depois}</b>.` : `${nomeAtr(p.atr)} ${sinal(depois - antes)}: fica em <b>${depois}</b>.`]);
      });
      if (perdeu) L.push(['nao', 'Perde a vez: só Passar a vez.']);
      else if (bl) {
        const l = BLOQUEIOS.filter(([k]) => k !== 'naoAlvo' && k !== 'perdeVez' && bl.itens[k]).map(([k]) => FRASE_DO_BLOQUEIO[k]);
        if (l.length) L.push(['nao', `Na vez dele: ${juntar(l)}.`]);
      }
      if (au && R.perto && T.perto && r === 1) L.push(['cond', `O aliado a 1 casa ${au.cond === 'esta' ? `pega <b>${esc(nome)}</b> também${au.espalha ? ' e pode passar adiante' : ''}` : `fica <b>${esc(nomeCond(au.cond))}</b>`}.`]);
    }
    // na vez dele: tentar sair pagando e/ou com teste
    if (st.ativa && !perdeu && R.tenta && Number(T.tentaR) > 0 && r >= Number(T.tentaR)) {
      cd.saidas.filter((s) => s.tipo === 'pagar').forEach((s) => {
        if (!st.ativa) return;
        const podePagar = s.paga === 'acao' ? true : s.paga === 'sp' ? st.sp >= s.v : st.vida > s.v;
        const pagar = () => { if (s.paga === 'sp') st.sp -= s.v; else if (s.paga === 'vida') st.vida -= s.v; };

        } else if (s.como === 'teste') {

          if (t.ok) sair('passou no teste', L);

          if (t.ok) sair('pagou e passou no teste', L);
        } else if (podePagar) {
          pagar(); L.push(['teste', `Tenta sair: escolhe pagar <b>${pagaTxt(s)}</b>.`]); sair('pagou', L);
        } else {
          const t = testar(s.atr, s.cd);
          L.push(['teste', `Tenta sair: sem ${pagaTxt(s)}, rola ${nomeAtr(s.atr)} ${t.txt}, <b>${t.ok ? 'passou' : 'não passou'}</b>.`]);
          if (t.ok) sair('passou no teste', L);
        }
      });
    }
    // na vez dele: o boneco bate
    if (R.bate && !perdeu && (T.bateR === 't' || Number(T.bateR) === r)) {
      let d = 30;
      const ativa = st.ativa;
      if (ativa && dc && dc.cauOn) d = Math.max(0, Math.round(d * (1 + dc.cauV / 100)));
      L.push(['dano', `O boneco bate com 30: causa <b>${d}</b>${ativa && dc && dc.cauOn ? ` (${sinal(dc.cauV)}%)` : ''}.`]);
      if (ativa && dc && dc.cddOn) { const ganho = Math.round(d * dc.cddV / 100); const antes = st.vida; st.vida = Math.min(BONECO.vida, st.vida + ganho); L.push(['cura', `Recupera <b>${st.vida - antes} de vida</b> (${dc.cddV}% do dano).`]); }
      if (ativa && cd.saidas.some((s) => s.tipo === 'agir')) sair('atacou', L);

      else {
        let d = T.golpeV;

        if (st.ativa && dc && dc.recOn && (dc.recTipo === 'qualquer' || dc.recTipo === T.golpeTipo)) { d = Math.max(0, Math.round(d * (1 + dc.recV / 100))); partes.push(`${sinal(dc.recV)}%`); }
        if (st.ativa && mk && st.marca) { d *= mk.mult; partes.push(`${mk.mult}× na marca`); if (mk.sai) st.marca = false; }

    }

      if (parte) c = Math.max(0, Math.round(c * (1 + dc.curaV / 100)));

      else if (pz.deNovo === 'pilha') { if (st.pilhas < pz.teto) { st.pilhas += 1; L.push(['cond', `Ganha de novo: soma uma pilha, agora <b>${st.pilhas}</b>.`]); } else L.push(['nao', `Ganha de novo, mas já está no teto de ${pz.teto} pilhas.`]); }

  }

function medidor(rot, v, max, cor, base) {

function blocoBoneco(cd, T, onde) {

  const R = sim.R;
  const ct = cd.pecas.find((p) => p.tipo === 'contra');

  if (R.bate) aj.push(`<div class="ajustes__linha"><span>O boneco bate com 30 na rodada</span>${selTeste(onde, 'bateR', T.bateR, opsRodada(T.rodadas, true), 'Rodada em que o boneco bate')}</div>`);

  if (R.tenta) aj.push(`<div class="ajustes__linha"><span>Na vez dele, tenta sair a partir da rodada</span>${selTeste(onde, 'tentaR', T.tentaR, opsRodada(T.rodadas), 'Rodada em que começa a tentar sair')}</div>`);
  const caixas = [];
  if (R.perto) caixas.push(caixaTeste(onde, 'perto', T.perto, 'Um aliado dele está a 1 casa'));
  if (R.ja && ct) caixas.push(caixaTeste(onde, 'ja', T.ja, `Ele já estava ${esc(nomeCond(ct.apaga[0]))}`));
  if (caixas.length) aj.push(`<div class="ajustes__linha">${caixas.join('')}</div>`);
  const tempo = sim.rodadas.map((r) => {
    const est = r.ativa ? (r.restam !== Infinity ? `faltam ${r.restam}` : 'ativa') : r.comecou ? 'saiu' : 'sem ela';
    const p = r.ativa || r.comecou ? `<span class="tempo__p">${pastilha(cd, 26)}${r.ativa && r.pilhas > 1 ? `<em>${r.pilhas}</em>` : ''}</span>` : '<span class="tempo__p"><span class="tempo__fora"></span></span>';
    return `<li${!r.ativa && r.comecou ? ' data-saiu' : ''}><span class="tempo__r">R${r.r}</span>${p}<span class="tempo__v">${r.vida}</span><span class="tempo__e">${est}</span></li>`;
  }).join('');
  const usaSp = cd.pecas.some((p) => p.tipo === 'vez' && p.recurso === 'sp') || cd.saidas.some((s) => s.tipo === 'pagar' && s.paga === 'sp');
  const usaEscudo = sim.rodadas.some((r) => r.escudo > 0);
  const rotulo = { dano: 'dano', cura: 'ganha', cond: 'condição', atr: 'atributo', teste: 'teste', nao: 'nota' };
  const linhas = (ls) => `<ol class="registro">${ls.map(([t, h]) => `<li data-t="${t}"><span>${rotulo[t] || ''}</span><span>${h}</span></li>`).join('')}</ol>`;
  const rods = sim.rodadas.map((r) => {
    const meds = [medidor('Vida', r.vida, BONECO.vida, 'var(--lb-dano)')];
    if (usaSp) meds.push(medidor('SP', r.sp, BONECO.sp, 'var(--lb-latao)'));
    if (usaEscudo) meds.push(medidor('Escudo', r.escudo, 60, 'var(--lb-agua)'));
    r.atrs.forEach((a) => { const max = Math.max(a.base, ...sim.rodadas.map((x) => (x.atrs.find((y) => y.atr === a.atr) || { v: 0 }).v)); meds.push(medidor(esc(nomeAtr(a.atr)), a.v, max, 'var(--lb-agua)', a.base)); });
    const outras = r.outras.length ? ` · também ${r.outras.map((id) => esc(nomeCond(id))).join(', ')}` : '';
    return `<article class="rodada"${r.comecou ? '' : ' data-fora'} aria-label="Rodada ${r.r}"><div class="rodada__cab"><h3>Rodada ${r.r}</h3><span>${r.ativa ? (r.restam !== Infinity ? `${esc(cd.nome || 'A condição')}: faltam ${r.restam}` : `${esc(cd.nome || 'A condição')} continua`) : r.comecou ? 'saiu nesta rodada' : 'sem a condição'}${r.ativa && r.pilhas > 1 ? `, ${r.pilhas} pilhas` : ''}${outras}</span></div>
      <div class="medidores">${meds.join('')}</div>${linhas(r.linhas)}</article>`;
  }).join('');
  return `<section class="painel boneco" id="boneco-${onde}" aria-labelledby="bt-${onde}">
    <div class="boneco__cab"><span class="medalhao medalhao--p">${glifo('boneco')}</span><b id="bt-${onde}">Testar no boneco</b><small>vida ${BONECO.vida}, SP ${BONECO.sp}<br>refaz a cada mudança</small></div>
    <div class="ajustes" role="group" aria-label="Ajustes do teste">${aj.join('')}</div>
    <ol class="tempo" style="--n:${T.rodadas}" aria-label="Rodada a rodada: a pastilha some quando a condição sai">${tempo}</ol>
    <div class="rodadas"><article class="rodada" aria-label="Ao pôr"><div class="rodada__cab"><h3>Ao pôr</h3><span>antes da rodada 1</span></div>${linhas(sim.entrada)}</article>${rods}</div>
  </section>`;
}

/* =============================================================== tela: Condições (o catálogo) */
function condsFiltradas() {
  const q = chave(UI.busca);
  const daBusca = E.conds.filter((c) => !q || chave(c.nome).includes(q) || chave(textoSimples(frasesDe(c).map((f) => f.html).join(' '))).includes(q));
  const doTipo = daBusca.filter((c) => UI.filtro === 'todas' || c.tipo === UI.filtro);
  const lista = doTipo.filter((c) => !UI.peca || c.pecas.some((p) => p.tipo === UI.peca));
  return { daBusca, doTipo, lista };
}
function telaCatalogo() {
  const { daBusca, doTipo, lista } = condsFiltradas();
  if (lista.length && !lista.some((c) => c.id === UI.sel)) UI.sel = lista[0].id;
  const sel = lista.find((c) => c.id === UI.sel);
  const filtros = [['todas', 'Todas'], ['negativa', 'Negativas'], ['positiva', 'Positivas']].map(([id, nome]) => {
    const n = id === 'todas' ? daBusca.length : daBusca.filter((c) => c.tipo === id).length;
    return `<button type="button" class="filtro" aria-pressed="${UI.filtro === id}" data-acao="filtro" data-v="${id}">${esc(nome)} <b>${n}</b></button>`;
  }).join('');
  const porPeca = ORDEM_DAS_PECAS.map((t) => {
    const d = PECAS[t];
    const n = doTipo.filter((c) => c.pecas.some((p) => p.tipo === t)).length;
    return `<button type="button" class="filtro" style="--cor-peca:${d.cor}" aria-pressed="${UI.peca === t}" data-acao="filtro-peca" data-v="${t}">${glifo(d.ic)}${esc(d.nome)} <b>${n}</b></button>`;
  }).join('');
  const linhas = lista.map((c) => {
    const fr = frasesDe(c);
    const chips = [...new Set(c.pecas.map((p) => p.tipo))].map((t) => `<span class="chip-peca" style="--cor-peca:${PECAS[t].cor}">${glifo(PECAS[t].ic)}${esc(PECAS[t].nome)}</span>`).join('');
    const n = COM_ELA[c.id] || 0;
    return `<li><button type="button" class="linha" data-acao="sel" data-v="${c.id}" aria-pressed="${c.id === UI.sel}"${UI.novaLinha === c.id ? ' data-nova' : ''}>
      ${pastilha(c, 32)}
      <span class="linha__nome"><strong>${esc(c.nome)}</strong><span>${etiquetaTipo(c)}${c.origem === 'criada' ? '<span class="etiqueta">Criada por você</span>' : IDS_DE_HOJE.includes(c.id) ? '' : '<span class="etiqueta etiqueta--latao">Nova</span>'}</span></span>
      <span class="linha__resumo"><p>${esc(textoSimples(fr[0].html))}</p>${chips ? `<span class="linha__pecas">${chips}</span>` : ''}</span>
      <span class="linha__qtd">${n === 0 ? '' : n === 1 ? '1 está com ela' : `${n} estão com ela`}</span>
    </button></li>`;
  }).join('');
  const vazio = `<div class="vazio"><p>${UI.busca.trim() ? `Nenhuma condição com "${esc(UI.busca.trim())}" neste filtro.` : 'Nenhuma condição neste filtro.'}</p><button type="button" class="bt bt--p" data-acao="limpar-busca">Limpar a busca e os filtros</button></div>`;
  return `<div class="pg-cab"><div class="pg-cab__txt"><h1 class="pg-titulo">Condições</h1><p class="pg-sub">${E.conds.filter((c) => c.origem === 'fabrica').length} de fábrica e as que você criar. Cada uma se monta com as peças do editor e o cartão se escreve sozinho. Moram na ficha, não no token, e aparecem iguais no mapa, na batalha e na tela do jogador.</p></div>
      <div class="pg-acoes"><button type="button" class="bt bt--primario" data-acao="nova">${glifo('mais')}Criar condição</button></div></div>
    <div class="barra"><label class="busca"><span class="sr">Buscar condição</span>${glifo('busca')}<input class="entrada" type="search" id="busca" value="${esc(UI.busca)}" placeholder="Buscar pelo nome ou pelo que faz" autocomplete="off"><kbd>/</kbd></label></div>
    <div class="filtros" role="group" aria-label="Filtrar por tipo">${filtros}</div>
    <div class="filtros filtros--pecas" role="group" aria-label="Filtrar pela peça"><span class="filtros__rot">Com a peça</span>${porPeca}</div>
    <div class="cat">
      <div>${lista.length ? `<ul class="lista" aria-label="Catálogo de condições">${linhas}</ul><p class="nota" style="margin-top:10px">Setas para cima e para baixo andam na lista.</p>` : vazio}</div>
      ${sel ? `<aside class="lado" aria-label="${esc(sel.nome)}">${renderPapel(sel, false)}${blocoAcoesDoLado(sel)}${blocoBoneco(sel, UI.testeCat, 'cat')}</aside>` : ''}

}
function blocoAcoesDoLado(c) {
  if (c.origem === 'fabrica') {
    return `<div class="lado__acoes"><button type="button" class="bt bt--primario" data-acao="modelo" data-v="${c.id}">${glifo('copia')}Usar como modelo</button></div>
      <p class="lado__nota">De fábrica: a regra é fixa. "Usar como modelo" abre uma cópia sua no editor.${(USOS[c.id] || []).length ? ` Hoje quem põe: ${esc(USOS[c.id].join('; '))}.` : ''}</p>`;

/* =============================================================== tela: o editor (tudo existe uma vez) */

function corpoBloqueio(p, c) {

function renderPeca(p, i, cd) {

      <div style="overflow-x:auto"><table class="tabela"><thead><tr><th scope="col">Onde era</th><th scope="col">O que existe hoje</th><th scope="col">Onde fica nas condições novas</th></tr></thead><tbody>${linhas}</tbody></table></div></section>
  </div>`;
}

/* =============================================================== desenhar a tela */
const CHAVES_DE_FOCO = ['id', 'data-c', 'data-v', 'data-acao', 'data-acao-change', 'data-i', 'data-j', 'data-teste', 'data-onde'];
function seletorDe(el) {
  if (!el || el === document.body) return null;
  if (el.id) return `#${CSS.escape(el.id)}`;
  const ps = CHAVES_DE_FOCO.filter((k) => el.hasAttribute(k)).map((k) => `[${k}="${CSS.escape(el.getAttribute(k))}"]`);
  return ps.length ? `${el.tagName.toLowerCase()}${ps.join('')}` : null;
}
function render() {
  const tela = $('#tela');
  const ativo = document.activeElement;
  const seletor = UI.focar || (tela.contains(ativo) ? seletorDe(ativo) : null);
  const cursor = ativo && 'selectionStart' in ativo && ativo.type !== 'number' && ativo.type !== 'checkbox' ? [ativo.selectionStart, ativo.selectionEnd] : null;
  const rolagem = $$('.previa, .lado').map((el) => el.scrollTop);
  UI.focar = null;
  tela.innerHTML = UI.aba === 'catalogo' ? telaCatalogo() : UI.aba === 'editor' ? telaEditor() : telaComoEra();
  tela.setAttribute('aria-labelledby', `aba-${UI.aba}`);
  $$('.aba').forEach((b) => { const ok = b.dataset.aba === UI.aba; b.setAttribute('aria-selected', String(ok)); b.tabIndex = ok ? 0 : -1; });
  document.title = `${UI.aba === 'editor' ? `${E.rascunho.nome || 'Sem nome'}, ` : ''}Condições (protótipo)`;
  $$('.previa, .lado').forEach((el, i) => { if (rolagem[i] !== undefined) el.scrollTop = rolagem[i]; });
  if (seletor) {
    let alvo = null;
    try { alvo = $(seletor, tela); } catch (_) { alvo = null; }
    if (alvo && !alvo.disabled) {
      alvo.focus({ preventScroll: true });
      if (cursor && 'setSelectionRange' in alvo && alvo.type !== 'number') { try { alvo.setSelectionRange(cursor[0], cursor[1]); } catch (_) { /* campo sem seleção */ } }
    }
  }
  UI.entrou = null; UI.brilho = null; UI.novaLinha = null;
}
/** Só o cartão, o boneco, o título e o "Salvo": para digitar sem redesenhar o formulário. */
function renderParcial() {
  const cd = E.rascunho;
  const papel = $('#papel');
  if (papel) papel.innerHTML = renderPapel(cd, true);
  const bon = $('#boneco-ed-caixa');
  if (bon) bon.innerHTML = blocoBoneco(cd, UI.teste, 'ed');
  const tn = $('#titulo-nome'); if (tn) tn.textContent = cd.nome || 'Sem nome';
  const tp = $('#titulo-pastilha'); if (tp) tp.innerHTML = pastilha(cd, 34);
  const pv = $('.identidade__previa'); if (pv) pv.innerHTML = `${pastilha(cd, 64)}<small>${esc(cd.nome || 'Sem nome')}</small>`;
  const nome = $('#campo-nome');
  if (nome) {
    const vazio = !cd.nome.trim();
    const erro = vazio ? 'Dê um nome: é como ela aparece na ficha e na batalha.' : ehNomeRepetido(cd) ? 'Já existe uma condição com esse nome.' : '';
    nome.setAttribute('aria-invalid', String(Boolean(erro)));
    $('#erro-nome').textContent = erro;
  }
  const est = $('#estado-salvo');
  if (est) { const s = sujo(); est.toggleAttribute('data-sujo', s); est.lastChild.textContent = s ? 'Mudanças não salvas' : 'Salvo'; }
  const bt = $('[data-acao="desfazer"]');
  if (bt) bt.disabled = !UI.desfazer.length;
}
function irPara(aba, focarTela = true) {
  UI.aba = aba;
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
  if (focarTela) $('#tela').focus({ preventScroll: true });
}
function anunciar(t) { const a = $('#anuncio'); a.textContent = ''; requestAnimationFrame(() => { a.textContent = t; }); }

/* =============================================================== avisos (toast) com Desfazer */
function avisar(texto, desfazerAcao) {
  const caixaAv = $('#avisos');
  const el = document.createElement('div');
  el.className = 'aviso';
  el.setAttribute('role', 'status');
  el.innerHTML = `${glifo('visto')}<p>${esc(texto)}</p>${desfazerAcao ? '<button type="button" class="bt bt--p bt--latao">Desfazer</button>' : ''}<button type="button" class="bt bt--p bt--ic bt--fantasma" aria-label="Fechar o aviso">${glifo('x')}</button>`;
  el.setAttribute('data-entrando', '');
  caixaAv.append(el);
  while (caixaAv.children.length > 3) caixaAv.firstElementChild.remove();
  requestAnimationFrame(() => requestAnimationFrame(() => el.removeAttribute('data-entrando')));
  let fora = null;
  const fechar = () => {
    if (!el.isConnected || el.hasAttribute('data-saindo')) return;
    clearTimeout(fora);
    el.setAttribute('data-saindo', '');
    setTimeout(() => el.remove(), semMovimento() ? 0 : 160);
  };
  const prazo = () => { clearTimeout(fora); fora = setTimeout(fechar, desfazerAcao ? 7000 : 3600); };
  el.addEventListener('mouseenter', () => clearTimeout(fora));
  el.addEventListener('mouseleave', prazo);
  el.addEventListener('focusin', () => clearTimeout(fora));
  el.addEventListener('focusout', prazo);
  const bts = $$('button', el);
  if (desfazerAcao) bts[0].addEventListener('click', () => { desfazerAcao(); fechar(); });
  bts[bts.length - 1].addEventListener('click', fechar);
  el.fechar = fechar;
  prazo();
  anunciar(texto);
}

/* =============================================================== mexer no rascunho */
function partes(caminho) { return caminho.split('.').map((k) => (/^\d+$/.test(k) ? Number(k) : k)); }
function pegar(obj, caminho) { return partes(caminho).reduce((o, k) => (o == null ? undefined : o[k]), obj); }
function por(obj, caminho, valor) {
  const ks = partes(caminho);
  let o = obj;
  ks.slice(0, -1).forEach((k) => { o = o[k]; });
  o[ks[ks.length - 1]] = valor;
}
let ultimaFoto = { c: null, t: 0 };
/** Guarda o estado antes de mudar. Digitação no mesmo campo vira uma foto só. */
function foto(c = null) {
  const agora = Date.now();
  if (c && ultimaFoto.c === c && agora - ultimaFoto.t < 1200) { ultimaFoto.t = agora; return; }
  ultimaFoto = { c, t: agora };
  UI.desfazer.push(JSON.stringify(E.rascunho));
  if (UI.desfazer.length > 60) UI.desfazer.shift();
}
function desfazer() {
  if (!UI.desfazer.length) { avisar('Nada para desfazer.'); return; }
  E.rascunho = JSON.parse(UI.desfazer.pop());
  ultimaFoto = { c: null, t: 0 };
  render();
  anunciar('Desfeito.');
}
/** Troca o que está no editor; se havia mudança sem salvar, o aviso deixa voltar. */
function trocarRascunho(fazer) {
  if (UI.aba !== 'editor' && !sujo()) { fazer(); return; }
  if (!sujo()) { fazer(); return; }
  const antes = { r: E.rascunho, s: E.salvo, d: UI.desfazer, n: E.nova };
  const nome = E.rascunho.nome || 'Sem nome';
  fazer();
  avisar(`As mudanças em "${nome}" não foram salvas e ficaram para trás.`, () => {
    E.rascunho = antes.r; E.salvo = antes.s; UI.desfazer = antes.d; E.nova = antes.n;
    irPara('editor');
  });
}
function salvar() {
  const cd = E.rascunho;
  if (!cd.nome.trim() || ehNomeRepetido(cd)) {
    avisar(!cd.nome.trim() ? 'Dê um nome antes de salvar.' : `Já existe "${cd.nome.trim()}": escolha outro nome.`);
    UI.focar = '#campo-nome';
    if (UI.aba !== 'editor') irPara('editor', false); else render();
    return;
  }
  cd.nome = cd.nome.trim();
  const i = E.conds.findIndex((x) => x.id === cd.id);
  if (i >= 0) E.conds[i] = clone(cd); else E.conds.push(clone(cd));
  E.salvo = JSON.stringify(cd);
  E.nova = false;
  UI.sel = cd.id; UI.novaLinha = cd.id;
  render();
  avisar(`"${cd.nome}" salva no catálogo. Já dá para pôr na ficha, nas habilidades e nos itens.`);
}
function novaCondicao() {
  trocarRascunho(() => {
    E.rascunho = C(novoId('c-'), 'Condição nova', 'negativa', 'Laranja', 'estrela', [], { n: 2 });
    E.rascunho.origem = 'criada';
    E.salvo = '';
    E.nova = true; E.comecouDe = "";
    UI.desfazer = [];
    UI.focar = '#campo-nome';
    UI.aba = 'editor';
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
    const n = $('#campo-nome'); if (n) n.select();
  });
}
function usarComoModelo(id) {
  const base = E.conds.find((x) => x.id === id);
  trocarRascunho(() => {
    const c = clone(base);
    c.id = novoId('c-');
    c.origem = 'criada';
    let nome = `${base.nome} (minha)`;
    let k = 2;
    while (E.conds.some((o) => chave(o.nome) === chave(nome))) nome = `${base.nome} (minha ${k++})`;
    c.nome = nome;
    c.pecas.forEach((p) => { p.id = novoId('p'); if (p.efeitos) p.efeitos.forEach((e) => { e.id = novoId('e'); }); });
    c.saidas.forEach((s) => { s.id = novoId('s'); });
    E.rascunho = c;
    E.salvo = '';
    E.nova = true; E.comecouDe = base.id;
    UI.desfazer = [];
    UI.teste = testePara(c, UI.teste);
    UI.focar = '#campo-nome';
    irPara('editor', false);
    anunciar(`Cópia de ${base.nome} aberta no editor.`);
  });
}
function tirarComDesfazer(lista, i, texto) {
  foto();
  const [fora] = lista.splice(i, 1);
  render();
  avisar(texto, () => { lista.splice(i, 0, fora); render(); });
  return fora;
}

/* =============================================================== cliques */
document.addEventListener('click', (ev) => {
  const aba = ev.target.closest('.aba');
  if (aba) { irPara(aba.dataset.aba, false); aba.focus(); return; }
  const el = ev.target.closest('[data-acao]');
  if (!el || el.disabled) return;
  const acao = el.dataset.acao;
  const v = el.dataset.v;
  const cd = E.rascunho;
  switch (acao) {
    case 'recomecar': comecar(); irPara('catalogo'); avisar('Tudo voltou ao começo.'); return;
    case 'aba': irPara(v); return;
    case 'filtro': UI.filtro = v; UI.focar = `[data-acao="filtro"][data-v="${v}"]`; render(); return;
    case 'filtro-peca': UI.peca = UI.peca === v ? '' : v; UI.focar = `[data-acao="filtro-peca"][data-v="${v}"]`; render(); anunciar(UI.peca ? `Só as que têm ${PECAS[v].nome}.` : 'Sem filtro de peça.'); return;
    case 'limpar-busca': UI.busca = ''; UI.filtro = 'todas'; UI.peca = ''; UI.focar = '#busca'; render(); return;
    case 'sel': UI.sel = v; UI.testeCat = testePara(acharCond(v), UI.testeCat); UI.focar = `[data-acao="sel"][data-v="${v}"]`; render(); return;
    case 'modelo': usarComoModelo(v); return;
    case 'editar-de': usarComoModelo(v); return;
    case 'editar': trocarRascunho(() => { abrirNoEditor(v, false); UI.focar = '#campo-nome'; irPara('editor', false); }); return;
    case 'apagar': {
      const i = E.conds.findIndex((x) => x.id === v);
      if (i < 0) return;
      const nome = E.conds[i].nome;
      const [fora] = E.conds.splice(i, 1);
      UI.sel = (E.conds[i] || E.conds[i - 1] || {}).id;
      render();
      avisar(`"${nome}" apagada.`, () => { E.conds.splice(i, 0, fora); UI.sel = fora.id; render(); });
      return;
    }
    case 'nova': novaCondicao(); return;
    case 'ver-cond': trocarRascunho(() => { UI.sel = v; UI.busca = ''; UI.filtro = 'todas'; UI.peca = ''; UI.focar = `[data-acao="sel"][data-v="${v}"]`; irPara('catalogo', false); }); return;
    case 'teste-rodadas': {
      const T = el.dataset.onde === 'cat' ? UI.testeCat : UI.teste;
      T.rodadas = Number(v);
      UI.focar = `[data-acao="teste-rodadas"][data-onde="${el.dataset.onde}"][data-v="${v}"]`;
      render(); return;
    }
    case 'ir': {
      const alvo = document.getElementById(v);
      if (!alvo) return;
      UI.brilho = v;
      render();
      const novoAlvo = document.getElementById(v);
      novoAlvo.scrollIntoView({ behavior: semMovimento() ? 'auto' : 'smooth', block: 'center' });
      const campo = novoAlvo.querySelector('input, select, button[role="radio"][aria-checked="true"]');
      if (campo) campo.focus({ preventScroll: true });
      return;
    }
    case 'desfazer': desfazer(); return;
    case 'salvar': salvar(); return;
    default: break;
  }
  if (UI.aba !== 'editor' || !cd) return;
  const i = inteiro(el.dataset.i, -1);
  if (acao === 'seg') {
    const c = el.dataset.c;
    if (String(pegar(cd, c)) === v && !(c === 'desenho' && cd.simbolo)) return;
    foto();
    por(cd, c, v);
    if (c === 'desenho') cd.simbolo = '';
    if (c === 'prazo.deNovo' && v === 'renova' && cd.prazo.modo !== 'turnos') anunciar('Sem prazo em turnos, ganhar de novo não muda nada.');
    UI.focar = `[data-acao="seg"][data-c="${CSS.escape(c)}"][data-v="${CSS.escape(v)}"]`;
    render();
    return;
  }
  if (acao === 'por-peca') {
    foto();
    const p = pecaNova(v);
    cd.pecas.push(p);
    UI.entrou = p.id;
    render();
    const nova = document.getElementById(`peca-${p.id}`);
    if (nova) { nova.scrollIntoView({ behavior: semMovimento() ? 'auto' : 'smooth', block: 'center' }); const f = nova.querySelector('select, input'); if (f) f.focus({ preventScroll: true }); }
    anunciar(`Peça posta: ${PECAS[v].nome}.`);
    return;
  }
  if (acao === 'subir-peca' || acao === 'descer-peca') {
    const j = acao === 'subir-peca' ? i - 1 : i + 1;
    if (j < 0 || j >= cd.pecas.length) return;
    foto();
    [cd.pecas[i], cd.pecas[j]] = [cd.pecas[j], cd.pecas[i]];
    UI.focar = `[data-acao="${acao}"][data-i="${j}"]`;
    render();
    return;
  }
  if (acao === 'tirar-peca') { const p = cd.pecas[i]; tirarComDesfazer(cd.pecas, i, `${PECAS[p.tipo].nome} tirada.`); return; }
  if (acao === 'tirar-efeito') { tirarComDesfazer(cd.pecas[i].efeitos, inteiro(el.dataset.j), 'Efeito tirado do gatilho.'); return; }
  if (acao === 'tirar-apaga') { tirarComDesfazer(cd.pecas[i].apaga, inteiro(el.dataset.j), 'Condição tirada da Contra-condição.'); return; }
  if (acao === 'tirar-saida') { const s = cd.saidas[i]; tirarComDesfazer(cd.saidas, i, `Saída tirada: ${nomeSaida(s.tipo)}.`); }
});

/* =============================================================== campos */
function valorDoCampo(el) {
  if (el.dataset.t === 'b') return el.checked;
  if (el.dataset.t === 'n') {
    if (el.value === '' || el.value === '-') return null;
    const min = Number(el.min), max = Number(el.max);
    return limitar(inteiro(el.value, 0), Number.isFinite(min) ? min : -9999, Number.isFinite(max) ? max : 9999);
  }
  return el.value;
}
/** Grava um campo do editor. Devolve true se a tela precisa ser redesenhada inteira. */
function gravarCampo(el, final) {
  const cd = E.rascunho;
  const c = el.dataset.c;
  const v = valorDoCampo(el);
  if (v === null) return false;
  if (pegar(cd, c) === v) return final && el.dataset.t === 'n' && String(v) !== el.value;
  foto(el.dataset.t === 'b' || el.tagName === 'SELECT' ? null : c);
  por(cd, c, v);
  // trocar o tipo do efeito do gatilho traz o número de partida do novo tipo
  if (/^pecas\.\d+\.efeitos\.\d+\.tipo$/.test(c)) { const e = pegar(cd, c.replace(/\.tipo$/, '')); if (v === 'curar') e.v = 20; if (v === 'dano') e.v = 30; }
  if (el.dataset.t === 'n' && final && String(v) !== el.value) el.value = v;
  return el.hasAttribute('data-f') || (final && el.dataset.t === 'n');
}
function testeDe(el) { return el.dataset.onde === 'cat' ? UI.testeCat : UI.teste; }

document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.id === 'busca') { UI.busca = el.value; UI.focar = '#busca'; render(); return; }
  if (UI.aba === 'editor' && el.dataset.c && !el.hasAttribute('data-f') && el.tagName !== 'SELECT') { gravarCampo(el, false); renderParcial(); }
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset.teste) {
    const T = testeDe(el);
    if (el.type === 'checkbox') T[el.dataset.teste] = el.checked;
    else if (el.type === 'number') { const min = Number(el.min), max = Number(el.max); T[el.dataset.teste] = limitar(inteiro(el.value, min), min, max); }
    else T[el.dataset.teste] = el.value;
    setTimeout(render, 0);
    return;
  }
  if (UI.aba !== 'editor') return;
  const cd = E.rascunho;
  const ac = el.dataset.acaoChange;
  if (ac === 'mais-efeito' && el.value) { foto(); const e = efeitoNovo(el.value); cd.pecas[inteiro(el.dataset.i)].efeitos.push(e); UI.entrou = e.id; UI.focar = `[data-acao-change="mais-efeito"][data-i="${el.dataset.i}"]`; render(); anunciar('Efeito posto no gatilho.'); return; }
  if (ac === 'mais-apaga' && el.value) { foto(); cd.pecas[inteiro(el.dataset.i)].apaga.push(el.value); UI.focar = `[data-acao-change="mais-apaga"][data-i="${el.dataset.i}"]`; render(); anunciar(`Apaga ${nomeCond(el.value)}.`); return; }
  if (ac === 'mais-saida' && el.value) { foto(); const s = saidaNova(el.value); cd.saidas.push(s); UI.entrou = s.id; UI.focar = '[data-acao-change="mais-saida"]'; render(); anunciar(`Saída posta: ${nomeSaida(el.value)}.`); return; }
  if (ac === 'comecar-de' && el.value) {
    const m = E.conds.find((x) => x.id === el.value);
    foto();
    const c = clone(m); E.comecouDe = m.id;
    Object.assign(cd, { tipo: c.tipo, cor: c.cor, desenho: c.desenho, simbolo: c.simbolo, prazo: c.prazo, saidas: c.saidas.map((s) => ({ ...s, id: novoId('s') })), pecas: c.pecas.map((p) => ({ ...p, id: novoId('p') })) });
    UI.focar = '[data-acao-change="comecar-de"]';
    render();
    avisar(`Peças de ${m.nome} postas. O nome continua o seu.`, () => desfazer());
    return;
  }
  // o símbolo digitado tira a marca do desenho escolhido
  if (el.dataset.c === 'simbolo') { gravarCampo(el, true); setTimeout(render, 0); return; }
  // o número grava ao sair do campo: redesenha depois que o foco já andou, para o Tab não se perder
  if (el.dataset.c && gravarCampo(el, true)) { if (el.dataset.t === 'n') setTimeout(render, 0); else render(); }
  else renderParcial();
});

/* =============================================================== teclado */
const emCampoDeTexto = (el) => el && (el.tagName === 'INPUT' && ['text', 'search', 'number'].includes(el.type));
document.addEventListener('keydown', (ev) => {
  const el = ev.target;
  const mod = ev.ctrlKey || ev.metaKey;
  if (mod && ev.key.toLowerCase() === 's' && UI.aba === 'editor') { ev.preventDefault(); if (el.dataset && el.dataset.c) gravarCampo(el, true); salvar(); return; }
  if (mod && ev.key.toLowerCase() === 'z' && !ev.shiftKey && UI.aba === 'editor' && !emCampoDeTexto(el)) { ev.preventDefault(); desfazer(); return; }
  if (ev.key === '/' && UI.aba === 'catalogo' && !emCampoDeTexto(el)) { ev.preventDefault(); $('#busca').focus(); return; }
  if (ev.key === 'Escape') {
    if (el.id === 'busca' && el.value) { UI.busca = ''; UI.focar = '#busca'; render(); return; }
    const ultimo = $('#avisos').lastElementChild;
    if (ultimo && ultimo.fechar) { ultimo.fechar(); return; }
  }
  // na lista do catálogo, as setas andam e escolhem
  if ((ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && el.classList && el.classList.contains('linha')) {
    const linhas = $$('.linha');
    const k = linhas.indexOf(el);
    const alvo = linhas[limitar(k + (ev.key === 'ArrowDown' ? 1 : -1), 0, linhas.length - 1)];
    ev.preventDefault();
    if (alvo && alvo !== el) alvo.click();
    return;
  }
  // grupos de opção (seg, cor, desenho, rodadas): setas andam e escolhem
  if (['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp', 'Home', 'End'].includes(ev.key) && el.getAttribute && el.getAttribute('role') === 'radio') {
    const grupo = el.closest('[role="radiogroup"]');
    if (!grupo) return;
    const radios = $$('[role="radio"]', grupo).filter((r) => !r.disabled);
    const k = radios.indexOf(el);
    const n = radios.length;
    const novoK = ev.key === 'Home' ? 0 : ev.key === 'End' ? n - 1 : (k + (ev.key === 'ArrowRight' || ev.key === 'ArrowDown' ? 1 : -1) + n) % n;
    ev.preventDefault();
    radios[novoK].focus();
    radios[novoK].click();
    return;
  }
  if (['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(ev.key) && el.classList && el.classList.contains('aba')) {
    const abas = $$('.aba');
    const k = abas.indexOf(el);
    const novoK = ev.key === 'Home' ? 0 : ev.key === 'End' ? abas.length - 1 : (k + (ev.key === 'ArrowRight' ? 1 : -1) + abas.length) % abas.length;
    ev.preventDefault();
    irPara(abas[novoK].dataset.aba, false);
    $$('.aba')[novoK].focus();
  }
});

comecar();
render();
</script>
</body>
