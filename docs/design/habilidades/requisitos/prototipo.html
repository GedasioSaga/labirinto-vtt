<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requisitos: protótipo para aprovar</title>
<style>
/*
 * REQUISITOS, protótipo de 23/11/2026 (pedido de 23/11 09h46 e respostas até 09h59).
 * Arquivo único, sem nada de fora. Os tokens são cópia dos `--lb-*` do app
 * (client/src/theme.ts) e dos `--bt-*` da batalha (components/batalha/combate.css):
 * mesmo nome, mesmo valor. As tiras, a leitura em papel e o registro copiam
 * combate.css e batalha.css. O app só tem tema escuro.
 */
:root {
  --lb-color-ink: #121214;
  --lb-color-stone: rgba(19, 19, 23, 0.94);
  --lb-color-stone-solid: #1a1a1e;
  --lb-color-stone-raised: #232328;
  --lb-color-stone-hover: #2c2c33;
  --lb-color-stone-sunken: #141417;
  --lb-color-line: rgba(255, 255, 255, 0.08);
  --lb-color-line-strong: rgba(255, 255, 255, 0.16);
  --lb-color-line-panel: rgba(255, 255, 255, 0.13);
  --lb-color-parchment: #eceae4;
  --lb-color-parchment-dim: #a2a09a;
  --lb-color-parchment-faint: #858480;
  --lb-color-brass: #e0a44a;
  --lb-color-brass-bright: #f3ba66;
  --lb-color-brass-soft: rgba(224, 164, 74, 0.14);
  --lb-color-brass-contrast: #1c1608;
  --lb-color-ember: #e2645a;
  --lb-color-ember-soft: rgba(226, 100, 90, 0.14);
  --lb-color-online: #7fb48a;
  --lb-color-online-soft: rgba(127, 180, 138, 0.14);
  --lb-color-tide: #79a9cc;
  --lb-color-tide-soft: rgba(121, 169, 204, 0.14);
  --lb-color-arcane: #ab93d6;
  --lb-color-arcane-soft: rgba(171, 147, 214, 0.15);
  --lb-font-display: 'Sitka Banner', 'Sitka Display', Sitka, Constantia, Georgia, 'Times New Roman', serif;
  --lb-font-sans: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
  --lb-font-utility: 'Bahnschrift', 'DIN Alternate', 'Segoe UI Variable Small', 'Segoe UI', system-ui, sans-serif;
  --lb-font-size-xs: 10.5px;
  --lb-font-size-sm: 11.5px;
  --lb-font-size-md: 13px;
  --lb-font-size-lg: 15px;
  --lb-font-size-xl: 20px;
  --lb-font-tracking-wide: 0.06em;
  --lb-font-tracking-wider: 0.14em;
  --lb-space-1: 4px;
  --lb-space-2: 8px;
  --lb-space-3: 12px;
  --lb-space-4: 16px;
  --lb-space-5: 20px;
  --lb-space-6: 24px;
  --lb-radius-sm: 6px;
  --lb-radius-md: 9px;
  --lb-radius-lg: 14px;
  --lb-radius-full: 999px;
  --lb-shadow-lg: 0 18px 44px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.34);
  --lb-shadow-float: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 14px rgba(0, 0, 0, 0.44), 0 20px 46px rgba(0, 0, 0, 0.55);
  --lb-shadow-focus: 0 0 0 2px var(--lb-color-stone-solid), 0 0 0 4px var(--lb-color-brass);
  --lb-shadow-bevel: inset 0 1px 0 rgba(255, 255, 255, 0.07);
  --lb-motion-fast: 110ms;
  --lb-motion-base: 170ms;
  --lb-gr-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --lb-gr-cartao: #211c15;
  --lb-gr-cartao-alto: #29231a;
  --lb-gr-campo: #15120e;
  --lb-gr-filete: rgba(236, 234, 228, 0.09);
  --lb-gr-filete-forte: rgba(236, 234, 228, 0.16);
  --lb-gr-filete-latao: rgba(224, 164, 74, 0.26);
  --lb-gr-gravado: #c8b089;
  --lb-gr-latao-1: #f6cb84;
  --lb-gr-latao-2: #e0a44a;
  --lb-gr-latao-3: #b87d2e;
  --lb-gr-hover: rgba(255, 236, 200, 0.06);
  --lb-gr-hover-forte: rgba(255, 236, 200, 0.1);
  /* batalha (combate.css) */
  --bt-tinta: #0c0c0e;
  --bt-papel: var(--lb-color-parchment);
  --bt-sangue: #b4493c;
  --bt-forma: var(--lb-color-arcane);
  --bt-titulo: 'Bahnschrift Condensed', 'Bahnschrift', var(--lb-font-utility);
  --bt-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  /* as tintas sobre o papel da leitura (as do combate.css: #8a2c22 e #5d5a54), mais o verde de "cumpriu" */
  --papel-falta: #8a2c22;
  --papel-tenue: #5d5a54;
  --papel-ok: #2d6a3e;
  --mu-erro-texto: #f0897f;
  --barra: 46px;
  /* a borda rasgada das caixas do combate (copiada do combate.css) */
  --bt-rasgo-caixa: polygon(0 3px, 6% 0, 13% 4px, 21% 1px, 28% 3px, 37% 0, 45% 4px, 52% 1px, 60% 3px, 68% 0, 76% 4px, 84% 1px, 92% 3px, 100% 0, calc(100% - 3px) 30%, 100% 60%, calc(100% - 2px) 100%, 92% calc(100% - 3px), 84% 100%, 76% calc(100% - 4px), 68% calc(100% - 1px), 60% calc(100% - 3px), 52% 100%, 45% calc(100% - 4px), 37% calc(100% - 1px), 28% calc(100% - 3px), 21% 100%, 13% calc(100% - 4px), 6% calc(100% - 1px), 0 calc(100% - 3px), 2px 60%, 0 30%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--lb-font-sans); font-size: var(--lb-font-size-md); line-height: 1.45;
  color: var(--lb-color-parchment); background: var(--lb-color-ink); overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled, [aria-disabled='true'] { cursor: not-allowed; }
h1, h2, h3, h4, p, ul, ol, dl, dd, fieldset, legend { margin: 0; padding: 0; border: 0; }
ul, ol { list-style: none; }
:focus-visible { outline: none; box-shadow: var(--lb-shadow-focus); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-family: var(--lb-font-utility); font-variant-numeric: tabular-nums; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ------------------------------------------------------------ barra do protótipo (não é do app) */
.proto {
  height: var(--barra); display: flex; align-items: center; gap: 10px; padding: 0 14px;
  background: #0c0c0e; border-bottom: 1px dashed var(--lb-gr-filete-forte);
  font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); white-space: nowrap; overflow-x: auto; scrollbar-width: thin;
}
.proto strong { color: var(--lb-color-parchment); font-weight: 600; }
.proto__telas { display: flex; gap: 4px; }
.proto__tela {
  min-height: 28px; padding: 0 10px; border-radius: var(--lb-radius-full); border: 1px solid var(--lb-gr-filete-forte);
  color: var(--lb-color-parchment-dim); font-size: var(--lb-font-size-sm);
  transition: background-color var(--lb-motion-fast) ease, border-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-gr-ease-out);
}
.proto__tela:active { transform: scale(0.97); }
.proto__tela[aria-pressed='true'] { background: var(--lb-color-brass-soft); border-color: var(--lb-gr-filete-latao); color: var(--lb-color-parchment); }
.proto__sobra { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.telas { position: relative; height: calc(100% - var(--barra)); min-height: 600px; }
.tela { position: absolute; inset: 0; overflow: hidden; }

/* ------------------------------------------------------------ primitivos */
.bt {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 0 12px;
  border-radius: var(--lb-radius-sm); background: var(--lb-gr-cartao-alto); color: var(--lb-color-parchment);
  border: 1px solid var(--lb-gr-filete-forte); font-weight: 500; white-space: nowrap;
  transition: background-color var(--lb-motion-fast) ease, border-color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-gr-ease-out), opacity var(--lb-motion-fast) ease;
}
.bt:active:not(:disabled):not([aria-disabled='true']) { transform: scale(0.97); }
.bt:disabled, .bt[aria-disabled='true'] { opacity: 0.45; }
@media (hover: hover) and (pointer: fine) {
  .bt:hover:not(:disabled) { border-color: var(--lb-gr-filete-latao); }
  .bt--fantasma:hover:not(:disabled) { background: var(--lb-gr-hover); border-color: transparent; color: var(--lb-color-parchment); }
}
.bt--latao { background: transparent; border-color: var(--lb-gr-filete-latao); color: var(--lb-color-brass-bright); }
.bt--fantasma { background: transparent; border-color: transparent; color: var(--lb-color-parchment-dim); }
.bt--p { min-height: 28px; padding: 0 9px; font-size: var(--lb-font-size-sm); }
.bt--ic { width: 32px; padding: 0; background: transparent; border-color: transparent; color: var(--lb-color-parchment-faint); }
.bt--ic.bt--p { width: 28px; }
.bt .ic { width: 15px; height: 15px; }
.etq {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: var(--lb-radius-full);
  font: 500 var(--lb-font-size-xs) / 1.6 var(--lb-font-utility); letter-spacing: var(--lb-font-tracking-wide); white-space: nowrap;
  background: var(--lb-gr-hover-forte); color: var(--lb-gr-gravado);
}
.etq[data-confere='auto'] { background: var(--lb-color-online-soft); color: var(--lb-color-online); }
.etq[data-confere='pergunta'] { background: var(--lb-color-tide-soft); color: var(--lb-color-tide); }
.etq[data-confere='d20'] { background: var(--lb-color-brass-soft); color: var(--lb-color-brass-bright); }
.etq[data-confere='caixa'] { background: var(--lb-color-arcane-soft); color: var(--lb-color-arcane); }
.entrada {
  width: 100%; min-height: 34px; padding: 0 10px; border-radius: var(--lb-radius-sm);
  border: 1px solid var(--lb-gr-filete-forte); background: var(--lb-gr-campo); color: var(--lb-color-parchment);
}
.entrada::placeholder { color: var(--lb-color-parchment-faint); }
.entrada:focus-visible { border-color: var(--lb-color-brass); }
.dica { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.rot { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }

/* segmentado: rádios que viram régua */
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--lb-radius-sm); background: var(--lb-gr-campo); border: 1px solid var(--lb-gr-filete); }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span {
  display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 4px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim);
  transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease;
}
.seg input:checked + span { background: var(--lb-gr-cartao-alto); color: var(--lb-color-parchment); box-shadow: inset 0 0 0 1px var(--lb-gr-filete-latao); }
.seg input:focus-visible + span { box-shadow: var(--lb-shadow-focus); }

/* chave (switch) e caixinha em pílula */
.sw { display: flex; align-items: center; gap: 10px; min-height: 36px; cursor: pointer; font-size: var(--lb-font-size-md); }
.sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw__trilho { position: relative; flex: none; width: 32px; height: 18px; border-radius: 9px; background: var(--lb-color-stone-hover); box-shadow: inset 0 0 0 1px var(--lb-color-line-strong); transition: background-color var(--lb-motion-fast) ease; }
.sw__trilho::after { content: ''; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--lb-color-parchment-dim); transition: transform 160ms var(--lb-gr-ease-out), background-color var(--lb-motion-fast) ease; }
.sw input:checked + .sw__trilho { background: var(--lb-color-brass-soft); box-shadow: inset 0 0 0 1px var(--lb-color-brass); }
.sw input:checked + .sw__trilho::after { transform: translateX(14px); background: var(--lb-color-brass-bright); }
.sw input:focus-visible + .sw__trilho { box-shadow: var(--lb-shadow-focus); }
.sw input:disabled ~ * { opacity: 0.45; }
.sw:has(input:disabled) { cursor: not-allowed; }
.sw small { display: block; font-size: var(--lb-font-size-xs); color: var(--lb-color-parchment-faint); }

.tg { position: relative; display: inline-flex; }
.tg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.tg span {
  display: inline-flex; align-items: center; gap: 5px; min-height: 26px; padding: 0 9px; border-radius: var(--lb-radius-full);
  border: 1px dashed var(--lb-gr-filete-forte); font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); white-space: nowrap;
  transition: background-color var(--lb-motion-fast) ease, border-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease;
}
.tg input:checked + span { border-style: solid; border-color: var(--lb-gr-filete-latao); background: var(--lb-color-brass-soft); color: var(--lb-color-brass-bright); }
.tg input:checked + span::before { content: '✓'; font-size: 11px; }
.tg input:focus-visible + span { box-shadow: var(--lb-shadow-focus); }

/* ============================================================ 1. O EDITOR (a ficha) */
.ed { position: absolute; inset: 0; display: grid; place-items: center; padding: 18px; background: radial-gradient(ellipse at 50% 0%, #1c1a17, var(--lb-color-ink) 70%); }
.janela {
  display: flex; flex-direction: column; width: min(1120px, 100%); height: min(860px, 100%);
  border: 1px solid var(--lb-color-line-panel); border-radius: var(--lb-radius-lg); background: var(--lb-color-stone-solid);
  box-shadow: var(--lb-shadow-lg), var(--lb-shadow-bevel); overflow: hidden;
}
.janela__topo { display: flex; align-items: baseline; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--lb-color-line); }
.janela__tit { font-family: var(--lb-font-display); font-size: var(--lb-font-size-xl); font-weight: 400; }
.janela__onde { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.janela__corpo { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr); }
.janela__lado { min-height: 0; overflow: auto; padding: 14px 10px; border-right: 1px solid var(--lb-color-line); background: var(--lb-color-stone-sunken); scrollbar-width: thin; }
.janela__principal { position: relative; min-height: 0; overflow: auto; padding: 16px 22px 60px; scrollbar-width: thin; }
.lado__tit { padding: 0 8px 8px; font: 500 var(--lb-font-size-xs) / 1.4 var(--lb-font-utility); letter-spacing: var(--lb-font-tracking-wider); text-transform: uppercase; color: var(--lb-color-parchment-faint); }
.lado__tit small { display: block; letter-spacing: 0.02em; text-transform: none; }
.ex { display: grid; gap: 1px; width: 100%; min-height: 48px; padding: 7px 10px; border-radius: var(--lb-radius-sm); text-align: left; transition: background-color var(--lb-motion-fast) ease; }
.ex b { font-weight: 600; }
.ex small { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
@media (hover: hover) and (pointer: fine) { .ex:hover { background: var(--lb-gr-hover); } }
.ex[aria-current='true'] { background: var(--lb-gr-hover-forte); box-shadow: inset 3px 0 0 var(--lb-color-brass); }
.ex[aria-current='true'] small { color: var(--lb-color-parchment-dim); }

.cartao-lido { display: grid; gap: 4px; padding: 12px 16px; border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-md); background: var(--lb-color-stone-sunken); }
.cartao-lido__nome { font-family: var(--lb-font-display); font-size: 22px; line-height: 1.15; }
.cartao-lido__linha { color: var(--lb-color-parchment-dim); font-size: var(--lb-font-size-md); }
.cartao-lido__nota { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }

.rq { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--lb-color-line); }
.rq__cab { display: grid; gap: 2px; }
.mec__tit { font: 500 var(--lb-font-size-xs) / 1 var(--lb-font-utility); letter-spacing: var(--lb-font-tracking-wider); text-transform: uppercase; color: var(--lb-color-parchment-faint); }
.mec__pergunta { font-family: var(--lb-font-display); font-size: 19px; line-height: 1.25; }
.rq__para { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.rq-e { align-self: flex-start; margin: -2px 0 -2px 14px; padding: 0 8px; font: 600 var(--lb-font-size-xs) / 1.8 var(--lb-font-utility); letter-spacing: var(--lb-font-tracking-wider); text-transform: uppercase; color: var(--lb-color-parchment-faint); border-left: 1px dashed var(--lb-gr-filete-forte); }
.rq-grupo { border: 1px solid var(--lb-color-line-strong); border-radius: var(--lb-radius-md); background: var(--lb-color-stone-raised); }
.rq-grupo[data-modo='um'] { border-color: var(--lb-gr-filete-latao); }
.rq-grupo__cab { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--lb-color-line); }
.rq-grupo__cab .bt--ic { margin-left: auto; }
.rq-lins { display: flex; flex-direction: column; }
.rq-lin {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto 28px; gap: 6px 10px; align-items: center; min-height: 48px; padding: 6px 8px 6px 12px;
  border-bottom: 1px solid var(--lb-color-line);
}
.rq-lin:last-child { border-bottom: 0; }
/* linha recém-posta: entra uma vez (o render limpa a marca depois) */
.rq-lin[data-entra] { animation: lin-entra 180ms var(--bt-ease-out) both; }
@keyframes lin-entra { from { opacity: 0; transform: translateY(-4px); } }
.rq-cod { font: 600 var(--lb-font-size-sm) / 1 var(--lb-font-utility); color: var(--lb-color-parchment-faint); font-variant-numeric: tabular-nums; }
.rq-frase { line-height: 2.1; min-width: 0; }
.rq-frase[data-nao='sim']::before { content: 'Não ter:'; margin-right: 6px; padding: 1px 6px; border-radius: 3px; background: var(--lb-color-ember-soft); color: var(--mu-erro-texto); font: 600 var(--lb-font-size-xs) / 1.6 var(--lb-font-utility); letter-spacing: 0.04em; text-transform: uppercase; }
.rq-opcoes { display: flex; gap: 6px; }
.rq-vazio { padding: 12px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.rq-grupo__pe { padding: 8px 10px 10px; border-top: 1px solid var(--lb-color-line); }
.rq-aviso { padding: 0 12px 10px; font-size: var(--lb-font-size-sm); color: var(--lb-color-brass-bright); }
.f-num, .f-txt, .f-sel {
  display: inline-block; vertical-align: baseline; min-height: 28px; margin: 0 2px; padding: 0 6px; border-radius: 5px;
  border: 1px solid var(--lb-gr-filete-forte); background: var(--lb-gr-campo); color: var(--lb-color-parchment);
  font-family: var(--lb-font-utility); font-variant-numeric: tabular-nums; font-size: 13.5px;
  transition: border-color var(--lb-motion-fast) ease;
}
.f-num { width: 6ch; text-align: right; }
.f-txt { width: var(--w, 24ch); max-width: 100%; }
@supports (field-sizing: content) { .f-txt { field-sizing: content; width: auto; min-width: 10ch; max-width: 100%; } }
.f-sel { padding-right: 4px; cursor: pointer; max-width: 100%; }
.f-num:focus-visible, .f-txt:focus-visible, .f-sel:focus-visible { border-color: var(--lb-color-brass); }

/* o menu de pôr requisito: cresce do botão */
.ancora { position: relative; display: inline-block; }
.pk {
  position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; width: 400px; display: flex; flex-direction: column; max-height: 430px;
  border: 1px solid var(--lb-color-line-panel); border-radius: var(--lb-radius-md); background: var(--lb-color-stone-solid); box-shadow: var(--lb-shadow-float);
  transform-origin: top left;
}
.pk[data-entra] { animation: pk-entra 150ms var(--lb-gr-ease-out) both; }
@keyframes pk-entra { from { opacity: 0; transform: scale(0.96); } }
.pk__busca { position: relative; padding: 8px 8px 6px; }
.pk__busca .ic { position: absolute; left: 18px; top: 17px; color: var(--lb-color-parchment-faint); }
.pk__busca .entrada { padding-left: 32px; }
.pk__letras { display: flex; gap: 2px; padding: 0 8px 6px; border-bottom: 1px solid var(--lb-color-line); }
.pk__letra { flex: 1; min-height: 28px; border-radius: 4px; font: 600 var(--lb-font-size-sm) / 1 var(--lb-font-utility); color: var(--lb-color-parchment-dim); transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease; }
@media (hover: hover) and (pointer: fine) { .pk__letra:hover { background: var(--lb-gr-hover-forte); color: var(--lb-color-parchment); } }
.pk__lista { overflow: auto; padding: 4px 6px 8px; scrollbar-width: thin; overscroll-behavior: contain; }
.pk__gr { position: sticky; top: -4px; z-index: 1; padding: 8px 6px 4px; background: var(--lb-color-stone-solid); font: 600 var(--lb-font-size-xs) / 1.3 var(--lb-font-utility); letter-spacing: var(--lb-font-tracking-wide); text-transform: uppercase; color: var(--lb-color-parchment-faint); }
.pk__op { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 0 8px; align-items: baseline; width: 100%; padding: 6px 6px; border-radius: var(--lb-radius-sm); text-align: left; }
.pk__op b { font-weight: 500; }
.pk__op small { grid-column: 2; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.pk__op .rq-cod { grid-row: span 2; }
.pk__op .etq { grid-row: span 2; align-self: center; }
.pk__op:disabled { opacity: 0.45; }
@media (hover: hover) and (pointer: fine) { .pk__op:hover:not(:disabled) { background: var(--lb-gr-hover-forte); } }
.pk__op:focus-visible { background: var(--lb-gr-hover-forte); }
.pk__nada { display: grid; gap: 8px; justify-items: start; padding: 14px 8px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }

/* o resumo em palavras */
.resumo { display: grid; gap: 10px; margin-top: 14px; padding: 12px 14px; border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-md); background: var(--lb-color-stone-sunken); }
.resumo__frase { max-width: 72ch; font-size: var(--lb-font-size-lg); line-height: 1.5; }
.resumo__lin { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }
.resumo__falta { padding: 3px 10px 4px; background: var(--bt-tinta); color: var(--lb-color-ember); font-size: var(--lb-font-size-sm); box-shadow: 3px 3px 0 var(--bt-sangue); max-width: 64ch; }
.resumo__falta b { font-family: var(--bt-titulo); font-stretch: condensed; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--lb-color-parchment-faint); margin-right: 6px; }

/* ============================================================ A BATALHA (o mapa, o menu, a leitura, o registro) */
.campo {
  position: absolute; inset: 0; display: grid; grid-template-columns: minmax(300px, 470px) minmax(280px, 360px) minmax(250px, 320px);
  gap: 30px; align-items: start; padding: 22px 28px 28px; overflow: auto; scrollbar-width: thin;
  background-color: #15171a;
  background-image:
    linear-gradient(90deg, rgba(8, 8, 10, 0.86), rgba(8, 8, 10, 0.35) 46%, rgba(8, 8, 10, 0.6)),
    linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
    radial-gradient(ellipse at 62% 46%, #2a2b22, #15171a 70%);
  background-size: 100% 100%, 48px 48px, 48px 48px, 100% 100%;
}
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.bt-vez { display: flex; flex-direction: column; color: var(--bt-papel); }
.bt-vez__cabeca { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px var(--lb-space-3); margin: calc(6px + 5.3%) 0 10px 6px; transform: rotate(-3deg); transform-origin: left bottom; }
.bt-vez__quem { font-family: var(--bt-titulo); font-stretch: condensed; font-weight: 700; font-size: clamp(22px, 2.6vw, 34px); line-height: 0.95; letter-spacing: 0.02em; text-transform: uppercase; color: var(--bt-papel); text-shadow: 3px 3px 0 var(--bt-sangue); }
.bt-vez__economia { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 3px; font-family: var(--lb-font-utility); font-size: var(--lb-font-size-xs); letter-spacing: 0.08em; text-transform: uppercase; }
.bt-pip { padding: 1px 6px; border-radius: 3px; background: var(--bt-papel); color: var(--bt-tinta); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bt-pip[data-gasto='sim'] { background: rgba(255, 255, 255, 0.1); color: var(--lb-color-parchment-faint); text-decoration: line-through; font-weight: 400; }
.bt-pip--carga { background: var(--lb-color-brass-soft); color: var(--lb-color-brass-bright); }
.bt-pip--forma { background: var(--lb-color-arcane-soft); color: var(--bt-forma); }
.bt-pip--alerta { background: var(--bt-sangue); color: #fff; }
.bt-vez__tiras { display: flex; flex-direction: column; gap: 13px; padding: 10px 26px calc(8px + 3%) 12px; }
.bt-vez__dica { margin: 4px 0 0 8px; font-family: var(--lb-font-utility); font-size: var(--lb-font-size-xs); letter-spacing: 0.06em; color: var(--lb-color-parchment-dim); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9); }
.bt-vez__dica kbd { padding: 0 4px; border-radius: 3px; background: rgba(255, 255, 255, 0.14); font-family: inherit; color: var(--lb-color-parchment); }

.bt-tira {
  position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; column-gap: 14px;
  width: 100%; min-height: 44px; padding: 9px 22px 11px 24px; border: 0; background: none; color: var(--bt-papel); font: inherit; text-align: left; cursor: pointer;
  transform: rotate(var(--giro, -3deg)) translateX(var(--dx, 0px));
  transition: transform 80ms var(--bt-ease-out), color 80ms ease;
}
.bt-tira::before { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--bt-tinta); clip-path: var(--rasgo); transition: background-color 90ms ease; }
.bt-tira::after { content: ''; position: absolute; inset: 0; z-index: -2; background: var(--bt-sangue); clip-path: var(--rasgo2); transform: translate(5px, 5px); transition: transform var(--lb-motion-fast) var(--bt-ease-out); }
.bt-tira__nome { min-width: 0; font-family: var(--bt-titulo); font-stretch: condensed; font-weight: 700; font-size: clamp(18px, 2.1vw, 28px); line-height: 1.05; letter-spacing: 0.02em; text-transform: uppercase; overflow-wrap: anywhere; }
.bt-tira__lado { font-family: var(--bt-titulo); font-stretch: condensed; font-weight: 700; font-size: clamp(15px, 1.6vw, 22px); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bt-tira__det { grid-column: 1 / -1; margin-top: 2px; font-size: 13px; line-height: 1.35; color: var(--lb-color-parchment-dim); }
.bt-tira__chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.bt-tira__tecla { position: absolute; left: 9px; top: 13px; font-family: var(--lb-font-utility); font-size: 11px; font-weight: 700; line-height: 1; color: var(--lb-color-parchment-faint); pointer-events: none; }
.bt-tira[data-esta='sim'] { --dx: 14px; color: var(--bt-tinta); }
.bt-tira[data-esta='sim']::before { background: var(--bt-papel); }
.bt-tira[data-esta='sim']::after { transform: translate(10px, 7px); }
.bt-tira[data-esta='sim'] .bt-tira__det { color: #3b3a36; }
.bt-tira[data-esta='sim'] .bt-tira__tecla { color: rgba(12, 12, 14, 0.5); }
.bt-tira[aria-disabled='true'] { color: var(--lb-color-parchment-faint); }
.bt-tira[aria-disabled='true']::after { opacity: 0.25; }
.bt-tira[aria-disabled='true'] .bt-tira__det { color: var(--lb-color-ember); }
.bt-tira[aria-disabled='true'][data-esta='sim'] { color: var(--papel-tenue); }
.bt-tira[aria-disabled='true'][data-esta='sim'] .bt-tira__det { color: var(--papel-falta); }
.bt-tira:not([aria-disabled='true']):active { transform: rotate(var(--giro, -3deg)) translateX(var(--dx, 0px)) scale(0.97); }
.bt-tira:focus-visible { outline: none; box-shadow: none; }
.bt-tira:not([data-esta='sim']):focus-visible { outline: 2px solid var(--lb-color-brass-bright); outline-offset: 5px; }
.bt-tira--pequena .bt-tira__nome { font-size: clamp(15px, 1.6vw, 20px); }
.bt-tira--forma::after { background: var(--bt-forma); }
/* a evolução pendurada na tira de cima: menor e recuada, com a seta */
.bt-tira--evo { width: calc(100% - 30px); margin: -4px 0 0 30px; }
.bt-tira--evo .bt-tira__nome::before { content: '↳ '; font-weight: 400; }
.bt-tira--super::before { background: linear-gradient(100deg, var(--bt-tinta) 55%, #2a1e0c); }
.bt-tira--super::after { background: var(--lb-color-brass); }
.bt-tira--super[data-esta='sim']::before { background: linear-gradient(100deg, var(--bt-papel) 55%, var(--lb-gr-latao-1)); }

.bt-etq { padding: 1px 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.1); font-family: var(--lb-font-utility); font-size: var(--lb-font-size-xs); letter-spacing: 0.04em; white-space: nowrap; color: var(--lb-color-parchment); }
.bt-etq--dano { background: var(--bt-sangue); color: #fff; }
.bt-etq--over { background: var(--lb-color-brass); color: var(--lb-color-brass-contrast); font-weight: 700; }
.bt-etq--forma { background: var(--lb-color-arcane-soft); color: var(--bt-forma); }
.bt-etq--vazado { background: transparent; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4); text-transform: uppercase; letter-spacing: 0.08em; }
.bt-etq--evolui { background: transparent; outline: 1px dashed rgba(255, 255, 255, 0.55); outline-offset: -1px; text-transform: uppercase; letter-spacing: 0.08em; }
.bt-etq--req { background: transparent; box-shadow: inset 0 0 0 1px rgba(243, 186, 102, 0.55); color: var(--lb-color-brass-bright); text-transform: uppercase; letter-spacing: 0.08em; }
.bt-tira[data-esta='sim'] .bt-etq { background: rgba(12, 12, 14, 0.1); color: var(--bt-tinta); }
.bt-tira[data-esta='sim'] .bt-etq--dano { background: var(--bt-sangue); color: #fff; }
.bt-tira[data-esta='sim'] .bt-etq--over { background: var(--bt-tinta); color: var(--lb-color-brass-bright); }
.bt-tira[data-esta='sim'] .bt-etq--forma { background: rgba(110, 80, 170, 0.18); color: #4b3482; }
.bt-tira[data-esta='sim'] .bt-etq--vazado, .bt-tira[data-esta='sim'] .bt-etq--req { background: transparent; box-shadow: inset 0 0 0 1px rgba(12, 12, 14, 0.45); }
.bt-tira[data-esta='sim'] .bt-etq--evolui { background: transparent; outline-color: rgba(12, 12, 14, 0.6); }

/* o momento da evolução (raro: 1 vez por batalha). Um brilho de latão corre a tira e o nome novo entra. */
.bt-tira__brilho { position: absolute; inset: 0; z-index: 1; clip-path: var(--rasgo); pointer-events: none; overflow: hidden; }
.bt-tira__brilho::before {
  content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(246, 203, 132, 0), var(--lb-gr-latao-1) 70%, #fff4dc);
  transform: scaleX(0); transform-origin: left center; opacity: 0;
}
.bt-tira[data-evoluiu] .bt-tira__brilho::before { animation: evo-varre 440ms var(--bt-ease-out) both; }
.bt-tira[data-evoluiu] .bt-tira__nome { animation: evo-nome 260ms var(--bt-ease-out) 150ms both; }
.bt-tira[data-evoluiu] .bt-tira__chips { animation: evo-chips 220ms var(--bt-ease-out) 230ms both; }
@keyframes evo-varre { 0% { transform: scaleX(0); opacity: 0.9; } 55% { transform: scaleX(1); opacity: 0.9; } 100% { transform: scaleX(1); opacity: 0; } }
@keyframes evo-nome { from { opacity: 0; filter: blur(3px); transform: translateX(-8px); } }
@keyframes evo-chips { from { opacity: 0; transform: translateY(4px); } }

/* a leitura (o papel ao lado do menu, como .bt-detalhe--lado) */
.bt-detalhe {
  padding: 14px 18px 16px; background: var(--bt-papel); color: var(--bt-tinta); box-shadow: 7px 7px 0 var(--bt-sangue);
  font-size: var(--lb-font-size-md); line-height: 1.5; margin-top: 18px;
}
.bt-detalhe__nome { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 10px; padding-bottom: 8px; border-bottom: 2px solid var(--bt-tinta); font-family: var(--bt-titulo); font-stretch: condensed; font-weight: 700; font-size: clamp(18px, 1.8vw, 24px); line-height: 1.05; letter-spacing: 0.02em; text-transform: uppercase; overflow-wrap: anywhere; }
.bt-detalhe__custo { flex: none; color: var(--bt-sangue); font-variant-numeric: tabular-nums; }
.bt-detalhe dl { display: grid; gap: 8px; }
.bt-detalhe dt, .rq-k { font-family: var(--lb-font-utility); font-size: var(--lb-font-size-xs); letter-spacing: 0.1em; text-transform: uppercase; color: var(--bt-sangue); font-weight: 700; }
.bt-detalhe dd { overflow-wrap: anywhere; }
.bt-detalhe__sep { margin: 12px 0 8px; border-top: 1px solid rgba(12, 12, 14, 0.2); }

/* a lista de conferência dos requisitos, no papel */
.rq-ck { display: grid; gap: 8px; }
.rq-ck__gr { display: grid; gap: 3px; }
.rq-ck__cab { display: flex; align-items: center; gap: 6px; }
.rq-ck__cab .rq-k { color: var(--bt-tinta); }
.rq-ck__est { font: 600 var(--lb-font-size-xs) / 1 var(--lb-font-utility); letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 5px; border-radius: 3px; }
.rq-ck__est[data-ok='sim'] { background: rgba(45, 106, 62, 0.14); color: var(--papel-ok); }
.rq-ck__est[data-ok='nao'] { background: rgba(138, 44, 34, 0.1); color: var(--papel-falta); }
.rq-ck__it { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; align-items: start; }
.rq-ck__it .ic { width: 15px; height: 15px; margin-top: 2px; stroke-width: 2.2; }
.rq-ck__it[data-ok='sim'] .ic { color: var(--papel-ok); }
.rq-ck__it[data-ok='nao'] { color: var(--papel-falta); font-weight: 600; }
.rq-ck__it[data-ok='hora'] .ic { color: var(--bt-tinta); }
.rq-ck__it[data-ok='nc'] { color: var(--papel-tenue); }
.rq-ck__it small { display: block; font-weight: 400; font-size: var(--lb-font-size-sm); color: var(--papel-tenue); }
.rq-ck__it[data-ok='nao'] small { color: var(--papel-falta); }

/* o contador (Polaridade) e as Partes da forma: segmentos inclinados */
.cont { display: grid; gap: 4px; }
.cont__lin { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.cont__nome { font-family: var(--bt-titulo); font-stretch: condensed; font-weight: 700; font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; }
.cont__n { font-family: var(--bt-titulo); font-stretch: condensed; font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.cont__segs { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 5px; }
.cont__seg { position: relative; height: 12px; transform: skewX(-14deg); background: rgba(12, 12, 14, 0.12); overflow: hidden; }
.cont__seg::after { content: ''; position: absolute; inset: 0; background: var(--c, var(--lb-gr-latao-3)); transform: scaleX(0); transform-origin: left center; }
.cont__seg[data-cheio]::after { transform: scaleX(1); }
.cont__seg[data-novo]::after { animation: enche 220ms var(--bt-ease-out) both; }
@keyframes enche { from { transform: scaleX(0); } }
.cont--escuro .cont__seg { background: rgba(255, 255, 255, 0.1); }
.cont--escuro { color: var(--bt-papel); }
.partes { display: flex; align-items: center; gap: 8px; margin: 0 0 4px 8px; transform: rotate(-3deg); transform-origin: left bottom; }
.partes .cont__segs { width: 132px; }
.partes__txt { font-family: var(--bt-titulo); font-stretch: condensed; font-weight: 700; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--bt-forma); }

/* botões em cima do papel e na tinta: carimbos (como o .bt-zerar do app) */
.bt-carimbo {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 4px 14px;
  border: 2px solid var(--bt-tinta); border-radius: 3px; background: var(--bt-tinta); color: var(--bt-papel);
  font-family: var(--bt-titulo); font-stretch: condensed; font-weight: 700; font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase;
  box-shadow: 3px 3px 0 var(--bt-sangue); transition: transform 120ms var(--bt-ease-out), background-color 80ms ease, color 80ms ease;
}
.bt-carimbo:active:not(:disabled) { transform: scale(0.97); }
.bt-carimbo:disabled { opacity: 0.4; box-shadow: none; }
.bt-carimbo:focus-visible { outline: 2px solid var(--lb-color-brass-bright); outline-offset: 3px; box-shadow: 3px 3px 0 var(--bt-sangue); }
.bt-carimbo--vazado { background: transparent; color: var(--bt-tinta); box-shadow: none; }
.bt-carimbo--latao { background: var(--lb-color-brass); border-color: var(--bt-tinta); color: var(--lb-color-brass-contrast); }
.bt-carimbo--claro { border-color: var(--bt-papel); background: var(--bt-papel); color: var(--bt-tinta); }
.bt-carimbo--claro.bt-carimbo--vazado { background: transparent; color: var(--bt-papel); }
.acoes { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-top: 12px; }
.acoes__por-que { flex-basis: 100%; font-size: var(--lb-font-size-sm); color: var(--papel-falta); }
.mestre-nota { flex-basis: 100%; font-size: var(--lb-font-size-sm); color: var(--papel-tenue); }

/* a resolução na hora de usar: escolher, pedir, rolar, marcar */
.rv { display: grid; gap: 12px; }
.rv__passo { display: grid; gap: 6px; }
.rv__op { position: relative; display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; align-items: start; min-height: 44px; padding: 8px 10px; border: 1.5px solid rgba(12, 12, 14, 0.25); cursor: pointer; transition: border-color 90ms ease, background-color 90ms ease; }
.rv__op input { margin: 3px 0 0; accent-color: var(--bt-sangue); width: 16px; height: 16px; }
.rv__op:has(input:checked) { border-color: var(--bt-tinta); background: rgba(12, 12, 14, 0.06); }
.rv__op:has(input:disabled) { cursor: not-allowed; color: var(--papel-tenue); }
.rv__op:has(input:focus-visible) { outline: 2px solid var(--bt-sangue); outline-offset: 2px; }
.rv__op b { font-weight: 600; }
.rv__op small { display: block; font-size: var(--lb-font-size-sm); color: var(--papel-tenue); }
.rv__msg { padding: 6px 10px; border-left: 3px solid var(--bt-sangue); background: rgba(180, 73, 60, 0.08); font-size: var(--lb-font-size-md); }
.rv__msg[data-tom='ok'] { border-left-color: var(--papel-ok); background: rgba(45, 106, 62, 0.08); }
.espera { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.espera__ponto { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulso 1200ms linear infinite; }
@keyframes pulso { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

/* o d20 do teste */
.dado { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px 10px; background: var(--bt-tinta); color: var(--bt-papel); box-shadow: 4px 4px 0 var(--bt-sangue); }
.dado[data-entra] { animation: dado-entra 180ms var(--bt-ease-out) both; }
@keyframes dado-entra { from { opacity: 0; transform: scale(0.95); } }
.dado__face { display: grid; place-items: center; width: 64px; height: 64px; clip-path: polygon(50% 0, 96% 26%, 96% 74%, 50% 100%, 4% 74%, 4% 26%); background: var(--bt-papel); color: var(--bt-tinta); font-family: var(--bt-titulo); font-stretch: condensed; font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums; }
.dado[data-ok='nao'] .dado__face { background: var(--bt-sangue); color: #fff; }
.dado__txt b { display: block; font-family: var(--bt-titulo); font-stretch: condensed; font-weight: 700; font-size: 20px; letter-spacing: 0.03em; text-transform: uppercase; }
.dado__txt span { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }

/* a caixa "Cumpriu?" (personalizado): tinta, borda rasgada, como a caixa REAÇÃO */
.cumpriu { position: relative; display: grid; gap: 10px; padding: 16px 18px 18px; background: var(--bt-tinta); color: var(--bt-papel); clip-path: var(--bt-rasgo-caixa, none); box-shadow: inset 4px 0 0 var(--lb-color-arcane); }
.cumpriu[data-entra] { animation: pedido-entra 200ms var(--bt-ease-out) both; }
.cumpriu__tit { font-family: var(--bt-titulo); font-stretch: condensed; font-weight: 700; font-size: 26px; line-height: 1; letter-spacing: 0.03em; text-transform: uppercase; text-shadow: 3px 3px 0 var(--bt-sangue); }
.cumpriu__marca { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; min-height: 44px; padding: 10px 12px; border: 1.5px dashed rgba(236, 234, 228, 0.35); cursor: pointer; font-size: var(--lb-font-size-lg); line-height: 1.35; transition: border-color 90ms ease, background-color 90ms ease; }
.cumpriu__marca input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--lb-color-brass); }
.cumpriu__marca:has(input:checked) { border-style: solid; border-color: var(--lb-color-brass); background: var(--lb-color-brass-soft); }
.cumpriu__marca:has(input:focus-visible) { outline: 2px solid var(--lb-color-brass-bright); outline-offset: 2px; }
.cumpriu__nota { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }
.cumpriu__falta { font-size: var(--lb-font-size-sm); color: var(--lb-color-ember); }

<script>
'use strict';
/* ==========================================================================
 * DADOS. As fichas são as reais da pasta One Piece (auditorias de 07/11/2026,
 * docs/auditoria-fichas/): Siegfried, Vagn, Ryoko e Vincent, com os números de
 * lá. Os requisitos são os 49 tipos de REQUISITOS-LISTA.md (A1 a J2).
 * ========================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (v) => JSON.parse(JSON.stringify(v));
const ic = (n) => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const semAcento = (t) => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const cap = (t) => (t ? t[0].toUpperCase() + t.slice(1) : '');
let seq = 0;
const uid = (p) => (p || 'r') + (++seq);
function juntar(ts, conj) {
  const v = ts.filter(Boolean);
  if (v.length <= 1) return v[0] || '';
  return v.slice(0, -1).join(', ') + ' ' + conj + ' ' + v[v.length - 1];
}
const masc = (nome) => /^(Caminho|Campo|Olhar|Passo|Golpe|Sopro|Chute|Grito)/.test(nome);
const ligad = (nome) => (masc(nome) ? 'ligado' : 'ligada');
const desligad = (nome) => (masc(nome) ? 'desligado' : 'desligada');

/* A borda rasgada e o giro das tiras: o mesmo código de ListaDeTecnicas.tsx. */
const GIROS = [-3, -1.6, -2.6, -1.2, -3.4, -2];
function mulberry32(semente) {
  let a = semente >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rasgo(semente, amplitude = 4) {
  const r = mulberry32(semente);
  const n = 28;
  const p = [];
  for (let i = 0; i <= n; i += 1) p.push(`${((i / n) * 100).toFixed(2)}% ${(r() * amplitude).toFixed(1)}px`);
  for (let i = 1; i <= 3; i += 1) p.push(`calc(100% - ${(r() * amplitude * 1.6).toFixed(1)}px) ${i * 25}%`);
  for (let i = n; i >= 0; i -= 1) p.push(`${((i / n) * 100).toFixed(2)}% calc(100% - ${(r() * amplitude).toFixed(1)}px)`);
  for (let i = 3; i >= 1; i -= 1) p.push(`${(r() * amplitude * 1.6).toFixed(1)}px ${i * 25}%`);
  return `polygon(${p.join(',')})`;
}
function sementeDe(texto) {
  let h = 2166136261;
  for (let i = 0; i < texto.length; i += 1) h = Math.imul(h ^ texto.charCodeAt(i), 16777619);
  return h >>> 0;
}

/* ------------------------------------------------------------ os 49 tipos (REQUISITOS-LISTA.md) */
const GRUPOS = [
  ['A', 'Recursos de quem usa'], ['B', 'Estado de quem usa'], ['C', 'Tempo e ordem'], ['D', 'Alvo'], ['E', 'Campo'],
  ['F', 'Equipamento'], ['G', 'Aliados'], ['H', 'Testes'], ['I', 'Transformação e evolução'], ['J', 'Personalizado'],
];
const CONFERE = { auto: 'Auto', pergunta: 'Pergunta', d20: 'Rola d20', caixa: 'Cumpriu?' };
const CONFERE_LONGO = { auto: 'o app confere sozinho', pergunta: 'pergunta a alguém na hora', d20: 'rola o d20 na hora', caixa: 'quem usa marca a caixa «Cumpriu?»' };
const TIPOS = {};
/* molde: a frase do editor. {chave:num:Rótulo} número; {chave:sel:Rótulo:a|b} ou {chave:sel:Rótulo:@LISTA} escolha; {chave:txt:Rótulo} texto. */
function tipo(cod, nome, ex, confere, molde, texto, extra) {
  TIPOS[cod] = Object.assign({ cod, grupo: cod[0], nome, ex, confere, molde, texto, padrao: {} }, extra || {});
}
tipo('A1', 'Ter SP (só exige ou gasta)', '“Só com 100 SP ou mais”; “gastar 50 SP”', 'auto', 'Ter pelo menos {n:num:Quanto de SP} de SP', (r) => (r.gasta ? `gastar ${r.n} SP` : `ter ${r.n} SP ou mais`), { gasta: true, padrao: { n: 50, gasta: false } });
tipo('A2', 'Vida abaixo ou acima de X%', '“Só abaixo de 30% de vida”', 'auto', 'Vida {lado:sel:Lado:abaixo de|acima de} {n:num:Porcentagem}%', (r) => `ter a vida ${r.lado} ${r.n}%`, { padrao: { lado: 'abaixo de', n: 30 } });
tipo('A3', 'Ter Escudo (ou estar sem)', '“Só com o escudo de pé”', 'auto', 'Ter Escudo de pé', (r) => (r.nao ? 'estar sem Escudo' : 'ter Escudo de pé'), { nao: true });
tipo('A4', 'Nível de um acumulador', 'Polaridade 2 do Vagn, Fúria, Cargas (crie na tela 8)', 'auto', '{cont:sel:Acumulador:@CONT} no nível {n:num:Nível} ou mais', (r) => `ter ${r.cont} no nível ${r.n} ou mais` + (r.gasta ? ` (e gasta ${r.n})` : ''), { gasta: true, padrao: { cont: '@0', n: 2, gasta: true } });
tipo('A5', 'Concentração (as cargas de 0 a 3)', '“Concentrado 2x” (super lobo do Alexei)', 'auto', 'Concentração {n:num:Cargas} ou mais', (r) => `ter Concentração ${r.n} ou mais` + (r.gasta ? ` (e gasta ${r.n})` : ''), { gasta: true, padrao: { n: 2 } });
tipo('A6', 'Pagar com vida', 'Chamas Celestes: 10% do HP', 'auto', 'Pagar {n:num:Quanto} {un:sel:Unidade:% do HP|de HP}', (r) => `pagar ${r.n}${r.un === '% do HP' ? '% do HP' : ' de HP'}`, { padrao: { n: 10, un: '% do HP' } });
tipo('A7', 'Ter a reação livre (e gasta)', 'Carregar a Polaridade gasta a reação', 'auto', 'Ter a reação livre', (r) => (r.gasta ? 'gastar a reação' : 'ter a reação livre'), { gasta: true, padrao: { gasta: true } });
tipo('B1', 'Técnica ou passiva ligada', 'Melodia de Todas as Coisas ligada (Sieg)', 'auto', (r) => `{tec:sel:Técnica:@TEC} ${ligad(r.tec || '')}`, (r) => (r.nao ? `estar com ${r.tec} ${desligad(r.tec)}` : `estar com ${r.tec} ${ligad(r.tec)}`), { nao: true, padrao: { tec: '@0' } });
tipo('B2', 'Ter um selo em si (ou não ter)', '“Só Fortalecido”; “não pode estar Atordoado”', 'auto', 'Ter o selo {selo:sel:Selo:@SELOS} em si', (r) => (r.nao ? `não estar ${r.selo}` : `estar ${r.selo}`), { nao: true, padrao: { selo: 'Fortalecido' } });
tipo('B3', 'Estar numa forma (ou fora dela)', '“Só na Parte 2 da Forma Híbrida”', 'auto', 'Estar na forma {forma:sel:Forma:@FORMAS}', (r) => (r.nao ? `estar fora da ${r.forma}` : `estar na ${r.forma}`), { nao: true, padrao: { forma: '@0' } });
tipo('B4', 'Não ter andado nesta vez', 'Tiro de precisão: parado', 'auto', 'Não ter andado nesta vez', () => 'não ter andado nesta vez');
tipo('B5', 'Ter andado N casas nesta vez', 'Investida: correu 3 casas', 'auto', 'Ter andado {n:num:Casas} casas ou mais nesta vez', (r) => `ter andado ${r.n} casas ou mais nesta vez`, { padrao: { n: 3 } });
tipo('B6', 'Ter recebido dano desde a última vez', '“Vingança”: só se apanhou', 'auto', 'Ter recebido dano desde a última vez', (r) => (r.nao ? 'não ter recebido dano desde a última vez' : 'ter recebido dano desde a última vez'), { nao: true });
tipo('B7', 'Ter acertado alguém nesta vez', '“Golpe de continuação”', 'auto', 'Ter acertado alguém nesta vez', () => 'ter acertado alguém nesta vez');
tipo('B8', 'Ter errado o último ataque', '“Fúria de quem errou”', 'auto', 'Ter errado o último ataque', () => 'ter errado o último ataque');
tipo('C1', 'A partir da rodada N (ou até ela)', 'Melodia: no início da 3ª rodada', 'auto', '{lado:sel:Quando:A partir da|Até a} rodada {n:num:Rodada}', (r) => `${r.lado.toLowerCase()} rodada ${r.n}`, { padrao: { lado: 'A partir da', n: 3 } });
tipo('C2', 'Logo depois de usar X (combo)', 'Florescer depois da Orquídea', 'auto', 'Logo depois de usar {tec:sel:Técnica:@TEC}', (r) => `vir logo depois de ${r.tec}`, { padrao: { tec: '@0' } });
tipo('C3', 'X já usada nesta batalha', '“Só depois de abrir com o Grito”', 'auto', '{tec:sel:Técnica:@TEC} já usada nesta batalha', (r) => (r.nao ? `${r.tec} ainda não usada nesta batalha` : `${r.tec} já usada nesta batalha`), { nao: true, padrao: { tec: '@0' } });

function contadoresDaFicha(ficha) {

const clampN = (v, a, b) => Math.max(a, Math.min(b, Number(v) || 0));
function daTexto(a, v) {

  const alvo = a.da.tipo === 'dano' ? 'de dano' : `de ${a.da.atr}`;

function bonus(est, tipo, atr) {
  let total = 0;
  const partes = [];
  for (const a of acumsDa(est.ficha)) {
    if (a.da.tipo !== tipo || (tipo === 'atributo' && a.da.atr !== atr)) continue;

/* aplica um acontecimento da batalha a todos os acumuladores da ficha; devolve o que mudou */
function aplicarEvento(s, ev, extra, soId) {
  const est = s.est;
  s.subiu = s.subiu || {};
  s.spAcum = s.spAcum || {};
  const mudou = [];
  for (const a of acumsDa(est.ficha)) {
    if (soId && a.id !== soId) continue;
    const antes = nivel(est, a);
    let v = antes;
    for (const r of a.sobe) {
      if (r.g !== ev) continue;
      if (ev === 'tec' && r.tec !== (extra && extra.tec)) continue;
      if (ev === 'sp') {
        const passo = Math.max(1, Number(r.sp) || 1);
        s.spAcum[a.id] = (s.spAcum[a.id] || 0) + ((extra && extra.sp) || 0);
        const vezes = Math.floor(s.spAcum[a.id] / passo);
        s.spAcum[a.id] -= vezes * passo;
        v += vezes * Number(r.n);
        continue;
      }
      v += Number(r.n);
    }
    if (ev === 'golpe' && a.desce.golpe.on) v -= Number(a.desce.golpe.n);
    if (ev === 'fim' && a.desce.fim) v = 0;
    if (ev === 'rodada') { if (a.desce.rodada.on && !s.subiu[a.id]) v -= Number(a.desce.rodada.n); s.subiu[a.id] = false; }
    if (ev === 'gastar') v -= Number((extra && extra.n) || 1);
    v = clampN(v, 0, a.max);
    if (v > antes) { s.subiu[a.id] = true; S.entrar.add('acum-' + a.id); }
    if (v !== antes) { est.contadores[a.nome] = v; mudou.push(`${a.nome} ${antes} → ${v}`); }
  }
  return mudou;
}

}
function renomearRefs(ficha, velho, novo) {

    if (c && velho in c) { c[novo] = c[velho]; delete c[velho]; }
  }
}

function sincronizarContadores() {

}

    focarLeitura(tela);
    return;
  }
  concluir(tela, t, null, false);
}
function cancelarRv(tela) {
  const s = S[tela];
  if (!s.rv) return;
  if (s.rv.pedido && s.rv.pedido.status === 'esperando') {
    if (s.aliadoTela) s.aliadoTela.status = 'cancelado';
    s.reg.unshift({ id: uid('l'), texto: `${s.est.nome} cancelou o pedido a ${s.rv.pedido.a}.` });
  }
  s.rv = null;
}
function continuar(tela) {
  const s = S[tela];
  const t = tecPorChave(tela, s.rv.chave);
  if (!passoAtual(s.rv, avDoRv(tela, t))) { concluir(tela, t, s.rv, false); return; }
  render();
}
function gastosTexto(tela, t, rv) {
  const s = S[tela];
  let sp = custoProprio(t);
  const g = [];
  const ef = [];
  const req = reqDe(t);
  if (req) {
    const av = avDoRv(tela, t);
    for (const i of necessarios(rv || novoRv(tela, t), av)) {
      const r = i.r;
      if (r.tipo === 'A1' && r.gasta) sp += Number(r.n);
      if (r.tipo === 'A4' && r.gasta) g.push(`${r.n} de ${r.cont}`);
      if (r.tipo === 'A7' && r.gasta) g.push('a reação');
      if (r.tipo === 'G1') ef.push(`${rv && rv.pedido && rv.pedido.k === i.k && rv.pedido.status === 'aceito' ? rv.pedido.a : 'um aliado'} paga ${r.n} ${r.rec}`);
      if (r.tipo === 'I1') ef.push(`sobe a ${r.forma} para a Parte ${s.est.forma ? s.est.forma.parte + 1 : 1}`);
    }
  }
  if (sp) g.unshift(`${sp} SP`);
  if (t.gasto) g.push(t.gasto);
  /* subir a forma é efeito, não custo: vai numa frase à parte */
  return (g.length ? 'Gasta ' + juntar(g, 'e') + '.' : 'Não gasta nada.') + (ef.length ? ' ' + cap(ef.join('; ')) + '.' : '');
}
function concluir(tela, t, rv, porMestre) {
  const s = S[tela];
  const est = s.est;
  const gastos = [];
  const efeitos = [];
  const inverso = { sp: 0, cont: {} };
  let decl = null;
  let ajuda = null;
  let rol = null;
  let spReq = 0;
  let reacaoGasta = false;
  let pagoAliado = 0;
  const req = reqDe(t);
  if (req && !porMestre) {
    const rvx = rv || novoRv(tela, t);
    for (const i of necessarios(rvx, avDoRv(tela, t))) {
      const r = i.r;
      if (r.tipo === 'A1' && r.gasta) { est.sp -= Number(r.n); inverso.sp += Number(r.n); spReq += Number(r.n); }
      if (r.tipo === 'A4' && r.gasta) {
        const ac = acumPorNome(est.ficha, r.cont);
        est.contadores[r.cont] = Math.max(0, (est.contadores[r.cont] || 0) - Number(r.n));
        inverso.cont[r.cont] = Number(r.n);
        gastos.push(`${r.n} de ${r.cont} (ficou ${est.contadores[r.cont]}${ac ? '/' + ac.max : ''})`);
      }
      if (r.tipo === 'A7' && r.gasta) { est.reacao = false; reacaoGasta = true; gastos.push('a reação'); }
      if (r.tipo === 'I1') { const de = est.forma.parte; est.forma.parte = Math.min(de + 1, Number(r.n)); efeitos.push(`${r.forma} Parte ${de} → Parte ${est.forma.parte}`); S.entrar.add('parte'); }
      if (r.tipo === 'J1') decl = r.texto;
      if ((r.tipo === 'G1' || r.tipo === 'G2') && rvx.pedido && rvx.pedido.k === i.k) {
        if (r.tipo === 'G1') { ajuda = `${rvx.pedido.a} pagou ${oQue(r)}`; if (r.rec === 'SP') pagoAliado += Number(r.n); }
        else ajuda = `com a ajuda de ${rvx.pedido.a}`;
      }
      if (r.tipo === 'H1' && rvx.rol[i.k]) rol = rvx.rol[i.k];
    }
  }
  let sp = spReq;
  const custo = Math.max(0, (t.custo || 0) - pagoAliado);
  if (custo) { const pago = Math.min(custo, est.sp); est.sp -= pago; inverso.sp += pago; sp += pago; }
  if (sp) gastos.unshift(`${sp} SP`);
  const extra = t.aoUsar ? t.aoUsar(s) : '';
  /* os acumuladores ouvem o que aconteceu: reação gasta, técnica usada, SP gasto */
  const mudou = [];
  if (reacaoGasta) mudou.push(...aplicarEvento(s, 'reacao'));
  if (t.modo !== 'evoluir') mudou.push(...aplicarEvento(s, 'tec', { tec: t.nome }));
  if (sp) mudou.push(...aplicarEvento(s, 'sp', { sp }));
  let txt = t.modo === 'evoluir' ? `${est.nome} evoluiu ${t.base} para ${t.nome}` : `${est.nome} usou ${t.nome}`;
  const det = [];
  if (rol) det.push(`passou em ${rol.atr} (${rol.total} contra CD ${rol.cd})`);
  if (ajuda) det.push(ajuda);
  if (gastos.length) det.push('gastou ' + juntar(gastos, 'e'));
  if (efeitos.length) det.push(efeitos.join(', '));
  /* nome que já termina em "!" (CAÇA AS BRUXAS!) não leva dois-pontos: vira frase nova */
  if (det.length) txt += /[!?]$/.test(txt) ? ' ' + cap(det.join('; ')) : ': ' + det.join('; ');
  txt = fim(txt);
  if (extra) txt += ' ' + extra;
  if (mudou.length) txt += ' ' + mudou.join(', ') + '.';
  if (porMestre) txt += ' O mestre liberou sem os requisitos.';
  s.reg.unshift({ id: uid('l'), texto: txt, quem: porMestre ? 'liberado pelo mestre' : '', decl, inverso, desfeita: false });
  s.rv = null;
  s.ultimo = { chave: s.sel, texto: txt, rol };
  render();
}

/* ---------------------------------------------------------------- os passos da hora */
function pedir(tela) {
  const s = S[tela];
  const t = tecPorChave(tela, s.rv.chave);
  const p = passoAtual(s.rv, avDoRv(tela, t));
  if (!p) return;
  const cands = candidatos(p.r, s.est);
  const nome = s.rv.aliado[p.k] || (cands.find((a) => !s.rv.recusou[a.nome]) || cands[0]).nome;
  const a = s.est.aliados.find((x) => x.nome === nome);
  s.rv.pedido = { k: p.k, a: nome, status: 'esperando' };
  s.rv.msg = null;
  s.aliadoTela = { quem: nome, papel: a.papel, status: 'esperando', o: oQue(p.r), para: t.nome, tipo: p.r.tipo, n: Number(p.r.n), rec: p.r.rec };
  s.reg.unshift({ id: uid('l'), texto: (p.r.tipo === 'G1' ? `${s.est.nome} pediu a ${nome} que pague ${oQue(p.r)} da ${t.nome}` : `${s.est.nome} pediu ${oQue(p.r)} a ${nome}`) + `${a.papel === 'NPC' ? ' (NPC: o mestre responde)' : ''}.` });
  S.entrar.add('pedido');
  render();
}
function responder(tela, sim) {
  const s = S[tela];
  const rv = s.rv;
  if (!rv || !rv.pedido || rv.pedido.status !== 'esperando') return;
  const t = tecPorChave(tela, rv.chave);
  const it = avDoRv(tela, t).gs.flatMap((x) => x.its).find((i) => i.k === rv.pedido.k);
  const a = s.est.aliados.find((x) => x.nome === rv.pedido.a);
  const quemResponde = a.papel === 'NPC' ? `O mestre, pelo ${a.nome},` : a.nome;
  if (sim) {
    if (it.r.tipo === 'G1') {
      /* o aliado só paga: o SP sai dele e cobre a técnica, nada entra na conta de quem pediu */
      const chave = String(it.r.rec).toLowerCase();
      a[chave] -= Number(it.r.n);
      s.reg.unshift({ id: uid('l'), texto: `${quemResponde} aceitou: pagou ${oQue(it.r)} da ${t.nome} do ${s.est.nome}.` });
    } else {
      s.reg.unshift({ id: uid('l'), texto: `${quemResponde} aceitou ajudar ${s.est.nome} (${it.r.poder}).` });
    }
    rv.pedido.status = 'aceito';
    rv.feito[rv.pedido.k] = true;
    if (s.aliadoTela) s.aliadoTela.status = 'aceito';
    continuar(tela);
    return;
  }
  rv.pedido.status = 'recusado';
  rv.recusou[a.nome] = true;
  const outros = candidatos(it.r, s.est).some((x) => !rv.recusou[x.nome]);
  const grupo = avDoRv(tela, t).gs[it.gi];
  const outroCaminho = grupo.g.modo === 'um' && grupo.its.some((i) => i.k !== it.k && i.a.ok !== 'nao');
  rv.msg = `${a.nome} recusou.` + (outros ? ' Peça a outro aliado.' : '') + (outroCaminho ? ' Ou escolha o outro caminho.' : '') + (!outros && !outroCaminho ? ' Ninguém mais pode: volte e escolha outra técnica.' : '');
  if (s.aliadoTela) s.aliadoTela.status = 'recusado';
  s.reg.unshift({ id: uid('l'), texto: `${quemResponde} recusou o pedido de ${s.est.nome}.` });
  render();
}
function rolar(tela) {
  const s = S[tela];
  const rv = s.rv;
  const t = tecPorChave(tela, rv.chave);
  const av = avDoRv(tela, t);
  const p = passoAtual(rv, av);
  if (!p || p.r.tipo !== 'H1') return;
  const d = s.d20 ? s.d20[s.d20i++ % s.d20.length] : 1 + Math.floor(Math.random() * 20);
  const m = (s.est.mods && s.est.mods[p.r.atr]) || 0;
  const total = d + m;
  const ok = total >= Number(p.r.n);
  rv.rol[p.k] = { d, m, total, cd: Number(p.r.n), atr: p.r.atr, ok };
  S.entrar.add('dado');
  if (ok) { rv.feito[p.k] = true; continuar(tela); return; }
  if (p.r.falha === 'perde a ação') {
    s.reg.unshift({ id: uid('l'), texto: `${s.est.nome} falhou em ${p.r.atr} (${total} contra CD ${p.r.n}) e perdeu a ação.` });
    s.rv = null;
    s.ultimo = { chave: t.chave, texto: 'Falhou: perdeu a ação.', rol: rv.rol[p.k], falhou: true };
    render();
    return;
  }
  if (s.falhouNestaVez) s.falhouNestaVez[p.k] = true;
  s.reg.unshift({ id: uid('l'), texto: `${s.est.nome} falhou em ${p.r.atr} (${total} contra CD ${p.r.n}); não perdeu a ação.` });
  const grupo = av.gs[p.gi];
  const outro = grupo.g.modo === 'um' ? grupo.its.find((i) => i.k !== p.k && i.a.ok !== 'nao') : null;
  if (outro) { rv.esc[p.gi] = outro.k; rv.msg = `Falhou (${total} contra ${p.r.n}). Não perde a ação: pode ${TIPOS[outro.r.tipo].texto(outro.r)} no lugar.`; }
  else rv.msg = `Falhou (${total} contra ${p.r.n}). Não perde a ação, mas não dá para usar agora.`;
  render();
}

/* ==========================================================================

const chip = ([k, txt]) => `<span class="bt-etq${k ? ' bt-etq--' + k : ''}">${esc(txt)}</span>`;
const pip = (txt, gasto, extra) => `<span class="bt-pip${extra ? ' ' + extra : ''}"${gasto ? ' data-gasto="sim"' : ''}>${esc(txt)}</span>`;

function cabecaHTML(tela) {
  const s = S[tela];
  const est = s.est;
  const pips = [pip('Completa'), pip('Simples'), pip('Movimento'), pip('Reação', !est.reacao), pip(`SP ${est.sp}`)];
  if (tela === 'sieg') {
    if (s.melodia) pips.push(pip(s.caminho ? 'Melodia: Caminho do Dano' : 'Melodia ligada', false, 'bt-pip--carga'));

function segsHTML(v, max, novo, cor) {

  const cls = ['bt-tira', t.evo ? 'bt-tira--evo bt-tira--pequena' : '', t.super ? 'bt-tira--super' : '', t.forma ? 'bt-tira--forma' : ''].filter(Boolean).join(' ');

function dadoHTML(rol) {

function contadorHTML(est, a, escuro) {

/* os acumuladores que a técnica toca: os que ela pede (A4), os que ela carrega e os que ela soma */
function acumsDaTec(est, t) {
  const nomes = new Set(t.acums || []);

  if (req) for (const g of req.grupos) for (const r of g.itens) if (r.tipo === 'A4') nomes.add(r.cont);
  for (const a of acumsDa(est.ficha)) if (a.sobe.some((r) => r.g === 'tec' && r.tec === t.nome)) nomes.add(a.nome);
  return [...nomes].map((n) => acumPorNome(est.ficha, n)).filter(Boolean);
}
function leituraHTML(tela) {

  h += `<dl><div><dt>Ação</dt><dd>${esc(t.acao)}</dd></div><div><dt>${t.modo === 'evoluir' ? 'O que faz' : 'Dano e efeito'}</dt><dd>${esc(t.dano)}</dd></div>${t.efeito ? `<div><dt>Efeito</dt><dd>${esc(t.efeito)}</dd></div>` : ''}</dl>`;
  for (const a of acumsDaTec(s.est, t)) h += '<div class="bt-detalhe__sep"></div>' + contadorHTML(s.est, a);
  if (e.req && e.av) h += '<div class="bt-detalhe__sep"></div>' + checklistHTML(e, t);
  h += '<div class="acoes">';
  const rot = t.modo === 'evoluir' ? 'Evoluir' : t.chave === 'campo' && s.est.contadores['Campo de Contenção'] ? 'Desligar' : 'Usar';
  if (e.pode) {
    h += `<button type="button" class="bt-carimbo" data-acao="usar" data-tela="${tela}" data-chave="${t.chave}" data-k="usar-${tela}">${rot}</button><span class="mestre-nota" style="flex-basis:auto">${esc(gastosTexto(tela, t))}</span>`;
  } else {

/* ==========================================================================

const MOLDE_RE = /\{(\w+):(\w+):([^:}]+)(?::([^}]+))?\}/g;
function moldeDe(r) { const T = TIPOS[r.tipo]; return typeof T.molde === 'function' ? T.molde(r) : T.molde; }

function novoReq(ex, cod) {
  const T = TIPOS[cod];
  const r = Object.assign({ id: uid('r'), tipo: cod }, clone(T.padrao));
  const molde = moldeDe(r);
  for (const m of molde.matchAll(MOLDE_RE)) {
    const [, k, tipoC, , ops] = m;
    if (tipoC === 'sel') { const o = opcoesDe(ex, ops); if (r[k] === undefined || r[k] === '@0' || !o.includes(r[k])) r[k] = o[0]; }
    else if (r[k] === undefined) r[k] = tipoC === 'num' ? 1 : '';
  }
  return r;
}
function campoHTML(ex, r, k, tipoC, rot, ops) {
  const base = `data-campo="${k}" data-lin="${r.id}" data-k="${r.id}-${k}" aria-label="${esc(rot)}"`;
  if (tipoC === 'num') return `<input type="number" class="f-num" inputmode="numeric" min="0" max="999" value="${esc(r[k])}" ${base}>`;
  if (tipoC === 'txt') return `<input type="text" class="f-txt" value="${esc(r[k])}" placeholder="${esc(rot)}" ${base}>`;
  const o = opcoesDe(ex, ops);
  if (!o.includes(r[k])) o.unshift(r[k]);
  return `<select class="f-sel" ${base}>${o.map((x) => `<option${x === r[k] ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
}
const toggle = (r, k, txt) => `<label class="tg"><input type="checkbox" data-campo="${k}" data-lin="${r.id}" data-k="${r.id}-${k}"${r[k] ? ' checked' : ''}><span>${esc(txt)}</span></label>`;
function linhaReqHTML(ex, r) {
  const T = TIPOS[r.tipo];

  /* split com 4 grupos: [texto, k, tipo, rot, ops, texto, ...] */
  let h = '';
  for (let i = 0; i < frase.length; i += 5) {
    h += esc(frase[i]);
    if (i + 1 < frase.length) h += campoHTML(ex, r, frase[i + 1], frase[i + 2], frase[i + 3], frase[i + 4] || '');

function gravarAc(el, final) {
  const a = acAtual();
  if (!a) return false;
  const k = el.dataset.acc;
  const num = (min, max) => {
    if (el.value === '') return final ? null : undefined;
    return clampN(Math.round(Number(el.value)), min, max);
  };
  if (k === 'nome') {
    const novo = el.value.trim();
    a.rascunho = el.value;
    const outros = contadoresDaFicha(a.ficha).filter((n) => n !== a.nome);
    if (!novo) { S.ac.erro = 'Dê um nome ao acumulador.'; return true; }
    if (outros.some((n) => semAcento(n) === semAcento(novo))) { S.ac.erro = `Já existe “${novo}” na ficha de ${a.quem}.`; return true; }
    renomearRefs(a.ficha, a.nome, novo);
    a.nome = novo;
    S.ac.erro = null;
    if (final) delete a.rascunho;
    return true;
  }
  if (k.startsWith('sobe:')) {
    const r = a.sobe.find((x) => x.id === el.dataset.sid);
    if (!r) return false;
    const c = k.slice(5);
    if (c === 'g') { r.g = el.value; if (r.g === 'tec' && !r.tec) r.tec = lista(a.ficha, 'TEC')[0]; if (r.g === 'sp' && !r.sp) r.sp = 20; return true; }
    if (c === 'tec') { r.tec = el.value; return true; }
    const v = num(1, c === 'sp' ? 400 : MAX_NIVEL);
    if (v === undefined) return false;
    if (v !== null) r[c] = v;
    return true;
  }
  if (k === 'desce:fim') { a.desce.fim = el.checked; return true; }
  if (k === 'desce:rodada' || k === 'desce:golpe') { a.desce[k.slice(6)].on = el.checked; return true; }
  if (k === 'da:tipo') { a.da.tipo = el.value; return true; }
  if (k === 'da:atr') { a.da.atr = el.value; return true; }
  const lim = { max: [1, MAX_NIVEL], comeca: [0, a.max], 'desce:rodada:n': [1, MAX_NIVEL], 'desce:golpe:n': [1, MAX_NIVEL], 'da:n': [1, 999] }[k];
  if (!lim) return false;
  const v = num(lim[0], lim[1]);
  if (v === undefined) return false;
  if (v === null) return true;
  if (k === 'max') { a.max = v; a.comeca = Math.min(a.comeca, v); }
  else if (k === 'comeca') a.comeca = v;
  else if (k === 'da:n') a.da.n = v;
  else a.desce[k.split(':')[1]].n = v;
  return true;
}

/* trocar o innerHTML tira o campo em foco; o navegador dispara "change" nele no meio da troca.
   Esse change não pode renderizar por dentro: marca e renderiza uma vez quando a troca acabar. */
let renderizando = false;
let renderPendente = false;
function render() {
  if (renderizando) { renderPendente = true; return; }
  renderizando = true;
  try { renderAgora(); } finally { renderizando = false; }
  if (renderPendente) { renderPendente = false; render(); }
}
function renderAgora() {
  const ativo = document.activeElement;
  const k = ativo && ativo.dataset ? ativo.dataset.k : null;
  const sel = ativo && ativo.tagName === 'INPUT' && ativo.type === 'text' ? [ativo.selectionStart, ativo.selectionEnd] : null;
  sincronizarContadores();
  $('#tela').innerHTML = TELAS[S.tela]();
  S.entrar.clear();
  $$('.proto__tela').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tela === S.tela)));
  if (k) {
    const el = $$('[data-k]').find((x) => x.dataset.k === k);
    if (el && !el.disabled) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) el.setSelectionRange(sel[0], sel[1]); }
  }
}
function focarLeitura(tela) {
  const raiz = $(`#leitura-${tela}`) || document;
  const el = raiz.querySelector('[data-foco]:not(:disabled)') || raiz.querySelector('button:not(:disabled), input:not(:disabled)');
  if (el) el.focus({ preventScroll: true });
}
function selecionar(tela, chave) {
  const s = S[tela];
  if (s.sel === chave) return;
  s.sel = chave;

  const l = $(`#leitura-${tela}`);

}
function avisar(texto, desfazer) {
  const box = $('#avisos');
  const el = document.createElement('div');
  el.className = 'aviso';
  el.innerHTML = `<span>${esc(texto)}</span>` + (desfazer ? '<button type="button" class="bt bt--p">Desfazer</button>' : '');
  const sair = () => { if (!el.isConnected) return; el.setAttribute('data-saindo', ''); setTimeout(() => el.remove(), 160); };
  if (desfazer) el.querySelector('button').addEventListener('click', () => { desfazer(); sair(); });
  box.appendChild(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(sair, desfazer ? 6000 : 3600);
}

  'ed-tirar': (el) => {
    const ex = exAtual();
    const achado = reqPorId(ex, el.dataset.lin);
    if (!achado) return;
    achado.g.itens.splice(achado.i, 1);
    render();
    avisar(`Tirado: ${cap(TIPOS[achado.r.tipo].texto(achado.r))}.`, () => { achado.g.itens.splice(achado.i, 0, achado.r); render(); });
  },
};
const MUDA = {
  ver: (el) => { S.ver = el.value; render(); },
  'ed-para': (el) => { const ex = exAtual(); ex.req.para = el.value; if (el.value === 'evoluir' && !ex.req.evoluiPara) ex.req.evoluiPara = opcoesEvo(ex)[0]; render(); },
  'ed-evo': (el) => { exAtual().req.evoluiPara = el.value; atualizarResumo(); },
  'ed-modo': (el) => { grupoPorId(exAtual(), el.dataset.g).modo = el.value; render(); },
  'sieg-melodia': (el) => { const s = S.sieg; s.melodia = el.checked; if (!s.melodia) s.caminho = false; sincronizarSieg(s); cancelarRv('sieg'); render(); },
  'sieg-caminho': (el) => { const s = S.sieg; s.caminho = el.checked; sincronizarSieg(s); cancelarRv('sieg'); render(); },
  'sieg-vagn': (el) => { const s = S.sieg; s.vagnPerto = el.checked; sincronizarSieg(s); cancelarRv('sieg'); render(); },
  'rv-esc': (el) => { const s = S[el.dataset.tela]; s.rv.esc[el.dataset.g] = el.value; s.rv.msg = null; render(); },
  'rv-aliado': (el) => { const s = S[el.dataset.tela]; s.rv.aliado[el.dataset.kitem] = el.value; render(); },
  'rv-caixa': (el) => { const s = S[el.dataset.tela]; s.rv.caixa[el.dataset.kitem] = el.checked; render(); },
  'ac-nova-ficha': (el) => { S.ac.novaFicha = el.value; },
  'ac-add-sobe': (el) => {
    const a = acAtual();
    const g = el.value;
    if (!a || !g) return;
    const r = { id: uid('s'), g, n: 1 };
    if (g === 'tec') r.tec = lista(a.ficha, 'TEC')[0];
    if (g === 'sp') r.sp = 20;
    a.sobe.push(r);
    S.entrar.add('acl-' + r.id);
    render();
    const f = $(`[data-k="ac-sobe:n-${r.id}"]`);
    if (f) f.focus();
  },
};
function gravarCampo(el) {
  const achado = reqPorId(exAtual(), el.dataset.lin);
  if (!achado) return;
  const k = el.dataset.campo;
  if (el.type === 'checkbox') achado.r[k] = el.checked;
  else if (el.type === 'number') achado.r[k] = el.value === '' ? 0 : clamp(Math.round(Number(el.value)) || 0, 0, 999);
  else achado.r[k] = el.value;
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-acao]');
  if (S.tela === 'editor' && S.ed.pk && !ev.target.closest('.pk') && !(el && el.dataset.acao === 'ed-abrir')) {
    S.ed.pk = null;
    if (!el) { render(); return; }
  }
  if (!el || el.disabled) return;
  if (el.getAttribute('aria-disabled') === 'true' && el.dataset.acao !== 'tira') return;
  const f = ACOES[el.dataset.acao];
  if (f) f(el, ev);
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.matches('[data-acc]')) { if (gravarAc(el, true)) render(); return; }
  if (el.matches('[data-muda]')) { MUDA[el.dataset.muda](el, ev); return; }
  if (el.matches('select[data-campo], input[type="checkbox"][data-campo]')) { gravarCampo(el); render(); }
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.matches('input[data-acc][type="text"], input[data-acc][type="number"]')) { if (gravarAc(el, false)) render(); return; }
  if (el.matches('input[data-campo][type="number"], input[data-campo][type="text"]')) { gravarCampo(el); atualizarResumo(); return; }
  if (el.matches('[data-pk-busca]')) { S.ed.pk.busca = el.value; $('#pk-lista').innerHTML = pkListaHTML(exAtual(), el.value); $('#pk-lista').scrollTop = 0; }
});
document.addEventListener('pointerover', (ev) => {
  if (ev.pointerType !== 'mouse') return;
  const b = ev.target.closest('.bt-tira[data-sel]');
  if (!b || S[b.dataset.tela].rv) return;
  selecionar(b.dataset.tela, b.dataset.sel);
});
document.addEventListener('focusin', (ev) => {
  const b = ev.target.closest && ev.target.closest('.bt-tira[data-sel]');
  if (b && !S[b.dataset.tela].rv) selecionar(b.dataset.tela, b.dataset.sel);
});
const digitando = (el) => el && (el.tagName === 'INPUT' && !['checkbox', 'radio'].includes(el.type) || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA');
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') {
    if (S.tela === 'editor' && S.ed.pk) { const g = S.ed.pk.g; S.ed.pk = null; render(); const b = $$('[data-k]').find((x) => x.dataset.k === 'ab-' + g); if (b) b.focus(); ev.preventDefault(); return; }
    const s = S[S.tela];
    if (s && s.rv) { const ch = s.rv.chave; cancelarRv(S.tela); render(); const b = $$('.bt-tira').find((x) => x.dataset.sel === ch); if (b) b.focus(); ev.preventDefault(); }
    return;
  }
  const pk = ev.target.closest && ev.target.closest('.pk');
  if (pk && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) {
    const lst = [$('[data-pk-busca]')].concat($$('.pk__op:not(:disabled), .pk__nada button'));
    const i = lst.indexOf(document.activeElement);
    const j = clamp(i + (ev.key === 'ArrowDown' ? 1 : -1), 0, lst.length - 1);
    lst[j].focus();
    ev.preventDefault();
    return;
  }
  const tira = ev.target.closest && ev.target.closest('.bt-tira[data-sel]');
  if (tira && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) {
    const todas = $$(`.bt-tira[data-tela="${tira.dataset.tela}"]`);
    const j = (todas.indexOf(tira) + (ev.key === 'ArrowDown' ? 1 : -1) + todas.length) % todas.length;
    todas[j].focus();
    ev.preventDefault();
    return;
  }
  if (/^[1-9]$/.test(ev.key) && !digitando(ev.target) && !ev.ctrlKey && !ev.metaKey && !ev.altKey && S.tela !== 'editor') {
    const b = $$(`.bt-tira[data-tela="${S.tela}"]`)[Number(ev.key) - 1];
    if (b) { b.focus(); b.click(); ev.preventDefault(); }
  }
});

/* ---------------------------------------------------------------- começo */
S.acums = clone(ACUM_DE_FABRICA);
S.ac = INICIAL.acum();
S.ed = INICIAL.editor();
for (const t of TELAS_DE_BATALHA) S[t] = INICIAL[t]();
sincronizarSieg(S.sieg);
render();
window.__proto = { S, render, avisar };
</script>
</body>
