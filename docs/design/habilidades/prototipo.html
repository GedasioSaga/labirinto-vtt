<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itens e Habilidades: protótipo para aprovar</title>
<style>
/*
 * HABILIDADES E ITENS COM EFEITO, protótipo de 21/11/2026 (pedidos 8, 9 e 10).
 * Arquivo único, sem nada de fora. Os tokens são cópia dos `--lb-*` que o app
 * injeta pelo `themeCss()` (client/src/theme.ts) e dos `--bt-*` da batalha
 * (components/batalha/combate.css e batalha.css): mesmo nome, mesmo valor.
 * Larguras reais: lombada do mundo 236 px (mundo.css), janela da ficha
 * min(1120px, 100%) com a coluna do personagem de 260 a 320 px
 * (FichaDePersonagem.css), página do livro do mestre 262 px + lombada 52 px.
 * O app só tem tema escuro.
 */
:root {
  --lb-color-ink: #121214;
  --lb-color-stone: rgba(19, 19, 23, 0.94);
  --lb-color-stone-solid: #1a1a1e;
  --lb-color-stone-raised: #232328;
  --lb-color-stone-hover: #2c2c33;
  --lb-color-stone-sunken: #141417;
  --lb-color-line: rgba(255, 255, 255, 0.08);
  --lb-color-line-strong: rgba(255, 255, 255, 0.16);
  --lb-color-line-panel: rgba(255, 255, 255, 0.13);
  --lb-color-parchment: #eceae4;
  --lb-color-parchment-dim: #a2a09a;
  --lb-color-parchment-faint: #858480;
  --lb-color-brass: #e0a44a;
  --lb-color-brass-bright: #f3ba66;
  --lb-color-brass-soft: rgba(224, 164, 74, 0.14);
  --lb-color-brass-contrast: #1c1608;
  --lb-color-ember: #e2645a;
  --lb-color-ember-soft: rgba(226, 100, 90, 0.14);
  --lb-color-online: #7fb48a;
  --lb-color-online-soft: rgba(127, 180, 138, 0.14);
  --lb-color-tide: #79a9cc;
  --lb-color-tide-soft: rgba(121, 169, 204, 0.14);
  --lb-color-arcane: #ab93d6;
  --lb-color-arcane-soft: rgba(171, 147, 214, 0.15);
  --lb-font-display: 'Sitka Banner', 'Sitka Display', Sitka, Constantia, Georgia, 'Times New Roman', serif;
  --lb-font-sans: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
  --lb-font-utility: 'Bahnschrift', 'DIN Alternate', 'Segoe UI Variable Small', 'Segoe UI', system-ui, sans-serif;
  --lb-font-size-xs: 10.5px;
  --lb-font-size-sm: 11.5px;
  --lb-font-size-md: 13px;
  --lb-font-size-lg: 15px;
  --lb-font-size-xl: 20px;
  --lb-font-tracking-wide: 0.06em;
  --lb-font-tracking-wider: 0.14em;
  --lb-space-1: 4px;
  --lb-space-2: 8px;
  --lb-space-3: 12px;
  --lb-space-4: 16px;
  --lb-space-5: 20px;
  --lb-space-6: 24px;
  --lb-control-gap: 8px;
  --lb-radius-sm: 6px;
  --lb-radius-md: 9px;
  --lb-radius-lg: 14px;
  --lb-radius-full: 999px;
  --lb-shadow-lg: 0 18px 44px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.34);
  --lb-shadow-float: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 14px rgba(0, 0, 0, 0.44), 0 20px 46px rgba(0, 0, 0, 0.55);
  --lb-shadow-focus: 0 0 0 2px var(--lb-color-stone-solid), 0 0 0 4px var(--lb-color-brass);
  --lb-shadow-bevel: inset 0 1px 0 rgba(255, 255, 255, 0.07);
  --lb-motion-fast: 110ms;
  --lb-motion-base: 170ms;
  --lb-motion-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --lb-gr-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --lb-gr-ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --lb-gr-dur-move: 150ms;
  --lb-gr-dur-panel: 260ms;
  --lb-gr-papel-alto: #1b1711;
  --lb-gr-papel-baixo: #13100c;
  --lb-gr-cartao: #211c15;
  --lb-gr-cartao-alto: #29231a;
  --lb-gr-campo: #15120e;
  --lb-gr-filete: rgba(236, 234, 228, 0.09);
  --lb-gr-filete-forte: rgba(236, 234, 228, 0.16);
  --lb-gr-filete-latao: rgba(224, 164, 74, 0.26);
  --lb-gr-couro-1: #17100a;
  --lb-gr-couro-2: #251a11;
  --lb-gr-couro-3: #2f2216;
  --lb-gr-gravado: #c8b089;
  --lb-gr-gravado-forte: #ead6ae;
  --lb-gr-metal-claro: #c7d1d9;
  --lb-gr-latao-1: #f6cb84;
  --lb-gr-latao-2: #e0a44a;
  --lb-gr-latao-3: #b87d2e;
  --lb-gr-hover: rgba(255, 236, 200, 0.06);
  --lb-gr-hover-forte: rgba(255, 236, 200, 0.1);
  /* batalha */
  --bt-tinta: #0c0c0e;
  --bt-papel: var(--lb-color-parchment);
  --bt-sangue: #b4493c;
  --bt-titulo: 'Bahnschrift Condensed', 'Bahnschrift', var(--lb-font-utility);
  --bt-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --bt-rasgo-caixa: polygon(0 3px, 6% 0, 13% 4px, 21% 1px, 28% 3px, 37% 0, 45% 4px, 52% 1px, 60% 3px, 68% 0, 76% 4px, 84% 1px, 92% 3px, 100% 0, calc(100% - 3px) 30%, 100% 60%, calc(100% - 2px) 100%, 92% calc(100% - 3px), 84% 100%, 76% calc(100% - 4px), 68% calc(100% - 1px), 60% calc(100% - 3px), 52% 100%, 45% calc(100% - 4px), 37% calc(100% - 1px), 28% calc(100% - 3px), 21% 100%, 13% calc(100% - 4px), 6% calc(100% - 1px), 0 calc(100% - 3px), 2px 60%, 0 30%);
  --bt-rasgo-caixa2: polygon(0 1px, 8% 4px, 16% 0, 24% 3px, 33% 1px, 41% 4px, 49% 0, 57% 3px, 65% 1px, 73% 4px, 81% 0, 89% 3px, 100% 1px, 100% 40%, calc(100% - 3px) 75%, 100% calc(100% - 1px), 89% 100%, 81% calc(100% - 4px), 73% calc(100% - 1px), 65% 100%, 57% calc(100% - 3px), 49% calc(100% - 1px), 41% 100%, 33% calc(100% - 4px), 24% calc(100% - 1px), 16% 100%, 8% calc(100% - 3px), 0 100%, 3px 70%, 0 35%);
  /* As cores de cada tipo de efeito (as do tema; nenhuma nova). */
  --ef-dano: var(--lb-color-ember);
  --ef-cura: var(--lb-color-online);
  --ef-sp: var(--lb-color-tide);
  --ef-escudo: var(--lb-gr-metal-claro);
  --ef-debuff: var(--lb-color-arcane);
  --ef-buff: var(--lb-color-online);
  --ef-reacao: var(--lb-color-brass-bright);
  --ef-mao: var(--lb-gr-gravado);
  --mu-erro-texto: #f0897f;
  --barra: 46px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--lb-font-sans); font-size: var(--lb-font-size-md); line-height: 1.45;
  color: var(--lb-color-parchment); background: var(--lb-color-ink); overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled, [aria-disabled='true'] { cursor: not-allowed; }
h1, h2, h3, h4, h5, p, ul, ol, dl, dd, figure, fieldset { margin: 0; padding: 0; border: 0; }
ul, ol { list-style: none; }
:focus-visible { outline: none; box-shadow: var(--lb-shadow-focus); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-family: var(--lb-font-utility); font-variant-numeric: tabular-nums; }

.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ic--g { width: 18px; height: 18px; }

/* ------------------------------------------------------------ barra do protótipo (não é do app) */
.proto {
  height: var(--barra); display: flex; align-items: center; gap: 10px; padding: 0 14px;
  background: #0c0c0e; border-bottom: 1px dashed var(--lb-gr-filete-forte);
  font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); white-space: nowrap; overflow-x: auto;
}
.proto strong { color: var(--lb-color-parchment); font-weight: 600; }
.proto__telas { display: flex; gap: 4px; }
.proto__tela {
  min-height: 28px; padding: 0 10px; border-radius: var(--lb-radius-full); border: 1px solid var(--lb-gr-filete-forte);
  color: var(--lb-color-parchment-dim); font-size: var(--lb-font-size-sm);
  transition: background-color var(--lb-motion-fast) ease, border-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease;
}
.proto__tela[aria-pressed='true'] { background: var(--lb-color-brass-soft); border-color: var(--lb-gr-filete-latao); color: var(--lb-color-parchment); }
.proto__sobra { margin-left: auto; }
.telas { position: relative; height: calc(100% - var(--barra)); min-height: 560px; }
.tela { position: absolute; inset: 0; overflow: hidden; }

/* ------------------------------------------------------------ primitivos (os .mu-* do mundo, com nome curto) */
.bt {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 0 12px;
  border-radius: var(--lb-radius-sm); background: var(--lb-gr-cartao-alto); color: var(--lb-color-parchment);
  border: 1px solid var(--lb-gr-filete-forte); font-weight: 500; white-space: nowrap;
  transition: background-color var(--lb-motion-fast) ease, border-color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-gr-ease-out), opacity var(--lb-motion-fast) ease;
}
.bt:active:not(:disabled):not([aria-disabled='true']) { transform: scale(0.97); }
.bt:disabled, .bt[aria-disabled='true'] { opacity: 0.45; }
@media (hover: hover) and (pointer: fine) {
  .bt:hover:not(:disabled) { border-color: var(--lb-gr-filete-latao); }
  .bt--fantasma:hover:not(:disabled) { background: var(--lb-gr-hover); border-color: transparent; color: var(--lb-color-parchment); }
}
.bt--primario {
  background: linear-gradient(180deg, var(--lb-gr-latao-1), var(--lb-gr-latao-2) 60%, #cf9440);
  color: var(--lb-color-brass-contrast); border-color: rgba(0, 0, 0, 0.35); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35); font-weight: 600;
}
.bt--latao { background: transparent; border-color: var(--lb-gr-filete-latao); color: var(--lb-color-brass-bright); }
.bt--fantasma { background: transparent; border-color: transparent; color: var(--lb-color-parchment-dim); }
.bt--perigo { background: transparent; border-color: rgba(226, 100, 90, 0.4); color: var(--mu-erro-texto); }
.bt--p { min-height: 28px; padding: 0 9px; font-size: var(--lb-font-size-sm); }
.bt--ic { width: 32px; padding: 0; background: transparent; border-color: transparent; color: var(--lb-color-parchment-dim); }
.bt--ic.bt--p { width: 28px; }
.bt .ic { width: 15px; height: 15px; }

.cartao { background: var(--lb-gr-cartao); border: 1px solid var(--lb-gr-filete); border-radius: var(--lb-radius-md); box-shadow: inset 0 1px 0 rgba(255, 236, 200, 0.04); }
.etq {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: var(--lb-radius-full);
  font: 500 var(--lb-font-size-xs) / 1.6 var(--lb-font-utility); letter-spacing: var(--lb-font-tracking-wide); white-space: nowrap;
  background: var(--lb-gr-hover-forte); color: var(--lb-gr-gravado);
}
.etq--efeito { background: var(--lb-color-online-soft); color: var(--lb-color-online); }
.etq--mao { background: var(--lb-color-brass-soft); color: var(--lb-color-brass-bright); }
.etq--reacao { background: var(--lb-color-brass-soft); color: var(--lb-color-brass-bright); }
.etq--dupla { background: var(--lb-color-tide-soft); color: var(--lb-color-tide); }
.etq--sem { background: transparent; color: var(--lb-color-parchment-faint); box-shadow: inset 0 0 0 1px var(--lb-gr-filete-forte); }

.entrada {
  width: 100%; min-height: 32px; padding: 0 10px; border-radius: var(--lb-radius-sm);
  border: 1px solid var(--lb-gr-filete-forte); background: var(--lb-gr-campo); color: var(--lb-color-parchment);
}
.entrada::placeholder { color: var(--lb-color-parchment-faint); }
.entrada[aria-invalid='true'] { border-color: rgba(226, 100, 90, 0.6); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 10px; border: 1px solid var(--lb-gr-filete-forte);
  border-radius: var(--lb-radius-full); color: var(--lb-color-parchment-dim); font-family: var(--lb-font-utility); font-size: var(--lb-font-size-md);
  transition: background-color var(--lb-motion-fast) ease, border-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-gr-ease-out);
}
.chip:active:not(:disabled) { transform: scale(0.97); }
.chip[aria-pressed='true'] { background: var(--lb-color-brass-soft); border-color: var(--lb-gr-filete-latao); color: var(--lb-color-parchment); }
.chip small { font-size: var(--lb-font-size-xs); color: var(--lb-color-parchment-faint); }
.chip:disabled { opacity: 0.45; }
.dica { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.erro-txt { font-size: var(--lb-font-size-sm); color: var(--mu-erro-texto); }

/* segmentado: grupo de rádios que vira uma régua */
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--lb-radius-sm); background: var(--lb-gr-campo); border: 1px solid var(--lb-gr-filete); flex-wrap: wrap; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span {
  display: inline-flex; align-items: center; min-height: 26px; padding: 0 9px; border-radius: 4px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim);
  transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease;
}
.seg input:checked + span { background: var(--lb-gr-cartao-alto); color: var(--lb-color-parchment); box-shadow: inset 0 0 0 1px var(--lb-gr-filete-latao); }
.seg input:focus-visible + span { box-shadow: var(--lb-shadow-focus); }
.seg input:disabled + span { opacity: 0.45; }

/* ============================================================ 1. O MUNDO DO LIVRO: lombada | página */
.mundo { position: absolute; inset: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr); background: var(--lb-color-ink); }
.mu-lombada {
  position: relative; display: flex; flex-direction: column; min-height: 0;
  background: linear-gradient(90deg, var(--lb-gr-couro-1), var(--lb-gr-couro-2) 70%, var(--lb-gr-couro-3));
  border-right: 1px solid rgba(0, 0, 0, 0.6); box-shadow: inset -1px 0 0 rgba(255, 236, 200, 0.05);
}
.mu-selo { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; padding: 20px 16px 18px 18px; border-bottom: 1px solid rgba(0, 0, 0, 0.45); box-shadow: 0 1px 0 rgba(255, 236, 200, 0.04); }
.mu-selo__med {
  width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--lb-color-brass-contrast);
  background: linear-gradient(180deg, var(--lb-gr-latao-1), var(--lb-gr-latao-2) 55%, var(--lb-gr-latao-3));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 1px 3px rgba(0, 0, 0, 0.6);
}
.mu-selo__med .ic { width: 22px; height: 22px; stroke-width: 1.7; }
.mu-selo__nome { font-family: var(--lb-font-display); font-size: 21px; font-weight: 400; line-height: 1.1; color: var(--lb-gr-gravado-forte); }
.mu-selo__tipo { margin-top: 2px; font-size: var(--lb-font-size-sm); color: var(--lb-gr-gravado); opacity: 0.8; }
.mu-marcadores { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 12px 10px; overflow: auto; flex: 1; }
.mu-fita {
  position: absolute; left: 0; top: 0; width: 3px; height: 40px; border-radius: 0 2px 2px 0;
  background: linear-gradient(180deg, var(--lb-gr-latao-1), var(--lb-gr-latao-3)); box-shadow: 0 0 10px rgba(224, 164, 74, 0.35);
  transition: transform var(--lb-gr-dur-move) var(--lb-gr-ease-out);
}
.mu-marcador {
  display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; width: 100%;
  border-radius: var(--lb-radius-sm); color: var(--lb-gr-gravado); text-align: left;
  transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease;
}
.mu-marcador .ic { width: 18px; height: 18px; }
@media (hover: hover) and (pointer: fine) { .mu-marcador:hover { background: var(--lb-gr-hover); color: var(--lb-gr-gravado-forte); } }
.mu-marcador[aria-selected='true'] { background: var(--lb-gr-hover-forte); color: var(--lb-color-parchment); }
.mu-marcador[aria-selected='true'] .ic { color: var(--lb-color-brass-bright); }
.mu-marcador[aria-disabled='true'] { opacity: 0.62; }
.mu-marcador__n { font-family: var(--lb-font-utility); font-size: var(--lb-font-size-sm); color: var(--lb-gr-gravado); opacity: 0.85; }
.mu-marcador__novo { font: 500 var(--lb-font-size-xs) / 1 var(--lb-font-utility); color: var(--lb-color-brass-bright); }
.mu-pagina { position: relative; min-width: 0; min-height: 0; overflow: auto; background: linear-gradient(180deg, var(--lb-gr-papel-alto), var(--lb-gr-papel-baixo) 60%); scrollbar-width: thin; scrollbar-color: #3a3125 transparent; }
.pg { max-width: 1120px; margin: 0 auto; padding: 28px 36px 96px; }
.pg-cab { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 18px; }
.pg-cab__txt { flex: 1 1 380px; min-width: 0; }
.pg-titulo { font-family: var(--lb-font-display); font-size: 30px; font-weight: 400; line-height: 1.1; }
.pg-sub { margin-top: 6px; max-width: 70ch; color: var(--lb-color-parchment-dim); font-size: 14px; line-height: 1.55; }
.pg-acoes { display: flex; flex-wrap: wrap; gap: var(--lb-control-gap); }

.cat { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); gap: 20px; align-items: start; }
.cat-col { min-width: 0; }
.cat-busca { display: grid; gap: 10px; margin-bottom: 14px; }
.busca { position: relative; }
.busca > .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--lb-color-parchment-faint); pointer-events: none; }
.busca .entrada { padding-left: 32px; padding-right: 40px; }
.kbd { display: inline-block; min-width: 18px; padding: 2px 5px; border: 1px solid var(--lb-gr-filete-forte); border-bottom-width: 2px; border-radius: 4px; font: 500 var(--lb-font-size-xs) / 1 var(--lb-font-utility); color: var(--lb-color-parchment-dim); text-align: center; }
.busca .kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; transition: opacity var(--lb-motion-fast) ease; }
.busca:focus-within .kbd { opacity: 0; }
.cat-grupo + .cat-grupo { margin-top: 22px; }
.cat-grupo__tit { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; font-size: var(--lb-font-size-lg); font-weight: 600; }
.cat-grupo__tit small { font-weight: 400; font-size: var(--lb-font-size-md); color: var(--lb-color-parchment-faint); }
.cat-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 8px; }
.cat-vazio { padding: 22px; text-align: center; color: var(--lb-color-parchment-dim); }
.cat-vazio .bt { margin-top: 10px; }

.item { position: relative; display: flex; flex-direction: column; gap: 7px; height: 100%; padding: 12px 12px 10px; transition: border-color var(--lb-motion-fast) ease; }
.item[data-testando] { border-color: var(--lb-gr-filete-latao); box-shadow: inset 0 0 0 1px var(--lb-gr-filete-latao); }
.item[data-novo] { animation: destaque 1600ms ease both; }
@keyframes destaque { 0%, 30% { border-color: var(--lb-color-brass); } 100% { border-color: var(--lb-gr-filete); } }
.item__cab { display: flex; align-items: flex-start; gap: 9px; }
.item__nome { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.item__foto { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--lb-gr-filete); border-radius: var(--lb-radius-sm); background: var(--lb-gr-campo); }
.item__foto svg { width: 26px; height: 26px; }
.item__efeito { display: flex; flex-direction: column; gap: 2px; font-size: var(--lb-font-size-sm); line-height: 1.45; color: var(--lb-color-parchment-dim); }
.item__efeito li { display: flex; gap: 7px; align-items: baseline; }
.item__efeito li::before { content: ''; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--k, var(--lb-color-parchment-faint)); transform: translateY(-1px); }
.item__txt { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.item__pe { display: flex; align-items: center; gap: 4px; margin-top: auto; padding-top: 4px; }
.item__pe .bt--latao { margin-right: auto; }
.item__pe .ja { color: var(--lb-color-online); font-size: var(--lb-font-size-sm); padding: 0 6px; }

/* coluna do lado: a ficha que recebe (ou o Teste) */
.lado { position: sticky; top: 12px; min-width: 0; max-height: calc(100vh - var(--barra) - 24px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; border-radius: var(--lb-radius-lg); }
.destino { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.destino__tit { font-size: var(--lb-font-size-md); font-weight: 600; }
.destino__quem { display: flex; align-items: center; gap: 10px; }
.retrato { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 600 14px / 1 var(--lb-font-utility); color: var(--lb-gr-gravado-forte); background: linear-gradient(160deg, #4a3a28, #2a2016); box-shadow: 0 0 0 2px var(--lb-gr-papel-alto), 0 0 0 3px var(--lb-gr-filete-latao); }
.retrato--p { width: 28px; height: 28px; font-size: 11px; }
.destino__nome { display: block; font-family: var(--lb-font-display); font-size: 17px; line-height: 1.15; }
.destino__sub { display: block; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.destino__secao { border-top: 1px solid var(--lb-gr-filete); padding-top: 10px; }
.destino__secao h4 { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: var(--lb-font-size-md); font-weight: 600; }
.destino__secao h4 small { font-weight: 400; color: var(--lb-color-parchment-faint); font-family: var(--lb-font-utility); }
.destino__secao ul { display: flex; flex-direction: column; gap: 3px; color: var(--lb-color-parchment-dim); }
.destino__secao li { display: flex; justify-content: space-between; gap: 8px; }
.destino__secao li span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.destino__secao li[data-novo] { color: var(--lb-color-brass-bright); }
.destino select { max-width: 100%; }

/* ============================================================ JANELA (a ficha, o item) */
.fundo {
  position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px;
  background: rgba(6, 6, 8, 0.62);
  transition: opacity 200ms var(--lb-gr-ease-out);
}
.fundo[data-saindo] { opacity: 0; transition-duration: 140ms; }
@starting-style { .fundo { opacity: 0; } }
.janela {
  display: flex; flex-direction: column; width: min(1120px, 100%); height: min(860px, 100%);
  border: 1px solid var(--lb-color-line-panel); border-radius: var(--lb-radius-lg); background: var(--lb-color-stone-solid);
  box-shadow: var(--lb-shadow-lg), var(--lb-shadow-bevel); overflow: hidden;
  transition: transform 200ms var(--lb-gr-ease-out), opacity 200ms var(--lb-gr-ease-out);
}
.fundo[data-saindo] .janela { transform: scale(0.98); opacity: 0; transition-duration: 140ms; }
@starting-style { .janela { transform: scale(0.98); opacity: 0; } }
.janela--item { width: min(1040px, 100%); }
.janela__topo { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--lb-color-line); }
.janela__tit { font-family: var(--lb-font-display); font-size: var(--lb-font-size-xl); font-weight: 400; }
.janela__onde { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.janela__acoes { display: flex; gap: var(--lb-control-gap); margin-left: auto; }
.janela__corpo { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); }
.janela__lado { min-height: 0; overflow: auto; border-right: 1px solid var(--lb-color-line); background: var(--lb-color-stone-sunken); scrollbar-width: thin; }
.janela__principal { min-height: 0; overflow: auto; padding: 14px 18px 40px; scrollbar-width: thin; }

/* coluna do personagem (o que o Teste substitui) */
.pers { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.pers[data-entra] { animation: entra-lado 220ms var(--lb-gr-ease-out) both; }
.pers__cab { display: flex; gap: 12px; align-items: center; }
.pers__nome { font-family: var(--lb-font-display); font-size: 22px; line-height: 1.1; }
.pers__papel { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.barra-rec { display: grid; gap: 4px; }
.barra-rec__lin { display: flex; justify-content: space-between; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }
.barra-rec__lin b { font: 500 var(--lb-font-size-md) / 1 var(--lb-font-utility); color: var(--lb-color-parchment); font-variant-numeric: tabular-nums; }
.barra { height: 6px; border-radius: 3px; background: var(--lb-gr-campo); overflow: hidden; box-shadow: inset 0 0 0 1px var(--lb-gr-filete); }
.barra i { display: block; height: 100%; width: 100%; transform-origin: left; background: var(--c, var(--lb-color-ember)); transition: transform 260ms var(--lb-gr-ease-out); }
.attrs { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 10px; font-size: var(--lb-font-size-sm); }
.attrs dt { color: var(--lb-color-parchment-dim); }
.attrs dd { font-family: var(--lb-font-utility); text-align: right; font-variant-numeric: tabular-nums; }
.attrs dd.mod { color: var(--lb-color-parchment-faint); }
.abas { display: flex; gap: 2px; border-bottom: 1px solid var(--lb-color-line); margin-bottom: 12px; }
.aba { min-height: 34px; padding: 0 12px; color: var(--lb-color-parchment-dim); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.aba[aria-selected='true'] { color: var(--lb-color-parchment); border-bottom-color: var(--lb-color-brass); }
.aba:disabled { opacity: 0.6; }
.cartoes { display: flex; flex-direction: column; gap: 8px; }
.cartao-f { padding: 12px 16px; border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-md); background: var(--lb-color-stone-sunken); }
.cartao-f--lido { display: flex; align-items: baseline; gap: 10px; color: var(--lb-color-parchment-dim); }
.cartao-f--lido b { color: var(--lb-color-parchment); font-weight: 600; }
.cartao-f--editando { border-color: var(--lb-color-line-strong); background: var(--lb-color-stone-solid); }
.campo-nome { display: grid; gap: 4px; margin-bottom: 12px; }
.campo-nome label, .rot { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }
.campo-nome .entrada { font-size: 16px; font-weight: 600; min-height: 36px; }
.texto-antigo { margin-top: 14px; border-top: 1px solid var(--lb-color-line); padding-top: 10px; }
.texto-antigo summary { cursor: pointer; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.texto-antigo dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin-top: 8px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }

/* ============================================================ O EDITOR DA MECÂNICA (habilidade e item) */
.mec { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--lb-color-line); padding-top: 12px; }
.mec__cab { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.mec__tit { font: 500 var(--lb-font-size-xs) / 1 var(--lb-font-utility); letter-spacing: var(--lb-font-tracking-wider); text-transform: uppercase; color: var(--lb-color-parchment-faint); }
.mec__pergunta { font-family: var(--lb-font-display); font-size: 19px; line-height: 1.2; }
.mec__aproveita { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }
.mec__aproveita b { color: var(--lb-color-brass-bright); font-weight: 500; }

.grupos { display: flex; flex-direction: column; gap: 14px; }
.grupo__tit { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: var(--lb-font-size-md); font-weight: 600; }
.grupo__tit .ic { color: var(--k); }
.grupo__tit small { font-weight: 400; color: var(--lb-color-parchment-faint); }
.modelos { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 6px; }
.modelo {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 52px; padding: 8px 11px; text-align: left;
  border: 1px solid var(--lb-color-line-strong); border-radius: var(--lb-radius-md); background: var(--lb-color-stone-raised);
  transition: border-color var(--lb-motion-fast) var(--lb-motion-ease), background-color var(--lb-motion-fast) var(--lb-motion-ease), transform var(--lb-motion-fast) var(--lb-motion-ease);
}
.modelo:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .modelo:hover { border-color: var(--lb-color-brass); background: var(--lb-color-stone-hover); } }
.modelo__nome { font-weight: 600; }
.modelo__dica { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); line-height: 1.35; }
.modelo[data-grupo='reacao'] { border-left: 3px solid var(--ef-reacao); }
.modelo--vazio { border-style: dashed; background: transparent; }

/* o resumo + Testar: sempre à vista */
.resumo {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: start; padding: 10px 12px;
  border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-md); background: var(--lb-color-stone-sunken);
}
.resumo__cab { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; grid-column: 1 / -1; }
.resumo__tit { font: 500 var(--lb-font-size-xs) / 1 var(--lb-font-utility); letter-spacing: var(--lb-font-tracking-wider); text-transform: uppercase; color: var(--lb-color-parchment-faint); }
.frases { display: flex; flex-direction: column; gap: 2px; max-width: 70ch; font-variant-numeric: tabular-nums; }
.frases li { display: flex; gap: 8px; align-items: baseline; }
.frases li::before { content: ''; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--k, var(--lb-color-parchment-faint)); transform: translateY(-1px); }
.resumo__testar { align-self: center; }
.bt--testar { min-height: 36px; padding: 0 14px; }

/* degrau 2: os números em frase */
.numeros { display: flex; flex-direction: column; gap: 2px; }
.numeros__tit { margin-bottom: 4px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }
.lin {
  display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 40px; padding: 4px 6px 4px 8px;
  border-radius: var(--lb-radius-sm); border-left: 2px solid var(--k, var(--lb-color-line-strong));
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.025), transparent 60%);
}
.lin > .ic { color: var(--k); }
.lin__frase { line-height: 2; }
.lin__x { color: var(--lb-color-parchment-faint); }
.f-num, .f-txt, .f-sel {
  display: inline-block; vertical-align: baseline; min-height: 26px; margin: 0 2px; padding: 0 6px; border-radius: 5px;
  border: 1px solid var(--lb-gr-filete-forte); background: var(--lb-gr-campo); color: var(--lb-color-parchment);
  font-family: var(--lb-font-utility); font-variant-numeric: tabular-nums; font-size: 13.5px;
  transition: border-color var(--lb-motion-fast) ease;
}
.f-num { width: 6ch; text-align: right; }
.f-num--p { width: 4.5ch; }
.f-txt { width: var(--w, 22ch); max-width: 100%; }
@supports (field-sizing: content) { .f-txt { field-sizing: content; width: auto; min-width: var(--w, 8ch); } }
.f-sel { padding-right: 4px; cursor: pointer; }
.f-num:focus-visible, .f-txt:focus-visible, .f-sel:focus-visible { border-color: var(--lb-color-brass); }
.f-num[aria-invalid='true'], .f-txt[aria-invalid='true'] { border-color: rgba(226, 100, 90, 0.7); }
.f-valor { font-family: var(--lb-font-utility); color: var(--lb-color-parchment-faint); font-size: var(--lb-font-size-sm); }
.lin__erro { grid-column: 2 / -1; margin-top: -4px; }
.mais-efeito { align-self: flex-start; margin: 6px 0 0 8px; }

/* menu de adicionar efeito: cresce do botão */
.menu-ancora { position: relative; display: inline-block; }
.menu {
  position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; width: 290px; padding: 6px;
  border: 1px solid var(--lb-color-line-panel); border-radius: var(--lb-radius-md); background: var(--lb-color-stone-solid); box-shadow: var(--lb-shadow-float);
  transform-origin: top left; transition: opacity 140ms var(--lb-gr-ease-out), transform 140ms var(--lb-gr-ease-out);
}
@starting-style { .menu { opacity: 0; transform: scale(0.96); } }
.menu button { display: grid; grid-template-columns: 20px 1fr; gap: 2px 10px; width: 100%; padding: 7px 8px; border-radius: var(--lb-radius-sm); text-align: left; }
.menu button .ic { grid-row: span 2; color: var(--k); margin-top: 2px; }
.menu button span { font-weight: 500; }
.menu button small { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.menu button:disabled { opacity: 0.45; }
@media (hover: hover) and (pointer: fine) { .menu button:hover:not(:disabled) { background: var(--lb-gr-hover-forte); } }
.menu button:focus-visible { background: var(--lb-gr-hover-forte); }

/* degrau 3: avançado dobrado */
.avancado { border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-md); }
.avancado > summary { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; cursor: pointer; list-style: none; color: var(--lb-color-parchment-dim); }
.avancado > summary::-webkit-details-marker { display: none; }
.avancado > summary::before { content: ''; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform var(--lb-motion-fast) ease; }
.avancado[open] > summary::before { transform: rotate(45deg); }
.avancado > summary b { color: var(--lb-color-parchment); font-weight: 600; }
.avancado__corpo { display: flex; flex-direction: column; gap: 6px; padding: 0 10px 10px; }
.bloco { border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-sm); background: var(--lb-color-stone-sunken); }
.bloco > summary { display: grid; grid-template-columns: 22px auto minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 8px 10px; cursor: pointer; list-style: none; }
.bloco > summary::-webkit-details-marker { display: none; }
.bloco__n { font: 500 var(--lb-font-size-sm) / 1 var(--lb-font-utility); color: var(--lb-color-parchment-faint); text-align: right; }
.bloco__tit { font-weight: 600; }
.bloco__frase { min-width: 0; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bloco[open] .bloco__frase { white-space: normal; }
.bloco__corpo { display: flex; flex-direction: column; gap: 10px; padding: 2px 12px 12px 42px; }
.bloco__lin { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.bloco__lin > .rot { min-width: 86px; }
.bloco--novo { border-color: var(--lb-gr-filete-latao); }
.bloco__novo { font: 500 var(--lb-font-size-xs) / 1 var(--lb-font-utility); color: var(--lb-color-brass-bright); }

/* o desenho do alvo: miniatura da área */
.formas { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
.forma { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 6px 7px; border: 1px solid var(--lb-gr-filete-forte); border-radius: var(--lb-radius-sm); text-align: center; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); cursor: pointer; transition: border-color var(--lb-motion-fast) ease, background-color var(--lb-motion-fast) ease; }
.forma input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.forma:has(input:checked) { border-color: var(--lb-color-brass); background: var(--lb-color-brass-soft); color: var(--lb-color-parchment); }
.forma:has(input:focus-visible) { box-shadow: var(--lb-shadow-focus); }
.forma svg { width: 54px; height: 54px; }
.forma svg .c { fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 255, 255, 0.09); stroke-width: 1; }
.forma svg .a { fill: rgba(226, 100, 90, 0.55); }
.forma svg .u { fill: var(--lb-color-brass-bright); }
.forma svg .p { fill: none; stroke: var(--lb-color-brass-bright); stroke-width: 1.5; stroke-dasharray: 2 2; }

/* lista de efeitos no avançado */
.efeitos { display: flex; flex-direction: column; gap: 6px; }
.efeito { border-left: 3px solid var(--k); border-radius: var(--lb-radius-sm); background: var(--lb-gr-hover); padding: 6px 8px 6px 10px; }
.efeito__cab { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.efeito__cab .ic { color: var(--k); }
.efeito__cab .bt { margin-left: auto; }
.limite-txt { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }

.desfeito { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--lb-radius-sm); background: var(--lb-color-brass-soft); font-size: var(--lb-font-size-sm); }
.desfeito .bt { margin-left: auto; }

/* o item: cabeçalho próprio e o que vai ao jogador */
.item-cab { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px 14px; margin-bottom: 12px; }
.item-cab__foto { width: 64px; height: 64px; display: grid; place-items: center; border-radius: var(--lb-radius-md); border: 1px solid var(--lb-gr-filete); background: var(--lb-gr-campo); }
.item-cab__foto svg { width: 46px; height: 46px; }
.item-cab__campos { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 0.8fr); gap: 10px; }
.item-cab__campos .campo-nome { margin: 0; }
.item-cab__campos .entrada { font-size: var(--lb-font-size-md); font-weight: 400; min-height: 32px; }
.item-cab__campos .campo-nome:first-child .entrada { font-size: 16px; font-weight: 600; }
.vaga { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--lb-gr-filete); border-radius: var(--lb-radius-sm); background: var(--lb-gr-campo); }
.vaga__foto { width: 34px; height: 34px; display: grid; place-items: center; }
.vaga__foto svg { width: 28px; height: 28px; }
.vaga__nome { font-weight: 600; }
.vaga__frase { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }
.vaga__qtd { font-family: var(--lb-font-utility); color: var(--lb-color-parchment-dim); }
.preview { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.preview[data-entra] { animation: entra-lado 220ms var(--lb-gr-ease-out) both; }
.preview h4 { font-size: var(--lb-font-size-sm); font-weight: 600; color: var(--lb-color-parchment-dim); }

/* ============================================================ A MINIABA TESTE */
.teste { display: flex; flex-direction: column; min-height: 100%; }
.teste[data-entra] { animation: entra-lado 220ms var(--lb-gr-ease-out) both; }
@keyframes entra-lado { from { opacity: 0; transform: translateX(-8px); } }
.lado .teste[data-entra] { animation-name: entra-lado-dir; }
@keyframes entra-lado-dir { from { opacity: 0; transform: translateX(8px); } }
.teste__cab { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 4px 8px; padding: 10px 12px 10px 14px; border-bottom: 1px solid var(--lb-gr-filete); }
.teste__cab .teste__tits { display: contents; }
.teste__cab .teste__nome { grid-column: 1 / -1; grid-row: 2; }
.teste__tits { flex: 1; min-width: 0; }
.teste__rot { font: 500 var(--lb-font-size-xs) / 1 var(--lb-font-utility); letter-spacing: var(--lb-font-tracking-wider); text-transform: uppercase; color: var(--lb-color-brass-bright); }
.teste__nome { display: block; margin-top: 3px; font-family: var(--lb-font-display); font-size: 18px; line-height: 1.15; overflow-wrap: anywhere; }
.teste__ctx { display: flex; flex-direction: column; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--lb-gr-filete); }
.teste__quem { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 6px; align-items: baseline; font-size: var(--lb-font-size-sm); }
.teste__quem > span:first-child { color: var(--lb-color-parchment-faint); }
.teste__quem b { font-weight: 600; color: var(--lb-color-parchment); }
.teste__quem .num { color: var(--lb-color-parchment-dim); }
.teste__linha { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: var(--lb-font-size-sm); }
.teste__linha > .rot { min-width: 62px; color: var(--lb-color-parchment-faint); }
.teste__ajustes > summary { cursor: pointer; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); list-style: none; display: inline-flex; align-items: center; gap: 6px; min-height: 26px; }
.teste__ajustes > summary::-webkit-details-marker { display: none; }
.teste__ajustes > summary::before { content: ''; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform var(--lb-motion-fast) ease; }
.teste__ajustes[open] > summary::before { transform: rotate(45deg); }
.teste__ajustes-corpo { display: flex; flex-direction: column; gap: 8px; padding: 6px 0 4px; }
.teste__auto { font-size: var(--lb-font-size-sm); color: var(--lb-color-brass-bright); }

<script>
"use strict";
/* ---- data.js ---- */
'use strict';
/* ==========================================================================
 * DADOS DE MENTIRA, com os números da mesa (HP 300 a 1100, SP 60 a 240,
 * atributos até 100). Os modelos são os da seção 9 de SISTEMA.md (H01-H22 e
 * I01-I25), escritos na forma curta da `mecanica` versão 2 da seção 2.
 * ========================================================================== */

const clone = (v) => (v === undefined ? v : JSON.parse(JSON.stringify(v)));
const ATRIBUTOS = ['Força', 'Agilidade', 'Espírito', 'Resistência', 'Percepção'];
const CONDICOES_NEGATIVAS = ['Envenenado', 'Sangrando', 'Queimando', 'Cego', 'Atordoado', 'Paralisado', 'Marcado', 'Enfraquecido', 'Lento', 'Corroído'];
/* Selos que agem na vez de quem tem (botão Aplicar do mestre, hoje). */
const SELO_POR_VEZ = { Sangrando: 10, Queimando: 10 };
/* A regra que o nome já traz (lib/batalha/condicoes.ts:63-101). */
const REGRA_DO_SELO = {
  Atordoado: 'só passa a vez e não reage', Paralisado: 'só passa a vez e não reage', Cego: 'Percepção 0',
  Marcado: 'esquiva com desvantagem', Sangrando: '10 de HP por vez', Queimando: '10 de HP por vez',
};

const LIMITE_VAZIO = { recarga: 0, usos: 0, porRodada: 0, overload: false };
const ALVO_VAZIO = { quem: 'inimigos', forma: 'um', tam: 1, max: 2, alcance: 0, estado: 'dePe' };

/** Monta uma mecânica com os campos de fábrica (a forma curta da v2). */
function M(o) {
  const base = { uso: 'ativa', acao: 'simples', custo: null, teste: { tipo: 'reacao' }, dano: null, efeitos: [], reacao: null };
  const m = Object.assign(base, clone(o));
  m.limite = Object.assign({}, LIMITE_VAZIO, o.limite || {});
  m.alvo = Object.assign({}, ALVO_VAZIO, o.alvo || {});
  return m;
}
const SP = (n) => ({ recurso: 'sp', quanto: n });
const DANO = (formula, extra) => Object.assign({ formula, perf: 0, segundo: null }, extra || {});
const SELO = (nome, duracao, natureza, extra) => Object.assign({ tipo: 'selo', nome, duracao, natureza, mods: [], porTurno: null, em: 'alvo' }, extra || {});
const CURA = (recurso, modo, valor, extra) => Object.assign({ tipo: 'cura', recurso, modo, valor, em: 'alvo' }, extra || {});
const RESIST = (atributo, cd, sePassar) => ({ tipo: 'resist', atributo, cd, sePassar });
const REACAO = (defesa, extra) => Object.assign({ defesa, porcento: 50, atributos: ['Força', 'Agilidade'], anulaCom: 15, devolve: 0, curaDoQueChegava: 0, valeContra: [] }, extra || {});

/* ------------------------------------------------------------ 9.1 Habilidades (22) */
const GRUPOS_DE_HABILIDADE = [

/* ==========================================================================

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fmt = (n) => (n === Infinity ? '∞' : Math.round(n).toLocaleString('pt-BR'));
const vezes = (n) => (n === 1 ? '1 vez' : n + ' vezes');
const semAcento = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const RECURSO = { hp: 'HP', sp: 'SP', escudo: 'Escudo' };
const ACAO = { simples: 'Ação Simples', bonus: 'Ação Bônus', completa: 'Ação Completa', livre: 'Ação Livre' };

/* ==========================================================================
 * FÓRMULA: "Força + 20 + Dano da Arma" com os números da ficha.
 * Só soma (é o que os modelos usam). Termo desconhecido = a fórmula não fecha.
 * ========================================================================== */
function avaliar(formula, ficha) {
  const limpa = String(formula || '').replace(/[()]/g, ' ').trim();
  if (limpa === '') return { ok: false, motivo: 'a fórmula está vazia' };
  if (limpa.length > 200) return { ok: false, motivo: 'a fórmula passa de 200 letras' };
  const termos = limpa.split('+').map((t) => t.trim());
  const partes = [];
  for (const termo of termos) {
    if (termo === '') return { ok: false, motivo: 'sobrou um "+" sem nada depois' };
    if (/^\d+$/.test(termo)) { partes.push({ rot: '', v: Number(termo) }); continue; }
    const attr = ATRIBUTOS.find((a) => semAcento(a) === semAcento(termo));
    if (attr) { partes.push({ rot: attr, v: ficha.attrs[attr] }); continue; }
    if (semAcento(termo) === 'dano da arma') { partes.push({ rot: ficha.arma.nome, v: ficha.arma.dano }); continue; }
    return { ok: false, motivo: 'o app não conhece "' + termo + '"' };
  }
  const total = partes.reduce((s, p) => s + p.v, 0);
  const conta = partes.map((p) => (p.rot ? p.rot + ' ' + p.v : String(p.v))).join(' + ');
  return { ok: true, total, conta: partes.length > 1 || partes[0].rot ? conta + ' = ' + total : String(total) };
}

/* ==========================================================================

function textoDoAlvo(alvo, curto) {
  const quem = { inimigos: ['1 inimigo', 'os inimigos'], aliados: ['1 aliado', 'os aliados'], todos: ['1 alvo', 'todos'], si: ['si mesmo', 'si mesmo'] }[alvo.quem];
  let t;
  switch (alvo.forma) {
    case 'varios': t = 'até ' + alvo.max + ' ' + (alvo.quem === 'aliados' ? 'aliados' : alvo.quem === 'todos' ? 'alvos' : 'inimigos'); break;
    case 'linha': t = quem[1] + ' numa linha de ' + alvo.tam + ' casas'; break;
    case 'quadrado': t = quem[1] + ' no ' + alvo.tam + 'x' + alvo.tam + ' à frente'; break;
    case 'volta': t = quem[1] + ' a ' + alvo.tam + (alvo.tam === 1 ? ' casa' : ' casas') + ' em volta de quem usa'; break;
    case 'ponto': t = quem[1] + ' a ' + alvo.tam + (alvo.tam === 1 ? ' casa' : ' casas') + ' de um ponto' + (alvo.alcance ? ' até ' + alvo.alcance + ' casas' : ''); break;
    default: t = alvo.quem === 'si' ? 'si mesmo' : quem[0] + (alvo.estado === 'caido' ? ' caído' : '') + (alvo.alcance === 1 ? ' a até 1 casa' : alvo.alcance ? ' a até ' + alvo.alcance + ' casas' : '');
  }
  if (!curto && alvo.quem === 'todos' && alvo.forma !== 'um') t += ' (aliados também)';
  return t;
}
const ehArea = (alvo) => ['volta', 'ponto', 'linha', 'quadrado', 'varios'].includes(alvo.forma);
const temReacao = (mec) => mec.uso === 'reacao' || mec.uso === 'ativaOuReacao';

function fraseDaDefesa(r) {
  if (!r) return 'Sem defesa montada.';
  const base = {
    anula: 'Anula o golpe: não toma nada.',
    fica: 'Fica com ' + r.porcento + '% do dano.',
    rola: 'Rola d20 + o maior mod entre ' + r.atributos.join(' e ') + ': ' + r.anulaCom + ' ou mais anula.',
    nenhuma: 'Toma o golpe e só faz os efeitos.',
  }[r.defesa];
  const extra = [];
  if (r.devolve) extra.push('Devolve ' + (r.devolve === 2 ? 'metade' : '1/' + r.devolve) + ' do dano em quem atacou, sem reação dele.');
  if (r.curaDoQueChegava) extra.push('Cura ' + r.curaDoQueChegava + '% do dano que chegava.');
  if (r.valeContra.length) extra.push('Vale também contra ' + r.valeContra.map((v) => (v === 'overload' ? 'Overload' : 'Surpresa')).join(' e ') + '.');
  return [base].concat(extra).join(' ');
}

function fraseDoEfeito(e, ficha) {
  switch (e.tipo) {
    case 'selo': {
      const onde = e.em === 'atacante' ? 'Em quem atacou: ' : e.em === 'quemUsa' ? 'Em quem usa: ' : 'Deixa ';
      const dur = e.duracao === 0 ? 'até tirarem' : 'por ' + vezes(e.duracao);
      let t = onde + e.nome + ' ' + dur;
      if (e.porTurno) t += ', ' + (e.porTurno.sinal === 'tira' ? 'tirando ' : 'dando ') + e.porTurno.quanto + ' de HP por vez';
      if (e.mods.length) t += ': ' + e.mods.map((m) => m.alvo + ' ' + (m.delta > 0 ? '+' : '−') + Math.abs(m.delta)).join(', ');
      else if (REGRA_DO_SELO[e.nome] && !e.porTurno) t += ' (' + REGRA_DO_SELO[e.nome] + ')';
      return t + '.';
    }
    case 'cura': {
      const r = RECURSO[e.recurso];
      const quem = e.em === 'quemUsa' ? ' em quem usa' : '';
      if (e.modo === 'cheio') return (e.recurso === 'hp' ? 'Enche o HP' : 'Enche o ' + r) + quem + '.';
      if (e.modo === 'porcento') return (e.recurso === 'sp' ? 'Recupera ' : 'Cura ') + e.valor + '% do ' + r + ' máximo' + quem + '.';
      const av = ficha ? avaliar(e.valor, ficha) : null;
      const com = av && av.ok && !/^\d+$/.test(String(e.valor).trim()) ? ' (' + av.total + ' com ' + ficha.nome + ')' : '';
      if (e.recurso === 'escudo') return 'Dá ' + e.valor + ' de Escudo' + com + quem + '.';
      return (e.recurso === 'sp' ? 'Recupera ' : 'Cura ') + e.valor + ' de ' + r + com + quem + '.';
    }
    case 'reviver': return 'Levanta quem caiu com ' + (e.porcento >= 100 ? 'o HP cheio' : e.porcento + '% do HP máximo') + '.';
    case 'tirar': return e.quais === 'negativos' ? 'Tira todas as condições negativas.' : e.quais === 'todos' ? 'Tira todas as condições.' : 'Tira ' + e.nomes.join(' e ') + '.';
    case 'dreno': return 'Quem usa recupera ' + e.porcento + '% do dano em HP.';
    case 'aMao': return 'À mão: ' + e.texto;
    default: return '';
  }
}
const COR_DO_EFEITO = (e) => (e.tipo === 'selo' ? (e.natureza === 'buff' ? 'var(--ef-buff)' : 'var(--ef-debuff)') : e.tipo === 'cura' ? (e.recurso === 'sp' ? 'var(--ef-sp)' : e.recurso === 'escudo' ? 'var(--ef-escudo)' : 'var(--ef-cura)') : e.tipo === 'aMao' ? 'var(--ef-mao)' : e.tipo === 'dreno' ? 'var(--ef-cura)' : 'var(--ef-buff)');
const ICONE_DO_EFEITO = (e) => (e.tipo === 'selo' ? (e.natureza === 'buff' ? 'setaCima' : 'caveira') : e.tipo === 'cura' ? (e.recurso === 'sp' ? 'gotaSp' : e.recurso === 'escudo' ? 'escudo' : 'coracao') : { reviver: 'pluma', tirar: 'frascoX', dreno: 'dreno', aMao: 'mao' }[e.tipo]);

/** As frases do resumo. `ctx` = { tipo: 'hab'|'item', ficha, gasta, onde, pilha }. */
function frases(mec, ctx) {
  const out = [];

  if (temReacao(mec)) out.push({ k: 'var(--ef-reacao)', t: mec.uso === 'reacao' ? 'No lugar da reação, escolhida antes do d20. Não gasta a ação da vez.' : 'Na vez (' + ACAO[mec.acao] + ') ou no lugar da reação, antes do d20.' });
  if (ctx.tipo === 'item') {
    out.push({ k: 'var(--lb-color-parchment-faint)', t: (ctx.gasta === 'nada' ? 'Não gasta: fica na mochila.' : 'Gasta 1 por uso.') + ' ' + ACAO[mec.acao] + ' para usar.' + (ctx.onde === 'soFora' ? ' Só fora da batalha.' : ctx.onde === 'soNaBatalha' ? ' Só na batalha.' : '') });
  } else {

    out.push({ k: 'var(--ef-sp)', t: custo + (mec.uso === 'reacao' ? '.' : ' e gasta a ' + ACAO[mec.acao] + '.') });
  }

  const ehUsa = alvo === usa;
  const nomeAlvo = ehUsa ? usa.nome : (alvo.nome || 'Boneco');
  if (e.tipo === 'aMao') { add('aMao', 'À mão', esc(e.texto) + ' O mestre confere.', 'mao'); return; }
  if (e.tipo === 'reviver') {
    if (!alvo.caido) { add('cura', tit('Reviver'), 'Não pegou: ' + nomeAlvo + ' está de pé.', ''); return; }
    const volta = e.porcento >= 100 ? alvo.hpMax : Math.floor((alvo.hpMax * e.porcento) / 100);
    const h0 = alvo.hp; alvo.hp = volta; alvo.caido = false;
    add('reviveu', tit('Reviveu'), 'Levantou com ' + (e.porcento >= 100 ? 'o HP cheio' : e.porcento + '% do HP máximo') + '. ' + dePara('HP', h0, alvo.hp) + ' Volta a agir na próxima vez dele.', 'bom');
    return;
  }
  if (e.tipo === 'cura') {
    if (alvo.caido) { add('cura', tit('Cura'), 'Não pega em quem caiu: para levantar, use Reviver.', ''); return; }
    const r = e.recurso;
    const max = r === 'hp' ? alvo.hpMax : r === 'sp' ? alvo.spMax : Infinity;
    let q;
    let conta = '';
    if (e.modo === 'cheio') q = max - alvo[r];
    else if (e.modo === 'porcento') { q = Math.floor((max * e.valor) / 100); conta = e.valor + '% de ' + fmt(max) + ' = ' + q + '. '; }
    else { const av = avaliar(e.valor, usa); if (!av.ok) { add('cura', tit('Cura'), 'A conta não fecha: ' + av.motivo + '.', 'ruim'); return; } q = av.total; conta = /^\d+$/.test(String(e.valor).trim()) ? '' : av.conta + '. '; }
    const v0 = alvo[r];
    alvo[r] = Math.min(max, alvo[r] + q);
    add('cura', tit(r === 'escudo' ? 'Escudo' : r === 'sp' ? 'SP' : 'Cura'), conta + (alvo[r] === v0 ? 'Já estava cheio. ' : '') + dePara(RECURSO[r], v0, alvo[r]), 'bom');
    return;
  }
  if (e.tipo === 'tirar') {
    const tem = alvo.selos.map((s) => s.nome);
    const sai = e.quais === 'negativos' ? tem.filter((n) => CONDICOES_NEGATIVAS.includes(n)) : e.quais === 'todos' ? tem : tem.filter((n) => e.nomes.includes(n));
    alvo.selos = alvo.selos.filter((s) => !sai.includes(s.nome));
    const ficou = alvo.selos.map((s) => s.nome);
    add('tirouSelo', tit('Tirou'), sai.length ? 'Tirou ' + sai.join(' e ') + '.' + (ficou.length ? ' Ficou: ' + ficou.join(', ') + '.' : ' Sem condições agora.') : 'Nada para tirar: ' + nomeAlvo + ' não tinha ' + (e.quais === 'nomes' ? e.nomes.join(' nem ') : 'condição negativa') + '.', sai.length ? 'bom' : '');
    return;
  }
  if (e.tipo === 'selo') {
    if (!pega) { add('selo', tit(e.natureza === 'buff' ? 'Reforço' : 'Condição'), e.nome + ' não pegou: ' + (motivo || 'o golpe não acertou') + '.', ''); return; }
    const ja = alvo.selos.find((s) => s.nome === e.nome);
    if (ja) ja.n = e.duracao || 99; else alvo.selos.push({ nome: e.nome, n: e.duracao || 99, natureza: e.natureza, porTurno: e.porTurno, mods: e.mods });
    let t = e.nome + ' por ' + (e.duracao ? vezes(e.duracao) + ' de ' + (ehUsa ? usa.nome : 'quem tem') : 'até tirarem');
    if (e.porTurno) t += ' (' + e.porTurno.quanto + ' de HP por vez)';
    if (e.mods.length) t += ': ' + e.mods.map((md) => md.alvo + ' ' + (md.delta > 0 ? '+' : '−') + Math.abs(md.delta)).join(', ') + ' enquanto durar';
    else if (REGRA_DO_SELO[e.nome] && !e.porTurno) t += ': ' + REGRA_DO_SELO[e.nome];
    if (ja) t += ' (já tinha: renovou)';
    add('selo', tit(e.natureza === 'buff' ? 'Reforço' : 'Condição'), t + '.', e.natureza === 'buff' ? 'bom' : '');
  }
}

function depois(m, add, quem) {
  const l = m.limite; const t = [];
  if (l.overload) t.push('Overload: a de ' + quem + ' nesta batalha foi usada.');
  if (l.recarga) t.push('Recarga ' + l.recarga + ': volta depois de ' + vezes(l.recarga) + ' de ' + quem + '.');
  if (l.usos) t.push('Usos: 1 de ' + l.usos + ' nesta batalha.');
  add('depois', 'Depois', t.length ? t.join(' ') : 'Sem limite: pode usar de novo na próxima vez.');
}

/** "Passar 1 vez do alvo": o que age por vez (Sangrando, Queimando, regeneração) e a duração descendo. */
function passarUmaVez(res) {
  const linhas = [];
  for (const b of res.bonecos) {
    if (b.selos.length === 0) continue;
    for (const s of b.selos.slice()) {
      if (s.porTurno) {
        const h0 = b.hp;
        if (b.hp !== Infinity) b.hp = s.porTurno.sinal === 'tira' ? Math.max(0, b.hp - s.porTurno.quanto) : Math.min(b.hpMax, b.hp + s.porTurno.quanto);
        b.batido = s.porTurno.sinal === 'tira';
        linhas.push((res.bonecos.length > 1 ? b.nome + ', ' : '') + s.nome + ': ' + (s.porTurno.sinal === 'tira' ? '−' : '+') + s.porTurno.quanto + ' HP (' + fmt(h0) + ' → ' + fmt(b.hp) + ')' + (s.n < 99 ? ', ' + (s.n - 1 === 0 ? 'acabou' : 'faltam ' + (s.n - 1)) : '') + '.');
      } else if (s.n < 99) linhas.push((res.bonecos.length > 1 ? b.nome + ', ' : '') + s.nome + ': ' + (s.n - 1 === 0 ? 'acabou' : 'faltam ' + vezes(s.n - 1)) + '.');
      if (s.n < 99) s.n -= 1;
    }
    b.selos = b.selos.filter((s) => s.n > 0);
  }
  if (linhas.length === 0) linhas.push('Nada acontece na vez do boneco: ele não tem condição que age ou conta por vez.');
  return linhas;
}

/* ==========================================================================
 * O QUE FALTA para a peça valer (o "Ainda não vale na batalha" de hoje).
 * ========================================================================== */
function problemaDa(mec, ficha) {
  if (mec.dano) { const av = avaliar(mec.dano.formula, ficha); if (!av.ok) return 'o dano: ' + av.motivo; }
  for (const e of mec.efeitos) {
    if (e.tipo === 'cura' && e.modo === 'valor') { const av = avaliar(e.valor, ficha); if (!av.ok) return 'a cura: ' + av.motivo; }
    if (e.tipo === 'selo' && !String(e.nome).trim()) return 'a condição está sem nome';
    if (e.tipo === 'tirar' && e.quais === 'nomes' && e.nomes.length === 0) return 'diga que condição o efeito tira';
  }
  if (temReacao(mec) && !mec.reacao) return 'a reação está sem defesa';
  if (!mec.dano && mec.efeitos.length === 0 && !temReacao(mec)) return 'a peça não faz nada: dê um dano ou um efeito';
  return null;
}

function htmlMenuEfeito(E) {
  const m = E.mec;

  for (const t of TIPOS_DE_EFEITO) {
    let motivo = '';

    else if (cheio) motivo = 'teto de 8 efeitos';
    else if ((t.id === 'debuff' || t.id === 'buff') && selos >= MAX_SELOS) motivo = 'teto de 3 condições no mesmo golpe';

/* ---------------------------------------------------------------- degrau 3: o avançado */
function svgForma(f) {
  const cel = (c, r, cls) => '<rect class="' + cls + '" x="' + (c * 11) + '" y="' + (r * 11) + '" width="10" height="10" rx="2"/>';
  let a = []; let u = [2, 4]; let extra = '';
  if (f === 'um') a = [[2, 1]];
  if (f === 'varios') a = [[1, 1], [3, 1]];
  if (f === 'linha') a = [[2, 0], [2, 1], [2, 2], [2, 3]];
  if (f === 'quadrado') for (let r = 1; r <= 3; r++) for (let c = 1; c <= 3; c++) a.push([c, r]);
  if (f === 'volta') { u = [2, 2]; for (let r = 1; r <= 3; r++) for (let c = 1; c <= 3; c++) if (!(r === 2 && c === 2)) a.push([c, r]); }
  if (f === 'ponto') { u = [0, 4]; for (let r = 0; r <= 2; r++) for (let c = 2; c <= 4; c++) a.push([c, r]); extra = '<path class="p" d="M5 49L38 16"/>'; }
  let s = '';
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
    const isA = a.some(([x, y]) => x === c && y === r); const isU = u[0] === c && u[1] === r;
    s += cel(c, r, isU ? 'u' : isA ? 'a' : 'c');
  }
  return '<svg viewBox="0 0 54 54" aria-hidden="true">' + s + extra + '</svg>';
}

/** Desenha o editor no lugar e devolve o foco ao campo que estava com ele. */
function renderEditor(E) {
  const host = document.querySelector('[data-ed="' + E.id + '"]');
  if (!host) return;
  const ativo = document.activeElement;
  const f = ativo && host.contains(ativo) ? ativo.getAttribute('data-f') || (ativo.dataset.act ? 'act:' + ativo.dataset.act + ':' + (ativo.dataset.v || '') : null) : null;
  const selIni = ativo && 'selectionStart' in ativo ? ativo.selectionStart : null;
  host.innerHTML = htmlEditor(E);
  if (E.aoMudar) E.aoMudar(E);
  if (f) {
    let alvo = f.startsWith('act:') ? host.querySelector('[data-act="' + f.split(':')[1] + '"]' + (f.split(':')[2] ? '[data-v="' + f.split(':')[2] + '"]' : '')) : host.querySelector('[data-f="' + CSS.escape(f) + '"]');
    if (alvo) { alvo.focus({ preventScroll: true }); if (selIni !== null && alvo.setSelectionRange && alvo.type === 'text') try { alvo.setSelectionRange(selIni, selIni); } catch (_) { /* campo sem seleção */ } }
  }
}

  const r = host.querySelector('[data-resumo]');
  if (r) r.outerHTML = htmlResumo(E);
  const fr = frases(E.mec, { tipo: E.tipo, ficha: E.ficha, gasta: E.gasta, onde: E.onde });
  const d = fr.find((x) => x.k === 'var(--ef-dano)');
  const bd = host.querySelector('[data-bloco="dano"] .bloco__frase');
  if (bd && d) bd.textContent = d.t;
  if (E.aoMudar) E.aoMudar(E);
}

/* ---------------------------------------------------------------- ações do editor */
function comecarDe(E, modelo) {
  const antes = E.mec ? clone(E.mec) : null;
  const m = clone(modelo.mec);
  E.aproveitou = null;
  if (E.tipo === 'hab' && E.cartao) {
    if (m.dano && E.cartao.dano) m.dano.formula = E.cartao.dano;
    const c = /(\d+)\s*(SP|HP)/i.exec(E.cartao.custo || '');
    if (m.custo && c) m.custo = { recurso: c[2].toLowerCase(), quanto: Number(c[1]) };
  }
  E.mec = m; E.modelo = modelo.nome; E.fase = 'editando'; E.menu = null; E.errosDigitados = {};
  if (E.tipo === 'item') { E.gasta = 'um'; E.onde = modelo.onde || 'sempre'; if (E.aoModeloDoItem) E.aoModeloDoItem(modelo); }
  E.desfeito = antes ? { texto: 'A mecânica de antes foi trocada pelo modelo ' + modelo.nome + '.', antes } : null;
  renderEditor(E);
  if (E.aoTestarAberto) E.aoTestarAberto(E);
  const pri = document.querySelector('[data-ed="' + E.id + '"] .lin input, [data-ed="' + E.id + '"] .lin select');
  if (pri) pri.focus();
}

function novoEfeito(tipo) {
  switch (tipo) {
    case 'curaHp': return CURA('hp', 'valor', '50');
    case 'curaSp': return CURA('sp', 'valor', '30');
    case 'escudo': return CURA('escudo', 'valor', '50');
    case 'reviver': return { tipo: 'reviver', porcento: 25 };
    case 'tirar': return { tipo: 'tirar', quais: 'nomes', nomes: ['Envenenado'] };
    case 'debuff': return SELO('Lento', 2, 'debuff');
    case 'buff': return SELO('Fortalecido', 2, 'buff', { mods: [{ alvo: 'Força', delta: 20 }] });
    case 'dreno': return { tipo: 'dreno', porcento: 50 };
    case 'aMao': return { tipo: 'aMao', texto: 'Empurra o alvo 2 casas.' };
    default: return null;
  }
}

function acaoDoEditor(E, act, el) {
  const m = E.mec;
  switch (act) {
    case 'modelo': comecarDe(E, (E.tipo === 'hab' ? MODELOS_DE_HABILIDADE : MODELOS_DE_ITEM).find((x) => x.id === el.dataset.v)); return;
    case 'semEfeito': { const antes = E.mec ? clone(E.mec) : null; E.mec = null; E.fase = 'modelos'; E.desfeito = antes ? { texto: 'O efeito saiu: o item só carrega.', antes } : null; if (E.aoSemEfeito) E.aoSemEfeito(E); renderEditor(E); avisar('O item fica sem efeito: só carrega.'); return; }
    case 'voltarEditar': E.fase = 'editando'; renderEditor(E); return;
    case 'recomecar': E.fase = 'modelos'; renderEditor(E); { const b = document.querySelector('[data-ed="' + E.id + '"] .modelo'); if (b) b.focus(); } return;
    case 'tirarMecanica': { const antes = clone(E.mec); E.mec = null; E.fase = 'modelos'; E.desfeito = { texto: E.tipo === 'hab' ? 'A mecânica saiu: a técnica volta ao texto.' : 'O efeito saiu: o item só carrega.', antes }; if (E.aoSemEfeito) E.aoSemEfeito(E); renderEditor(E); return; }
    case 'desfazer': if (E.desfeito) { E.mec = E.desfeito.antes; E.fase = 'editando'; E.desfeito = null; renderEditor(E); if (E.aoTestarAberto) E.aoTestarAberto(E); } return;
    case 'menuEfeito': E.menu = E.menu === 'efeito' ? null : 'efeito'; renderEditor(E); if (E.menu) { const b = document.querySelector('[data-ed="' + E.id + '"] .menu button:not(:disabled)'); if (b) b.focus(); } return;
    case 'addEfeito': {
      const t = el.dataset.v;
      E.menu = null; E.desfeito = null;
      if (t === 'dano') m.dano = DANO('Força + 20');
      else {
        const e = novoEfeito(t); m.efeitos.push(e);
        if (t === 'reviver') { m.alvo.estado = 'caido'; if (m.alvo.quem === 'inimigos') m.alvo.quem = 'aliados'; m.teste = { tipo: 'naoErra' }; avisar('Reviver: o alvo passou a ser quem caiu (0 de vida).'); }
      }
      renderEditor(E);
      const linhas = document.querySelectorAll('[data-ed="' + E.id + '"] .numeros .lin');
      const alvo = t === 'dano' ? document.querySelector('[data-ed="' + E.id + '"] [data-k="mec.dano.formula"]') : linhas.length ? linhas[linhas.length - 3] && linhas[linhas.length - 3].querySelector('input,select') : null;
      if (alvo) alvo.focus();
      if (E.aoTestarAberto) E.aoTestarAberto(E);
      return;
    }
    case 'tirarEfeito': {
      const i = Number(el.dataset.v); const antes = clone(m); const e = m.efeitos[i];
      m.efeitos.splice(i, 1); renderEditor(E);
      avisar('Saiu: ' + fraseDoEfeito(e, null), () => { E.mec = antes; renderEditor(E); if (E.aoTestarAberto) E.aoTestarAberto(E); });
      if (E.aoTestarAberto) E.aoTestarAberto(E);
      return;
    }
    case 'tirarDano': { const antes = clone(m); m.dano = null; m.efeitos = m.efeitos.filter((e) => e.tipo !== 'dreno'); renderEditor(E); avisar('O dano saiu.', () => { E.mec = antes; renderEditor(E); }); if (E.aoTestarAberto) E.aoTestarAberto(E); return; }
    case 'maisMod': { const e = m.efeitos[Number(el.dataset.v)]; if (e.mods.length < 3) e.mods.push({ alvo: 'Dano', delta: e.natureza === 'buff' ? 10 : -10 }); renderEditor(E); return; }
    case 'porVez': { const e = m.efeitos[Number(el.dataset.v)]; e.porTurno = { sinal: 'tira', quanto: 10 }; renderEditor(E); return; }
    case 'irAlvo': E.avancado = true; E.abertos.alvo = true; renderEditor(E); { const b = document.querySelector('[data-ed="' + E.id + '"] [data-bloco="alvo"]'); if (b) { b.scrollIntoView({ block: 'center', behavior: reduzMotion() ? 'auto' : 'smooth' }); const r = b.querySelector('input:checked'); if (r) r.focus({ preventScroll: true }); } } return;
    case 'temDano': m.dano = el.checked ? DANO('Força + 20') : null; if (!m.dano) m.efeitos = m.efeitos.filter((e) => e.tipo !== 'dreno'); renderEditor(E); return;
    case 'segundo': m.dano.segundo = el.checked ? { fracao: 50, perfurante: true } : null; renderEditor(E); return;
    case 'tecla': { const v = el.dataset.v; m.dano.formula = (m.dano.formula.trim() ? m.dano.formula.trim() + ' + ' : '') + v; renderEditor(E); return; }
    case 'atribReacao': { const r = m.reacao; const v = el.dataset.v; r.atributos = el.checked ? r.atributos.concat([v]) : r.atributos.filter((x) => x !== v); if (r.atributos.length === 0) r.atributos = [v]; renderEditor(E); return; }
    case 'valeContra': { const r = m.reacao; const v = el.dataset.v; r.valeContra = el.checked ? r.valeContra.concat([v]) : r.valeContra.filter((x) => x !== v); renderEditor(E); return; }
    case 'testar': if (E.aoTestar) E.aoTestar(E, el); return;
    default:
  }
}

/** O campo mudou: grava no estado (o número acima do teto é recusado com a frase certa, B19). */
function campoDoEditor(E, el, fim) {
  const k = el.dataset.k; const t = el.dataset.t;
  if (!k) return false;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  E.errosDigitados = E.errosDigitados || {};
  delete E.errosDigitados[k];
  if (t === 'int') {
    const limpo = String(v).replace('−', '-').replace('+', '').trim();
    const n = Number(limpo);
    const min = Number(el.dataset.min); const max = Number(el.dataset.max);
    if (limpo === '' || !Number.isInteger(n)) { E.errosDigitados[k] = 'Use um número inteiro.'; }
    else if (n < min || n > max) { E.errosDigitados[k] = 'Vai de ' + min + ' a ' + max + '.'; }
    else v = n;
    if (E.errosDigitados[k]) { el.setAttribute('aria-invalid', 'true'); if (fim) renderEditor(E); return false; }
    el.removeAttribute('aria-invalid');
  } else if (t === 'lista') v = String(v).split(',').map((s) => s.trim()).filter(Boolean);
  else if (t === 'bool') v = !!v;
  if (k === 'gasta' || k === 'onde') E[k] = v;
  else if (k === 'custoRecurso') E.mec.custo = v === 'nada' ? null : { recurso: v, quanto: E.mec.custo ? E.mec.custo.quanto : 30 };
  else if (k === 'testeTipo') E.mec.teste = v === 'resist' ? RESIST('Agilidade', 13, 'nada') : { tipo: v };
  else if (k === 'mec.uso') {
    E.mec.uso = v;
    if (v !== 'ativa' && !E.mec.reacao) E.mec.reacao = REACAO('fica', { porcento: 50 });
    if (v === 'reacao') { E.mec.acao = 'livre'; E.mec.alvo = Object.assign({}, ALVO_VAZIO, { quem: 'si' }); E.mec.dano = null; E.mec.teste = { tipo: 'naoErra' }; }
    if (v === 'ativa') E.mec.reacao = null;
    if (v === 'ativaOuReacao' && E.mec.acao === 'livre') E.mec.acao = 'completa';
  } else if (k.endsWith('.modo')) { setPath(E, k, v); const e = getPath(E, k.replace(/\.modo$/, '')); e.valor = v === 'porcento' ? 50 : v === 'cheio' ? 0 : '50'; }
  else if (k.endsWith('.quais')) { setPath(E, k, v); const e = getPath(E, k.replace(/\.quais$/, '')); if (v === 'nomes' && e.nomes.length === 0) e.nomes = ['Envenenado']; }
  else if (k === 'mec.alvo.estado' && v === 'caido' && !E.mec.efeitos.some((e) => e.tipo === 'reviver')) { setPath(E, k, v); avisar('Alvo caído: só o Reviver pega nele. Use "+ Efeito > Reviver".'); }
  else setPath(E, k, v);
  if (k === 'mec.alvo.quem' && v === 'si') E.mec.alvo.forma = 'um';
  /* o mesmo campo em "Os números" e no Avançado: os dois mostram o mesmo valor */
  const host = document.querySelector('[data-ed="' + E.id + '"]');
  if (host && el.type === 'text') host.querySelectorAll('[data-k="' + k + '"]').forEach((o) => { if (o !== el) o.value = el.value; });
  return true;
}

/* ---- teste.js ---- */
/* ==========================================================================
 * A MINIABA TESTE: Boneco de treino + o passo a passo (decisão M1).
 * Uma por lugar (biblioteca, ficha, item, livro de 262 px): TESTES[id].
 * ========================================================================== */
const TESTES = {};

function abrirTeste(id, oque, opts) {
  const T = novoTeste(oque);
  if (opts && opts.ficha) { T.usa = clone(opts.ficha); T.usa.selos = []; }
  ajustarParaMostrar(T);
  const X = Object.assign({ id, T, res: null, vez: null }, opts || {});
  TESTES[id] = X;
  X.res = ensaiar(T);
  return X;
}
function rodarTeste(id, animar, novoDado) {
  const X = TESTES[id]; if (!X) return;
  if (novoDado) X.T.semente = Math.floor(Math.random() * 1e9);
  X.res = ensaiar(X.T); X.vez = null;
  renderTeste(id, animar);
}

const fNumT = (k, v, rot, min, max) => '<input class="f-num f-num--p" type="text" inputmode="numeric" autocomplete="off" data-tk="' + k + '" data-min="' + min + '" data-max="' + max + '" value="' + esc(v) + '" aria-label="' + esc(rot) + '">';
function segT(id, k, v, opcoes, rot) {
  return '<div class="seg" role="radiogroup" aria-label="' + esc(rot) + '">' + opcoes.map((op) => '<label><input type="radio" name="' + id + '-' + k + '" value="' + esc(op[0]) + '" data-tk="' + k + '"' + (String(op[0]) === String(v) ? ' checked' : '') + '><span>' + esc(op[1]) + '</span></label>').join('') + '</div>';
}
const linhaT = (rot, corpo) => '<div class="teste__linha"><span class="rot">' + esc(rot) + '</span>' + corpo + '</div>';

function htmlBarra(de, para, max, cor, animar) {
  const s = (v) => (max === Infinity || max === 0 ? 1 : Math.max(0, Math.min(1, v / max)));
  return '<div class="barra" style="--c:' + cor + '"><i style="transform:scaleX(' + s(animar ? de : para) + ')" data-para="' + s(para) + '"></i></div>';
}
const BONECO_SVG = '<svg viewBox="0 0 44 56" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="22" cy="9" r="6" fill="currentColor" fill-opacity=".3"/><path d="M7 21h30" stroke-width="3"/><rect x="14" y="16" width="16" height="22" rx="6" fill="currentColor" fill-opacity=".3"/><path d="M16 23l12 7M28 23l-12 7" stroke-opacity=".55"/><path d="M22 38v13M14 53h16" stroke-width="2.4"/></svg>';

function htmlFigura(nome, de, para, extra, animar) {
  const caido = para.caido;
  return '<div class="boneco__um"' + (caido ? ' data-caido' : '') + (para.batido && animar ? ' data-batido' : '') + '>' +
    (extra.retrato ? '<span class="retrato">' + esc(extra.retrato) + '</span>' : BONECO_SVG) +

    '<span class="boneco__hp">' + [['HP', de.hp, para.hp, true], ['Escudo', de.escudo, para.escudo, para.escudo > 0 || de.escudo > 0], ['SP', de.sp, para.sp, !!extra.sp]].filter((x) => x[3])
      .map(([r, a, b]) => r + ' ' + (a !== b ? fmt(a) + ' → <b>' + fmt(b) + '</b>' : fmt(b))).join(', ') + '</span>' +
    '<div class="boneco__barras">' +
    htmlBarra(de.hp, para.hp, para.hpMax, 'var(--lb-color-ember)', animar) +

    (extra.sp ? htmlBarra(de.sp, para.sp, para.spMax, 'var(--lb-color-tide)', animar) : '') + '</div>' +

}

function htmlTeste(id, animar) {

  const reacaoModo = T.como === 'reacao';

  h += '<div class="teste__ctx">';
  h += '<div class="teste__quem"><span>' + (reacaoModo ? 'Quem reage' : 'Quem usa') + '</span><span><b>' + esc(T.usa.nome) + '</b> <span class="num">HP ' + fmt(T.usa.hp) + '/' + fmt(T.usa.hpMax) + ', SP ' + T.usa.sp + '/' + T.usa.spMax + '</span></span></div>';
  h += '<div class="teste__quem"><span>' + (reacaoModo ? 'Quem bate' : 'Alvo') + '</span><span><b>Boneco de treino</b>' + (nB > 1 ? ' ×' + nB : '') + ' <span class="num">HP ' + (b.infinito ? '∞' : b.hp + '/' + b.hpMax) + ', Escudo ' + b.escudo + ', mod +' + b.mod + '</span></span></div>';
  if (m.uso === 'ativaOuReacao') h += linhaT('Testar', segT(id, 'como', T.como, [['vez', 'Na vez'], ['reacao', 'Na reação']], 'Testar como'));
  if (reacaoModo) h += linhaT('O golpe', fNumT('golpe.dano', T.golpe.dano, 'Dano do golpe do boneco', 0, 9999) + segT(id, 'golpe.tipo', T.golpe.tipo, [['comum', 'Comum'], ['overload', 'Overload'], ['surpresa', 'Surpresa']], 'Tipo do golpe'));
  else if (m.dano && T.oque.tipo === 'hab') h += linhaT('Concentração', segT(id, 'carga', T.carga, [[0, '0'], [1, '1 ×1,5'], [2, '2 ×2'], [3, '3 ×3,5']], 'Concentração'));
  h += linhaT('Dado', segT(id, 'dado.modo', T.dado.modo, [['sorteado', 'Sorteado'], ['fixo', 'Fixo']], 'Dado') + (T.dado.modo === 'fixo' ? fNumT('dado.fixo', T.dado.fixo, 'Valor fixo do d20', 1, 20) : ''));
  if (T.oque.tipo === 'item') h += linhaT('Na pilha', fNumT('pilha', T.pilha, 'Quantos na pilha', 0, 99));
  if (T.auto.length) h += '<p class="teste__auto">' + esc(T.auto.join(' ')) + '</p>';

    linhaT('HP', fNumT('boneco.hp', b.hp, 'HP atual do boneco', 0, 99999) + '<span class="dica">de</span>' + fNumT('boneco.hpMax', b.hpMax, 'HP máximo do boneco', 1, 99999) + '<label><input type="checkbox" data-tk="boneco.infinito"' + (b.infinito ? ' checked' : '') + '> infinito</label>') +
    linhaT('Escudo', fNumT('boneco.escudo', b.escudo, 'Escudo do boneco', 0, 9999) + '<span class="rot" style="min-width:0">Mod</span>' + fNumT('boneco.mod', b.mod, 'Modificador do boneco na reação e nos testes', -10, 20)) +
    linhaT('Reage', segT(id, 'boneco.reage', b.reage, [['rola', 'Rola d20'], ['parado', 'Parado'], ['esquiva', 'Sempre esquiva'], ['falha', 'Sempre falha']], 'Como o boneco reage')) +
    linhaT('Começa com', '<span class="chips">' + ['Envenenado', 'Sangrando', 'Queimando', 'Cego', 'Atordoado'].map((c) => '<button type="button" class="chip" data-tact="cond" data-v="' + c + '" aria-pressed="' + b.condicoes.includes(c) + '">' + c + '</button>').join('') + '</span>') +
    linhaT('Caído', '<label><input type="checkbox" data-tk="boneco.caido"' + (b.caido ? ' checked' : '') + '> com 0 de vida (para reviver)</label>') +
    (ehArea(m.alvo) && !reacaoModo ? linhaT('Na área', fNumT('boneco.quantos', b.quantos, 'Quantos bonecos na área', 1, 6) + '<span class="dica">bonecos (1 a 6)</span>') : '') +
    linhaT('SP de ' + T.usa.nome, fNumT('usa.sp', T.usa.sp, 'SP atual da cópia', 0, T.usa.spMax) + '<span class="dica">para ver a recusa, ponha 0</span>') +
    '</div></details>';
  h += '</div>';

function renderTeste(id, animar) {
  const host = document.querySelector('[data-teste="' + id + '"]');
  if (!host) return;
  const X = TESTES[id];
  const ativo = document.activeElement;
  const foco = ativo && host.contains(ativo) ? (ativo.dataset.tk ? '[data-tk="' + ativo.dataset.tk + '"]' + (ativo.type === 'radio' ? '[value="' + ativo.value + '"]' : '') : ativo.dataset.tact ? '[data-tact="' + ativo.dataset.tact + '"]' + (ativo.dataset.v ? '[data-v="' + ativo.dataset.v + '"]' : '') : null) : null;
  const anim = animar && !reduzMotion();
  host.innerHTML = htmlTeste(id, anim);
  X.entrou = true;
  if (foco) { const el = host.querySelector(foco); if (el) el.focus({ preventScroll: true }); }
  if (!anim) return;
  /* os passos entram um atrás do outro (35 ms) e as barras andam do antes ao depois */
  requestAnimationFrame(() => requestAnimationFrame(() => {
    host.querySelectorAll('.passo').forEach((p) => p.setAttribute('data-visto', ''));
    host.querySelectorAll('.barra i[data-para]').forEach((i) => { i.style.transform = 'scaleX(' + i.dataset.para + ')'; });
  }));
  /* o d20 gira 240 ms antes de parar no número que saiu */
  if (X.T.dado.modo !== 'fixo') host.querySelectorAll('.d20[data-rola]').forEach((d) => {
    const fim = d.dataset.rola; let t = 0;
    const timer = setInterval(() => { t += 40; d.textContent = t >= 240 ? fim : String(1 + Math.floor(Math.random() * 20)); if (t >= 240) clearInterval(timer); }, 40);
  });
}

function acaoDoTeste(id, act, el) {
  const X = TESTES[id]; if (!X) return;
  const T = X.T;
  if (act === 'rodar') { rodarTeste(id, true, true); return; }
  if (act === 'fechar') { if (X.aoFechar) X.aoFechar(); return; }
  if (act === 'vez') { X.vez = passarUmaVez(X.res); renderTeste(id, true); return; }
  if (act === 'cond') { const c = el.dataset.v; const b = T.boneco; b.condicoes = b.condicoes.includes(c) ? b.condicoes.filter((x) => x !== c) : b.condicoes.concat([c]); X.ajustes = true; rodarTeste(id, false); return; }
  if (act === 'conserto') {
    const v = el.dataset.v;
    if (v === 'encherSp') T.usa.sp = T.usa.spMax;
    if (v === 'cair') { T.boneco.caido = true; T.boneco.hp = 0; }
    if (v === 'levantar') { T.boneco.caido = false; T.boneco.hp = T.boneco.hpMax; }
    if (v === 'pilha') T.pilha = 3;
    if (v === 'valeContra') { const r = T.oque.mec.reacao; if (!r.valeContra.includes(el.dataset.x)) r.valeContra.push(el.dataset.x); if (X.aoMudarMec) X.aoMudarMec(); }
    rodarTeste(id, true);
    const b = document.querySelector('[data-teste="' + id + '"] [data-tact="rodar"]'); if (b) b.focus();
  }
}
function campoDoTeste(id, el) {
  const X = TESTES[id]; if (!X) return;
  const k = el.dataset.tk; let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.type === 'text') {
    const n = Number(String(v).replace('−', '-').trim());
    const min = Number(el.dataset.min); const max = Number(el.dataset.max);
    if (String(v).trim() === '' || !Number.isInteger(n) || n < min || n > max) { el.setAttribute('aria-invalid', 'true'); el.title = 'Vai de ' + min + ' a ' + max + '.'; return; }
    v = n;
  }
  if (k === 'carga') v = Number(v);
  setPath(X.T, k, v);
  if (k === 'boneco.hp' && X.T.boneco.hp > X.T.boneco.hpMax) X.T.boneco.hpMax = X.T.boneco.hp;
  if (k === 'boneco.caido' && v) X.T.boneco.hp = 0;
  if (k === 'boneco.caido' && !v && X.T.boneco.hp === 0) X.T.boneco.hp = X.T.boneco.hpMax;
  if (k.startsWith('boneco.') || k === 'usa.sp') X.ajustes = true;
  rodarTeste(id, false);
}
/** O editor mudou com o teste aberto: roda de novo com o mesmo dado, sem animar. */
function testeSegueOEditor(id, E, nome) {
  const X = TESTES[id]; if (!X || !E.mec) return;
  X.T.oque.mec = E.mec; X.T.oque.gasta = E.gasta; X.T.oque.onde = E.onde; X.T.oque.nome = nome;
  if (E.mec.uso === 'reacao') X.T.como = 'reacao'; else if (E.mec.uso === 'ativa') X.T.como = 'vez';
  rodarTeste(id, false);
}

/* ---------------------------------------------------------------- avisos (o Desfazer) */
function avisar(texto, desfazer) {
  const box = document.getElementById('avisos');
  const el = document.createElement('div');
  el.className = 'aviso'; el.setAttribute('role', 'status');
  el.innerHTML = '<span>' + esc(texto) + '</span>' + (desfazer ? '<button type="button" class="bt bt--p">Desfazer</button>' : '');
  const sair = () => { if (!el.isConnected) return; el.setAttribute('data-saindo', ''); setTimeout(() => el.remove(), 160); };
  if (desfazer) el.querySelector('button').addEventListener('click', () => { desfazer(); sair(); });
  box.appendChild(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(sair, desfazer ? 6000 : 3800);
}

function passaNoFiltro(aba, e, f) {
  if (f === 'todos') return true;

  if (f === 'outros') return !['Arma', 'Consumível', 'Munição'].includes(e.categoria);

function textoDaEntrada(aba, e) {

function listaDaAba(aba) {
  const todas = aba === 'habilidades' ? HABILIDADES_DO_CATALOGO : ITENS_DO_CATALOGO;

function entradaDaBib(id) { return HABILIDADES_DO_CATALOGO.find((e) => e.id === id) || ITENS_DO_CATALOGO.find((e) => e.id === id); }
function testarNaBib(id) {
  if (S.bib.teste === id) { fecharTesteDaBib(); return; }
  const e = entradaDaBib(id);
  const ehItem = !!ITENS_DO_CATALOGO.find((x) => x.id === id);
  const jaAberto = !!S.bib.teste;
  abrirTeste('bib', ehItem ? { tipo: 'item', nome: e.nome, mec: clone(e.efeito.mec), gasta: e.efeito.gasta, onde: e.efeito.onde } : { tipo: 'hab', nome: e.nome, mec: clone(e.mec) }, { aoFechar: fecharTesteDaBib, abriu: id });
  S.bib.teste = id;
  if (jaAberto) TESTES.bib.entrou = true;
  renderLista();
