const TECS_DE_AIRA = ['H19', 'H20', 'H21', 'H18'];
function novoGolpe() {
  S.rea = { tipo: 'comum', dano: 90, atordoada: false, recarga: true, usa: { hp: 540, sp: 120, escudo: 0 }, mod: 3, fase: 'escolher', res: null, antes: null };
}
function motivoDaTec(m) {
  const R = S.rea; const r = m.mec.reacao;
  if (R.atordoada) return 'Atordoada: não reage, nem com técnica.';
  if (R.fase === 'rolou') return 'Já rolou o d20: depois do dado não troca.';
  if (R.fase !== 'escolher') return 'Uma técnica por golpe.';
  if (m.id === 'H18' && R.recarga) return 'Em recarga: volta em 2 vezes.';
  if (R.tipo !== 'comum' && !r.valeContra.includes(R.tipo)) return 'Não vale contra ' + (R.tipo === 'overload' ? 'Overload' : 'Surpresa') + '.';
  if (m.mec.custo && R.usa.sp < m.mec.custo.quanto) return 'SP insuficiente (tem ' + R.usa.sp + ', custa ' + m.mec.custo.quanto + ').';
  return '';
}
function previaDaTec(m) {
  const r = m.mec.reacao; const d = S.rea.dano; const f = FICHAS.aira;
  const extra = m.mec.efeitos.filter((e) => e.em === 'atacante').map((e) => '<b>' + esc(e.nome) + ' ' + e.duracao + '</b> em quem atacou').join('');

function acaoDaReacao(act, el) {

  const tomar = (dano) => { const u = R.usa; const e0 = u.escudo; const h0 = u.hp; const noE = Math.min(u.escudo, dano); u.escudo -= noE; u.hp = Math.max(0, u.hp - (dano - noE)); return dePara('HP', h0, u.hp) + (e0 ? ' ' + dePara('Escudo', e0, u.escudo) : ''); };

const editorDe = (el) => { const h = el.closest('[data-ed]'); return h ? EDITORES[h.dataset.ed] : null; };

function inteiroDe(el, min, max) {
  const limpo = String(el.value).replace('−', '-').replace('+', '').trim();
  const n = Number(limpo);
  if (limpo === '' || !Number.isInteger(n) || n < min || n > max) { el.setAttribute('aria-invalid', 'true'); el.title = 'Use um número inteiro de ' + min + ' a ' + max + '.'; return null; }
  el.removeAttribute('aria-invalid'); el.removeAttribute('title');
  return n;
}
function atualizarPreviewDoItem() { if (S.item && S.item.lado === 'preview') { const p = $('#j-lado'); if (p) p.innerHTML = htmlPreviewDoItem(); } }

    return;
  }
  const ta = t.closest('[data-tact]'); if (ta) { const id = testeDe(ta); if (id) acaoDoTeste(id, ta.dataset.tact, ta); return; }
  const mu = t.closest('.mu-marcador'); if (mu) { trocarAba(mu.dataset.mu, true); return; }
  const ba = t.closest('[data-bact]');
  if (ba) {
    const act = ba.dataset.bact; const v = ba.dataset.v; const aba = S.bib.aba;
    const opener = '[data-bact="' + act + '"]' + (v ? '[data-v="' + v + '"]' : '');

    if (act === 'novo') { if (aba === 'habilidades') abrirJanelaHab('catalogo', null, opener); else abrirJanelaItem(null, opener); }
    if (act === 'editar' || act === 'sugerir') {
      const e = entradaDaBib(v);

      else abrirJanelaItem(e, opener, act === 'sugerir' ? e.sugere : null);
    }
    return;
  }
  const ja = t.closest('[data-jact]');
  if (ja) {
    const act = ja.dataset.jact;
    if (act === 'cancelar') fecharJanela();
    if (act === 'salvar') salvarJanela();
    if (act === 'testarLido') {
      const e = HABILIDADES_DO_CATALOGO.find((x) => x.id === ja.dataset.v);
      abrirTeste('hab', { tipo: 'hab', nome: e.nome, mec: clone(e.mec) }, { aoFechar: () => fecharTesteDaJanela('hab'), ligado: false, ficha: FICHAS.aira });
      if (S.hab.lado === 'teste') TESTES.hab.entrou = true;
      S.hab.lado = 'teste'; $('#j-lado').innerHTML = '<div data-teste="hab"></div>'; $('#j-lado').scrollTop = 0;
      renderTeste('hab', true);
      const b = $('[data-teste="hab"] [data-tact="rodar"]'); if (b) b.focus({ preventScroll: true });
    }
    return;
  }
  const ra = t.closest('[data-ract]'); if (ra) { acaoDaReacao(ra.dataset.ract, ra); return; }
  const la = t.closest('[data-lact]'); if (la) { testarNo262(la.dataset.v); return; }
});

/* ---------------------------------------------------------------- teclado */
function fecharCamadaDeCima(t) {
  for (const X of Object.values(EDITORES)) {
    if (X.menu) { X.menu = null; renderEditor(X); const b = $('[data-ed="' + X.id + '"] [data-act="menuEfeito"]'); if (b) b.focus(); return true; }
  }
  if (S.tela === 'livro262' && S.l262.teste && !S.janela) { fecharTesteDo262(); return true; }
  if (S.janela) {
    const id = testeDe(t);
    if (id && TESTES[id]) fecharTesteDaJanela(id); else fecharJanela();
    return true;
  }
  if (S.tela === 'biblioteca' && S.bib.teste) { fecharTesteDaBib(); return true; }
  return false;
}
const FOCAVEIS = 'button:not([disabled]), input:not([disabled]):not([type="radio"]), input[type="radio"]:checked:not([disabled]), select:not([disabled]), summary, [tabindex]:not([tabindex="-1"])';

document.addEventListener('keydown', (ev) => {
  const t = ev.target;
  if (ev.key === 'Escape') {
    if (t.type === 'search' && t.value) { t.value = ''; t.dispatchEvent(new Event('input', { bubbles: true })); ev.preventDefault(); return; }
    if (fecharCamadaDeCima(t)) ev.preventDefault();
    return;
  }
  if (ev.key === '/' && !ehCampo(t) && !S.janela) {
    const b = S.tela === 'livro262' ? $('#l262-busca') : S.tela === 'biblioteca' ? $('#busca') : null;
    if (b) { ev.preventDefault(); b.focus(); b.select(); }
    return;
  }
  /* marcadores do livro: setas andam entre os que estão neste protótipo */
  if (t.classList && t.classList.contains('mu-marcador') && ['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(ev.key)) {
    ev.preventDefault();
    const i = ATIVOS.indexOf(S.bib.aba);
    const j = ev.key === 'Home' ? 0 : ev.key === 'End' ? ATIVOS.length - 1 : (i + (ev.key === 'ArrowDown' ? 1 : -1) + ATIVOS.length) % ATIVOS.length;
    trocarAba(ATIVOS[j], true, true);
    return;
  }
  /* menu "+ Efeito": setas entre as opções que valem */
  const menu = t.closest && t.closest('.menu');
  if (menu && ['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(ev.key)) {
    ev.preventDefault();
    const itens = [...menu.querySelectorAll('[role="menuitem"]:not([disabled])')];
    const i = itens.indexOf(t);
    const j = ev.key === 'Home' ? 0 : ev.key === 'End' ? itens.length - 1 : (i + (ev.key === 'ArrowDown' ? 1 : -1) + itens.length) % itens.length;
    if (itens[j]) itens[j].focus();
    return;
  }
  /* janela: o Tab dá a volta dentro dela */
  if (ev.key === 'Tab' && S.janela) {
    const j = $('.janela'); if (!j) return;
    const lista = [...j.querySelectorAll(FOCAVEIS)].filter((x) => x.offsetParent !== null || x.tagName === 'SUMMARY');
    if (lista.length === 0) return;
    const pri = lista[0]; const ult = lista[lista.length - 1];
    if (!j.contains(t)) { ev.preventDefault(); pri.focus(); return; }
    if (ev.shiftKey && t === pri) { ev.preventDefault(); ult.focus(); }
    else if (!ev.shiftKey && t === ult) { ev.preventDefault(); pri.focus(); }
  }
});

/* o "Ajustar o boneco" lembra se ficou aberto */
document.addEventListener('toggle', (ev) => {
  const d = ev.target; if (!d.matches || !d.matches('[data-tajustes]')) return;
  const id = testeDe(d); if (id && TESTES[id]) TESTES[id].ajustes = d.open;
}, true);

window.addEventListener('resize', () => posicionarFita(false));

/* ---------------------------------------------------------------- começo */
document.body.insertAdjacentHTML('beforeend', LISTA_CONDICOES);
{
  const telas = ['biblioteca', 'ficha', 'item', 'reacao', 'livro262'];
  const h = location.hash.slice(1);
  irPara(telas.includes(h) ? h : 'biblioteca');
  document.querySelectorAll('.proto__tela[data-v]').forEach((b) => b.addEventListener('click', () => history.replaceState(null, '', '#' + b.dataset.v)));
}
