<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de habilidade: protótipo para aprovar</title>
<style>
/*
 * EDITOR DE HABILIDADE, protótipo de 23/11/2026 (pedido do dono de 23/11: categorias de
 * Ataque, tipo do golpe, alcance; e "o protótipo é tudo isso": o cartão inteiro).
 * Arquivo único, sem nada de fora. Tokens: cópia dos --lb-* do app (client/src/theme.ts) e
 * dos --bt-* da batalha (components/batalha/combate.css), como o protótipo dos requisitos.
 * As cores das casas do alcance são as de lib/batalha/alcance/cores.ts. O app só tem tema escuro.
 */
:root {
  --lb-color-ink: #121214;
  --lb-color-stone-solid: #1a1a1e;
  --lb-color-stone-raised: #232328;
  --lb-color-stone-hover: #2c2c33;
  --lb-color-stone-sunken: #141417;
  --lb-color-line: rgba(255, 255, 255, 0.08);
  --lb-color-line-strong: rgba(255, 255, 255, 0.16);
  --lb-color-parchment: #eceae4;
  --lb-color-parchment-dim: #a2a09a;
  --lb-color-parchment-faint: #858480;
  --lb-color-brass: #e0a44a;
  --lb-color-brass-bright: #f3ba66;
  --lb-color-brass-soft: rgba(224, 164, 74, 0.14);
  --lb-color-brass-contrast: #1c1608;
  --lb-color-ember: #e2645a;
  --lb-color-ember-soft: rgba(226, 100, 90, 0.14);
  --lb-color-online: #7fb48a;
  --lb-color-online-soft: rgba(127, 180, 138, 0.14);
  --lb-color-tide: #79a9cc;
  --lb-color-tide-soft: rgba(121, 169, 204, 0.14);
  --lb-color-arcane: #ab93d6;
  --lb-color-arcane-soft: rgba(171, 147, 214, 0.15);
  --lb-font-display: 'Sitka Banner', 'Sitka Display', Sitka, Constantia, Georgia, 'Times New Roman', serif;
  --lb-font-sans: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
  --lb-font-utility: 'Bahnschrift', 'DIN Alternate', 'Segoe UI Variable Small', 'Segoe UI', system-ui, sans-serif;
  --lb-font-size-xs: 10.5px;
  --lb-font-size-sm: 11.5px;
  --lb-font-size-md: 13px;
  --lb-font-size-lg: 15px;
  --lb-font-size-xl: 20px;
  --lb-font-tracking-wide: 0.06em;
  --lb-font-tracking-wider: 0.14em;
  --lb-radius-sm: 6px;
  --lb-radius-md: 9px;
  --lb-radius-lg: 14px;
  --lb-radius-full: 999px;
  --lb-shadow-lg: 0 18px 44px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.34);
  --lb-shadow-float: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 14px rgba(0, 0, 0, 0.44), 0 20px 46px rgba(0, 0, 0, 0.55);
  --lb-shadow-focus: 0 0 0 2px var(--lb-color-stone-solid), 0 0 0 4px var(--lb-color-brass);
  --lb-shadow-bevel: inset 0 1px 0 rgba(255, 255, 255, 0.07);
  --lb-motion-fast: 110ms;
  --lb-motion-base: 170ms;
  --lb-gr-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --lb-gr-cartao: #211c15;
  --lb-gr-cartao-alto: #29231a;
  --lb-gr-campo: #15120e;
  --lb-gr-filete: rgba(236, 234, 228, 0.09);
  --lb-gr-filete-forte: rgba(236, 234, 228, 0.16);
  --lb-gr-filete-latao: rgba(224, 164, 74, 0.26);
  --lb-gr-gravado: #c8b089;
  --lb-gr-latao-1: #f6cb84;
  --lb-gr-latao-2: #e0a44a;
  --lb-gr-hover: rgba(255, 236, 200, 0.06);
  --lb-gr-hover-forte: rgba(255, 236, 200, 0.1);
  --bt-papel: var(--lb-color-parchment);
  --bt-titulo: 'Bahnschrift Condensed', 'Bahnschrift', var(--lb-font-utility);
  --bt-rasgo-caixa: polygon(0 3px, 6% 0, 13% 4px, 21% 1px, 28% 3px, 37% 0, 45% 4px, 52% 1px, 60% 3px, 68% 0, 76% 4px, 84% 1px, 92% 3px, 100% 0, calc(100% - 3px) 30%, 100% 60%, calc(100% - 2px) 100%, 92% calc(100% - 3px), 84% 100%, 76% calc(100% - 4px), 68% calc(100% - 1px), 60% calc(100% - 3px), 52% 100%, 45% calc(100% - 4px), 37% calc(100% - 1px), 28% calc(100% - 3px), 21% 100%, 13% calc(100% - 4px), 6% calc(100% - 1px), 0 calc(100% - 3px), 2px 60%, 0 30%);
  /* as tintas sobre o papel (combate.css #8a2c22 e #5d5a54, o verde de "cumpriu"), mais o roxo e o azul do protótipo aprovado */
  --papel-tinta: #26221c;
  --papel-dano: #8a2c22;
  --papel-cura: #2d6a3e;
  --papel-selo: #5a3f8c;
  --papel-custo: #2c5578;
  --papel-tenue: #5d5a54;
  --mu-erro-texto: #f0897f;
  --barra: 46px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--lb-font-sans); font-size: var(--lb-font-size-md); line-height: 1.45;
  color: var(--lb-color-parchment); background: var(--lb-color-ink); overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
[aria-disabled='true'], button:disabled { cursor: not-allowed; }
h1, h2, h3, h4, p, ul, ol, dl, dd, fieldset, legend { margin: 0; padding: 0; border: 0; }
ul, ol { list-style: none; }
:focus-visible { outline: none; box-shadow: var(--lb-shadow-focus); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-family: var(--lb-font-utility); font-variant-numeric: tabular-nums; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ------------------------------------------------------------ barra do protótipo (não é do app) */
.proto {
  height: var(--barra); display: flex; align-items: center; gap: 10px; padding: 0 14px;
  background: #0c0c0e; border-bottom: 1px dashed var(--lb-gr-filete-forte);
  font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); white-space: nowrap; overflow-x: auto; scrollbar-width: thin;
}
.proto strong { color: var(--lb-color-parchment); font-weight: 600; }
.proto__telas { display: flex; gap: 4px; }
.proto__tela {
  min-height: 28px; padding: 0 10px; border-radius: var(--lb-radius-full); border: 1px solid var(--lb-gr-filete-forte);
  color: var(--lb-color-parchment-dim);
  transition: background-color var(--lb-motion-fast) ease, border-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-gr-ease-out);
}
.proto__tela:active { transform: scale(0.97); }
.proto__tela[aria-pressed='true'] { background: var(--lb-color-brass-soft); border-color: var(--lb-gr-filete-latao); color: var(--lb-color-parchment); }
.proto__sobra { margin-left: auto; display: flex; align-items: center; gap: 10px; }

/* ------------------------------------------------------------ primitivos */
.bt {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 0 12px;
  border-radius: var(--lb-radius-sm); background: var(--lb-gr-cartao-alto); color: var(--lb-color-parchment);
  border: 1px solid var(--lb-gr-filete-forte); font-weight: 500; white-space: nowrap;
  transition: background-color var(--lb-motion-fast) ease, border-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-gr-ease-out), opacity var(--lb-motion-fast) ease;
}
.bt:active:not([aria-disabled='true']) { transform: scale(0.97); }
.bt[aria-disabled='true'] { opacity: 0.45; }
.bt--latao { background: transparent; border-color: var(--lb-gr-filete-latao); color: var(--lb-color-brass-bright); }
.bt--fantasma { background: transparent; border-color: transparent; color: var(--lb-color-parchment-dim); }
.bt--primario { background: linear-gradient(180deg, var(--lb-gr-latao-1), var(--lb-gr-latao-2)); border-color: rgba(0, 0, 0, 0.35); color: var(--lb-color-brass-contrast); font-weight: 600; box-shadow: var(--lb-shadow-bevel); }
.bt--p { min-height: 28px; padding: 0 9px; font-size: var(--lb-font-size-sm); }
.bt--ic { width: 28px; min-height: 28px; padding: 0; background: transparent; border-color: transparent; color: var(--lb-color-parchment-faint); }
.bt .ic { width: 15px; height: 15px; }
@media (hover: hover) and (pointer: fine) {
  .bt:hover:not([aria-disabled='true']) { border-color: var(--lb-gr-filete-latao); }
  .bt--fantasma:hover:not([aria-disabled='true']), .bt--ic:hover { background: var(--lb-gr-hover); border-color: transparent; color: var(--lb-color-parchment); }
  .proto__tela:hover { color: var(--lb-color-parchment); }
}
.etq {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: var(--lb-radius-full);
  font: 500 var(--lb-font-size-xs) / 1.6 var(--lb-font-utility); letter-spacing: var(--lb-font-tracking-wide); white-space: nowrap;
  background: var(--lb-gr-hover-forte); color: var(--lb-gr-gravado);
}
.etq[data-c='auto'] { background: var(--lb-color-online-soft); color: var(--lb-color-online); }
.etq[data-c='pergunta'] { background: var(--lb-color-tide-soft); color: var(--lb-color-tide); }
.etq[data-c='caixa'] { background: var(--lb-color-arcane-soft); color: var(--lb-color-arcane); }
.etq[data-c='novo'] { background: var(--lb-color-arcane-soft); color: var(--lb-color-arcane); }
.etq[data-c='mao'] { background: var(--lb-color-brass-soft); color: var(--lb-color-brass-bright); }
.entrada {
  width: 100%; min-height: 32px; padding: 5px 9px; border-radius: var(--lb-radius-sm);
  background: var(--lb-gr-campo); border: 1px solid var(--lb-gr-filete-forte); color: var(--lb-color-parchment);
  transition: border-color var(--lb-motion-fast) ease;
}
.entrada:focus-visible { border-color: var(--lb-color-brass); box-shadow: none; outline: none; }
.entrada[aria-invalid='true'] { border-color: var(--lb-color-ember); }
textarea.entrada { resize: vertical; min-height: 54px; line-height: 1.5; }
select.entrada { width: auto; padding-right: 24px; }
.entrada--nome { font-family: var(--lb-font-display); font-size: 21px; min-height: 42px; padding: 5px 11px; }
.dica { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.link { color: var(--lb-color-brass-bright); text-decoration: underline; text-decoration-color: var(--lb-gr-filete-latao); text-underline-offset: 3px; border-radius: 3px; font-size: var(--lb-font-size-sm); }
@media (hover: hover) and (pointer: fine) { .link:hover { text-decoration-color: currentColor; } }
.erro { font-size: var(--lb-font-size-sm); color: var(--mu-erro-texto); }

/* o número com − e + */
.np { display: inline-flex; align-items: stretch; height: 28px; border: 1px solid var(--lb-gr-filete-forte); border-radius: var(--lb-radius-sm); background: var(--lb-gr-campo); vertical-align: middle; }
.np__b { width: 24px; color: var(--lb-color-parchment-dim); font-size: 14px; line-height: 1; transition: color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-gr-ease-out); }
.np__b:active { transform: scale(0.9); }
.np__i { width: 4.2ch; min-width: 0; padding: 0 2px; text-align: center; background: transparent; border: 0; border-left: 1px solid var(--lb-gr-filete); border-right: 1px solid var(--lb-gr-filete); color: var(--lb-color-parchment); font-size: var(--lb-font-size-md); }
.np__i:focus-visible { box-shadow: inset 0 0 0 1px var(--lb-color-brass); }
@media (hover: hover) and (pointer: fine) { .np__b:hover { color: var(--lb-color-parchment); } }

/* segmentado (radiogroup) */
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border-radius: var(--lb-radius-sm); background: var(--lb-gr-campo); border: 1px solid var(--lb-gr-filete); }
.seg__o {
  min-height: 26px; padding: 0 10px; border-radius: 4px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim);
  transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-gr-ease-out);
}
.seg__o:active:not([aria-disabled='true']) { transform: scale(0.97); }
.seg__o[aria-checked='true'] { background: var(--lb-gr-cartao-alto); color: var(--lb-color-brass-bright); box-shadow: inset 0 0 0 1px var(--lb-gr-filete-latao); }
.seg__o[aria-disabled='true'] { opacity: 0.4; }
@media (hover: hover) and (pointer: fine) { .seg__o:hover:not([aria-checked='true']):not([aria-disabled='true']) { color: var(--lb-color-parchment); background: var(--lb-gr-hover); } }

/* caixa de marcar */
.marca { display: inline-flex; align-items: center; gap: 8px; min-height: 28px; cursor: pointer; }
.marca input { width: 16px; height: 16px; margin: 0; accent-color: var(--lb-color-brass); }

/* ------------------------------------------------------------ a moldura (janela da ficha) */
.palco { height: calc(100% - var(--barra)); padding: 16px; display: flex; justify-content: center; background: radial-gradient(1200px 600px at 50% -10%, #1b1a1f 0%, var(--lb-color-ink) 70%); }
.janela {
  width: 100%; max-width: 1400px; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr);
  background: var(--lb-color-stone-solid); border: 1px solid var(--lb-color-line-strong); border-radius: var(--lb-radius-lg);
  box-shadow: var(--lb-shadow-lg); overflow: hidden; position: relative;
}
.janela__cab { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--lb-gr-filete); }
.janela__tit { font-family: var(--lb-font-display); font-size: var(--lb-font-size-xl); font-weight: 400; white-space: nowrap; }
.trilha { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.janela__acoes { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.corpo { display: grid; grid-template-columns: minmax(0, 1fr) 440px; min-height: 0; }
.editor { overflow-y: auto; min-height: 0; padding: 18px 22px 80px; scrollbar-width: thin; scroll-behavior: smooth; }
.ver { overflow-y: auto; min-height: 0; border-left: 1px solid var(--lb-gr-filete); background: var(--lb-color-stone-sunken); padding: 16px 18px 60px; scrollbar-width: thin; }
@media (max-width: 1080px) {
  body { overflow: auto; }
  .palco { height: auto; }
  .janela { height: auto; }
  .corpo { grid-template-columns: minmax(0, 1fr); }
  .editor, .ver { overflow: visible; }
  .ver { border-left: 0; border-top: 1px solid var(--lb-gr-filete); }
}
@media (prefers-reduced-motion: reduce) { .editor { scroll-behavior: auto; } }

/* abas da versão (comum / evoluída) */
.abas { display: flex; gap: 2px; margin-bottom: 12px; border-bottom: 1px solid var(--lb-gr-filete); }
.aba { position: relative; min-height: 34px; padding: 0 12px; color: var(--lb-color-parchment-dim); font-size: var(--lb-font-size-md); }
.aba[aria-selected='true'] { color: var(--lb-color-parchment); }
.aba[aria-selected='true']::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--lb-color-brass); }
.aba .etq { margin-left: 6px; }
@media (hover: hover) and (pointer: fine) { .aba:hover { color: var(--lb-color-parchment); } }

/* o topo do cartão: nome e descrição */
.topo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: end; padding-bottom: 16px; }
.topo__campo { display: grid; gap: 5px; }
.topo__campo > label, .rot { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }
.topo__desc { grid-column: 1 / -1; }
.aviso-evo { grid-column: 1 / -1; display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: var(--lb-radius-md); background: var(--lb-color-arcane-soft); color: var(--lb-color-parchment); font-size: var(--lb-font-size-sm); }

/* ------------------------------------------------------------ as dimensões */
.dim { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 10px 18px; padding: 16px 0; border-top: 1px solid var(--lb-gr-filete); position: relative; scroll-margin-top: 8px; }
.dim__cab { display: grid; align-content: start; gap: 2px; }
.dim__nome { font-family: var(--lb-font-display); font-size: 17px; font-weight: 400; line-height: 1.2; }
.dim__dica { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.dim__corpo { display: grid; gap: 10px; min-width: 0; }
.dim__vazio { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.dim__brilho { position: absolute; inset: 4px -10px; border-radius: var(--lb-radius-md); background: var(--lb-color-brass-soft); pointer-events: none; }
.linha { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.linha > .rot { min-width: 0; }
.frase-ed { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: var(--lb-font-size-md); color: var(--lb-color-parchment); }
.frase-ed .entrada { width: auto; }

/* Ação: os 6 cartões em dois grupos */
.acoes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.acoes__grupo { grid-column: 1 / -1; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); margin-top: 4px; }
.acoes__grupo:first-child { margin-top: 0; }
.opc {
  display: grid; gap: 2px; align-content: start; text-align: left; min-height: 58px; padding: 9px 11px; border-radius: var(--lb-radius-md);
  background: var(--lb-color-stone-raised); border: 1px solid var(--lb-color-line);
  transition: border-color var(--lb-motion-fast) ease, background-color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-gr-ease-out);
}
.opc:active { transform: scale(0.98); }
.opc__n { font-weight: 600; font-size: var(--lb-font-size-md); color: var(--lb-color-parchment); }
.opc__d { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); line-height: 1.35; }
.opc[aria-checked='true'] { border-color: var(--lb-color-brass); background: var(--lb-color-brass-soft); }
.opc[data-sobre='true'] { border-color: var(--lb-color-arcane); }
.opc[data-sobre='true'][aria-checked='true'] { background: var(--lb-color-arcane-soft); }
@media (hover: hover) and (pointer: fine) { .opc:hover:not([aria-checked='true']) { border-color: var(--lb-color-line-strong); background: var(--lb-color-stone-hover); } }
.mais-acao { justify-self: start; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); text-decoration: underline; text-decoration-color: var(--lb-gr-filete-forte); text-underline-offset: 3px; min-height: 24px; }

/* Golpe: os tipos */
.tipos { display: flex; flex-wrap: wrap; gap: 6px; }
.tipo {
  display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 12px 0 9px; border-radius: var(--lb-radius-full);
  background: var(--lb-color-stone-raised); border: 1px solid var(--lb-color-line); color: var(--lb-color-parchment-dim); font-size: var(--lb-font-size-md);
  transition: border-color var(--lb-motion-fast) ease, background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-gr-ease-out);
}
.tipo:active:not([aria-disabled='true']) { transform: scale(0.97); }
.tipo .ic { width: 17px; height: 17px; color: var(--cor, currentColor); }
.tipo[aria-pressed='true'], .tipo[aria-checked='true'] { color: var(--lb-color-parchment); border-color: var(--cor, var(--lb-color-brass)); background: color-mix(in srgb, var(--cor, var(--lb-color-brass)) 14%, transparent); }
.tipo[aria-disabled='true'] { opacity: 0.4; }
@media (hover: hover) and (pointer: fine) { .tipo:hover:not([aria-pressed='true']):not([aria-checked='true']):not([aria-disabled='true']) { border-color: var(--lb-color-line-strong); color: var(--lb-color-parchment); } }
.regras { display: grid; gap: 6px; }
.regra { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; padding: 10px 12px; border-radius: var(--lb-radius-md); background: var(--lb-gr-cartao); border: 1px solid var(--lb-gr-filete); }
.regra > .ic { margin-top: 3px; color: var(--cor); width: 18px; height: 18px; }
.regra__tit { font-weight: 600; }
.regra__faz { grid-column: 2 / 3; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; color: var(--lb-color-parchment-dim); }
.regra__faz b { color: var(--lb-color-parchment); font-weight: 600; }
.regra__quando { grid-column: 2 / 4; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.regra__lado { grid-row: 1; grid-column: 3; display: flex; gap: 4px; align-items: center; }

/* Alcance: as formas (o seletor aprovado, lb-alc__forma) */
.formas { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; max-width: 560px; }
.forma {

'use strict';
/* ============================================================ utilidades */
const $ = (s, r = document) => r.querySelector(s);

const ATRIBUTOS = ['Força', 'Agilidade', 'Percepção', 'Resistência', 'Intuição', 'Espírito', 'Carisma', 'Determinação'];

const REACAO_METADE = 10;

];
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const DIR_NOME = ['para cima', 'para a direita', 'para baixo', 'para a esquerda'];
const LADO = 13;
const MEIO = 6;
const cheb = (ax, ay, bx, by) => Math.max(Math.abs(ax - bx), Math.abs(ay - by));
const temDirecao = (f) => f === 'linha' || f === 'frente' || f === 'leque';

/** As casas acesas (area) e as casas onde a mira pode ir (alcance), como o Testar do app. */
function celulas(al, dir, ponto, alvoFicha) {
  const area = new Set();
  const alcance = new Set();
  const k = (x, y) => `${x},${y}`;
  const [dx, dy] = DIRS[dir];
  const n = al.n;
  const dentro = (x, y) => x >= 0 && y >= 0 && x < LADO && y < LADO;
  const varre = (fn) => { for (let y = 0; y < LADO; y++) for (let x = 0; x < LADO; x++) fn(x, y); };
  let centro = null;
  switch (al.forma) {
    case 'alvo': varre((x, y) => { const d = cheb(x, y, MEIO, MEIO); if (d >= 1 && (al.semLimite || d <= n)) alcance.add(k(x, y)); }); break;
    case 'anel': varre((x, y) => { const d = cheb(x, y, MEIO, MEIO); if (d >= al.min && d <= n) alcance.add(k(x, y)); }); break;
    case 'linha': for (let i = 1; i <= n; i++) { const x = MEIO + dx * i, y = MEIO + dy * i; if (dentro(x, y)) area.add(k(x, y)); } break;
    case 'volta': varre((x, y) => { const d = cheb(x, y, MEIO, MEIO); if (d >= 1 && d <= n) area.add(k(x, y)); }); break;
    case 'frente': { const meia = Math.floor((n - 1) / 2); for (let i = 1; i <= n; i++) for (let j = -meia; j <= n - 1 - meia; j++) { const x = MEIO + dx * i + dy * j * -1, y = MEIO + dy * i + dx * j; if (dentro(x, y)) area.add(k(x, y)); } break; }
    case 'cruz': for (const [ax, ay] of DIRS) for (let i = 1; i <= n; i++) { const x = MEIO + ax * i, y = MEIO + ay * i; if (dentro(x, y)) area.add(k(x, y)); } break;
    case 'leque': for (let i = 1; i <= n; i++) for (let j = -(i - 1); j <= i - 1; j++) { const x = MEIO + dx * i - dy * j, y = MEIO + dy * i + dx * j; if (dentro(x, y)) area.add(k(x, y)); } break;
    case 'ponto': {
      varre((x, y) => { if (cheb(x, y, MEIO, MEIO) <= n) alcance.add(k(x, y)); });
      centro = ponto;
      varre((x, y) => { if (cheb(x, y, centro.x, centro.y) <= al.raio) area.add(k(x, y)); });
      break;
    }
    case 'ficha': {
      varre((x, y) => { const d = cheb(x, y, MEIO, MEIO); if (d >= 1 && d <= n) alcance.add(k(x, y)); });
      if (alvoFicha && alcance.has(k(alvoFicha.x, alvoFicha.y))) { centro = alvoFicha; varre((x, y) => { if (cheb(x, y, centro.x, centro.y) <= al.raio) area.add(k(x, y)); }); }
      break;
    }
    case 'si': area.add(k(MEIO, MEIO)); break;
  }
  return { area, alcance, centro };
}

/* ============================================================ o dano: a fórmula */
const PALAVRAS_SOLTAS = new Set(['de', 'do', 'da', 'e', 'dano', 'base', 'fogo', 'raio', 'gelo', 'veneno']);
const ATR_POR_NOME = Object.fromEntries(ATRIBUTOS.map((a) => [norm(a), a]));
/** Lê "Espírito + 15 + 20" com os números da ficha. Nunca usa eval. */
function calcular(formula, ficha) {
  const texto = norm(formula).replace(/dano da arma/g, ' @arma ').replace(/×/g, '*').replace(/÷/g, '/').replace(/x(?=\s*\d)/g, '*');
  if (texto.trim() === '') return { ok: false, vazio: true };
  const toks = [];
  const conta = [];
  const re = /\s*(@arma|\d+(?:[.,]\d+)?|[a-z]+|[-+*/()])/gy;
  let m;
  let pos = 0;
  while (pos < texto.length) {
    re.lastIndex = pos;
    m = re.exec(texto);
    if (!m) { if (texto.slice(pos).trim() === '') break; return { ok: false, erro: `Não entendi "${texto.slice(pos).trim().slice(0, 12)}". Use os botões abaixo.` }; }
    pos = re.lastIndex;
    const t = m[1];
    if (t === '@arma') { const v = ficha.arma ? ficha.arma.dano : 0; toks.push({ n: v }); conta.push(`Arma ${v}`); }
    else if (/^\d/.test(t)) { const v = Number(t.replace(',', '.')); toks.push({ n: v }); conta.push(String(v).replace('.', ',')); }
    else if (/^[a-z]+$/.test(t)) {
      if (ATR_POR_NOME[t]) { const nome = ATR_POR_NOME[t]; const v = ficha.atr[nome] || 0; toks.push({ n: v }); conta.push(`${nome} ${v}`); }
      else if (PALAVRAS_SOLTAS.has(t)) continue;
      else return { ok: false, erro: `"${t}" não é um atributo desta ficha. Use os botões abaixo.` };
    } else { toks.push({ op: t }); conta.push(t === '*' ? '×' : t === '/' ? '÷' : t); }
  }
  let i = 0;
  const olha = () => toks[i];
  function expr() { let v = termo(); while (olha() && (olha().op === '+' || olha().op === '-')) { const op = toks[i++].op; const d = termo(); v = op === '+' ? v + d : v - d; } return v; }
  function termo() { let v = fator(); while (olha() && (olha().op === '*' || olha().op === '/')) { const op = toks[i++].op; const d = fator(); if (op === '/' && d === 0) throw new Error('Divisão por zero.'); v = op === '*' ? v * d : v / d; } return v; }
  function fator() {
    const t = toks[i++];
    if (!t) throw new Error('A conta termina num sinal. Complete com um número ou atributo.');
    if (t.n !== undefined) return t.n;
    if (t.op === '-') return -fator();
    if (t.op === '(') { const v = expr(); if (!olha() || olha().op !== ')') throw new Error('Falta fechar o parêntese.'); i++; return v; }
    throw new Error(`Sinal "${t.op}" fora do lugar.`);
  }
  try {
    const v = expr();
    if (i < toks.length) throw new Error('Sobrou algo no fim da conta.');
    return { ok: true, valor: Math.max(0, Math.round(v)), conta: conta.join(' ').replace(/\( /g, '(').replace(/ \)/g, ')') };
  } catch (e) { return { ok: false, erro: e.message }; }
}

function nomeDoUso(h) {

  if (h.uso === 'reacao') return h.acao === 'osDois' ? 'Reação ou na vez' : 'Reação';

}
function tipoNaBatalha(h) {
  if (h.uso === 'apoio') return 'Buff';
  if (h.uso === 'reacao') return 'Reação';
  if (h.uso === 'passiva') return 'Passiva';
  const efeitos = (h.fisico && h.fisico !== 'perfurante' && h.fis[h.fisico].modo !== 'tipo') || h.elementos.some((e) => h.el[e].modo !== 'tipo') || h.extras.some((x) => x.tipo === 'selo');
  return h.dano.modo === 'nenhum' && efeitos ? 'Debuff' : 'Ativa';

/** Os selos que o golpe põe (para o teto de 3 no mesmo golpe). */
function selosDoGolpe(h) {
  const lista = [];
  if (h.fisico && FISICOS[h.fisico].selo && h.fis[h.fisico].modo !== 'tipo') lista.push(h.fisico);
  for (const e of h.elementos) if (h.el[e].modo !== 'tipo') lista.push(e);
  for (const x of h.extras) if (x.tipo === 'selo' || x.tipo === 'seloPronto') lista.push('extra');

}
function valorDoDano(h, f) {

};

function checarGrupos(grupos, e) {
  const faltas = [];
  for (const g of grupos) {
    const res = g.itens.map((r) => ({ r, f: REQ[r.tipo].checa(r, e) }));
    const ok = (x) => x.f === null || x.f === 'pergunta' || x.f === 'caixa';

  }
  return faltas;
}

}

function dim(id, nome, dica, corpo) {

function glifo(forma, verde) {
  const al = { forma, n: forma === 'frente' ? 3 : 2, raio: 1, min: 2, semLimite: false };
  const { area, alcance } = celulas(al, 0, { x: MEIO, y: MEIO - 2 }, { x: MEIO, y: MEIO - 2 });

  if (id !== 'perfurante') {
    quando = `<span class="rot">Pega</span>${seg('Quando pega: ' + t.nome, [['sempre', 'Sempre que acertar'], ['teste', 'Com teste'], ['tipo', 'Só o tipo, sem efeito']], r.modo, 'modo', ` data-onde="${onde}" data-id="${id}"`)}`;
    if (r.modo === 'teste') quando += `<span class="frase-ed">o alvo testa ${selIn(k + '.atr', r.atr || 'Resistência', ATRIBUTOS, 'Atributo do teste')} contra CD ${numIn(k + '.cd', r.cd || 12, 1, 99, 'CD')}; falhou, pega</span>`;
  }
  return `<div class="regra" data-tipo-id="${id}">${ic(id, COR_TIPO[id])}<div><span class="regra__tit">${t.nome}${t.faz ? ` <span class="dica">${t.faz.toLowerCase()}</span>` : ''}</span><p class="dica">${esc(t.regra(Object.assign({}, r, { modo: r.modo })))}</p></div><div class="regra__lado"><span class="etq" data-c="${c}">${txt}</span><button type="button" class="bt bt--ic" data-a="${onde === 'fis' ? 'fisico' : 'elemento'}" data-v="${id}" aria-label="Tirar ${t.nome}">${ic('x')}</button></div>${faz ? `<div class="regra__faz">${faz}</div>` : ''}${quando ? `<div class="regra__quando">${quando}</div>` : ''}</div>`;
}

function htmlAlcance(h) {
  const al = h.alcance;
  const verde = !temDano(h);
  let o = `<div class="formas" role="radiogroup" aria-label="Forma do alcance">${FORMAS.map((fm) => `<button type="button" role="radio" class="forma" aria-checked="${al.forma === fm.id}" tabindex="${al.forma === fm.id ? 0 : -1}" data-a="forma" data-v="${fm.id}">${glifo(fm.id, verde)}${fm.rot}</button>`).join('')}</div>`;
  let tam = '';
  switch (al.forma) {
    case 'alvo': tam = al.semLimite ? 'Escolhe o alvo em qualquer lugar do mapa.' : `Escolhe o alvo a até ${numIn('alcance.n', al.n, 1, CASAS_MAX, 'casas')} ${al.n === 1 ? 'casa' : 'casas'} (1 = colado).`; break;
    case 'anel': tam = `Só longe: de ${numIn('alcance.min', al.min, 2, al.n - 1, 'casas no mínimo')} a ${numIn('alcance.n', al.n, al.min + 1, CASAS_MAX, 'casas no máximo')} casas; colado não pega.`; break;
    case 'linha': tam = `Uma reta de ${numIn('alcance.n', al.n, 1, CASAS_MAX, 'casas')} ${al.n === 1 ? 'casa' : 'casas'} a partir de quem usa.`; break;
    case 'volta': tam = `Todas as casas a até ${numIn('alcance.n', al.n, 1, CASAS_MAX, 'casas')} de quem usa (${2 * al.n + 1}x${2 * al.n + 1}).`; break;
    case 'frente': tam = `Um quadrado de ${numIn('alcance.n', al.n, 2, 9, 'lado')}x${al.n} colado na frente.`; break;
    case 'cruz': tam = `As 4 retas, ${numIn('alcance.n', al.n, 1, CASAS_MAX, 'casas')} para cada lado.`; break;
    case 'leque': tam = `Abre à frente: 1, 3, 5 casas por fileira, ${numIn('alcance.n', al.n, 1, 9, 'fileiras')} fileiras.`; break;
    case 'ponto': tam = `Cai num ponto a até ${numIn('alcance.n', al.n, 1, CASAS_MAX, 'casas até o ponto')} casas e pega ${numIn('alcance.raio', al.raio, 0, 5, 'casas em volta do ponto')} em volta (${2 * al.raio + 1}x${2 * al.raio + 1}).`; break;
    case 'ficha': tam = `Escolhe uma ficha a até ${numIn('alcance.n', al.n, 1, CASAS_MAX, 'casas até a ficha')} casas e pega ${numIn('alcance.raio', al.raio, 0, 5, 'casas em volta da ficha')} em volta dela.`; break;
    case 'si': tam = 'Vale só em quem usa (o próprio cartão).'; break;
  }
  o += `<p class="frase-ed">${tam}</p>`;
  if (al.forma === 'alvo') o += `<label class="marca"><input type="checkbox" data-campo="alcance.semLimite" data-tipo="bool"${al.semLimite ? ' checked' : ''}> Sem conferir a distância (como o "Tem alcance" desmarcado de hoje)</label>`;
  if (al.forma === 'alvo' || al.forma === 'anel') {
    o += `<div class="linha"><span class="rot">Quantos</span>${seg('Quantos alvos', [['1', '1 alvo'], ['varios', 'Vários']], al.quantos > 1 ? 'varios' : '1', 'quantos')}${al.quantos > 1 ? `<span class="frase-ed">até ${numIn('alcance.quantos', al.quantos, 2, 12, 'alvos')} alvos</span><label class="marca"><input type="checkbox" data-campo="alcance.dividir" data-tipo="bool"${al.dividir ? ' checked' : ''}> O dano se divide entre eles</label>` : ''}</div>`;
  }
  if (al.forma !== 'si') {
    const ops = h.uso === 'apoio' ? [['aliados', 'Aliados'], ['todos', 'Todos']] : [['inimigos', 'Inimigos'], ['aliados', 'Aliados'], ['todos', 'Todos']];
    o += `<div class="linha"><span class="rot">Pega</span>${seg('Em quem pega', ops, al.quem, 'quem')}${['ponto', 'ficha', 'volta', 'linha', 'cruz', 'leque', 'frente'].includes(al.forma) && al.quem !== 'aliados' && h.uso === 'ataque' ? '<span class="dica">Na área, o mestre desmarca quem não quer acertar.</span>' : ''}</div>`;
  }
  return o;
}

function htmlDano(h, f) {
  const d = h.dano;
  let o = `<div class="linha">${seg('Como é o dano', [['formula', 'Fórmula'], ['porcento', '% da vida do alvo'], ['nenhum', 'Sem dano']], d.modo, 'danoModo')}</div>`;
  if (d.modo === 'formula') {
    const r = calcular(d.formula, f);
    o += `<div class="formula"><input class="entrada num" id="f-formula" data-campo="dano.formula" value="${esc(d.formula)}" placeholder="Ex.: Força + 20" aria-label="Fórmula do dano" aria-describedby="f-calcula"${r.erro ? ' aria-invalid="true"' : ''}>
      <div class="teclas" aria-label="Pôr na fórmula">${ATRIBUTOS.map((a) => `<button type="button" class="tecla" data-a="tecla" data-v="${a}">${a}<sup>${f.atr[a]}</sup></button>`).join('')}<button type="button" class="tecla" data-a="tecla" data-v="Dano da Arma"${f.arma ? ` title="${esc(f.arma.nome)}: ${f.arma.dano}"` : ' title="Sem arma padrão na ficha: conta 0"'}>Dano da Arma<sup>${f.arma ? f.arma.dano : 0}</sup></button></div>
      <div class="teclas">${['+', '−', '×', '÷', '(', ')', ','].map((t) => `<button type="button" class="tecla tecla--op" data-a="tecla" data-v="${t}" aria-label="${{ '+': 'mais', '−': 'menos', '×': 'vezes', '÷': 'dividido por', '(': 'abre parêntese', ')': 'fecha parêntese', ',': 'vírgula' }[t]}">${t}</button>`).join('')}</div>
      <p class="calcula" id="f-calcula" aria-live="polite"${r.ok ? '' : ' data-erro'}>${htmlCalcula(r)}</p>
      ${f.contadores.filter((n) => acumDe(f, n).da.tipo === 'dano').map((n) => `<p class="dica">O acumulador ${esc(n)} soma +${acumDe(f, n).da.n} por nível em todo golpe de ${esc(f.nome)}: não entra na fórmula, o teste mostra.</p>`).join('')}</div>`;
  } else if (d.modo === 'porcento') {
    o += `<p class="frase-ed">Tira ${numIn('dano.pct', d.pct, 1, 100, 'por cento')}% da ${selIn('dano.de', { maxima: 'vida máxima', atual: 'vida atual', falta: 'vida que falta' }[d.de], ['vida máxima', 'vida atual', 'vida que falta'], 'De qual vida')} do alvo.</p>`;
  } else {
    o += '<p class="dim__vazio">Sem dano: o golpe só põe o que o tipo e os efeitos dizem. O alvo ainda reage (esquivou, nada pega).</p>';
  }
  if (d.modo !== 'nenhum') o += `<label class="marca"><input type="checkbox" data-campo="dano.concentracao" data-tipo="bool"${d.concentracao ? ' checked' : ''}> Cresce com a Concentração guardada (carga 1: ×1,5 · 2: ×2 · 3: ×3,5)</label>`;
  return o;
}
function htmlCalcula(r) {
  if (r.vazio) return 'Escreva a conta ou use os botões: o app calcula sozinho.';
  if (!r.ok) return esc(r.erro);
  return `O app calcula sozinho <b>= ${r.valor}</b> (${esc(r.conta)})`;
}

function htmlAcerto(h) {
  if (ehOverload(h)) return `<p class="trava">${ic('cadeado')}Não erra: o alvo não reage, só outra Overload defende (regra da Overload).</p>`;
  const t = h.teste;
  let o = `<div class="linha">${seg('Como acerta', [['reacao', 'O alvo reage (d20)'], ['resistencia', 'O alvo testa contra uma CD'], ['disputa', 'Disputa (d20 contra d20)'], ['naoErra', 'Não erra']], t.tipo, 'teste')}</div>`;
  if (t.tipo === 'reacao') o += '<p class="dica">O alvo rola a reação de sempre: 10 = metade, 15 = esquiva, 20 = contra.</p>';
  if (t.tipo === 'resistencia') o += `<p class="frase-ed">O alvo rola d20 + ${selIn('teste.atr', t.atr, ATRIBUTOS, 'Atributo do alvo')} contra CD ${numIn('teste.cd', t.cd, 1, 99, 'CD')}. Se passar: ${seg('Se passar', [['nada', 'nada'], ['metade', 'leva metade'], ['devolve', 'nada, e não gasta']], t.sePassar, 'sePassar')}</p>`;
  if (t.tipo === 'disputa') o += `<p class="frase-ed">Quem usa rola d20 + ${selIn('teste.atrUsa', t.atrUsa, ATRIBUTOS, 'Atributo de quem usa')} contra d20 + ${selIn('teste.atrAlvo', t.atrAlvo, ATRIBUTOS, 'Atributo do alvo')} do alvo; o empate fica com o alvo.</p>`;
  if (t.tipo === 'naoErra') o += '<p class="dica">O alvo não rola nada: o golpe sempre pega.</p>';
  return o;
}

function htmlDefesa(h) {
  const d = h.defesa;
  let o = `<div class="linha">${seg('Defesa', [['anula', 'Anula o golpe'], ['fica', 'Fica com parte'], ['rola', 'Rola o d20'], ['nenhuma', 'Não defende']], d.tipo, 'defesa')}</div>`;
  if (d.tipo === 'fica') o += `<p class="frase-ed">Quem usa fica com ${numIn('defesa.pct', d.pct, 0, 100, 'por cento do dano')}% do dano.</p>`;
  if (d.tipo === 'rola') o += `<p class="frase-ed">Rola d20 + ${selIn('defesa.atrs', d.atrs, ATRIBUTOS, 'Atributo')}; com ${numIn('defesa.anulaCom', d.anulaCom, 2, 30, 'número que anula')} ou mais, anula.</p>`;
  o += `<p class="frase-ed">Devolve em quem atacou: ${d.devolve > 0 ? `o dano ÷ ${numIn('defesa.devolve', d.devolve, 1, 10, 'dividido por')}` : 'nada'} ${d.devolve > 0 ? '<button type="button" class="bt bt--fantasma bt--p" data-a="devolve" data-v="0">Não devolver</button>' : '<button type="button" class="bt bt--fantasma bt--p" data-a="devolve" data-v="2">Devolver parte</button>'}</p>`;
  o += `<label class="marca"><input type="checkbox" data-campo="defesa.contraOverload" data-tipo="bool"${d.contraOverload ? ' checked' : ''}> Vale também contra Overload</label>`;
  return o;
}

function htmlEfeitos(h) {
  let o = '';
  if (h.extras.length === 0) o += `<p class="dim__vazio">${h.uso === 'apoio' ? 'O apoio ainda não faz nada no aliado. Ponha uma cura, um buff ou um escudo.' : 'Nada além do golpe. Cura em quem usa, condição pronta, roubo de vida e 2º golpe entram aqui.'}</p>`;
  else o += `<div class="itens">${h.extras.map((x, i) => `<div class="item"><div class="frase-ed">${htmlEfeito(x, i, h)}</div><div class="item__lado">${x.tipo === 'aMao' ? '<span class="etq" data-c="mao">o mestre aplica</span>' : x.tipo === 'acumular' ? '<span class="etq" data-c="novo">peça nova</span>' : '<span class="etq" data-c="auto">o app faz</span>'}<button type="button" class="bt bt--ic" data-a="tirarEfeito" data-i="${i}" aria-label="Tirar ${esc(EFEITOS[x.tipo].nome)}">${ic('x')}</button></div></div>`).join('')}</div>`;
  const cheio = h.extras.length >= EFEITOS_MAX;
  o += `<div><button type="button" class="bt bt--latao bt--p" data-a="menuEfeito" aria-haspopup="menu"${cheio ? ` aria-disabled="true" title="Até ${EFEITOS_MAX} efeitos"` : ''}>${ic('mais')}Efeito</button></div>`;
  return o;
}
function htmlEfeito(x, i, h) {
  const k = `extras.${i}`;
  const em = h.uso === 'reacao' ? [['alvo', 'em quem usa'], ['atacante', 'em quem atacou']] : [['alvo', 'no alvo'], ['quemUsa', 'em quem usa']];
  switch (x.tipo) {
    case 'cura': return `<b>Cura</b> ${selIn(k + '.recursoTxt', { hp: 'HP', sp: 'SP', escudo: 'Escudo' }[x.recurso], ['HP', 'SP', 'Escudo'], 'O que recupera')} igual a ${txtIn(k + '.formula', x.formula, 'Fórmula da cura')} ${seg('Em quem', [['alvo', 'no alvo'], ['quemUsa', 'em quem usa']], x.em, 'efeitoEm', ` data-i="${i}"`)}`;
    case 'seloPronto': return `<b>Condição</b> ${selIn(k + '.nome', x.nome, SELOS_PRONTOS, 'Condição')} por ${numIn(k + '.dura', x.dura, 1, 20, 'vezes')} ${x.dura === 1 ? 'vez' : 'vezes'} ${seg('Em quem', em, x.em, 'efeitoEm', ` data-i="${i}"`)}`;
    case 'selo': return `<b>${x.natureza === 'buff' ? 'Buff' : 'Debuff'}</b> ${txtIn(k + '.nome', x.nome, 'Nome do selo')} ${x.dura > 0 ? `por ${numIn(k + '.dura', x.dura, 1, 20, 'vezes')} vezes` : 'até tirarem'}: ${selIn(k + '.atr', x.atr, ATRIBUTOS.concat(['Dano']), 'Atributo')} ${x.delta >= 0 ? '+' : '−'}${numIn(k + '.deltaAbs', Math.abs(x.delta), 0, 999, 'quanto')}${x.curaDoDano ? ` e cura ${numIn(k + '.curaDoDano', x.curaDoDano, 1, 100, 'por cento do dano')}% do dano que causa` : ''} ${seg('Natureza', [['buff', 'buff'], ['debuff', 'debuff']], x.natureza, 'natureza', ` data-i="${i}"`)}`;
    case 'tirar': return `<b>Tira</b> ${seg('Quais condições', [['negativas', 'as negativas'], ['positivas', 'as positivas'], ['todas', 'todas']], x.quais, 'quais', ` data-i="${i}"`)}`;
    case 'dreno': return `<b>Roubo de vida</b>: quem usa recupera ${numIn(k + '.pct', x.pct, 1, 100, 'por cento')}% do dano em HP`;
    case 'segundo': return `<b>2º golpe</b> nos mesmos alvos com ${numIn(k + '.pct', x.pct, 1, 100, 'por cento do dano')}% do dano <label class="marca"><input type="checkbox" data-campo="${k}.perfurante" data-tipo="bool"${x.perfurante ? ' checked' : ''}> perfurante</label>`;
    case 'reviver': return `<b>Reviver</b>: o aliado caído volta com ${numIn(k + '.pct', x.pct, 1, 100, 'por cento')}% do HP máximo dele`;
    case 'aMao': return `<b>Lembrete</b> ${txtIn(k + '.texto', x.texto, 'Lembrete', 'O que o mestre faz à mão')}`;
    case 'acumular': {
      const f = F();
      if (!f.contadores.length) return `<b>Somar num acumulador</b>: <span class="dica">${esc(f.nome)} não tem acumulador.</span> ${linkAcum('Criar um acumulador')}`;
      const a = acumDe(f, x.acum);
      return `<b>Soma</b> ${numIn(k + '.n', x.n, 1, a.max, 'quanto soma')} em ${selIn(k + '.acum', x.acum, f.contadores, 'Acumulador')} ${seg('Quando soma', [['usar', 'ao usar'], ['acertar', 'se acertar']], x.quando, 'acumQuando', ` data-i="${i}"`)} <span class="dica">vai até ${a.max}; ${a.da.tipo === 'dano' ? `cada nível dá +${a.da.n} de dano` : 'não dá nada sozinho'}</span> ${linkAcum('Mudar o acumulador')}`;
    }
  }
  return '';
}

function htmlCusto(h) {
  const c = h.custo;
  let o = `<p class="frase-ed">Gasta ${numIn('custo.sp', c.sp, 0, 999, 'SP')} de SP ao usar${h.uso === 'ataque' ? '' : ''}.</p>`;
  o += `<p class="frase-ed">Enquanto mantém, gasta ${numIn('custo.porVez', c.porVez, 0, 99, 'SP por vez')} de SP por vez ${c.porVez === 0 ? '<span class="dica">(0 = não é mantida)</span>' : ''}</p>`;
  if (ehOverload(h)) o += `<p class="trava">${ic('cadeado')}1 vez por batalha (Overload). Sem espera: depois de usar, some até a próxima batalha.</p>`;
  else {
    o += `<p class="frase-ed">Tempo: espera ${numIn('custo.recarga', c.recarga, 0, 20, 'rodadas')} ${c.recarga === 1 ? 'rodada' : 'rodadas'} para usar de novo ${c.recarga === 0 ? '<span class="dica">(0 = pode repetir)</span>' : ''}</p>`;
    o += `<div class="linha"><span class="rot">Por batalha</span>${seg('Usos por batalha', [['0', 'Sem limite'], ['n', 'Algumas vezes']], c.usos > 0 ? 'n' : '0', 'usos')}${c.usos > 0 ? `<span class="frase-ed">${numIn('custo.usos', c.usos, 1, 20, 'vezes por batalha')} ${c.usos === 1 ? 'vez' : 'vezes'}</span>` : ''}</div>`;
  }
  o += `<p class="frase-ed">Gasta da mochila: ${txtIn('custo.item', c.item, 'Item da mochila', 'nenhum item')}${c.item ? ` × ${numIn('custo.itemN', c.itemN, 1, 10, 'quantos')}` : ''}</p>`;
  return o;
}

function htmlGrupos(lugar, grupos, f) {
  let o = '';
  if (lugar === 'reqEvolui') o += `<p class="rot">Para evoluir, precisa de:</p>`;
  if (grupos.length === 0) o += `<p class="dim__vazio">${lugar === 'req' ? 'Nenhum requisito: usa a qualquer hora, se tiver o custo.' : 'Sem requisitos: evolui sempre (vira a outra até usar uma vez).'}</p>`;
  grupos.forEach((g, gi) => {
    if (gi > 0) o += '<p class="entre">e também</p>';
    o += `<div class="grupo" data-modo="${g.modo}"><div class="grupo__cab">${seg('Como vale o grupo ' + (gi + 1), [['todos', 'Todos estes'], ['um', 'Um destes']], g.modo, 'grupoModo', ` data-lugar="${lugar}" data-g="${gi}"`)}<span class="dica">${g.modo === 'todos' ? 'precisa de todos' : 'basta um: quem usa escolhe na hora'}</span><button type="button" class="bt bt--ic" data-a="tirarGrupo" data-lugar="${lugar}" data-g="${gi}" aria-label="Tirar o grupo ${gi + 1}">${ic('x')}</button></div>`;
    g.itens.forEach((r, ri) => {
      const t = REQ[r.tipo];
      const k = `${lugar}.${gi}.itens.${ri}`;
      o += `<div class="req"><span class="req__cod">${r.tipo}</span><div class="req__frase">${t.frase(r, k, f)}</div><div class="req__lado">${t.gasta ? `<button type="button" class="gasta" aria-pressed="${!!r.gasta}" data-a="gasta" data-lugar="${lugar}" data-g="${gi}" data-i="${ri}">${r.gasta ? '✓ e gasta' : 'só exige'}</button>` : ''}<span class="etq" data-c="${t.conf}">${CONF_TXT[t.conf]}</span><button type="button" class="bt bt--ic" data-a="tirarReq" data-lugar="${lugar}" data-g="${gi}" data-i="${ri}" aria-label="Tirar requisito">${ic('x')}</button></div></div>`;
    });
    o += `<div class="grupo__pe"><button type="button" class="bt bt--latao bt--p" data-a="menuReq" data-lugar="${lugar}" data-g="${gi}" aria-haspopup="menu">${ic('mais')}Requisito</button></div></div>`;
  });
  o += `<div><button type="button" class="bt bt--fantasma bt--p" data-a="novoGrupo" data-lugar="${lugar}">${ic('mais')}Grupo</button> <span class="dica">Sem o requisito, a habilidade fica cinza com o motivo, e o mestre pode usar mesmo assim.</span></div>`;
  if (lugar === 'req') o += `<p class="dica">Nível de um acumulador (Polaridade 2, Fúria 3) entra como requisito e pode gastar o nível; somar no acumulador é um Efeito. O acumulador em si (nome, máximo, como sobe e cai, o que cada nível dá) se cria no ${linkAcum('editor de acumulador')}.</p>`;
  return o;
}

function htmlEvolucao(h, f) {
  if (!h.evolui) return `<p class="dim__vazio">Não evolui.</p><div><button type="button" class="bt bt--latao bt--p" data-a="evoluir">${ic('mais')}Esta habilidade evolui</button> <span class="dica">Cria a versão evoluída (super ou Overload) ao lado, com os requisitos para virar.</span></div>`;
  const evo = S.habs[h.evolui];
  const faltas = checarGrupos(h.reqEvolui, S.est);
  let o = `<p class="frase-ed">Cumpridos os requisitos, vira <button type="button" class="bt bt--p" data-a="aba" data-v="${evo.id}">${esc(evo.nome || '(sem nome)')}</button> até usar uma vez; depois volta a esta.</p>`;
  o += htmlGrupos('reqEvolui', h.reqEvolui, f);
  o += `<div class="estado-evo" aria-live="polite"><b>Agora, com ${esc(f.nome)}:</b>${faltas.length === 0 ? '<span class="ok">Pode evoluir.</span>' : faltas.map((x) => `<span class="falta">Falta: ${esc(x.f)}</span>`).join('')}<span class="dica">Mude em "Ajustar quem usa", no teste à direita.</span></div>`;
  o += `<div><button type="button" class="bt bt--fantasma bt--p" data-a="naoEvolui">Não evolui mais</button></div>`;
  return o;

/* ============================================================ mudar o estado por caminho ("alcance.n") */
function pegar(obj, caminho) { return caminho.split('.').reduce((o, p) => (o == null ? undefined : o[p]), obj); }
function pôr(obj, caminho, valor) {
  const partes = caminho.split('.');
  const ult = partes.pop();
  const alvo = partes.reduce((o, p) => o[p], obj);
  alvo[ult] = valor;
}
function raizDoCampo(campo) {
  if (campo.startsWith('est.')) return [S, campo];
  if (campo.startsWith('fis.') || campo.startsWith('el.')) return [H(), campo];
  return [H(), campo];
}
function aplicarCampo(el, valorBruto, final) {
  const campo = el.dataset.campo;
  const [raiz, caminho] = raizDoCampo(campo);
  let v = valorBruto;
  if (el.dataset.tipo === 'num') {
    const n = parseInt(String(v).replace(/\D/g, ''), 10);
    if (Number.isNaN(n)) { if (!final) return; v = Number(el.dataset.min || 0); }
    else v = final ? clamp(n, Number(el.dataset.min || 0), Number(el.dataset.max || 999)) : n;
  }
  if (el.dataset.tipo === 'bool') v = el.checked;
  /* os campos com rótulo diferente do valor */
  if (caminho.endsWith('.recursoTxt')) { pôr(raiz, caminho.replace('.recursoTxt', '.recurso'), { HP: 'hp', SP: 'sp', Escudo: 'escudo' }[v]); return; }
  if (caminho.endsWith('.deltaAbs')) { const x = pegar(raiz, caminho.replace('.deltaAbs', '')); x.delta = (x.natureza === 'debuff' ? -1 : 1) * v; return; }
  if (caminho === 'dano.de') { H().dano.de = { 'vida máxima': 'maxima', 'vida atual': 'atual', 'vida que falta': 'falta' }[v]; return; }
  if (caminho.startsWith('est.contadores.')) { S.est.contadores[caminho.slice('est.contadores.'.length)] = v; return; }
  pôr(raiz, caminho, v);
}

function teclaDaCamada(ev) {
  const c = $('#camada');
  if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); fecharCamada(); return; }
  const menu = c.querySelector('.menu');
  if (menu && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp' || ev.key === 'Home' || ev.key === 'End')) {
    ev.preventDefault();
    const itens = [...menu.querySelectorAll('.menu__item:not([aria-disabled="true"])')];
    const i = itens.indexOf(document.activeElement);
    const prox = ev.key === 'Home' ? 0 : ev.key === 'End' ? itens.length - 1 : ev.key === 'ArrowDown' ? (i + 1) % itens.length : (i - 1 + itens.length) % itens.length;
    itens[prox].focus();
  }
  if (menu && ev.key === 'Tab') fecharCamada(false);
  const dlg = c.querySelector('.dialogo');
  if (dlg && ev.key === 'Tab') {
    const foco = [...dlg.querySelectorAll('button')];
    const i = foco.indexOf(document.activeElement);
    if (ev.shiftKey && i <= 0) { ev.preventDefault(); foco[foco.length - 1].focus(); }
    else if (!ev.shiftKey && i === foco.length - 1) { ev.preventDefault(); foco[0].focus(); }
  }
}

/* ============================================================ o aviso (com Desfazer) */
function aviso(texto, comDesfazer) {
  const raiz = $('#avisos');
  raiz.querySelectorAll('.aviso').forEach((a) => a.remove());
  const el = document.createElement('div');
  el.className = 'aviso';
  el.innerHTML = `<span>${esc(texto)}</span>${comDesfazer ? '<button type="button" class="bt bt--p" data-a="desfazer">Desfazer</button>' : ''}`;
  raiz.appendChild(el);
  let tempo = null;
  const some = () => { el.setAttribute('data-saindo', ''); setTimeout(() => el.remove(), 160); };
  const arma = () => { tempo = setTimeout(some, comDesfazer ? 6000 : 3200); };
  el.addEventListener('pointerenter', () => clearTimeout(tempo));
  el.addEventListener('pointerleave', arma);
  arma();
}

    if (x.tipo === 'selo' && h.uso === 'ataque') { x.natureza = 'debuff'; x.nome = 'Abalado'; x.delta = -10; }
    if (x.tipo === 'cura' && h.uso === 'ataque') x.em = 'quemUsa';
    if (x.tipo === 'acumular') x.acum = F().contadores[0] || '';
    h.extras.push(x);
    fecharCamada(false);
    renderTudo();
    const ult = document.querySelectorAll('#dim-efeitos .item');
    if (ult.length) { const campo = ult[ult.length - 1].querySelector('input, select, button'); if (campo) campo.focus(); }
  },
  tirarEfeito(el) { guardar(); const h = H(); const x = h.extras.splice(Number(el.dataset.i), 1)[0]; renderTudo(); aviso(`${EFEITOS[x.tipo].nome} tirado.`, true); },
  efeitoEm(el) { guardar(); H().extras[Number(el.dataset.i)].em = el.dataset.v; renderTudo(); },
  natureza(el) { guardar(); const x = H().extras[Number(el.dataset.i)]; x.natureza = el.dataset.v; x.delta = (el.dataset.v === 'debuff' ? -1 : 1) * Math.abs(x.delta); renderTudo(); },
  quais(el) { guardar(); H().extras[Number(el.dataset.i)].quais = el.dataset.v; renderTudo(); },
  acumQuando(el) { guardar(); H().extras[Number(el.dataset.i)].quando = el.dataset.v; renderTudo(); },
  menuReq(el) {
    abrirMenu(el, [{ sep: 'Recursos e estado de quem usa' }, ...['A1', 'A2', 'A4', 'B1', 'B2', 'C1'].map((t) => ({ a: 'addReq', v: t, nome: `${t} · ${REQ[t].nome}`, faz: CONF_TXT[REQ[t].conf] + ': ' + (REQ[t].conf === 'auto' ? 'o app confere sozinho' : ''), lugar: el.dataset.lugar, g: el.dataset.g, motivo: t === 'A4' && F().contadores.length === 0 ? 'Esta ficha não tem acumulador: crie um no editor de acumulador' : '' })),
      { sep: 'Aliados e o resto' }, ...['G2', 'J1'].map((t) => ({ a: 'addReq', v: t, nome: `${t} · ${REQ[t].nome}`, faz: t === 'G2' ? 'Pergunta ao aliado na tela dele' : 'Ao usar, abre "Cumpriu?"', lugar: el.dataset.lugar, g: el.dataset.g })),
      { sep: 'A lista inteira de tipos está no protótipo dos requisitos' }]);
  },
  addReq(el) {
    if (el.getAttribute('aria-disabled') === 'true') return;
    guardar();
    const lista = H()[el.dataset.lugar];
    lista[Number(el.dataset.g)].itens.push(novoReqItem(el.dataset.v));
    fecharCamada(false);
    renderTudo();
  },
  novoGrupo(el) { guardar(); H()[el.dataset.lugar].push({ modo: 'todos', itens: [] }); renderTudo(); const b = document.querySelectorAll(`[data-a="menuReq"][data-lugar="${el.dataset.lugar}"]`); if (b.length) b[b.length - 1].focus(); },
  tirarGrupo(el) { guardar(); H()[el.dataset.lugar].splice(Number(el.dataset.g), 1); renderTudo(); aviso('Grupo tirado.', true); },
  grupoModo(el) { guardar(); H()[el.dataset.lugar][Number(el.dataset.g)].modo = el.dataset.v; renderTudo(); },
  tirarReq(el) { guardar(); H()[el.dataset.lugar][Number(el.dataset.g)].itens.splice(Number(el.dataset.i), 1); renderTudo(); aviso('Requisito tirado.', true); },
  gasta(el) { guardar(); const r = H()[el.dataset.lugar][Number(el.dataset.g)].itens[Number(el.dataset.i)]; r.gasta = !r.gasta; renderTudo(); },
  evoluir() {
    guardar();
    const h = H();
    const id = h.id + 'Evo';
    S.habs[id] = Object.assign(copia(h), { id, nome: `SUPER ${h.nome || 'habilidade'}`, acao: h.uso === 'ataque' ? 'overload' : h.acao, evolui: null, reqEvolui: [], evolucaoDe: h.id, req: [] });
    h.evolui = id;
    h.reqEvolui = [{ modo: 'todos', itens: [] }];
    renderTudo();
    aviso(`Criada a versão evoluída "${S.habs[id].nome}". Ela abre na aba ao lado do nome.`, true);
  },
  naoEvolui() { guardar(); const h = H(); delete S.habs[h.evolui]; h.evolui = null; h.reqEvolui = []; renderTudo(); aviso('A evolução saiu.', true); },
  novoCampo() { guardar(); H().campos.push({ nome: '', valor: '' }); renderTudo(); const c = document.querySelectorAll('#dim-campos .campo-extra input'); if (c.length) c[c.length - 2].focus(); },
  novaOpcao() { guardar(); H().campos.push({ nome: 'Opção ', valor: '', opcao: true }); renderTudo(); const c = document.querySelectorAll('#dim-campos .campo-extra input'); if (c.length) c[c.length - 2].focus(); },
  tirarCampo(el) { guardar(); H().campos.splice(Number(el.dataset.i), 1); renderTudo(); aviso('Campo tirado.', true); },
  modelos(el) { abrirModelos(el); },
  modelo(el) { aplicarModelo(el.dataset.v); },
  fecharCamada() { fecharCamada(); },
  fundo(el, ev) { if (ev.target === el) fecharCamada(); },
  desfazer() { $('#avisos').innerHTML = ''; desfazer(); },
  salvar() {
    const sem = Object.values(S.habs).find((x) => !x.nome.trim());
    if (sem) { S.aberta = sem.id; S.erroNome = true; renderTudo(); $('#f-nome').focus(); return; }
    S.erroNome = false; renderTudo(); aviso('Protótipo: no app, isto salva a ficha. Aqui nada é salvo.');
  },
  cancelar() { aviso('Protótipo: no app, Cancelar fecha sem salvar.'); },
  ir(el, ev) {
    if (ev) ev.preventDefault();
    const alvo = document.getElementById('dim-' + el.dataset.v);
    if (!alvo) return;
    alvo.scrollIntoView({ block: 'start' });
    /* "você chegou aqui": só opacidade, por isso vale também com movimento reduzido */
    alvo.querySelectorAll('.dim__brilho').forEach((b) => b.remove());
    const brilho = document.createElement('div');
    brilho.className = 'dim__brilho';
    alvo.appendChild(brilho);
    brilho.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 600, delay: 150, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', fill: 'forwards' }).onfinish = () => brilho.remove();
    const primeiro = alvo.querySelector('[aria-checked="true"], input, select, button');
    if (primeiro) primeiro.focus({ preventScroll: true });
  },
  dir(el) { if (el.getAttribute('aria-disabled') === 'true') return; S.dir = Number(el.dataset.v); renderTudo({ soVer: true }); },
  rolar() { S.d20 = 1 + Math.floor(Math.random() * 20); S.d20b = 1 + Math.floor(Math.random() * 20); S.animar = true; S.rolou = true; renderTudo({ soVer: true }); },
  reage(el) { S.reage = el.dataset.v; S.animar = true; renderTudo({ soVer: true }); },
  carga(el) { S.carga = Number(el.dataset.v); renderTudo({ soVer: true }); },
  boneco(el) { S.ativo = Number(el.dataset.v); S.animar = true; renderTudo({ soVer: true }); },
  ajustes(el, ev) { ev.preventDefault(); S.ajustesAbertos = !S.ajustesAbertos; renderTudo({ soVer: true }); },
  ligar(el) { const l = S.est.ligadas; const t = el.dataset.v; S.est.ligadas = l.includes(t) ? l.filter((x) => x !== t) : l.concat([t]); renderTudo(); },
  fixCont(el) { S.est.contadores[el.dataset.v] = Math.min(Number(el.dataset.n), acumDe(F(), el.dataset.v).max); S.animar = true; S.ajustesAbertos = true; renderTudo(); },
  fixLigar(el) { if (!S.est.ligadas.includes(el.dataset.v)) S.est.ligadas.push(el.dataset.v); renderTudo(); },
  fixSp() { S.est.sp = F().sp; S.animar = true; renderTudo(); },
  fixRodada(el) { S.est.rodada = Number(el.dataset.n); renderTudo(); },
  fixPerto() {
    const al = H().alcance;
    const d = al.forma === 'anel' ? al.min : 1;
    const dir = temDirecao(al.forma) ? DIRS[S.dir] : [0, -1];
    S.bonecos[S.ativo] = { x: MEIO + dir[0] * d, y: MEIO + dir[1] * d };
    if (al.forma === 'ponto') S.ponto = { x: MEIO, y: MEIO - Math.min(al.n, 2) };
    S.animar = true;
    renderTudo({ soVer: true });
  },
};

/* ============================================================ eventos */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-a]');
  if (!el) { if (!ev.target.closest('.menu')) fecharCamada(false); return; }
  if (el.tagName === 'INPUT' && el.type === 'checkbox' && el.dataset.a === 'ligar') { ACOES.ligar(el, ev); return; }
  if (!el.closest('#camada') && $('#camada').innerHTML && el.dataset.a !== 'fundo') fecharCamada(false);
  const fn = ACOES[el.dataset.a];
  if (fn) fn(el, ev);
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (!el.dataset || !el.dataset.campo || el.dataset.tipo === 'bool' || el.tagName === 'SELECT') return;
  aplicarCampo(el, el.value, false);
  if (el.id === 'f-formula') {
    S.caret = el.selectionStart;
    const r = calcular(H().dano.formula, F());
    const c = $('#f-calcula');
    c.innerHTML = htmlCalcula(r);
    c.toggleAttribute('data-erro', !r.ok);
    el.setAttribute('aria-invalid', String(!!r.erro));
  }
  if (el.dataset.campo === 'nome') { $('#trilha').textContent = `Habilidades › ${el.value || 'Nova habilidade'}`; document.querySelectorAll('.aba[aria-selected="true"]').forEach((a) => { a.firstChild.textContent = el.value || '(sem nome)'; }); if (S.erroNome && el.value.trim()) { S.erroNome = false; renderTudo(); return; } }
  renderVer();
});
let guardouTexto = null;
document.addEventListener('focusin', (ev) => { if (ev.target.dataset && ev.target.dataset.campo) guardouTexto = ev.target; });
document.addEventListener('keydown', (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.campo && ev.key === 'Enter' && el.tagName === 'INPUT') { el.blur(); el.focus(); }
}, true);
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (!el.dataset || !el.dataset.campo) return;
  guardar();
  aplicarCampo(el, el.value, true);
  renderTudo();
});
document.addEventListener('keyup', (ev) => { if (ev.target.id === 'f-formula') S.caret = ev.target.selectionStart; });
document.addEventListener('pointerup', (ev) => { if (ev.target.id === 'f-formula') S.caret = ev.target.selectionStart; });
/* setas nos grupos de rádio (uma parada só do Tab) e nas abas */
document.addEventListener('keydown', (ev) => {
  const el = ev.target;
  const grupo = el.closest && (el.closest('[role="radiogroup"]') || el.closest('[role="tablist"]'));
  if (grupo && ['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp', 'Home', 'End'].includes(ev.key) && !el.closest('#camada')) {
    const itens = [...grupo.querySelectorAll('[role="radio"]:not([aria-disabled="true"]), [role="tab"]')];
    const i = itens.indexOf(el);
    if (i < 0) return;
    ev.preventDefault();
    const prox = ev.key === 'Home' ? 0 : ev.key === 'End' ? itens.length - 1 : ['ArrowRight', 'ArrowDown'].includes(ev.key) ? (i + 1) % itens.length : (i - 1 + itens.length) % itens.length;
    itens[prox].click();
    return;
  }
  if (el.id === 'grade' && ['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'].includes(ev.key)) {
    ev.preventDefault();
    const d = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 }[ev.key];
    const al = H().alcance;
    if (al.forma === 'ponto') { const p = { x: clamp(S.ponto.x + DIRS[d][0], 0, LADO - 1), y: clamp(S.ponto.y + DIRS[d][1], 0, LADO - 1) }; if (cheb(p.x, p.y, MEIO, MEIO) <= al.n) S.ponto = p; }
    else if (temDirecao(al.forma)) S.dir = d;
    renderTudo({ soVer: true });
    return;
  }
  const digitando = el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT';
  if (!digitando && (ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); desfazer(); }
});
/* o clique no mapa */
document.addEventListener('pointerdown', (ev) => {
  if (ev.target.id !== 'grade') return;
  const r = ev.target.getBoundingClientRect();
  const x = Math.floor((ev.clientX - r.left) / 22);
  const y = Math.floor((ev.clientY - r.top) / 22);
  if (x < 0 || y < 0 || x >= LADO || y >= LADO || (x === MEIO && y === MEIO)) return;
  const al = H().alcance;
  const i = S.bonecos.findIndex((b) => b.x === x && b.y === y);
  if (i >= 0) S.ativo = i;
  else if (al.forma === 'ponto') { if (cheb(x, y, MEIO, MEIO) <= al.n) S.ponto = { x, y }; else aviso(`Longe demais: o ponto cai a até ${casas(al.n)}.`); }
  else S.bonecos[S.ativo] = { x, y };
  S.animar = true;
  renderTudo({ soVer: true });
  const g = $('#grade');
  if (g) g.focus({ preventScroll: true });
});

renderTudo();
</script>
