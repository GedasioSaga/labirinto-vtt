<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campo ensolarado</title>
<style>
:root {
  --fundo: #f4f1ea;
  --superficie: #ffffff;
  --tinta: #1f1d1a;
  --tinta-2: #5c574f;
  --borda: #ddd6c8;
  --acento: #a8741f;
  --acento-tinta: #ffffff;
  --foco: #2a6fdb;
  --raio: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #14120f;
    --superficie: #1f1c18;
    --tinta: #efe9dd;
    --tinta-2: #b3aa99;
    --borda: #3a352d;
    --acento: #e0a948;
    --acento-tinta: #1a1408;
    --foco: #8db7ff;
  }
}
:root[data-theme="dark"] {
  --fundo: #14120f;
  --superficie: #1f1c18;
  --tinta: #efe9dd;
  --tinta-2: #b3aa99;
  --borda: #3a352d;
  --acento: #e0a948;
  --acento-tinta: #1a1408;
  --foco: #8db7ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--fundo);
  color: var(--tinta);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
main { max-width: 992px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { margin: 0; font-size: 1.5rem; line-height: 1.2; letter-spacing: -0.01em; }
.sub { margin: 4px 0 16px; color: var(--tinta-2); font-size: 0.9375rem; }
/* Mesmas camadas da tela do app (TransicaoTela + transicoes.css). */
.palco { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #000; border-radius: var(--raio); }
.palco canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
.granulado { opacity: 0.06; mix-blend-mode: screen; pointer-events: none; }
.vinheta { position: absolute; inset: 0; background: radial-gradient(ellipse 78% 72% at 50% 48%, transparent 42%, rgba(0, 0, 0, 0.88) 100%); pointer-events: none; }
.cortina { position: absolute; inset: 0; background: #000; opacity: 1; pointer-events: none; }
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; padding: 12px; background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); }
button {
  min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--borda);
  background: var(--superficie); color: var(--tinta); font: inherit; font-weight: 600; cursor: pointer;
  transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1), background-color 160ms ease;
}
button:active { transform: scale(0.97); }
button.primario { background: var(--acento); color: var(--acento-tinta); border-color: transparent; }
button[aria-pressed="true"] { border-color: var(--acento); box-shadow: inset 0 0 0 1px var(--acento); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
label.opcao { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 4px; cursor: pointer; color: var(--tinta); }
label.opcao input { width: 20px; height: 20px; accent-color: var(--acento); margin: 0; }
.tempo { margin-left: auto; color: var(--tinta-2); font-variant-numeric: tabular-nums; font-size: 0.9375rem; }
.nota { margin: 10px 2px 0; color: var(--tinta-2); font-size: 0.875rem; }
.erro { display: none; position: absolute; inset: 0; place-items: center; padding: 16px; text-align: center; color: #f3eee4; background: #000; }
@media (prefers-reduced-motion: reduce) { button { transition: background-color 160ms ease; } button:active { transform: none; } }
@media (max-width: 520px) { .tempo { margin-left: 0; width: 100%; } }
</style>
</head>
<body>
<main>
  <h1>Campo ensolarado</h1>
  <p class="sub">Transição de viagem do pino · 7 s · protótipo para aprovar (o mesmo código que vai no pacote)</p>
  <div class="palco" id="palco">
    <canvas id="cena" aria-label="Animação: andando por uma estrada de terra num campo ensolarado até o sol tomar a tela"></canvas>
    <canvas id="granulado" class="granulado" aria-hidden="true"></canvas>
    <div class="vinheta" aria-hidden="true"></div>
    <div class="cortina" id="cortina" aria-hidden="true"></div>
    <div class="erro" id="erro" role="alert"></div>
  </div>
  <div class="barra">
    <button type="button" class="primario" id="repetir">Repetir</button>
    <button type="button" id="som" aria-pressed="false">Som: desligado</button>
    <label class="opcao"><input type="checkbox" id="reduzir"> Movimento reduzido</label>
    <span class="tempo" id="tempo" aria-live="off">0,0 s / 7,0 s</span>
  </div>
  <p class="nota">O som só liga com um clique (regra do navegador); ao ligar, a animação recomeça do início. No app, a vinheta, o granulado e a cortina preta são os mesmos desta página.</p>
</main>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js'

// Igual ao motor do app: gerenciamento de cor desligado, mesmo renderer.
THREE.ColorManagement.enabled = false
const DURACAO = 7
const criar = window.CampoEnsolarado.default
const canvas = document.getElementById('cena')
const cortina = document.getElementById('cortina')
const tempo = document.getElementById('tempo')
const botaoSom = document.getElementById('som')
const caixaReduzir = document.getElementById('reduzir')
const virgula = (n) => n.toFixed(1).replace('.', ',')

let renderer
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
  renderer.setClearColor(0x000000, 1)
  renderer.shadowMap.enabled = true
  renderer.shadowMap.type = THREE.PCFShadowMap
} catch (e) {
  const erro = document.getElementById('erro')
  erro.textContent = 'Este navegador não abriu o WebGL, então a animação não pode tocar aqui.'
  erro.style.display = 'grid'
  throw e
}

// Granulado de fita velha: 160×100 de ruído redesenhado a cada 3 quadros (como no app).
{
  const g = document.getElementById('granulado')
  const ctx = g.getContext('2d')
  g.width = 160
  g.height = 100
  let n = 0
  const desenhar = () => {
    if (n++ % 3 === 0) {
      const img = ctx.createImageData(160, 100)
      for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.random() * 255
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v
        img.data[i + 3] = 255
      }
      ctx.putImageData(img, 0, 0)
    }
    requestAnimationFrame(desenhar)
  }
  requestAnimationFrame(desenhar)
}

let reduzir = window.matchMedia('(prefers-reduced-motion: reduce)').matches
caixaReduzir.checked = reduzir
let cena = null
let audio = null
let pistas = null
let somLigado = false
let inicio = 0
let tocando = false

function kitDoMotor(ctx, destino) {
  const ruidos = new Map()
  return {
    ctx,
    destino,
    ruido: (segundos) => {
      const pronto = ruidos.get(segundos)
      if (pronto) return pronto
      const buffer = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * segundos), ctx.sampleRate)
      const dados = buffer.getChannelData(0)
      for (let i = 0; i < dados.length; i++) dados[i] = Math.random() * 2 - 1
      ruidos.set(segundos, buffer)
      return buffer
    },
  }
}

function ajustar() {
  if (!cena) return
  const largura = canvas.clientWidth || 1
  const altura = canvas.clientHeight || 1
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2))
  renderer.setSize(largura, altura, false)
  cena.ajustarTela(largura / altura)
}

function montar() {
  cena?.descartar()
  cena = criar(THREE, { reduzirMovimento: reduzir })
  cena.scene.traverse((o) => {
    if (o.isSpotLight || o.isPointLight) o.intensity *= Math.PI * 3.5
  })
  if (audio) {
    // O som da montagem anterior segue tocando no grafo velho: corta a saída dele.
    audio.volume.disconnect()
    audio.volume = audio.ctx.createGain()
    audio.volume.gain.value = somLigado ? 1 : 0
    audio.volume.connect(audio.ctx.destination)
    audio.kit = kitDoMotor(audio.ctx, audio.volume)
  }
  pistas = audio && cena.criarSom ? cena.criarSom(audio.kit) : null
  ajustar()
}

function tick(agora) {
  const t = (agora - inicio) / 1000
  if (t >= DURACAO) {
    // O motor fecha em preto no fim.
    cortina.style.opacity = '1'
    tempo.textContent = `${virgula(DURACAO)} s / ${virgula(DURACAO)} s`
    tocando = false
    return
  }
  const { fade } = cena.atualizar(t)
  cortina.style.opacity = String(fade)
  if (somLigado) pistas?.atualizar(t)
  renderer.render(cena.scene, cena.camera)
  tempo.textContent = `${virgula(t)} s / ${virgula(DURACAO)} s`
  requestAnimationFrame(tick)
}

function tocar() {
  inicio = performance.now()
  pistas?.reiniciar()
  if (!tocando) {
    tocando = true
    requestAnimationFrame((agora) => {
      inicio = agora
      tick(agora)
    })
  }
}

document.getElementById('repetir').addEventListener('click', tocar)
caixaReduzir.addEventListener('change', () => {
  reduzir = caixaReduzir.checked
  montar()
  tocar()
})
botaoSom.addEventListener('click', () => {
  if (!audio) {
    const ctx = new AudioContext()
    const volume = ctx.createGain()
    volume.connect(ctx.destination)
    audio = { ctx, volume, kit: kitDoMotor(ctx, volume) }
    pistas = cena.criarSom ? cena.criarSom(audio.kit) : null
  }
  somLigado = !somLigado
  audio.volume.gain.value = somLigado ? 1 : 0
  void audio.ctx.resume()
  botaoSom.setAttribute('aria-pressed', String(somLigado))
  botaoSom.textContent = somLigado ? 'Som: ligado' : 'Som: desligado'
  if (somLigado) tocar()
})

new ResizeObserver(ajustar).observe(canvas)
montar()
