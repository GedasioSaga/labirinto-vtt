tuação. Caso atingido o alvo deve rolar um Teste de Destreza ou Constituição vs Acerto do Usuário, onde se falhar o próximo golpe físico que ele receber é garantido como dano completo.","pagina":40},{"id":"mm13","nome":"Gume Relâmpago","simbolo":"*","comb":"tecnicas_ofensivas_fisicas","custo_ki":5,"custo_ki_texto":"[KI: 05]","requisitos":null,"testes":[],"efeito":"É um movimento onde o lutador endurece sua mão como uma lâmina e desfere um golpe rápido e preciso contra o corpo desprotegido do adversário. Dessa forma, faz com que o próximo golpe físico que o usuário aplicar tenha temporariamente o rótulo de “Dano Cortante” mesmo que não o tenha.","pagina":40},{"id":"mm14","nome":"Investida Fantasma","simbolo":"*","comb":"tecnicas_ofensivas_fisicas","custo_ki":3,"custo_ki_texto":"[KI: 03]","requisitos":null,"testes":[],"efeito":"É um movimento ágil onde o lutador avança rapidamente contra o oponente, podendo se deslocar 6,0m em linha sem gastar sua ação de movimento, aumentando em +3,0m para cada 1 de Ki a mais que utilizar usando a investida.","pagina":40},{"id":"mm15","nome":"Onda Impactante","simbolo":"*","comb":"tecnicas_ofensivas_fisicas","custo_ki":3,"custo_ki_texto":"[KI: 03]","requisitos":null,"testes":[],"efeito":"É uma técnica avançada onde o lutador concentra sua força em um golpe de palma devastador, liberando uma onda de impacto que se propaga à distância. Com esse movimento, ele pode executar uma técnica física corpo a corpo como se fosse à distância de 9,0 metros, aumentando esse alcance em +1,5 metros para cada ponto extra de Ki gasto. Isso permite surpreender inimigos que acreditam estar fora do alcance, além de ser uma ferramenta valiosa contra adversários ágeis ou alvos aéreos","pagina":40},{"id":"mm16","nome":"Rugido da Terra","simbolo":null,"comb":null,"custo_ki":6,"custo_ki_texto":"[KI: 06]","requisitos":null,"testes":["Destreza ou Constituição vs Acerto do Usuário"],"efeito":"É uma técnica onde o lutador concentra sua força e desfere um golpe brutal contra o solo, liberando uma onda de choque devastadora. Essa vibração se espalha em um raio de 6,0 metros, podendo desequilibrar inimigos e derrubar objetos ao redor. Qualquer adversário dentro da área sofre uma forte oscilação, sendo forçado a perder sua ação de movimento no próximo turno caso não passe em um Teste de Destreza ou Constituição vs Acerto do Usuário. Além disso, estruturas frágeis podem rachar ou até desmoronar dependendo da intensidade do golpe. O alcance pode ser ampliado para aumentar a área de efeito em +1,5 metros para cada 1 pontos extras de Ki gastos.","pagina":40},{"id":"mm17","nome":"Ciclone de Destruição","simbolo":null,"comb":null,"custo_ki":8,"custo_ki_texto":"[KI: 08]","requisitos":null,"testes":[],"efeito":"É uma técnica onde o lutador gira violentamente seu corpo com os braços estendidos, criando uma poderosa barreira de força ao seu redor. Qualquer inimigo dentro de um raio de 3 metros é forçado a se afastar 1,5 metros e perde qualquer bônus de flanqueamento contra o usuário, além de ser considerado desengajado. Além disso, o lutador se torna imune a flanqueamento até o início do seu próximo turno, dificultando ataques coordenados.","pagina":40},{"id":"mm18","nome":"Sombras Cortantes","simbolo":"*","comb":"tecnicas_ofensivas_fisicas","custo_ki":6,"custo_ki_texto":"[KI: 06]","requisitos":null,"testes":["Constituição vs Acerto do Usuário"],"efeito":"É uma técnica secreta que exige um profundo conhecimento da circulação de energia vital e da anatomia do alvo. O lutador avança em um movimento quase imperceptível e reaparece atrás do oponente sem que este perceba ter sido atingido. Durante esse instante, ele golpeia múltiplos pontos vitais do corpo do alvo, interrompendo temporariamente seu fluxo de energia. Dessa forma, caso o alvo não passe em um Teste de Constituição vs Acerto do Usuário, ele irá gastar o Dobro de Ki, no próximo golpe que ele realizar.","pagina":41},{"id":"mm19","nome":"Dança do Furacão Ascendente","simbolo":null,"comb":null,"custo_ki":2,"custo_ki_texto":"[KI: 02]","requisitos":null,"testes":[],"efeito":"É uma técnica secreta utilizada por lutadores que dominam o fluxo do vento e a força centrífuga. Ao aplicar esse golpe, o usuário transforma sua própria queda em um impulso devastador. Caso esteja no estado de caído, ele pode imediatamente executar um ataque de dano físico e, simultaneamente, se levantar sem gastar o Ki necessária para se levantar.","pagina":41},{"id":"mm20","nome":"Tempestade Tríplice","simbolo":"*","comb":"tecnicas_ofensivas_fisicas","custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":["Constituição ou Destreza vs Acerto do Usuário"],"efeito":"É uma sequência de chutes acrobáticos devastadores, onde o lutador avança rapidamente contra o oponente em pleno ar. O primeiro chute atinge a face do adversário, enquanto a outra perna já se posiciona para um segundo golpe, ainda mais impactante. Para finalizar, o lutador executa uma giratória aérea que, se bem-sucedida, força o oponente ao chão. Caso o alvo falhe em um Teste de Constituição ou Destreza vs Acerto do Usuário, ele é considerado caído, e a próxima ação ou reação que ele fizer será rolada com desvantagem.","pagina":41},{"id":"mm21","nome":"Garra do Dragão Celeste","simbolo":"*","comb":"tecnicas_ofensivas_fisicas","custo_ki":3,"custo_ki_texto":"[KI: 03]","requisitos":null,"testes":["Destreza vs Acerto do Usuário"],"efeito":"É uma técnica avançada de artes marciais que permite ao lutador adaptar seu ataque no último instante. O usuário salta no ar e, no meio do movimento, altera repentinamente sua trajetória para surpreender o oponente com um golpe poderoso. Se o ataque inicial for bem-sucedido, o lutador pode trocar a técnica utilizada no último momento (ou seja, após ver a reação e as rolagens de reação do alvo), escolhendo qualquer outro golpe físico que conheça e aplicando-o com a mesma rolagem de ataque já realizada. O alvo deve realizar um Teste de Destreza vs Acerto do Usuário, caso não passe ele não poderá mudar também a sua reação.","pagina":41},{"id":"mm22","nome":"Postura da Garça Flamejante","simbolo":null,"comb":null,"custo_ki":3,"custo_ki_texto":"[KI: 03]","requisitos":null,"testes":[],"efeito":"É uma técnica que permite ao lutador assumir uma posição equilibrada e precisa, elevando uma das pernas para preparar um chute devastador. Enquanto nessa postura, o lutador recebe um bônus de +1 no acerto de seus golpes físicos para cada rodada que ficar nessa posição, utilizar qualquer ação de movimento, o faz perder todo bônus acumulado, ou ser forçado a se movimentar por outros golpes, além disso o gasto de Ki é constante.","pagina":41},{"id":"mm23","nome":"Impacto Sísmico","simbolo":null,"comb":null,"custo_ki":3,"custo_ki_texto":"[KI: 03]","requisitos":null,"testes":["Destreza vs Acerto do Usuário","Destreza vs Acerto do Usuário"],"efeito":"É uma técnica onde o lutador canaliza sua força em um poderoso pisão no chão, gerando uma onda de impacto. Ao usá-la, ele pode escolher entre dois efeitos:\nOnda de Choque Circular: O tremor se espalha em um raio de 3,0m ao redor do lutador, forçando todos os inimigos na área a fazerem um teste de resistência de Destreza vs Acerto do Usuário. Caso falhem, são derrubados e considerados caídos.\nFenda Direcionada: O impacto concentra sua energia em uma linha reta de 9m de alcance e 1,5m de largura, atingindo todos os inimigos na trajetória.\nOs alvos devem fazer um teste de resistência de Destreza vs Acerto do Usuário. Caso falhem, são derrubados e considerados caídos.","pagina":41},{"id":"mm24","nome":"Joelho Ferido","simbolo":"*","comb":"tecnicas_ofensivas_fisicas","custo_ki":2,"custo_ki_texto":"[KI: 02]","requisitos":null,"testes":["Constituição vs Acerto do Usuário"],"efeito":"É um golpe poderoso em que o lutador desfere um chute baixo com a canela na parte externa da coxa do oponente, atingindo o nervo femoral. O impacto enfraquece a perna do alvo, dificultando seus movimentos e reduzindo sua mobilidade. Se acertado, o oponente perde metade de seu deslocamento até o início do próximo turno, caso não passe em um Teste de Constituição vs Acerto do Usuário.","pagina":42},{"id":"mm25","nome":"Bloqueio Técnico","simbolo":null,"comb":null,"custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":[],"efeito":"Esta técnica avançada de bloqueio permite ao lutador adotar posturas defensivas que se conectam diretamente a seus próprios ataques. Permite ao usuário utilizar um golpe físico como uma reação de mitigação, mesmo que não tenha essa função e esse rótulo.","pagina":42},{"id":"mm26","nome":"Defletir Ki","simbolo":null,"comb":null,"custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":[],"efeito":"Essa técnica permite ao usuário concentrar sua força no punho para desviar um projétil direcionado a ele, rebatendo-o para longe. Para executar esse movimento, ambos os combatentes devem estar no mínimo, na mesma Escala de Poder. O usuário pode utilizá-lo como uma reação, gastando a mesma quantidade de Ki que o atacante empregou no golpe. O sucesso da defesa depende de um Teste de Força contra o Acerto do oponente; caso o resultado do usuário seja superior, o ataque é anulado e repelido.","pagina":42},{"id":"mm27","nome":"Treino com Pesos","simbolo":null,"comb":null,"custo_ki":10,"custo_ki_texto":"[KI: 10]","requisitos":null,"testes":[],"efeito":"Essa técnica permite ao usuário utilizar uma roupa mais pesada que o comum durante a batalha, enquanto ele estiver utilizando essa roupa ele terá que pagar constantemente o custo de PK’s desse movimento marcial. A cada rodada que ele fica pagando esse custo e lutando com essa desvantagem, ele acumula +01 em sua CA além de 1,5m de deslocamento a mais, esse acumulo pode ir ao máximo da sua Escala de Poder Base. Após retirar as roupas pesadas, e desfrutar dos benefícios, eles ficam ativos até o final da batalha.","pagina":42},{"id":"mm28","nome":"Postura da Brutalidade","simbolo":null,"comb":null,"custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":[],"efeito":"Ao usar essa técnica, você sacrifica toda a sua defesa no até o final de seu próximo turno (sua CA cai pela metade), mas em contra partida aumenta os estágios de dano causados por você em +01 pelo mesmo período. Caso sua técnica já tenha chegado ao estágio de dano máximo, ela ganha um bônus de dano extra igual ao mínimo de dano que ela causaria.","pagina":42},{"id":"mm29","nome":"Postura do Equilíbrio","simbolo":null,"comb":null,"custo_ki":5,"custo_ki_texto":"[KI: 05]","requisitos":null,"testes":[],"efeito":"Para ativar essa postura você deve ter menos de 50% da sua Vida. Ao realizar ela seus movimentos marciais usados apenas durante o seu turno de ação, tem 50% de chance de não consumirem Ki ao serem utilizados, enquanto você mantiver essa postura.","pagina":42},{"id":"mm30","nome":"Postura do Sacrifício","simbolo":null,"comb":null,"custo_ki":6,"custo_ki_texto":"[KI: 06]","requisitos":null,"testes":[],"efeito":"Você pode ativar essa postura no início do seu turno de ação, ela possibilita que você utilize técnicas ofensivas pagando Pontos de Vida por isso, em uma proporção de 2:1, ou seja, 2 PV’s equivalem a 1 PK, desde que você esteja com 0 PK’s. Você apenas pode usar esse benefício durante seu turno de ação, e uma quantidade de vezes igual a sua Escala de Poder Base, ou seja, se você por exemplo tem 2 de EP durante seu turno de ação você pode usar duas técnicas ofensivas gastando Pontos de Vida por isso, desde que você tenha chegado a 0 PK’s durante o turno de ação.","pagina":42},{"id":"mm31","nome":"Postura do Terror","simbolo":null,"comb":null,"custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":["Sabedoria vs Acerto da Técnica"],"efeito":"Você pode ativar essa postura no início do seu turno de ação, você adota uma postura que eleva a sua aura e retira o espírito de luta dos seus inimigos. Após a ativação, uma aura de raio ao seu redor igual a sua Escala de Poder sendo 1 EP = 1,5m se faz presente, todos na área que tiverem uma EP menor do que a sua devem fazer um Teste de Sabedoria vs Acerto da Técnica, onde se não passarem, perdem o direito a turno de reação enquanto estiverem na área da sua aura, ao saírem podem reagir, mas, ao entrar novamente devem fazer a mesma rolagem.","pagina":43},{"id":"mm32","nome":"Postura da Destruição","simbolo":null,"comb":null,"custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":[],"efeito":"Você adota uma postura agressiva, que faz com que seus golpes físicos de toque usados no turno de ação causem dano as estruturas e ao chão ao redor, os rachando. Ao desferir um golpe físico de toque, ele transforma a área ao seu redor igual a sua Escala de Poder sendo 1 EP = 1,5m em “Terreno Difícil”, ou seja, o deslocamento no local é considerado pela metade até o final da batalha.","pagina":43},{"id":"mm33","nome":"Postura da Velocidade","simbolo":null,"comb":null,"custo_ki":5,"custo_ki_texto":"[KI: 05]","requisitos":null,"testes":[],"efeito":"Você adota essa postura e foca completamente na sua velocidade de ataque até o final do seu turno de ação, sempre que você acertar uma técnica física ofensiva sem o rótulo de “Técnica Básica”, após isso você é capaz de utilizar uma “Técnica Básica” de Rank D ou inferior sem gastar PK’s ou receber modificador negativo.","pagina":43},{"id":"mm34","nome":"Soco Perfeito","simbolo":"*","comb":"tecnicas_ofensivas_fisicas","custo_ki":6,"custo_ki_texto":"[KI: 06]","requisitos":null,"testes":["Constituição vs Acerto da Técnica"],"efeito":"Você faz com que sua próxima técnica ofensiva física de alcance de toque seja capaz de ignorar CA bônus adquirida por técnicas do seu inimigo ou armaduras, considerando assim apenas a CA base do alvo, desde que ele não passe em um Teste de Constituição vs Acerto da Técnica.","pagina":43},{"id":"mm35","nome":"Postura da Efetividade","simbolo":null,"comb":null,"custo_ki":7,"custo_ki_texto":"[KI: 07]","requisitos":null,"testes":[],"efeito":"Você adota uma postura a qual faz com que seus ataques físicos corpo a corpo tenham o mínimo de desgaste de energia possível. Ao realizar um ataque deste tipo durante seu turno de ação e errar seu inimigo, metade dos seus PK’s gastos é reaproveitada e retorna para você.","pagina":43},{"id":"mm36","nome":"Punho Descarregado","simbolo":"*","comb":"tecnicas_ofensivas_fisicas","custo_ki":"Variável","custo_ki_texto":"[KI: Variável]","requisitos":null,"testes":[],"efeito":"Ao usar este movimento, você pode abrir mão de todo seus PK’s restantes para causar +1 de dano bônus no seu próximo ataque físico corpo a corpo para cada 1 pontos de PK’s sacrificados até uma quantidade a sua escolha.","pagina":43},{"id":"mm37","nome":"Passo Vetorial","simbolo":"*","comb":"tecnicas_ofensivas_ki","custo_ki":3,"custo_ki_texto":"[KI: 03]","requisitos":null,"testes":[],"efeito":"O lutador dispara micro-impulsos de Ki nos pés e quadris, mudando o próprio ângulo de ataque num instante. Como Ação, desloque-se até X metros de voo sem gastar sua ação de movimento e sem provocar Ataque de Oportunidade, onde X é igual a sua Escala de Poder na proporção de 1:1,5m. Se fizer um ataque desde que técnica ofensiva de ki logo depois, recebe +2 no Acerto. Como Reação, quando um ataque errar sua CA por até 2 pontos ou mais, você pode se deslocar 1,5m imediatamente, sem provocar ataques de oportunidade.","pagina":43},{"id":"mm38","nome":"Estalo Fotônico","simbolo":"*","comb":"tecnicas_ofensivas_ki","custo_ki":3,"custo_ki_texto":"[KI: 03]","requisitos":null,"testes":["Constituição vs Acerto do Usuário"],"efeito":"Ao concentrar seu Ki em uma técnica ofensiva, propositalmente você aumenta sua emissão de poder, gerando um clarão seco e brutal. Personagens que consigam te enxergar de frente fazem Teste de Constituição vs Acerto do Usuário, em falha ficam Cegos até o fim do próximo turno de ação deles. Os alvos atingidos podem gastar uma quantidade de PK’s igual a EP do usuário em reação, para representar que rapidamente fecharam os olhos.","pagina":44},{"id":"mm39","nome":"Interferência","simbolo":"*","comb":"tecnicas_ofensivas_ki","custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":["Inteligência vs Acerto da Técnica"],"efeito":"O usuário utiliza seu Ki para enfraquecer o ataque do inimigo desferido contra ele, usando rajadas ou esferas concentradas. Dessa forma, em reação o usuário realiza um Teste de Inteligência vs Acerto da Técnica, se vencer, reduza o dano sofrido em 1 estágio. Se isso fizer o dano cair para abaixo do estágio mínimo, o usuário ganha em reação, a oportunidade de realizar uma técnica ofensiva de ki, do mesmo rank utilizando pelo atacante, sem o gasto de PK’s. Caso opte por não fazer isto, é permitido então que ele possa utilizar novamente esse movimento como reação.","pagina":44},{"id":"mm40","nome":"Afinar Ki","simbolo":"*","comb":"tecnicas_ofensivas_ki","custo_ki":6,"custo_ki_texto":"[KI: 06]","requisitos":null,"testes":[],"efeito":"O usuário afina o Ki em um fio de impacto e o injeta no golpe, criando um corte energético de altíssima precisão, fazer isso permite que uma técnica ofensiva de Ki tenha o rótulo de dano “Cortante”, mesmo que não o tenha naturalmente. Adicionalmente, se o alvo receber dano máximo, este recebe a condição negativa “Sangrando”, sem direito a testes de resistência a aplicação.","pagina":44},{"id":"mm41","nome":"Nódulo de Supressão","simbolo":"*","comb":"tecnicas_ofensivas_ki","custo_ki":null,"custo_ki_texto":null,"requisitos":null,"testes":["Constituição vs Acerto do Usuário"],"efeito":"O usuário concentra seu disparo de Ki em atingir um ponto do fluxo energético do alvo, travando o Ki dele por um instante. Ao utilizar esse movimento, caso acerte o alvo com uma técnica ofensiva de Ki, este deve realizar um Teste de Constituição vs Acerto do Usuário, em caso de falha fica “Sobrecarregado”, se o alvo já estiver sob esse efeito, em vez disso, até o final de seu próximo turno de ação, as técnicas gerais do alvo custam + X Ki adicionais, onde X é a Escala de Poder do Usuário.","pagina":44},{"id":"mm42","nome":"Postura do Círculo Vazio","simbolo":null,"comb":null,"custo_ki":2,"custo_ki_texto":"[KI: 02]","requisitos":null,"testes":[],"efeito":"Você assume uma guarda compacta, de braços curtos e eixo central fechado, própria para disparos quase colados ao corpo do oponente. Até o início do seu próximo turno de ação:\nsuas técnicas de Ki de longo alcance usadas contra inimigos não sofrem a desvantagem de Combate Sob Ameaça;\no usuário se torna capaz de utilizar técnicas de ki de longo alcance em reação para causar mitigação de dano mesmo sem o rótulo reativo ou defensivo, quando receber ataques de técnicas ofensivas que tenham o alcance de toque.","pagina":44},{"id":"mm43","nome":"Película de Ki","simbolo":null,"comb":null,"custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":["Inteligência vs Acerto do Usuário"],"efeito":"Você ergue uma película curva de Ki na frente do corpo e desvia o grosso de uma rajada. Quando for alvo de uma técnica de Ki de projétil, linha ou rajada, faça um Teste de Inteligência vs Acerto do Usuário. Se vencer, reduza o dano em 1 estágio. Se o ataque cair para erro ou dano mínimo, você pode redirecionar o resíduo para outro alvo utilizando o mesmo alcance da trajetória original e o mesmo acerto do usuário, a outro alvo que possa ser atingido.","pagina":44},{"id":"mm44","nome":"Leitura de Fluxo","simbolo":null,"comb":null,"custo_ki":3,"custo_ki_texto":"[KI: 03]","requisitos":null,"testes":["Perícia “Análise” vs o Acerto do Usuário"],"efeito":"Ao ver o padrão energético de um oponente, você “lê” a assinatura daquela técnica e passa a antecipá-la. Após testemunhar um inimigo usar uma técnica ofensiva contra você, marque essa técnica até o final do seu próximo turno de ação. Na próxima vez que ele usar essa mesma técnica, você pode realizar um Teste de Perícia “Análise” vs o Acerto do Usuário, caso vença você recebe:\n+2 na CA contra ela, e\nvantagem no teste para resistir a qualquer condição negativa que ela aplique.","pagina":45},{"id":"mm45","nome":"Asa Impulsora","simbolo":null,"comb":null,"custo_ki":2,"custo_ki_texto":"[KI: 02]","requisitos":null,"testes":[],"efeito":"Você libera um impulso de Ki curto e lateral, como se criasse uma “asa” momentânea de energia para mudar a linha do corpo no ar. Se estiver voando, você pode mudar 1 nível de altura sem pagar o custo normal dessa alteração. Se usar este movimento antes de um ataque ou técnica ofensiva no mesmo turno, recebe +2 no Acerto contra alvos em nível diferente do seu. Como Reação, pode usá-lo para evitar queda imediata sem precisar do teste normal de estabilização.","pagina":45},{"id":"mm46","nome":"Ruptura de Cadência","simbolo":null,"comb":null,"custo_ki":2,"custo_ki_texto":"[KI: 02]","requisitos":null,"testes":["Inteligência vs Teste do Atributo de Acerto do Usuário da técnica a qual está se beneficiando dos rótulos ou tipo de ação citados anteriormente"],"efeito":"Você emite uma onda de Ki em reação com alcance até 9,0m e precisa que quebra o timing da técnica inimiga, desfazendo sua preparação. Quando um inimigo iniciar uma técnica com Carregamento, Concentração, Ação Oculta ou outro preparo explícito, faça um Teste de Inteligência vs Teste do Atributo de Acerto do Usuário da técnica a qual está se beneficiando dos rótulos ou tipo de ação citados anteriormente.\nSe vencer, a preparação é interrompida.\nO alvo perde o Ki já investidos no processo.\nSe a técnica já estivesse parcialmente pronta, ela se torna “Previsível” até o fim do próximo turno do alvo, concedendo +2 de CA contra ela.","pagina":45},{"id":"mm47","nome":"Postura da Emissão Serena","simbolo":null,"comb":null,"custo_ki":2,"custo_ki_texto":"[KI: 02]","requisitos":null,"testes":[],"efeito":"O usuário desacelera a respiração, alinha ombros, quadril e fluxo de Ki, assumindo uma base perfeita para disparos de longo alcance. Até o início do seu próximo turno de ação:\na primeira técnica ofensiva de Ki de longo alcance em alvo único que você usar recebe +1 no Acerto;\ncaso a primeira técnica ofensiva de ki de longo alcance seja em área, ela não irá causar danos a aliados dentro da área;\nse você não tiver se movido antes de dispará-la, ela também ignora coberturas.","pagina":45},{"id":"mm48","nome":"Costura Vetorial","simbolo":"*","comb":"tecnicas_ofensivas_ki","custo_ki":1,"custo_ki_texto":"[KI: 01]","requisitos":null,"testes":[],"efeito":"Com pequenos ajustes nos dedos, pulsos e olhar, o usuário dobra sutilmente a linha de emissão da técnica, costurando sua trajetória pelo campo. Ao usar uma técnica ofensiva de Ki que tenha o alcance de rastro, você evita que mesmo que um alvo aliado esteja na trajetória, ele não seja atingido.","pagina":45},{"id":"mm49","nome":"Âncora de Pulso","simbolo":"*","comb":"tecnicas_ofensivas_ki","custo_ki":2,"custo_ki_texto":"[KI: 02]","requisitos":null,"testes":["Inteligência vs Acerto do Usuário"],"efeito":"O usuário fixa o próprio fluxo energético em um único eixo, impedindo que impactos, tremores ou dor quebrem a estabilidade da emissão. Até o início do seu próximo turno de ação, a primeira vez que você: sofrer dano, for empurrado, ou receber uma condição que normalmente atrapalharia uma técnica em preparo, você pode fazer um Teste de Inteligência vs Acerto do Usuário. Se passar, mantém normalmente sua Concentração, Carregamento, Postura ou preparação de técnica.","pagina":45},{"id":"mm50","nome":"Recuo Balístico","simbolo":"*","comb":"tecnicas_ofensivas_ki","custo_ki":2,"custo_ki_texto":"[KI: 02]","requisitos":null,"testes":[],"efeito":"O usuário aproveita o próprio recuo da emissão para deslizar o corpo, reposicionando-se logo após disparar ou logo antes de ser alcançado. Sempre que você usar uma técnica ofensiva de Ki à distância, pode gastar este movimento para: mover-se 3m, ou subir/descer 1 nível de altura no combate aéreo sem pagar o custo normal. Esse deslocamento não provoca Ataque de Oportunidade.","pagina":46},{"id":"mm51","nome":"Círculo de Pré-Mira","simbolo":"*","comb":"tecnicas_ofensivas_ki","custo_ki":2,"custo_ki_texto":"[KI: 02]","requisitos":null,"testes":[],"efeito":"O usuário analisa microvariações de postura, fluxo de Ki e padrão respiratório do alvo, criando um disparo “pré-calibrado”. Escolha 1 alvo visível. Até o início do seu próximo turno de ação, a primeira técnica ofensiva de Ki de longo alcance que você usar contra ele: recebe +1 estágio de dano, caso acerte; mas você não pode aplicar esse benefício contra outro alvo.","pagina":46},{"id":"mm52","nome":"Reserva de Reflexo","simbolo":"*","comb":"tecnicas_ofensivas_ki","custo_ki":2,"custo_ki_texto":"[KI: 02]","requisitos":null,"testes":[],"efeito":"Ao invés de gastar toda sua energia em ofensiva, o usuário retém parte do fluxo em circulação curta, mantendo uma reserva de resposta instantânea. Durante seu turno de ação, após usar pelo menos 1 técnica ofensiva de Ki, você pode ativar esta técnica. Até o início do seu próximo turno:\nos próximos 2 Ki que você gastar em reações são considerados já preparados;\nna prática, a primeira reação de Ki que você usar nesse período tem seu custo reduzido em 2 Ki (mínimo 1).","pagina":46},{"id":"mm53","nome":"Leitura de Guarda","simbolo":null,"comb":null,"custo_ki":2,"custo_ki_texto":"[KI: 02]","requisitos":null,"testes":["Análise vs Teste de Percepção do Alvo"],"efeito":"Você observa o padrão de respiração, apoio e guarda do alvo, identificando a falha mais provável em sua defesa. Faça um Teste de Análise vs Teste de Percepção do Alvo, se vencer, até o início do seu próximo turno: seu próximo ataque contra esse alvo recebe +01 no Acerto.","pagina":46},{"id":"mm54","nome":"Finta de Assinatura","simbolo":null,"comb":null,"custo_ki":5,"custo_ki_texto":"[KI: 05]","requisitos":null,"testes":["Enganação vs Sentido de Ki ou Percepção do alvo"],"efeito":"Você altera seu fluxo de Ki e intenção corporal por um instante, escondendo o verdadeiro vetor do golpe. Faça um Teste de Enganação vs Sentido de Ki ou Percepção do alvo. Se vencer:\no alvo sofre -2 na CA contra sua próxima técnica ofensiva ou técnica básico até o fim do seu próximo turno;\nse usada como Reação, você também pode impor desvantagem ao primeiro ataque que ele fizer contra você até o fim do turno atual.","pagina":46},{"id":"mm55","nome":"Postura do Caçador","simbolo":null,"comb":null,"custo_ki":3,"custo_ki_texto":"[KI: 03]","requisitos":null,"testes":[],"efeito":"Você assume uma movimentação econômica, previsora e paciente, típica de quem caça sem desperdiçar energia. Até o início do seu próximo turno: você ignora a primeira penalidade narrativa de terreno difícil, obstáculos leves ou visibilidade parcial; recebe +2 em testes para rastrear, perseguir ou manter pressão sobre um alvo em fuga; se atacar um alvo que tentou se afastar de você desde seu turno anterior, recebe +2 no Acerto contra ele.","pagina":46},{"id":"mm56","nome":"Expansão de Intimidação","simbolo":null,"comb":null,"custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":[],"efeito":"Seu Ki se expande de forma opressiva, forçando o alvo a hesitar, mesmo antes do ataque. Faça um teste de Intimidação resistido por Sabedoria ou Presença do alvo. Se vencer, ele fica “Intimidado”. Se já estiver “Intimidado”, em vez disso ele fica “Exposto” até o início do próximo turno dele.","pagina":46},{"id":"mm57","nome":"Diagnóstico de Combate","simbolo":null,"comb":null,"custo_ki":3,"custo_ki_texto":"[KI: 03]","requisitos":null,"testes":[],"efeito":"Você trata o corpo e o fluxo energético do oponente como um sistema a ser desmontado, prevendo colapsos e tensões. Escolha um alvo visível e faça um teste de Ciência resistido por Constituição ou Análise do alvo. Se vencer, escolha 1:\ndescobrir qual atributo entre FOR, DES ou CON parece mais vulnerável naquele momento;\nreceber +2 na próxima rolagem para aplicar condição negativa contra ele;\nfazer com que a próxima condição Quebrado, Sobrecarregado ou Desnorteado aplicada a ele tenha a CD aumentada em +2.","pagina":47},{"id":"mm58","nome":"Eco de Sentido","simbolo":null,"comb":null,"custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":[],"efeito":"Você lê a oscilação do Ki inimigo antes da manifestação completa do ataque. Quando um inimigo a até alcance sensorial usar uma técnica de Ki, faça um teste em reação de Sentido de Ki resistido por Controle de Ki do Alvo. Se vencer, escolha 1:\nreceber +2 na CA contra essa técnica;\nreceber vantagem no teste contra a condição que ela aplicar;\nidentificar se a técnica possui carregamento, armadilha, ricochete, guiada ou efeito oculto, se houver.","pagina":47},{"id":"mm59","nome":"Palavra de Eixo","simbolo":null,"comb":null,"custo_ki":3,"custo_ki_texto":"[KI: 03]","requisitos":null,"testes":[],"efeito":"Você usa um comando calmo, preciso e carregado de presença para recentrar um aliado em meio ao caos. Escolha um aliado que possa ouvi-lo ou percebê-lo. Faça um teste de Persuasão contra CD 10 ou contra a CD da condição, a critério do narrador. Se passar, escolha 1:\no aliado ignora os efeitos de Desnorteado até o fim do próximo turno dele;\no aliado recebe +2 no próximo teste resistido que fizer até o início do seu próximo turno;\no aliado reduz em X o custo de Ki da próxima reação que usar, onde X é a Escala de Poder do usuário.","pagina":47},{"id":"mm60","nome":"Arquivo de Lendas","simbolo":null,"comb":null,"custo_ki":1,"custo_ki_texto":"[KI: 01]","requisitos":null,"testes":[],"efeito":"Você recupera instantaneamente referências de estilos, técnicas famosas, arquétipos de raça ou comportamentos clássicos de combate. Faça um teste de Conhecimento contra uma CD definida pelo narrador conforme o alvo. Se passar, escolha 1 informação mecânica sobre ele: um talento/estilo provável; uma fraqueza tática visível; a natureza do tipo de técnica que ele mais favorece; uma pista sobre transformação, origem ou padrão de luta. Podendo ser usado uma vez por alvo em combate.","pagina":47},{"id":"mm61","nome":"Janela de Percepção","simbolo":null,"comb":null,"custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":[],"efeito":"Seu olhar capta a mínima abertura deixada por um golpe largo, impulso exagerado ou técnica mal encaixada. Quando um inimigo errar um ataque contra você por 2 ou mais pontos, faça um teste de Percepção resistido por Destreza ou Análise dele. Se vencer, você pode imediatamente escolher 1:\nmover-se X metros sem provocar Ataque de Oportunidade, onde X é igual a Escala de Poder do Usuário em proporção 1:1,5m;\nreceber +2 no Acerto contra esse alvo até o fim do seu próximo turno;\nfazer com que ele fique “Desequilibrado” se estiver voando.","pagina":47},{"id":"mm62","nome":"Blefe","simbolo":null,"comb":null,"custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":[],"efeito":"Você finge fraqueza, quebra de guarda ou exaustão para induzir o inimigo a se expor demais. Quando um inimigo declarar um ataque contra você, antes da rolagem, faça um teste de Enganação resistido por Percepção ou Análise dele. Se vencer: o ataque dele sofre -2 no Acerto; e, se ainda assim errar, o inimigo fica Exposto até o início do próximo turno dele.","pagina":48},{"id":"mm63","nome":"Rastro de Presságio","simbolo":null,"comb":null,"custo_ki":2,"custo_ki_texto":"[KI: 02]","requisitos":null,"testes":[],"efeito":"Você lê microvestígios do ambiente, fluxo de poeira, vento, marcas de deslocamento e resíduos de Ki para prever a rota de fuga. Escolha um inimigo que tenha se movido desde o último turno dele. Faça um teste de Sobrevivência resistido por Furtividade, Destreza ou Enganação do alvo. Se vencer, até o fim da rodada: você sempre sabe a direção imediata do deslocamento dele; ignora camuflagem leve e truques simples de ocultação dele; recebe +2 no Acerto contra esse alvo se ele estiver em cobertura parcial ou fugindo.","pagina":48},{"id":"mm64","nome":"Manto de Intenção Vazia","simbolo":null,"comb":null,"custo_ki":2,"custo_ki_texto":"[KI: 02]","requisitos":null,"testes":[],"efeito":"Você reduz ao mínimo suas flutuações emocionais e energéticas, tornando difícil prever sua intenção real. Até o início do seu próximo turno: testes de Análise, Percepção, Sentido de Ki ou Enganação feitos para antecipar você sofrem -2; a primeira vez que você usar uma técnica ofensiva nesse período, o alvo não pode ganhar bônus por leitura prévia, salvo habilidade específica.","pagina":48}],"racas":[{"id":"androide","nome":"ANDROIDES","vida":10,"variantes":[{"nome":"ANDROIDES ILIMITADOS","tracos":[{"nome":"Indetectável","efeito":"Não pode ser detectado por Ki Sense ou Rastreadores. Seu Poder de Luta é indefinível para terceiros, pois é completamente artificial."},{"nome":"Núcleo de Energia Renovável","efeito":"Ao chegar a 0 Pontos de Ki, o Androide pode continuar a gastar energia em valores negativos até um limite igual ao seu total de Pontos de Ki. Rolagens feitas com os valores negativos de Ki são feitas com desvantagem pelo superaquecimento. Ao atingir o limite do seu valor negativo de Ki, o núcleo do Androide entra em colapso e ele fica atordoado até o final de sua próxima rodada, perdendo também sua CA nesse processo, ficando completamente vulnerável. Os ilimitados não são afetados pela regra de Exaustão de Ki."},{"nome":"Traço Racial Secundário","efeito":"Pode escolher um traço racial de sua base biológica (ex: Terráqueo) para incorporar ao seu Androide."}]},{"nome":"ANDROIDES ABSORVENTES","tracos":[{"nome":"Indetectável","efeito":"Não pode ser detectado por Ki Sense ou Rastreadores. Seu Poder de Luta é indefinível para terceiros, pois é completamente artificial."},{"nome":"Drenar Energia","efeito":"Pode realizar uma ação de agarrar contra um inimigo e, caso tenha sucesso, absorver 10% dos Pontos de Ki totais do alvo a cada turno enquanto mantiver o agarro. Este Ki absorvido, não poderá ser recuperado pelo alvo até o final da batalha."},{"nome":"Absorção Passiva","efeito":"Quando atingido por uma técnica de energia, recupera metade dos Pontos de Ki gastos pelo inimigo para lançar a técnica, não podendo ultrapassar o armazenamento seu valor de ki total."}]},{"nome":"CIBORGUES","tracos":[{"nome":"Indetectável","efeito":"Não pode ser detectado por Ki Sense ou Rastreadores. Seu Poder de Luta é indefinível para terceiros, pois é completamente artificial."},{"nome":"Inorgânico","efeito":"Por serem feitos em sua maioria de partes artificiais não precisem comer, eles precisam hidratar. Também, suas células se deterioram mais lentamente, então eles envelhecem também lentamente, sendo comparados quase a imortalidade temporal."},{"nome":"Imunidade Cibernética","efeito":"Imune a efeitos negativos no geral que não envolvam destruir ou imobilizar seu corpo."}]},{"nome":"BIO-ANDROIDES","tracos":[{"nome":"Composição Genética Múltipla","efeito":"Pode escolher até 3 características raciais diferentes sendo vetadas as características especiais, cada uma de uma raça distinta as combinando. Caso tenha sido criado a partir das células e informações de outros guerreiros, tem acesso as técnicas que estes tinham no momento da coleta, tendo todas as técnicas consideradas como “ativas” sem estar na contagem dos seus Slot’s de Técnicas. Caso queira ter mais características além dos três padrões, para cada nova característica sofre uma redução de -2 em dois atributos à escolha do Narrador, representando a dificuldade de estabilizar sua biologia híbrida, de forma acumulativa."}]}],"transf":[]},{"id":"freeza_clan","nome":"FREEZA CLAN","vida":14,"variantes":[{"nome":"VARIAÇÃO ÚNICA (FREEZA CLAN)","tracos":[{"nome":"Duro de Matar","efeito":"Membros do Clã de Freeza não morrem ao chegar a 0 PV (Pontos de Vida). Eles continuam lutando normalmente até atingirem um valor negativo igual à metade de sua vida total. No entanto, enquanto nesse estágio todas as rolagens feitas por ele são em desvantagem, assim como as feitas contra ele são com vantagem."},{"nome":"Supremacia Biológica","efeito":"Não precisam respirar e são imunes a venenos, doenças e efeitos de fadiga. Podem sobreviver no vácuo do espaço sem penalidades e não precisam rolar fazer Teste de Salvaguarda contra Morte ao serem derrotados. Se seu corpo não for desintegrado, ele vai permanecer vivo e irá voltar a vida depois de um descanso longo."},{"nome":"Mutações Genéticas","efeito":"O Clã de Freeza não precisa de anos para crescer em força— eles nascem poderosos. Treinam e evoluem o dobro da velocidade de outras raças (Interpretativo). Gastam metade dos Slots de Técnica para aprender golpes, permitindo que acumulem mais técnicas que outras raças."}]}],"transf":[]},{"id":"majin","nome":"MAJIN","vida":12,"variantes":[{"nome":"VARIAÇÃO ÚNICA (MAJIN)","tracos":[{"nome":"Regeneração Sobrenatural","efeito":"A matéria viva que compõe um Majin se reconstrói rapidamente, tornando-os incrivelmente resistentes. Ao final de cada rodada, podem regenerar metade do maior dano individual sofrido naquela rodada, mesmo que sua vida tenha chegado a 0. Um Majin apenas morre se receber dano negativo igual a sua vida total enquanto estiver com 0 de vida, esperando o início de seu próximo turno para se regenerar. Se regenerar após ter ficado com 0 pontos de vida, implica no Majin começar seu turno com metade do seu Ki total."},{"nome":"Morfologia Caótica","efeito":"A biologia dos Majins desafia as leis naturais, permitindo que alterem sua estrutura corporal conforme necessário. Uma vez por rodada de ataque, podem substituir temporariamente seu maior atributo por outro para utilizar seu modificador na próxima ação. Esse ajuste consome Ki igual ao modificador trocado. Além disso, podem realizar ataques físicos de toque a até 6 metros de distância, esticando seus membros, podendo esticar ainda mais gastando 1 Ponto de Ki por mais 1,5m de alcance. São imunes a restrições como ao agarrar, imobilizações ou qualquer condição que os impeça de se mover, devido à sua constituição maleável. No entanto, essa imunidade não se aplica contra adversários com Escala de Poder pelo menos dois níveis acima da sua."}]}],"transf":[]},{"id":"namekuseijin","nome":"NAMEKUSEIJINS","vida":10,"variantes":[{"nome":"CLÃ GUERREIRO","tracos":[{"nome":"Corpo do Guerreiro","efeito":"O Namekuseijin pode gastar 1 de Ki para estender seus braços ou pernas, aumentando seu alcance em +6 metros. Além disso, ele pode ampliar ainda mais essa distância ao gastar 1 pontos de Ki para cada +1,5 metro adicional. Com essa habilidade, o Namekuseijin pode agarrar inimigos à distância, realizar técnicas que normalmente exigiriam alcance de toque e até mesmo puxar o inimigo até si ou se impulsionar em direção a ele, criando diversas possibilidades estratégicas em combate."},{"nome":"Regeneração de Namek","efeito":"Desde que a cabeça não seja destruída, qualquer ferimento (inclusive perda de membros ou órgãos) é regenerável. Ao utilizar uma ação, onde se gasta a mesma quantidade de Ki que o inimigo gastou para causar aquele o dano, o Namek o regenera por completo. Fazer isto é extremamente cansativo, então o Namek não recupera o Ki gasto para a regeneração apenas na rodada seguinte."},{"nome":"Sobrevivência Prolongada","efeito":"Não precisam comer, apenas ingerir água, podendo passar longos períodos sem ela. Além disso, envelhecem de forma extremamente lenta, sendo considerados quase imortais em termos biológicos."}]},{"nome":"CLÃ DRAGÃO","tracos":[{"nome":"Regeneração de Namek","efeito":"Desde que a cabeça não seja destruída, qualquer ferimento (inclusive perda de membros ou órgãos) é regenerável. Ao utilizar uma ação, onde se gasta a mesma quantidade de Ki que o inimigo gastou para causar aquele o dano, o Namek o regenera por completo. Fazer isto é extremamente cansativo, então o Namek não recupera o Ki gasto para a regeneração apenas na rodada seguinte."},{"nome":"Sobrevivência Prolongada","efeito":"Não precisam comer, apenas ingerir água, podendo passar longos períodos sem ela. Além disso, envelhecem de forma extremamente lenta, sendo consid ial/Ritual","efeito":"Pode ser usado para técnicas únicas, ou rituais Ki."},{"nome":"Esfera do Dragão","carga":1,"tipo":"Narrativo/Lendário","efeito":"As famosas esferas, não preciso falar muito né?"},{"nome":"Cápsula com Casa Portátil","carga":3,"tipo":"Narrativo","efeito":"Contém um pequeno lar funcional. Ideal para descanso."},{"nome":"Roupas Tradicionais (Gi)","carga":1,"tipo":"Narrativo","efeito":"Estilo do personagem. Pode ser estilizada com brasões ou símbolos."},{"nome":"Cinto com Bolsas Extras","carga":1,"tipo":"Acessório","efeito":"Concede +2 espaços de item temporariamente. Não acumulativo."}]}</script>

/* ================= Motor de técnica (regras do cap. IV) ================= */
function tipoRotulo(L) {
  const t = L.cp.tipo;
  if (t === 'consome_todos_positivos_base') return 'todos';
  if (t === 'variavel_com_minimo') return 'vmin';
  if (t === 'variavel' || t === 'igual_ao_efeito_negativo') return 'var';
  if (t === 'faixa') return 'faixa';
  if (L.nome === 'Aumentar Dano por Ki') return 'danoki';
  if (L.acumula === true && L.categoria !== 'tipo_dano') return 'multi';
  return 'fixo';
}
const ehNeg = (L) => L.categoria === 'negativo';
function qInicial(L) { const k = tipoRotulo(L); return k === 'vmin' ? Math.abs(L.cp.min) : 1; }
function custoRotulo(L, q, ctx) {
  const k = tipoRotulo(L);
  if (k === 'todos') return ctx.pb;
  if (L.nome === 'Efeito Negativo' && ctx.area) return ctx.pb + q;
  if (k === 'fixo' || k === 'danoki') return L.cp.min;
  if (k === 'multi') return L.cp.min * q;
  return (ehNeg(L) ? -1 : 1) * q;
}
function kiRotulo(L, q) {
  const mk = L.ki; if (!mk) return 0;
  const k = tipoRotulo(L);
  if (k === 'danoki') return q;
  if (k === 'vmin' && !ehNeg(L)) return (mk.inicial || 0) + (mk.por_ponto_extra || 0) * (q - Math.abs(L.cp.min));
  if (typeof mk.inicial === 'number') return mk.inicial;
  if (typeof mk.por_rotulo === 'number') return mk.por_rotulo * q;
  if (typeof mk.por_ponto_negativo === 'number') return mk.por_ponto_negativo * q;
  return 0;
}
function alcanceM(L, q) {
  const a = L.al; if (!a) return null;
  const base = a.inicial_m != null ? a.inicial_m : a.raio_externo_m;
  if (base == null) return null;
  const extra = tipoRotulo(L) === 'vmin' ? q - Math.abs(L.cp.min) : 0;
  return base + (a.por_ponto_extra_m || 0) * extra;
}
function temMagoDeKi() { return S.ch.escolhas.indexOf('tl22') >= 0; }

function computa(cfg) {
  const R = RK[cfg.rank]; const pb = R.pb; const tipo = TIPO[cfg.tipo];
  const sel = cfg.rotulos.map((e) => ({ e, L: LBL[LBL_I[e.n]] })).filter((x) => x.L);
  const nomes = new Set(sel.map((x) => x.L.nome));
  const area = sel.some((x) => AREA.has(x.L.nome));
  const ctx = { pb, area };
  let pos = tipo.custo, neg = 0;
  sel.forEach((x) => { const c = custoRotulo(x.L, x.e.q, ctx); x.custo = c; if (c < 0) neg += -c; else pos += c; });
  const negConta = Math.min(neg, pb);
  const teto = pb + negConta;
  const acima = pos - teto;
  let ki = R.kmin; const kiPartes = [['Mínimo do Rank ' + R.rank, R.kmin]];
  sel.forEach((x) => { const k = kiRotulo(x.L, x.e.q); x.ki = k; if (k) { ki += k; kiPartes.push([curto(x.L.nome), k]); } });
  const exaustiva = nomes.has('Exaustiva');
  const dk = sel.find((x) => x.L.nome === 'Aumentar Dano por Ki');
  const inv = dk ? dk.e.q : 0;
  const danoBruto = R.dmin + 4 * inv;
  const dano = Math.min(R.dmax, danoBruto);
  const tiers = [Math.floor(dano / 4), Math.floor(dano / 2), dano];
  const attr = cfg.tipo === 'hibrida' ? (cfg.attrH || 'FOR') : tipo.attr;
  const alc = sel.filter((x) => x.L.nome.indexOf('Alcance') === 0).map((x) => x.L.nome);
  const erros = [], avisos = [], infos = [];
  if (acima > 0) erros.push('Passou ' + acima + (acima === 1 ? ' ponto' : ' pontos') + ' do limite. Tire rótulos ou some negativos' + (neg < pb ? ' (cabem mais ' + (pb - negConta) + ' de negativo).' : '.'));
  if (neg > pb) avisos.push('Os negativos somam ' + neg + ', mas no Rank ' + R.rank + ' só ' + pb + ' contam. O resto não devolve ponto.');
  if (danoBruto > R.dmax) erros.push('Aumentar Dano por Ki passou do dano máximo do Rank ' + R.rank + ' (' + R.dmax + ').');
  if (ki > R.kmax) avisos.push('Ki ' + ki + ' passa do teto do Rank ' + R.rank + ' (' + R.kmax + '). O livro só trava isso em Aumentar Dano por Ki; combine com o mestre.');
  if (R.pdl > S.ch.pdl && S.modo !== 'pnj') avisos.push('O Rank ' + R.rank + ' é recomendado a partir de ' + fmt(R.pdl) + ' PDL. Você tem ' + fmt(S.ch.pdl) + '.');
  if (!alc.length) infos.push('Sem rótulo de alcance, a técnica fica em Toque (custa 0).');
  if (nomes.has('Alcance – Explosivo')) {
    const outros = alc.filter((n) => n !== 'Alcance – Explosivo');
    if (!outros.length) erros.push('Explosivo precisa de outro alcance para marcar o ponto (Projétil, Arco ou Estocada).');
    const emArea = outros.filter((n) => AREA.has(n));
    if (emArea.length) erros.push('Explosivo não combina com alcance em área (' + emArea.map(curto).join(', ') + ').');
  }
  const areaSemExplosivo = alc.some((n) => AREA.has(n) && n !== 'Alcance – Explosivo');
  if (nomes.has('Técnica de Fragmentação – Ki') && area) erros.push('Fragmentação só vale em técnica de alvo único.');
  if (nomes.has('Técnica Expansiva – Ki')) {
    if (alc.indexOf('Alcance – Projétil') < 0) erros.push('Técnica Expansiva exige o alcance Projétil.');
    if (areaSemExplosivo || nomes.has('Alcance – Explosivo')) erros.push('Técnica Expansiva não funciona em técnica que já é em área.');
  }
  if (nomes.has('Adicionar Cura') && cfg.tipo !== 'magica') erros.push('Adicionar Cura exige o tipo Mágica. E cura só os outros, nunca você.');
  if (nomes.has('Carga Crescente') && nomes.has('Adicionar Salvaguarda')) erros.push('Carga Crescente não combina com Adicionar Salvaguarda.');
  if (nomes.has('Golpe Cego') && (!alc.length || alc.every((n) => CURTO.has(n)))) erros.push('Golpe Cego só vale em técnica de longo alcance.');
  if (cfg.tipo === 'magica' && !temMagoDeKi()) avisos.push('Técnica Mágica exige o talento Mago de Ki, salvo raça ou talento específico.');
  if (nomes.has('Efeito Negativo') && area) infos.push('Em área, Efeito Negativo consome antes os ' + pb + ' pontos base e depois o valor da condição.');
  if (exaustiva) infos.push('Exaustiva: o Ki dobra na hora de usar (' + ki + ' vira ' + ki * 2 + ').');
  sel.filter((x) => tipoRotulo(x.L) === 'todos').forEach((x) => infos.push(curto(x.L.nome) + ' custa todos os ' + pb + ' pontos base do Rank; o resto só vem de negativos.'));
  return { R, pb, tipo, sel, pos, neg, negConta, teto, acima, ki, kiPartes, kiUso: exaustiva ? ki * 2 : ki, exaustiva, dano, inv, tiers, attr, erros, avisos, infos, area };
}

  const c = S.ch; const k = calc(); const v = quantia(r); if (!v) { $('#amt-' + r).focus(); return; }

      const antes = c.pv; c.pv = Math.max(0, c.pv - resto);
      registrar({ tipo: 'info', texto: 'Dano ' + v + ': PV ' + antes + ' para ' + c.pv + (deTemp ? ' (' + deTemp + ' tirados dos temporários)' : '') + '.' });

      if (c.pv === 0) encerraFormaSe('0 PV');

    }
  } else {
    const antes = c.ki;
    if (sinal < 0) { guardarDesfazer(v + ' de Ki'); c.ki = Math.max(0, c.ki - v); registrar({ tipo: 'info', texto: 'Gastou ' + (antes - c.ki) + ' Ki: ' + antes + ' para ' + c.ki + '.' }); if (c.ki === 0) encerraFormaSe('o Ki zerou'); }

  'b-descartar': () => { S.b.sujo = false; fechaConstrutor(true); },
  'b-excluir': () => { S.b.confirma = 'excluir'; renderB(['foot']); $('#b-ficar').focus(); },
  'b-excluir-sim': () => { const b = S.b; const c = S.ch; const t = c.tecnicas.find((x) => x.id === b.id); c.tecnicas = c.tecnicas.filter((x) => x.id !== b.id); registrar({ tipo: 'info', texto: 'Técnica excluída: ' + (t ? t.nome : '') + '.' }); b.sujo = false; b.origem = 'tec-nova'; fechaConstrutor(true); },
  'b-salvar': () => salvaConstrutor(),
  'b-modo': (el) => { if (S.b.modo === el.dataset.v) return; S.b.modo = el.dataset.v; mexeuB(); montaConstrutor(); const m = $('[data-k="bm-' + S.b.modo + '"]'); if (m) m.focus(); },
  'b-rank': (el) => { S.b.cfg.rank = el.dataset.v; aparaDanoKi(); mexeuB(); renderB(['cfg', 'sum', 'foot']); },
  'b-tipo': (el) => { S.b.cfg.tipo = el.dataset.v; mexeuB(); renderB(['cfg', 'sum', 'foot']); },
  'b-cat': (el) => { S.b.cat = el.dataset.v; S.b.q = ''; const q = $('#b-q'); if (q) q.value = ''; renderB(['cats', 'lista', 'resetaLista']); $('#b-lista').scrollTop = 0; },
  'b-rot': (el) => { const L = LBL[+el.dataset.i]; const rs = S.b.cfg.rotulos; const i = rs.findIndex((e) => e.n === L.nome); if (i >= 0) rs.splice(i, 1); else rs.push({ n: L.nome, q: qInicial(L) }); S.b.foco = +el.dataset.i; mexeuB(); renderB(['cats', 'lista', 'sum', 'foot']); },
  'b-tirar': (el) => { const L = LBL[+el.dataset.i]; S.b.cfg.rotulos = S.b.cfg.rotulos.filter((e) => e.n !== L.nome); mexeuB(); renderB(['cats', 'lista', 'sum', 'foot']); },
  'b-q': (el) => { const L = LBL[+el.dataset.i]; const e = S.b.cfg.rotulos.find((x) => x.n === L.nome); if (!e) return; e.q = Math.max(1, e.q + (+el.dataset.d)); mexeuB(); renderB(['lista', 'sum', 'foot']); },
  'e-rank': (el) => { const e = S.b.esp; e.rank = el.dataset.v; e.ki = Math.max(e.ki, RK[e.rank].kesp); mexeuB(); renderB(['espcfg', 'sum', 'foot']); },
  'e-acao': (el) => { S.b.esp.acao = el.dataset.v; mexeuB(); renderB(['espcfg', 'foot']); },
  'e-dano': () => { S.b.esp.dano = !S.b.esp.dano; mexeuB(); renderB(['espcfg', 'sum', 'foot']); },
  'e-ki': (el) => { const e = S.b.esp; e.ki = Math.max(RK[e.rank].kesp, e.ki + (+el.dataset.d)); mexeuB(); renderB(['sum', 'foot']); },
};
function aparaDanoKi() {
  const b = S.b; const e = b.cfg.rotulos.find((x) => x.n === 'Aumentar Dano por Ki'); if (!e) return;
  const R = RK[b.cfg.rank]; e.q = Math.max(1, Math.min(e.q, Math.floor((R.dmax - R.dmin) / 4)));
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACOES[el.dataset.act]; if (f) { escondeDica(); f(el, e); }
});
document.addEventListener('submit', (e) => {
  e.preventDefault(); const tipo = e.target.dataset.form; const c = S.ch;
  if (tipo === 'pdl') { const inp = $('#f-ganho'); const v = parseInt(inp.value, 10); if (!Number.isFinite(v) || v === 0) { inp.focus(); return; } inp.value = ''; somaPdl(v); const n = $('#f-ganho'); if (n) n.focus(); }
  if (tipo === 'item') {
    const nome = $('#f-in').value.trim(); if (!nome) { $('#f-in').focus(); return; }
    const carga = clamp(parseInt($('#f-ic').value, 10) || 0, 0, 20); const qtd = clamp(parseInt($('#f-iq').value, 10) || 1, 1, 99);
    c.inv.push({ nome, carga, qtd, efeito: '' }); registrar({ tipo: 'info', texto: 'Adicionou ao inventário: ' + nome + '.' }); render(); const n = $('#f-in'); if (n) n.focus();
  }
  if (tipo === 'transf') {
    const nome = $('#f-trn').value.trim(); if (!nome) { $('#f-trn').focus(); return; }
    const est = clamp(parseInt($('#f-tre').value, 10) || 1, 1, 10);
    c.transfCustom.push({ key: 'c' + Date.now(), nome, estagio: est, efeito: '' });
    registrar({ tipo: 'info', texto: 'Forma criada para o mestre aprovar: ' + nome + ' (EP +' + est + ', Ki ' + 3 * est + ').' }); render();
  }
});
document.addEventListener('input', (e) => {
  const el = e.target; const k = el.dataset && el.dataset.in; if (!k) return; const c = S.ch;
  if (k === 'nome') c.nome = el.value;
  else if (k === 'jogador') c.jogador = el.value;
  else if (k === 'historia') c.historia = el.value;
  else if (k === 'notas') c.notas = el.value;
  else if (k === 'npc-passivas') c.npc.passivas = el.value;
  else if (k === 'npc-mecanicas') c.npc.mecanicas = el.value;
  else if (k === 'amt') { const v = parseInt(el.value, 10); if (v > 0) S.amt[el.dataset.r] = v; }
  else if (k === 'pick-q') { S.pick.q = el.value; const kk = calc(); $('#bk-lista').innerHTML = livroLista(kk, S.pick.tipo === 'talento' ? D.talentos : D.movimentos, S.pick.tipo, kk.escTotal - kk.escUsed); }
  else if (k === 'b-nome') { S.b.nome = el.value; mexeuB(); renderB(['foot']); }
  else if (k === 'b-q') { S.b.q = el.value; renderB(['cats', 'lista', 'resetaLista']); $('#b-lista').scrollTop = 0; }
  else if (k === 'e-texto') { S.b.esp.texto = el.value; mexeuB(); renderB(['sum', 'foot']); }
  else if (k === 'e-contra') { S.b.esp.contra = el.value; mexeuB(); renderB(['sum', 'foot']); }
});
document.addEventListener('change', (e) => {
  const el = e.target; const k = el.dataset && el.dataset.in; if (!k) return; const c = S.ch;
  if (k === 'nome') render();
  else if (k === 'raca') { c.racaId = el.value; c.variante = 0; c.transfAtiva = null; c.pvTemp = 0; render(); }
  else if (k === 'variante') { c.variante = +el.value; render(); }
  else if (k === 'pericia') {
    const nome = PERICIAS[+el.dataset.id][0]; const i = c.pericias.indexOf(nome);
    if (i >= 0) c.pericias.splice(i, 1); else if (c.pericias.length < MAX_TREINADAS) c.pericias.push(nome);
    render();
  }
  else if (k === 'npc-rank') { c.npc.rank = el.value; render(); }
  else if (k === 'b-attrh') { S.b.cfg.attrH = el.value; mexeuB(); renderB(['sum']); }
});
$('#retrato-arq').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0]; if (!f || !/^image\//.test(f.type)) return;
  const leitor = new FileReader();
  leitor.onload = () => { S.ch.retrato = String(leitor.result); render(); };
  leitor.readAsDataURL(f); e.target.value = '';
});

/* teclado */
function emCampoDeTexto(el) { return el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && !/^(checkbox|radio|button|submit)$/.test(el.type)) || el.isContentEditable); }
document.addEventListener('keydown', (e) => {
  const a = document.activeElement;
  if (e.key === 'Escape') {
    if (dicaEl) { escondeDica(); return; }
    if (S.b) { e.preventDefault(); if (S.b.confirma) ACOES['b-ficar'](); else fechaConstrutor(false); return; }
    if (S.regAberto) { S.regAberto = false; render(); $('[data-k="registro"]').focus(); return; }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey && !emCampoDeTexto(a) && !S.b) { if (S.desfazer.length) { e.preventDefault(); desfazer(); } return; }
  if (S.b && e.key === '/' && !emCampoDeTexto(a)) { const q = $('#b-q'); if (q) { e.preventDefault(); q.focus(); q.select(); } return; }
  if (a && a.classList && a.classList.contains('lbl') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault(); const todos = [...document.querySelectorAll('#b-lista .lbl')]; const i = todos.indexOf(a);
    const n = todos[clamp(i + (e.key === 'ArrowDown' ? 1 : -1), 0, todos.length - 1)]; if (n) n.focus(); return;
  }
  const lista = a && a.closest && a.closest('[role="tablist"], [role="radiogroup"]');
  if (lista && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const itens = [...lista.querySelectorAll('[role="tab"], [role="radio"]')].filter((x) => !x.disabled); const i = itens.indexOf(a); if (i < 0) return;
    e.preventDefault(); const n = itens[(i + (e.key === 'ArrowRight' ? 1 : -1) + itens.length) % itens.length]; n.focus(); n.click();
    const de = n.dataset.k; if (de) { const x = $('[data-k="' + CSS.escape(de) + '"]'); if (x) x.focus(); }
  }
});

/* ================= Início ================= */
const faltando = [];
amostraExemplo().tecnicas.forEach((t) => { if (t.cfg) t.cfg.rotulos.forEach((r) => { if (LBL_I[r.n] == null) faltando.push(r.n); }); });
if (faltando.length) console.warn('Rótulos da amostra fora do livro:', faltando);
montaRecursos();
render();
})();
</script>
