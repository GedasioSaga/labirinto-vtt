<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha Dragon Ball Tales</title>
<style>
/* Tokens do app: copiados de client/src/theme.ts (mesmos nomes --lb-*). O app tem um tema só, escuro. */
:root {
  color-scheme: dark;
  --lb-color-ink: #121214;
  --lb-color-stone: rgba(19, 19, 23, 0.94);
  --lb-color-stone-solid: #1a1a1e;
  --lb-color-stone-raised: #232328;
  --lb-color-stone-hover: #2c2c33;
  --lb-color-stone-sunken: #141417;
  --lb-color-line: rgba(255, 255, 255, 0.08);
  --lb-color-line-strong: rgba(255, 255, 255, 0.16);
  --lb-color-line-panel: rgba(255, 255, 255, 0.13);
  --lb-color-parchment: #eceae4;
  --lb-color-parchment-dim: #a2a09a;
  --lb-color-parchment-faint: #858480;
  --lb-color-ember: #e2645a;
  --lb-color-ember-soft: rgba(226, 100, 90, 0.14);
  --lb-color-online: #7fb48a;
  --lb-font-display: 'Sitka Banner', 'Sitka Display', Sitka, Constantia, Georgia, 'Times New Roman', serif;
  --lb-font-sans: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
  --lb-font-utility: 'Bahnschrift', 'DIN Alternate', 'Segoe UI Variable Small', 'Segoe UI', system-ui, sans-serif;
  --lb-font-size-xs: 10.5px;
  --lb-font-size-sm: 11.5px;
  --lb-font-size-md: 13px;
  --lb-font-size-lg: 15px;
  --lb-font-size-xl: 20px;
  --lb-space-1: 4px;
  --lb-space-2: 8px;
  --lb-space-3: 12px;
  --lb-space-4: 16px;
  --lb-space-5: 20px;
  --lb-space-6: 24px;
  --lb-radius-sm: 6px;
  --lb-radius-md: 9px;
  --lb-radius-lg: 14px;
  --lb-shadow-md: 0 6px 16px rgba(0, 0, 0, 0.34), 0 1px 2px rgba(0, 0, 0, 0.4);
  --lb-shadow-float: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 14px rgba(0, 0, 0, 0.44), 0 20px 46px rgba(0, 0, 0, 0.55);
  --lb-shadow-bevel: inset 0 1px 0 rgba(255, 255, 255, 0.07);
  --lb-gr-ease-out: cubic-bezier(0.23, 1, 0.32, 1);

  /* Ficha Dragon Ball (proposta "Scouter"): âmbar para leitura de poder, vermelho para vida, azul para Ki. */
  --db-amber: #ffad42;
  --db-amber-hi: #ffc979;
  --db-amber-dim: #c98a3a;
  --db-amber-soft: rgba(255, 173, 66, 0.12);
  --db-amber-line: rgba(255, 173, 66, 0.38);
  --db-amber-glow: rgba(255, 140, 30, 0.42);
  --db-amber-ink: #1c1608;
  --db-pv: #f2604e;
  --db-pv-hi: #ff8f7e;
  --db-pv-glow: rgba(242, 96, 78, 0.45);
  --db-ki: #59c3ff;
  --db-ki-hi: #a3dcff;
  --db-ki-glow: rgba(89, 195, 255, 0.42);
  --db-ki-soft: rgba(89, 195, 255, 0.12);
  --db-neg: var(--lb-color-online);
  --db-bad: #ff7b6b;
  --db-focus: 0 0 0 2px var(--lb-color-stone-solid), 0 0 0 4px var(--db-amber);
  --db-num: 'Bahnschrift', 'DIN Alternate', 'Segoe UI Variable Small', system-ui, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% -10%, #1d1b20 0%, var(--lb-color-ink) 55%);
  color: var(--lb-color-parchment);
  font-family: var(--lb-font-sans);
  font-size: var(--lb-font-size-md);
  line-height: 1.45;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus { outline: none; }
:focus-visible { box-shadow: var(--db-focus); border-radius: var(--lb-radius-sm); }
.num, .tab-n { font-variant-numeric: tabular-nums; }

/* ---------- Barra do protótipo (não é tela do app) ---------- */
.proto {
  display: flex; align-items: center; gap: var(--lb-space-4); flex-wrap: wrap;
  min-height: 44px; padding: 6px var(--lb-space-5);
  border-bottom: 1px dashed var(--lb-color-line-strong);
  background: var(--lb-color-stone-sunken);
  font-family: var(--lb-font-utility); font-size: var(--lb-font-size-sm);
  color: var(--lb-color-parchment-dim);
}
.proto__marca { color: var(--lb-color-parchment-faint); }
.proto__dica { margin-left: auto; color: var(--lb-color-parchment-faint); }
.stage { height: calc(100vh - 44px); display: grid; place-items: center; padding: var(--lb-space-6); }
.reabrir { display: grid; gap: 10px; justify-items: center; color: var(--lb-color-parchment-dim); }

/* ---------- Controles base ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 12px; white-space: nowrap;
  border: 1px solid var(--lb-color-line-strong); border-radius: var(--lb-radius-sm);
  background: var(--lb-color-stone-raised); color: var(--lb-color-parchment);
  font-size: 12.5px;
  transition: background-color 120ms ease, border-color 120ms ease, transform 140ms var(--lb-gr-ease-out);
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.42; }
.btn--sm { height: 26px; padding: 0 10px; font-size: 12px; }
.btn--ghost { background: transparent; border-color: transparent; color: var(--lb-color-parchment-dim); }
.btn--pri { background: var(--db-amber); border-color: var(--db-amber); color: var(--db-amber-ink); font-weight: 600; }
.btn--ki { border-color: rgba(89, 195, 255, 0.4); color: var(--db-ki-hi); background: var(--db-ki-soft); }
.btn--on { border-color: var(--db-amber-line); color: var(--db-amber-hi); background: var(--db-amber-soft); }
.btn--perigo { color: var(--db-bad); }
@media (hover: hover) and (pointer: fine) {
  .btn:hover:not(:disabled) { background: var(--lb-color-stone-hover); border-color: var(--lb-color-line-strong); }
  .btn--ghost:hover:not(:disabled) { color: var(--lb-color-parchment); }
  .btn--pri:hover:not(:disabled) { background: var(--db-amber-hi); border-color: var(--db-amber-hi); }
  .btn--ki:hover:not(:disabled) { background: rgba(89, 195, 255, 0.2); }
}
.ki-cost { font-family: var(--db-num); color: var(--db-ki-hi); font-variant-numeric: tabular-nums; }
.btn--pri .ki-cost { color: inherit; }
.iconbtn {
  width: 30px; height: 30px; display: grid; place-items: center; border-radius: var(--lb-radius-sm);
  background: transparent; border: 1px solid transparent; color: var(--lb-color-parchment-dim);
  transition: background-color 120ms ease, transform 140ms var(--lb-gr-ease-out);
}
.iconbtn:active { transform: scale(0.95); }
@media (hover: hover) and (pointer: fine) { .iconbtn:hover { background: var(--lb-color-stone-hover); color: var(--lb-color-parchment); } }
.lnk {
  padding: 2px 0; border: 0; background: none; color: var(--db-amber-hi);
  font-size: 12px; text-decoration: underline; text-decoration-color: var(--db-amber-line); text-underline-offset: 3px;
}
.inp {
  height: 28px; padding: 0 8px; min-width: 0;
  border: 1px solid var(--lb-color-line-strong); border-radius: var(--lb-radius-sm);
  background: var(--lb-color-stone-sunken); color: var(--lb-color-parchment);
}
.inp::placeholder, textarea::placeholder { color: var(--lb-color-parchment-faint); }
.inp:focus-visible, textarea:focus-visible, .sel:focus-visible { border-color: var(--db-amber-line); }
.inp--num { font-family: var(--db-num); font-variant-numeric: tabular-nums; }
.inp--amt { width: 52px; text-align: center; }
.sel {
  height: 26px; padding: 0 6px; border-radius: var(--lb-radius-sm);
  border: 1px solid var(--lb-color-line); background: var(--lb-color-stone-sunken); color: var(--lb-color-parchment-dim);
  font-size: 12.5px;
}
textarea.area {
  width: 100%; min-height: 120px; resize: vertical; padding: 10px 12px; line-height: 1.55;
  border: 1px solid var(--lb-color-line-strong); border-radius: var(--lb-radius-md);
  background: var(--lb-color-stone-sunken);
}
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--lb-radius-sm); background: var(--lb-color-stone-sunken); border: 1px solid var(--lb-color-line); }
.seg button {
  height: 24px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent;
  color: var(--lb-color-parchment-dim); font-size: 12px;
}
.seg button[aria-checked="true"] { background: var(--lb-color-stone-hover); color: var(--lb-color-parchment); box-shadow: inset 0 0 0 1px var(--lb-color-line-strong); }
.tag {
  display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 4px;
  border: 1px solid var(--lb-color-line-strong); color: var(--lb-color-parchment-dim);
  font-family: var(--lb-font-utility); font-size: 11px; white-space: nowrap;
}
.tag--amber { border-color: var(--db-amber-line); color: var(--db-amber-hi); background: var(--db-amber-soft); }
.tag--wait { border-style: dashed; border-color: var(--db-amber-line); color: var(--db-amber-hi); }
.tag--ki { border-color: rgba(89, 195, 255, 0.35); color: var(--db-ki-hi); }
.motivo { font-size: 11.5px; color: var(--lb-color-parchment-faint); }
.nota { margin: 0; font-size: 12px; color: var(--lb-color-parchment-faint); }
.f { cursor: help; border-radius: 3px; }
button.f { cursor: pointer; }
@media (hover: hover) and (pointer: fine) {
  .f:hover { text-decoration: underline dotted rgba(255, 201, 121, 0.55); text-underline-offset: 4px; }
}

/* stepper −/+ */
.stepper { display: inline-flex; align-items: center; gap: 2px; }
.sbtn {
  width: 22px; height: 22px; display: grid; place-items: center; padding: 0;
  border: 1px solid var(--lb-color-line); border-radius: 5px; background: transparent;
  color: var(--lb-color-parchment-dim); font-family: var(--db-num); font-size: 14px; line-height: 1;
  transition: background-color 120ms ease, color 120ms ease, transform 140ms var(--lb-gr-ease-out);
}
.sbtn:active:not(:disabled) { transform: scale(0.94); }
.sbtn:disabled { opacity: 0.3; }
@media (hover: hover) and (pointer: fine) { .sbtn:hover:not(:disabled) { background: var(--lb-color-stone-hover); color: var(--lb-color-parchment); } }
.stepper__v { min-width: 24px; text-align: center; font-family: var(--db-num); font-size: 13px; font-variant-numeric: tabular-nums; }

/* switch */
.sw {
  display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 4px 0 2px;
  border: 0; background: none; color: var(--lb-color-parchment-dim); font-size: 12px;
}
.sw__t {
  width: 28px; height: 16px; border-radius: 999px; position: relative; flex: none;
  background: var(--lb-color-stone-hover); box-shadow: inset 0 0 0 1px var(--lb-color-line-strong);
  transition: background-color 160ms ease;
}
.sw__t::after {
  content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--lb-color-parchment-dim);
  transition: transform 180ms var(--lb-gr-ease-out), background-color 160ms ease;
}
.sw[aria-checked="true"] { color: var(--lb-color-parchment); }
.sw[aria-checked="true"] .sw__t { background: rgba(255, 173, 66, 0.35); }
.sw[aria-checked="true"] .sw__t::after { transform: translateX(12px); background: var(--db-amber-hi); }
.sw:disabled { opacity: 0.4; }

/* dado */
.roll {
  width: 30px; height: 30px; display: grid; place-items: center; padding: 0; flex: none;
  border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-sm);
  background: transparent; color: var(--lb-color-parchment-faint);
  transition: color 120ms ease, border-color 120ms ease, background-color 120ms ease, transform 140ms var(--lb-gr-ease-out);
}
.roll svg { width: 17px; height: 17px; }
.roll--sm { width: 26px; height: 26px; }
.roll--sm svg { width: 15px; height: 15px; }
.roll:active { transform: scale(0.94); }
@media (hover: hover) and (pointer: fine) {
  .roll:hover { color: var(--db-amber-hi); border-color: var(--db-amber-line); background: var(--db-amber-soft); }
}

/* ---------- Janela (mesma casca do FichaDePersonagemDialog: 1120 x 860) ---------- */
.db {
  width: min(1120px, 100%); height: min(860px, 100%);
  display: flex; flex-direction: column; position: relative; overflow: hidden;
  background: var(--lb-color-stone); border: 1px solid var(--lb-color-line-panel);
  border-radius: var(--lb-radius-lg); box-shadow: var(--lb-shadow-float), var(--lb-shadow-bevel);
}
.db-head {
  display: flex; align-items: center; justify-content: space-between; gap: var(--lb-space-4);
  min-height: 48px; padding: 8px 10px 8px var(--lb-space-5); border-bottom: 1px solid var(--lb-color-line);
}
.db-eyebrow { margin: 0; font-family: var(--lb-font-utility); font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); letter-spacing: 0.02em; }
.db-head__acoes { display: flex; align-items: center; gap: 10px; }
.db-body { flex: 1; min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; position: relative; }

/* ---------- Cabeçalho: identidade + leitura do scouter ---------- */
.db-hero {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.32fr) minmax(0, 0.72fr);
  border-bottom: 1px solid var(--lb-color-line);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.018), transparent 70%);
}
.db-hero > * { padding: 12px var(--lb-space-5); min-width: 0; }
.db-hero > * + * { border-left: 1px solid var(--lb-color-line); }
.id { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: center; }
.lens {
  position: relative; width: 84px; height: 84px; padding: 0; border: 0; border-radius: 50%;
  background: var(--lb-color-stone-sunken); overflow: hidden;
  transition: transform 160ms var(--lb-gr-ease-out);
}
.lens:active { transform: scale(0.97); }
.lens:focus-visible { border-radius: 50%; }
.lens img { position: absolute; inset: 6px; width: 72px; height: 72px; border-radius: 50%; object-fit: cover; }
.lens svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.lens__dica {
  position: absolute; left: 0; right: 0; bottom: 9px; text-align: center;
  font-family: var(--lb-font-utility); font-size: 10.5px; color: var(--db-amber-hi);
  opacity: 0; transition: opacity 140ms ease;
}
.lens:hover .lens__dica, .lens:focus-visible .lens__dica { opacity: 1; }
.id__txt { min-width: 0; display: grid; gap: 6px; }
.id__nome {
  width: 100%; padding: 1px 0; border: 0; border-bottom: 1px solid transparent; background: transparent;
  font-family: var(--lb-font-display); font-size: 27px; line-height: 1.1; color: var(--lb-color-parchment);
  transition: border-color 120ms ease;
}
.id__nome:hover { border-bottom-color: var(--lb-color-line-strong); }
.id__nome:focus-visible { box-shadow: none; border-bottom-color: var(--db-amber); }
.id__linha { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.id__jog { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--lb-color-parchment-faint); }
.id__jog input { flex: 1; min-width: 0; height: 24px; border: 0; border-bottom: 1px solid var(--lb-color-line); background: none; color: var(--lb-color-parchment-dim); padding: 0 2px; }
.id__jog input:focus-visible { box-shadow: none; border-bottom-color: var(--db-amber); }
.id__pnj { margin: 0; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--lb-color-parchment-faint); }

/* Leitura do scouter: cantos de mira, linhas de varredura discretas, números com brilho. */
.scan { position: relative; isolation: isolate; }
.scan::before {
  content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255, 170, 60, 0.028) 0 1px, transparent 1px 3px);
}
.scan__mira { position: absolute; width: 10px; height: 10px; pointer-events: none; border-color: var(--db-amber-line); border-style: solid; }
.scan__mira--a { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
.scan__mira--b { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }
.scan__top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.scan__lbl { margin: 0; font-family: var(--lb-font-utility); font-weight: 400; font-size: 12px; color: var(--lb-color-parchment-dim); letter-spacing: 0.03em; display: flex; align-items: center; gap: 7px; }
.scan__lbl::before { content: ''; width: 6px; height: 6px; background: var(--db-amber); box-shadow: 0 0 8px var(--db-amber-glow); transform: rotate(45deg); }
.scan__num {
  margin: 0; display: flex; align-items: baseline; gap: 8px;
  font-family: var(--db-num); font-stretch: 75%; font-weight: 300; font-size: 46px; line-height: 0.98;
  color: var(--db-amber-hi); font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  text-shadow: 0 0 18px var(--db-amber-glow), 0 0 1px rgba(255, 210, 150, 0.6);
}
.scan__un { font-size: 15px; font-stretch: 100%; font-weight: 400; color: var(--db-amber-dim); text-shadow: none; letter-spacing: 0.06em; }
.ganho { display: flex; gap: 4px; }
.ganho .inp { width: 86px; height: 26px; }
.scan__linha { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 4px; }
.scan__falta { font-size: 12px; color: var(--lb-color-parchment-faint); white-space: nowrap; }
.scan__falta b { font-family: var(--db-num); font-weight: 500; color: var(--lb-color-parchment-dim); font-variant-numeric: tabular-nums; }
.trilha { position: relative; margin: 8px 0 0; height: 26px; }
.trilha__bar { position: absolute; left: 0; right: 0; top: 4px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
.trilha__fill { position: absolute; inset: 0; transform-origin: left; background: linear-gradient(90deg, rgba(255, 173, 66, 0.35), var(--db-amber)); box-shadow: 0 0 10px var(--db-amber-glow); }
.trilha__tk { list-style: none; margin: 0; padding: 0; }
.tk { position: absolute; top: 0; transform: translateX(-100%); display: grid; justify-items: end; }
.tk::before { content: ''; justify-self: end; width: 2px; height: 11px; margin-right: -1px; background: rgba(255, 255, 255, 0.2); }
.tk--ok::before { background: var(--db-amber); box-shadow: 0 0 6px var(--db-amber-glow); }
.tk__v { font-family: var(--db-num); font-size: 10.5px; color: var(--lb-color-parchment-faint); line-height: 1.3; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tk--ok .tk__v { color: var(--db-amber-dim); }
.tk__g { font-family: var(--lb-font-sans); font-size: 10.5px; color: var(--lb-color-parchment-faint); }
.prox { margin: 2px 0 0; font-size: 12px; color: var(--lb-color-parchment-dim); line-height: 1.4; }
.prox b { font-family: var(--db-num); font-weight: 500; color: var(--lb-color-parchment); font-variant-numeric: tabular-nums; }
.prox__falta { color: var(--lb-color-parchment-faint); }

.ep { display: flex; align-items: flex-end; gap: 14px; margin-top: 4px; }
.ep .scan__num { font-size: 66px; padding: 0 2px; }
.ep__parts { margin: 0 0 6px; display: grid; gap: 4px; }
.ep__p { display: flex; align-items: baseline; gap: 8px; }
.ep__p dt { font-size: 11.5px; color: var(--lb-color-parchment-faint); width: 34px; }
.ep__p dd { margin: 0; font-family: var(--db-num); font-size: 18px; color: var(--lb-color-parchment-dim); font-variant-numeric: tabular-nums; }
.ep__p--on dd { color: var(--db-amber-hi); text-shadow: 0 0 10px var(--db-amber-glow); }
.ep__forma { margin: 6px 0 0; font-size: 12px; color: var(--lb-color-parchment-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ep__forma--on { color: var(--db-amber-hi); }
.nd { display: flex; align-items: center; gap: 16px; margin-top: 4px; flex-wrap: wrap; }
.nd .stepper { gap: 8px; }
.nd .sbtn { width: 28px; height: 28px; font-size: 16px; }
.nd .scan__num { min-width: 1.4em; justify-content: center; }
.nd__cfg { display: grid; gap: 8px; }
.nd__rank { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--lb-color-parchment-faint); }

/* ---------- Faixa de PV e Ki ---------- */
.db-res { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--lb-color-line); }
.meter {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: auto auto;
  column-gap: 18px; row-gap: 3px; align-items: center; padding: 8px var(--lb-space-5);
}
.btn--xs { height: 22px; padding: 0 8px; font-size: 11.5px; }
.meter + .meter { border-left: 1px solid var(--lb-color-line); }
.meter__num { grid-row: 1 / 3; display: grid; gap: 1px; min-width: 112px; }
.meter__lbl { font-size: 12px; color: var(--lb-color-parchment-dim); }
.meter__val { display: flex; align-items: baseline; gap: 4px; font-family: var(--db-num); font-variant-numeric: tabular-nums; }
.meter__cur { font-stretch: 75%; font-weight: 300; font-size: 31px; line-height: 1; }
.meter--pv .meter__cur { color: var(--db-pv-hi); text-shadow: 0 0 14px var(--db-pv-glow); }
.meter--ki .meter__cur { color: var(--db-ki-hi); text-shadow: 0 0 14px var(--db-ki-glow); }
.meter__max { font-size: 15px; color: var(--lb-color-parchment-faint); }
.bar { position: relative; height: 10px; border-radius: 5px; background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05); overflow: hidden; }
.bar__fill, .bar__ghost, .bar__temp { position: absolute; inset: 0; transform-origin: left; border-radius: 5px; }
.bar__ghost { background: rgba(255, 255, 255, 0.28); transition: transform 260ms var(--lb-gr-ease-out) 220ms; }
.bar__ghost[data-snap] { transition: none; }
.bar__fill { transition: transform 200ms var(--lb-gr-ease-out); }
.meter--pv .bar__fill { background: linear-gradient(90deg, #b8392b, var(--db-pv)); box-shadow: 0 0 12px var(--db-pv-glow); }
.meter--ki .bar__fill { background: linear-gradient(90deg, #2a86c4, var(--db-ki)); box-shadow: 0 0 12px var(--db-ki-glow); }
.bar__temp { background: repeating-linear-gradient(135deg, rgba(255, 220, 200, 0.55) 0 3px, rgba(255, 220, 200, 0.15) 3px 6px); }
.bar__spent {
  position: absolute; top: 0; bottom: 0; border-radius: 0 5px 5px 0;
  background: repeating-linear-gradient(90deg, rgba(89, 195, 255, 0.28) 0 2px, transparent 2px 6px);
  box-shadow: inset 0 0 0 1px rgba(89, 195, 255, 0.25);
}
.meter__cap { margin: 0; font-size: 12px; color: var(--lb-color-parchment-faint); min-height: 18px; }
.meter--ki .meter__cap b { color: var(--db-ki-hi); font-weight: 500; font-family: var(--db-num); }
.meter__ctl { display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
.meter__alt { display: flex; justify-content: flex-end; min-height: 18px; }

/* ---------- Corpo em três colunas ---------- */
.db-grid { display: grid; grid-template-columns: 268px 252px minmax(0, 1fr); min-height: 0; }
.db-grid[data-pnj] { grid-template-columns: 268px minmax(0, 1fr); }
.db-col { overflow: auto; padding: 12px var(--lb-space-4) var(--lb-space-4); border-right: 1px solid var(--lb-color-line); scrollbar-width: thin; }
.h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 8px; }
.h__t { margin: 0; font-family: var(--lb-font-display); font-weight: 400; font-size: 17px; }
.h__n { font-family: var(--db-num); font-size: 12px; color: var(--lb-color-parchment-faint); font-variant-numeric: tabular-nums; }
.h__n--cheio { color: var(--db-amber-hi); }
.aviso { margin: 0 0 6px; padding: 5px 10px; border-radius: var(--lb-radius-sm); font-size: 12px; }
.aviso--amber { background: var(--db-amber-soft); color: var(--db-amber-hi); box-shadow: inset 0 0 0 1px rgba(255, 173, 66, 0.22); }
.aviso--calmo { background: rgba(255, 255, 255, 0.03); color: var(--lb-color-parchment-faint); }

.attr { display: grid; grid-template-columns: minmax(0, 1fr) auto 40px 30px; align-items: center; gap: 6px; height: 40px; border-bottom: 1px solid var(--lb-color-line); }
.attr__id { display: grid; line-height: 1.15; min-width: 0; }
.attr__ab { font-family: var(--lb-font-utility); font-weight: 600; font-size: 12.5px; letter-spacing: 0.05em; text-decoration: none; }
.attr__nome { font-size: 11px; color: var(--lb-color-parchment-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attr__mod { justify-self: end; font-family: var(--db-num); font-stretch: 75%; font-weight: 300; font-size: 27px; line-height: 1; font-variant-numeric: tabular-nums; padding: 0 2px; }
.attr--alto .stepper__v { color: var(--db-amber-hi); }
.der { display: grid; gap: 6px; margin-top: 10px; }
.der__t {
  position: relative; display: grid; gap: 1px; text-align: left; padding: 6px 6px 5px; min-width: 0;
  border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-md); background: var(--lb-color-stone-sunken);
  color: inherit; transition: border-color 120ms ease, transform 140ms var(--lb-gr-ease-out);
}
button.der__t:active { transform: scale(0.98); }
@media (hover: hover) and (pointer: fine) { button.der__t:hover { border-color: var(--lb-color-line-strong); } }
.der__n { font-family: var(--db-num); font-stretch: 75%; font-weight: 300; font-size: 21px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.der__n small { font-size: 12px; color: var(--lb-color-parchment-faint); margin-left: 1px; }
.der__l { font-size: 10.5px; color: var(--lb-color-parchment-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.der__t--mal { border-color: rgba(255, 123, 107, 0.45); }
.der__t--mal .der__n { color: var(--db-bad); }
.der__dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--db-amber); box-shadow: 0 0 8px var(--db-amber-glow); }

.sk { display: grid; grid-template-columns: 18px minmax(0, 1fr) 30px 30px 26px; align-items: center; gap: 6px; height: 29px; }
.chk {
  appearance: none; -webkit-appearance: none; margin: 0 0 0 2px; width: 12px; height: 12px; transform: rotate(45deg);
  border: 1px solid var(--lb-color-parchment-faint); border-radius: 2px; background: transparent; cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease;
}
.chk:checked { background: var(--db-amber); border-color: var(--db-amber); box-shadow: 0 0 8px var(--db-amber-glow); }
.chk:disabled { opacity: 0.3; cursor: not-allowed; }
.chk:focus-visible { box-shadow: 0 0 0 2px var(--lb-color-stone-solid), 0 0 0 4px var(--db-amber); border-radius: 2px; }
.sk__n { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; color: var(--lb-color-parchment-dim); }
.sk--tr .sk__n { color: var(--lb-color-parchment); }
.sk__a { font-family: var(--lb-font-utility); font-size: 10.5px; color: var(--lb-color-parchment-faint); text-decoration: none; letter-spacing: 0.04em; }
.sk__b { justify-self: end; font-family: var(--db-num); font-size: 15px; font-variant-numeric: tabular-nums; color: var(--lb-color-parchment-dim); }
.sk--tr .sk__b { color: var(--db-amber-hi); }

/* ---------- Abas ---------- */
.db-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; gap: 2px; padding: 4px 12px 0; border-bottom: 1px solid var(--lb-color-line); overflow-x: auto; scrollbar-width: none; }
.tab {
  display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 11px;
  border: 0; border-bottom: 2px solid transparent; background: none; color: var(--lb-color-parchment-dim); white-space: nowrap; font-size: 13px;
}
.tab[aria-selected="true"] { color: var(--lb-color-parchment); border-bottom-color: var(--db-amber); }
@media (hover: hover) and (pointer: fine) { .tab:hover { color: var(--lb-color-parchment); } }
.tab-n { font-family: var(--db-num); font-size: 11.5px; color: var(--lb-color-parchment-faint); }
.tab-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--db-amber); box-shadow: 0 0 6px var(--db-amber-glow); }
.db-panel { flex: 1; min-height: 0; overflow: auto; padding: 14px var(--lb-space-5) var(--lb-space-5); scrollbar-width: thin; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.ph__t { margin: 0; font-family: var(--lb-font-display); font-weight: 400; font-size: 18px; }
.sec { margin-top: 18px; }
.sec__t { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--lb-color-parchment-dim); display: flex; gap: 8px; align-items: baseline; }
.sec__t span { font-weight: 400; color: var(--lb-color-parchment-faint); }

.vazio {
  display: grid; justify-items: start; gap: 10px; padding: 18px 18px 20px; margin-top: 4px;
  border: 1px dashed var(--lb-color-line-strong); border-radius: var(--lb-radius-md); color: var(--lb-color-parchment-dim);
}
.vazio p { margin: 0; max-width: 56ch; }

/* orçamento de slots / carga */
.stb { padding: 10px 12px; border-radius: var(--lb-radius-md); background: var(--lb-color-stone-sunken); border: 1px solid var(--lb-color-line); }
.stb__top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; color: var(--lb-color-parchment-dim); }
.stb__v { font-family: var(--db-num); font-size: 15px; color: var(--lb-color-parchment); font-variant-numeric: tabular-nums; }
.stb__bar { margin-top: 6px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
.stb__bar span { display: block; height: 100%; transform-origin: left; background: var(--db-amber); box-shadow: 0 0 8px var(--db-amber-glow); transition: transform 200ms var(--lb-gr-ease-out); }
.stb__msg { margin: 6px 0 0; font-size: 11.5px; color: var(--lb-color-parchment-faint); }
.stb--over { border-color: rgba(255, 123, 107, 0.45); }
.stb--over .stb__bar span { background: var(--db-bad); box-shadow: 0 0 8px rgba(255, 123, 107, 0.4); }
.stb--over .stb__v, .stb--over .stb__msg { color: var(--db-bad); }

/* técnica */
.tec { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; column-gap: 14px; row-gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--lb-color-line); }
.rk {
  grid-row: 1 / 3; width: 38px; height: 44px; display: grid; place-items: center;
  border: 1px solid var(--lb-color-line-strong); border-radius: var(--lb-radius-sm);
  font-family: var(--db-num); font-stretch: 75%; font-size: 24px; color: var(--lb-color-parchment-dim);
}
.tec--on .rk { border-color: var(--db-amber-line); color: var(--db-amber-hi); text-shadow: 0 0 10px var(--db-amber-glow); background: var(--db-amber-soft); }
.rk--esp { font-size: 12px; font-stretch: 100%; border-style: dashed; }
.tec__main { min-width: 0; }
.tec__n { margin: 0; font-size: 14.5px; font-weight: 600; }
.tec__meta { margin: 2px 0 0; font-size: 12px; color: var(--lb-color-parchment-dim); }
.tec__lbls { margin: 2px 0 0; font-size: 12px; color: var(--lb-color-parchment-faint); }
.tec__warn { margin: 4px 0 0; font-size: 11.5px; color: var(--db-amber-hi); }
.tec__nums { display: grid; justify-items: end; gap: 2px; align-content: start; }
.tec__ki { font-family: var(--db-num); font-size: 12px; color: var(--lb-color-parchment-faint); }
.tec__ki b { font-size: 19px; font-weight: 400; color: var(--db-ki-hi); font-variant-numeric: tabular-nums; }
.dn { display: inline-flex; gap: 0; font-family: var(--db-num); font-size: 14px; font-variant-numeric: tabular-nums; color: var(--lb-color-parchment-dim); }
.dn i { font-style: normal; }
.dn i + i::before { content: '/'; margin: 0 4px; color: var(--lb-color-parchment-faint); }
.dn i:last-child { color: var(--lb-color-parchment); }
.dn__l { font-size: 10.5px; color: var(--lb-color-parchment-faint); }
.tec__acts { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.tec__st { font-family: var(--db-num); font-size: 11.5px; color: var(--lb-color-parchment-faint); margin-right: auto; }

/* transformação */
.tr { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--lb-color-line); }
.tr__ep { display: grid; justify-items: center; align-content: start; padding-top: 2px; }
.tr__epn { font-family: var(--db-num); font-stretch: 75%; font-weight: 300; font-size: 30px; line-height: 1; color: var(--lb-color-parchment-dim); }
.tr__epl { font-size: 10.5px; color: var(--lb-color-parchment-faint); }
.tr--on .tr__epn { color: var(--db-amber-hi); text-shadow: 0 0 14px var(--db-amber-glow); }
.tr--lock .tr__epn, .tr--lock .tr__n { color: var(--lb-color-parchment-faint); }
.tr__n { margin: 0; font-size: 14.5px; font-weight: 600; }
.tr__req { margin: 2px 0 4px; font-size: 12px; color: var(--lb-color-parchment-faint); max-width: 62ch; }
.tr__ef { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--lb-color-parchment-dim); display: grid; gap: 4px; max-width: 64ch; }
.tr__acts { display: grid; justify-items: end; align-content: start; gap: 6px; }
.tr__ki { font-family: var(--db-num); font-size: 12px; color: var(--lb-color-parchment-faint); }
.tr__ki b { font-size: 18px; font-weight: 400; color: var(--db-ki-hi); }
.form-linha { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; padding: 12px; border-radius: var(--lb-radius-md); background: var(--lb-color-stone-sunken); border: 1px solid var(--lb-color-line); }
.fld { display: grid; gap: 4px; font-size: 11.5px; color: var(--lb-color-parchment-faint); }
.traco { padding: 10px 0; border-bottom: 1px solid var(--lb-color-line); }
.traco h5 { margin: 0; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.traco p { margin: 4px 0 0; font-size: 12.5px; color: var(--lb-color-parchment-dim); max-width: 66ch; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* livro (talentos/movimentos) */
.bk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--lb-color-line); }
.bk h5 { margin: 0; font-size: 13.5px; font-weight: 600; }
.bk__meta { margin: 1px 0 3px; display: flex; gap: 6px; flex-wrap: wrap; }
.bk__ef { margin: 0; font-size: 12.5px; color: var(--lb-color-parchment-dim); max-width: 68ch; }
.bk__acts { display: grid; gap: 6px; justify-items: end; align-content: start; }
.busca { display: flex; gap: 10px; align-items: center; margin: 10px 0 4px; }
.busca input[type="search"] { flex: 1; height: 30px; }

/* inventário */
.it { display: grid; grid-template-columns: minmax(0, 1fr) auto 70px 30px; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--lb-color-line); }
.it__n { font-size: 13.5px; }
.it__e { margin: 1px 0 0; font-size: 12px; color: var(--lb-color-parchment-faint); }
.it__c { text-align: right; font-family: var(--db-num); font-size: 14px; font-variant-numeric: tabular-nums; }
.it__c small { display: block; font-size: 10.5px; color: var(--lb-color-parchment-faint); font-family: var(--lb-font-sans); }
.sug { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sug .btn { height: 26px; font-size: 12px; }

/* ---------- Rodapé: registro de rolagens ---------- */
.db-foot { position: relative; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px 0 var(--lb-space-5); border-top: 1px solid var(--lb-color-line); background: var(--lb-color-stone-sunken); font-size: 12.5px; }
.foot__last { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--lb-color-parchment-dim); }
.dim { color: var(--lb-color-parchment-faint); }
.lg__t { color: var(--lb-color-parchment); font-weight: 600; margin-right: 6px; }
.d20 {
  display: inline-grid; place-items: center; min-width: 24px; height: 20px; padding: 0 4px; margin: 0 2px; border-radius: 4px;
  border: 1px solid var(--lb-color-line-strong); font-family: var(--db-num); font-size: 13px; color: var(--lb-color-parchment);
}
.d20--20 { border-color: var(--db-amber); color: var(--db-amber-hi); box-shadow: 0 0 10px var(--db-amber-glow); }
.d20--1 { border-color: var(--db-bad); color: var(--db-bad); }
.lg__p { font-family: var(--db-num); color: var(--lb-color-parchment-faint); margin: 0 2px; }
.lg__tot { font-family: var(--db-num); font-size: 15px; color: var(--db-amber-hi); }
.lg__x { color: var(--lb-color-parchment-faint); margin-left: 6px; }
.reg {
  position: absolute; right: 10px; bottom: 46px; width: min(520px, calc(100% - 20px)); max-height: 340px; overflow: auto; z-index: 3;
  padding: 6px 0; border-radius: var(--lb-radius-md); border: 1px solid var(--lb-color-line-strong);
  background: #1f1f24; box-shadow: var(--lb-shadow-md);
}
.reg ol { list-style: none; margin: 0; padding: 0; }
.reg li { padding: 7px 14px; border-bottom: 1px solid var(--lb-color-line); font-size: 12.5px; color: var(--lb-color-parchment-dim); }
.reg li:last-child { border-bottom: 0; }

/* ---------- Construtor de técnica ---------- */
.db-builder {
  position: absolute; inset: 0; z-index: 6; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--lb-color-stone-solid);
  opacity: 0; transform: translateY(6px);
  transition: opacity 180ms var(--lb-gr-ease-out), transform 220ms var(--lb-gr-ease-out);
}
.db-builder[data-on] { opacity: 1; transform: none; }
.db-builder[data-saindo] { transition-duration: 120ms; }
.bd-head { display: flex; align-items: center; gap: 16px; padding: 12px var(--lb-space-5); border-bottom: 1px solid var(--lb-color-line); }
.bd-head__t { margin: 0; font-family: var(--lb-font-display); font-weight: 400; font-size: 18px; white-space: nowrap; }
.bd-nome { flex: 1; max-width: 360px; height: 32px; font-size: 14px; }
.bd-main { display: grid; grid-template-columns: minmax(0, 1fr) 352px; min-height: 0; }
.bd-left { display: flex; flex-direction: column; min-height: 0; padding: 14px var(--lb-space-5) 0; gap: 12px; }
.bd-right { overflow: auto; border-left: 1px solid var(--lb-color-line); padding: 14px var(--lb-space-5) var(--lb-space-5); background: var(--lb-color-stone-sunken); scrollbar-width: thin; }
.bd-foot { display: flex; align-items: center; gap: 8px; padding: 10px var(--lb-space-5); border-top: 1px solid var(--lb-color-line); }
.bd-foot__sp { flex: 1; }
.bd-foot .motivo { max-width: 46ch; text-align: right; }
.bd-conf { display: flex; align-items: center; gap: 8px; color: var(--lb-color-parchment); }
.fs { border: 0; margin: 0; padding: 0; min-width: 0; }
.fs legend { padding: 0; margin-bottom: 6px; font-size: 12px; color: var(--lb-color-parchment-dim); }
.ranks { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.rkb, .tpb {
  display: grid; justify-items: start; gap: 1px; padding: 6px 9px 7px; text-align: left;
  border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-sm); background: transparent; color: var(--lb-color-parchment-dim);
  transition: border-color 120ms ease, background-color 120ms ease, transform 140ms var(--lb-gr-ease-out);
}
.rkb:active, .tpb:active { transform: scale(0.97); }
.rkb[aria-checked="true"], .tpb[aria-checked="true"] { border-color: var(--db-amber-line); background: var(--db-amber-soft); color: var(--lb-color-parchment); }
@media (hover: hover) and (pointer: fine) { .rkb:hover, .tpb:hover { border-color: var(--lb-color-line-strong); } }
.rkb__l { font-family: var(--db-num); font-stretch: 75%; font-size: 22px; line-height: 1; }
.rkb[aria-checked="true"] .rkb__l { color: var(--db-amber-hi); text-shadow: 0 0 10px var(--db-amber-glow); }
.rkb__n, .rkb__p, .tpb__s { font-size: 11px; color: var(--lb-color-parchment-faint); white-space: nowrap; }
.rkb__pdl { font-size: 10.5px; color: var(--db-amber-dim); white-space: nowrap; }
.tipos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tpb__n { font-size: 13px; }
.hib { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--lb-color-parchment-faint); }
.lbls { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.lbls__top { display: grid; gap: 8px; }
.lbls__top input { height: 32px; width: 100%; }
.cats { display: flex; gap: 2px; border-bottom: 1px solid var(--lb-color-line); }
.cats button { height: 32px; padding: 0 10px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--lb-color-parchment-dim); font-size: 12.5px; white-space: nowrap; }
.cats button[aria-selected="true"] { color: var(--lb-color-parchment); border-bottom-color: var(--db-amber); }
.cats[data-busca] button { opacity: 0.45; }
.cats__n { font-family: var(--db-num); font-size: 11px; color: var(--lb-color-parchment-faint); margin-left: 3px; }
.lbls__list { flex: 1; min-height: 0; overflow: auto; padding: 6px 0 14px; scrollbar-width: thin; }
.lbls__g { margin: 10px 0 4px; font-size: 11.5px; color: var(--lb-color-parchment-faint); }
.lbl {
  width: 100%; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; column-gap: 10px; align-items: start;
  padding: 7px 10px; text-align: left; border: 1px solid transparent; border-radius: var(--lb-radius-sm); background: transparent;
  transition: background-color 100ms ease;
}
@media (hover: hover) and (pointer: fine) { .lbl:hover { background: var(--lb-color-stone-hover); } }
.lbl[aria-pressed="true"] { background: var(--db-amber-soft); border-color: rgba(255, 173, 66, 0.28); }
.lbl__i { margin-top: 3px; width: 13px; height: 13px; border-radius: 3px; border: 1px solid var(--lb-color-parchment-faint); display: grid; place-items: center; }

.cst { font-family: var(--db-num); font-size: 12px; font-variant-numeric: tabular-nums; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--db-amber-line); color: var(--db-amber-hi); white-space: nowrap; }

.pts__big { font-family: var(--db-num); font-stretch: 75%; font-weight: 300; font-size: 34px; line-height: 1; color: var(--db-amber-hi); font-variant-numeric: tabular-nums; text-shadow: 0 0 14px var(--db-amber-glow); }
.pts__big small { font-size: 18px; color: var(--lb-color-parchment-faint); text-shadow: none; }

.pts__exp { margin: 6px 0 0; font-size: 12px; color: var(--lb-color-parchment-faint); }

.stats__ki { font-family: var(--db-num); font-stretch: 75%; font-weight: 300; font-size: 34px; line-height: 1; color: var(--db-ki-hi); text-shadow: 0 0 14px var(--db-ki-glow); font-variant-numeric: tabular-nums; }

.stats li { display: flex; justify-content: space-between; gap: 8px; }
.stats li b { font-family: var(--db-num); font-weight: 400; color: var(--lb-color-parchment-dim); }
.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

.tiers b { font-family: var(--db-num); font-weight: 400; font-size: 20px; font-variant-numeric: tabular-nums; }

.sel-l { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }

.msgs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }

.esp { display: grid; gap: 14px; overflow: auto; padding-bottom: 16px; }

/* ---------- Dica de fórmula ---------- */
.tip {
  position: fixed; z-index: 50; top: 0; left: 0; max-width: 310px; padding: 10px 12px;
  border-radius: var(--lb-radius-md); border: 1px solid var(--lb-color-line-strong);
  background: #222227; box-shadow: var(--lb-shadow-md); font-size: 12px; pointer-events: none;
  opacity: 0; transform: translateY(3px) scale(0.98); transform-origin: var(--to, 50% 100%);

}

.tip__t { margin: 0 0 6px; font-weight: 600; color: var(--lb-color-parchment); }

@media (prefers-reduced-motion: reduce) {

  .db-builder { transform: none; }

}

emplo 6.7 usa +4"},"al":{"forma":"cone_a_partir_do_usuario","inicial_m":6,"por_ponto_extra_m":1.5},"acumula":true,"restricoes":[],"efeito":"Técnica que atinge todos em um cone de 6,0m, partindo do usuário, aumenta o custo da técnica em +3. Para cada 1 ponto de rótulo extra investido além do inicial aumenta a área em 1,5m, além do custo da técnica em Ki em +3.","pagina":62},{"nome":"Alcance – Projétil","categoria":"base","custo":"1 a Variável","cp":{"tipo":"variavel_com_minimo","min":1,"max":null},"ki":{"inicial":2,"por_ponto_extra":2},"al":{"forma":"projetil_alvo_unico","inicial_m":9,"por_ponto_extra_m":1.5},"acumula":true,"restricoes":[],"efeito":"Disparos direcionados de Ki ou golpes lançados à distância, com alcance inicial de 9,0m e aumenta o custo da técnica em +2. Para cada 1 ponto de rótulo extra investido além do inicial aumenta o alcance em 1,5m, além do custo da técnica em Ki em +2.","pagina":62},{"nome":"Alcance – Arco","categoria":"base","custo":"2 a Variável","cp":{"tipo":"variavel_com_minimo","min":2,"max":null},"ki":{"inicial":3,"por_ponto_extra":3},"al":{"forma":"parabolico_ate_alvo_ou_ponto","inicial_m":9,"por_ponto_extra_m":1.5},"acumula":true,"restricoes":["Tetos, cúpulas, galhos densos ou barreiras superiores podem impedir o uso, a critério do narrador"],"efeito":"O usuário lança a técnica em trajetória parabólica até um alvo ou ponto a até 9,0m e aumenta o custo da técnica em +3. A trajetória passa por cima de criaturas e coberturas, desde que exista espaço livre acima do percurso. Tetos, cúpulas, galhos densos ou barreiras superiores podem impedir o uso, a critério do narrador. Quando combinado com um rótulo de alcance em área que não seja centrado no usuário, a área nasce do ponto de queda. Para cada 1 ponto de rótulo extra investido além do inicial aumenta o alcance em 1,5m, além do custo da técnica em Ki em +3.","pagina":62},{"nome":"Alcance – Meia-Lua","categoria":"base","custo":"2 a Variável","cp":{"tipo":"variavel_com_minimo","min":2,"max":null},"ki":{"inicial":null,"por_ponto_extra":4,"nota":"o texto não dá aumento inicial de Ki"},"al":{"forma":"arco_semicircular_180","inicial_m":3,"por_ponto_extra_m":1.5},"acumula":true,"restricoes":[],"efeito":"O usuário desfere um golpe em arco semicircular à sua frente, atingindo todos os alvos sobre a curvatura do golpe, mas não os que estiverem no espaço interno entre o usuário e o arco. O alcance inicial da curvatura é de 3,0m, cobrindo um semicírculo de 180°. Quando combinado com um alcance não em área, a meia-lua surge no ponto final do alcance combinado. Para cada 1 ponto de rótulo extra investido além do inicial aumenta a área em 1,5m, além do custo da técnica em Ki em +4.","pagina":62},{"nome":"Alcance – Coluna","categoria":"base","custo":"3 a Variável","cp":{"tipo":"variavel_com_minimo","min":3,"max":null},"ki":{"inicial":2,"por_ponto_extra":2},"al":{"forma":"coluna_vertical_em_ponto","inicial_m":9,"raio_m":3,"por_ponto_extra_m":1.5},"acumula":true,"restricoes":[],"efeito":"O usuário faz a técnica eclodir em uma coluna vertical num ponto visível a até 9,0m e aumenta o custo da técnica em +2. A coluna possui raio inicial de 3,0m e atinge criaturas em qualquer nível de altura que cruze sua projeção vertical, do solo ao ar. Pode atingir simultaneamente alvos no chão, em voo baixo e em voo alto, desde que estejam dentro da mesma projeção. Para cada 1 ponto de rótulo extra investido além do inicial aumenta o alcance em 1,5m, além do custo da técnica em Ki em +2.","pagina":62},{"nome":"Alcance – Anel","categoria":"base","custo":"3 a Variável","cp":{"tipo":"variavel_com_minimo","min":3,"max":null},"ki":{"inicial":2,"por_ponto_extra":2},"al":{"forma":"anel","raio_externo_m":4.5,"raio_interno_seguro_m":1.5,"por_ponto_extra_m":1.5},"acumula":true,"restricoes":[],"efeito":"O usuário desfere um golpe em forma de anel, criando uma área circular vazia no centro, aumentando o custo da técnica em +2. Usado sozinho, o anel é centrado no usuário. Seu raio externo inicial é de 4,5m, e o raio interno seguro é de 1,5m. Criaturas dentro do centro vazio não são atingidas. Quando combinado com um alcance não em área, o centro do anel passa a ser o ponto final do alcance combinado. Para cada 1 ponto de rótulo extra investido além do inicial aumenta a área em 1,5m, além do custo da técnica em Ki em +2.","pagina":63},{"nome":"Alcance – Paralelas","categoria":"base","custo":"3 a Variável","cp":{"tipo":"variavel_com_minimo","min":3,"max":null},"ki":{"inicial":3,"por_ponto_extra":3},"al":{"forma":"duas_linhas_paralelas","inicial_m":6,"faixa_segura_m":1.5,"por_ponto_extra_m":1.5},"acumula":true,"restricoes":[],"efeito":"O usuário executa a técnica em duas linhas retas paralelas ao mesmo tempo. Cada linha tem alcance inicial de 6,0m, e ambas ficam separadas por uma faixa segura de 1,5m entre elas, aumentando o custo da técnica em +3. Usado sozinho, parte do usuário. Quando combinado com um alcance não em área, ambas as linhas partem do ponto final do alcance combinado. Para cada 1 ponto de rótulo extra investido além do inicial, aumenta o comprimento de ambas as linhas em 1,5m, além do custo da técnica em Ki em +3.","pagina":63},{"nome":"Alcance – Linha Quebrada","categoria":"base","custo":"3 a Variável","cp":{"tipo":"variavel_com_minimo","min":3,"max":null},"ki":{"inicial":2,"por_ponto_extra":3},"al":{"forma":"duas_linhas_uma_dobra_ate_90","inicial_m":6,"por_ponto_extra_m":1.5},"acumula":true,"restricoes":["O caminho precisa estar fisicamente livre; este rótulo não ignora cobertura nem atravessa bloqueios totais"],"efeito":"O usuário desfere a técnica em um trajeto composto por duas linhas retas consecutivas, formando uma única dobra, aumentando o custo da técnica em +2. O alcance total inicial é de 6,0m, distribuído livremente entre os dois trechos. A dobra pode formar até 90°. A técnica atinge todos os alvos tocados pelo trajeto. O caminho precisa estar fisicamente livre; este rótulo não ignora cobertura nem atravessa bloqueios totais. Para cada 1 ponto de rótulo extra investido além do inicial aumenta o alcance em 1,5m, além do custo da técnica em Ki em +3.","pagina":63},{"nome":"Alcance – Meteórico","categoria":"base","custo":"3 a Variável","cp":{"tipo":"variavel_com_minimo","min":3,"max":null},"ki":{"inicial":3,"por_ponto_extra":3},"al":{"forma":"queda_vertical_em_ponto","inicial_m":9,"raio_m":1.5,"por_ponto_extra_m":1.5},"acumula":true,"restricoes":["tetos, abóbadas, cavernas baixas e barreiras acima do ponto de impacto podem impedir o uso"],"efeito":"O usuário escolhe um ponto visível a até 9,0m, e a técnica despenca verticalmente sobre ele, aumentando o custo da técnica em +3. A área inicial de impacto é um raio de 1,5m. Diferente de Projétil, o trajeto até o ponto não é horizontal: criaturas entre o usuário e o alvo não fornecem cobertura nem bloqueiam o ataque, mas tetos, abóbadas, cavernas baixas e barreiras acima do ponto de impacto podem impedir o uso. Para cada 1 ponto de rótulo extra investido além do inicial aumenta o alcance em 1,5m, além do custo da técnica em Ki em +3.","pagina":63},{"nome":"Dano de Cerco","categoria":"tipo_dano","custo":"1","cp":{"tipo":"fixo","min":1,"max":1},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica causa o dobro de dano em estruturas.","pagina":63},{"nome":"Dano Cortante","categoria":"tipo_dano","custo":"4","cp":{"tipo":"fixo","min":4,"max":4},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnica focada em cortes profundos e mutilação, altera o tipo do dano da técnica para \"Cortante\". Além disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Constituição ou Destreza vs o Acerto Rolado, a depender do resultado o seguinte acontece (Não Afetado Pela Escala Alteração de Escala de Poder):\n\n- • Se o alvo falhar por 12 ou mais, perde a cabeça ou metade do corpo, se não possuir propriedades regenerativas, a morte é considerada automática.\n- • Se o alvo falhar por 6 a 11, perde permanentemente se não possuir propriedades regenerativas, um dos braços ou pernas a escolha do atacante.\n- • Se o alvo falhar por 3 a 5, sofre dano extra equivalente ao Dano Médio, que a técnica daria somado ao dano causado.\n- • Se o alvo falhar por 1 a 2, sofre dano extra equivalente ao Dano Mínimo, que a técnica daria somado ao dano causado.","pagina":63},{"nome":"Dano Perfurante","categoria":"tipo_dano","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":null,"al":null,"acumula":true,"restricoes":["sendo acumulativo"],"efeito":"Técnica focada em perfurar armaduras e corpos resistentes, altere o tipo de dano da técnica para \"Perfurante\". Além disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Constituição ou Destreza vs o Acerto Rolado, a depender do resultado o seguinte acontece (Não Afetado Pela Escala Alteração de Escala de Poder):\n\n- • Se o alvo falhar por 12 ou mais, perde 6 pontos de CA até o final de seu próximo turno, sendo acumulativo.\n- • Se o alvo falhar por 6 a 11, perde 4 pontos de CA até o final de seu próximo turno sendo acumulativo.\n- • Se o alvo falhar por 3 a 5, perde 2 pontos de CA até o final de seu próximo turno, sendo acumulativo.\n- • Se o alvo falhar por 1 a 2, perde 1 pontos de CA até o final de seu próximo turno, sendo acumulativo.","pagina":64},{"nome":"Dano Contundente","categoria":"tipo_dano","custo":"4","cp":{"tipo":"fixo","min":4,"max":4},"ki":null,"al":null,"acumula":false,"restricoes":["não é acumulativo"],"efeito":"Técnica focada em impactos massivos que fazem o alvo tremer com a força dos golpes, altere o tipo de dano da técnica para \"Contundente\". Além disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Constituição ou Destreza vs o Acerto Rolado, a depender do resultado o seguinte acontece (Não Afetado Pela Escala Alteração de Escala de Poder):\n\n- • Se o alvo falhar por 12 ou mais, o gasto de Ki é aumentado em x5 até o final de seu próximo turno, não é acumulativo.\n- • Se o alvo falhar por 6 a 11, o gasto de Ki é aumentado em x4 até o final de seu próximo turno, não é acumulativo.\n- • Se o alvo falhar por 3 a 5, o gasto de Ki é aumentado em x3 até o final de seu próximo turno, não é acumulativo.\n- • Se o alvo falhar por 1 a 2, o gasto de Ki é aumentado em x2 até o final de seu próximo turno, não é acumulativo.","pagina":64},{"nome":"Dano Potente","categoria":"tipo_dano","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnicas focadas em causar o máximo de dano possível, altere o tipo de dano da técnica para \"Potente\". Além disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Constituição ou Destreza vs o Acerto Rolado, caso o alvo não passe a técnica irá ignorar qualquer mitigação de dano.","pagina":64},{"nome":"Dano Dilacerante","categoria":"tipo_dano","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnicas que deixam ferimentos internos tão graves que se tornam impossíveis de curar, altere o tipo de dano da técnica para \"Dilacerante\". Além disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Constituição vs o Acerto Rolado, caso o alvo não passe ele não poderá regenerar o dano específico causado até o final da batalha.","pagina":65},{"nome":"Dano Consumidor","categoria":"tipo_dano","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnicas que reduzem um ser vivo a pó, sem deixar vestígios, altere o tipo de dano da técnica para \"Consumidor\". Alvos que cheguem a 0 de PV's por conta de uma técnica com este tipo de dano, não tem direito a Salvaguardas Contra Morte, sendo considerado que seus corpos foram reduzidos a nada, caso não passem em um Teste de Constituição vs Acerto da Rolado, assim evitando que quaisquer talentos e características que façam o alvo retornar a batalha sejam cancelados.","pagina":65},{"nome":"Dano Elemental – Ígneo","categoria":"tipo_dano","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":null,"al":null,"acumula":false,"restricoes":["Esse dano não é acumulativo, logo caso receba novamente este efeito, prevalece o que causar maior dano"],"efeito":"Técnicas que conseguem utilizar o Ki para manipular ou produzir o elemento do fogo, altere o tipo de dano da técnica para \"Ígneo\". Além disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Constituição vs o Acerto Rolado, caso o alvo não passe, ele passa a receber ao final de cada um dos seus turnos dano de fogo das queimaduras equivalente ao dano mínimo da técnica que causou o efeito. Esse dano não é acumulativo, logo caso receba novamente este efeito, prevalece o que causar maior dano. Para livrar-se do dano, no início dos seus turnos ele pode repetir o teste, sempre contra o mesmo resultado do acerto rolado, caso supere irá anular o efeito.","pagina":65},{"nome":"Dano Elemental – Elétrico","categoria":"tipo_dano","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnicas que conseguem utilizar o Ki para manipular ou produzir o elemento do raio, altere o tipo de dano da técnica para \"Elétrico\". Além disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Constituição vs o Acerto Rolado, caso o alvo não passe seu corpo fica carregado, tornando-se uma espécie de para-raios onde enquanto estiver dessa forma, todas as rolagens de acerto contra o alvo que sejam oriundas de técnicas com o dano elemental elétrico, são considerados acertos automáticos, onde causam no mínimo dano médio. Para livrar-se do efeito, no início dos seus turnos ele pode repetir o teste, sempre contra o mesmo resultado do acerto rolado, caso supere irá anular o efeito.","pagina":65},{"nome":"Dano Elemental – Gélido","categoria":"tipo_dano","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnicas que conseguem utilizar o Ki para manipular ou produzir o elemento da água alterando seu estado, altere o tipo de dano da técnica para \"Gélido\". Além disso disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Constituição vs o Acerto Rolado, caso o alvo não passe seu corpo fica encrostado de gelo, dificultando seus movimentos e refletindo isso na necessidade de gastar mais Ki para agir com normalidade, onde caso o afetado não gaste uma quantidade de Pk's a mais ao utilizar suas ações ou reações, igual a pontuação que foi passada na CA pela rolagem de acerto, o alvo realiza sua ação com desvantagem, além de perder metade do deslocamento. Para livrar-se do efeito, no início dos seus turnos ele pode repetir o teste, sempre contra o mesmo resultado do acerto rolado, caso supere irá anular o efeito.","pagina":65},{"nome":"Dano Elemental - Dano Sombrio","categoria":"tipo_dano","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnicas imbuídas com energia negativa, corrompendo corpo e espírito. Altere o tipo de dano para \"Sombrio\". Além disso disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Constituição vs o Acerto Rolado, caso o alvo não passe seu corpo fica imbuído de Ki Negativo descontrolado, fazendo com que suas ações causem dano a si mesmo de forma passiva, recebendo dano fixo sempre que gastar Ki, equivalente a 1 PK gasto 1 de Dano recebido. Para livrar-se do efeito, no início dos seus turnos ele pode repetir o teste, sempre contra o mesmo resultado do acerto rolado, caso supere irá anular o efeito.","pagina":66},{"nome":"Dano Desintegrante","categoria":"tipo_dano","custo":"4","cp":{"tipo":"fixo","min":4,"max":4},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnicas que desintegram matéria em escala subatômica. Altere o tipo de dano para \"Desintegrante\". Além disso disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Constituição vs o Acerto Rolado, a depender do resultado o seguinte acontece (Não Afetado Pela Escala Alteração de Escala de Poder):\n\n- • Se o alvo falhar por 12 ou mais, sofre dano extra equivalente ao Dano Crítico de um Dano Máximo, que a técnica daria somado ao dano causado.\n- • Se o alvo falhar por 6 a 11, sofre dano extra equivalente ao Dano Máximo, que a técnica daria somado ao dano causado.\n- • Se o alvo falhar por 3 a 5, sofre dano extra equivalente ao Dano Médio, que a técnica daria somado ao dano causado.\n- • Se o alvo falhar por 1 a 2, sofre dano extra equivalente ao Dano Mínimo, que a técnica daria somado ao dano causado.","pagina":66},{"nome":"Dano Psíquico","categoria":"tipo_dano","custo":"4","cp":{"tipo":"fixo","min":4,"max":4},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnicas que atingem a mente diretamente. Altere o tipo de dano para \"Psíquico\". Além disso disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Sabedoria vs o Acerto Rolado, a depender do resultado o seguinte acontece (Não Afetado Pela Escala Alteração de Escala de Poder):\n\n- • Se o alvo falhar por 12 ou mais, sofre desvantagem em suas rolagens de ataque e reação, além disso caso erre um golpe recebe em si metade do dano médio que ele causaria como dano verdadeiro, isso até livrar-se do efeito que é equivalente a ter sucesso em uma nova rolagem do Teste do Rótulo.\n- • Se o alvo falhar por 6 a 11, sofre desvantagem em suas rolagens de ataque e reação, além disso caso erre um golpe recebe em si metade do dano mínimo que ele causaria como dano verdadeiro, isso até livrar-se do efeito que é equivalente a ter sucesso em uma nova rolagem do Teste do Rótulo.\n- • Se o alvo falhar por 3 a 5, sofre desvantagem em suas rolagens de ataque e reação até livrar-se do efeito que é equivalente a ter sucesso em uma nova rolagem do Teste do Rótulo.\n- • Se o alvo falhar por 1 a 2, sofre desvantagem em suas rolagens de ataque até livrar-se do efeito que é equivalente a ter sucesso em uma nova rolagem do Teste do Rótulo.","pagina":66},{"nome":"Dano Temporal","categoria":"tipo_dano","custo":"6","cp":{"tipo":"fixo","min":6,"max":6},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnicas que distorcem o tempo ao redor do alvo. Altere o tipo de dano para \"Temporal\". Além disso disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Constituição vs o Acerto Rolado, a depender do resultado o seguinte acontece (Não Afetado Pela Escala Alteração de Escala de Poder):\n\n- • Se o alvo falhar por 12 ou mais, sofre dano por turno de ação equivalente ao dano crítico de um dano máximo que a técnica pode causar até o fim da batalha\n- • Se o alvo falhar por 6 a 11, sofre dano por turno de ação equivalente ao dano máximo que a técnica pode causar até o fim da batalha.\n- • Se o alvo falhar por 3 a 5, sofre dano por turno de ação equivalente ao dano médio que a técnica pode causar até o fim da batalha.\n- • Se o alvo falhar por 1 a 2, sofre dano por turno de ação equivalente ao dano mínimo que a técnica pode causar até o fim da batalha.","pagina":67},{"nome":"Dano Vibratório","categoria":"tipo_dano","custo":"4","cp":{"tipo":"fixo","min":4,"max":4},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnicas que usam vibrações ultrassônicas para causar dano interno. Altere o tipo de dano para \"Vibratório\". Além disso disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Constituição vs o Acerto Rolado, caso o alvo não passe seu corpo fica completamente instável por conta das vibrações, e não pode mais mitigar dano. Para livrar-se do efeito, no início dos seus turnos ele pode repetir o teste, sempre contra o mesmo resultado do acerto rolado, caso supere irá anular o efeito.","pagina":67},{"nome":"Dano Sonoro","categoria":"tipo_dano","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnicas que usam ondas sonoras para desestabilizar o alvo. Altere o tipo de dano para \"Sonoro\". Além disso disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Constituição vs o Acerto Rolado, caso o alvo não passe seu corpo fica desestabilizado e suas reações prejudicadas apenas podendo ser roladas com desvantagem. Para livrar-se do efeito, no início dos seus turnos ele pode repetir o teste, sempre contra o mesmo resultado do acerto rolado, caso supere irá anular o efeito.","pagina":67},{"nome":"Dano Gravitacional","categoria":"tipo_dano","custo":"5","cp":{"tipo":"fixo","min":5,"max":5},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnicas que manipulam a gravidade, esmagando ou limitando movimento. Altere o tipo de dano para \"Gravitacional\". Além disso disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Destreza ou Força vs o Acerto Rolado, caso o alvo não passe seu corpo fica a mercê do causador do efeito, fazendo com que sua ação de movimento seja controlada por ele e não seja mais sua perdendo ela, mas, somente no turno de ação do alvo ele pode te mover, no seu turno não há mais ação de movimento. Para livrar-se do efeito, no início dos seus turnos ele pode repetir o teste, sempre contra o mesmo resultado do acerto rolado, caso supere irá anular o efeito.","pagina":68},{"nome":"Dano de Drenagem","categoria":"tipo_dano","custo":"5","cp":{"tipo":"fixo","min":5,"max":5},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnicas que drenam energia vital. Altere o tipo de dano para \"Drenagem\". Além disso disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Inteligência vs o Acerto Rolado, caso o alvo não passe seu corpo fica lincado de forma involuntária ao alvo, todo o Ki que é gasto por você em suas rodadas de ação ou reação é repassado para o alvo causador do efeito como Pontos de Vida. Para livrar-se do efeito, no início dos seus turnos ele pode repetir o teste, sempre contra o mesmo resultado do acerto rolado, caso supere irá anular o efeito.","pagina":68},{"nome":"Dano Espiritual","categoria":"tipo_dano","custo":"5","cp":{"tipo":"fixo","min":5,"max":5},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnicas que drenam energia vital. Altere o tipo de dano para \"Drenagem\". Além disso disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Poder vs o Acerto Rolado, caso o alvo não passe seu corpo fica lincado de forma involuntária ao alvo, todo o Ki que é gasto por você em suas rodadas de ação ou reação é repassado para o alvo causador do efeito como Pontos de Ki extras que ficam disponíveis até serem gastos. Para livrar-se do efeito, no início dos seus turnos ele pode repetir o teste, sempre contra o mesmo resultado do acerto rolado, caso supere irá anular o efeito.","pagina":68},{"nome":"Dano Caótico","categoria":"tipo_dano","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnicas instáveis e imprevisíveis, feitas com Ki descontrolado. Altere o tipo de dano para \"Caótico\". Além disso disso, causar dano Crítico ou dobrar o limite necessário para causar um estágio de dano máximo, (por exemplo o estágio de dano máximo é 6, e você ultrapassar a CA do inimigo por 12) faz com que o alvo deva realizar um Teste de Constituição vs o Acerto Rolado, caso o alvo não passe seu corpo fica em estado caótico e sempre que realizar qualquer ação que gaste de Ki, tem 50% de chance de gastar o dobro para a realizar. Para livrar-se do efeito, no início dos seus turnos ele pode repetir o teste, sempre contra o mesmo resultado do acerto rolado, caso supere irá anular o efeito.","pagina":68},{"nome":"Dano Tracionante","categoria":"tipo_dano","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnica que aplica força de tração, puxão ou arraste violento sobre o alvo. Ao causar dano, o alvo pode ser puxado em linha reta em direção ao usuário, conforme o estágio de dano:\n\n- • 1,5m em dano mínimo\n- • 3,0m em dano médio\n- • 4,5m em dano máximo\n\nO alvo pode resistir com um Teste de Força ou Destreza contra o Acerto da Técnica. Se passar, não é puxado. Se colidir com uma criatura, ambas ficam adjacentes e a criatura atingida pelo arrasto sofre dano mínimo.","pagina":69},{"nome":"Dano Pregante","categoria":"tipo_dano","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnica que fixa o alvo a uma superfície por pressão, estaca, pressão de impacto ou cravação. Se o alvo estiver adjacente a uma parede, chão, coluna, rocha, árvore, estrutura ou superfície sólida relevante, ao causar dano ele realiza uma Teste de Destreza contra Acerto da Técnica; em falha, fica \"Pregado\" até o fim de seu próximo turno de ação.\n\n- • Pregado: o alvo não pode usar Ação de Movimento para sair do espaço atual. Ele ainda pode agir normalmente.","pagina":69},{"nome":"Dano Desarmante","categoria":"tipo_dano","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":null,"al":null,"acumula":null,"restricoes":["Ao causar dano máximo"],"efeito":"Técnica que golpeia arma, escudo, foco, instrumento ou item empunhado com precisão desarticuladora. Ao causar dano máximo, o alvo realiza uma Teste de Força ou Destreza contra o Acerto do Usuário. Em falha, o usuário escolhe um item empunhado pelo alvo, que é imediatamente derrubado em um espaço adjacente em até 4,5m. Se a falha for por 5 ou mais, o usuário também escolhe em qual espaço válido a até 9,0m o item cai.","pagina":69},{"nome":"Dano Laçante","categoria":"tipo_dano","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnica que fere de forma a prender, enroscar, enlaçar ou engatar o alvo ao usuário ou ao ponto de impacto. Ao causar dano, o usuário pode declarar o alvo como \"Laçado\" até o fim do próximo turno do usuário.\n\n- • Laçado: sempre que o alvo tentar aumentar a distância em relação ao usuário além da distância atual entre ambos, deve gastar PK extra igual à Escala de Poder do Usuário, para cada 1,5m. Se não puder ou não quiser pagar, seu movimento termina imediatamente no ponto atual.","pagina":69},{"nome":"Dano Lancinante","categoria":"tipo_dano","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnica que explora feridas já abertas ou o desequilíbrio gerado por danos recentes. Se o alvo já tiver sofrido dano desde o fim de seu último turno de ação, esta técnica causa um estágio de dano acima do resultado normal:\n\n- • mínimo vira médio\n- • médio vira máximo\n- • máximo recebe dano bônus igual ao dano mínimo da técnica","pagina":69},{"nome":"Dano Cisalhante","categoria":"tipo_dano","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnica que atinge em continuidade, atravessando um corpo e buscando o que está logo atrás. Se esta técnica causar dano ao alvo principal, e houver uma segunda criatura em linha reta imediatamente atrás dele, a até um número de metros igual a Escala de Poder do usuário na proporção de 1:4,5m, o usuário pode resolver a mesma rolagem de Acerto contra esse segundo alvo, e assim consecutivamente enquanto houver alvos.","pagina":69},{"nome":"Dano Farpante","categoria":"tipo_dano","custo":"5","cp":{"tipo":"fixo","min":5,"max":5},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnica que deixa fragmentos, dentes, lascas ou pontas agressivas alojadas na ferida. Ao causar dano, o alvo fica \"Farpado\" até o fim de seu próximo turno de ação.\n\n- • Farpado: a primeira vez nesse período em que o alvo: se mover mais de 1,5m, ou for movido à força por qualquer efeito, sofre dano mínimo da técnica e o efeito se encerra.","pagina":70},{"nome":"Dano Descompassante","categoria":"tipo_dano","custo":"4","cp":{"tipo":"fixo","min":4,"max":4},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnica que quebra o ritmo corporal do alvo, arruinando seu tempo de resposta. Ao causar dano, o alvo realiza uma Salvaguarda de Sabedoria contra o Acerto do Usuário. Em falha, na próxima rodada, sua posição de iniciativa passa a ser imediatamente depois da posição do usuário que o afetou.","pagina":70},{"nome":"Dano de Quebra","categoria":"tipo_dano","custo":"4","cp":{"tipo":"fixo","min":4,"max":4},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnica que pune defesas técnicas mal-sucedidas, esmagando a postura defensiva do alvo. Se o alvo usar uma reação de mitigação ou efeito similar contra este ataque e ainda assim sofrer ao menos dano mínimo, ele não pode voltar a usar essa mesma técnica ou reação específica até o fim de seu próximo turno de ação.","pagina":70},{"nome":"Dano Pulsante","categoria":"tipo_dano","custo":"4","cp":{"tipo":"fixo","min":4,"max":4},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnica que responde bem à repetição do mesmo padrão de dano sobre o mesmo corpo. A primeira vez em cada rodada que um alvo sofrer dano com este rótulo, nada adicional acontece. Mas se ele voltar a sofrer dano com \"Pulsante\" na mesma rodada, esse segundo dano sobe um estágio: mínimo vira médio, médio vira máximo e máximo recebe dano bônus igual ao dano mínimo.","pagina":70},{"nome":"Técnica de Acumulação – Ki","categoria":"ki","custo":"4","cp":{"tipo":"fixo","min":4,"max":4},"ki":{"carga_com_ki":"cada carga = custo normal da técnica em Ki"},"al":null,"acumula":null,"restricoes":["não se pode misturar a carga de Ki com a Carga por Rodada"],"efeito":"Envolve acumular energia em um ponto, para conseguir uma quantidade maior de dano no inimigo. Você gasta uma rodada ou uma quantidade de Ki para considerar o seu acúmulo.\n\n- Para Carga com Rodadas: A cada rodada acumulando energia, o dano da técnica aumenta um estágio, sendo uma rodada é igual a uma carga. Se o ataque acertar, ele sobe o estágio de Dano Mínimo → Dano Médio → Dano Máximo conforme as cargas acumuladas. Se o acúmulo ultrapassar o estágio máximo, o dano final recebe um bônus equivalente ao dano mínimo da técnica por rodada extra. Vamos aos exemplos:\n  - • Ex.1: Se um atacante passa três rodadas carregando e, rolar o acerto que atinge o Dano Máximo, como ele acumulou energia além do necessário, recebe um bônus adicional de três vezes o dano mínimo da técnica. Se a técnica causa 50 de dano e seu dano mínimo é 12, o total final será 86 de dano (50 + 12x3), já que ele tem três cargas extras acumuladas que vão além do dano máximo.\n  - • Ex.2: Caso o atacante tenha carregado por três rodadas, mas a rolagem resulte em Dano Mínimo, o acúmulo eleva o dano diretamente para o Dano Máximo (já que a diferença entre mínimo e máximo é de dois estágios). Como ainda sobra uma rodada extra, ela se converte em um bônus adicional de dano mínimo. Se a técnica causa 50 de dano e seu dano mínimo é 12, o total final será 62 de dano (50 + 12).\n- Para Carga com Ki: O usuário pode acelerar o carregamento gastando Ki extra. Cada carga equivale ao custo normal da técnica em Ki. Se uma técnica custa 5 de Ki, gastar 10 de Ki permite lançá-la instantaneamente como se tivesse sido carregada por uma rodada, seguindo as mesmas regras da carga por rodada. No entanto, não se pode misturar a carga de Ki com a Carga por Rodada, apenas pode escolher separadamente como a técnica vai ser carregada.","pagina":70},{"nome":"Técnica de Invisível – Ki","categoria":"ki","custo":"4","cp":{"tipo":"fixo","min":4,"max":4},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Essa técnica permite disfarçar seu Ki de forma tão precisa que ele se torna imperceptível para o inimigo. Como resultado, se o alvo tentar usar uma reação que exija uma rolagem contra uma técnica com esse rótulo, ele faz a rolagem com desvantagem. Caso a reação não exija rolagem, o alvo simplesmente não saberá de onde o ataque veio, dificultando sua resposta de forma interpretativa, mas, ainda podendo reagir.","pagina":71},{"nome":"Técnica de Fragmentação – Ki","categoria":"ki","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":{"inicial":6,"por_1_5m_raio_extra":4},"al":{"forma":"raio_de_fragmentacao","inicial_m":7.5},"acumula":null,"restricoes":["não podendo ser um rótulo utilizado em técnicas de dano em área"],"efeito":"Essa técnica permite fragmentar o ataque em múltiplos disparos menores, atingindo mais de um alvo sem deixar de ser considerada uma técnica de alvo único, não podendo ser um rótulo utilizado em técnicas de dano em área. O usuário realiza uma única rolagem de acerto contra um alvo principal, que determinará o dano total da técnica. Após isso, o dano pode ser dividido entre outros alvos próximos, desde que estejam dentro do alcance da técnica e possam ser acertados pela rolagem de acerto inicial, a área de alcance da fragmentação é igual a 7,5m de raio, esse rótulo aumenta em +6 o Ki da técnica, pode aumentar em +1,5m de raio o alcance a cada +4 de Ki investido nesse rótulo para aumentar o raio. Dessa forma, o usuário pode distribuir o dano livremente entre os alvos atingidos, sem ultrapassar o total determinado pela rolagem inicial, e ainda permanecendo uma parte no alvo principal, e distribuindo efeitos negativos se a técnica possuir.\n\n- • Ex.1: Um lutador dispara uma rajada de energia com Técnica de Fra
