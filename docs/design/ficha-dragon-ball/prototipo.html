gmentação que causa 60 de dano ao acertar o alvo principal. Como a técnica permite dividir esse dano entre o alvo principal e outros ao redor no alcance, o usuário decide transferir 30 de dano para um inimigo próximo e os outros 30 ficam no alvo principal. Caso prefira, poderia distribuir o dano de forma diferente, como 40 para um alvo e 20 para outro, desde que o total não exceda o dano inicial causado, no entanto, pelo menos algum valor deve ficar para o alvo principal, a não ser que ele não seja atingido pela rolagem de acerto, mas os outros ao redor sim.","pagina":71},{"nome":"Técnica Guiada – Ki","categoria":"ki","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":{"por_nova_rolagem":"custo original da técnica"},"al":null,"acumula":null,"restricoes":[],"efeito":"Essa técnica permite ao usuário redirecionar o ataque em pleno trajeto, tornando a esquiva do inimigo mais difícil. Caso a rolagem de acerto resulte em uma falha, o atacante pode gastar uma quantidade de Ki equivalente ao custo original da técnica para realizar uma nova rolagem de acerto. O usuário pode escolher entre tentar atingir o inimigo imediatamente ou esperar até seu próximo turno para reposicionar o ataque e tentar acertar novamente.","pagina":71},{"nome":"Técnica de Implosão – Ki","categoria":"ki","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":{"por_nova_rolagem":"a mesma quantidade necessária para utilizar a técnica"},"al":null,"acumula":null,"restricoes":[],"efeito":"Essa técnica permite que, caso o ataque falhe, ele não desapareça, mas permaneça pairando ao redor do inimigo, acumulando energia com um dano equivalente ao dano mínimo da técnica a cada erro. Em qualquer momento posterior do combate, desde que o usuário tenha Ki suficiente, ele pode gastar a mesma quantidade necessária para utilizar a técnica e realizar uma nova rolagem de acerto. Caso acerte, toda a energia acumulada implode em um único ponto, causando no alvo todo o dano acumulado, de forma fixa, apenas dependendo de acertar o alvo. Além disso, mesmo que a técnica acerte, o usuário pode optar por não causar dano imediatamente e, em vez disso, deixar a energia flutuando ao redor do inimigo com o dano que ela causaria, mas, isso o faz perder aquele acerto. Isso permite acumular mais dano ao longo do combate, tornando o ataque final ainda mais devastador, quando o implodir.\n\n- • Ex.1: Um guerreiro lança sua Técnica de Implosão contra um inimigo, mas erra. A energia fica flutuando ao redor do oponente, acumulando 20 de dano (equivalente ao dano mínimo da técnica). No turno seguinte, ele tenta novamente… e erra outra vez. Agora, a energia acumulada soma 40 de dano. Mais uma tentativa… e mais um erro! A técnica continua pairando, elevando o dano acumulado para 60. Cansado de errar, o guerreiro decide apostar tudo. Ele reúne seu Ki, faz uma nova rolagem de acerto e, desta vez, finalmente acerta. Toda a energia acumulada implode de uma só vez, causando 60 de dano fixo, destruindo o inimigo em uma explosão massiva.","pagina":72},{"nome":"Técnica Expansiva – Ki","categoria":"ki","custo":"?","cp":{"tipo":"consome_todos_positivos_base","min":null,"max":null},"ki":null,"al":{"forma":"raio_ao_redor_do_alvo","por_rotulo_investido_m":1.5},"acumula":null,"restricoes":["Obrigatoriamente a base da técnica deve ser de Alcance Projétil","Não funciona para técnicas que já são em área"],"efeito":"Essa técnica gera uma explosão que se expande rapidamente, aumentando sua área de efeito. Sendo a área em raio, onde o alcance é equivalente a 1,5m por rótulo investido nessa técnica, ou seja, se você investir 3 a área seria de 4,5m de raio. Obrigatoriamente a base da técnica deve ser de Alcance Projétil.\n\n- • Ao tentar acertar, a explosão atinge não apenas o alvo principal, mas também todos os inimigos em um raio próximo equivalente ao da técnica.\n- • Não funciona para técnicas que já são em área.","pagina":72},{"nome":"Reação em Cadeia – Ki","categoria":"ki","custo":"4","cp":{"tipo":"fixo","min":4,"max":4},"ki":{"por_salto":0},"al":null,"acumula":null,"restricoes":[],"efeito":"Permite que a técnica, ao atingir um alvo, tenha a capacidade de ir saltando para outro alvo próximo, mantendo a rolagem de acerto inicial, se o alvo mais próximo puder ser acertado por essa rolagem, a técnica salta para causar dano a ele sem custo adicional de Ki. No entanto, se a técnica errar qualquer um dos alvos subsequentes, ela é interrompida e não prossegue, encerrando a reação em cadeia, ou quando não houver mais alvos.","pagina":72},{"nome":"Ricochete – Ki","categoria":"ki","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Permite que, caso a técnica erro o alvo, ela possa quicar em um obstáculo próximo (como uma parede, rocha ou qualquer estrutura sólida) e, em seguida, tentar um novo ataque em um ângulo diferente, sendo o alcance da técnica novo considerado a partir daquele ponto a um novo alvo, se possível interpretativamente, a depender do local de combate. O novo alvo não pode ser o mesmo que já tenha sido alvejado pelo seu ricochete naquela rodada, caso não tenha novos alvos, a técnica se encerra.","pagina":72},{"nome":"Explosão Retardada – Ki","categoria":"ki","custo":"4","cp":{"tipo":"fixo","min":4,"max":4},"ki":{"detonacao":0},"al":null,"acumula":null,"restricoes":[],"efeito":"Permite uma técnica em que o projétil de Ki, ao atingir o alvo, fica preso a ele sem causar dano imediato. O usuário tem total controle sobre o momento da detonação, podendo ativar a explosão a qualquer instante sem precisar gastar Ki adicional. O alvo, ao perceber que foi atingido, pode gastar Ki equivalente ao custo de Ki gasto pelo usuário para se livrar do projétil. Se o alvo não fizer isso, o projétil permanece no alvo. Caso o usuário deseje, ele pode ativar a explosão a qualquer momento, causando o dano da técnica. Além disso, o usuário pode enganar o alvo, fazendo-o reagir ao projétil e, após isso, decidir não ativar a explosão, forçando o inimigo a gastar recursos sem necessidade. Em resumo, o projétil de Ki permanece no alvo até o momento da detonação, e o usuário pode manipular o tempo da explosão ou até enganar o inimigo para que ele gaste recursos de forma desnecessária.","pagina":73},{"nome":"Ativação Remota – Ki","categoria":"ki","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":{"ativacao":0},"al":null,"acumula":null,"restricoes":[],"efeito":"Permite que o usuário controle o momento exato em que a técnica será ativada, mesmo após seu lançamento. Ao utilizar essa técnica, o projétil de Ki ou o efeito da técnica é disparado inicialmente sem causar dano imediato, ficando suspenso ou em espera até o momento desejado. O usuário pode, então, ativar a técnica a qualquer momento durante o combate, sem gastar mais Ki, apenas determinando o instante em que a técnica causará o impacto desejado, assim realizando as rolagens necessárias.","pagina":73},{"nome":"Técnica de Selamento – Ki","categoria":"ki","custo":"4","cp":{"tipo":"fixo","min":4,"max":4},"ki":{"por_tentativa":"custo da técnica"},"al":null,"acumula":null,"restricoes":[],"efeito":"As Técnicas de Selamento são utilizadas para aprisionar um inimigo com Ki, seja temporária ou permanentemente. Em situações onde um oponente não pode ser derrotado devido a um Poder de Luta (PDL) muito superior, o selamento pode ser uma alternativa para garantir a vitória temporária. Ao utilizar essa técnica e acertar o inimigo, inicia-se uma disputa de testes resistidos, onde o usuário precisa obter um determinado número de sucessos para selar o alvo completamente.\n\nRegras do Selamento:\n\n- • O número de sucessos necessários é igual a Escala de Poder do alvo.\n- • A disputa ocorre entre um Atributo do Selador e um Atributo de Resistência do alvo, ambos determinados na criação da técnica, de acordo com a coerência do efeito.\n- • Cada nova tentativa de selamento custa Ki equivalente ao custo da técnica.\n- • Se o usuário obtiver todos os sucessos necessários, o alvo é selado.\n- • Importante: Selar um inimigo não concede aumento de PDL para nenhum dos envolvidos na batalha.\n\nCaso o alvo consiga causar qualquer dano ao selador, todos os sucessos obtidos até o momento são anulados, e o processo deve recomeçar do zero. Para tentar selar novamente, o usuário precisará gastar o custo total de Ki da técnica e continuar realizando testes resistidos, consumindo mais Ki a cada tentativa, até alcançar o número necessário de sucessos.","pagina":73},{"nome":"Adicionar Cura","categoria":"ki","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":null,"al":null,"acumula":null,"restricoes":["você jamais pode usar uma técnica de cura para se curar, apenas a terceiros","obrigatoriamente esse rótulo deve estar acompanhado do rótulo \"Técnica Mágica\""],"efeito":"Este rótulo permite que a técnica cure um alvo em uma quantidade de Pontos de Vida (PV) equivalente ao seu dano base. No entanto, técnicas de cura no sistema, não são permitidas quando se trata de \"autocura\", ou seja, você jamais pode usar uma técnica de cura para se curar, apenas a terceiros. Além disso, obrigatoriamente esse rótulo deve estar acompanhado do rótulo \"Técnica Mágica\", sendo considerado uma. Cumpridos esses requisitos, o usuário deve rolar o dado de acerto contra a Classe de Armadura (CA) do aliado, assim como faria em um ataque comum. A quantidade curada segue a mecânica de variação de dano do sistema, aplicado a ela também a variação por escala, no entanto de uma maneira diferente:\n\n- • Se o acerto for 6- negativo da CA: Cura mínima (¼ do valor base).\n- • Se o acerto for 1~5 negativos da CA: Cura média (½ do valor base).\n- • Se o acerto for igual ou superior a CA: Cura completa (valor total da técnica).","pagina":73},{"nome":"Adicionar Classe de Armadura","categoria":"ki","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":null,"al":null,"acumula":true,"restricoes":[],"efeito":"Este rótulo permite que a técnica adicione uma quantidade de CA até o final do próximo turno do alvo, equivalente a +1 por rótulo deste investido na técnica.","pagina":74},{"nome":"Técnica Básica","categoria":"generico","custo":"?","cp":{"tipo":"consome_todos_positivos_base","min":null,"max":null},"ki":null,"al":null,"acumula":false,"restricoes":[],"efeito":"Técnica pura e direta com tipo de dano e alcance determinado em sua criação, com poucas modificações complexas. Por ser considerada uma técnica básica, pode ser utilizada de forma repetida no seu turno de ação. Serve para os ataques básicos como socos e esferas de ki genéricas.","pagina":74},{"nome":"Aumentar Dano por Ki","categoria":"generico","custo":"1","cp":{"tipo":"fixo","min":1,"max":1},"ki":{"por_1_ki":"+4 de dano"},"al":null,"acumula":null,"restricoes":["esse bônus não pode ultrapassar o limite máximo de Dano e de Ki por rank da técnica"],"efeito":"O usuário pode aumentar o dano base de sua técnica, investindo 1 ponto extra de Ki para aumentar o dano em +4. No entanto, esse bônus não pode ultrapassar o limite máximo de Dano e de Ki por rank da técnica.","pagina":74},{"nome":"Aumentar Precisão","categoria":"generico","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":{"por_rotulo":4},"al":null,"acumula":true,"restricoes":[],"efeito":"Envolve concentrar-se para aumentar a precisão do seu próximo golpe, podendo assim aumentar a rolagem de acerto em +1 para cada rótulo deste colocado em sua técnica. Fazer isto, também aumenta o custo de Ki dela em +4 para cada rótulo deste em sua técnica.","pagina":74},{"nome":"Técnica Variável","categoria":"generico","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Essa técnica tem duas versões, cada uma com um tipo de dano diferente entre os existentes, permitindo então que o atacante alterne entre esses tipos conforme a sua vontade no momento de conjuração.","pagina":74},{"nome":"Técnica à Queima-Roupa","categoria":"generico","custo":"1","cp":{"tipo":"fixo","min":1,"max":1},"ki":null,"al":null,"acumula":false,"restricoes":[],"efeito":"Permite que mesmo sendo uma técnica de longo alcance não sofra da regra de combate de \"Sob Ameaça\".","pagina":74},{"nome":"Técnica Combinada","categoria":"generico","custo":"4","cp":{"tipo":"fixo","min":4,"max":4},"ki":null,"al":null,"acumula":null,"restricoes":["outra que possua o mesmo rótulo e o mesmo tipo de dano"],"efeito":"Essa técnica permite fundir-se com outra que possua o mesmo rótulo e o mesmo tipo de dano, criando um único ataque mais poderoso. A fusão pode ocorrer entre técnicas de um mesmo personagem ou de personagens diferentes. Ao utilizar uma Técnica Combinada, cada usuário envolvido realiza uma rolagem de acerto separada. Caso apenas uma das rolagens acerte, o dano final será o dano total da técnica que acertou, somado ao dano mínimo da técnica que errou. Se ambas acertarem, o dano das técnicas é somado normalmente. Caso seja um personagem utilizando junto de outro, essa técnica ofensiva poderá ser gasta como uma reação, ou seja, fora da sua iniciativa, podendo ser executada desde que tenha recurso para isto.\n\n- • Ex.1: Dois guerreiros disparam técnicas combinadas de Ki contra um inimigo. O primeiro acerta sua rolagem e causaria 80 de dano, enquanto o segundo erra, cujo dano mínimo seria 20. Como uma das técnicas acertou, o dano final será 80 + 20, totalizando 100 de dano. Caso ambos tivessem acertado, o dano total seria a soma integral de ambas as técnicas.","pagina":74},{"nome":"Técnica de Cooperação","categoria":"generico","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":{"divisao":"cada um paga metade"},"al":null,"acumula":null,"restricoes":["Esse rótulo exige que a técnica com ele esteja em dois personagens"],"efeito":"Esse rótulo exige que a técnica com ele esteja em dois personagens. Quando ativada, ambos executam o ataque juntos, compartilhando os custos da técnica: sendo cada um a metade dos Pontos de Ki necessários para a conjuração. Ambos realizam uma rolagem de acerto e, entre os resultados, o maior será considerado como o acerto da técnica, aumentando as chances de sucesso. O personagem que não estiver no seu turno de ação, perde ele, caso já tenha o utilizado enquanto principal tenta conjurar, ela não será possível de uso.","pagina":75},{"nome":"Técnica de Pós-Imagem","categoria":"generico","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Utilizando sua velocidade extrema, o usuário cria uma pós-imagem, simulando a execução de uma técnica. O oponente, ao reagir, precisa fazer uma rolagem de Sabedoria contra o teste de acerto do usuário para perceber o truque.\n\n- • Se o alvo superar o teste, ele percebe a ilusão a tempo e pode trocar sua reação para algo mais adequado à verdadeira intenção do ataque.\n- • Se o alvo falhar, ele é enganado e não pode trocar a reação escolhida contra a pós-imagem, ficando vulnerável. O usuário, ao ver qual reação foi utilizada, pode trocar seu ataque na última hora para outra técnica, surpreendendo o inimigo, que não poderá alterar sua resposta.","pagina":75},{"nome":"Técnica Devastadora","categoria":"generico","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Se o inimigo estiver sofrendo qualquer efeito negativo, o dano causado pela técnica aumenta em um estágio caso acerte. Caso o ataque já tenha alcançado o estágio máximo de dano, o usuário adiciona um valor extra ao dano final equivalente ao dano mínimo que a técnica causaria.","pagina":75},{"nome":"Técnica de Impacto","categoria":"generico","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Essa técnica atinge o inimigo e causa deslocamento. O deslocamento causado depende do estágio de dano do acerto, sendo 3 metros para dano mínimo, 6 metros para dano médio e 9 metros para dano máximo, isso caso não passem em um teste de Acerto da Técnica vs Rolagem de Destreza ou Constituição o que for escolhido pelo alvo. Se o alvo colidir com uma estrutura sólida, como uma parede de pedra ou metal resistente, sofre dano extra equivalente ao dano mínimo da técnica. Caso atinja um objeto destrutível, como uma árvore ou um muro de tijolos, a estrutura pode ser destruída. Se houver um inimigo ou aliado no caminho, ele pode ser atingido pelo impacto, sofrendo dano mínimo da técnica e sendo responsável por ser considerado uma estrutura, além disso é deslocado junto ao alvo original e recebe dano mínimo, caso não passe em mesmo teste. O inimigo ou aliado, é considerado atingido se estiver na linha de impacto, e também a rolagem de acerto do usuário utilizada para atingir o alvo original, supere a sua CA.","pagina":75},{"nome":"Rajada Contínua","categoria":"generico","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":{"por_rodada_mantida":"mesma quantidade de Ki exigida para a técnica"},"al":null,"acumula":null,"restricoes":["não pode realizar outras ações ou reações enquanto mantém a rajada"],"efeito":"Permite ao usuário prolongar os efeitos de uma técnica, mantendo o ataque ativo na mesma área e contra os mesmos inimigos na rodada seguinte. Para isso, o usuário deve continuar gastando a mesma quantidade de Ki exigida para a técnica e não pode realizar outras ações ou reações enquanto mantém a rajada. Se os alvos permanecerem dentro da área da técnica, eles continuam sofrendo dano sem necessidade de uma nova rolagem de acerto, pois a técnica segue ativa com o mesmo acerto original. Caso seja uma técnica de alvo único, se o alvo se movimentar para fora do alcance máximo, a rajada é interrompida.\n\n- • Ex.1: O usuário dispara uma poderosa Rajada Contínua de Ki, atingindo três inimigos dentro de sua área de efeito e causando dano médio. Ele decide manter o ataque na rodada seguinte, gastando novamente a mesma quantia de Ki, enquanto mantém o foco na técnica. Os inimigos que não saírem da área continuarão sofrendo dano automaticamente. No entanto, se um dos alvos conseguir se afastar antes do próximo turno do usuário, considera que ele escapou da rajada e não sofrendo mais dano contínuo. Se a técnica for de alvo único, deverá se afastar até que o alcance da técnica não o atinja mais, a anulando assim como a rolagem dela, necessitando ao usuário se aproximar e fazer nova rolagem.","pagina":76},{"nome":"Golpe Crítico","categoria":"generico","custo":"5","cp":{"tipo":"fixo","min":5,"max":5},"ki":null,"al":null,"acumula":true,"restricoes":[],"efeito":"Diminui em 1, a rolagem considerada como acerto crítico por essa técnica, ou seja, de 20 vai para 19 e assim acumuladamente por cada um deste rótulo investido na técnica.","pagina":76},{"nome":"Ataque Curvo","categoria":"generico","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Permite que a técnica siga uma trajetória curva, superando obstáculos como coberturas ou paredes, permitindo atingir alvos que se encontram atrás de uma barreira parcial. A técnica ignora a coberturas parciais do inimigo de qualquer tipo, mas a rolagem de acerto será feita com desvantagem devido à dificuldade de contornar o obstáculo.","pagina":76},{"nome":"Ataque Espectral","categoria":"generico","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Permite que o ataque atravesse objetos sólidos sem ser interrompido ou causar danos a eles, até atingir um alvo vivo, ignorando coberturas totais. O ataque não explode nem causa danos colaterais aos objetos ou estruturas no caminho, passando através deles até alcançar o alvo. Porém, o ataque só atinge alvos vivos, ou seja, personagens, inimigos ou criaturas.","pagina":76},{"nome":"Carga Crescente","categoria":"generico","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":null,"al":null,"acumula":null,"restricoes":["não podendo esse rótulo ser aplicado com o de Salvaguardas"],"efeito":"Permite que uma técnica se intensifica a cada utilização no mesmo alvo. A cada vez que o usuário executa a técnica contra um alvo específico, o dano final aumenta em uma quantidade fixa igual a 5, tornando-se progressivamente mais potente. Esse aumento pode ser acumulado até o momento em que o usuário errar a técnica, não podendo esse rótulo ser aplicado com o de Salvaguardas.","pagina":76},{"nome":"Efeito Negativo","categoria":"generico","custo":"Variável","cp":{"tipo":"variavel","min":null,"max":null},"ki":null,"al":null,"acumula":null,"restricoes":["Caso a técnica seja de dano ou efeito em área, todos os rótulos positivos dela são consumidos, antes de aplicar a quantidade de rótulos que a condição irá consumir"],"efeito":"Permite que o usuário incorpore um efeito negativo à sua técnica, impactando diretamente o alvo caso ele falhe em um teste de resistência. Se esse rótulo é adicionado a uma técnica que causa dano, o teste apenas vai ocorrer se o alvo receber dano, se for em uma técnica que não causa dano e o foco é aplicar o efeito, basta apenas o acerto. Caso a técnica seja de dano ou efeito em área, todos os rótulos positivos dela são consumidos, antes de aplicar a quantidade de rótulos que a condição irá consumir. A condição imposta pode variar dentre as disponíveis no sistema, sendo o valor de rótulos desse efeito igual ao valor designado ao efeito negativo que é exposto expressamente nele. Se a condição escolhida não tiver uma duração específica, ela permanece até o final do próximo turno do alvo afetado. Sempre que esta técnica for aplicada, o inimigo terá direito a um teste de resistência apropriado, que pode ser baseado em Destreza, Constituição, Sabedoria ou outra resistência pertinente, dependendo do efeito adicionado.","pagina":76},{"nome":"Aumentar Dificuldade","categoria":"generico","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":{"por_rotulo":8},"al":null,"acumula":true,"restricoes":[],"efeito":"Fortalece a técnica ao intensificar sua força, velocidade ou complexidade, tornando-a mais difícil de resistir. Ao aplicar esse efeito, a Classe de Dificuldade (CD) dos testes de resistência contra a técnica é aumentada, dificultando o seu sucesso ao resistir a Salvaguarda imposta pela técnica. Cada rótulo deste investido em uma técnica aumenta em +1 a CD dela, além de também aumentar o custo de Ki dela em +8.","pagina":77},{"nome":"Precisão","categoria":"generico","custo":"Variável","cp":{"tipo":"variavel","min":null,"max":null},"ki":null,"al":null,"acumula":true,"restricoes":[],"efeito":"Permite que o usuário controle sua técnica com precisão, protegendo aliados dentro da área de efeito. Ao ativar a técnica, o usuário pode selecionar um número de criaturas igual ao custo do rótulo investido na técnica, sendo na proporção de 1:3, ou seja, a cada 1 ponto de rótulo 3 aliados não são atingidos.","pagina":77},{"nome":"Técnica Reativa","categoria":"generico","custo":"?","cp":{"tipo":"consome_todos_positivos_base","min":null,"max":null},"ki":null,"al":null,"acumula":null,"restricoes":["não pode ser utilizada mais de uma vez durante seu turno de reação, a não ser que tenha o rótulo de \"Técnica Básica\""],"efeito":"Permite a técnica que o usuário tenha a capacidade de a utilizar fora do próprio turno, ativando-a apenas como uma reação a uma ação ou reação inimiga, e não a outra situação. Assim como uma técnica ofensiva comum, não pode ser utilizada mais de uma vez durante seu turno de reação, a não ser que tenha o rótulo de \"Técnica Básica\". Lembrando que, turnos de reações podem acontecer vários durante uma batalha, então, um novo turno de reação causado por um inimigo diferente, automaticamente permite a utilização novamente de uma técnica que tenha este rótulo.","pagina":77},{"nome":"Técnica Defensiva","categoria":"generico","custo":"1","cp":{"tipo":"fixo","min":1,"max":1},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Permite a capacidade de converter o dano que a técnica causaria em mitigação direta de dano recebido. Quando um inimigo ataca e acerta, o usuário pode rolar um teste de acerto com essa técnica, utilizando o valor de acerto do oponente como se fosse a Classe de Armadura (CA) a ser superada. Dependendo da rolagem atingido, a mitigação será proporcional ao dano que a técnica normalmente causaria, seguindo os estágios a seguir:\n\n- • Se o acerto for 6- negativo do Acerto Inimigo: Mitigação mínima (¼ do valor base).\n- • Se o acerto for 1~5 negativos do Acerto Inimigo: Mitigação média (½ do valor base).\n- • Se o acerto for igual ou superior Acerto Inimigo: Mitigação completa (valor total da técnica).","pagina":77},{"nome":"Técnica de Barreira","categoria":"generico","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":{"por_rotulo":3},"al":null,"acumula":true,"restricoes":["Caso tenha outra técnica com esse mesmo rótulo, ela não poderá ser utilizada no mesmo turno de ação ou reação"],"efeito":"Permite que a técnica ao ser utilizada aumente a CA do usuário temporariamente até o início de seu próximo turno. O aumento é equivalente a +1 a cada rótulo investido nessa técnica, além disso cada aumento resulta em uma adição no custo de Ki de +3. Caso tenha outra técnica com esse mesmo rótulo, ela não poderá ser utilizada no mesmo turno de ação ou reação.","pagina":78},{"nome":"Adicionar Salvaguarda","categoria":"generico","custo":"?","cp":{"tipo":"consome_todos_positivos_base","min":null,"max":null},"ki":null,"al":null,"acumula":null,"restricoes":["8 + Modificador do Atributo de Acerto + Escala de Poder Base"],"efeito":"Concede à técnica a propriedade de sempre atingir o alvo, substituindo a rolagem de acerto por um teste de Salvaguarda de atributo condizente com a técnica. O alvo deve realizar uma Salvaguarda apropriada contra a Classe de Dificuldade (CD) da técnica, e o dano será determinado conforme o resultado do teste, seguindo a escala invertida de estágios de dano:\n\n- • Se o alvo falhar por 6 ou mais, sofre Dano Máximo.\n- • Se o alvo falhar por 3 a 5, sofre Dano Médio.\n- • Se o alvo falhar por 1 a 2, sofre Dano Mínimo.\n\nCaso o alvo passe no teste de Salvaguarda, ele evita completamente os efeitos da técnica. As regras de escala de poder se aplicam da mesma forma. O Valor da Salvaguarda, depender do atributo de conjuração da técnica, seguindo a seguinte regra: 8 + Modificador do Atributo de Acerto + Escala de Poder Base, não entrando nessa regra, a Escala de Poder Bônus que é dada por transformações","pagina":78},{"nome":"Gatilho Passivo","categoria":"generico","custo":"?","cp":{"tipo":"consome_todos_positivos_base","min":null,"max":null},"ki":null,"al":null,"acumula":null,"restricoes":["ela jamais poderá ser conjurada como uma ação ou reação","apenas poderá ter uma nova ativação no início do seu próximo turno de ação"],"efeito":"A técnica é conjurada automaticamente sem necessidade de uma ação, quando o gatilho que é condicionado a ela é feito, no entanto ela jamais poderá ser conjurada como uma ação ou reação, mas, seguindo a regra de que ativada uma vez, apenas poderá ter uma nova ativação no início do seu próximo turno de ação. Os gatilhos podem variar interpretativamente, sendo desde sofrer um dano, a uma ação específica do próprio usuário ou de terceiros. Ela apenas será ativada, caso você tenha recursos necessários para isso de forma passiva.","pagina":78},{"nome":"Presságio","categoria":"generico","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Ao causar dano, o usuário escolhe uma das seguintes condutas do alvo até o fim do próximo turno de ação dele: usar uma ação ofensiva; usar uma reação; ou aumentar sua distância do usuário em mais de 1,5m. Se o alvo cumprir a conduta escolhida, o presságio se cumpre: ele sofre imediatamente o dano mínimo da técnica, sem nova rolagem, e o efeito se encerra. O alvo só pode sofrer esse efeito uma vez por aplicação de Presságio.","pagina":78},{"nome":"Lastro","categoria":"generico","custo":"5","cp":{"tipo":"fixo","min":5,"max":5},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Ao causar dano, o usuário pode deixar um lastro no alvo ou no ponto atingido até o fim do seu próximo turno de ação.\n\n- • Se a técnica era de alvo único, o lastro fica no alvo e se move com ele.\n- • Se era de área, o lastro fica no ponto de impacto.\n\nEnquanto o lastro persistir, a próxima técnica do usuário com alcance não em área pode ser conjurada como se: o ponto de origem fosse o lastro; e a medição de alcance partisse dele. Se o usuário não aproveitar até o prazo, o lastro se dissipa.","pagina":78},{"nome":"Isolante","categoria":"generico","custo":"4","cp":{"tipo":"fixo","min":4,"max":4},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Ao causar dano, o alvo fica \"Isolado até o fim de seu próximo turno de ação. Enquanto estiver neste estado, outros personagens não podem usar reações em defesa dele, nem reagir para: mitigar o dano que ele receberia, tomar dano em seu lugar, ou protegê-lo diretamente por técnica ou efeito reativo. O alvo ainda pode usar suas próprias reações normalmente, salvo outras regras.","pagina":78},{"nome":"Revés","categoria":"generico","custo":"4","cp":{"tipo":"fixo","min":4,"max":4},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Ao causar dano, o alvo fica em Revés até o início do próximo turno do usuário. A primeira técnica ofensiva que esse alvo usar contra o usuário nesse período sofre uma redução de eficácia: se causaria dano máximo, causa dano médio; se causaria dano médio, causa dano mínimo; se causaria dano mínimo é como se não houvesse acertado.","pagina":79},{"nome":"Amortecedora","categoria":"generico","custo":"4","cp":{"tipo":"fixo","min":4,"max":4},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Ao causar dano, o usuário cria uma camada de amortecimento contra aquele mesmo alvo até o início de seu próximo turno. A próxima vez que aquele alvo causar dano ao usuário nesse período, o dano final recebido é reduzido em valor fixo igual ao dano mínimo da técnica que gerou o amortecimento. Se o dano for reduzido a 0, ele é negado normalmente. Após reduzir um ataque, o efeito se encerra.","pagina":79},{"nome":"Brecha","categoria":"generico","custo":"2","cp":{"tipo":"fixo","min":2,"max":2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Ao causar dano, o alvo abre uma janela de mobilidade para os inimigos. Até o fim do próximo turno do usuário: aliados do usuário podem entrar, sair ou circular pelo alcance ameaçado do alvo sem provocar Ataque de Oportunidade dele.","pagina":79},{"nome":"Rastreante","categoria":"generico","custo":"3","cp":{"tipo":"fixo","min":3,"max":3},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Ao causar dano, o alvo fica rastreado até o fim do próximo turno do usuário. Enquanto estiver assim, em relação ao usuário: não pode se beneficiar de Furtividade; não pode esconder seu fluxo de mana, presença ou posição; e não pode ser tratado como alvo oculto por meios comuns de ocultação ou supressão.","pagina":79},{"nome":"Difusão","categoria":"generico","custo":"5","cp":{"tipo":"fixo","min":5,"max":5},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Se a técnica causar dano e aplicar qualquer efeito não ligado diretamente ao dano bruto, o usuário pode difundi-lo. Escolha uma segunda criatura válida a até 3,0m do alvo original. Essa segunda criatura não sofre dano, mas recebe um dos seguintes elementos da técnica, à escolha do usuário, se houver: um efeito de rótulo, uma condição negativa aplicada pela técnica, ou outro efeito secundário claramente separado do dano. A segunda criatura resolve normalmente qualquer teste de resistência exigida por esse efeito.","pagina":79},{"nome":"Exaustiva","categoria":"negativo","custo":"-4","cp":{"tipo":"fixo","min":-4,"max":-4},"ki":{"multiplicador":2},"al":null,"acumula":null,"restricoes":[],"efeito":"O usuário gasta o dobro de Ki para usar essa técnica.","pagina":79},{"nome":"Dreno de Ki","categoria":"negativo","custo":"Variável","cp":{"tipo":"variavel","min":null,"max":null},"ki":{"por_ponto_negativo":3},"al":null,"acumula":true,"restricoes":[],"efeito":"A técnica consome Ki além do custo base, reduzindo a eficiência energética. Aumenta o custo da técnica de Ki em +3 em troca de dar um rótulo negativo a técnica, para cada 3 de Ki a mais, adiciona mais um rótulo negativo.","pagina":79},{"nome":"Carregamento","categoria":"negativo","custo":"-1 a Variável","cp":{"tipo":"variavel_com_minimo","min":-1,"max":null},"ki":null,"al":null,"acumula":true,"restricoes":[],"efeito":"A técnica precisa de 1 rodada completa de concentração antes de ser disparada, contando o carregamento mesmo que receba danos. A cada rodada extra que você adicionar aumenta em -1 o rótulo negativo da técnica.","pagina":79},{"nome":"Técnica de Doação","categoria":"negativo","custo":"-4","cp":{"tipo":"fixo","min":-4,"max":-4},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Técnica que necessita do Ki de terceiros para ser conjurada, onde aliados devem doar Ki ao conjurador gastando em reação uma quantidade de Ki igual a exigida pela técnica, podendo doar o próprio Ki para conjuração dela. O usuário não pode usar o próprio Ki para conjuração.","pagina":79},{"nome":"Ki Instável","categoria":"negativo","custo":"-4","cp":{"tipo":"fixo","min":-4,"max":-4},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"O usuário deve rolar um Teste de Poder x Acerto da Técnica depois de usar a técnica; se falhar, gasta o Ki, mas a técnica não sai.","pagina":80},{"nome":"Concentração","categoria":"negativo","custo":"-2","cp":{"tipo":"fixo","min":-2,"max":-2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica necessita que você não tenha recebido nenhuma fonte de dano durante a última rodada e o turno.","pagina":80},{"nome":"Diminuir Precisão","categoria":"negativo","custo":"-1","cp":{"tipo":"fixo","min":-1,"max":-1},"ki":null,"al":null,"acumula":true,"restricoes":[],"efeito":"A técnica é instável e de difícil conjurador, o que faz você diminuir a precisão do seu próximo golpe, diminuindo a rolagem de acerto em -1 para cada rótulo deste colocado em sua técnica.","pagina":80},{"nome":"Posicionamento Preciso","categoria":"negativo","custo":"-1","cp":{"tipo":"fixo","min":-1,"max":-1},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"O usuário não pode se movimentar mais do que a metade da sua movimentação total durante a rodada, ou não poderá conjurar essa técnica.","pagina":80},{"nome":"Posicionamento Crítico","categoria":"negativo","custo":"-2","cp":{"tipo":"fixo","min":-2,"max":-2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"O usuário não pode se movimentar durante a rodada, ou não poderá conjurar essa técnica.","pagina":80},{"nome":"Recarga Precisa","categoria":"negativo","custo":"-2","cp":{"tipo":"fixo","min":-2,"max":-2},"ki":null,"al":null,"acumula":true,"restricoes":[],"efeito":"O usuário não pode utilizar a técnica novamente por uma rodada após o uso. Para cada rodada que o usuário não pode utilizar a técnica novamente, aumente o valor do rótulo em -2.","pagina":80},{"nome":"Descontrole","categoria":"negativo","custo":"-1","cp":{"tipo":"fixo","min":-1,"max":-1},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Uma vez usada ou canalizada, a técnica não pode ser interrompida.","pagina":80},{"nome":"Recuo Poderoso","categoria":"negativo","custo":"-3","cp":{"tipo":"fixo","min":-3,"max":-3},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Uma vez que conjure a técnica mesmo que acerte ou erre ela, você recebe um dano de recuo igual ao dano mínimo que a técnica pode causar.","pagina":80},{"nome":"Alcance Fixo","categoria":"negativo","custo":"-2","cp":{"tipo":"fixo","min":-2,"max":-2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica não pode ter seu alcance alterado de nenhuma forma sendo externa ou interna.","pagina":80},{"nome":"Área Específica","categoria":"negativo","custo":"-2","cp":{"tipo":"fixo","min":-2,"max":-2},"ki":null,"al":null,"acumula":null,"restricoes":["na opção de vácuo o custo do rótulo aumentar para -3"],"efeito":"A técnica apenas pode ser usada em: terra, ar, água ou vácuo. Devendo o usuário escolher uma das três opções, sendo que na opção de vácuo o custo do rótulo aumentar para -3.","pagina":80},{"nome":"Condicionada","categoria":"negativo","custo":"-1 a -2","cp":{"tipo":"faixa","min":-1,"max":-2},"ki":null,"al":null,"acumula":null,"restricoes":["Se a ação depende do seu personagem o custo é -1, se depender do inimigo o custo é -2"],"efeito":"A técnica apenas pode ser usada após uma ação ou evento específico, este deve ser determinado na criação. Essa ação pode ser sua ou de um inimigo, e no geral apenas pode ser interpretativa (não podendo ser algo genérico como simplesmente seu inimigo falar ou atacar). Caso o seu personagem, ou o inimigo não executem essa ação, a técnica não pode ser usada. Se a ação depende do seu personagem o custo é -1, se depender do inimigo o custo é -2.","pagina":80},{"nome":"Verbal","categoria":"negativo","custo":"-2","cp":{"tipo":"fixo","min":-2,"max":-2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica apenas pode ser usada caso você grite ou diga o nome dela em voz alta. Caso não consiga, a técnica ainda é conjurada, mas, a rolagem de acerto é feita com desvantagem.","pagina":80},{"nome":"Somática","categoria":"negativo","custo":"-2","cp":{"tipo":"fixo","min":-2,"max":-2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica apenas pode ser usada caso você faça algum gesto com suas mãos ou outra parte do corpo. Caso não consiga, a técnica ainda é conjurada, mas, a rolagem de acerto é feita com desvantagem.","pagina":81},{"nome":"Objeto","categoria":"negativo","custo":"-2","cp":{"tipo":"fixo","min":-2,"max":-2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica apenas pode ser usada caso você esteja portando em mãos um objeto específico que faz parte da sua conjuração. Caso não consiga, a técnica ainda é conjurada, mas, a rolagem de acerto é feita com desvantagem.","pagina":81},{"nome":"Técnica Dependente","categoria":"negativo","custo":"-1","cp":{"tipo":"fixo","min":-1,"max":-1},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica apenas pode ser usada caso você tenha utilizado outra técnica antes a qual deixou pré-determinado na criação, que era necessária para o seu uso. Caso não tenha feito, simplesmente não poderá usar a técnica.","pagina":81},{"nome":"Sobrecarga","categoria":"negativo","custo":"-2","cp":{"tipo":"fixo","min":-2,"max":-2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Após usar a técnica, você não poderá utilizar outra técnica do mesmo Rank até o início do seu próximo turno, incluindo as técnicas de reação.","pagina":81},{"nome":"Foco Total","categoria":"negativo","custo":"-4","cp":{"tipo":"fixo","min":-4,"max":-4},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Você pode usar essa técnica se ela for a única que você for utilizar até o início do seu próximo turno, incluindo as técnicas de reação.","pagina":81},{"nome":"Cansativa","categoria":"negativo","custo":"-3","cp":{"tipo":"fixo","min":-3,"max":-3},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"No início do seu próximo turno, você não é capaz de regenerar automaticamente o Ki gasto para conjurar essa técnica, apenas voltando a regenerar no turno seguinte a este.","pagina":81},{"nome":"Inofensiva","categoria":"negativo","custo":"-2","cp":{"tipo":"fixo","min":-2,"max":-2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica não pode ser utilizada para causar dano de nenhuma forma direta ou indiretamente.","pagina":81},{"nome":"Efeito Colateral","categoria":"negativo","custo":"-?","cp":{"tipo":"igual_ao_efeito_negativo","min":null,"max":null},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Após a conjuração da técnica, no final do seu turno, o usuário deve rolar uma rolagem de Constituição vs Acerto da própria técnica, ou vai receber o efeito negativo escolhido para fazer parte deste rótulo. O custo do efeito negativo é o que determina o rótulo negativo desta técnica.","pagina":81},{"nome":"Esforço Supremo","categoria":"negativo","custo":"-6","cp":{"tipo":"fixo","min":-6,"max":-6},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Após utilizar essa técnica, não poderá mais usar técnicas nesse turno e na rodada, e além disso, perderá o seu turno de ação seguinte, mas, poderá voltar a usar técnicas reativas nesse meio tempo.","pagina":81},{"nome":"Danos por Esforço","categoria":"negativo","custo":"-2","cp":{"tipo":"fixo","min":-2,"max":-2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Uma vez que conjure a técnica mesmo que acerte ou erre ela, caso você esteja com menos da metade da sua vida ou dos seus pontos de ki, você recebe um dano de recuo igual ao dano mínimo que a técnica pode causar.","pagina":81},{"nome":"Técnica de Fácil Rebote","categoria":"negativo","custo":"-4","cp":{"tipo":"fixo","min":-4,"max":-4},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Caso erre a técnica, o alvo deve rolar um teste de Inteligência vs Acerto da Técnica caso seja de energia ou Destreza vs Acerto da Técnica caso seja física, se ele superar, irá rebater de alguma forma a energia ou o dano de impacto da técnica, de volta para você, sendo a rolagem que utilizou para superar o acerto, o novo acerto da sua própria técnica que irá em sua direção. Você pode fazer o mesmo, até que ela finalmente acerte um alvo.","pagina":81},{"nome":"Postura Quebrada","categoria":"negativo","custo":"-4","cp":{"tipo":"fixo","min":-4,"max":-4},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Caso utilize essa técnica, não poderá usar técnicas de reação até o início do seu próximo turno.","pagina":81},{"nome":"Golpe Cego","categoria":"negativo","custo":"-2","cp":{"tipo":"fixo","min":-2,"max":-2},"ki":null,"al":null,"acumula":null,"restricoes":["Esse rótulo apenas pode ser utilizado em técnicas que tenham longo alcance"],"efeito":"O usuário deve rolar um Teste de Inteligência ou Destreza vs Acerto da Técnica depois de atacar; se falhar, a técnica atinge um alvo aleatório, respeitando a regra de alcance da técnica. Esse rótulo apenas pode ser utilizado em técnicas que tenham longo alcance.","pagina":82},{"nome":"Previsível","categoria":"negativo","custo":"-4","cp":{"tipo":"fixo","min":-4,"max":-4},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"Caso utilize essa técnica e erre ou o oponente consiga mitigar completamente o dano ou o evitar de alguma forma, o alvo ganha uma reação com custo de Ki gratuito automática, que apenas pode ser utilizada contra você.","pagina":82},{"nome":"Ostensiva","categoria":"negativo","custo":"-1","cp":{"tipo":"fixo","min":-1,"max":-1},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica exige uma preparação perceptível, impossível de esconder por completo. Ao declarar seu uso, o alvo principal percebe claramente a intenção do usuário antes da resolução. Contra esse uso da técnica, o alvo recebe:\n\n- • +1 na CA, se a técnica for resolvida por Acerto;\n- • ou +1 na primeira Resistência exigida por ela, se for o caso.","pagina":82},{"nome":"Luminescente","categoria":"negativo","custo":"-1","cp":{"tipo":"fixo","min":-1,"max":-1},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica deixa um brilho, rastro ou assinatura evidente. Após usá-la, até o início do próximo turno de ação do usuário: ele não pode se beneficiar de Furtividade, ocultação ou supressão de presença; e testes feitos para localizá-lo, percebê-lo ou rastrear seu fluxo são feitos com vantagem.","pagina":82},{"nome":"Sangria","categoria":"negativo","custo":"-2","cp":{"tipo":"fixo","min":-2,"max":-2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica exige sacrifício vital para estabilizar sua execução. Ao usá-la, o usuário sofre dano não mitigável igual à sua EP. Esse dano ocorre independentemente de acerto ou erro; não pode ser evitado por mitigação comum; e não conta como dano causado por inimigo.","pagina":82},{"nome":"Inicial","categoria":"negativo","custo":"-1","cp":{"tipo":"fixo","min":-1,"max":-1},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica só pode ser usada no início do ritmo ofensivo do usuário. Ela só pode ser a primeira ação que gaste PK no turno de ação do personagem. Se o usuário já tiver gasto PK antes dela no turno, ou já tiver usado outra técnica, reação convertida em ação, talento ou gasto relevante de esforço, ela não pode ser conjurada naquele turno.","pagina":82},{"nome":"Terminal","categoria":"negativo","custo":"-2","cp":{"tipo":"fixo","min":-2,"max":-2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica encerra o ímpeto ofensivo do usuário naquele turno. Depois de resolver essa técnica durante o turno de ação, o usuário: não pode mais gastar PK no restante do próprio turno de ação. Ele ainda pode: falar, posicionar-se se ainda não o fez antes da conjuração, e usar reações normalmente depois, salvo outras restrições.","pagina":82},{"nome":"Monotemática","categoria":"negativo","custo":"-2","cp":{"tipo":"fixo","min":-2,"max":-2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica prende o fluxo do usuário a um único padrão ofensivo. Após usá-la, até o início do próximo turno de ação, o usuário não pode utilizar técnicas com tipo de dano diferente do tipo de dano dessa técnica. Se a técnica possuir múltiplos tipos de dano, define-se na criação qual deles dita a restrição principal, se você já usou um tipo de dano diferente do determinado nessa técnica antes de sua utilização, ela já não poderá ser utilizada.","pagina":82},{"nome":"Alcance Minguante","categoria":"negativo","custo":"-2","cp":{"tipo":"fixo","min":-2,"max":-2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica perde amplitude conforme é repetida no mesmo confronto. Cada vez que a técnica for usada novamente na mesma batalha, seu alcance máximo é reduzido em 1,5m, cumulativamente.","pagina":82},{"nome":"Solo Firme","categoria":"negativo","custo":"-1","cp":{"tipo":"fixo","min":-1,"max":-1},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica depende de apoio corporal pleno. Ela não pode ser usada enquanto o usuário estiver: voando, caindo, escalando, nadando, montado em criatura em deslocamento, ou sem apoio estável no chão/superfície.","pagina":83},{"nome":"Espaço Aberto","categoria":"negativo","custo":"-1","cp":{"tipo":"fixo","min":-1,"max":-1},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica exige espaço físico livre para se formar. Ela não pode ser usada em ambientes onde não haja pelo menos 3,0m de espaço livre acima do usuário e do ponto de origem da técnica, como: túneis muito baixos, passagens comprimidas, dutos, ou estruturas excessivamente fechadas.","pagina":83},{"nome":"Linha Pura","categoria":"negativo","custo":"-1","cp":{"tipo":"fixo","min":-1,"max":-1},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica exige trajetória perfeitamente limpa. Ela não pode ser usada se houver qualquer tipo de cobertura, mesmo parcial, entre: o usuário e o alvo, ou o usuário e o ponto de origem/impacto escolhido. Também não pode ser usada se outro corpo ocupar de forma relevante a linha de execução.","pagina":83},{"nome":"Braço Morto","categoria":"negativo","custo":"-2","cp":{"tipo":"fixo","min":-2,"max":-2},"ki":null,"al":null,"acumula":null,"restricoes":[],"efeito":"A técnica entorpece o membro, arma ou foco que a executou. Após resolver a técnica, a arma, mão ou membro diverso usado para executá-la: não pode ser usado novamente para outra técnica ou reação ofensiva até o início do próximo turno de ação do usuário. O item ainda pode ser segurado, mas não empregado ofensivamente.","pagina":83}],"ranks":[{"rank":"E","nome":"Técnica Básica","pdl":10000,"dmin":12,"dmax":24,"kmin":1,"kmax":4,"pb":1,"st":2,"kesp":2},{"rank":"D","nome":"Técnica Simples","pdl":20000,"dmin":26,"dmax":46,"kmin":4,"kmax":9,"pb":2,"st":4,"kesp":4},{"rank":"C","nome":"Técnica Intermediária","pdl":30000,"dmin":34,"dmax":58,"kmin":6,"kmax":12,"pb":3,"st":6,"kesp":6},{"rank":"B","nome":"Técnica Avançada","pdl":40000,"dmin":44,"dmax":84,"kmin":8,"kmax":18,"pb":4,"st":8,"kesp":8},{"rank":"A","nome":"Técnica Épica","pdl":80000,"dmin":68,"dmax":124,"kmin":12,"kmax":26,"pb":5,"st":10,"kesp":10},{"rank":"Z","nome":"Técnica Lendária","pdl":120000,"dmin":130,"dmax":234,"kmin":18,"kmax":44,"pb":6,"st":14,"kesp":12}],"talentos":[{"id":"tl01","nome":"ESPÍRITO DE COMBATE","tipo":"Passiva","requisitos":null,"efeito":"Sempre que o usuário acerta o primeiro ataque corpo a corpo apenas físico em seu turno de ação, ele recupera uma pequena quantidade de Ki, igual a metade do que foi gasto.","pagina":48},{"id":"tl02","nome":"RESISTÊNCIA INABALÁVEL","tipo":"Passiva/Ativa","requisitos":null,"efeito":"Ao ativar essa habilidade, o usuário reduz o dano recebido de ataques físicos até o início do seu próximo turno. A redução é de 3 pontos de dano para cada 1 ponto de Ki gasto, com um gasto mínimo de 1 ponto de Ki.","pagina":49},{"id":"tl03","nome":"CONTRA-ATAQUE INSTANTÂNEO","tipo":"Passiva","requisitos":null,"efeito":"Se evitar um golpe graças a sua CA de forma natural, pode aplicar sem custo de Ki um golpe com rótulo de “Ataque Básico” se houver, de Rank D.","pagina":49},{"id":"tl04","nome":"COMBO BRUTAL","tipo":"Passiva","requisitos":null,"efeito":"Se o primeiro ataque dado no turno de ação acertar de forma natural, ou seja, sem utilizar de ativas ou qualquer tipo de vantagem, o usuário pode continuar um combo, onde pode desferir o mesmo golpe de forma repetida, sem a penalidade natural de não poder repetir a mesma técnica no turno de ação, e enquanto você a acertar, pode continuar a utilizando até errar ou encerrar o combo.","pagina":49},{"id":"tl05","nome":"FORÇA SOBRE-HUMANA","tipo":"Passiva","requisitos":null,"efeito":"Seus ataques corpo a corpo têm um bônus extra de dano baseado na sua Força. Dessa forma, sempre que aplicar dano com ataques físicos corpo a corpo, adicione seu modificador de força ao dano final de forma extra.","pagina":49},{"id":"tl06","nome":"AVANÇO DE OPORTUNIDADE","tipo":"Passiva","requisitos":null,"efeito":"Não causa ataques de oportunidade, caso esteja se movendo unicamente em direção ao inimigo para o aplicar um golpe no final. Caso não aplique o golpe no final, os ataques de oportunidade serão considerados.","pagina":49},{"id":"tl07","nome":"INSTINTO DE LUTA","tipo":"Passiva","requisitos":null,"efeito":"Quando está com menos de 50% de vida, seus ataques físicos se tornam mais rápidos e fortes, recebendo vantagem na primeira ação do seu turno de ação. Caso chegue a 10% da vida, a vantagem é para todas as ações do turno de ação.","pagina":49},{"id":"tl08","nome":"MURALHA HUMANA","tipo":"Passiva","requisitos":null,"efeito":"Se um aliado próximo (até 3,0m de você) for alvo de um ataque, você pode interceptá-lo e sofrer o dano no lugar dele como uma reação. Caso seja dano em área, você irá receber o dano dele e o dano que você receberia também.","pagina":49},{"id":"tl09","nome":"ADRENALINA SELVAGEM","tipo":"Passiva","requisitos":null,"efeito":"Sempre que recebe dano crítico, o usuário ganha um aumento temporário de Ki na próxima rodada, equivalente a metade da rolagem de acerto que causou o dano crítico. Após encerrar o próximo turno do guerreiro, ele perde o Ki Extra.","pagina":49},{"id":"tl10","nome":"MOVIMENTO MARCIAL EXTRA","tipo":"Passiva","requisitos":null,"efeito":"Recebe um movimento marcial extra. Essa passiva pode ser escolhida várias vezes.","pagina":49},{"id":"tl11","nome":"DESPERTAR DO LOBO","tipo":"Passiva","requisitos":null,"efeito":"Quando luta contra múltiplos inimigos, ganha um aumento em sua velocidade e reflexos, permitindo que reaja melhor contra ataques simultâneos. Caso esteja em desvantagem numérica, suas rolagens em reação são feitas com vantagem.","pagina":49},{"id":"tl12","nome":"TÉCNICA DA MEMÓRIA CORPORAL","tipo":"Passiva","requisitos":null,"efeito":"Quando um inimigo repete o mesmo ataque contra você consecutivamente, seu corpo se adapta, concedendo um bônus de +1 na CA contra essa técnica específica a cada repetição seguida. Caso o oponente interrompa a sequência com outro ataque e só então volte a usá-la, o bônus permanece. No entanto, se ele deixar de utilizá-la por uma rodada completa, o efeito é perdido.","pagina":50},{"id":"tl13","nome":"RUPTURA MUSCULAR","tipo":"Passiva","requisitos":null,"efeito":"Após um combo bem-sucedido de três ou mais ataques físicos contra o mesmo alvo em uma única rodada, caso todos acertem, o oponente deve realizar um Teste de Constituição contra a maior rolagem de Acerto do Usuário entre os golpes desferidos. Se falhar, ele sofre Fadiga, perdendo uma quantidade de Ki igual à metade do maior Ki gasto pelo usuário em sua rodada de ataque.","pagina":50},{"id":"tl14","nome":"CORAÇÃO INDOMÁVEL","tipo":"Passiva","requisitos":null,"efeito":"Quando o usuário chega a 1 de vida pela primeira vez em um combate, ele pode continuar atacando até o final de sua próxima rodada. Todo dano recebido é ignorado, a não ser que o dano passe uma quantidade igual a vida total do usuário. Após o fim da rodada, o guerreiro cai inconsciente, e mesmo se levantado com técnica de cura, inicia a próxima rodada com metade dos pontos de Ki consumidos. Essa passiva não ativa mais de uma vez por batalha.","pagina":50},{"id":"tl15","nome":"GOLPE RESQUÍCIO","tipo":"Passiva","requisitos":null,"efeito":"Quando o usuário sofre um golpe crítico, seu corpo “memoriza” o impacto e seu próximo ataque contra o mesmo alvo tem um bônus de dano equivalente ao dano mínimo da técnica que causou o crítico causaria.","pagina":50},{"id":"tl16","nome":"LUTADOR DO ÚLTIMO ROUND","tipo":"Passiva","requisitos":null,"efeito":"Se for o último membro do grupo em pé, ganha uma resistência absurda à dor, ficando imune a efeitos negativos e negando a todos que estão em você enquanto você for o último do seu grupo de pé. Caso alguém se levante, e volte a lutar com você a passiva é desativada e não pode voltar a ser ativada pelo resto da sessão.","pagina":50},{"id":"tl17","nome":"IMPACTO DEVASTADOR","tipo":"Passiva/Ativa","requisitos":null,"efeito":"Ao realizar um ataque de dano físico corpo a corpo com o alcance de toque e acertar, o usuário pode uma vez por rodada de ataque utilizar o dobro de Ki que aquele ataque necessita, para fazer uma onda de choque de 9,0m em cone atrás do alvo se espalhar, aplicando a rolagem de acerto e dano a todos que estiverem na área.","pagina":50},{"id":"tl18","nome":"PONTO DE RUPTURA","tipo":"Passiva","requisitos":null,"efeito":"Após apanhar o suficiente, o usuário aprende a \"ler\" o estilo do inimigo. Após receber dano crítico 2 vezes do mesmo alvo na mesma batalha, fica imune a danos críticos do alvo, negando-os completamente e os transformando em danos de estágio mínimo.","pagina":50},{"id":"tl19","nome":"LENDA VIVA","tipo":"Passiva","requisitos":null,"efeito":"Se o usuário sobreviver a um ataque que normalmente o derrubaria (vida abaixo de 10%), ele entra em um estado especial onde seu próximo golpe é considerado um acerto crítico se for rolado de forma natural entre 16-20.","pagina":50},{"id":"tl20","nome":"ECO DE COMBATE","tipo":"Passiva","requisitos":null,"efeito":"Quando o usuário finaliza um inimigo com um golpe corpo a corpo, ele ganha um efeito residual de aceleração, permitindo que seu próximo ataque seja instantâneo e sem custo de Ki.","pagina":50},{"id":"tl21","nome":"ATAQUE GENÉRICO PODEROSO","tipo":"Ativa","requisitos":null,"efeito":"O usuário pode disparar um ataque básico de Ki, sem nome ou efeitos especiais, focado apenas na precisão determinada por Inteligência. O ataque tem alcance inicial de 6 metros, aumentando em +1,5 metro por cada 1 ponto de Ki gasto. O custo base de Ki para ativar essa técnica é 1 ponto. Essa técnica não possui dano base variável, dependendo exclusivamente do Ki gasto para sua execução. Ou seja, ao acertar o alvo, o dano causado será igual à quantidade de Ki utilizada no ataque, na proporção de 1:2, ou seja, 1 Ponto de Ki equivale a 2 Pontos de Dano.","pagina":51},{"id":"tl22","nome":"MAGO DE KI","tipo":"Ativa/Passiva","requisitos":null,"efeito":"O Mago de Ki não é apenas um guerreiro que dispara projéteis de energia – ele reescreve as regras da realidade usando sua maestria sobre o Ki. Diferente de um usuário comum de Ki, que foca em destruição e controle de campo, o Mago de Ki manipula a própria essência do Ki de formas inimagináveis, criando efeitos únicos e interagindo com a energia de maneiras impossíveis para outros guerreiros, além de dominar os aspectos elementais do Ki. Sempre que o Mago de Ki usa uma técnica de energia, ele pode alterá-la no meio da ação uma vez por rodada, com custo adicional de 06 de Ki. Ele pode escolher uma das seguintes alterações antes ou depois de lançar o ataque:\nCurva Perfeita – A técnica pode mudar de direção no ar, podendo perseguir o inimigo ou contornar obstáculos, permitindo que role novamente a jogada de acerto.\nKi Vibracional – A técnica atravessa armaduras e barreiras energéticas, ignorando aumentos de CA dados por técnicas.\nKi Reaproveitado – Reabsorve um ataque próprio antes de ele atingir o inimigo, recuperando metade do Ki gasto, ao ver a reação dele.\nKi Elemental – Adiciona a técnica o dano de um dos tipos elementais existentes (Fogo, Elétrico e Gélido), mesmo que ela não tenha esse rótulo integrado a ela.\nKi de Retrocesso – Se o ataque errar, ele pode voltar para o usuário e ser lançado novamente no próximo turno sem custo extra, no entanto seu turno de ação se encerra no momento em que declara que irá usar isto.","pagina":51},{"id":"tl23","nome":"CONTROLE DE KI","tipo":"Ativa","requisitos":null,"efeito":"O usuário dessa característica é capaz de aumentar o dano dos seus golpes que tem por base o Ki, não envolvendo os híbridos ou físicos. Antes de utilizar sua técnica, e fazer a rolagem o usuário pode declarar que vai gastar uma quantidade extra de Ki para aumentar o dano final do golpe caso ele acerte, na proporção de 1:1.","pagina":51},{"id":"tl24","nome":"DEFESA CONTÍNUA DE KI","tipo":"Ativa/Passiva","requisitos":null,"efeito":"Ao utilizar uma reação defensiva de mitigação através do Ki, o usuário pode gastar uma quantidade adicional de Ki igual ao custo original da reação para manter a mitigação de dano de forma passiva até o início do seu próximo turno ou até ativar uma nova reação, cancelando a anterior. Enquanto estiver nesse estado, o usuário não poderá usar outras reações ou ações caso seja usada em turno de ação.","pagina":51},{"id":"tl25","nome":"ELO DE KI","tipo":"Ativa","requisitos":null,"efeito":"O usuário pode conectar sua energia a um aliado ou inimigo, permitindo transferir Ki em uma proporção de 1:1.\nAlcance de Toque: A transferência ocorre sem custo adicional de Ki.\nAlcance à Distância: Se o alvo estiver a longa distância, o usuário gasta 1 ponto de Ki para cada 1,5 metro entre ele e o alvo. A transferência só pode ocorrer se não houver barreiras ou interferências que impeçam o fluxo do Ki entre os dois.","pagina":51},{"id":"tl26","nome":"PONTO ZERO","tipo":"Passiva","requisitos":null,"efeito":"O usuário pode reduzir o custo de Ki da primeira técnica conjurada na rodada de ataque pela metade se não tiver se movido sendo voluntária ou involuntariamente durante sua última rodada, e a atual representando sua concentração. Caso se mova a passiva não é ativada.","pagina":52},{"id":"tl27","nome":"EXPLOSÃO RADIAL","tipo":"Passiva","requisitos":null,"efeito":"Ao atingir um inimigo com uma técnica de Ki e ela não for em área e sim de alvo único, a energia residual reverbera ao redor, causando o dano mínimo que a técnica daria a todos os inimigos em um raio de 3,0 metros, sem a necessidade de rolagem de acerto. No entanto, o alvo pode negar esse dano se gastar uma quantidade de Ki equivalente à metade do que você gastou utilizando a técnica, ou pode reagir normalmente.","pagina":52},{"id":"tl28","nome":"VÓRTICE DE KI","tipo":"Ativa","requisitos":null,"efeito":"O usuário pode girar sua energia em um redemoinho invisível ao seu redor, criando uma barreira energética natural. Isso reduz em um estágio de dano de uma técnica de Ki até no máximo o mínimo, caso o usuário gaste uma quantidade de Ki equivalente ao que foi utilizado na técnica para o causar dano.","pagina":52},{"id":"tl29","nome":"MANIFESTAÇÃO SUPREMA","tipo":"Ativa/Passiva","requisitos":null,"efeito":"O usuário pode transcender os limites normais da energia. Uma vez por combate, ao ativar uma técnica de Rank A ou Z, ele pode ignorar completamente o custo de Ki, liberando-a em sua forma máxima, desde que também seja a única que irá utilizar nessa rodada de ataque. No entanto, após esse uso, todas as suas técnicas custam o dobro de Ki pelos próximos três turnos.","pagina":52},{"id":"tl30","nome":"FORJA ESPIRITUAL","tipo":"Passiva","requisitos":null,"efeito":"O usuário pode solidificar sua energia, moldando armas ou objetos temporários de pura energia. Para isso, ele deve canalizar o Dano Mínimo de um Rank, gastando o Custo Máximo de Ki desse Rank para a conjurar. Uma vez criada, a arma de energia pode ser utilizada por três rodadas sem necessidade de gastar Ki adicional. No entanto, o usuário só pode desferir um ataque por rodada com essa arma. O ataque pode ser realizado com uma rolagem baseada em Inteligência ou Força, no caso de combate corpo a corpo. Ranks A e Z não podem ser utilizados para essa técnica.","pagina":52},{"id":"tl31","nome":"KI ESPIRAL","tipo":"Passiva","requisitos":null,"efeito":"O usuário pode transformar sua energia em movimento contínuo, criando uma força giratória ao redor de seus ataques. Ao gastar o dobro de Ki necessário para conjurar a técnica, você pode adicionar temporariamente o tipo de dano perfurante a ela, podendo fazer isso apenas uma vez por rodada.","pagina":52},{"id":"tl32","nome":"MANTRA DO KI INFINITO","tipo":"Passiva","requisitos":null,"efeito":"O usuário pode entrar em um estado de meditação acelerada. Se ele ficar um turno inteiro sem atacar e receber dano se concentrando e recitando seu mantra, no próximo turno de ação suas técnicas custam metade do Ki.","pagina":52},{"id":"tl33","nome":"EXPANSÃO ZEN","tipo":"Passiva","requisitos":null,"efeito":"O usuário pode expandir sua consciência e sentir todas as fontes de energia ao seu redor, ignorando furtividade, ilusões e camuflagem. Sempre que quiser, ao custo de nenhum Ki, pode solicitar uma rolagem de Inteligência vs Possível Rolagem de Furtividade se houver alguém ao redor, ou Rolagem específica definida pelo narrador, a depender se existirem ilusões ou camuflagem na cena.","pagina":53},{"id":"tl34","nome":"REFLEXO ESPIRITUAL","tipo":"Passiva","requisitos":null,"efeito":"Ao atingir um estado de sintonia total com sua energia, o usuário pode, uma vez por combate, reagir automaticamente a um ataque sem precisar gastar Ki, desviando ou bloqueando um golpe com reflexos sobre-humanos.","pagina":53},{"id":"tl35","nome":"EXPURGO ESPIRITUAL","tipo":"Passiva","requisitos":null,"efeito":"Quando o usuário sofre uma condição negativa ele pode gastar uma quantidade de Ki para expulsar a anomalia de seu corpo. Tendo que gastar uma quantidade de Ki igual ao da técnica que o causou o efeito negativo, desde que essa condição não impeça suas ações.","pagina":53},{"id":"tl36","nome":"MANTO RADIANTE","tipo":"Passiva","requisitos":null,"efeito":"Ao atingir 20% ou menos de vida, o corpo do usuário entra em um estado de superalimentação, dobrando a regeneração natural de Ki e reduzindo pela metade o custo das técnicas por dois turnos.","pagina":53},{"id":"tl37","nome":"REFORÇO DE KI","tipo":"Passiva","requisitos":null,"efeito":"Ao cair de uma grande altura ou ser lançado longe, o usuário concentra energia ao redor do corpo para evitar ser deslocado, gastando assim metade do Ki necessário da técnica que o lançou.","pagina":53},{"id":"tl38","nome":"ONDA DE RETORNO","tipo":"Passiva","requisitos":null,"efeito":"Se o usuário mitigar ou não for acertado por um ataque de energia, ele absorve parte da energia residual e converte em Ki próprio, convertendo metade do Ki usado para uso próprio. Isso faz com que lutar contra ele com ataques energéticos seja sempre um risco, pois ele pode usar essa força contra o oponente. No entanto, ele só pode usar essa característica uma vez por rodada.","pagina":53},{"id":"tl39","nome":"CORPO LEVE COMO KI","tipo":"Passiva","requisitos":null,"efeito":"A maestria do usuário permite que ele se torne mais ágil conforme usa seu próprio Ki. Permite como reação, uma vez por rodada adicione o modificador de Inteligência a sua CA para tentar evitar um golpe ou diminuir seus danos. Fazer isso gasta Ki equivalente ao dobro do modificador utilizado.","pagina":53},{"id":"tl40","nome":"MARCA DE ASSINATURA","tipo":"Ativa/Passiva","requisitos":null,"efeito":"Você aprende o “cheiro energético” do alvo e passa a persegui-lo pelo fluxo de Ki, não pelos olhos. Como ação, escolha um alvo visível e faça um Teste de Sentido de Ki vs Controle de Ki do Alvo. Se vencer, ele fica “Marcado” até o fim da cena ou combate. Contra um alvo Marcado: você pode atacá-lo mesmo sem visão perfeita, desde que ainda haja trajetória plausível; ilusões simples, pós-imagens, fumaça, poeira e ocultação visual não anulam seu disparo; se o alvo tentar esconder o Ki ou fugir com deslocamento extremo, você sabe sua direção geral.","pagina":53},{"id":"tl41","nome":"CÂMERA DE COMPRESSÃO","tipo":"Ativa/Passiva","requisitos":null,"efeito":"Você consegue reter o excedente do próprio fluxo energético e convertê-lo em disparos “preparados”. Ao encerrar seu turno com pelo menos 4 Ki não gastos, você pode converter 2 Ki restantes em 1 Carga Comprimida. Máximo de 3 Cargas Comprimidas armazenadas. Quando usar uma técnica ofensiva de Ki à distância, pode gastar 1 Carga para escolher 1 dos efeitos:\nDisparo Silencioso: a técnica não pode ser percebida por Sentido de Ki antes da resolução, dessa forma caso não esteja no campo de visão do alvo ela é considerada um ataque furtivo;\nDisparo Fino: ela ignora a primeira interferência leve de cobertura, obstáculo parcial ou proteção improvisada;\nDisparo Estável: tomar dano não interrompe sua preparação imediata para essa técnica, ou de qualquer requisito que necessite do não recebimento de dano;","pagina":53},{"id":"tl42","nome":"PULSO DE INTERCEPTAÇÃO","tipo":"Ativa","requisitos":null,"efeito":"Você aprendeu a “cortar” disparos alheios no ar com um pulso de emissão contrário. Quando um aliado visível for alvo de uma técnica de Ki à distância, você pode reagir, desde que tenha linha plausível para o disparo inimigo. Faça um Teste de Inteligência vs Acerto do Usuário. Se vencer, escolha 1:\nreduzir o dano sofrido em 1 estágio;\nanular um efeito secundário da técnica, ou seja, um rótulo;\ndeslocar a trajetória o suficiente para fazer o ataque atingir o chão, uma parede ou um ponto vazio próximo (apenas disponível se superar a rolagem de acerto do alvo em uma quantidade maior do que a EP dele).","pagina":54},{"id":"tl43","nome":"LEITURA BALÍSTICA DE KI","tipo":"Passiva","requisitos":null,"efeito":"Depois de ver um padrão energético uma vez, você passa a enxergar a intenção do disparo antes dele nascer. Sempre que um inimigo usar uma mesma técnica de Ki pela segunda vez na cena, você pode “registrá-la”. A partir daí, contra aquela técnica específica, você passa a poder escolher 1 das opções abaixo sempre que ela for usada contra você:\nreceber 1 estágio a menos de dano se ela acertar;\nreceber vantagem para resistir à condição que ela tentar aplicar;\nsaber, antes da rolagem, se ela foi alterada por algum efeito como curva, carga, fragmentação, ricochete, reação em cadeia ou atraso.","pagina":54},{"id":"tl44","nome":"NÚCLEO DE RETENÇÃO","tipo":"Passiva","requisitos":null,"efeito":"Seu corpo aprendeu a segurar Ki instável sem colapsar, permitindo emissões violentas sem perder todo o controle. Quando usar uma técnica de Ki que: aumente custo, use carga, exija esforço extra, ou tenha drawback energético, você pode ativar este talento para escolher 1:\nadiar o custo colateral para o fim do turno;\nconverter parte do desgaste em bloqueio pós-combate em vez de penalidade imediata;\nimpedir que a técnica deixe você completamente zerado naquele exato momento, ficando com 1 Ki funcional até o fim da ação.","pagina":54},{"id":"tl45","nome":"LEITURA DE AURA DE COMBATE","tipo":"Passiva","requisitos":null,"efeito":"Você aprendeu a “ler” um lutador antes mesmo de trocar golpes de verdade. Ao observar alguém por alguns instantes, você pode pedir ao narrador uma leitura verdadeira sobre o alvo ao utilizar um Teste de Sentido de Ki, e a depender do seu resultado a critério do narrador ele pode te informar como: se ele está escondendo poder; se está emocionalmente instável; se está ferido, exausto ou segurando algo; se sua energia parece maligna, artificial, mutante ou treinada de forma incomum.","pagina":54},{"id":"tl46","nome":"KI INEXPRESSIVO","tipo":"Passiva","requisitos":"Ter a perícia “Controle de Ki” treinada (texto do talento).","efeito":"Seu fluxo energético é controlado a tal ponto que outros têm dificuldade em saber o que você realmente pretende fazer, apenas podendo ter esse talento se tiver a perícia “Controle de Ki” treinada. Você pode:\nesconder seu verdadeiro poder de Scouters e percepção comum;\nfingir exaustão, fraqueza ou falta de domínio;\nparecer civil, inofensivo ou “sem Ki” por breves períodos;\nmascarar emoções e intenção hostil através do próprio fluxo energético.","pagina":55},{"id":"tl47","nome":"GUIA DOS MUNDOS HOSTIS","tipo":"Passiva","requisitos":null,"efeito":"Você sabe sobreviver em desertos, florestas, montanhas, mundos selvagens, ruínas, luas e planetas desconhecidos. Você pode: evitar que o grupo se perca; encontrar rota segura, abrigo ou água; reconhecer território perigoso; perceber quando um ambiente “parece morto demais” ou repleto de predadores; rastrear alguém não só por pegadas, mas por resíduos energéticos e alteração do ambiente. Considerando assim, que você sempre tem sucesso em Testes de Sobrevivência.","pagina":55},{"id":"tl48","nome":"VOZ DO MESTRE","tipo":"Passiva","requisitos":null,"efeito":"Sua fala tem peso. Não porque é bonita, mas porque carrega presença, convicção e energia real. Você pode usar sua palavra para: acalmar multidões, evitar pânico, impedir luta desnecessária, impor respeito em arenas, dojos e facções, ou transformar uma cena social tensa num “momento de escuta”. Utilizando assim sua Intimidação como teste principal resistido aos alvos afetados que devem realizar Teste de Sabedoria, a depender do seu sucesso e do quanto ele ultrapassou a resistência dos alvos, o narrador determina o quão profundo vai sua influência.","pagina":55},{"id":"tl49","nome":"NOME QUE CORRE PELAS ESTRELAS","tipo":"Passiva","requisitos":null,"efeito":"Seu nome, apelido, estilo, feitos ou escola já são conhecidos em algum circuito marcial, facção, planeta ou submundo. Quando entrar em: arena, dojo, colônia, mundo guerreiro, mercado de tecnologia, ou ambiente de lutadores. Você pode acionar sua reputação para obter 1 vantagem narrativa plausível, como:\naudiência com alguém importante;\nreconhecimento imediato;\nrival interessado;\ndesconto, respeito ou proteção temporária;\ninformação de bastidor;\nconvite para torneio, treino ou missão.","pagina":55}],"movimentos":[{"id":"mm01","nome":"Punho Quebrador de Ondas","simbolo":"*","comb":"tecnicas_ofensivas_fisicas","custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":["Sabedoria vs Acerto do Usuário"],"efeito":"O lutador canaliza sua energia no punho e desfere um golpe giratório capaz de romper projéteis ou atingir um inimigo com impacto devastador. O lutador desfere um golpe contra um alvo adjacente. Se acertar, e o oponente estiver carregando uma técnica de Ki (mas ainda não a lançou) ou mantendo algum golpe de rajada, ele deve fazer um Teste de Sabedoria vs Acerto do Usuário. Se falhar, a técnica é dissipada sem efeito, podendo ser usando tanto como ação quanto como reação.","pagina":38},{"id":"mm02","nome":"Tapa da Humilhação","simbolo":null,"comb":null,"custo_ki":3,"custo_ki_texto":"[KI: 03]","requisitos":null,"testes":["Sabedoria vs Acerto do Usuário"],"efeito":"Um tapa estrondoso com a palma da mão, seguido de um segundo tapa com o dorso, projetado para humilhar o oponente em combate. Este golpe não visa causar dano, mas sim desestabilizar e envergonhar o inimigo. Se atingir o oponente, ele deve fazer um teste de Sabedoria vs Acerto do Usuário. Se falhar, o alvo fica constrangido (ele recebe -2 em todas as jogadas de ataque e reação até o fim do próximo turno).","pagina":38},{"id":"mm03","nome":"Punho Paralisante","simbolo":"*","comb":"tecnicas_ofensivas_fisicas","custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":["Constituição vs Acerto do Usuário"],"efeito":"É um golpe preciso que usa o polegar estendido para atingir pontos estratégicos do corpo do oponente, pressionando terminações nervosas e articulações. Quando acertado, o alvo sente uma dor aguda que afeta sua mobilidade. Ele tem sua velocidade de deslocamento reduzida pela metade até o final do próximo turno, caso não passe em um Teste de Constituição vs Acerto do Usuário.","pagina":38},{"id":"mm04","nome":"Martelo do Trovão","simbolo":"*","comb":"tecnicas_ofensivas_fisicas","custo_ki":6,"custo_ki_texto":"[KI: 06]","requisitos":null,"testes":["Força ou Constituição vs Acerto do Usuário"],"efeito":"É um golpe brutal onde o lutador une ambas as mãos acima da cabeça e as arremessa para baixo em um movimento explosivo, atingindo o topo do adversário com força esmagadora. Se acertado, o alvo é deslocado para baixo ou para o lado a escolha do usuário uma quantidade de metros igual a 6,0m, aumentando em +1,5m para cada 1 ponto de Ki extra que gastar, isso caso não passe em um Teste de Força ou Constituição vs Acerto do Usuário. Caso o alvo seja atravesse alguma estrutura durante seu deslocamento, o próximo dano causado a ele terá seu estágio aumentando em mais um caso o acerte, se o acerto já tinha determinado dano completo, aumente o dano da técnica equivalente ao dano mínimo que ela daria somando ao dano causado.","pagina":38},{"id":"mm05","nome":"Investida do Touro","simbolo":"*","comb":"tecnicas_ofensivas_fisicas","custo_ki":3,"custo_ki_texto":"[KI: 03]","requisitos":null,"testes":["Força ou Constituição vs Acerto do Usuário"],"efeito":"É uma cabeçada devastadora que combina força bruta com precisão estratégica. O lutador analisa os movimentos do oponente antes de girar o torso para longe e então se impulsionar com violência, desferindo o golpe com todo o peso de seu corpo. Se acertado, o alvo é empurrado alguns metros (3,0m) para trás e perde a estabilidade, recebendo o efeito negativo “Caído”, se não passar em um Teste de Força ou Constituição vs Acerto do Usuário. Caso esteja em uma luta área, perde a capacidade de voar, caindo ao chão, apenas podendo levantar a voo novamente se livrar-se da condição.","pagina":38},{"id":"mm06","nome":"Contra-Golpe Implacável","simbolo":null,"comb":null,"custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":[],"efeito":"É uma técnica que exige coragem e precisão, onde o lutador aceita o impacto do ataque inimigo para devolver um golpe devastador no mesmo instante. Ao ativar esse movimento, o usuário permite que o ataque do oponente acerte, mas no exato momento do impacto, ele revida com um golpe próprio com intenção de causar dano, mesmo que ele não tenha rótulo de reação.","pagina":39},{"id":"mm07","nome":"Braço do Furacão","simbolo":"*","comb":"tecnicas_ofensivas_fisicas","custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":["Destreza ou Força vs Acerto do Usuário"],"efeito":"É um movimento veloz e agressivo onde o lutador avança contra o oponente com um impulso explosivo, estendendo o braço em um golpe direcionado ao pescoço ou parte superior do corpo. Se acertado, o inimigo deve fazer um Teste de Destreza ou Força vs Acerto do Usuário, onde caso falhe o usuário pode “arrastar” o inimigo por todo o deslocamento que ele tiver, até onde bem entender, ficando engajado com ele ao final.","pagina":39},{"id":"mm08","nome":"Toque do Dragão Adormecido","simbolo":"*","comb":"tecnicas_ofensivas_fisicas","custo_ki":6,"custo_ki_texto":"[KI: 06]","requisitos":null,"testes":[],"efeito":"É uma técnica secreta que atinge pontos vitais do oponente de forma sutil, retardando o impacto para um momento inesperado. Ao acertar o golpe, o usuário marca o inimigo com um toque preciso, sem causar dano imediato. O dano do próximo ataque físico desferido após a ativação da técnica fica armazenado e pode ser liberado a qualquer momento durante a batalha, até o usuário ficar inconsciente ou decidir ativá-lo. Essa habilidade permite ao lutador aplicar o dano no momento mais estratégico, surpreendendo o adversário. Não é possível armazenar mais de um dano por vez.","pagina":39},{"id":"mm09","nome":"Explosão Ensurdecedora","simbolo":null,"comb":null,"custo_ki":5,"custo_ki_texto":"[KI: 05]","requisitos":null,"testes":["Constituição vs Acerto do Usuário"],"efeito":"É uma técnica brutal e desestabilizadora onde o lutador desfere um golpe simultâneo com ambas as mãos em concha contra os ouvidos do oponente, gerando uma pressão intensa que afeta seu equilíbrio e percepção. Se acertado, o alvo fica temporariamente desorientado, sofrendo uma penalidade de - 2 em sua CA para o próximo golpe que for aplicado nele além de não ser capaz de ouvir nada até o início de seu próximo turno, caso ele não passe em um Teste de Constituição vs Acerto do Usuário.","pagina":39},{"id":"mm10","nome":"Cotovelo da Liberdade","simbolo":"*","comb":"tecnicas_ofensivas_fisicas","custo_ki":2,"custo_ki_texto":"[KI: 02]","requisitos":null,"testes":[],"efeito":"É um movimento defensivo que permite ao lutador se desvencilhar de oponentes que tentam prendê-lo em combate corpo a corpo. Ao perceber que o inimigo se aproxima demais, o usuário desfere uma cotovelada rápida e precisa, forçando o adversário a recuar instintivamente. Se bem-sucedido, o lutador é considerado desengajado, podendo se mover livremente sem provocar ataques de oportunidade. Essa técnica é especialmente útil contra inimigos que tentam restringir sua movimentação ou cercá-lo.","pagina":39},{"id":"mm11","nome":"Impacto Meteórico","simbolo":"*","comb":"tecnicas_ofensivas_fisicas","custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":["Destreza vs Acerto do Usuário"],"efeito":"É uma técnica devastadora onde o lutador utiliza todo o seu corpo para impulsionar um soco massivo de cima para baixo. Ao inclinar-se e girar como um lançador de baseball, ele canaliza uma força tremenda no movimento, tornando o golpe quase impossível de bloquear diretamente.\nCaso acerte o alvo deve realizar um Teste de Destreza vs Acerto do Usuário, onde se falhar sua defesa é considerada quebrada para o próximo golpe físico que receber, isso significa que qualquer rolagem defensiva que fizer será feita com desvantagem, ou a rolagem de acerto do usuário será feita com vantagem, isso fica a decisão do usuário.","pagina":39},{"id":"mm12","nome":"Soco da Serpente Traiçoeira","simbolo":null,"comb":null,"custo_ki":4,"custo_ki_texto":"[KI: 04]","requisitos":null,"testes":["Destreza ou Constituição vs Acerto do Usuário"],"efeito":"Esse golpe foi desenvolvido para atordoar o oponente, deixando-o vulnerável para um próximo ataque. Um soco potente é desferido na caixa torácica, causando um impacto que desestabiliza o alvo. Por ser um golpe desleal, seu uso pode resultar na perda de honra, dependendo do contexto e da si
