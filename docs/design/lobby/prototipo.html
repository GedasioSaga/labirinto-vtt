    if (t >= hoje - DIA) return `ontem às ${hhmm(t)}`;
    const d = new Date(t);
    return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')} às ${hhmm(t)}`;
  }

  function nomeDoDia(t) {
    const hoje = inicioDoDia(Date.now());
    if (t >= hoje) return 'Hoje';
    if (t >= hoje - DIA) return 'Ontem';
    return new Date(t).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  const tempo = (t) => `<time datetime="${new Date(t).toISOString()}" title="${esc(new Date(t).toLocaleString('pt-BR'))}">${esc(quandoRelativo(t))}</time>`;

  function rank(atr, v) { return atr.inicial + atr.limiares.filter((l) => v >= l).length; }
  const campanha = (id) => CAMPANHAS.find((c) => c.id === id);
  const campanhaDaFicha = (fichaId) => CAMPANHAS.find((c) => c.fichas.includes(fichaId));
  const ehMinha = (f) => f.dono === EU;
  const online = (c, pessoa) => pessoa === EU ? estado.online : c.online.includes(pessoa);

  /* ---- campos da ficha (o caminho da op, em versão curta) */
  function ler(f, campo) {
    const [a, b, c] = campo.split(':');
    if (a === 'vida' || a === 'energia') return f[a].atual;
    if (a === 'escudo' || a === 'moedas') return f[a];
    if (a === 'atr') return f.atr[b];
    if (a === 'hab') { const h = f.habilidades.find((x) => x.id === b); return h ? h[c] : undefined; }
    if (a === 'item') { const it = f.mochila.find((x) => x.id === b); return c ? (it ? it.qtd : 0) : it; }
    return undefined;
  }

  function escrever(f, campo, valor) {
    const [a, b, c] = campo.split(':');
    if (a === 'vida' || a === 'energia') f[a].atual = valor;
    else if (a === 'escudo' || a === 'moedas') f[a] = valor;
    else if (a === 'atr') f.atr[b] = valor;
    else if (a === 'hab') { const h = f.habilidades.find((x) => x.id === b); if (h) h[c] = valor; }
    else if (a === 'item' && c === 'qtd') { const it = f.mochila.find((x) => x.id === b); if (it) it.qtd = valor; }
  }

  function aplicar(f, op) {
    if (op.tipo === 'definir') escrever(f, op.campo, op.para);
    else if (op.tipo === 'somar') escrever(f, op.campo, ler(f, op.campo) + op.delta);
    else if (op.tipo === 'criar') { if (!f.mochila.some((i) => i.id === op.item.id)) f.mochila.push({ ...op.item }); }
    else if (op.tipo === 'apagar') f.mochila = f.mochila.filter((i) => i.id !== op.item.id);
  }

  /* ===================================================================
     O FUNIL DO PROTÓTIPO: toda mudança vira uma op pequena, aparece já
     na tela (otimista), conta em "Enviando N" e só vira "Salvo" no ack.
     =================================================================== */
  function enviar(op, { semAck = false } = {}) {
    if (!estado.online) {
      torrada('Sem internet: mudanças novas ficam pausadas até a conexão voltar.');
      return false;
    }
    const f = FICHAS[op.fichaId];
    const completa = { opId: novoId('op'), autor: EU, quando: Date.now(), ...op };
    aplicar(f, completa);
    estado.pendentes.push(completa);
    if (!semAck) agendarAck(completa);
    atualizar();
    return completa;
  }

  function agendarAck(op, atraso = 650 + Math.random() * 450) {
    clearTimeout(op.timer);
    op.timer = setTimeout(() => confirmar(op), atraso);
  }

  function confirmar(op) {
    if (!estado.online) return;
    const i = estado.pendentes.indexOf(op);
    if (i < 0) return;
    estado.pendentes.splice(i, 1);
    const evento = { ...op, id: op.opId, quando: Date.now() };
    delete evento.timer;
    HISTORICO.push(evento);
    if (op.desfaz) {
      const alvo = evento_(op.desfaz);
      if (alvo) alvo.desfeitaPor = evento.id;
      const verbo = alvo && alvo.desfaz ? 'Refeito' : 'Desfeito';
      torrada(`${verbo}: ${textoDaVolta(op)}.`, { rotulo: alvo && alvo.desfaz ? 'Desfazer' : 'Refazer', acao: () => pedirDesfazer(evento.id) });
    }
    atualizar();
  }

  function textoDaVolta(op) {
    const nome = op.rotulo.charAt(0).toUpperCase() + op.rotulo.slice(1);
    if (op.tipo === 'apagar') return `${op.rotulo} saiu da mochila`;
    if (op.tipo === 'criar') return `${op.rotulo} voltou para a mochila`;
    if (op.campo === 'moedas') return `as moedas voltaram para ${fmtNum(op.para)}`;
    return `${nome} voltou para ${typeof op.para === 'number' ? fmtNum(op.para) : '“' + op.para + '”'}`;
  }

  const evento_ = (id) => HISTORICO.find((e) => e.id === id);

  function mudarNumero(fichaId, campo, rotulo, para) {
    const f = FICHAS[fichaId];
    const de = ler(f, campo);
    if (de === para) return;
    enviar({ fichaId, tipo: 'definir', campo, rotulo, de, para });
  }

  function somarItem(fichaId, itemId, delta) {
    const f = FICHAS[fichaId];
    const it = f.mochila.find((i) => i.id === itemId);
    if (!it) return;
    if (it.qtd + delta <= 0) {
      enviar({ fichaId, tipo: 'apagar', campo: `item:${itemId}`, rotulo: it.nome, item: { ...it } });
      torrada(`${it.nome} saiu da mochila.`);
      return;
    }
    enviar({ fichaId, tipo: 'somar', campo: `item:${itemId}:qtd`, rotulo: it.nome, delta, de: it.qtd, para: it.qtd + delta, aumento: delta > 0 });
  }

  function somarMoedas(fichaId, delta) {
    const f = FICHAS[fichaId];
    if (f.moedas + delta < 0) { estado.erros[`${fichaId}|moedas`] = 'Não dá para ficar com moedas negativas.'; atualizar(); return; }
    enviar({ fichaId, tipo: 'somar', campo: 'moedas', rotulo: 'moedas', delta, de: f.moedas, para: f.moedas + delta, aumento: delta > 0 });
  }

  /* ---- desfazer: a inversa sai SÓ do evento alvo (plano 5.3) */
  function desfeita(e) {
    if (!e || !e.desfeitaPor) return false;
    const u = evento_(e.desfeitaPor);
    return !!u && !desfeita(u);
  }

  function inversa(e) {
    const f = FICHAS[e.fichaId];
    if (e.tipo === 'definir') return { tipo: 'definir', campo: e.campo, rotulo: e.rotulo, de: ler(f, e.campo), para: e.de };
    if (e.tipo === 'somar') {
      if (e.campo.startsWith('item:')) {
        const id = e.campo.split(':')[1];
        const it = f.mochila.find((i) => i.id === id);
        if (!it) return { impossivel: `${e.rotulo} já foi tirado da mochila. Nada a desfazer.` };
        const para = it.qtd - e.delta;
        if (para <= 0) return { tipo: 'apagar', campo: `item:${id}`, rotulo: it.nome, item: { ...it } };
        return { tipo: 'somar', campo: e.campo, rotulo: e.rotulo, delta: -e.delta, de: it.qtd, para, aumento: -e.delta > 0 };
      }
      if (f.moedas - e.delta < 0) return { impossivel: 'Essas moedas já foram gastas. Nada a desfazer.' };
      return { tipo: 'somar', campo: e.campo, rotulo: e.rotulo, delta: -e.delta, de: f.moedas, para: f.moedas - e.delta, aumento: -e.delta > 0 };
    }
    const id = e.campo.split(':')[1];
    const existe = f.mochila.find((i) => i.id === id);
    if (e.tipo === 'criar') {
      if (!existe) return { impossivel: `${e.rotulo} já foi tirado da mochila. Nada a desfazer.` };
      return { tipo: 'apagar', campo: e.campo, rotulo: e.rotulo, item: { ...existe } };
    }
    if (existe) return { impossivel: `${e.rotulo} já voltou para a mochila. Nada a desfazer.` };
    return { tipo: 'criar', campo: e.campo, rotulo: e.rotulo, item: { ...e.item }, aumento: true };
  }

  /* Quem mudou o mesmo campo depois deste evento (só "definir" pede confirmação: somas não brigam). */
  function mudancaDepois(e) {
    if (e.tipo !== 'definir') return null;
    const f = FICHAS[e.fichaId];
    if (ler(f, e.campo) === e.para) return null;
    const depois = HISTORICO.filter((x) => x.fichaId === e.fichaId && x.campo === e.campo && x.quando > e.quando && x.id !== e.id);
    return { evento: depois[depois.length - 1], atual: ler(f, e.campo) };
  }

  function pedirDesfazer(id, confirmado = false) {
    const e = evento_(id);
    if (!e) return;
    if (!estado.online) { torrada('Sem internet: o desfazer espera a conexão voltar.'); return; }
    const inv = inversa(e);
    if (inv.impossivel) { torrada(inv.impossivel); return; }
    if (!confirmado && mudancaDepois(e)) {
      estado.confirmando = id;
      atualizar();
      const b = document.querySelector(`[data-acao="confirmar-desfazer"][data-id="${id}"]`);
      if (b) b.focus();
      return;
    }
    estado.confirmando = null;
    enviar({ fichaId: e.fichaId, desfaz: e.id, ...inv });
  }

  /* ===================================================================
     ROTAS
     =================================================================== */
  function lerRota() {
    const partes = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (partes[0] === 'campanhas') return { tela: 'campanhas' };
    if (partes[0] === 'c' && campanha(partes[1])) {
      const c = campanha(partes[1]);
      if (partes[2] === 'f' && c.fichas.includes(partes[3])) {
        const aba = ['mochila', 'historico'].includes(partes[4]) ? partes[4] : 'ficha';
        return { tela: 'ficha', campanha: c.id, ficha: partes[3], aba };
      }
      return { tela: 'campanha', campanha: c.id };
    }
    if (partes[0] === 'entrar' && partes[1] === 'sem-convite') return { tela: 'acesso', semConvite: true };
    return { tela: 'acesso' };
  }

  // Troca o endereço e já desenha (o hashchange que vem depois vê a mesma rota e não refaz).
  const ir = (hash) => { if (location.hash !== hash) location.hash = hash; render(); };
  const hashDaFicha = (fichaId, aba) => `#/c/${campanhaDaFicha(fichaId).id}/f/${fichaId}${aba && aba !== 'ficha' ? '/' + aba : ''}`;

  /* ===================================================================
     TELAS
     =================================================================== */

  /* 1 — SEM ACESSO */
  function telaAcesso(r) {
    const porta = r.semConvite
      ? `<section class="lo-porta" aria-labelledby="porta-t">
          <span class="lo-porta__sinal">${ic('convite')}</span>
          <h2 id="porta-t">Este e-mail ainda não está em nenhuma mesa</h2>
          <p>Você entrou como <strong>${esc(VISITANTE)}</strong>. Peça ao mestre para te convidar com este e-mail. Depois é só entrar de novo.</p>
          <div class="lo-porta__acoes">
            <button type="button" class="lo-btn lo-btn--primario" data-acao="copiar-email">${ic('copiar')} Copiar meu e-mail</button>
            <button type="button" class="lo-btn" data-acao="outra-conta">Entrar com outra conta</button>
          </div>
        </section>`
      : `<section class="lo-porta" aria-labelledby="porta-t">
          <h2 id="porta-t">Entrar</h2>
          <p>Só entra quem o mestre convidou. Use o e-mail que você passou para ele.</p>
          <button type="button" class="lo-btn lo-btn--primario lo-btn--grande" data-acao="entrar-convidada">${ic('entrar')} Entrar com Google</button>
          <p class="lo-porta__miuda">O Lobby guarda só o seu e-mail, para saber quais fichas são suas.</p>
        </section>`;
    return `<div class="lo-entrada">
      <div class="lo-entrada__marca">
        <p class="lo-entrada__lobby">Labirinto</p>
        <h1 class="lo-entrada__titulo">Lobby da mesa</h1>
        <p class="lo-entrada__texto">As fichas da sua campanha, abertas entre uma sessão e outra. Veja a sua e a dos colegas, ajuste a Vida, arrume a mochila. O mestre vê na hora.</p>
      </div>
      ${porta}
    </div>`;
  }

  /* 2 — MINHAS CAMPANHAS */
  function ultimaDa(c) {
    const evs = HISTORICO.filter((e) => c.fichas.includes(e.fichaId));
    return evs.reduce((a, b) => (b.quando > a.quando ? b : a), evs[0]);
  }

  /* A última mudança da mesa numa linha, com o nome do personagem. */
  function resumo(e) {
    const quem = nomeDoAutor(e);
    const de = FICHAS[e.fichaId].nome.split(' ')[0];
    if (e.desfaz) return `${quem} desfez uma mudança na ficha de ${de}`;
    if (e.tipo === 'definir') return `${quem} mudou ${e.rotulo} de ${de} para ${typeof e.para === 'number' ? fmtNum(e.para) : '“' + e.para + '”'}`;
    if (e.tipo === 'somar' && e.campo === 'moedas') return `${quem} ${e.delta > 0 ? 'somou' : 'tirou'} ${fmtNum(Math.abs(e.delta))} moedas na ficha de ${de}`;
    if (e.tipo === 'somar') return e.delta > 0 ? `${quem} pôs ${e.delta} ${e.rotulo} na mochila de ${de}` : `${quem} tirou ${-e.delta} ${e.rotulo} da mochila de ${de}`;
    if (e.tipo === 'criar') return `${quem} pôs ${e.rotulo} na mochila de ${de}`;
    return `${quem} tirou ${e.rotulo} da mochila de ${de}`;
  }

  function telaCampanhas() {
    const cartoes = CAMPANHAS.map((c) => {
      const mestre = PESSOAS[c.mestre];
      const jogadores = new Set(c.fichas.map((id) => FICHAS[id].dono || FICHAS[id].jogadorSemConta)).size;
      const minhas = c.fichas.filter((id) => ehMinha(FICHAS[id]));
      const u = ultimaDa(c);
      const naMesa = c.online.length;
      const rostos = c.fichas.map((id) => {
        const f = FICHAS[id];
        return `<span class="lo-retrato" data-tom="${f.tom}" ${ehMinha(f) ? 'data-seu="1"' : ''} aria-hidden="true">${esc(iniciais(f.nome))}</span>`;
      }).join('');
      return `<li><a class="lo-mesa" href="#/c/${c.id}">
        <div class="lo-mesa__topo">
          <div class="lo-grupo">${rostos}</div>
          ${naMesa ? `<span class="lo-na-mesa"><span class="lo-ponto" aria-hidden="true"></span>${plural(naMesa, 'na mesa agora', 'na mesa agora')}</span>` : ''}
        </div>
        <h2 class="lo-mesa__nome">${esc(c.nome)}</h2>
        <dl class="lo-mesa__fatos">
          <div><dt>Mestre</dt><dd>${esc(mestre.nome)}</dd></div>
          <div><dt>Jogadores</dt><dd>${jogadores}</dd></div>
          <div><dt>Seus personagens</dt><dd>${esc(minhas.map((id) => FICHAS[id].nome.split(' ')[0]).join(' e '))}</dd></div>
        </dl>
        <div class="lo-mesa__rodape">
          <p class="lo-mesa__ultima">Última mudança ${tempo(u.quando)}: <b>${esc(resumo(u))}</b></p>
          <span class="lo-mesa__ir">Entrar ${ic('ir')}</span>
        </div>
      </a></li>`;
    }).join('');
    return `<div class="lo-pagina">
      <header class="lo-cab-pag">
        <div class="lo-cab-pag__texto">
          <h1 class="lo-titulo">Suas mesas</h1>
          <p class="lo-sub">Olá, ${esc(PESSOAS[EU].nome)}. Escolha uma campanha para ver as fichas.</p>
        </div>
      </header>
      <ul class="lo-mesas">${cartoes}</ul>
    </div>`;
  }

  /* 3 — CAMPANHA */
  function medidor(nome, tom, atual, max) {
    const p = Math.max(0, Math.min(1, atual / max));
    return `<div class="lo-medidor" data-tom="${tom}">
      <span class="lo-medidor__nome">${nome}</span>
      <span class="lo-barra" aria-hidden="true"><span style="transform:scaleX(${p.toFixed(3)})"></span></span>
      <span class="lo-medidor__valor">${atual} <small>/ ${max}</small></span>
    </div>`;
  }

  function telaCampanha(r) {
    const c = campanha(r.campanha);
    const mestre = PESSOAS[c.mestre];
    const minhas = c.fichas.filter((id) => ehMinha(FICHAS[id]));
    const outras = c.fichas.filter((id) => !ehMinha(FICHAS[id]));
    const agora = [c.mestre, ...(estado.online ? [EU] : []), ...c.online.filter((p) => p !== c.mestre)];

    const herois = minhas.map((id) => {
      const f = FICHAS[id];
      return `<li><article class="lo-heroi" aria-labelledby="h-${id}">
        <span class="lo-retrato lo-retrato--g" data-tom="${f.tom}" aria-hidden="true">${esc(iniciais(f.nome))}</span>
        <div class="lo-heroi__corpo">
          <div>
            <h3 class="lo-heroi__nome" id="h-${id}">${esc(f.nome)}</h3>
            <p class="lo-heroi__de">${esc(f.raca)}, ${esc(f.oficio)}</p>
          </div>
          <div class="lo-medidores">
            ${medidor('Vida', 'vida', f.vida.atual, f.vida.max)}
            ${medidor('Energia', 'energia', f.energia.atual, f.energia.max)}
          </div>
          <div class="lo-heroi__acoes">
            <a class="lo-btn lo-btn--primario" href="${hashDaFicha(id)}">Abrir ficha</a>
            <a class="lo-btn" href="${hashDaFicha(id, 'mochila')}">Mochila</a>
          </div>
        </div>
      </article></li>`;
    }).join('');

    const colegas = outras.map((id) => {
      const f = FICHAS[id];
      const dono = f.dono ? PESSOAS[f.dono] : null;
      const naMesa = f.dono && online(c, f.dono);
      return `<li><a class="lo-colega" href="${hashDaFicha(id)}" aria-label="${esc(f.nome)}, de ${esc(dono ? dono.nome : f.jogadorSemConta)}. Só ver.">
        <span class="lo-retrato" data-tom="${f.tom}" aria-hidden="true">${esc(iniciais(f.nome))}${naMesa ? '<span class="lo-ponto"></span>' : ''}</span>
        <div class="lo-colega__corpo">
          <h3 class="lo-colega__nome">${esc(f.nome)}</h3>
          <p class="lo-colega__de">${dono ? `de ${esc(dono.nome)}` : `de ${esc(f.jogadorSemConta)}, sem conta no Lobby`}${naMesa ? ' <span class="lo-tag lo-tag--online">na mesa agora</span>' : ''}</p>
          ${medidor('Vida', 'vida', f.vida.atual, f.vida.max)}
          ${medidor('Energia', 'energia', f.energia.atual, f.energia.max)}
        </div>
        <div class="lo-colega__pe"><span>${esc(f.raca)}, ${esc(f.oficio)}</span><span class="lo-tag">${ic('olho')} Só ver</span></div>
      </a></li>`;
    }).join('');

    const listaAgora = agora.length
      ? agora.map((p) => `<li><span class="lo-av" data-tom="${PESSOAS[p].tom}" aria-hidden="true">${esc(PESSOAS[p].nome[0])}<span class="lo-ponto"></span></span>${p === EU ? 'Você' : esc(PESSOAS[p].nome)}${p === c.mestre ? ' <span class="lo-agora__papel">(mestre)</span>' : ''}</li>`).join('')
      : '<li class="lo-agora__papel">Ninguém agora.</li>';

    return `<div class="lo-pagina">
      <header class="lo-cab-pag">
        <div class="lo-cab-pag__texto">
          <a class="lo-voltar" href="#/campanhas">${ic('voltar')} Suas mesas</a>
          <h1 class="lo-titulo">${esc(c.nome)}</h1>
          <p class="lo-sub">Mestre ${esc(mestre.nome)}. Sistema One Piece. ${plural(c.fichas.length, 'personagem', 'personagens')}.</p>
        </div>
        <aside class="lo-agora" aria-labelledby="agora-t">
          <p class="lo-agora__titulo" id="agora-t"><span class="lo-ponto" aria-hidden="true"></span> Na mesa agora</p>
          <ul>${listaAgora}</ul>
        </aside>
      </header>
      <section class="lo-secao" aria-labelledby="seus-t">
        <div class="lo-secao__cab"><h2 class="lo-secao__titulo" id="seus-t">Seus personagens</h2></div>
        <ul class="lo-herois">${herois || '<li class="lo-secao__nota">Você não tem personagem nesta mesa. Peça ao mestre para ligar uma ficha à sua conta.</li>'}</ul>
      </section>
      <section class="lo-secao" aria-labelledby="trip-t">
        <div class="lo-secao__cab">
          <h2 class="lo-secao__titulo" id="trip-t">A tripulação</h2>
          <p class="lo-secao__nota">Você vê tudo dos colegas. Só eles e o mestre mudam as fichas deles.</p>
        </div>
        <ul class="lo-tripulacao">${colegas}</ul>
      </section>
    </div>`;
  }

  /* 4 — FICHA (com 5, 6 e 7 dentro) */
  function classeDestaque(fichaId, campo) {
    const t = estado.destaques[`${fichaId}|${campo}`];
    if (!t) return { cls: '', estilo: '' };
    const passou = Date.now() - t;
    if (passou > 1600) return { cls: '', estilo: '' };
    return { cls: 'is-destaque', estilo: `animation-delay:-${passou}ms` };
  }

  function passo(f, campo, rotulo, valor, { min = 0, max = 999, travado = '', tom = '' } = {}) {
    const k = `${f.id}|${campo}`;
    const erro = estado.erros[k];
    const desl = travado ? 'disabled' : '';
    const idErro = `erro-${f.id}-${campo.replace(/:/g, '-')}`;
    return `<div class="lo-passo">
      <button type="button" class="lo-btn lo-btn--icone" data-k="${k}|-" data-acao="passo" data-ficha="${f.id}" data-campo="${campo}" data-rotulo="${esc(rotulo)}" data-delta="-1" aria-label="Tirar 1 de ${esc(rotulo)}" ${desl || (valor <= min ? 'disabled' : '')}>${ic('menos')}</button>
      <input class="lo-numero" type="text" inputmode="numeric" autocomplete="off" value="${esc(estado.digitado[k] ?? valor)}" aria-label="${esc(rotulo)}" data-k="${k}" data-ficha="${f.id}" data-campo="${campo}" data-rotulo="${esc(rotulo)}" data-min="${min}" data-max="${max}" ${erro ? `aria-invalid="true" aria-describedby="${idErro}"` : ''} ${desl}>
      <button type="button" class="lo-btn lo-btn--icone" data-k="${k}|+" data-acao="passo" data-ficha="${f.id}" data-campo="${campo}" data-rotulo="${esc(rotulo)}" data-delta="1" aria-label="Pôr 1 de ${esc(rotulo)}" ${desl || (valor >= max ? 'disabled' : '')}>${ic('mais')}</button>
    </div>${erro ? `<p class="lo-erro-campo" id="${idErro}">${esc(erro)}</p>` : ''}`;
  }

  function recurso(f, campo, nome, tom, pode) {
    const d = classeDestaque(f.id, campo);
    const decidir = estado.decisoes.find((x) => x.fichaId === f.id && x.campo === campo);
    const valor = ler(f, campo);
    const max = campo === 'escudo' ? null : f[campo].max;
    let corpo;
    if (!pode) {
      corpo = `<span class="lo-recurso__ler">${valor}</span>`;
    } else if (decidir) {
      corpo = `${passo(f, campo, nome, valor, { travado: 'decidir' })}<p class="lo-motivo">Escolha no aviso acima qual valor fica.</p>`;
    } else {
      corpo = passo(f, campo, nome, valor, { travado: estado.online ? '' : 'offline' });
    }
    const barra = max ? `<span class="lo-barra" aria-hidden="true"><span style="transform:scaleX(${Math.max(0, Math.min(1, valor / max)).toFixed(3)})"></span></span>` : '';
    return `<div class="lo-recurso ${d.cls}" style="${d.estilo}" data-tom="${tom}" ${decidir ? 'data-decidir="1"' : ''}>
      <div class="lo-recurso__topo"><span class="lo-recurso__nome">${nome}</span>${max ? `<span class="lo-recurso__max">máximo ${max}</span>` : ''}</div>
      ${corpo}
      ${barra}
    </div>`;
  }

  function painelFicha(f, pode) {
    const ed = estado.editando && estado.editando.fichaId === f.id ? estado.editando : null;
    const atrs = ATRIBUTOS.map((a) => {
      const v = f.atr[a.id];
      const rk = rank(a, v);
      const d = classeDestaque(f.id, `atr:${a.id}`);
      const corpo = pode
        ? passo(f, `atr:${a.id}`, a.nome, v, { travado: estado.online ? '' : 'offline', max: 9999 })
        : `<span class="lo-atr__ler">${v}</span>`;
      return `<div class="lo-atr ${d.cls}" style="${d.estilo}">
        <div class="lo-atr__topo"><abbr class="lo-atr__sigla" title="${esc(a.nome)}">${a.sigla}</abbr><span class="lo-atr__rank" ${rk >= 4 ? 'data-alto="1"' : ''}>Rank ${rk}</span></div>
        ${corpo}
        <span class="lo-atr__nome">${esc(a.nome)}</span>
      </div>`;
    }).join('');

    const habs = f.habilidades.map((h) => {
      if (ed) {
        const r = ed.rascunho[h.id];
        return `<article class="lo-hab">
          <div class="lo-campo"><label for="hab-${h.id}-nome">Nome</label><input class="lo-texto" id="hab-${h.id}-nome" data-k="ed|${h.id}|nome" data-ed="${h.id}:nome" value="${esc(r.nome)}" maxlength="80"></div>
          <div class="lo-campo"><label for="hab-${h.id}-desc">Descrição</label><textarea class="lo-texto" id="hab-${h.id}-desc" data-k="ed|${h.id}|desc" data-ed="${h.id}:desc" maxlength="2000">${esc(r.desc)}</textarea></div>
        </article>`;
      }
      const linhas = [['Ação', h.acao], ['Custo', h.custo], ['Dano', h.dano]].filter(([, v]) => v)
        .map(([k, v]) => `<span class="lo-chip">${k}: ${esc(v)}</span>`).join('');
      const d = classeDestaque(f.id, `hab:${h.id}:nome`);
      return `<article class="lo-hab ${d.cls}" style="${d.estilo}">
        <h3 class="lo-hab__nome">${esc(h.nome)}</h3>
        <div class="lo-hab__linhas">${linhas}</div>
        <p class="lo-hab__desc">${esc(h.desc)}</p>
      </article>`;
    }).join('');

    const barra = ed ? `<div class="lo-barra-edicao" role="region" aria-label="Edição da ficha">
        <p>${estado.online ? 'Cada campo que você mudar vai como uma mudança separada.' : 'Sem internet: dá para continuar escrevendo, mas Salvar espera a conexão voltar.'}</p>
        <div>
          <button type="button" class="lo-btn" data-acao="cancelar-edicao">Cancelar</button>
          <button type="button" class="lo-btn lo-btn--primario" data-acao="salvar-edicao" ${estado.online ? '' : 'disabled'}>Salvar mudanças</button>
        </div>
      </div>` : '';

    return `<section aria-labelledby="atr-t">
        <div class="lo-painel__cab"><h2 class="lo-painel__titulo" id="atr-t">Atributos</h2></div>
        <div class="lo-atributos">${atrs}</div>
      </section>
      <section aria-labelledby="hab-t">
        <div class="lo-painel__cab"><h2 class="lo-painel__titulo" id="hab-t">Habilidades</h2>${pode && !ed ? '<span class="lo-motivo">Para mudar nome e descrição, use Editar ficha.</span>' : ''}</div>
        <div class="lo-habs">${habs}</div>
        ${barra}
      </section>`;
  }

  function painelMochila(f, pode) {
    const travado = !estado.online;
    const kM = `${f.id}|moedas`;
    const dM = classeDestaque(f.id, 'moedas');
    const moedas = pode
      ? `<div class="lo-passo">
          <button type="button" class="lo-btn lo-btn--icone" data-k="${kM}|-" data-acao="moedas" data-ficha="${f.id}" data-delta="-1" aria-label="Tirar 1 moeda" ${travado || f.moedas <= 0 ? 'disabled' : ''}>${ic('menos')}</button>
          <input class="lo-numero" type="text" inputmode="numeric" autocomplete="off" value="${esc(estado.digitado[kM] ?? f.moedas)}" aria-label="Moedas" data-k="${kM}" data-ficha="${f.id}" data-campo="moedas" data-rotulo="moedas" data-min="0" data-max="9999999" ${estado.erros[kM] ? `aria-invalid="true" aria-describedby="erro-${f.id}-moedas"` : ''} ${travado ? 'disabled' : ''}>
          <button type="button" class="lo-btn lo-btn--icone" data-k="${kM}|+" data-acao="moedas" data-ficha="${f.id}" data-delta="1" aria-label="Pôr 1 moeda" ${travado ? 'disabled' : ''}>${ic('mais')}</button>
        </div>`
      : '';
    const itensHtml = f.mochila.length ? f.mochila.map((it) => {
      const d = classeDestaque(f.id, `item:${it.id}:qtd`);
      const qtd = pode
        ? `<div class="lo-qtd">
            ${it.qtd <= 1
              ? `<button type="button" class="lo-btn lo-btn--icone lo-btn--tirar" data-k="${f.id}|item|${it.id}|-" data-acao="item" data-ficha="${f.id}" data-item="${it.id}" data-delta="-1" aria-label="Tirar ${esc(it.nome)} da mochila" title="Tirar da mochila" ${travado ? 'disabled' : ''}>${ic('tirar')}</button>`
              : `<button type="button" class="lo-btn lo-btn--icone" data-k="${f.id}|item|${it.id}|-" data-acao="item" data-ficha="${f.id}" data-item="${it.id}" data-delta="-1" aria-label="Tirar 1 ${esc(it.nome)}" ${travado ? 'disabled' : ''}>${ic('menos')}</button>`}
            <output aria-label="Quantidade de ${esc(it.nome)}">${it.qtd}</output>
            <button type="button" class="lo-btn lo-btn--icone" data-k="${f.id}|item|${it.id}|+" data-acao="item" data-ficha="${f.id}" data-item="${it.id}" data-delta="1" aria-label="Pôr 1 ${esc(it.nome)}" ${travado ? 'disabled' : ''}>${ic('mais')}</button>
          </div>`
        : `<span class="lo-moedas__nome">x${it.qtd}</span>`;
      return `<li class="lo-item ${d.cls}" style="${d.estilo}">
        <span class="lo-vaga" data-tom="${it.tom}" aria-hidden="true">${esc(iniciais(it.nome))}<span class="lo-vaga__qtd">${it.qtd}</span></span>
        <div class="lo-item__texto"><p class="lo-item__nome">${esc(it.nome)}</p><p class="lo-item__desc">${esc(it.desc)}</p></div>
        ${qtd}
      </li>`;
    }).join('') : '<li class="lo-vazio">A mochila está vazia. Use Pôr item para guardar a primeira coisa.</li>';

    const por = !pode ? '' : estado.porItem
      ? `<form class="lo-por" data-acao-form="por-item" data-ficha="${f.id}" aria-label="Pôr item na mochila">
          <div class="lo-campo"><label for="por-nome">Nome do item</label><input class="lo-texto" id="por-nome" name="nome" data-k="por|nome" maxlength="80" required autocomplete="off"></div>
          <div class="lo-campo"><label for="por-qtd">Quantidade</label><input class="lo-texto" id="por-qtd" name="qtd" data-k="por|qtd" inputmode="numeric" value="1" autocomplete="off"></div>
          <div class="lo-por__acoes"><button type="submit" class="lo-btn lo-btn--primario">Pôr na mochila</button><button type="button" class="lo-btn" data-acao="fechar-por">Cancelar</button></div>
          ${estado.erros.por ? `<p class="lo-erro-campo" style="grid-column:1/-1">${esc(estado.erros.por)}</p>` : ''}
        </form>`
      : `<div class="lo-mochila__pe"><button type="button" class="lo-btn" data-k="abrir-por" data-acao="abrir-por" ${travado ? 'disabled' : ''}>${ic('mais')} Pôr item</button>${travado ? '<span class="lo-motivo">Sem internet: volta quando a conexão voltar.</span>' : ''}</div>`;

    return `<section aria-labelledby="moch-t">
      <div class="lo-painel__cab">
        <h2 class="lo-painel__titulo" id="moch-t">Mochila</h2>
        <p class="lo-nota-mapas">${ic('mapas')} A mesma mochila em todos os mapas da campanha</p>
      </div>
      <div class="lo-moedas ${dM.cls}" style="${dM.estilo}">
        <span class="lo-moedas__sinal">${ic('moeda')}</span>
        <div><p class="lo-moedas__nome">Moedas</p>${pode ? '<p class="lo-motivo">Digite o total ou use − e +.</p>' : `<p class="lo-moedas__ler">${fmtNum(f.moedas)}</p>`}</div>
        ${moedas}
        ${estado.erros[kM] ? `<p class="lo-erro-campo" id="erro-${f.id}-moedas" style="grid-column:1/-1">${esc(estado.erros[kM])}</p>` : ''}
      </div>
      <ul class="lo-itens" aria-label="Itens">${itensHtml}</ul>
      ${por}
    </section>`;
  }

  function nomeDoAutor(e) {
    if (e.autor === EU) return e.mesa ? 'Você, na mesa' : 'Você';
    const c = campanhaDaFicha(e.fichaId);
    return PESSOAS[e.autor].nome + (c && c.mestre === e.autor ? ' (mestre)' : '');
  }

  // Número em algarismo de legenda; texto entre aspas e cortado em 40 letras.
  const v = (x) => `<span class="lo-ev__valor">${esc(typeof x === 'string' ? '“' + (x.length > 40 ? x.slice(0, 40) + '…' : x) + '”' : fmtNum(x))}</span>`;

  /* A frase do histórico: quem, o quê, de quanto para quanto. */
  function frase(e) {
    const quem = `<b>${esc(nomeDoAutor(e))}</b>`;
    const alvo = e.desfaz ? evento_(e.desfaz) : null;
    if (alvo) {
      const verbo = alvo.desfaz ? 'refez' : 'desfez';
      return `${quem} ${verbo} a mudança em <b>${esc(e.rotulo)}</b>`;
    }
    switch (e.tipo) {
      case 'definir': return `${quem} mudou <b>${esc(e.rotulo)}</b> de ${v(e.de)} para ${v(e.para)}`;
      case 'somar':
        if (e.campo === 'moedas') return e.delta > 0 ? `${quem} somou ${v(e.delta)} moedas` : `${quem} tirou ${v(-e.delta)} moedas`;
        return e.delta > 0 ? `${quem} pôs ${v(e.delta)} <b>${esc(e.rotulo)}</b>` : `${quem} tirou ${v(-e.delta)} <b>${esc(e.rotulo)}</b>`;
      case 'criar': return `${quem} pôs <b>${esc(e.rotulo)}</b> na mochila (${v(e.item.qtd)})`;
      case 'apagar': return `${quem} tirou <b>${esc(e.rotulo)}</b> da mochila`;
      default: return quem;
    }
  }

  // A mesma frase, sem marcação (rótulo de botão para leitor de tela).
  function frasePlana(e) {
    if (!e) return '';
    const t = document.createElement('div');
    t.innerHTML = frase(e);
    return t.textContent;
  }

  function detalhe(e) {
    if (e.tipo === 'definir' || e.tipo === 'somar') return `${v(e.de)} → ${v(e.para)}`;
    return '';
  }

  function linhaEvento(e, pode) {
    const morto = desfeita(e);
    const meu = e.autor === EU;
    const pendente = !!e.pendente;
    const tags = [
      e.aumento ? '<span class="lo-tag lo-tag--latao">Aumento na mochila</span>' : '',
      e.mesa ? '<span class="lo-tag">atestado pelo app</span>' : '',
      morto ? '<span class="lo-tag">desfeita</span>' : '',
      pendente ? (estado.online ? '<span class="lo-tag lo-tag--latao"><span class="lo-giro" aria-hidden="true"></span> enviando</span>' : '<span class="lo-tag lo-tag--mare">esperando a internet</span>') : '',
    ].join('');
    const det = e.desfaz ? detalhe(e) : (e.tipo === 'somar' ? detalhe(e) : '');
    let acao = '';
    if (pode && meu && !morto && !pendente) {
      acao = `<button type="button" class="lo-btn lo-btn--fantasma lo-ev__acao" data-k="desf|${e.id}" data-acao="desfazer" data-id="${e.id}" aria-label="${e.desfaz ? 'Refazer' : 'Desfazer'}: ${esc(frasePlana(e))}" ${estado.online ? '' : 'disabled'}>${ic('desfazer')} ${e.desfaz ? 'Refazer' : 'Desfazer'}</button>`;
    }
    let confirma = '';
    if (estado.confirmando === e.id) {
      const m = mudancaDepois(e);
      if (m) {
        confirma = `<div class="lo-confirma" role="group" aria-label="Confirmar desfazer">
          <p>Depois disso, ${esc(m.evento ? nomeDoAutor(m.evento) : 'alguém')} mudou ${esc(e.rotulo)} para ${m.atual}. Desfazer volta para ${esc(e.de)}. Confirmar?</p>
          <div>
            <button type="button" class="lo-btn lo-btn--primario" data-acao="confirmar-desfazer" data-id="${e.id}">Voltar para ${esc(e.de)}</button>
            <button type="button" class="lo-btn" data-acao="cancelar-desfazer">Deixar como está</button>
          </div>
        </div>`;
      }
    }
    const autor = PESSOAS[e.autor];
    return `<li class="lo-ev" ${e.aumento ? 'data-aumento="1"' : ''} ${morto ? 'data-desfeita="1"' : ''} ${pendente ? 'data-pendente="1"' : ''}>
      <span class="lo-av" data-tom="${autor.tom}" aria-hidden="true">${esc(autor.nome[0])}</span>
      <div class="lo-ev__corpo">
        <p class="lo-ev__frase">${frase(e)}</p>
        <p class="lo-ev__meta">${pendente ? '<span>agora</span>' : tempo(e.quando)}${det ? `<span>${det}</span>` : ''}${tags}</p>
        ${confirma}
      </div>
      ${acao}
    </li>`;
  }

  function painelHistorico(f, pode) {
    const pendentes = estado.pendentes.filter((p) => p.fichaId === f.id).map((p) => ({ ...p, id: p.opId, pendente: true }));
    const evs = HISTORICO.filter((e) => e.fichaId === f.id).sort((a, b) => b.quando - a.quando);
    const grupos = [];
    for (const e of evs) {
      const dia = nomeDoDia(e.quando);
      const g = grupos[grupos.length - 1];
      if (g && g.dia === dia) g.lista.push(e); else grupos.push({ dia, lista: [e] });
    }
    const regra = pode
      ? 'Quem mudou o quê nesta ficha. Você desfaz as suas mudanças; o mestre desfaz qualquer uma.'
      : `Quem mudou o quê nesta ficha. Só ${f.dono ? esc(PESSOAS[f.dono].nome) + ' e o mestre desfazem' : 'o mestre desfaz'}.`;
    const blocoPend = pendentes.length ? `<h3 class="lo-hist__dia">A caminho</h3><ol class="lo-eventos">${pendentes.map((e) => linhaEvento(e, pode)).join('')}</ol>` : '';
    const corpo = grupos.length
      ? grupos.map((g) => `<h3 class="lo-hist__dia">${esc(g.dia[0].toUpperCase() + g.dia.slice(1))}</h3><ol class="lo-eventos">${g.lista.map((e) => linhaEvento(e, pode)).join('')}</ol>`).join('')
      : '<p class="lo-vazio">Ninguém mudou esta ficha ainda. Cada mudança aparece aqui, com quem fez e quando.</p>';
    return `<section aria-labelledby="hist-t">
      <div class="lo-painel__cab"><h2 class="lo-painel__titulo" id="hist-t">Histórico</h2><p class="lo-secao__nota">${regra}</p></div>
      ${blocoPend}${corpo}
    </section>`;
  }

  function avisoConflito(d) {
    const quem = PESSOAS[d.quem];
    const papel = campanhaDaFicha(d.fichaId).mestre === d.quem ? 'O mestre' : quem.nome;
    const novo = Date.now() - d.quando < 300 ? 'data-novo="1"' : '';
    return `<section class="lo-conflito" role="alert" tabindex="-1" id="conflito-${d.id}" aria-labelledby="cf-${d.id}" ${novo}>
      <span class="lo-conflito__sinal" aria-hidden="true">${ic('alerta')}</span>
      <div class="lo-conflito__texto">
        <p class="lo-conflito__frase" id="cf-${d.id}">${esc(papel)} acabou de mudar ${esc(d.rotulo)} para ${d.doMestre} <em>(você tinha posto ${d.meu})</em></p>
        <p class="lo-conflito__quando">${esc(quem.nome)} mudou primeiro, às ${esc(hhmm(d.quando))}. Escolha qual valor fica; nada muda até você escolher.</p>
      </div>
      <div class="lo-conflito__acoes">
        <button type="button" class="lo-btn" data-k="cf|${d.id}|mestre" data-acao="ficar-mestre" data-id="${d.id}">Ficar com a do mestre (${d.doMestre})</button>
        <button type="button" class="lo-btn" data-k="cf|${d.id}|minha" data-acao="usar-minha" data-id="${d.id}">Usar a minha (${d.meu})</button>
      </div>
    </section>`;
  }

  function telaFicha(r) {
    const c = campanha(r.campanha);
    const f = FICHAS[r.ficha];
    const pode = ehMinha(f);
    const dono = f.dono ? PESSOAS[f.dono] : null;
    const ed = estado.editando && estado.editando.fichaId === f.id;

    let regra = '';
    if (!pode) {
      regra = f.dono
        ? `<div class="lo-linha-aviso">${ic('olho')}<p>Ficha de <b>${esc(dono.nome)}</b>. Você vê tudo, mas só ${esc(dono.nome)} e o mestre mudam.</p></div>`
        : `<div class="lo-linha-aviso">${ic('olho')}<p><b>${esc(f.jogadorSemConta)}</b> ainda não tem conta no Lobby. Só o mestre muda esta ficha.</p></div>`;
    }
    const semRede = pode && !estado.online
      ? `<div class="lo-linha-aviso" data-tom="mare">${ic('sem-rede')}<p><b>Sem internet.</b> Dá para ver tudo, mas mudanças novas ficam pausadas até a conexão voltar. As que já estavam a caminho estão guardadas neste navegador.</p></div>`
      : '';
    const avisos = estado.decisoes.filter((d) => d.fichaId === f.id).map(avisoConflito).join('');

    const abas = [['ficha', 'Ficha', ''], ['mochila', 'Mochila', f.mochila.length], ['historico', 'Histórico', '']];
    const abasHtml = abas.map(([id, nome, conta]) => `<a role="tab" class="lo-aba" id="aba-${id}" href="${hashDaFicha(f.id, id)}" aria-selected="${r.aba === id}" aria-controls="painel" tabindex="${r.aba === id ? 0 : -1}" data-k="aba|${id}">${nome}${conta !== '' ? ` <span class="lo-aba__conta">${conta}</span>` : ''}</a>`).join('');

    let painel = '';
    if (r.aba === 'mochila') painel = painelMochila(f, pode);
    else if (r.aba === 'historico') painel = painelHistorico(f, pode);
    else painel = painelFicha(f, pode);

    return `<div class="lo-pagina">
      <header class="lo-cab-ficha">
        <a class="lo-voltar" href="#/c/${c.id}">${ic('voltar')} ${esc(c.nome)}</a>
        <div class="lo-cab-ficha__linha">
          <h1 class="lo-titulo">${esc(f.nome)}</h1>
          ${pode ? '<span class="lo-tag lo-tag--sua">Sua ficha</span>' : `<span class="lo-tag">${ic('olho')} Só ver</span>`}
          ${pode && r.aba === 'ficha' ? `<div class="lo-cab-ficha__acoes">${ed ? '' : `<button type="button" class="lo-btn" data-k="editar" data-acao="editar">${ic('lapis')} Editar ficha</button>`}</div>` : ''}
        </div>
      </header>
      ${regra}${semRede}${avisos}
      <div class="lo-ficha">
        <aside class="lo-lado" aria-label="Retrato e recursos">
          <span class="lo-retrato lo-retrato--xg" data-tom="${f.tom}" aria-hidden="true">${esc(iniciais(f.nome))}</span>
          <ul class="lo-chips" aria-label="Raça e ofício"><li class="lo-chip">${esc(f.raca)}</li><li class="lo-chip">${esc(f.oficio)}</li></ul>
          <div class="lo-recursos">
            ${recurso(f, 'vida', 'Vida', 'vida', pode)}
            ${recurso(f, 'energia', 'Energia', 'energia', pode)}
            ${recurso(f, 'escudo', 'Escudo', 'escudo', pode)}
          </div>
        </aside>
        <div class="lo-folha">
          <div class="lo-abas" role="tablist" aria-label="Partes da ficha">${abasHtml}</div>
          <div class="lo-painel" role="tabpanel" id="painel" aria-labelledby="aba-${r.aba}" tabindex="-1">${painel}</div>
        </div>
      </div>
    </div>`;
  }

  /* ---- cabeça e faixa */
  function htmlCabeca(r) {
    const c = r.campanha ? campanha(r.campanha) : null;
    const f = r.ficha ? FICHAS[r.ficha] : null;
    const trilha = [`<li>${r.tela === 'campanhas' ? '<span aria-current="page">Suas mesas</span>' : '<a href="#/campanhas">Suas mesas</a>'}</li>`];
    if (c) trilha.push(`<li>${f ? `<a href="#/c/${c.id}">${esc(c.nome)}</a>` : `<span aria-current="page">${esc(c.nome)}</span>`}</li>`);
    if (f) trilha.push(`<li><span aria-current="page">${esc(f.nome)}</span></li>`);
    const agora = c ? [c.mestre, ...c.online.filter((p) => p !== c.mestre)].filter((p) => c.online.includes(p)) : [];
    const nomes = agora.map((p) => PESSOAS[p].nome + (p === c.mestre ? ' (mestre)' : '')).join(', ');
    const mini = c && agora.length
      ? `<div class="lo-agora-mini" title="Na mesa agora: ${esc(nomes)}"><div class="lo-agora-mini__rostos" aria-hidden="true">${agora.map((p) => `<span class="lo-av" data-tom="${PESSOAS[p].tom}">${esc(PESSOAS[p].nome[0])}</span>`).join('')}</div><span><span class="lo-sr">Na mesa agora: ${esc(nomes)}. </span><span aria-hidden="true">${agora.length} na mesa</span></span></div>`
      : '';
    const eu = PESSOAS[EU];
    return `<div class="lo-topo">
        <a class="lo-marca" href="#/campanhas" aria-label="Labirinto Lobby, suas mesas"><span class="lo-marca__nome">Labirinto</span><span class="lo-marca__lobby">Lobby</span></a>
        <nav class="lo-trilha" aria-label="Onde você está"><ol>${trilha.join('')}</ol></nav>
        <div class="lo-topo__direita">
          ${mini}
          <button type="button" class="lo-conta" popovertarget="menu-conta" aria-label="Conta de ${esc(eu.nome)} (${esc(eu.email)})">
            <span class="lo-av" data-tom="${eu.tom}" aria-hidden="true">${esc(eu.nome[0])}</span><span class="lo-conta__nome">${esc(eu.nome)}</span>
          </button>
          <div class="lo-menu" id="menu-conta" popover>
            <div class="lo-menu__quem"><span class="lo-av" data-tom="${eu.tom}" aria-hidden="true">${esc(eu.nome[0])}</span><div><p>${esc(eu.nome)}</p><p class="lo-menu__email">${esc(eu.email)}</p></div></div>
            <button type="button" class="lo-btn lo-btn--fantasma" data-acao="sair">${ic('sair')} Sair</button>
          </div>
        </div>
      </div>
      <div class="lo-faixa" id="faixa" role="status" aria-live="polite"></div>`;
  }

  function htmlFaixa() {
    const n = estado.pendentes.length;
    const nd = estado.decisoes.length;
    let estadoNome;
    let principal;
    let extra = '';
    if (nd) {
      estadoNome = 'decisao';
      const d = estado.decisoes[0];
      principal = `${ic('alerta')}<span>${nd} ${nd === 1 ? 'precisa' : 'precisam'} da sua decisão</span>`;
      extra = `<button type="button" class="lo-btn lo-faixa__acao" data-acao="ver-decisao" data-id="${d.id}">Ver</button>`;
      if (n) extra += `<span class="lo-faixa__extra">${estado.online ? `Enviando ${n}` : `Sem internet: ${n} esperando`}</span>`;
    } else if (!estado.online) {
      estadoNome = 'offline';
      principal = `${ic('sem-rede')}<span>${n ? `Sem internet: ${n} esperando` : 'Sem internet'}</span>`;
      extra = `<span class="lo-faixa__extra">${n ? (n === 1 ? 'Ela vai sozinha' : 'Elas vão sozinhas') + ' quando a conexão voltar. Mudanças novas ficam pausadas até lá.' : 'Mudanças novas ficam pausadas até a conexão voltar.'}</span>`;
    } else if (n) {
      estadoNome = 'enviando';
      principal = `<span class="lo-giro" aria-hidden="true"></span><span>Enviando ${n}</span>`;
    } else {
      estadoNome = 'salvo';
      principal = `${ic('visto')}<span>Salvo</span>`;
      extra = '<span class="lo-faixa__extra">Tudo o que você mudou está no servidor.</span>';
    }
    return { estadoNome, html: `<div class="lo-faixa__dentro"><p class="lo-faixa__principal">${principal}</p>${extra}</div>` };
  }

  /* ===================================================================
     RENDER — refaz a vista e devolve o foco (e o que estava sendo digitado)
     ao mesmo controle, pela chave data-k.
     =================================================================== */
  let ultimoGesto = 'ponteiro';
  document.addEventListener('pointerdown', () => { ultimoGesto = 'ponteiro'; }, true);
  document.addEventListener('keydown', () => { ultimoGesto = 'teclado'; }, true);
  function render() {
    const r = lerRota();
    const assinatura = JSON.stringify(r);
    const mudouRota = assinatura !== estado.rotaAntes;
    if (r.tela !== 'acesso' && !estado.sessao) estado.sessao = EU;
    document.body.dataset.tela = r.tela;

    const antes = estado.rotaAntesObj;
    // Trocar só de aba na mesma ficha: sem rolar ao topo e sem entrada animada (gesto frequente).
    const soAba = mudouRota && antes && antes.tela === 'ficha' && r.tela === 'ficha' && antes.ficha === r.ficha;

    const cabeca = $('#cabeca');
    if (mudouRota) {
      if (r.tela === 'acesso') { cabeca.hidden = true; cabeca.innerHTML = ''; }
      else if (!soAba) { cabeca.hidden = false; cabeca.innerHTML = htmlCabeca(r); estado.faixaAntes = ''; }
      if (estado.editando && !(r.tela === 'ficha' && r.ficha === estado.editando.fichaId)) estado.editando = null;
      estado.porItem = false;
      estado.confirmando = null;
      estado.erros = {};
      estado.digitado = {};
    }

    const vista = $('#vista');
    const ativo = document.activeElement;
    const naDoca = !!(ativo && ativo.closest && ativo.closest('#doca'));
    let chave = ativo && ativo.dataset && vista.contains(ativo) ? ativo.dataset.k : null;
    if (soAba && chave && chave.startsWith('aba|')) chave = `aba|${r.aba}`;
    if (estado.focarDepois) { chave = estado.focarDepois; estado.focarDepois = null; }
    const guardado = chave && ativo && 'value' in ativo && ativo.dataset.k === chave
      ? { valor: ativo.value, ini: ativo.selectionStart, fim: ativo.selectionEnd, sujo: ativo.dataset.sujo === '1' }
      : null;
    const tinhaFocoNaVista = !!(ativo && vista.contains(ativo) && ativo !== vista);

    let html = '';
    if (r.tela === 'acesso') html = telaAcesso(r);
    else if (r.tela === 'campanhas') html = telaCampanhas();
    else if (r.tela === 'campanha') html = telaCampanha(r);
    else html = telaFicha(r);
    vista.innerHTML = html;
    // A tela nova sobe 6 px só quando veio de clique ou toque; pelo teclado troca seco.
    vista.dataset.entrou = mudouRota && !soAba && ultimoGesto !== 'teclado' ? '1' : '0';

    let focou = false;
    if (chave && (!mudouRota || soAba)) {
      const novo = vista.querySelector(`[data-k="${CSS.escape(chave)}"]`);
      if (novo && !novo.disabled) {
        novo.focus({ preventScroll: true });
        focou = true;
        if (guardado && guardado.sujo && 'value' in novo) {
          novo.value = guardado.valor;
          novo.dataset.sujo = '1';
          try { novo.setSelectionRange(guardado.ini, guardado.fim); } catch (_) { /* campo sem seleção */ }
        }
      }
    }
    // O controle sumiu (item tirado, desfazer feito) ou ficou desligado: o foco vai para o painel, não para o topo.
    if (!focou && tinhaFocoNaVista && !mudouRota) {
      const reserva = vista.querySelector('#painel') || vista;
      reserva.focus({ preventScroll: true });
    }

    if (mudouRota) {
      estado.rotaAntes = assinatura;
      estado.rotaAntesObj = r;
      if (!soAba) {
        window.scrollTo({ top: 0 });
        if (!naDoca) vista.focus({ preventScroll: true });
      }
    }
    renderFaixa();
    renderDoca(r);
  }

  function renderFaixa() {
    const el = $('#faixa');
    if (!el) return;
    const { estadoNome, html } = htmlFaixa();
    const sig = estadoNome + html;
    if (sig === estado.faixaAntes) return;
    const vinhaEnviando = el.dataset.estado === 'enviando';
    el.dataset.estado = estadoNome;
    el.dataset.recem = vinhaEnviando && estadoNome === 'salvo' ? '1' : '0';
    el.innerHTML = html;
    estado.faixaAntes = sig;
  }

  function renderDoca(r) {
    let n = 1;
    if (r.tela === 'campanhas') n = 2;
    else if (r.tela === 'campanha') n = 3;
    else if (r.tela === 'ficha') n = r.aba === 'mochila' ? 7 : r.aba === 'historico' ? 6 : (estado.decisoes.length ? 5 : 4);
    document.querySelectorAll('[data-tela-pt]').forEach((b) => {
      if (Number(b.dataset.telaPt) === n) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
    });
    $('#pt-sims-sessao').hidden = r.tela === 'acesso';
    $('#pt-sims-acesso').hidden = r.tela !== 'acesso';
    $('#pt-rede').textContent = estado.online ? 'Cair a internet no meio do envio' : 'Voltar a internet';
  }

  function atualizar() {
    render();
    agendarFimDosDestaques();
  }

  let fimDestaque = 0;
  function agendarFimDosDestaques() {
    const vivos = Object.values(estado.destaques).filter((t) => Date.now() - t < 1600);
    if (!vivos.length) return;
    clearTimeout(fimDestaque);
    fimDestaque = setTimeout(() => render(), 1650);
  }

  /* ---- notificações */
  function torrada(texto, acao) {
    const caixa = $('#torradas');
    const el = document.createElement('div');
    el.className = 'lo-torrada';
    el.innerHTML = `<p>${esc(texto)}</p>${acao ? `<button type="button" class="lo-btn">${esc(acao.rotulo)}</button>` : ''}<button type="button" class="lo-btn lo-btn--fantasma lo-btn--icone" aria-label="Fechar aviso">${ic('fechar')}</button>`;
    const botoes = el.querySelectorAll('button');
    let timer;
    const sair = () => {
      clearTimeout(timer);
      el.dataset.saindo = '1';
      setTimeout(() => el.remove(), 170);
    };
    const armar = () => { clearTimeout(timer); timer = setTimeout(sair, 5000); };
    if (acao) botoes[0].addEventListener('click', () => { sair(); acao.acao(); });
    botoes[botoes.length - 1].addEventListener('click', sair);
    el.addEventListener('pointerenter', () => clearTimeout(timer));
    el.addEventListener('pointerleave', armar);
    el.addEventListener('focusin', () => clearTimeout(timer));
    el.addEventListener('focusout', armar);
    caixa.appendChild(el);
    while (caixa.children.length > 3) caixa.firstElementChild.remove();
    armar();
  }

  /* ===================================================================
     SIMULAÇÕES DO PROTÓTIPO
     =================================================================== */
  function irParaSora(aba) {
    const r = lerRota();
    const manter = r.tela === 'ficha' && r.ficha === 'sora' ? r.aba : 'ficha';
    estado.sessao = EU;
    ir(hashDaFicha('sora', aba || manter));
  }

  function simVida() {
    irParaSora();
    if (!estado.online) { torrada('Sem internet: mudanças novas ficam pausadas. Use Voltar a internet.'); return; }
    if (estado.decisoes.some((d) => d.campo === 'vida')) { torrada('Primeiro escolha no aviso qual Vida fica.'); return; }
    const f = FICHAS.sora;
    mudarNumero('sora', 'vida', 'Vida', f.vida.atual > 0 ? f.vida.atual - 1 : 1);
  }

  function simRede() {
    if (estado.online) {
      irParaSora();
      // Cai no meio do envio: as duas mudanças feitas logo antes ficam sem resposta.
      if (estado.pendentes.length === 0) {
        const f = FICHAS.sora;
        enviar({ fichaId: 'sora', tipo: 'definir', campo: 'vida', rotulo: 'Vida', de: f.vida.atual, para: Math.max(0, f.vida.atual - 2) }, { semAck: true });
        const pao = f.mochila.find((i) => i.id === 'i3');
        if (pao) enviar({ fichaId: 'sora', tipo: 'somar', campo: 'item:i3:qtd', rotulo: pao.nome, delta: -1, de: pao.qtd, para: pao.qtd - 1 }, { semAck: true });
        else enviar({ fichaId: 'sora', tipo: 'definir', campo: 'energia', rotulo: 'Energia', de: f.energia.atual, para: Math.max(0, f.energia.atual - 1) }, { semAck: true });
      }
      estado.pendentes.forEach((p) => clearTimeout(p.timer));
      estado.online = false;
    } else {
      estado.online = true;
      estado.pendentes.forEach((p, i) => agendarAck(p, 700 + i * 380));
    }
    atualizar();
  }

  function simMestre() {
    estado.sessao = EU;
    irParaSora('ficha');
    if (!estado.online) { torrada('Simulação: volte a internet primeiro (o conflito chega pelo servidor).'); return; }
    if (estado.decisoes.length) { focarDecisao(estado.decisoes[0].id); return; }
    const f = FICHAS.sora;
    const antes = f.vida.atual;
    const meu = antes === 22 ? 21 : 22;
    const doMestre = antes === 25 ? 26 : 25;
    // O jogador põe 22; o mestre já tinha gravado 25 no servidor um instante antes.
    const op = enviar({ fichaId: 'sora', tipo: 'definir', campo: 'vida', rotulo: 'Vida', de: antes, para: meu }, { semAck: true });
    if (!op) return;
    setTimeout(() => {
      const i = estado.pendentes.indexOf(op);
      if (i >= 0) estado.pendentes.splice(i, 1);
      f.vida.atual = doMestre;
      HISTORICO.push({ id: novoId('h'), fichaId: 'sora', autor: 'rafa', tipo: 'definir', campo: 'vida', rotulo: 'Vida', de: antes, para: doMestre, quando: Date.now() });
      estado.destaques['sora|vida'] = Date.now();
      estado.decisoes.push({ id: novoId('d'), fichaId: 'sora', campo: 'vida', rotulo: 'Vida', meu, doMestre, quem: 'rafa', quando: Date.now() });
      atualizar();
    }, 900);
  }

  function simDesfazer() {
    const meus = HISTORICO.filter((e) => e.autor === EU && e.fichaId === 'sora' && !desfeita(e)).sort((a, b) => b.quando - a.quando);
    irParaSora('historico');
    if (!meus.length) { torrada('Você ainda não mudou nada nesta ficha.'); return; }
    pedirDesfazer(meus[0].id);
  }

  function focarDecisao(id) {
    const d = estado.decisoes.find((x) => x.id === id);
    if (!d) return;
    const r = lerRota();
    if (!(r.tela === 'ficha' && r.ficha === d.fichaId)) ir(hashDaFicha(d.fichaId));
    requestAnimationFrame(() => {
      const el = document.getElementById(`conflito-${id}`);
      if (el) { el.scrollIntoView({ block: 'center' }); el.focus({ preventScroll: true }); }
    });
  }

  /* ===================================================================
     EVENTOS (delegados)
     =================================================================== */
  function confirmarNumero(input) {
    const { ficha, campo, rotulo } = input.dataset;
    const k = `${ficha}|${campo}`;
    const min = Number(input.dataset.min);
    const max = Number(input.dataset.max);
    const texto = input.value.trim();
    const n = /^[0-9]+$/.test(texto) ? Number(texto) : NaN;
    if (Number.isNaN(n) || n < min || n > max) {
      // O que foi digitado fica no campo (continua "sujo"), com o motivo embaixo.
      estado.erros[k] = `Use só números, de ${fmtNum(min)} a ${fmtNum(max)}.`;
      estado.digitado[k] = input.value;
      atualizar();
      return;
    }
    input.dataset.sujo = '0';
    delete estado.erros[k];
    delete estado.digitado[k];
    const f = FICHAS[ficha];
    if (campo === 'moedas') { const delta = n - f.moedas; if (delta) somarMoedas(ficha, delta); else atualizar(); return; }
    if (n === ler(f, campo)) { atualizar(); return; }
    mudarNumero(ficha, campo, rotulo, n);
  }

  document.addEventListener('click', (ev) => {
    const alvo = ev.target.closest('[data-acao]');
    if (!alvo) return;
    const a = alvo.dataset.acao;
    const d = alvo.dataset;
    switch (a) {
      case 'doca': {
        const doca = $('#doca');
        const aberta = doca.dataset.aberta !== '1';
        doca.dataset.aberta = aberta ? '1' : '0';
        alvo.textContent = aberta ? 'Esconder' : 'Abrir';
        alvo.setAttribute('aria-expanded', String(aberta));
        break;
      }
      case 'entrar-convidada': estado.sessao = EU; ir('#/campanhas'); break;
      case 'entrar-sem-convite': estado.sessao = null; ir('#/entrar/sem-convite'); break;
      case 'outra-conta': ir('#/entrar'); break;
      case 'copiar-email': {
        const ok = () => torrada('E-mail copiado. Mande para o mestre.');
        if (navigator.clipboard) navigator.clipboard.writeText(VISITANTE).then(ok, () => torrada(`Não deu para copiar. O e-mail é ${VISITANTE}.`));
        else torrada(`O e-mail é ${VISITANTE}.`);
        break;
      }
      case 'sair': {
        const menu = $('#menu-conta');
        if (menu && menu.hidePopover) { try { menu.hidePopover(); } catch (_) { /* já fechado */ } }
        estado.sessao = null;
        ir('#/entrar');
        break;
      }
      case 'passo': {
        const f = FICHAS[d.ficha];
        const atual = ler(f, d.campo);
        delete estado.erros[`${d.ficha}|${d.campo}`];
        delete estado.digitado[`${d.ficha}|${d.campo}`];
        mudarNumero(d.ficha, d.campo, d.rotulo, Math.max(0, atual + Number(d.delta)));
        break;
      }
      case 'moedas': delete estado.erros[`${d.ficha}|moedas`]; delete estado.digitado[`${d.ficha}|moedas`]; somarMoedas(d.ficha, Number(d.delta)); break;
      case 'item': somarItem(d.ficha, d.item, Number(d.delta)); break;
      case 'abrir-por':
        estado.porItem = true; delete estado.erros.por; atualizar();
        requestAnimationFrame(() => { const i = $('#por-nome'); if (i) i.focus(); });
        break;
      case 'fechar-por': estado.porItem = false; delete estado.erros.por; atualizar(); break;
      case 'editar': {
        const f = FICHAS[lerRota().ficha];
        estado.editando = { fichaId: f.id, rascunho: Object.fromEntries(f.habilidades.map((h) => [h.id, { nome: h.nome, desc: h.desc }])) };
        atualizar();
        requestAnimationFrame(() => { const i = $('[data-ed]'); if (i) i.focus(); });
        break;
      }
      case 'cancelar-edicao': estado.editando = null; atualizar(); break;
      case 'salvar-edicao': {
        const ed = estado.editando;
        const f = FICHAS[ed.fichaId];
        const mudancas = [];
        for (const h of f.habilidades) {
          const r = ed.rascunho[h.id];
          if (r.nome.trim() && r.nome !== h.nome) mudancas.push({ campo: `hab:${h.id}:nome`, rotulo: 'o nome da habilidade', de: h.nome, para: r.nome.trim() });
          if (r.desc !== h.desc) mudancas.push({ campo: `hab:${h.id}:desc`, rotulo: `a descrição de ${h.nome}`, de: h.desc, para: r.desc });
        }
        estado.editando = null;
        if (!mudancas.length) { torrada('Nada mudou na ficha.'); atualizar(); break; }
        mudancas.forEach((m) => enviar({ fichaId: f.id, tipo: 'definir', ...m }));
        break;
      }
      case 'desfazer': pedirDesfazer(d.id); break;
      case 'confirmar-desfazer': pedirDesfazer(d.id, true); break;
      case 'cancelar-desfazer': estado.confirmando = null; atualizar(); break;
      case 'ficar-mestre': {
        const dd = estado.decisoes.find((x) => x.id === d.id);
        estado.decisoes = estado.decisoes.filter((x) => x.id !== d.id);
        torrada(`Ficou ${dd.doMestre}, como o mestre pôs.`);
        atualizar();
        break;
      }
      case 'usar-minha': {
        const dd = estado.decisoes.find((x) => x.id === d.id);
        estado.decisoes = estado.decisoes.filter((x) => x.id !== d.id);
        mudarNumero(dd.fichaId, dd.campo, dd.rotulo, dd.meu);
        break;
      }
      case 'ver-decisao': focarDecisao(d.id); break;
      case 'sim-vida': simVida(); break;
      case 'sim-rede': simRede(); break;
      case 'sim-mestre': simMestre(); break;
      case 'sim-desfazer': simDesfazer(); break;
      default: break;
    }
  });

  document.addEventListener('input', (ev) => {
    const el = ev.target;
    if (el.matches('.lo-numero')) el.dataset.sujo = '1';
    if (el.dataset.ed && estado.editando) {
      const [hid, campo] = el.dataset.ed.split(':');
      estado.editando.rascunho[hid][campo] = el.value;
    }
  });

  document.addEventListener('change', (ev) => {
    if (ev.target.matches('.lo-numero') && ev.target.dataset.sujo === '1') confirmarNumero(ev.target);
  });

  document.addEventListener('keydown', (ev) => {
    const el = ev.target;
    if (el.matches && el.matches('.lo-numero')) {
      if (ev.key === 'Enter') { ev.preventDefault(); if (el.dataset.sujo === '1') confirmarNumero(el); }
      if (ev.key === 'Escape') {
        el.dataset.sujo = '0';
        delete estado.erros[`${el.dataset.ficha}|${el.dataset.campo}`];
        delete estado.digitado[`${el.dataset.ficha}|${el.dataset.campo}`];
        el.value = ler(FICHAS[el.dataset.ficha], el.dataset.campo);
        el.select();
        atualizar();
      }
      if (ev.key === 'ArrowUp' || ev.key === 'ArrowDown') {
        ev.preventDefault();
        const f = FICHAS[el.dataset.ficha];
        const delta = ev.key === 'ArrowUp' ? 1 : -1;
        el.dataset.sujo = '0';
        delete estado.erros[`${el.dataset.ficha}|${el.dataset.campo}`];
        delete estado.digitado[`${el.dataset.ficha}|${el.dataset.campo}`];
        if (el.dataset.campo === 'moedas') somarMoedas(f.id, delta);
        else mudarNumero(f.id, el.dataset.campo, el.dataset.rotulo, Math.max(0, ler(f, el.dataset.campo) + delta));
      }
      return;
    }
    if (ev.key === 'Escape') {
      if (estado.porItem && el.closest && el.closest('.lo-por')) { estado.porItem = false; atualizar(); $('[data-acao="abrir-por"]')?.focus(); return; }
      if (estado.editando && el.closest && el.closest('.lo-painel')) { estado.editando = null; atualizar(); $('[data-acao="editar"]')?.focus(); return; }
      if (estado.confirmando) { const id = estado.confirmando; estado.confirmando = null; atualizar(); $(`[data-acao="desfazer"][data-id="${id}"]`)?.focus(); return; }
    }
    // Abas: setas, Home e End trocam de aba (a troca pelo teclado não anima nada).
    if (el.matches && el.matches('[role="tab"]')) {
      const abas = [...document.querySelectorAll('[role="tab"]')];
      const i = abas.indexOf(el);
      let j = -1;
      if (ev.key === 'ArrowRight') j = (i + 1) % abas.length;
      if (ev.key === 'ArrowLeft') j = (i - 1 + abas.length) % abas.length;
      if (ev.key === 'Home') j = 0;
      if (ev.key === 'End') j = abas.length - 1;
      if (j >= 0) {
        ev.preventDefault();
        estado.focarDepois = abas[j].dataset.k;
        ir(abas[j].getAttribute('href'));
      }
      if (ev.key === ' ') { ev.preventDefault(); el.click(); }
    }
  });

  document.addEventListener('submit', (ev) => {
    const form = ev.target.closest('[data-acao-form="por-item"]');
    if (!form) return;
    ev.preventDefault();
    const nome = form.nome.value.trim();
    const qtd = Number(form.qtd.value.trim());
    if (!nome) { estado.erros.por = 'Dê um nome ao item.'; atualizar(); $('#por-nome')?.focus(); return; }
    if (!Number.isInteger(qtd) || qtd < 1 || qtd > 999) { estado.erros.por = 'Quantidade de 1 a 999.'; atualizar(); $('#por-qtd')?.focus(); return; }
    const f = FICHAS[form.dataset.ficha];
    const item = { id: novoId('i'), nome, qtd, desc: 'Posto pelo site.', tom: f.mochila.length % 5 };
    estado.porItem = false;
    delete estado.erros.por;
    enviar({ fichaId: f.id, tipo: 'criar', campo: `item:${item.id}`, rotulo: nome, item, aumento: true });
  });

  // Com mudança a caminho, fechar a aba pergunta antes (plano 5.6).
  window.addEventListener('beforeunload', (ev) => {
    if (estado.pendentes.length) { ev.preventDefault(); ev.returnValue = ''; }
  });

  window.addEventListener('hashchange', () => { if (JSON.stringify(lerRota()) !== estado.rotaAntes) render(); });
  setInterval(() => { if (!document.activeElement || !document.activeElement.matches('input, textarea')) render(); }, 30000);

  // No celular a doca começa fechada, para não cobrir a tela.
  if (window.matchMedia('(max-width: 720px)').matches) {
    $('#doca').dataset.aberta = '0';
    const b = $('[data-acao="doca"]');
    b.textContent = 'Abrir';
    b.setAttribute('aria-expanded', 'false');
  }

  render();
})();
</script>
</body>
</html>
