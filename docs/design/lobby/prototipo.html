<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Lobby do Labirinto</title>
<!-- Opcional: só serve fora do Windows (celular, Mac). No Windows valem Sitka e Bahnschrift, as mesmas do app. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Spectral:wght@400;500&display=swap">
<style>
/* =====================================================================
   LOBBY DO LABIRINTO — protótipo da v1 (fatia S0 do plano
   docs/planos/lobby-jogadores-2026-11-05.md). Só dados inventados.

   Tokens: copiados de client/src/theme.ts com os mesmos nomes --lb-*.
   O app tem um tema só, escuro; o site segue. A única diferença: depois
   das fontes do Windows entra uma fonte web de reserva (Spectral no lugar
   da Sitka, Barlow Semi Condensed no lugar da Bahnschrift), porque o
   jogador abre o site no celular, onde as fontes do Windows não existem.

   Materiais: o lobby é pedra e tinta (as telas de pasta e a tela inicial);
   a ficha é o papel do grimório (o mesmo da ficha do jogador no app,
   client/src/player/PlayerFicha.css). Abrir a ficha = abrir o livro.
   ===================================================================== */
:root {
  color-scheme: dark;
  --lb-color-ink: #121214;
  --lb-color-stone-solid: #1a1a1e;
  --lb-color-stone-raised: #232328;
  --lb-color-stone-hover: #2c2c33;
  --lb-color-stone-sunken: #141417;
  --lb-color-line: rgba(255, 255, 255, 0.08);
  --lb-color-line-strong: rgba(255, 255, 255, 0.16);
  --lb-color-line-panel: rgba(255, 255, 255, 0.13);
  --lb-color-parchment: #eceae4;
  --lb-color-parchment-dim: #a2a09a;
  --lb-color-parchment-faint: #858480;
  --lb-color-brass: #e0a44a;
  --lb-color-brass-bright: #f3ba66;
  --lb-color-brass-soft: rgba(224, 164, 74, 0.14);
  --lb-color-brass-contrast: #1c1608;
  --lb-color-ember: #e2645a;
  --lb-color-ember-soft: rgba(226, 100, 90, 0.14);
  --lb-color-online: #7fb48a;
  --lb-color-online-soft: rgba(127, 180, 138, 0.14);
  --lb-color-tide: #79a9cc;
  --lb-color-tide-soft: rgba(121, 169, 204, 0.14);
  --lb-color-arcane: #ab93d6;
  --lb-color-arcane-soft: rgba(171, 147, 214, 0.15);

  --lb-font-display: 'Sitka Banner', 'Sitka Display', Sitka, Constantia, 'Spectral', Georgia, 'Times New Roman', serif;
  --lb-font-sans: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
  --lb-font-utility: 'Bahnschrift', 'DIN Alternate', 'Barlow Semi Condensed', 'Segoe UI Variable Small', 'Segoe UI', system-ui, sans-serif;
  --lb-font-size-xs: 10.5px;
  --lb-font-size-sm: 11.5px;
  --lb-font-size-md: 13px;
  --lb-font-size-lg: 15px;
  --lb-font-size-xl: 20px;
  --lb-font-size-xxl: 34px;
  --lb-font-weight-regular: 400;
  --lb-font-weight-medium: 500;
  --lb-font-weight-semibold: 600;
  --lb-font-tracking-wide: 0.06em;
  --lb-font-tracking-wider: 0.14em;
  --lb-font-leading-tight: 1.2;
  --lb-font-leading-normal: 1.45;

  --lb-space-1: 4px;
  --lb-space-2: 8px;
  --lb-space-3: 12px;
  --lb-space-4: 16px;
  --lb-space-5: 20px;
  --lb-space-6: 24px;
  --lb-space-8: 32px;
  --lb-space-10: 40px;
  --lb-space-12: 48px;
  --lb-control-gap: 8px;
  --lb-control-touch: 44px;
  --lb-radius-sm: 6px;
  --lb-radius-md: 9px;
  --lb-radius-lg: 14px;
  --lb-radius-xl: 20px;
  --lb-radius-full: 999px;
  --lb-shadow-md: 0 6px 16px rgba(0, 0, 0, 0.34), 0 1px 2px rgba(0, 0, 0, 0.4);
  --lb-shadow-lg: 0 18px 44px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.34);
  --lb-shadow-float: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 14px rgba(0, 0, 0, 0.44), 0 20px 46px rgba(0, 0, 0, 0.55);
  --lb-shadow-bevel: inset 0 1px 0 rgba(255, 255, 255, 0.07);
  --lb-motion-fast: 110ms;
  --lb-motion-base: 170ms;
  --lb-motion-ease: cubic-bezier(0.2, 0.8, 0.2, 1);

  /* Grimório: o papel da ficha. */
  --lb-gr-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --lb-gr-papel-alto: #1b1711;
  --lb-gr-papel-baixo: #13100c;
  --lb-gr-cartao: #211c15;
  --lb-gr-cartao-alto: #29231a;
  --lb-gr-campo: #15120e;
  --lb-gr-filete: rgba(236, 234, 228, 0.09);
  --lb-gr-filete-forte: rgba(236, 234, 228, 0.16);
  --lb-gr-filete-latao: rgba(224, 164, 74, 0.26);
  --lb-gr-gravado: #c8b089;
  --lb-gr-hover: rgba(255, 236, 200, 0.06);

  /* Só do lobby: medidas da página e do alvo de clique. */
  --lo-largura: 1180px;
  --lo-margem: clamp(16px, 3.2vw, 32px);
  --lo-alvo: 36px;
  /* A cor do sistema One Piece (client/src/lib/sistemaOnePiece.ts: cor) tinge o cartão da campanha. */
  --lo-cor-sistema: #b4493c;
}

/* Dedo: todo alvo sobe para 44 px. */
@media (pointer: coarse) {
  :root { --lo-alvo: 44px; }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--lb-color-ink);
  color: var(--lb-color-parchment);
  font-family: var(--lb-font-sans);
  font-size: var(--lb-font-size-md);
  line-height: var(--lb-font-leading-normal);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* O ambiente da tela inicial do app (MainMenu.css): grade de mapa e o halo do lampião.
   Fixos, atrás de tudo, sem alargar a rolagem. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -2;
  background-image:
    linear-gradient(var(--lb-color-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--lb-color-line) 1px, transparent 1px);
  background-size: 64px 64px;
  opacity: 0.22;
  mask-image: radial-gradient(ellipse 80% 60% at 70% 0%, #000 0%, transparent 100%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 70% 0%, #000 0%, transparent 100%);
  pointer-events: none;
}

body::after {
  content: '';
  position: fixed;
  left: 78%;
  top: -10%;
  z-index: -1;
  width: 900px;
  height: 900px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle at center, rgba(224, 164, 74, 0.1) 0%, rgba(224, 164, 74, 0.03) 40%, transparent 68%);
  pointer-events: none;
}

body[data-tela='acesso']::before { opacity: 0.4; mask-image: radial-gradient(ellipse 75% 70% at 65% 45%, #000 0%, transparent 100%); -webkit-mask-image: radial-gradient(ellipse 75% 70% at 65% 45%, #000 0%, transparent 100%); }
body[data-tela='acesso']::after { left: 70%; top: 44%; background: radial-gradient(circle at center, rgba(224, 164, 74, 0.16) 0%, rgba(224, 164, 74, 0.05) 38%, transparent 68%); }

button, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
img, svg { display: block; }
h1, h2, h3, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }

:focus-visible {
  outline: 2px solid var(--lb-color-brass);
  outline-offset: 2px;
}

.lo-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.lo-ic {
  width: 16px;
  height: 16px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ------------------------------------------------------------- botões */

.lo-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--lb-space-2);
  min-height: var(--lo-alvo);
  margin: 0;
  padding: 0 14px;
  border: 1px solid var(--lb-color-line-strong);
  border-radius: var(--lb-radius-md);
  background: var(--lb-color-stone-raised);
  color: var(--lb-color-parchment);
  font-size: var(--lb-font-size-md);
  font-weight: var(--lb-font-weight-medium);
  line-height: 1.2;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  transition:
    background-color var(--lb-motion-fast) ease,
    border-color var(--lb-motion-fast) ease,
    color var(--lb-motion-fast) ease,
    transform 120ms var(--lb-gr-ease-out);
}

.lo-btn:active:not(:disabled) { transform: scale(0.97); }

.lo-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.lo-btn--primario {
  border-color: var(--lb-color-brass);
  background: var(--lb-color-brass);
  color: var(--lb-color-brass-contrast);
  font-weight: var(--lb-font-weight-semibold);
}

.lo-btn--fantasma {
  border-color: transparent;
  background: transparent;
  color: var(--lb-color-parchment-dim);
}

.lo-btn--grande {
  min-height: 46px;
  padding: 0 20px;
  font-size: var(--lb-font-size-lg);
}

.lo-btn--icone {
  width: var(--lo-alvo);
  padding: 0;
}

@media (hover: hover) and (pointer: fine) {
  .lo-btn:hover:not(:disabled) { background: var(--lb-color-stone-hover); border-color: var(--lb-color-parchment-faint); }
  .lo-btn--primario:hover:not(:disabled) { background: var(--lb-color-brass-bright); border-color: var(--lb-color-brass-bright); }
  .lo-btn--fantasma:hover:not(:disabled) { background: var(--lb-gr-hover); border-color: transparent; color: var(--lb-color-parchment); }
}

.lo-voltar {
  display: inline-flex;
  align-items: center;
  gap: var(--lb-space-1);
  min-height: 32px;
  margin-left: -6px;
  padding: 0 8px 0 4px;
  border-radius: var(--lb-radius-sm);
  color: var(--lb-color-parchment-dim);
  font-size: var(--lb-font-size-md);
  text-decoration: none;
  transition: color var(--lb-motion-fast) ease;
}

@media (hover: hover) and (pointer: fine) {
  .lo-voltar:hover { color: var(--lb-color-parchment); }
}

/* --------------------------------------------- retrato, avatar, marcas */

/* Sem foto, como no app: as iniciais na serifa sobre um tom estável. */
.lo-retrato {
  position: relative;
  display: grid;
  place-items: center;
  flex: none;
  width: 56px;
  aspect-ratio: 1;
  border-radius: var(--lb-radius-md);
  background: var(--lb-color-brass-soft);
  color: var(--lb-color-brass-bright);
  font-family: var(--lb-font-display);
  font-size: 22px;
  line-height: 1;
  user-select: none;
}

.lo-retrato--p { width: 32px; border-radius: var(--lb-radius-sm); font-size: 13px; }
.lo-retrato--g { width: 112px; border-radius: var(--lb-radius-lg); font-size: 44px; }
.lo-retrato--xg { width: 100%; max-width: 220px; border-radius: var(--lb-radius-lg); font-size: 64px; }

[data-tom='1'] { --tom: var(--lb-color-ember); --tom-fundo: var(--lb-color-ember-soft); }
[data-tom='2'] { --tom: var(--lb-color-tide); --tom-fundo: var(--lb-color-tide-soft); }
[data-tom='3'] { --tom: var(--lb-color-arcane); --tom-fundo: var(--lb-color-arcane-soft); }
[data-tom='4'] { --tom: var(--lb-color-online); --tom-fundo: var(--lb-color-online-soft); }
[data-tom='0'] { --tom: var(--lb-color-brass-bright); --tom-fundo: var(--lb-color-brass-soft); }
.lo-retrato[data-tom], .lo-av[data-tom], .lo-vaga[data-tom] { color: var(--tom); background: var(--tom-fundo); }

.lo-av {
  position: relative;
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font-size: var(--lb-font-size-sm);
  font-weight: var(--lb-font-weight-semibold);
  line-height: 1;
  user-select: none;
}

/* Ponto de presença: verde-musgo do app ("online"), sempre com texto ao lado ou no rótulo. */
.lo-ponto {
  display: inline-block;
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--lb-color-online);
  box-shadow: 0 0 0 3px var(--lb-color-online-soft);
}

.lo-av > .lo-ponto,
.lo-retrato > .lo-ponto {
  position: absolute;
  right: -2px;
  bottom: -2px;
  box-shadow: 0 0 0 2px var(--lb-color-ink);
}

.lo-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border: 1px solid var(--lb-color-line-strong);
  border-radius: var(--lb-radius-full);
  color: var(--lb-color-parchment-dim);
  font-size: var(--lb-font-size-sm);
  font-weight: var(--lb-font-weight-medium);
  line-height: 1.5;
  white-space: nowrap;
}

.lo-tag .lo-ic { width: 13px; height: 13px; }
.lo-tag--sua { border-color: var(--lb-color-brass); background: var(--lb-color-brass); color: var(--lb-color-brass-contrast); }
.lo-tag--latao { border-color: var(--lb-gr-filete-latao); background: var(--lb-color-brass-soft); color: var(--lb-color-brass-bright); }
.lo-tag--brasa { border-color: transparent; background: var(--lb-color-ember-soft); color: var(--lb-color-ember); }
.lo-tag--mare { border-color: transparent; background: var(--lb-color-tide-soft); color: var(--lb-color-tide); }
.lo-tag--online { border-color: transparent; padding: 0 6px; background: var(--lb-color-online-soft); color: var(--lb-color-online); }

/* ----------------------------------------------- cabeça fixa e faixa */

.lo-cabeca {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(18, 18, 20, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--lb-color-line);
}

.lo-cabeca[hidden] { display: none; }

.lo-topo {
  display: flex;
  align-items: center;
  gap: var(--lb-space-4);
  width: min(var(--lo-largura), calc(100% - 2 * var(--lo-margem)));
  min-height: 56px;
  margin-inline: auto;
}

.lo-marca {
  display: inline-flex;
  align-items: baseline;
  gap: 7px;
  flex: none;
  padding: 4px 2px;
  border-radius: var(--lb-radius-sm);
  text-decoration: none;
}

.lo-marca__nome {
  font-family: var(--lb-font-display);
  font-size: 21px;
  line-height: 1;
  color: var(--lb-color-parchment);
}

.lo-marca__lobby {
  font-family: var(--lb-font-utility);
  font-size: var(--lb-font-size-sm);
  letter-spacing: var(--lb-font-tracking-wider);
  text-transform: uppercase;
  color: var(--lb-color-brass);
}

.lo-trilha {
  min-width: 0;
  flex: 1;
}

.lo-trilha ol {
  display: flex;
  align-items: center;
  min-width: 0;
  color: var(--lb-color-parchment-faint);
}

.lo-trilha li {
  display: flex;
  align-items: center;
  min-width: 0;
}

.lo-trilha li + li::before {
  content: '/';
  margin: 0 10px;
  color: var(--lb-color-line-strong);
}

.lo-trilha a,
.lo-trilha span {
  overflow: hidden;
  padding: 4px 2px;
  border-radius: var(--lb-radius-sm);
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.lo-trilha a { color: var(--lb-color-parchment-dim); }
.lo-trilha [aria-current='page'] { color: var(--lb-color-parchment); }

@media (hover: hover) and (pointer: fine) {
  .lo-trilha a:hover { color: var(--lb-color-parchment); }
}

.lo-topo__direita {
  display: flex;
  align-items: center;
  gap: var(--lb-space-3);
  margin-left: auto;
  flex: none;
}

.lo-agora-mini {
  display: flex;
  align-items: center;
  gap: var(--lb-space-2);
  color: var(--lb-color-parchment-dim);
  font-size: var(--lb-font-size-sm);
}

.lo-agora-mini__rostos { display: flex; }
.lo-agora-mini__rostos .lo-av { width: 24px; height: 24px; font-size: var(--lb-font-size-xs); box-shadow: 0 0 0 2px var(--lb-color-ink); }
.lo-agora-mini__rostos .lo-av + .lo-av { margin-left: -6px; }

.lo-conta {
  display: inline-flex;
  align-items: center;
  gap: var(--lb-space-2);
  min-height: var(--lo-alvo);
  padding: 0 10px 0 4px;
  border: 1px solid var(--lb-color-line);
  border-radius: var(--lb-radius-full);
  background: var(--lb-color-stone-solid);
  cursor: pointer;
  transition: border-color var(--lb-motion-fast) ease, transform 120ms var(--lb-gr-ease-out);
}

.lo-conta:active { transform: scale(0.97); }

@media (hover: hover) and (pointer: fine) {
  .lo-conta:hover { border-color: var(--lb-color-line-strong); }
}

/* O menu da conta: popover nativo (Esc e clique fora fecham sozinhos), cresce do canto do botão. */
.lo-menu {
  position: fixed;
  inset: 60px var(--lo-margem) auto auto;
  width: 260px;
  margin: 0;
  padding: var(--lb-space-2);
  border: 1px solid var(--lb-color-line-panel);
  border-radius: var(--lb-radius-lg);
  background: var(--lb-color-stone-solid);
  color: var(--lb-color-parchment);
  box-shadow: var(--lb-shadow-float);
  transform-origin: top right;
  transition:
    opacity 150ms var(--lb-gr-ease-out),
    transform 150ms var(--lb-gr-ease-out),
    overlay 150ms allow-discrete,
    display 150ms allow-discrete;
}

.lo-menu:not(:popover-open) { opacity: 0; transform: scale(0.96) translateY(-4px); }

@starting-style {
  .lo-menu:popover-open { opacity: 0; transform: scale(0.96) translateY(-4px); }
}

.lo-menu__quem {
  display: flex;
  align-items: center;
  gap: var(--lb-space-3);
  padding: var(--lb-space-2) var(--lb-space-2) var(--lb-space-3);
  border-bottom: 1px solid var(--lb-color-line);
  margin-bottom: var(--lb-space-1);
}

.lo-menu__quem p { overflow-wrap: anywhere; }
.lo-menu__email { color: var(--lb-color-parchment-dim); font-size: var(--lb-font-size-sm); }
.lo-menu .lo-btn { width: 100%; justify-content: flex-start; }

/* A FAIXA DE ESTADO: em toda tela com sessão, colada sob o topo.
   Quatro estados, do mais importante ao mais calmo: decisão, sem internet,
   enviando, salvo. "Salvo" só aparece depois que o servidor confirma. */
.lo-faixa {
  border-top: 1px solid var(--lb-color-line);
  transition: background-color 180ms ease;
}

.lo-faixa[data-estado='decisao'] { background: rgba(226, 100, 90, 0.12); }
.lo-faixa[data-estado='offline'] { background: rgba(121, 169, 204, 0.1); }

.lo-faixa__dentro {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px var(--lb-space-3);
  width: min(var(--lo-largura), calc(100% - 2 * var(--lo-margem)));
  min-height: 36px;
  margin-inline: auto;
  padding: 4px 0;
}

.lo-faixa__principal {
  display: inline-flex;
  align-items: center;
  gap: var(--lb-space-2);
  font-weight: var(--lb-font-weight-medium);
}

.lo-faixa__principal .lo-ic { width: 15px; height: 15px; }
.lo-faixa[data-estado='salvo'] .lo-faixa__principal { color: var(--lb-color-parchment-dim); }
.lo-faixa[data-estado='salvo'] .lo-ic { color: var(--lb-color-online); }
.lo-faixa[data-estado='offline'] .lo-ic { color: var(--lb-color-tide); }
.lo-faixa[data-estado='decisao'] .lo-ic { color: var(--lb-color-ember); }

/* O texto novo aparece em vez de trocar seco: 140 ms, só opacidade. */
.lo-faixa__principal > span {
  transition: opacity 140ms ease;
}

@starting-style {
  .lo-faixa__principal > span { opacity: 0; }
}

/* A confirmação do servidor: o visto assenta uma vez (raro o bastante para merecer). */
.lo-faixa[data-recem='1'] .lo-faixa__principal .lo-ic {
  animation: lo-assentar 260ms var(--lb-gr-ease-out);
}

@keyframes lo-assentar {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.lo-faixa__extra {
  color: var(--lb-color-parchment-dim);
  font-size: var(--lb-font-size-sm);
}

.lo-faixa__acao { min-height: 28px; padding: 0 10px; font-size: var(--lb-font-size-sm); }

.lo-giro {
  width: 13px;
  height: 13px;
  flex: none;
  border: 2px solid var(--lb-color-brass-soft);
  border-top-color: var(--lb-color-brass);
  border-radius: 50%;
  animation: lo-girar 700ms linear infinite;
}

@keyframes lo-girar { to { transform: rotate(360deg); } }

/* --------------------------------------------------------- páginas */

.lo-vista {
  outline: none;
}

.lo-vista[data-entrou='1'] > * {
  animation: lo-entrar 220ms var(--lb-gr-ease-out) backwards;
}

@keyframes lo-entrar {
  from { opacity: 0; transform: translateY(6px); }
}

.lo-pagina {
  width: min(var(--lo-largura), calc(100% - 2 * var(--lo-margem)));
  margin-inline: auto;
  padding: var(--lb-space-8) 0 160px;
}

.lo-cab-pag {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--lb-space-5) var(--lb-space-8);
  margin-bottom: var(--lb-space-8);
}

.lo-cab-pag__texto {
  display: flex;
  flex-direction: column;
  gap: var(--lb-space-2);
  min-width: 0;
  max-width: 64ch;
}

.lo-titulo {
  font-family: var(--lb-font-display);
  font-size: clamp(30px, 4.4vw, 44px);
  font-weight: var(--lb-font-weight-regular);
  line-height: 1.05;
  letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}

.lo-sub {
  color: var(--lb-color-parchment-dim);
  font-size: var(--lb-font-size-lg);
}

.lo-secao + .lo-secao { margin-top: var(--lb-space-10); }

.lo-secao__cab {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--lb-space-1) var(--lb-space-3);
  margin-bottom: var(--lb-space-4);
}

.lo-secao__titulo {
  font-family: var(--lb-font-display);
  font-size: var(--lb-font-size-xl);
  font-weight: var(--lb-font-weight-regular);
}

.lo-secao__nota { color: var(--lb-color-parchment-dim); }

/* ============================================ 1. SEM ACESSO */

.lo-entrada {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 420px);
  align-items: center;
  gap: clamp(32px, 6vw, 96px);
  width: min(var(--lo-largura), calc(100% - 2 * var(--lo-margem)));
  min-height: calc(100dvh - 40px);
  margin-inline: auto;
  padding: clamp(32px, 8vh, 96px) 0 140px;
}

.lo-entrada__marca {
  display: flex;
  flex-direction: column;
  gap: var(--lb-space-5);
}

.lo-entrada__lobby {
  font-family: var(--lb-font-utility);
  font-size: 13px;
  letter-spacing: var(--lb-font-tracking-wider);
  text-transform: uppercase;
  color: var(--lb-color-brass);
}

.lo-entrada__titulo {
  font-family: var(--lb-font-display);
  font-size: clamp(52px, 7.5vw, 104px);
  font-weight: var(--lb-font-weight-regular);
  line-height: 0.95;
  letter-spacing: -0.02em;
}

.lo-entrada__texto {
  max-width: 46ch;
  color: var(--lb-color-parchment-dim);
  font-size: 16px;
  line-height: 1.6;
}

/* A única entrada orquestrada do site: a primeira tela sobe em cascata, como a tela inicial do app. */
body[data-tela='acesso'] .lo-entrada__marca > *,
body[data-tela='acesso'] .lo-porta {
  animation: lo-subir 560ms var(--lb-gr-ease-out) backwards;
}

body[data-tela='acesso'] .lo-entrada__marca > :nth-child(2) { animation-delay: 60ms; }
body[data-tela='acesso'] .lo-entrada__marca > :nth-child(3) { animation-delay: 120ms; }
body[data-tela='acesso'] .lo-porta { animation-delay: 200ms; }

@keyframes lo-subir {
  from { opacity: 0; transform: translateY(10px); }
}

.lo-porta {
  display: flex;
  flex-direction: column;
  gap: var(--lb-space-4);
  padding: var(--lb-space-6);
  border: 1px solid var(--lb-color-line-panel);
  border-radius: var(--lb-radius-xl);
  background: rgba(26, 26, 30, 0.86);
  box-shadow: var(--lb-shadow-lg), var(--lb-shadow-bevel);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.lo-porta h2 {
  font-family: var(--lb-font-display);
  font-size: 26px;
  font-weight: var(--lb-font-weight-regular);
  line-height: 1.15;
}

.lo-porta p { color: var(--lb-color-parchment-dim); font-size: var(--lb-font-size-lg); line-height: 1.55; }
.lo-porta strong { color: var(--lb-color-parchment); font-weight: var(--lb-font-weight-medium); overflow-wrap: anywhere; }
.lo-porta .lo-btn--grande { width: 100%; }
.lo-porta__miuda { font-size: var(--lb-font-size-md) !important; color: var(--lb-color-parchment-faint) !important; }

.lo-porta__acoes {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lb-control-gap);
}

.lo-porta__sinal {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--lb-color-brass-soft);
  color: var(--lb-color-brass-bright);
}

.lo-porta__sinal .lo-ic { width: 22px; height: 22px; }

/* ============================================ 2. MINHAS CAMPANHAS */

.lo-mesas {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
  gap: var(--lb-space-4);
}

/* O cartão da mesa: o grupo de rostos no alto (quem joga), o nome na serifa, três fatos.
   A cor do sistema tinge só o canto, como luz vinda de fora. */
.lo-mesa {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--lb-space-4);
  min-width: 0;
  padding: var(--lb-space-5);
  border: 1px solid var(--lb-color-line);
  border-radius: var(--lb-radius-xl);
  background:
    radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--lo-cor-sistema) 16%, transparent) 0%, transparent 55%),
    var(--lb-color-stone-solid);
  box-shadow: var(--lb-shadow-bevel);
  color: inherit;
  text-decoration: none;
  transition: border-color var(--lb-motion-base) ease, transform 140ms var(--lb-gr-ease-out);
}

.lo-mesa:active { transform: scale(0.99); }

@media (hover: hover) and (pointer: fine) {
  .lo-mesa:hover { border-color: var(--lb-color-line-strong); }
  .lo-mesa:hover .lo-mesa__ir { color: var(--lb-color-brass-bright); }
}

.lo-mesa__topo {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--lb-space-3);
}

.lo-grupo { display: flex; }
.lo-grupo .lo-retrato { width: 40px; border-radius: 50%; font-size: 15px; box-shadow: 0 0 0 3px var(--lb-color-stone-solid); }
.lo-grupo .lo-retrato + .lo-retrato { margin-left: -9px; }
.lo-grupo .lo-retrato[data-seu='1'] { box-shadow: 0 0 0 2px var(--lb-color-stone-solid), 0 0 0 4px var(--lb-color-brass); z-index: 1; }

.lo-mesa__nome {
  font-family: var(--lb-font-display);
  font-size: 26px;
  font-weight: var(--lb-font-weight-regular);
  line-height: 1.12;
  overflow-wrap: anywhere;
}

.lo-mesa__fatos {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, auto));
  justify-content: start;
  gap: var(--lb-space-1) var(--lb-space-6);
  margin: 0;
}

.lo-mesa__fatos dt { color: var(--lb-color-parchment-faint); font-size: var(--lb-font-size-sm); }
.lo-mesa__fatos dd { margin: 0; font-size: var(--lb-font-size-lg); }

.lo-mesa__rodape {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--lb-space-2) var(--lb-space-4);
  padding-top: var(--lb-space-4);
  border-top: 1px solid var(--lb-color-line);
  color: var(--lb-color-parchment-dim);
}

.lo-mesa__ultima { min-width: 0; }
.lo-mesa__ultima b { color: var(--lb-color-parchment); font-weight: var(--lb-font-weight-medium); }

.lo-mesa__ir {
  display: inline-flex;
  align-items: center;
  gap: var(--lb-space-1);
  color: var(--lb-color-brass);
  font-weight: var(--lb-font-weight-medium);
  transition: color var(--lb-motion-fast) ease;
}

.lo-na-mesa {
  display: inline-flex;
  align-items: center;
  gap: var(--lb-space-2);
  color: var(--lb-color-parchment-dim);
  font-size: var(--lb-font-size-sm);
  white-space: nowrap;
}

/* ============================================ 3. CAMPANHA */

/* "Na mesa agora": quem está com o site aberto. */
.lo-agora {
  display: flex;
  flex-direction: column;
  gap: var(--lb-space-2);
  min-width: 220px;
  padding: var(--lb-space-3) var(--lb-space-4);
  border: 1px solid var(--lb-color-line);
  border-radius: var(--lb-radius-lg);
  background: rgba(26, 26, 30, 0.7);
}

.lo-agora__titulo {
  display: flex;
  align-items: center;
  gap: var(--lb-space-2);
  color: var(--lb-color-parchment-dim);
  font-size: var(--lb-font-size-sm);
}

.lo-agora ul { display: flex; flex-direction: column; gap: 6px; }
.lo-agora li { display: flex; align-items: center; gap: var(--lb-space-2); }
.lo-agora li .lo-av { width: 24px; height: 24px; font-size: var(--lb-font-size-xs); }
.lo-agora__papel { color: var(--lb-color-parchment-faint); }

/* O LOBBY: os seus personagens grandes, no papel da ficha e com filete de latão;
   a tripulação ao lado, em pedra, menor e só para ver. */
.lo-herois {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr));
  gap: var(--lb-space-4);
}

.lo-heroi {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: var(--lb-space-5);
  padding: var(--lb-space-5);
  border: 1px solid var(--lb-gr-filete-latao);
  border-radius: var(--lb-radius-xl);
  background: linear-gradient(180deg, var(--lb-gr-cartao-alto), var(--lb-gr-cartao));
  box-shadow: var(--lb-shadow-md), var(--lb-shadow-bevel);
}

.lo-heroi__corpo {
  display: flex;
  flex-direction: column;
  gap: var(--lb-space-3);
  min-width: 0;
}

.lo-heroi__nome {
  font-family: var(--lb-font-display);
  font-size: 28px;
  font-weight: var(--lb-font-weight-regular);
  line-height: 1.05;
  overflow-wrap: anywhere;
}

.lo-heroi__de { color: var(--lb-color-parchment-dim); }

.lo-heroi__acoes {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lb-control-gap);
  margin-top: auto;
  padding-top: var(--lb-space-1);
}

.lo-medidores { display: grid; gap: var(--lb-space-2); }

.lo-medidor {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--lb-space-3);
  font-size: var(--lb-font-size-sm);
}

.lo-medidor__nome { color: var(--lb-color-parchment-dim); }

.lo-medidor__valor {
  font-family: var(--lb-font-utility);
  font-size: var(--lb-font-size-md);
  font-variant-numeric: tabular-nums;
  color: var(--tom-medidor);
}

.lo-medidor__valor small { color: var(--lb-color-parchment-faint); font-size: inherit; }

.lo-medidor[data-tom='vida'], .lo-recurso[data-tom='vida'] { --tom-medidor: var(--lb-color-ember); }
.lo-medidor[data-tom='energia'], .lo-recurso[data-tom='energia'] { --tom-medidor: var(--lb-color-tide); }
.lo-recurso[data-tom='escudo'] { --tom-medidor: var(--lb-color-parchment); }

/* A barrinha não anima: muda a cada clique (regra do app). */
.lo-barra {
  display: block;
  height: 4px;
  border-radius: 2px;
  background: color-mix(in srgb, var(--tom-medidor) 20%, transparent);
  overflow: hidden;
}

.lo-barra > span {
  display: block;
  height: 100%;
  background: var(--tom-medidor);
  transform-origin: left center;
}

.lo-tripulacao {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
  gap: var(--lb-space-3);
}

.lo-colega {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: var(--lb-space-3) var(--lb-space-4);
  padding: var(--lb-space-4);
  border: 1px solid var(--lb-color-line);
  border-radius: var(--lb-radius-lg);
  background: var(--lb-color-stone-solid);
  color: inherit;
  text-decoration: none;
  transition: border-color var(--lb-motion-base) ease, transform 140ms var(--lb-gr-ease-out);
}

.lo-colega:active { transform: scale(0.985); }

@media (hover: hover) and (pointer: fine) {
  .lo-colega:hover { border-color: var(--lb-color-line-strong); }
}

.lo-colega__corpo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.lo-colega__nome {
  font-family: var(--lb-font-display);
  font-size: 19px;
  font-weight: var(--lb-font-weight-regular);
  line-height: 1.15;
  overflow-wrap: anywhere;
}

.lo-colega__de {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px var(--lb-space-2);
  color: var(--lb-color-parchment-dim);
  font-size: var(--lb-font-size-sm);
}

.lo-colega .lo-medidor { grid-template-columns: 48px minmax(0, 1fr) auto; font-size: var(--lb-font-size-xs); }
.lo-colega .lo-medidor__valor { font-size: var(--lb-font-size-sm); }

.lo-colega__pe {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--lb-space-2);
  padding-top: var(--lb-space-3);
  border-top: 1px solid var(--lb-color-line);
  color: var(--lb-color-parchment-faint);
  font-size: var(--lb-font-size-sm);
}

/* ============================================ 4. FICHA */

.lo-cab-ficha {
  display: flex;
  flex-direction: column;
  gap: var(--lb-space-2);
  margin-bottom: var(--lb-space-5);
}

.lo-cab-ficha__linha {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--lb-space-3) var(--lb-space-4);
}

.lo-cab-ficha__linha .lo-titulo { margin-right: var(--lb-space-1); }

.lo-cab-ficha__acoes {
  display: flex;
  flex-wrap: wrap;
  gap: var(--lb-control-gap);
  margin-left: auto;
}

.lo-cab-ficha__regra { color: var(--lb-color-parchment-dim); max-width: 70ch; }

/* Aviso de linha: sem internet, só ver, ficha sem conta. */
.lo-linha-aviso {
  display: flex;
  align-items: flex-start;
  gap: var(--lb-space-3);
  margin-bottom: var(--lb-space-4);
  padding: var(--lb-space-3) var(--lb-space-4);
  border: 1px solid var(--lb-color-line);
  border-radius: var(--lb-radius-lg);
  background: var(--lb-color-stone-solid);
  color: var(--lb-color-parchment-dim);
}

.lo-linha-aviso .lo-ic { margin-top: 2px; }
.lo-linha-aviso b { color: var(--lb-color-parchment); font-weight: var(--lb-font-weight-medium); }
.lo-linha-aviso[data-tom='mare'] { border-color: transparent; background: var(--lb-color-tide-soft); }
.lo-linha-aviso[data-tom='mare'] .lo-ic { color: var(--lb-color-tide); }

/* 5. O AVISO DE CONFLITO: acima da ficha, a frase diz quem, o quê e os dois valores,
   e os botões dizem o número que fica. Nada é escolhido sozinho. */
.lo-conflito {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: var(--lb-space-3) var(--lb-space-4);
  margin-bottom: var(--lb-space-4);
  padding: var(--lb-space-4) var(--lb-space-5);
  border: 1px solid rgba(226, 100, 90, 0.4);
  border-left-width: 3px;
  border-radius: var(--lb-radius-lg);
  background: linear-gradient(90deg, rgba(226, 100, 90, 0.12), rgba(226, 100, 90, 0.04));
  box-shadow: var(--lb-shadow-md);
  outline-offset: 3px;
}

/* Entra uma vez, quando chega; os re-renders seguintes não repetem. */
.lo-conflito[data-novo='1'] {
  animation: lo-aviso-entra 220ms var(--lb-gr-ease-out);
}

@keyframes lo-aviso-entra {
  from { opacity: 0; transform: translateY(-6px); }
}

.lo-conflito__sinal {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--lb-color-ember-soft);
  color: var(--lb-color-ember);
}

.lo-conflito__sinal .lo-ic { width: 20px; height: 20px; }
.lo-conflito__texto { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.lo-conflito__frase {
  font-size: 17px;
  font-weight: var(--lb-font-weight-medium);
  line-height: 1.35;
}

.lo-conflito__frase em { font-style: normal; color: var(--lb-color-parchment-dim); font-weight: var(--lb-font-weight-regular); }
.lo-conflito__quando { color: var(--lb-color-parchment-dim); }

.lo-conflito__acoes {
  grid-column: 2;
  display: flex;
  flex-wrap: wrap;
  gap: var(--lb-control-gap);
}

.lo-conflito__acoes .lo-btn { font-variant-numeric: tabular-nums; }

/* A ficha em si: duas colunas no computador, uma só no celular (como a ficha do app). */
.lo-ficha {
  display: grid;
  grid-template-columns: minmax(260px, 300px) minmax(0, 1fr);
  gap: var(--lb-space-5);
  align-items: start;
}

.lo-lado {
  display: flex;
  flex-direction: column;
  gap: var(--lb-space-4);
  padding: var(--lb-space-5);
  border: 1px solid var(--lb-gr-filete);
  border-radius: var(--lb-radius-xl);
  background: linear-gradient(180deg, var(--lb-gr-cartao-alto), var(--lb-gr-cartao));
  box-shadow: var(--lb-shadow-bevel);
}

.lo-lado .lo-retrato--xg { margin: 0 auto; }

/* A coluna do retrato acompanha a rolagem só onde cabe inteira na janela. */
@media (min-width: 901px) and (min-height: 820px) {
  .lo-lado { position: sticky; top: 112px; }
}

.lo-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--lb-space-1); }

.lo-chip {
  display: inline-flex;
  padding: 3px var(--lb-space-2);
  border: 1px solid var(--lb-color-line-strong);
  border-radius: var(--lb-radius-sm);
  background: var(--lb-color-stone-raised);
  font-size: var(--lb-font-size-sm);
  font-weight: var(--lb-font-weight-medium);
}

.lo-recursos { display: flex; flex-direction: column; gap: var(--lb-space-3); }

.lo-recurso {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: var(--lb-space-3);
  border: 1px solid var(--lb-gr-filete);
  border-radius: var(--lb-radius-md);
  background: var(--lb-gr-campo);
}

.lo-recurso__topo {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--lb-space-2);
}

.lo-recurso__nome {
  font-family: var(--lb-font-utility);
  font-size: var(--lb-font-size-sm);
  font-weight: var(--lb-font-weight-semibold);
  letter-spacing: var(--lb-font-tracking-wide);
  text-transform: uppercase;
  color: var(--tom-medidor);
}

.lo-recurso__max { color: var(--lb-color-parchment-faint); font-size: var(--lb-font-size-sm); font-variant-numeric: tabular-nums; }

.lo-recurso__ler {
  font-family: var(--lb-font-utility);
  font-size: 30px;
  font-weight: var(--lb-font-weight-semibold);
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  color: var(--tom-medidor);
}

/* O passo: [−] número [+]. O número é um campo: dá para digitar 22 direto. */
.lo-passo {
  display: grid;
  grid-template-columns: var(--lo-alvo) minmax(0, 1fr) var(--lo-alvo);
  align-items: center;
  gap: 6px;
}

.lo-passo .lo-btn--icone { width: auto; min-height: var(--lo-alvo); }

.lo-numero {
  width: 100%;
  min-width: 0;
  min-height: var(--lo-alvo);
  padding: 0 6px;
  border: 1px solid var(--lb-color-line);
  border-radius: var(--lb-radius-md);
  background: var(--lb-color-stone-sunken);
  color: var(--tom-medidor, var(--lb-color-parchment));
  font-family: var(--lb-font-utility);
  font-size: 24px;
  font-weight: var(--lb-font-weight-semibold);
  font-variant-numeric: tabular-nums;
  text-align: center;
  transition: border-color var(--lb-motion-fast) ease;
}

.lo-numero:focus-visible { outline: none; border-color: var(--lb-color-brass); box-shadow: 0 0 0 1px var(--lb-color-brass); }
.lo-numero:disabled { opacity: 0.6; }
.lo-numero[aria-invalid='true'] { border-color: var(--lb-color-ember); }

.lo-erro-campo { color: var(--lb-color-ember); font-size: var(--lb-font-size-sm); }
