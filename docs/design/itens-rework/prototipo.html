}
function marcarAbaDoEditor() {
  $('#aba-editor').innerHTML = `Editor do item${UI.sujo ? '<span class="aba__ponto" aria-hidden="true"></span><span class="sr"> (mudanças não salvas)</span>' : ''}`;
}
function irPara(aba) {
  UI.aba = aba;
  UI.modo = null;
  UI.escolhidos = [];
  render();
  window.scrollTo({ top: 0 });
}

/* =============================================================== o cartão de papel */
function numerosDoCartao(it) {
  const cons = it.tipo === 'consumivel';
  if (ATACA.includes(it.tipo)) {
    const n = [];
    if (it.tipo === 'hibrida') n.push(['Golpe', `${it.golpe.dano}${it.golpe.soma ? ` + ${esc(it.golpe.soma)}` : ''}`]);
    n.push([it.tipo === 'hibrida' ? 'Tiro' : 'Dano', `${it.dano}${it.soma ? ` + ${esc(it.soma)}` : ''}`]);
    n.push(['Ação', esc(it.acao)]);
    n.push(['Alvos', ehArea(it.alcance.forma) ? 'Todos na área' : String(it.alvos)]);
    n.push(['Alcance', esc(txtAlcanceCurto(it.alcance))]);
    if (DE_FOGO.includes(it.tipo)) n.push(['Pente', `${it.capacidade} ${pl(it.capacidade, 'bala', 'balas')}`]);
    if (COM_RECARGA.includes(it.tipo)) n.push(['Recarga', esc(txtRecarga(it))]);
    return n;
  }
  if (it.tipo === 'municao') return [['Dano da bala', esc(txtBalaCurto(it))]];
  if (cons) return efeitosValidos(it).length ? [['Ação', esc(it.acao)], ['Alcance', esc(txtAlcanceCurto(it.alcance, true))]] : [];
  if (it.tipo === 'equipamento') return [['Veste', esc(it.parte)], ...it.bonus.map((b) => ['Dá', esc(txtBonus(b))])];
  return [];
}
function cartao(it) {

  if (it.luz.ligada) selos.push(`<span class="papel__selo" data-c="luz">Ilumina ${it.luz.raio} ${pl(it.luz.raio, 'casa', 'casas')}</span>`);
  const mostraGrade = COM_ALCANCE.includes(it.tipo) && !(cons && !efeitosValidos(it).length);
  return `<article class="papel" aria-label="Cartão de ${esc(it.nome || 'item sem nome')}">

    ${selos.length ? `<div class="papel__selos">${selos.join('')}</div>` : ''}

}

function linhaAcervo(i) {

function ladoAcervo(it) {

/* =============================================================== B) Editor do item */
function abrirEditor(id, tipoNovo) {
  const antes = UI.sujo && UI.rascunho ? { rascunho: clone(UI.rascunho), editId: UI.editId } : null;
  if (id) {
    UI.rascunho = clone(item(id));
    UI.editId = id;
    UI.sel = id;
  } else {
    UI.rascunho = completarItem({ id: null, nome: '', tipo: tipoNovo || null, preco: 0 });
    if (tipoNovo) aplicarTipo(UI.rascunho, tipoNovo, null);
    UI.editId = null;
  }
  UI.sujo = false;
  UI.erroNome = false;
  UI.erroImagem = '';
  UI.secoesAntes = null;
  UI.amostra = null;
  UI.teste = null;
  irPara('editor');
  if (antes && (antes.editId !== UI.editId || !id)) {
    const nome = antes.rascunho.nome || 'item novo';
    avisar(`Mudanças em ${nome} ficaram de fora.`, { rotulo: 'Voltar a elas', acao: () => { UI.rascunho = antes.rascunho; UI.editId = antes.editId; UI.sujo = true; irPara('editor'); } });
  }

  if (n) n.focus({ preventScroll: true });
}

  if (t === 'consumivel' && r.alcance.forma === 'alvo' && anterior !== 'consumivel') r.alcance.a = 0;

  hibrida: ['tipo', 'nome', 'golpe', 'regra', 'municao', 'efeitos', 'opcoes', 'descricao'],

  municao: ['tipo', 'nome', 'regra', 'efeitos', 'opcoes', 'descricao'],
  consumivel: ['tipo', 'nome', 'regra', 'efeitos', 'opcoes', 'descricao'],

const somaOps = () => [['', 'Nada'], ...ATRIBUTOS.map((a) => [a, a])];

function receberImagem(arquivo) {
  if (!arquivo || !UI.rascunho) return;
  const ok = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];
  if (!ok.includes(arquivo.type)) { UI.erroImagem = 'Esse arquivo não é imagem PNG, JPG, WEBP ou GIF.'; render(); return; }
  if (arquivo.size > 2 * 1024 * 1024) { UI.erroImagem = `A imagem tem ${(arquivo.size / 1048576).toFixed(1)} MB; o máximo é 2 MB.`; render(); return; }
  const leitor = new FileReader();
  leitor.onload = () => {
    UI.rascunho.imagem = String(leitor.result);
    UI.erroImagem = '';
    UI.sujo = true;
    render();
    avisar('Imagem posta no item. Salve para valer em todas as telas.');
  };
  leitor.onerror = () => { UI.erroImagem = 'Não deu para ler o arquivo. Tente outro.'; render(); };
  leitor.readAsDataURL(arquivo);
}
function normalizarItem(r) {
  const al = r.alcance;
  al.b = Math.max(r.tipo === 'consumivel' ? 0 : 1, al.b);
  al.a = Math.max(al.forma === 'explosao' ? 0 : 1, Math.min(al.a, al.b));
  r.alvos = limitar(r.alvos, 1, 6);
  r.capacidade = Math.max(1, r.capacidade);
  r.golpe.b = limitar(r.golpe.b, 1, 3);
  r.bala.divisor = Math.max(1, r.bala.divisor);
  r.luz.raio = Math.max(1, r.luz.raio);
  if (EMPILHA_SOZINHO.includes(r.tipo)) r.empilhavel = true;
  r.efeitos = efeitosValidos(r).map((e) => ({ ...e, n: e.tipo === 'empurrar' ? Math.max(1, e.n || 1) : e.n, dados: Math.max(1, e.dados || 1), faces: Math.max(2, e.faces || 2), fixo: Math.max(1, e.fixo || 1), valor: Math.max(1, e.valor || 1) }));
  r.bonus = r.tipo === 'equipamento' ? r.bonus.filter((b) => (BONUS_COM_TEXTO.includes(b.campo) ? b.em.trim() : b.n !== 0)) : [];
  if (!DE_FOGO.includes(r.tipo)) r.aceita = [];
}

  const novo = !UI.editId;
  const copia = clone(r);
  if (novo) copia.id = `it-${Date.now().toString(36)}`;
  if (!novo) copia.confira = '';
  const id = fazer(novo ? `criou ${copia.nome}` : `salvou ${copia.nome}`, () => {
    if (novo) D.itens.push(copia);
    else D.itens[D.itens.findIndex((x) => x.id === UI.editId)] = copia;
    donosTodos().forEach((k) => arrumarMochila(est(k)));
  });
  UI.sel = copia.id;
  UI.rascunho = null;
  UI.editId = null;
  UI.sujo = false;
  UI.teste = null;
  UI.filtro = UI.filtro === 'todos' || UI.filtro === copia.tipo ? UI.filtro : 'todos';
  irPara('acervo');
  const extra = tinhaRepetido ? ' O dano extra que repetia o de cima ficou fora.' : '';
  avisar(novo ? `${copia.nome} entrou no Acervo.${extra}` : `Mudanças em ${copia.nome} salvas. Já valem nas mochilas e na batalha.${extra}`, { desfazer: id });
  const linha = $(`[data-k="sel-${copia.id}"]`);
  if (linha) { linha.focus({ preventScroll: true }); linha.scrollIntoView({ block: 'nearest' }); }
}

/* ------------------------------------------------ Testar no boneco de treino (não mexe em nada) */
function testarNoBoneco(r) {
  const k = 'f:vincent';
  const frases = [];
  const boneco = 'Boneco de treino: vida 200, sem Escudo.';
  const efeitosTxt = (it, bala) => [...efeitosValidos(it), ...(bala ? efeitosValidos(bala) : [])].filter((e) => e.tipo !== 'dano').map((e) => {
    if (e.tipo === 'condicao') return `O boneco fica ${txtCondEf(e)}.`;
    if (e.tipo === 'empurrar') return `O boneco é empurrado ${e.n} ${pl(e.n, 'casa', 'casas')}.`;
    return '';
  }).filter(Boolean);
  const golpe = (it, modo, bala) => {
    const c = calcularDano(k, it, modo, bala);
    return `${c.conta} = ${c.total} de dano. Vida do boneco: 200 → ${Math.max(0, 200 - c.total)}.`;
  };
  const repetidos = r.efeitos.filter((e) => danoRepete(r, e)).length;
  if (ATACA.includes(r.tipo)) {
    if (r.tipo === 'hibrida') frases.push(`Golpe: ${golpe(r, 'golpe', null)}`);
    if (DE_FOGO.includes(r.tipo)) {
      const bala = r.aceita.map(item).find(Boolean) || null;
      frases.push(`Tiro${bala ? ` com ${bala.nome}` : ' sem bala marcada'}: ${golpe(r, 'tiro', bala)}`);
      frases.push(...efeitosTxt(r, bala));
      frases.push(`Pente: ${r.capacidade} → ${r.capacidade - 1}. Quando zerar, a mesa recarrega da mochila (${txtRecarga(r)}).`);
    } else {
      frases.push(`${r.tipo === 'arremesso' ? 'Arremesso' : 'Golpe'}: ${golpe(r, 'tiro', null)}`);
      frases.push(...efeitosTxt(r, null));
      if (r.tipo === 'arremesso') frases.push(r.volta ? 'Volta para a mão: não sai da mochila.' : `Sai 1 ${r.nome || 'item'} da mochila.`);
    }
  } else if (r.tipo === 'municao') {
    const arma = armasQueAceitam(r.id)[0] || null;
    if (!arma) frases.push('Nenhuma arma do Acervo aceita esta bala ainda: marque-a numa arma para testar o tiro.');
    else { frases.push(`Tiro de ${arma.nome} com esta bala: ${golpe(arma, 'tiro', r)}`); frases.push(...efeitosTxt(arma, r)); }
  } else if (r.tipo === 'consumivel') {
    const ef = efeitosValidos(r);
    if (!ef.length) frases.push('Sem efeito: o boneco não muda, nada sai da mochila e o mestre narra.');
    ef.forEach((e) => {
      if (e.tipo === 'curar') { const c = rolar(e); frases.push(`Boneco ferido (vida 80 de 200) recebe ${c.valor} (${c.conta}): vida 80 → ${Math.min(200, 80 + c.valor)}.`); }
      if (e.tipo === 'tirar') frases.push(`Tira ${e.cond === 'todas' ? 'todas as condições' : cond(e.cond).nome} do boneco.`);
      if (e.tipo === 'condicao') frases.push(`O boneco fica ${txtCondEf(e)}.`);
    });
  }
  if (repetidos) frases.push(`${repetidos} ${pl(repetidos, 'peça de dano extra ficou', 'peças de dano extra ficaram')} fora por repetir o dano de cima.`);
  return `<div class="teste" role="status"><span class="medalhao medalhao--p">${glifo('boneco')}</span><div><p class="teste__tit">${esc(boneco)} Quem testa: Vincent G., com os atributos dele.</p><ul>${frases.map((f) => `<li>${esc(f)}</li>`).join('')}</ul><p class="nota">Só um teste: nada mudou nas mochilas nem na batalha.</p></div></div>`;
}

function estadoDaVida(e) {
  const p = e.vidaMax ? e.vida / e.vidaMax : 0;
  if (p <= 0) return { nome: 'Caído', tom: 'dano' };
  if (p < 0.4) return { nome: 'Muito ferido', tom: 'dano' };
  if (p < 0.75) return { nome: 'Ferido', tom: 'latao' };
  return { nome: 'Bem', tom: 'cura' };
}
const JOG_COLS = 4;
/** Ações que o jogador tem para esta vaga, pelo tipo do item. Cada uma: { acao, rot, motivo, principal }. */
function acoesDoJogador(k, v) {
  const e = est(k);
  const it = item(v.itemId);
  const luta = naBatalha(k);
  const t = tokenDaChave(k);
  const r = [];
  if (ehArma(it) || it.tipo === 'equipamento') r.push({ acao: 'equipar', rot: v.equipado ? 'Guardar' : 'Equipar', motivo: motivoEquipar(k, v), principal: true });
  if (DE_FOGO.includes(it.tipo)) {
    let motivo = null;
    if (v.pente && v.pente.n >= it.capacidade) motivo = 'O pente está cheio';
    else if (!temBalaPara(e, it)) motivo = 'Nenhuma bala que ela aceita na mochila';
    else if (luta) motivo = motivoDoCusto(t.tid, it.recarga.tipo);
    r.push({ acao: 'recarregar-jog', rot: `Recarregar (${luta ? txtRecarga(it) : 'na hora'})`, motivo });
  }
  if (it.tipo === 'arremesso') {
    const motivo = !luta ? 'Só na batalha' : !v.equipado ? 'Equipe para jogar' : !pronta(v) ? (it.volta ? 'Ainda voltando para a mão' : 'Ainda recarregando') : motivoDoCusto(t.tid, it.acao);
    r.push({ acao: 'jogar-jog', rot: `Jogar ${it.nome}`, motivo, principal: false });
  }
  if (it.tipo === 'consumivel') {
    let motivo = null;
    if (!semRegra(it)) {
      if (luta && !it.onde.batalha) motivo = 'Só fora da batalha';
      else if (!luta && !it.onde.fora) motivo = 'Só na batalha';
      else if (luta) motivo = motivoDoCusto(t.tid, it.acao);
    }
    r.push({ acao: 'usar-jog', rot: semRegra(it) ? 'Usar' : luta ? 'Usar (escolha no mapa)' : 'Usar em mim ou num colega', motivo, principal: true });
  }
  if (it.luz.ligada) r.push({ acao: 'acender', rot: v.aceso ? 'Apagar' : 'Acender', motivo: null, principal: !ehArma(it) && it.tipo !== 'consumivel' });
  return r;
}

  UI.dar = { modo: 'acervo', de: null, itemId, qtd: qtd || 1, para: [], origem: origemDoFoco() };
  renderDar();
  abrirJanela($('#janela-dar'));
  const q = $('#dar-qtd');
  if (q) { q.focus(); q.select(); }
}
function abrirDarDe(k, itemId) {
  UI.dar = { modo: 'mochila', de: k, itemId: itemId || null, qtd: 1, para: [], origem: origemDoFoco() };
  renderDar();
  abrirJanela($('#janela-dar'));
  const q = $(UI.dar.itemId ? '#dar-qtd' : '.dar-item input');
  if (q) q.focus();
}
function fecharDar() { const o = UI.dar ? UI.dar.origem : null; UI.dar = null; fecharJanela($('#janela-dar'), o); }
const quantosPodeDar = (d) => { if (!d.itemId || d.modo !== 'mochila') return 999; const e = est(d.de); return quantos(e, d.itemId); };
function destinosDoDar(d) {
  if (d.modo === 'mochila') return [{ tit: `Aliados de ${nomeDe(d.de)}`, ks: aliadosDe(d.de) }];
  const jog = D.fichas.filter((f) => !f.npc).map((f) => `f:${f.id}`);
  const copias = (D.batalha ? D.batalha.tokens : []).filter((t) => t.copia).map((t) => `c:${t.tid}`);
  const modelos = D.fichas.filter((f) => f.npc).map((f) => `f:${f.id}`);
  return [{ tit: 'Jogadores', ks: jog }, { tit: 'NPCs no mapa (cada cópia tem a sua mochila)', ks: copias }, { tit: 'Fichas de NPC (modelo: só as cópias novas)', ks: modelos }];
}
function partesDoDar() {
  const d = UI.dar;
  const it = d.itemId ? item(d.itemId) : null;
  const grupos = destinosDoDar(d).filter((g) => g.ks.length).map((g) => `<p class="quem__grupo">${esc(g.tit)}</p>${g.ks.map((k) => {
    const f = fichaDaChave(k);
    const vai = d.para.includes(k);
    const tem = it ? quantos(est(k), it.id) : 0;
    const rot = k[0] === 'c' ? 'Cópia no mapa' : f.npc ? (f.aliado ? 'NPC aliado, modelo' : 'NPC, modelo') : 'Jogador';
    return `<label class="quem__op"><input type="checkbox" data-dar-para="${k}" data-k="dp-${k}" ${vai ? 'checked' : ''}>${retratoDe(f)}<span class="quem__txt"><span>${esc(nomeDe(k))}</span><small>${rot}</small></span><span class="quem__tem">${it ? `tem <b>${tem}</b>${vai ? ` → <b data-vai>${tem + d.qtd}</b>` : ''}` : ''}</span></label>`;
  }).join('')}`).join('') || '<p class="nota">Ninguém do mesmo lado para receber.</p>';
  let resumo = '';
  let erro = false;
  const nomes = d.para.map(nomeDe);
  if (!it) { resumo = 'Escolha o item que vai dar.'; erro = true; }
  else if (!d.para.length) { resumo = 'Escolha pelo menos uma ficha para poder dar.'; erro = true; }
  else if (d.modo === 'mochila' && d.qtd * d.para.length > quantosPodeDar(d)) { resumo = `${nomeDe(d.de)} tem ${quantosPodeDar(d)} ${it.nome}; para dar ${d.qtd} a ${d.para.length} ${pl(d.para.length, 'ficha', 'fichas')} precisa de ${d.qtd * d.para.length}.`; erro = true; }
  else resumo = `${d.modo === 'mochila' ? `${nomeDe(d.de)} dá` : 'Dá'} ${d.qtd} ${it.nome} a ${juntar(nomes)}${d.para.length > 1 ? ` (${d.qtd * d.para.length} no total)` : ''}.${d.modo === 'mochila' ? ` Sai da mochila de ${nomeDe(d.de)}.` : ''}`;
  return { grupos, resumo: pontuar(resumo), erro };
}
function renderDar() {
  const d = UI.dar;
  if (!d) return;
  const it = d.itemId ? item(d.itemId) : null;
  const { grupos, resumo, erro } = partesDoDar();
  const dlg = $('#janela-dar');
  let escolhaItem = '';
  if (d.modo === 'mochila') {
    const ids = [...new Set(est(d.de).mochila.map((v) => v.itemId))];
    escolhaItem = `<fieldset class="campo" style="border:0;margin:0;padding:0"><legend class="campo__rot" style="margin-bottom:6px">Qual item</legend><div class="dar-item" role="radiogroup">${ids.map((id) => `<label class="dar-item__op"><input type="radio" name="dar-item" value="${id}" data-dar-item data-k="di-${id}" ${id === d.itemId ? 'checked' : ''}><span class="medalhao medalhao--p">${fotoDe(item(id))}</span><span>${esc(item(id).nome)} <small class="num">${quantos(est(d.de), id)}</small></span></label>`).join('') || '<p class="nota">Mochila vazia.</p>'}</div></fieldset>`;
  }
  const max = Math.max(1, Math.min(999, quantosPodeDar(d)));
  comFoco(() => {
    dlg.innerHTML = `
    <div class="janela__cab"><span class="medalhao medalhao--g">${it ? fotoDe(it) : glifo('dar')}</span><div><h2 id="dar-tit">${d.modo === 'mochila' ? `Dar item de ${esc(nomeDe(d.de))}` : `Dar ${esc(it.nome)} a...`}</h2><p>${d.modo === 'mochila' ? 'Sai da mochila dele e vai para a do aliado. Na batalha, bala que chega recarrega sozinha a arma de pente vazio.' : 'Cria do Acervo. Escolha quantos e para quem; dá para várias fichas de uma vez.'}</p></div><button type="button" class="bt bt--fantasma bt--ic" data-acao="fechar-dar" data-k="dar-x" aria-label="Fechar">${glifo('x')}</button></div>
    <div class="janela__corpo">
      ${escolhaItem}
      <div class="campo"><label for="dar-qtd">Quantos para cada ficha</label>
        <div class="passo"><button type="button" id="dar-menos" data-acao="dar-menos" data-k="dar-menos" aria-label="Um a menos" ${d.qtd <= 1 ? 'disabled' : ''}>${glifo('menos')}</button><input id="dar-qtd" type="number" min="1" max="${max}" inputmode="numeric" value="${d.qtd}" data-k="dar-qtd"><button type="button" data-acao="dar-mais" data-k="dar-mais" aria-label="Um a mais" ${d.qtd >= max ? 'disabled' : ''}>${glifo('mais')}</button></div>
        <span class="campo__ajuda" id="dar-ajuda">${!it ? '' : it.empilhavel ? 'Empilha: entra na mesma vaga da mochila.' : `${esc(it.nome)} não empilha: cada um ocupa uma vaga, e vai com as balas do pente.`}</span>
      </div>
      <fieldset class="campo" style="border:0;margin:0;padding:0"><legend class="campo__rot" style="margin-bottom:6px">Para quem</legend>
        <div class="quem" id="dar-quem">${grupos}</div>
        ${d.modo === 'acervo' ? '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"><button type="button" class="bt bt--p bt--fantasma" data-acao="dar-jogadores" data-k="dar-jog">Marcar os jogadores</button><button type="button" class="bt bt--p bt--fantasma" data-acao="dar-nenhum" data-k="dar-nen">Desmarcar todos</button></div>' : ''}
      </fieldset>
    </div>
    <div class="janela__pe"><p id="dar-resumo" ${erro ? 'data-erro' : ''}>${esc(resumo)}</p><button type="button" class="bt" data-acao="fechar-dar" data-k="dar-cancelar">Cancelar</button><button type="button" class="bt bt--primario" id="dar-ok" data-acao="confirmar-dar" data-k="dar-ok" ${erro ? 'disabled' : ''}>${glifo('dar')}Dar</button></div>`;
  });
}
function atualizarDarSemMexerNoCampo() {
  const { grupos, resumo, erro } = partesDoDar();
  $('#dar-quem').innerHTML = grupos;
  const r = $('#dar-resumo');
  r.textContent = resumo;
  r.toggleAttribute('data-erro', erro);
  $('#dar-ok').disabled = erro;
  $('#dar-menos').disabled = UI.dar.qtd <= 1;
}
/** Passa itens de uma mochila para outra. Arma que não empilha vai inteira, com as balas do pente. */
function transferir(deK, paraK, itemId, n) {
  const it = item(itemId);
  const de = est(deK);
  const para = est(paraK);
  if (it.empilhavel) { tiraDaMochila(de, itemId, n); poeNaMochila(para, itemId, n); return; }
  const vagas = de.mochila.filter((v) => v.itemId === itemId).sort((a, b) => Number(a.equipado) - Number(b.equipado)).slice(0, n);
  de.mochila = de.mochila.filter((v) => !vagas.includes(v));
  vagas.forEach((v) => para.mochila.push({ ...v, equipado: false, aceso: false, espera: 0, naVez: false }));
}
function confirmarDar() {
  const d = UI.dar;
  if (!d) return;
  const { erro } = partesDoDar();
  if (erro) return;
  const it = item(d.itemId);
  const nomes = d.para.map(nomeDe);
  const extras = [];
  const id = fazer(`${d.modo === 'mochila' ? `${nomeDe(d.de)} deu` : 'deu'} ${d.qtd} ${it.nome}`, () => {
    d.para.forEach((k) => {
      if (d.modo === 'mochila') transferir(d.de, k, it.id, d.qtd);
      else poeNaMochila(est(k), it.id, d.qtd);
      if (it.tipo === 'municao') extras.push(...aoReceber(k));
    });
    if (D.batalha.ativa && (d.modo === 'mochila' || d.para.some((k) => tokenDaChave(k)))) {
      D.batalha.log.unshift({ titulo: `${d.modo === 'mochila' ? nomeDe(d.de) : 'O mestre'} deu ${d.qtd} ${it.nome} a ${juntar(nomes)}.`, detalhes: extras.join(' ') });
      UI.logNovo = true;
    }
  });
  fecharDar();
  render();
  avisar(`${d.modo === 'mochila' ? `${nomeDe(d.de)} deu` : 'Deu'} ${d.qtd} ${it.nome} a ${juntar(nomes)}.${extras.length ? ` ${extras.join(' ')}` : ''}`, { desfazer: id });
}

/* =============================================================== Usar em... (fora da batalha: em si ou num aliado) */
function abrirUsar(k, oque) {
  UI.usar = { k, ...oque, para: k, origem: origemDoFoco() };
  renderUsar();
  abrirJanela($('#janela-usar'));
  const n = $('#janela-usar input:checked');
  if (n) n.focus();
}
function fecharUsar() { const o = UI.usar ? UI.usar.origem : null; UI.usar = null; fecharJanela($('#janela-usar'), o); }
function renderUsar() {
  const u = UI.usar;
  if (!u) return;
  const tec = u.tecId ? fichaDaChave(u.k).tecnicas.find((t) => t.id === u.tecId) : null;
  const it = u.itemId ? item(u.itemId) : null;
  const nome = tec ? tec.nome : it.nome;
  const quem = [u.k, ...aliadosDe(u.k)];
  const ops = quem.map((k) => { const e = est(k); return `<label class="quem__op quem__op--radio"><input type="radio" name="usar-para" value="${k}" data-usar-para data-k="up-${k}" ${k === u.para ? 'checked' : ''}>${retratoDe(fichaDaChave(k))}<span class="quem__txt"><span>${esc(k === u.k ? `${nomeDe(k)} (em si)` : nomeDe(k))}</span><small>vida ${e.vida} de ${e.vidaMax}${e.cond.length ? `, ${e.cond.map((c) => cond(c.cid).nome).join(', ')}` : ''}</small></span></label>`; }).join('');
  const efeito = tec ? 'Cura 2d8.' : semTags(frasesEfeitos(it, 'uso').join(' '));
  const gasto = tec ? pedidosDaTecnica(u.k, tec).map((p) => p.txt).join('. ') : `Gasta 1 ${it.nome}: ${nomeDe(u.k)} tem ${quantos(est(u.k), it.id)}`;
  comFoco(() => {
    $('#janela-usar').innerHTML = `
    <div class="janela__cab"><span class="medalhao medalhao--g">${it ? fotoDe(it) : glifo('ficha')}</span><div><h2 id="usar-tit">${esc(nomeDe(u.k))} usa ${esc(nome)}</h2><p>${esc(efeito)} Fora da batalha: em si ou num aliado.</p></div><button type="button" class="bt bt--fantasma bt--ic" data-acao="fechar-usar" data-k="usar-x" aria-label="Fechar">${glifo('x')}</button></div>
    <div class="janela__corpo"><fieldset class="campo" style="border:0;margin:0;padding:0"><legend class="campo__rot" style="margin-bottom:6px">Em quem</legend><div class="quem">${ops}</div></fieldset></div>
    <div class="janela__pe"><p>${esc(gasto)}.</p><button type="button" class="bt" data-acao="fechar-usar" data-k="usar-cancelar">Cancelar</button><button type="button" class="bt bt--primario" data-acao="confirmar-usar" data-k="usar-ok">Usar</button></div>`;
  });
}
function confirmarUsar() {
  const u = UI.usar;
  if (!u) return;
  const det = [];
  const vis = [];
  const tec = u.tecId ? fichaDaChave(u.k).tecnicas.find((t) => t.id === u.tecId) : null;
  const it = u.itemId ? item(u.itemId) : null;
  const nome = tec ? tec.nome : it.nome;
  const id = fazer(`${nomeDe(u.k)} usou ${nome}`, () => {
    if (tec) { gastarDaTecnica(u.k, tec, det); curar(u.para, { modo: 'dados', dados: 2, faces: 8 }, det, vis); return; }
    const antes = quantos(est(u.k), it.id);
    tiraDaMochila(est(u.k), it.id, 1);
    aplicarUso(it, u.para, det, vis);
    det.push(`${it.nome} na mochila de ${nomeDe(u.k)}: ${antes} → ${antes - 1}.`);
  });
  const quem = u.para === u.k ? 'em si' : `em ${nomeDe(u.para)}`;
  const nomeK = nomeDe(u.k);
  fecharUsar();
  render();
  avisar(`${nomeK} usou ${nome} ${quem}. ${det.join(' ')}`, { desfazer: id });
}

/* =============================================================== ações de uma vaga (ficha do mestre e tela do jogador) */
function tirarVaga(k, uid) {
  const e = est(k);
  const v = vagaPorUid(e, uid);
  e.mochila = e.mochila.filter((x) => x !== v);
  return v;
}
function executarAcaoDaVaga(acao, k, uid, itemId) {
  const e = est(k);
  const v = vagaPorUid(e, uid);
  const it = item(itemId || (v && v.itemId));
  if (acao === 'equipar') {
    let txt = '';
    const id = fazer(v.equipado ? `guardou ${it.nome}` : `equipou ${it.nome}`, () => { const r = alternarEquipar(k, vagaPorUid(est(k), uid)); if (r === false) return false; txt = r; });
    render();
    if (!id) { avisar(motivoEquipar(k, v) || 'Não deu para equipar.'); return; }
    avisar(txt, { desfazer: id });
    return;
  }
  if (acao === 'recarregar-jog' || acao === 'recarregar-fora' || acao === 'recarregar-b') {
    let r = null;
    const id = fazer(`recarregou ${it.nome}`, () => { r = fazerRecarga(k, vagaPorUid(est(k), uid), {}); if (!r.ok) return false; if (naBatalha(k)) { D.batalha.log.unshift({ titulo: `${nomeDe(k)} recarregou ${it.nome}.`, detalhes: r.txt }); UI.logNovo = true; } });
    render();
    avisar(id ? r.txt : `Não recarregou: ${r.txt}`, id ? { desfazer: id } : {});
    return;
  }
  if (acao === 'jogar-jog') {
    const t = tokenDaChave(k);
    UI.aba = 'batalha';
    UI.ator = t.tid;
    UI.modo = modoDeAtaque(t.tid, uid, 'jogar');
    UI.escolhidos = [];
    render();
    window.scrollTo({ top: 0 });
    return;
  }
  if (acao === 'usar-jog' || acao === 'usar-item') {
    if (semRegra(it)) { avisar(`${it.nome}: sem efeito, o mestre narra o que acontece. Não saiu da mochila de ${nomeDe(k)}.`); return; }
    if (naBatalha(k)) {
      const t = tokenDaChave(k);
      UI.aba = 'batalha';
      UI.ator = t.tid;
      UI.modo = { ator: t.tid, uid: vagaDoItem(e, it.id).uid, itemId: it.id, modo: 'usar', custo: it.acao };
      UI.escolhidos = [];
      render();
      window.scrollTo({ top: 0 });
      return;
    }
    abrirUsar(k, { itemId: it.id });
    return;
  }
  if (acao === 'acender') {
    const liga = !v.aceso;
    const id = fazer(liga ? `acendeu ${it.nome}` : `apagou ${it.nome}`, () => { vagaPorUid(est(k), uid).aceso = liga; });
    render();
    avisar(liga ? `${it.nome} acesa: ilumina ${it.luz.raio} casas em volta de ${nomeDe(k)}${tokenDaChave(k) ? ', também no mapa' : ''}.` : `${it.nome} apagada.`, { desfazer: id });
    return;
  }
  if (acao === 'largar' || acao === 'tirar-vaga') {
    const pente = v.pente && v.pente.n ? ` (com ${v.pente.n} ${item(v.pente.balaId).nome} no pente)` : '';
    const id = fazer(acao === 'largar' ? `largou ${it.nome}` : `tirou ${it.nome}`, () => { tirarVaga(k, uid); });
    render();
    avisar(acao === 'largar' ? `${nomeDe(k)} largou ${v.qtd} ${it.nome}${pente} no chão.` : `Tirou ${v.qtd} ${it.nome}${pente} da mochila de ${nomeDe(k)}.`, { desfazer: id });
  }
}
const vagaDoItem = (e, itemId) => e.mochila.find((v) => v.itemId === itemId) || null;
function usarTecnicaFora(fichaId, tecId) {
  const k = `f:${fichaId}`;
  const tec = ficha(fichaId).tecnicas.find((t) => t.id === tecId);
  if (tec.regra === 'medicina') { abrirUsar(k, { tecId }); return; }
  const det = [];
  const id = fazer(`${nomeDe(k)} usou ${tec.nome}`, () => { gastarDaTecnica(k, tec, det); });
  render();
  avisar(`${nomeDe(k)} usou ${tec.nome}: o mestre narra o que acontece. ${det.join(' ')}`, { desfazer: id });
}

/* =============================================================== avisos */
function anunciar(t) { $('#anuncio').textContent = pontuar(t); }
function avisar(texto, opcoes = {}) {
  const { desfazer: idH = null, rotulo = 'Desfazer', acao = null } = opcoes;
  const box = $('#avisos');
  while (box.children.length >= 3) box.firstElementChild.remove();
  const el = document.createElement('div');
  el.className = 'aviso';
  el.setAttribute('role', 'status');
  el.setAttribute('data-entrando', '');
  const temAcao = idH || acao;
  el.innerHTML = `${glifo('visto')}<p>${esc(pontuar(texto))}</p>${temAcao ? `<button type="button" class="bt bt--p bt--latao" data-av="acao">${glifo('desfazer')}${esc(rotulo)}</button>` : ''}<button type="button" class="bt bt--fantasma bt--ic" data-av="fechar" aria-label="Fechar aviso">${glifo('x')}</button>`;
  box.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.removeAttribute('data-entrando')));
  let restante = temAcao ? 7000 : 4500;
  let inicio = Date.now();
  let t = setTimeout(sair, restante);
  const pausar = () => { clearTimeout(t); restante -= Date.now() - inicio; };
  const seguir = () => { inicio = Date.now(); clearTimeout(t); t = setTimeout(sair, Math.max(1500, restante)); };
  el.addEventListener('pointerenter', pausar);
  el.addEventListener('pointerleave', seguir);
  el.addEventListener('focusin', pausar);
  el.addEventListener('focusout', seguir);
  function sair() {
    clearTimeout(t);
    if (!el.isConnected) return;
    el.setAttribute('data-saindo', '');
    setTimeout(() => el.remove(), 160);
  }
  el.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-av]');
    if (!b) return;
    sair();
    if (b.dataset.av === 'acao') { if (idH) desfazer(idH); else acao(); }
  });
}

function focar(k) { const n = k && $(`[data-k="${CSS.escape(k)}"]`); if (n) n.focus({ preventScroll: false }); }

function comprar(itemId) {
  const f = ficha(UI.lojaQuem);
  const b = D.banca.vende.find((x) => x.itemId === itemId);
  const it = item(itemId);
  const q = limitar(UI.lojaQtd[itemId] || 1, 1, Math.max(1, b.estoque));
  const total = q * b.preco;
  if (!b.estoque) { avisar(`${it.nome} acabou na banca.`); return; }
  if (total > f.berries) { avisar(`${f.nome} tem ${fmt(f.berries)} berries; ${q} ${it.nome} custam ${fmt(total)}.`); return; }
  const antes = f.berries;
  const extras = [];
  const id = fazer(`${f.nome} comprou ${q} ${it.nome}`, () => {
    const ff = ficha(f.id);
    const bb = D.banca.vende.find((x) => x.itemId === itemId);
    ff.berries -= total;
    bb.estoque -= q;
    poeNaMochila(ff, itemId, q);
    if (it.tipo === 'municao') extras.push(...aoReceber(`f:${f.id}`));
  });
  UI.lojaQtd[itemId] = 1;
  render();
  avisar(`${f.nome} comprou ${q} ${it.nome} por ${fmt(total)} berries (${fmt(antes)} → ${fmt(antes - total)}). Já está na mochila.${extras.length ? ` ${extras.join(' ')}` : ''}`, { desfazer: id });
}
function vender(uid) {
  const f = ficha(UI.lojaQuem);
  const v = vagaPorUid(f, uid);
  if (!v || v.equipado) return;
  const it = item(v.itemId);
  const p = precoDeVenda(it.id);
  const id = fazer(`${f.nome} vendeu ${it.nome}`, () => {
    const ff = ficha(f.id);
    const vv = vagaPorUid(ff, uid);
    if (vv.pente && vv.pente.n) poeNaMochila(ff, vv.pente.balaId, vv.pente.n);
    if (it.empilhavel && vv.qtd > 1) vv.qtd -= 1;
    else ff.mochila = ff.mochila.filter((x) => x !== vv);
    ff.berries += p;
    const bb = D.banca.vende.find((x) => x.itemId === it.id);
    if (bb) bb.estoque += 1;
  });
  render();
  avisar(`${f.nome} vendeu 1 ${it.nome} por ${fmt(p)} berries.${v.pente && v.pente.n ? ` As ${v.pente.n} balas do pente voltaram para a mochila.` : ''}`, { desfazer: id });
}
function aplicarPendente(pid, aplicar) {
  const p = D.batalha.pendentes.find((x) => x.id === pid);
  if (!p) return;
  const k = chaveDoTid(p.tid);
  const c = cond(p.cid);
  const nome = nomeDe(k);
  const vis = [];
  let titulo = '';
  const id = fazer(aplicar ? `${c.nome} em ${nome}` : `pulou ${c.nome}`, () => {
    const b = D.batalha;
    b.pendentes = b.pendentes.filter((x) => x.id !== pid);
    const e = est(k);
    if (aplicar) {
      const antes = e.vida;
      e.vida = Math.max(0, e.vida - p.n);
      vis.push({ tipo: 'dano', tid: p.tid, n: antes - e.vida });
      titulo = `${c.nome}: ${nome} perde ${p.n} (vida ${antes} → ${e.vida}).${e.vida === 0 ? ` ${nome} caiu.` : ''}`;
    } else titulo = `O mestre pulou ${c.nome} de ${nome} nesta vez.`;
    b.log.unshift({ titulo, detalhes: aplicar ? 'Condição tira da vida direto: o Escudo não segura.' : '' });
  });
  UI.visuais = vis;
  UI.logNovo = true;
  render();
  anunciar(titulo);
  return id;
}

  const det = [];

function porCondicao(quemFixo) {

function digitando(el) {

}
const janelaAberta = () => dlgDar.open || dlgUsar.open;
function andarNaGrade(el, tecla) {
  const i = Number(el.dataset.i);
  const passo = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -JOG_COLS, ArrowDown: JOG_COLS, Home: -i, End: VAGAS_DO_JOGADOR - 1 - i }[tecla];
  const j = limitar(i + passo, 0, VAGAS_DO_JOGADOR - 1);
  if (j === i) return;
  UI.jogSel = j;
  render();
  focar(`jg-${j}`);
}
document.addEventListener('keydown', (ev) => {
  const el = document.activeElement;
  /* abas de cima e subabas da ficha: setas trocam, Home e End vão às pontas */
  if (el && (el.classList.contains('aba') || el.classList.contains('subaba')) && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(ev.key)) {
    const sub = el.classList.contains('subaba');
    const abas = $$(sub ? '.subaba' : '.aba');
    const i = abas.indexOf(el);
    const j = ev.key === 'Home' ? 0 : ev.key === 'End' ? abas.length - 1 : (i + (ev.key === 'ArrowRight' ? 1 : -1) + abas.length) % abas.length;
    ev.preventDefault();
    if (sub) { UI.mestreAba = abas[j].dataset.v; render(); focar(`sub-${UI.mestreAba}`); }
    else { irPara(abas[j].dataset.aba); $(`#aba-${abas[j].dataset.aba}`).focus(); }
    return;
  }
  /* inventário do jogador: setas andam pela grade, Enter faz a ação principal */
  if (el && el.classList.contains('inv-vaga')) {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(ev.key)) { ev.preventDefault(); andarNaGrade(el, ev.key); return; }
    if (ev.key === 'Enter') { ev.preventDefault(); acaoPrincipalDoJogador(); return; }
  }
  /* grupos de escolha: setas andam e escolhem (a bala só anda: trocar gasta ação) */
  if (el && el.getAttribute('role') === 'radio' && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(ev.key)) {
    const grupo = el.closest('[role="radiogroup"]');
    const soAnda = el.classList.contains('bala-op');
    const ops = $$('[role="radio"]', grupo).filter((o) => soAnda || o.getAttribute('aria-disabled') !== 'true');
    const i = ops.indexOf(el);
    const passo = ev.key === 'ArrowRight' || ev.key === 'ArrowDown' ? 1 : -1;
    const prox = ops[(i + passo + ops.length) % ops.length];
    if (!prox) return;
    ev.preventDefault();
    if (soAnda) { el.tabIndex = -1; prox.tabIndex = 0; prox.focus(); return; }
    const k = prox.dataset.k;
    prox.click();
    focar(k);
    return;
  }
  if (ev.key === 'Enter' && el && el.dataset.fmEtq != null) {
    ev.preventDefault();
    const txt = el.value.trim();
    if (!txt) return;
    const f = ficha(UI.mestreVer);
    if (f.etiquetas.includes(txt)) { avisar(`${f.nome} já tem a etiqueta ${txt}.`); return; }
    const idH = fazer(`etiqueta ${txt}`, () => { ficha(f.id).etiquetas.push(txt); });
    UI.novaEtiqueta = '';
    render();
    focar('fm-etq');
    avisar(`Etiqueta ${txt} em ${f.nome}.`, { desfazer: idH });
    return;
  }
  if (ev.key === 'Escape') {
    if (janelaAberta()) return;
    if (arrasto) { terminarArrasto(true); return; }
    if (UI.modo) { UI.modo = null; UI.escolhidos = []; render(); return; }
    if (el && el.id === 'busca' && UI.busca) { UI.busca = ''; render(); return; }
    if (UI.aba === 'mestre' && UI.novaTec) { UI.novaTec = null; render(); focar('nova-tecnica'); return; }
    if (UI.aba === 'jogador' && UI.jogAberto && !digitando(el)) { UI.jogAberto = false; render(); focar('jog-abrir'); return; }
  }
  if (ev.key === 'F8') {
    const b = $('#avisos .aviso:last-child button');
    if (b) { ev.preventDefault(); b.focus(); }
    return;
  }
  if (digitando(el) || janelaAberta()) return;
  if (ev.key === '/' && UI.aba === 'acervo') { ev.preventDefault(); focar('busca'); return; }
  if (ev.key.toLowerCase() === 'i' && UI.aba === 'jogador' && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
    ev.preventDefault();
    UI.jogAberto = !UI.jogAberto;
    render();
    focar(UI.jogAberto ? `jg-${UI.jogSel}` : 'jog-abrir');
    anunciar(UI.jogAberto ? 'Inventário aberto.' : 'Inventário fechado.');
    return;
  }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); desfazer(); }
});

comecar();
render();
</script>
</body>
</html>
