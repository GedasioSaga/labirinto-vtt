<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itens refeitos (protótipo)</title>
<style>
/* Tokens: os do app (--lb-*), no tom quente pedido para este protótipo (fundo #1b1510 a #2a2119,
   latão #e0a84b, texto creme), mais as tintas do papel que o app já usa nos cartões. */
:root {
  --lb-fundo: #1b1510;
  --lb-fundo-painel: #211a13;
  --lb-fundo-alto: #2a2119;
  --lb-fundo-hover: #33281c;
  --lb-campo: #15100b;
  --lb-filete: rgba(239, 230, 212, 0.09);
  --lb-filete-forte: rgba(239, 230, 212, 0.17);
  --lb-creme: #efe6d4;
  --lb-creme-dim: #bfb39e;
  --lb-creme-tenue: #978c79;
  --lb-latao: #e0a84b;
  --lb-latao-claro: #f4c477;
  --lb-latao-suave: rgba(224, 168, 75, 0.13);
  --lb-latao-filete: rgba(224, 168, 75, 0.34);
  --lb-latao-contraste: #1f1606;
  --lb-dano: #ec7a68;
  --lb-dano-suave: rgba(236, 122, 104, 0.15);
  --lb-cura: #8cc095;
  --lb-cura-suave: rgba(140, 192, 149, 0.15);
  --lb-selo: #b8a0de;
  --lb-selo-suave: rgba(184, 160, 222, 0.16);
  --lb-agua: #86b6d6;
  --lb-agua-suave: rgba(134, 182, 214, 0.15);
  --papel: #ede3cd;
  --papel-tinta: #2a2119;
  --papel-tenue: #665b4b;
  --papel-dano: #8f2e22;
  --papel-cura: #2b6a3c;
  --papel-selo: #5a3f8c;
  --papel-gasto: #2c5578;
  --papel-filete: rgba(42, 33, 25, 0.16);
  --rasgo: polygon(0 3px, 6% 0, 13% 4px, 21% 1px, 28% 3px, 37% 0, 45% 4px, 52% 1px, 60% 3px, 68% 0, 76% 4px, 84% 1px, 92% 3px, 100% 0, calc(100% - 3px) 30%, 100% 60%, calc(100% - 2px) 100%, 92% calc(100% - 3px), 84% 100%, 76% calc(100% - 4px), 68% calc(100% - 1px), 60% calc(100% - 3px), 52% 100%, 45% calc(100% - 4px), 37% calc(100% - 1px), 28% calc(100% - 3px), 21% 100%, 13% calc(100% - 4px), 6% calc(100% - 1px), 0 calc(100% - 3px), 2px 60%, 0 30%);
  --f-display: 'Sitka Banner', 'Sitka Display', Sitka, Constantia, Georgia, serif;
  --f-texto: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
  --f-num: Bahnschrift, 'DIN Alternate', 'Segoe UI Variable Small', 'Segoe UI', system-ui, sans-serif;
  --t-xs: 11.5px;
  --t-sm: 12.5px;
  --t-md: 14px;
  --t-lg: 16px;
  --t-xl: 21px;
  --t-titulo: 30px;
  --r-p: 6px;
  --r-m: 10px;
  --r-g: 14px;
  --r-total: 999px;
  --sombra-flutua: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 6px 14px rgba(0, 0, 0, 0.42), 0 22px 48px rgba(0, 0, 0, 0.55);
  --sombra-foco: 0 0 0 2px var(--lb-fundo), 0 0 0 4px var(--lb-latao);
  --bisel: inset 0 1px 0 rgba(255, 240, 210, 0.07);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --rapido: 120ms;
  --casa: 62px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; font-family: var(--f-texto); font-size: var(--t-md); line-height: 1.5; color: var(--lb-creme); background: var(--lb-fundo); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
button:disabled, [aria-disabled='true'] { cursor: not-allowed; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
:focus-visible { outline: none; box-shadow: var(--sombra-foco); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ------------------------------------------------ faixa do protótipo (não é do app) */
.proto { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-height: 40px; padding: 6px 20px; background: #110d09; border-bottom: 1px dashed var(--lb-filete-forte); font-size: var(--t-sm); color: var(--lb-creme-tenue); }
.proto strong { color: var(--lb-creme-dim); font-weight: 600; }
.proto__sobra { margin-left: auto; }

/* ------------------------------------------------ cabeçalho do app com as abas */
.topo { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 22px; padding: 0 20px; background: linear-gradient(180deg, #221a12, #1d1610); border-bottom: 1px solid var(--lb-filete); }
.marca { display: flex; align-items: center; gap: 9px; font-family: var(--f-display); font-size: 19px; color: var(--lb-creme); white-space: nowrap; }
.marca svg { width: 22px; height: 22px; color: var(--lb-latao); }
.abas { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.aba { position: relative; display: inline-flex; align-items: center; gap: 7px; min-height: 52px; padding: 0 14px; color: var(--lb-creme-tenue); font-weight: 500; white-space: nowrap; transition: color var(--rapido) ease; }
.aba::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--lb-latao); transform: scaleX(0); }
.aba[aria-selected='true'] { color: var(--lb-creme); }
.aba[aria-selected='true']::after { transform: scaleX(1); }
.aba:focus-visible { box-shadow: inset 0 0 0 2px var(--lb-latao); border-radius: var(--r-p); }
.aba__ponto { width: 7px; height: 7px; border-radius: 50%; background: var(--lb-latao); }
@media (hover: hover) and (pointer: fine) { .aba:hover { color: var(--lb-creme); } }

/* ------------------------------------------------ página */
.pg { max-width: 1480px; margin: 0 auto; padding: 26px 24px 120px; }
.pg-cab { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 20px; }
.pg-cab__txt { flex: 1 1 420px; min-width: 0; }
.pg-titulo { font-family: var(--f-display); font-size: var(--t-titulo); font-weight: 400; line-height: 1.1; }
.pg-sub { margin-top: 6px; max-width: 92ch; color: var(--lb-creme-dim); font-size: 15px; }
.pg-acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ------------------------------------------------ primitivos */
.bt { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border-radius: var(--r-p); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete-forte); color: var(--lb-creme); font-weight: 500; white-space: nowrap; box-shadow: var(--bisel); transition: transform var(--rapido) var(--ease-out), background-color var(--rapido) ease, border-color var(--rapido) ease; }
.bt:active:not(:disabled) { transform: scale(0.97); }
.bt:disabled { opacity: 0.45; }
.bt--primario { background: linear-gradient(180deg, var(--lb-latao-claro), var(--lb-latao)); border-color: rgba(0, 0, 0, 0.35); color: var(--lb-latao-contraste); font-weight: 650; }
.bt--latao { background: var(--lb-latao-suave); border-color: var(--lb-latao-filete); color: var(--lb-latao-claro); font-weight: 600; }
.bt--fantasma { background: transparent; border-color: transparent; box-shadow: none; color: var(--lb-creme-dim); }
.bt--p { min-height: 30px; padding: 0 10px; font-size: var(--t-sm); }
.bt--ic { width: 34px; padding: 0; }
.bt .ic { width: 15px; height: 15px; }
.bt kbd { font: 500 10.5px / 1 var(--f-num); padding: 2px 5px; border-radius: 3px; border: 1px solid currentColor; opacity: 0.55; }
@media (hover: hover) and (pointer: fine) {
  .bt:hover:not(:disabled) { border-color: var(--lb-latao-filete); background-color: var(--lb-fundo-hover); }
  .bt--primario:hover:not(:disabled) { background: linear-gradient(180deg, #f8cf8a, #e6b05a); }
  .bt--fantasma:hover:not(:disabled) { background: rgba(255, 236, 200, 0.06); border-color: transparent; color: var(--lb-creme); }
}

.entrada { width: 100%; min-height: 36px; padding: 6px 10px; border-radius: var(--r-p); background: var(--lb-campo); border: 1px solid var(--lb-filete-forte); color: var(--lb-creme); transition: border-color var(--rapido) ease; }
.entrada:focus-visible { border-color: var(--lb-latao); box-shadow: 0 0 0 3px var(--lb-latao-suave); }
.entrada[aria-invalid='true'] { border-color: var(--lb-dano); }
select.entrada { padding-right: 28px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--lb-creme-tenue) 50%), linear-gradient(135deg, var(--lb-creme-tenue) 50%, transparent 50%); background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
select.entrada option { background: var(--lb-fundo-painel); }
textarea.entrada { min-height: 70px; resize: vertical; line-height: 1.45; }
.entrada--num { width: 76px; text-align: center; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.entrada--pequena { width: 64px; }

.campo { display: grid; gap: 5px; align-content: start; min-width: 0; }
.campo > label, .campo__rot { font-size: var(--t-sm); color: var(--lb-creme-dim); }
.campo__ajuda { font-size: var(--t-xs); color: var(--lb-creme-tenue); }
.campo__erro { font-size: var(--t-xs); color: var(--lb-dano); }

.passo { justify-self: start; display: inline-flex; align-items: stretch; border-radius: var(--r-p); border: 1px solid var(--lb-filete-forte); background: var(--lb-campo); overflow: hidden; }
.passo button { width: 34px; display: grid; place-items: center; color: var(--lb-creme-dim); transition: background-color var(--rapido) ease; }
.passo button:active:not(:disabled) { background: var(--lb-latao-suave); }
.passo button:disabled { opacity: 0.35; }
.passo input { width: 64px; min-height: 34px; border: 0; border-inline: 1px solid var(--lb-filete); background: transparent; text-align: center; font-family: var(--f-num); font-size: 16px; font-variant-numeric: tabular-nums; }
.passo input:focus-visible { box-shadow: inset 0 0 0 2px var(--lb-latao); }
.passo input::-webkit-inner-spin-button { display: none; }
@media (hover: hover) and (pointer: fine) { .passo button:hover:not(:disabled) { background: rgba(255, 236, 200, 0.06); color: var(--lb-creme); } }

.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: var(--r-m); background: var(--lb-campo); border: 1px solid var(--lb-filete); }
.seg button { min-height: 30px; padding: 0 12px; border-radius: 7px; color: var(--lb-creme-dim); font-size: var(--t-sm); font-weight: 500; transition: background-color var(--rapido) ease, color var(--rapido) ease; }
.seg button[aria-pressed='true'], .seg button[aria-checked='true'] { background: var(--lb-fundo-alto); color: var(--lb-creme); box-shadow: inset 0 0 0 1px var(--lb-latao-filete), var(--bisel); }
@media (hover: hover) and (pointer: fine) { .seg button:hover:not([aria-pressed='true']):not([aria-checked='true']) { color: var(--lb-creme); } }

.chave { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; color: var(--lb-creme); }
.chave input { position: absolute; opacity: 0; pointer-events: none; }
.chave__trilho { position: relative; width: 38px; height: 22px; flex: none; border-radius: var(--r-total); background: var(--lb-campo); border: 1px solid var(--lb-filete-forte); transition: background-color 160ms ease, border-color 160ms ease; }
.chave__trilho::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--lb-creme-tenue); transition: transform 180ms var(--ease-in-out), background-color 160ms ease; }
.chave input:checked + .chave__trilho { background: var(--lb-latao-suave); border-color: var(--lb-latao-filete); }
.chave input:checked + .chave__trilho::after { transform: translateX(16px); background: var(--lb-latao); }
.chave input:focus-visible + .chave__trilho { box-shadow: var(--sombra-foco); }
.chave input:disabled + .chave__trilho { opacity: 0.55; }
.chave--travada { cursor: default; }

.marca-caixa { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; }
.marca-caixa input { width: 17px; height: 17px; margin: 0; accent-color: var(--lb-latao); }

.etiqueta { display: inline-flex; align-items: center; gap: 5px; min-height: 22px; padding: 0 8px; border-radius: var(--r-total); font-size: var(--t-xs); font-weight: 500; background: rgba(255, 236, 200, 0.06); color: var(--lb-creme-dim); white-space: nowrap; }
.etiqueta--latao { background: var(--lb-latao-suave); color: var(--lb-latao-claro); }
.etiqueta--selo { background: var(--lb-selo-suave); color: var(--lb-selo); }
.etiqueta--dano { background: var(--lb-dano-suave); color: var(--lb-dano); }
.etiqueta--cura { background: var(--lb-cura-suave); color: var(--lb-cura); }

.medalhao { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #3b2f20, #241b12 70%); border: 1px solid var(--lb-latao-filete); color: var(--lb-latao-claro); box-shadow: var(--bisel); }
.medalhao .ic { width: 21px; height: 21px; stroke-width: 1.5; }
.medalhao--g { width: 52px; height: 52px; }
.medalhao--g .ic { width: 27px; height: 27px; }
.medalhao--p { width: 30px; height: 30px; }
.medalhao--p .ic { width: 16px; height: 16px; }

.painel { border-radius: var(--r-g); background: var(--lb-fundo-painel); border: 1px solid var(--lb-filete); }
.painel__cab { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 14px 16px 0; }
.painel__tit { font-family: var(--f-display); font-size: 19px; font-weight: 400; }
.painel__sub { font-size: var(--t-sm); color: var(--lb-creme-tenue); }
.painel__corpo { padding: 12px 16px 16px; }

/* ------------------------------------------------ o cartão de papel (a mesma peça no Acervo, no editor e na ficha) */
.papel { position: relative; padding: 20px 20px 18px; background: var(--papel); color: var(--papel-tinta); clip-path: var(--rasgo); }
.papel__topo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.papel__foto { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--papel-filete); color: var(--papel-tinta); background: rgba(255, 255, 255, 0.35); }
.papel__foto .ic { width: 26px; height: 26px; stroke-width: 1.5; }
.papel__nome { font-family: var(--f-display); font-size: 24px; font-weight: 400; line-height: 1.1; overflow-wrap: anywhere; }
.papel__tipo { margin-top: 2px; font: 500 var(--t-sm) / 1.3 var(--f-num); color: var(--papel-tenue); letter-spacing: 0.02em; }
.papel__preco { align-self: start; font: 500 var(--t-sm) / 1.3 var(--f-num); color: var(--papel-tenue); white-space: nowrap; }
.papel__rot { margin-top: 14px; font-size: var(--t-xs); font-weight: 600; color: var(--papel-tenue); }
.papel__frase { margin-top: 3px; font-size: 14.5px; line-height: 1.55; }
.papel__numeros { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px 12px; padding-top: 10px; border-top: 1px dashed var(--papel-filete); }
.papel__numeros div { min-width: 0; }
.papel__numeros dt { font-size: var(--t-xs); color: var(--papel-tenue); }
.papel__numeros dd { font: 600 14px / 1.3 var(--f-num); overflow-wrap: anywhere; }
.papel__grade { margin-top: 12px; display: flex; gap: 12px; align-items: center; }
.papel__grade svg { width: 92px; height: 92px; flex: none; }
.papel__grade p { font-size: var(--t-sm); color: var(--papel-tenue); }
.papel__selos { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.papel__selo { padding: 1px 7px; border: 1.5px solid currentColor; border-radius: 4px; font: 600 var(--t-xs) / 1.5 var(--f-num); color: var(--papel-gasto); }
.papel__selo[data-c='luz'] { color: #8a5a12; }
.papel__desc { margin-top: 10px; font-size: 13px; line-height: 1.5; font-style: italic; color: var(--papel-tenue); }
.tinta-dano { color: var(--papel-dano); font-weight: 650; }
.tinta-cura { color: var(--papel-cura); font-weight: 650; }
.tinta-selo { color: var(--papel-selo); font-weight: 650; }
.tinta-gasto { color: var(--papel-gasto); font-weight: 650; }

/* ------------------------------------------------ Acervo */
.acervo { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 22px; align-items: start; }
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
.busca { position: relative; flex: 1 1 240px; max-width: 360px; }
.busca .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--lb-creme-tenue); pointer-events: none; }
.busca .entrada { padding-left: 34px; padding-right: 36px; }
.busca kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font: 500 11px / 1 var(--f-num); padding: 3px 6px; border-radius: 4px; border: 1px solid var(--lb-filete-forte); color: var(--lb-creme-tenue); }
.filtros { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.filtro { display: inline-flex; align-items: center; gap: 7px; min-height: 30px; padding: 0 11px; border-radius: var(--r-total); border: 1px solid var(--lb-filete-forte); color: var(--lb-creme-dim); font-size: var(--t-sm); transition: background-color var(--rapido) ease, border-color var(--rapido) ease, color var(--rapido) ease; }
.filtro b { font: 500 var(--t-xs) / 1 var(--f-num); color: var(--lb-creme-tenue); }
.filtro[aria-pressed='true'] { background: var(--lb-latao-suave); border-color: var(--lb-latao-filete); color: var(--lb-creme); }
.filtro[aria-pressed='true'] b { color: var(--lb-latao-claro); }
.filtro .ic { width: 14px; height: 14px; }
@media (hover: hover) and (pointer: fine) { .filtro:hover:not([aria-pressed='true']) { color: var(--lb-creme); border-color: var(--lb-latao-filete); } }

.lista { display: grid; gap: 4px; }
.linha { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding-right: 10px; border-radius: var(--r-m); border: 1px solid transparent; transition: background-color var(--rapido) ease, border-color var(--rapido) ease; }
.linha[data-sel='true'] { background: var(--lb-fundo-alto); border-color: var(--lb-latao-filete); }
.linha__abrir { display: grid; grid-template-columns: 40px minmax(150px, 210px) minmax(0, 1fr) 92px; gap: 14px; align-items: center; min-height: 60px; padding: 8px 4px 8px 12px; border-radius: var(--r-m); }
.linha__abrir:focus-visible { box-shadow: inset 0 0 0 2px var(--lb-latao); }
.linha__nome { display: grid; gap: 3px; min-width: 0; }
.linha__nome strong { font-family: var(--f-display); font-size: 18px; font-weight: 400; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linha__nome .etiqueta { justify-self: start; }
.linha__resumo { min-width: 0; color: var(--lb-creme-dim); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.linha__qtd { text-align: right; font-size: var(--t-xs); color: var(--lb-creme-tenue); line-height: 1.25; }
.linha__qtd b { display: block; font: 500 18px / 1.1 var(--f-num); color: var(--lb-creme); }
.linha__acoes { display: flex; gap: 6px; }
@media (hover: hover) and (pointer: fine) { .linha:hover:not([data-sel='true']) { background: rgba(255, 236, 200, 0.035); } }

.vazio { display: grid; justify-items: start; gap: 10px; padding: 28px 18px; border-radius: var(--r-m); border: 1px dashed var(--lb-filete-forte); color: var(--lb-creme-dim); }

.lado { position: sticky; top: 76px; display: grid; gap: 14px; }
.lado__acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.quem-tem { display: grid; gap: 2px; }
.quem-tem li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--lb-filete); font-size: 13.5px; }
.quem-tem li:last-child { border-bottom: 0; }
.quem-tem b { font: 500 15px / 1.2 var(--f-num); }
.quem-tem small { color: var(--lb-creme-tenue); }
.nota { font-size: var(--t-sm); color: var(--lb-creme-tenue); }

/* ------------------------------------------------ Editor */
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start; }
.editor__form { display: grid; gap: 16px; }
.secao { padding: 18px 20px 20px; border-radius: var(--r-g); background: var(--lb-fundo-painel); border: 1px solid var(--lb-filete); }
.secao__cab { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 14px; }
.secao__tit { font-family: var(--f-display); font-size: 20px; font-weight: 400; }
.secao__sub { font-size: var(--t-sm); color: var(--lb-creme-tenue); max-width: 60ch; }
.secao[data-entra] { animation: entra 200ms var(--ease-out); }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } }
.grade-campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px 16px; }
.grade-campos .largo { grid-column: 1 / -1; }

.tipos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
@media (min-width: 1180px) { .tipos { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; } .tipos .tipo { padding: 12px 10px; } }
.tipo { position: relative; display: grid; gap: 8px; align-content: start; min-height: 118px; padding: 14px; border-radius: var(--r-m); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete-forte); box-shadow: var(--bisel); transition: transform var(--rapido) var(--ease-out), border-color var(--rapido) ease, background-color var(--rapido) ease; }
.tipo:active { transform: scale(0.98); }
.tipo[aria-checked='true'] { background: linear-gradient(180deg, #3a2d1b, #2c2216); border-color: var(--lb-latao); box-shadow: inset 0 0 0 1px var(--lb-latao), var(--bisel); }
.tipo__nome { font-weight: 650; font-size: 15px; }
.tipo__ex { font-size: var(--t-xs); color: var(--lb-creme-tenue); line-height: 1.35; }
.tipo .medalhao { width: 40px; height: 40px; }
.tipo__visto { position: absolute; top: 10px; right: 10px; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--lb-latao); color: var(--lb-latao-contraste); opacity: 0; transform: scale(0.9); transition: opacity 150ms ease, transform 150ms var(--ease-out); }
.tipo__visto .ic { width: 13px; height: 13px; stroke-width: 2.4; }
.tipo[aria-checked='true'] .tipo__visto { opacity: 1; transform: none; }
@media (hover: hover) and (pointer: fine) { .tipo:hover:not([aria-checked='true']) { border-color: var(--lb-latao-filete); background: var(--lb-fundo-hover); } }

.fotos { display: flex; flex-wrap: wrap; gap: 6px; }
.foto-op { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--lb-filete-forte); color: var(--lb-creme-dim); background: var(--lb-campo); transition: border-color var(--rapido) ease, color var(--rapido) ease; }
.foto-op[aria-checked='true'] { border-color: var(--lb-latao); color: var(--lb-latao-claro); box-shadow: inset 0 0 0 1px var(--lb-latao); }
.foto-op .ic { width: 20px; height: 20px; stroke-width: 1.5; }

.alcance { display: grid; grid-template-columns: minmax(0, 1fr) 264px; gap: 18px; align-items: start; margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--lb-filete-forte); }
.formas { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; margin-top: 8px; }
.forma { display: grid; justify-items: center; gap: 6px; padding: 10px 6px 9px; border-radius: var(--r-m); border: 1px solid var(--lb-filete-forte); background: var(--lb-campo); font-size: var(--t-xs); color: var(--lb-creme-dim); text-align: center; line-height: 1.25; transition: border-color var(--rapido) ease, color var(--rapido) ease; }
.forma svg { width: 40px; height: 40px; }
.forma[aria-checked='true'] { border-color: var(--lb-latao); color: var(--lb-creme); box-shadow: inset 0 0 0 1px var(--lb-latao); }
@media (hover: hover) and (pointer: fine) { .forma:hover:not([aria-checked='true']) { border-color: var(--lb-latao-filete); color: var(--lb-creme); } }
.alcance__nums { display: flex; flex-wrap: wrap; gap: 12px 16px; margin-top: 14px; }
.grade-alc { display: grid; gap: 2px; padding: 8px; border-radius: var(--r-m); background: var(--lb-campo); border: 1px solid var(--lb-filete); }
.grade-alc__c { aspect-ratio: 1; border-radius: 2px; background: rgba(239, 230, 212, 0.05); transition: background-color 120ms ease; }
.grade-alc__c[data-c='alc'] { background: rgba(224, 168, 75, 0.3); }
.grade-alc__c[data-c='area'] { background: var(--lb-latao); }
.grade-alc__c[data-c='voce'] { background: var(--lb-agua); border-radius: 50%; }
button.grade-alc__c { cursor: pointer; }
button.grade-alc__c:focus-visible { box-shadow: 0 0 0 2px var(--lb-creme); }
.grade-alc__leg { margin-top: 8px; font-size: var(--t-xs); color: var(--lb-creme-tenue); }
.grade-alc__leg i { display: inline-block; width: 10px; height: 10px; margin: 0 4px -1px 0; border-radius: 2px; }

.efeitos { display: grid; gap: 8px; }
.efeito { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; border-radius: var(--r-m); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete-forte); border-left: 3px solid var(--lb-selo); }
.efeito[data-k2='empurrar'] { border-left-color: var(--lb-agua); }
.efeito[data-k2='curar'] { border-left-color: var(--lb-cura); }
.efeito[data-k2='tirar'] { border-left-color: var(--lb-cura); }
.efeito[data-entra] { animation: entra 180ms var(--ease-out); }
.efeito__txt { color: var(--lb-creme-dim); }
.efeito .entrada { width: auto; min-height: 32px; }
.efeito__tirar { margin-left: auto; }
.mais-efeito { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
.mais-efeito__rot { font-size: var(--t-sm); color: var(--lb-creme-tenue); margin-right: 2px; }

.opcoes { display: grid; gap: 14px; }
.opcao { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.opcao__txt { display: grid; gap: 1px; }
.opcao__txt small { font-size: var(--t-xs); color: var(--lb-creme-tenue); }

.previa { position: sticky; top: 76px; display: grid; gap: 12px; }
.previa__rot { font-size: var(--t-sm); color: var(--lb-creme-tenue); }
.editor__barra { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

/* ------------------------------------------------ Ficha */
.ficha { display: grid; grid-template-columns: 280px minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.retrato { display: grid; gap: 14px; padding: 18px; }
.retrato__cab { display: flex; gap: 12px; align-items: center; }
.retrato__nome { font-family: var(--f-display); font-size: 23px; font-weight: 400; line-height: 1.1; }
.ficha-op { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.vida { display: grid; gap: 5px; }
.vida__rot { display: flex; justify-content: space-between; font-size: var(--t-sm); color: var(--lb-creme-dim); }
.vida__rot b { font: 600 14px / 1.2 var(--f-num); color: var(--lb-creme); }
.vida__barra { height: 8px; border-radius: var(--r-total); background: var(--lb-campo); border: 1px solid var(--lb-filete); overflow: hidden; }
.vida__barra i { display: block; height: 100%; width: 100%; border-radius: inherit; background: linear-gradient(90deg, #6aa575, var(--lb-cura)); transform-origin: left; transition: transform 260ms var(--ease-out); }
.vida__barra[data-inimigo] i { background: linear-gradient(90deg, #c3584a, var(--lb-dano)); }
.atribs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
.atribs div { display: flex; justify-content: space-between; font-size: 13px; color: var(--lb-creme-dim); }
.atribs b { font: 600 14px / 1.2 var(--f-num); color: var(--lb-creme); }
.berries { display: flex; justify-content: space-between; font-size: 13px; color: var(--lb-creme-dim); padding-top: 10px; border-top: 1px solid var(--lb-filete); }
.berries b { font: 600 14px / 1.2 var(--f-num); color: var(--lb-latao-claro); }
.vestido { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.vaga { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 12px; border-radius: var(--r-m); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete-forte); }
.vaga--vazia { border-style: dashed; background: transparent; color: var(--lb-creme-tenue); }
.vaga__txt { display: grid; min-width: 0; }
.vaga__txt small { font-size: var(--t-xs); color: var(--lb-creme-tenue); }
.vaga__txt strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mochila { display: grid; gap: 4px; }
.coisa { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding-right: 10px; border-radius: var(--r-m); border: 1px solid transparent; }
.coisa[data-sel='true'] { background: var(--lb-fundo-alto); border-color: var(--lb-latao-filete); }
.coisa__abrir { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 56px; padding: 7px 4px 7px 10px; border-radius: var(--r-m); }
.coisa__abrir:focus-visible { box-shadow: inset 0 0 0 2px var(--lb-latao); }
.coisa__nome { display: grid; min-width: 0; }
.coisa__nome strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.coisa__nome small { font-size: var(--t-xs); color: var(--lb-creme-tenue); }
.coisa__qtd { font: 500 18px / 1 var(--f-num); color: var(--lb-creme); }
.coisa__qtd small { font-size: var(--t-xs); color: var(--lb-creme-tenue); }
.coisa__acoes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (hover: hover) and (pointer: fine) { .coisa:hover:not([data-sel='true']) { background: rgba(255, 236, 200, 0.035); } }
.subtit { margin: 22px 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.subtit h3 { font-family: var(--f-display); font-size: 19px; font-weight: 400; }
.subtit:first-child { margin-top: 0; }

/* ------------------------------------------------ Batalha */
.batalha { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 22px; align-items: start; }
.mesa { display: grid; gap: 12px; justify-items: start; }
.mesa__aviso { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 8px 10px 8px 14px; border-radius: var(--r-m); background: var(--lb-latao-suave); border: 1px solid var(--lb-latao-filete); color: var(--lb-creme); }
.mesa__aviso p { flex: 1 1 260px; }
.mesa__aviso--quieto { background: transparent; border-color: var(--lb-filete); color: var(--lb-creme-tenue); }
.tabuleiro { position: relative; display: grid; grid-template-columns: repeat(10, var(--casa)); grid-auto-rows: var(--casa); padding: 10px; border-radius: var(--r-g); background: radial-gradient(ellipse at 50% 40%, #2c2318, #1a140e 80%); border: 1px solid var(--lb-filete-forte); touch-action: none; user-select: none; overflow: hidden; }
.casa { position: relative; display: grid; place-items: center; border: 1px solid rgba(239, 230, 212, 0.045); transition: background-color 120ms ease; }
button.casa { cursor: pointer; }
.casa[data-c='alc'] { background: rgba(224, 168, 75, 0.16); }
.casa[data-c='alvo'] { background: rgba(224, 168, 75, 0.16); }
.casa[data-c='ponto'] { background: rgba(224, 168, 75, 0.2); }
.casa[data-area] { background: rgba(236, 122, 104, 0.36); }
.casa[data-arrasto] { background: rgba(134, 182, 214, 0.28); box-shadow: inset 0 0 0 2px var(--lb-agua); }
.casa[data-explodiu] { animation: explode 520ms var(--ease-out); }
@keyframes explode { 0% { background: rgba(255, 214, 140, 0.85); } 100% { background: transparent; } }
button.casa:focus-visible { box-shadow: inset 0 0 0 2px var(--lb-creme); z-index: 2; }
.luz-tocha { position: absolute; pointer-events: none; border-radius: 50%; background: radial-gradient(circle, rgba(255, 190, 100, 0.2), rgba(255, 190, 100, 0.08) 55%, transparent 72%); }
.ficha-t { position: relative; z-index: 3; display: grid; place-items: center; width: min(46px, calc(var(--casa) - 8px)); height: min(46px, calc(var(--casa) - 8px)); border-radius: 50%; font-family: var(--f-display); font-size: 19px; color: var(--lb-creme); background: radial-gradient(circle at 35% 30%, #3e5c70, #1f3442 75%); border: 2px solid var(--lb-agua); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5); cursor: grab; transition: transform var(--rapido) var(--ease-out); }
.ficha-t[data-inimigo] { background: radial-gradient(circle at 35% 30%, #6b3a30, #3b1f19 75%); border-color: var(--lb-dano); }
.ficha-t[data-age] { box-shadow: 0 0 0 3px rgba(224, 168, 75, 0.55), 0 3px 8px rgba(0, 0, 0, 0.5); }
.ficha-t[data-arrastando] { opacity: 0.35; }
.ficha-t[data-atingivel] { box-shadow: 0 0 0 3px var(--lb-latao), 0 3px 8px rgba(0, 0, 0, 0.5); }
.ficha-t[data-na-area] { box-shadow: 0 0 0 3px var(--lb-dano), 0 3px 8px rgba(0, 0, 0, 0.5); }
.ficha-t[data-escolhido] { box-shadow: 0 0 0 3px var(--lb-creme), 0 3px 8px rgba(0, 0, 0, 0.5); }
.ficha-t[data-tomou] { animation: tomou 380ms var(--ease-out); }
@keyframes tomou { 0% { filter: brightness(2.2) saturate(0.4); transform: translateX(-3px); } 40% { transform: translateX(3px); } 100% { filter: none; transform: none; } }
.ficha-t[data-curou] { animation: curou 420ms var(--ease-out); }
@keyframes curou { 0% { box-shadow: 0 0 0 8px rgba(140, 192, 149, 0.6); } 100% { box-shadow: 0 0 0 0 rgba(140, 192, 149, 0); } }
.ficha-t__vida { position: absolute; left: 4px; right: 4px; bottom: -7px; height: 4px; border-radius: 2px; background: rgba(0, 0, 0, 0.6); overflow: hidden; }
.ficha-t__vida i { display: block; height: 100%; background: var(--lb-cura); transform-origin: left; }
.ficha-t[data-inimigo] .ficha-t__vida i { background: var(--lb-dano); }
.fantasma-t { position: fixed; z-index: 70; pointer-events: none; width: 40px; height: 40px; margin: -20px 0 0 -20px; opacity: 0.9; }
.numero-voa { position: absolute; z-index: 5; pointer-events: none; font: 700 19px / 1 var(--f-num); color: var(--lb-dano); text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8); animation: voa 900ms var(--ease-out) forwards; }
.numero-voa[data-cura] { color: var(--lb-cura); }
@keyframes voa { 0% { opacity: 0; transform: translateY(4px) scale(0.9); } 15% { opacity: 1; transform: translateY(-6px) scale(1); } 100% { opacity: 0; transform: translateY(-30px); } }

.combatentes { display: grid; gap: 10px; }
.combatente { display: grid; gap: 7px; padding: 12px 14px; border-radius: var(--r-m); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete); }
.combatente__cab { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.combatente__cab strong { font-weight: 600; }
.combatente__conds { display: flex; flex-wrap: wrap; gap: 5px; min-height: 0; }
.acoes-b { display: grid; gap: 6px; }
.acoes-b__grupo { margin-top: 10px; font-size: var(--t-sm); color: var(--lb-creme-tenue); }
.acao-b { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; min-height: 54px; padding: 8px 12px 8px 8px; border-radius: var(--r-m); background: var(--lb-fundo-alto); border: 1px solid var(--lb-filete-forte); text-align: left; transition: border-color var(--rapido) ease, background-color var(--rapido) ease, transform var(--rapido) var(--ease-out); }
.acao-b:active:not(:disabled) { transform: scale(0.98); }
.acao-b[aria-pressed='true'] { border-color: var(--lb-latao); background: linear-gradient(180deg, #392c1a, #2b2116); }
.acao-b:disabled { opacity: 0.55; }
.acao-b .medalhao { width: 36px; height: 36px; }
.acao-b__txt { display: grid; min-width: 0; }
.acao-b__txt strong { font-weight: 600; }
.acao-b__txt small { font-size: var(--t-xs); color: var(--lb-creme-tenue); }
.acao-b__n { font: 600 18px / 1 var(--f-num); text-align: right; overflow: hidden; }
.acao-b__n small { display: block; font: 400 var(--t-xs) / 1.2 var(--f-texto); color: var(--lb-creme-tenue); }
.acao-b__n span { display: inline-block; }
.acao-b__n span[data-tick] { animation: tick 220ms var(--ease-out); }
@keyframes tick { from { opacity: 0; transform: translateY(70%); } }
.acao-b__sem { font-size: var(--t-xs); font-weight: 600; color: var(--lb-dano); }
@media (hover: hover) and (pointer: fine) { .acao-b:hover:not(:disabled):not([aria-pressed='true']) { border-color: var(--lb-latao-filete); background: var(--lb-fundo-hover); } }
.balas { display: grid; gap: 4px; margin: 2px 0 6px 46px; }
.bala-op { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 9px; align-items: center; min-height: 40px; padding: 4px 12px 4px 10px; border-radius: var(--r-p); border: 1px solid var(--lb-filete); }
.bala-op[aria-checked='true'] { border-color: var(--lb-latao-filete); background: var(--lb-latao-suave); }
.bala-op[aria-disabled='true'] { opacity: 0.75; }
.bala-op__marca { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--lb-creme-tenue); }
.bala-op[aria-checked='true'] .bala-op__marca { border-color: var(--lb-latao); background: radial-gradient(circle, var(--lb-latao) 45%, transparent 50%); }
.bala-op small { font-size: var(--t-xs); color: var(--lb-creme-tenue); }
.pente { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 6px 46px; font-size: var(--t-sm); color: var(--lb-creme-dim); }
.registro { width: 100%; }
.registro ol { display: grid; gap: 2px; max-height: 280px; overflow: auto; }
.registro li { padding: 8px 12px; border-radius: var(--r-p); font-size: 13.5px; color: var(--lb-creme-dim); }
.registro li:first-child { background: var(--lb-fundo-alto); color: var(--lb-creme); }
.registro li small { display: block; margin-top: 2px; font-size: var(--t-sm); line-height: 1.45; color: var(--lb-creme-tenue); }
.registro li[data-entra] { animation: entra 200ms var(--ease-out); }

/* ------------------------------------------------ Como era x como fica */
.casos { display: grid; gap: 18px; }
.caso { display: grid; gap: 14px; padding: 20px; border-radius: var(--r-g); background: var(--lb-fundo-painel); border: 1px solid var(--lb-filete); }
.caso__tit { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.caso__tit h3 { font-family: var(--f-display); font-size: 21px; font-weight: 400; }
.caso__tit p { color: var(--lb-creme-tenue); font-size: var(--t-sm); }
.caso__lados { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.caso__lado { display: grid; gap: 8px; align-content: start; }
.caso__rot { font-size: var(--t-sm); font-weight: 600; }
.caso__rot[data-c='antes'] { color: var(--lb-dano); }
.caso__rot[data-c='agora'] { color: var(--lb-cura); }
.antes { display: grid; gap: 6px; padding: 12px; border-radius: var(--r-m); background: #18130e; border: 1px solid var(--lb-filete); font-size: var(--t-sm); color: var(--lb-creme-tenue); }
.antes__caixa { padding: 8px 10px; border-radius: var(--r-p); border: 1px solid var(--lb-filete-forte); }
.antes__caixa b { display: block; margin-bottom: 3px; color: var(--lb-creme-dim); font-weight: 600; }
.antes__linha { display: flex; flex-wrap: wrap; gap: 5px; }
.antes__campo { padding: 1px 7px; border-radius: 4px; background: rgba(239, 230, 212, 0.05); }
.antes__campo[data-repete] { color: var(--lb-dano); background: var(--lb-dano-suave); outline: 1.5px dashed var(--lb-dano); outline-offset: 1px; }
.caso__solucao { color: var(--lb-creme-dim); }
.caso__solucao strong { color: var(--lb-creme); font-weight: 600; }
.caso .papel { padding: 14px 16px 13px; }
.caso .papel__nome { font-size: 19px; }
.caso .papel__frase { font-size: 13.5px; }
.tabela { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tabela th, .tabela td { padding: 10px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--lb-filete); }
.tabela th { font-size: var(--t-sm); font-weight: 600; color: var(--lb-creme-tenue); }
.tabela td:first-child { color: var(--lb-creme-dim); width: 40%; }

/* ------------------------------------------------ Dar a... (janela) */
dialog.janela { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border-radius: var(--r-g); background: var(--lb-fundo-painel); border: 1px solid var(--lb-filete-forte); color: var(--lb-creme); box-shadow: var(--sombra-flutua); opacity: 1; transform: none; transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out), overlay 200ms allow-discrete, display 200ms allow-discrete; }
dialog.janela::backdrop { background: rgba(10, 7, 4, 0.66); opacity: 1; transition: opacity 200ms ease, overlay 200ms allow-discrete, display 200ms allow-discrete; }
@starting-style { dialog.janela[open] { opacity: 0; transform: scale(0.96); } dialog.janela[open]::backdrop { opacity: 0; } }
dialog.janela[data-saindo] { opacity: 0; transform: scale(0.98); transition-duration: 140ms; }

.janela__cab { display: flex; align-items: center; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--lb-filete); }

.quem { display: grid; gap: 6px; }

.quem__op:has(input:checked) { border-color: var(--lb-latao); background: linear-gradient(180deg, #392c1a, #2b2116); }

.quem__av { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; font-family: var(--f-display); font-size: 17px; background: radial-gradient(circle at 35% 30%, #3e5c70, #1f3442 75%); border: 1.5px solid var(--lb-agua); }
.quem__av[data-npc] { background: radial-gradient(circle at 35% 30%, #6b3a30, #3b1f19 75%); border-color: var(--lb-dano); }
.quem__txt { display: grid; }
.quem__txt small { font-size: var(--t-xs); color: var(--lb-creme-tenue); }
.quem__tem { font: 500 var(--t-sm) / 1.2 var(--f-num); color: var(--lb-creme-tenue); text-align: right; }
.quem__tem b { color: var(--lb-creme); font-size: 15px; }

/* ------------------------------------------------ avisos (com Desfazer) */
.avisos { position: fixed; right: 22px; bottom: 22px; z-index: 80; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.aviso { pointer-events: auto; display: flex; align-items: center; gap: 12px; max-width: min(480px, calc(100vw - 32px)); min-height: 48px; padding: 8px 8px 8px 14px; border-radius: var(--r-m); background: #30261a; border: 1px solid var(--lb-filete-forte); box-shadow: var(--sombra-flutua); transform: translateY(0); opacity: 1; transition: transform 220ms var(--ease-out), opacity 220ms var(--ease-out); }

<script>

const $ = (s, r = document) => r.querySelector(s);

const GLIFOS = {

  lapis: '<path d="M15 4.5 19.5 9 9 19.5H4.5V15z"/><path d="M13 6.5l4.5 4.5"/>',

  pilha: '<path d="M12 3 3 7.5 12 12l9-4.5zM3 12l9 4.5 9-4.5M3 16.5 12 21l9-4.5"/>',
  mao: '<path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11M11 10V4a1.5 1.5 0 0 1 3 0v6M14 10V5.5a1.5 1.5 0 0 1 3 0V13c0 4-2.5 7.5-6.5 7.5-3 0-4.5-1.5-6-4L3 13.5a1.5 1.5 0 0 1 2.5-1.6L8 14"/>',
};
function glifo(nome, cls = 'ic') { return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${GLIFOS[nome] || GLIFOS.saco}</svg>`; }
const FOTOS = ['pistola', 'bala', 'foguete', 'granada', 'boomerang', 'clava', 'espada', 'pocao', 'kit', 'tocha', 'armadura', 'saco'];

/* =============================================================== o vocabulário do sistema */
const ATRIBUTOS = ['Força', 'Destreza', 'Agilidade', 'Percepção', 'Constituição', 'Inteligência'];

const CONDICOES = ['Cura reduzida', 'Sangrando', 'Queimando', 'Atordoado', 'Envenenado', 'Lento'];
const PARTES = ['Corpo', 'Cabeça', 'Mãos', 'Pés', 'Acessório'];

};
const ORDEM_TIPOS = Object.keys(TIPOS);
const EMPILHA_SOZINHO = ['municao', 'arremesso', 'consumivel'];
const ATACA = ['corpo', 'fogo', 'arremesso'];
const COM_ALCANCE = ['corpo', 'fogo', 'arremesso', 'consumivel'];
const COM_ACERTO = ['corpo', 'fogo', 'municao', 'arremesso'];
const FORMAS = {

const ehArea = (forma) => ['linha', 'cruz', 'volta', 'explosao'].includes(forma);
const tamArea = (r) => `${2 * r + 1}x${2 * r + 1}`;

/* =============================================================== dados de exemplo */
function completarItem(i) {

    descricao: '', preco: 0, foto: TIPOS[i.tipo] ? TIPOS[i.tipo].glifo : 'saco',

    bala: { modo: 'soma', valor: 10, atributo: 'Percepção', divisor: 2 },

    ...i,

}
function itensIniciais() {
  return [
    { id: 'rosa', nome: 'Rosa Fúnebre', tipo: 'fogo', foto: 'pistola', preco: 4800, descricao: 'Revólver de cano longo com uma rosa gravada no cabo.',

const vaga = (itemId, qtd, extra = {}) => ({ itemId, qtd, equipado: false, aceso: false, ...extra });

const quantos = (f, id) => f.mochila.filter((v) => v.itemId === id).reduce((a, v) => a + v.qtd, 0);

function arrumarMochila(f) {
  const nova = [];
  for (const v of f.mochila) {
    const it = item(v.itemId);
    if (!it || v.qtd <= 0) continue;
    if (it.empilhavel) {
      const ja = nova.find((x) => x.itemId === v.itemId);
      if (ja) { ja.qtd += v.qtd; ja.equipado = ja.equipado || v.equipado; ja.aceso = ja.aceso || v.aceso; }
      else nova.push({ ...v });
    } else {
      for (let k = 0; k < v.qtd; k++) nova.push({ ...v, qtd: 1, equipado: k === 0 && v.equipado, aceso: k === 0 && v.aceso });
    }
  }
  f.mochila = nova;
}
function poeNaMochila(f, itemId, qtd) {

}
/** Tira n da mochila; prefere as vagas que não estão em uso. Devolve quantos tirou. */
function tiraDaMochila(f, itemId, n) {
  let falta = n;
  const vagas = f.mochila.filter((v) => v.itemId === itemId).sort((a, b) => Number(a.equipado) - Number(b.equipado));
  for (const v of vagas) {
    if (falta <= 0) break;
    const sai = Math.min(v.qtd, falta);
    v.qtd -= sai;
    falta -= sai;
  }
  f.mochila = f.mochila.filter((v) => v.qtd > 0);
  return n - falta;
}

/* =============================================================== alcance: quais casas acendem */
function raioDaGrade(al) {
  const alcance = al.forma === 'explosao' ? al.b + al.raio : al.b;
  return limitar(alcance, 2, 7);
}
function amostraPadrao(al) {
  if (al.forma === 'explosao') return [al.b, 0];
  if (al.forma === 'linha') return [1, 0];
  return null;
}
/** Casas em volta de quem usa: 'alc' = dá para escolher, 'area' = é atingida, 'voce' = quem usa. */
function casasDoAlcance(al, R, amostra, incluiVoce) {
  const m = new Map();
  for (let y = -R; y <= R; y++) {
    for (let x = -R; x <= R; x++) {
      const d = Math.max(Math.abs(x), Math.abs(y));
      let c = null;
      if (al.forma === 'alvo' && d <= al.b && d >= (incluiVoce ? 0 : 1)) c = 'alc';
      if (al.forma === 'anel' && d >= al.a && d <= al.b) c = 'alc';
      if (al.forma === 'linha' && (x === 0 || y === 0) && d >= 1 && d <= al.b) c = 'alc';
      if (al.forma === 'cruz' && (x === 0 || y === 0) && d >= 1 && d <= al.b) c = 'area';
      if (al.forma === 'volta' && d >= 1 && d <= al.b) c = 'area';
      if (al.forma === 'explosao' && d >= al.a && d <= al.b) c = 'alc';
      if (c) m.set(`${x},${y}`, c);
    }
  }
  const am = amostra || amostraPadrao(al);
  if (am && al.forma === 'explosao') {
    for (let y = am[1] - al.raio; y <= am[1] + al.raio; y++) for (let x = am[0] - al.raio; x <= am[0] + al.raio; x++) if (Math.abs(x) <= R && Math.abs(y) <= R) m.set(`${x},${y}`, 'area');
  }
  if (am && al.forma === 'linha') {
    const sx = Math.sign(am[0]);
    const sy = Math.sign(am[1]);
    for (let k = 1; k <= al.b; k++) if (Math.abs(sx * k) <= R && Math.abs(sy * k) <= R) m.set(`${sx * k},${sy * k}`, 'area');
  }
  m.set('0,0', 'voce');
  return m;
}
/** A grade pequena desenhada no cartão de papel. */
function svgAlcance(it) {
  const al = it.alcance;
  const R = raioDaGrade(al);
  const n = 2 * R + 1;
  const t = 100 / n;
  const m = casasDoAlcance(al, R, null, it.tipo === 'consumivel');
  const cores = { alc: '#d9c08d', area: '#b5802c', voce: '#2c5578' };
  let r = '';
  for (let y = -R; y <= R; y++) {
    for (let x = -R; x <= R; x++) {
      const c = m.get(`${x},${y}`);
      const px = (x + R) * t + 0.6;
      const py = (y + R) * t + 0.6;
      const w = t - 1.2;
      if (c === 'voce') r += `<circle cx="${px + w / 2}" cy="${py + w / 2}" r="${w / 2.4}" fill="${cores.voce}"/>`;
      else r += `<rect x="${px}" y="${py}" width="${w}" height="${w}" rx="0.8" fill="${c ? cores[c] : 'rgba(42,33,25,0.08)'}"/>`;
    }
  }
  return `<svg viewBox="0 0 100 100" role="img" aria-label="Grade do alcance: ${esc(txtAlcanceCurto(al, it.tipo === 'consumivel'))}">${r}</svg>`;
}
/** Ícone de cada forma no editor (grade 7x7 com o exemplo aceso). */
function svgForma(forma) {
  const exemplos = { alvo: { a: 1, b: 2 }, anel: { a: 2, b: 3 }, linha: { a: 1, b: 3 }, cruz: { a: 1, b: 2 }, volta: { a: 1, b: 1 }, explosao: { a: 2, b: 2, raio: 1 } };
  const al = { forma, raio: 1, ...exemplos[forma] };
  const R = 3;
  const m = casasDoAlcance(al, R, forma === 'explosao' ? [2, -1] : null, false);
  let r = '';
  for (let y = -R; y <= R; y++) {
    for (let x = -R; x <= R; x++) {
      const c = m.get(`${x},${y}`);
      const fill = c === 'voce' ? 'var(--lb-agua)' : c === 'area' ? 'var(--lb-latao)' : c === 'alc' ? 'rgba(224,168,75,0.38)' : 'rgba(239,230,212,0.07)';
      r += `<rect x="${(x + R) * 14 + 1}" y="${(y + R) * 14 + 1}" width="12" height="12" rx="2" fill="${fill}"/>`;
    }
  }
  return `<svg viewBox="0 0 98 98" aria-hidden="true">${r}</svg>`;
}

    const quanto = e.modo === 'dados' ? `${num('dados', e.dados, 'Quantos dados', 1, 10)}<span class="efeito__txt">d</span>${num('faces', e.faces, 'Lados do dado', 2, 20)}` : num('fixo', e.fixo, 'Quanto cura', 1, 999);

  }
  if (e.tipo === 'tirar') corpo = `<span class="efeito__txt">Tira</span>${sel('cond', e.cond, [...CONDICOES, ['todas', 'todas as condições']], 'Condição que sai')}`;
  return `<li class="efeito" data-k2="${e.tipo}"${entra}>${corpo}${tirar}</li>`;
}
function secaoEfeitos(r, entra) {

  return secao('efeitos', tit, sub, `<ul class="efeitos">${lista || `<li class="nota">${vazio}</li>`}</ul><div class="mais-efeito"><span class="mais-efeito__rot">+ Efeito:</span>${botoes}</div>`, entra);
}
function chave(ch, ligada, rot, ajuda, travada) {

function secaoOpcoes(r, entra) {

function secaoDescricao(r, entra) {

  return secao('descricao', 'Descrição', outros ? 'Para Outros, é o que vale. Escreva como o item é.' : 'Opcional. Só para ambientar: as regras já estão nos campos.', `<div class="campo"><label class="sr" for="ed-desc">Descrição</label><textarea id="ed-desc" class="entrada" maxlength="280" data-campo="descricao" data-k="ed-desc" placeholder="Ex.: Pau com pano embebido em óleo.">${esc(r.descricao)}</textarea></div>`, entra);

/* ------------------------------------------------ editor: mudanças */
function definir(obj, caminho, valor) {
  const p = caminho.split('.');
  let o = obj;
  for (let i = 0; i < p.length - 1; i++) o = o[p[i]];
  o[p[p.length - 1]] = valor;
}
function marcarSujo() {
  UI.sujo = true;
  const e = $('#ed-estado');
  if (e) e.hidden = false;
  const d = $('#ed-descartar');
  if (d) d.hidden = false;
  marcarAbaDoEditor();
}
function atualizarPrevia() {
  const r = UI.rascunho;
  if (!r || !r.tipo) return;
  const p = $('#previa-cartao');
  if (p) p.innerHTML = cartao(r);
  const g = $('#grade-alc');
  if (g) g.innerHTML = gradeAlcance(r);
  marcarSujo();
}
function aoDigitarNoEditor(el) {
  const r = UI.rascunho;
  if (el.dataset.campo) {
    const v = el.hasAttribute('data-num') ? inteiro(el.value, 0) : el.value;
    definir(r, el.dataset.campo, v);
    if (el.dataset.campo === 'nome' && UI.erroNome && el.value.trim()) {
      UI.erroNome = false;
      el.removeAttribute('aria-invalid');
      const m = $('#ed-nome-erro');
      if (m) m.remove();
    }
  } else if (el.dataset.ef != null) {
    const e = r.efeitos[Number(el.dataset.ef)];
    e[el.dataset.p] = el.hasAttribute('data-num') ? inteiro(el.value, 0) : el.value;
  }
  atualizarPrevia();
}
function aoMudarNoEditor(el) {
  const r = UI.rascunho;
  if (el.tagName === 'SELECT' && el.dataset.campo) {
    const v = el.dataset.campo === 'alcance.raio' ? inteiro(el.value, 1) : el.value;
    definir(r, el.dataset.campo, v);
  } else if (el.tagName === 'SELECT' && el.dataset.ef != null) {
    const e = r.efeitos[Number(el.dataset.ef)];
    const v = el.dataset.p === 'pct' ? inteiro(el.value, 50) : el.dataset.p === 'dur' && el.value !== 'fim' ? inteiro(el.value, 1) : el.value;
    e[el.dataset.p] = v;
  } else if (el.dataset.ch === 'aceita') {
    r.aceita = el.checked ? [...r.aceita, el.value] : r.aceita.filter((x) => x !== el.value);
  } else if (el.dataset.ch) {
    definir(r, el.dataset.ch, el.checked);
  } else {
    return;
  }
  UI.sujo = true;
  render();
}
function normalizarItem(r) {
  const al = r.alcance;
  al.b = Math.max(r.tipo === 'consumivel' ? 0 : 1, al.b);
  al.a = Math.max(al.forma === 'explosao' ? 0 : 1, Math.min(al.a, al.b));
  r.alvos = limitar(r.alvos, 1, 6);
  r.capacidade = Math.max(1, r.capacidade);
  r.bala.divisor = Math.max(1, r.bala.divisor);
  r.luz.raio = Math.max(1, r.luz.raio);
  if (EMPILHA_SOZINHO.includes(r.tipo)) r.empilhavel = true;
  r.efeitos = efeitosValidos(r).map((e) => ({ ...e, n: Math.max(1, e.n || 1), dados: Math.max(1, e.dados || 1), faces: Math.max(2, e.faces || 2), fixo: Math.max(1, e.fixo || 1) }));
  if (r.tipo !== 'fogo') r.aceita = [];
}
function salvarRascunho() {
  const r = UI.rascunho;
  if (!r.tipo) {
    avisar('Escolha o tipo do item antes de salvar.');
    const t = $('.tipo');
    if (t) t.focus();
    return;
  }
  if (!r.nome.trim()) {
    UI.erroNome = true;
    render();
    const n = $('#ed-nome');
    if (n) { n.focus(); n.scrollIntoView({ block: 'center' }); }
    return;
  }
  r.nome = r.nome.trim();
  normalizarItem(r);
  const novo = !UI.editId;
  const copia = clone(r);
  if (novo) copia.id = `it-${Date.now().toString(36)}`;
  const id = fazer(novo ? `criou ${copia.nome}` : `salvou ${copia.nome}`, () => {
    if (novo) D.itens.push(copia);
    else D.itens[D.itens.findIndex((x) => x.id === UI.editId)] = copia;
    D.fichas.forEach(arrumarMochila);
  });
  UI.sel = copia.id;
  UI.rascunho = null;
  UI.editId = null;
  UI.sujo = false;
  UI.filtro = UI.filtro === 'todos' || UI.filtro === copia.tipo ? UI.filtro : 'todos';
  irPara('acervo');
  avisar(novo ? `${copia.nome} entrou no Acervo.` : `Mudanças em ${copia.nome} salvas. Já valem nas mochilas e na batalha.`, { desfazer: id });
  const linha = $(`[data-k="sel-${copia.id}"]`);
  if (linha) { linha.focus({ preventScroll: true }); linha.scrollIntoView({ block: 'nearest' }); }
}

/* =============================================================== regras que a ficha e a batalha usam */
const lugarDe = (it) => (it.tipo === 'corpo' || it.tipo === 'fogo' ? 'Mão' : it.tipo === 'equipamento' ? it.parte : null);
const condsDe = (id) => (D.batalha.cond[id] || []);
function defesaDe(f) {
  const vest = f.mochila.filter((v) => v.equipado).map((v) => item(v.itemId)).filter((it) => it && it.tipo === 'equipamento' && it.defesa > 0);
  if (!vest.length) return null;
  return { defesa: vest.reduce((s, it) => s + it.defesa, 0), nome: juntar(vest.map((it) => it.nome)) };
}
function poeCondicao(id, e) {
  if (!D.batalha.cond[id]) D.batalha.cond[id] = [];
  D.batalha.cond[id] = D.batalha.cond[id].filter((c) => c.nome !== e.cond).concat({ nome: e.cond, pct: e.pct, dur: e.dur });
}
function rolar(e) {
  if (e.modo !== 'dados') return { valor: e.fixo, conta: `${e.fixo}` };
  const d = Array.from({ length: e.dados }, () => 1 + Math.floor(Math.random() * e.faces));
  const valor = d.reduce((s, n) => s + n, 0);
  return { valor, conta: `${e.dados}d${e.faces}: ${d.join(' + ')}` };
}
/** Os efeitos de "Ao usar" em quem recebe. Devolve as frases para o registro e o aviso. */
function aplicarUso(it, alvoId, det, vis) {
  const alvo = ficha(alvoId);
  for (const e of efeitosValidos(it)) {
    if (e.tipo === 'curar') {
      const r = rolar(e);
      const cr = condsDe(alvoId).find((c) => c.nome === 'Cura reduzida');
      const recebe = cr ? Math.floor((r.valor * (100 - cr.pct)) / 100) : r.valor;
      const antes = alvo.vida;
      alvo.vida = Math.min(alvo.vidaMax, alvo.vida + recebe);
      const corte = cr ? ` A Cura reduzida ${cr.pct}% corta: recupera só ${recebe}.` : ` Recupera ${recebe}.`;
      det.push(`Cura ${r.valor} (${r.conta}).${corte} Vida de ${alvo.nome}: ${antes} → ${alvo.vida}.`);
      vis.push({ tipo: 'cura', id: alvoId, n: alvo.vida - antes });
    }
    if (e.tipo === 'tirar') {
      const antes = condsDe(alvoId).length;
      if (D.batalha.cond[alvoId]) D.batalha.cond[alvoId] = e.cond === 'todas' ? [] : D.batalha.cond[alvoId].filter((c) => c.nome !== e.cond);
      const saiu = antes - condsDe(alvoId).length;
      det.push(saiu ? `Tirou ${e.cond === 'todas' ? 'as condições' : e.cond} de ${alvo.nome}.` : `${alvo.nome} não estava com ${e.cond === 'todas' ? 'nenhuma condição' : e.cond}.`);
    }
    if (e.tipo === 'condicao') {
      poeCondicao(alvoId, e);
      det.push(`${alvo.nome} fica ${txtCond(e)}.`);
    }
  }
}
function empurrar(deId, alvoId, n) {
  const p = D.batalha.pos;
  const [ax, ay] = p[deId];
  let [x, y] = p[alvoId];
  const sx = Math.sign(x - ax);
  const sy = Math.sign(y - ay);
  let andou = 0;
  for (let k = 0; k < n; k++) {
    const nx = x + sx;
    const ny = y + sy;
    const ocupada = Object.entries(p).some(([id, q]) => id !== alvoId && q[0] === nx && q[1] === ny);
    if ((sx === 0 && sy === 0) || nx < 0 || ny < 0 || nx >= COLS || ny >= LINHAS || ocupada) break;
    x = nx;
    y = ny;
    andou++;
  }
  p[alvoId] = [x, y];
  return andou;
}
function aplicarAoAcertar(efs, deId, alvo, det) {
  for (const e of efs) {
    if (e.tipo === 'condicao') {
      poeCondicao(alvo.id, e);
      det.push(`${alvo.nome} fica ${txtCond(e)}.`);
    }
    if (e.tipo === 'empurrar') {
      const n = empurrar(deId, alvo.id, e.n);
      det.push(n ? `${alvo.nome} foi empurrado ${n} ${pl(n, 'casa', 'casas')}.` : `${alvo.nome} não tinha para onde ser empurrado.`);
    }
  }
}
function calcularDano(a, it, bala, alvo) {
  const p = [];
  if (bala && bala.bala.modo === 'troca') p.push([bala.bala.valor, `${bala.nome} troca o dano`]);
  else p.push([it.dano, it.nome]);
  if (it.soma) p.push([atrib(a, it.soma), it.soma]);
  if (bala && bala.bala.modo === 'soma') p.push([bala.bala.valor, bala.nome]);
  if (bala && bala.bala.modo === 'atributo') p.push([Math.floor(atrib(a, bala.bala.atributo) / bala.bala.divisor), `${bala.bala.atributo}/${bala.bala.divisor}, da bala`]);
  const def = defesaDe(alvo);
  if (def) p.push([-def.defesa, def.nome]);
  const total = Math.max(0, p.reduce((s, [v]) => s + v, 0));
  const conta = p.map(([v, t], i) => `${i === 0 ? '' : v < 0 ? ' − ' : ' + '}${Math.abs(v)} (${t})`).join('');
  return { total, conta };
}

/* =============================================================== D) Ficha */
function telaFicha() {
  const f = ficha(UI.fichaVer) || ficha('vincent');

  const lugares = ['Mão', 'Corpo'];
  f.mochila.forEach((v) => { const l = v.equipado && lugarDe(item(v.itemId)); if (l && !lugares.includes(l)) lugares.push(l); });
  const vestido = lugares.map((l) => {
    const v = f.mochila.find((x) => x.equipado && lugarDe(item(x.itemId)) === l);
    if (!v) return `<div class="vaga vaga--vazia"><span class="medalhao medalhao--p">${glifo(l === 'Mão' ? 'mao' : 'armadura')}</span><span class="vaga__txt"><small>${l}</small><span>Nada equipado</span></span></div>`;
    const it = item(v.itemId);
    return `<div class="vaga"><span class="medalhao medalhao--p">${glifo(it.foto)}</span><span class="vaga__txt"><small>${l}</small><strong>${esc(it.nome)}</strong></span></div>`;
  }).join('');
  if (!f.mochila.some((v) => v.itemId === UI.fichaSel)) UI.fichaSel = f.mochila[0] ? f.mochila[0].itemId : null;
  const linhas = f.mochila.map((v, i) => linhaMochila(f, v, i)).join('');
  const vazia = '<li class="vazio"><p>Mochila vazia. O mestre dá itens pelo Acervo, com Dar a...</p><button type="button" class="bt bt--p" data-acao="aba" data-v="acervo" data-k="mochila-vazia">Ir ao Acervo</button></li>';
  const sel = UI.fichaSel ? item(UI.fichaSel) : null;
  const conds = condsDe(f.id);
  return `
  <div class="pg-cab"><div class="pg-cab__txt"><h1 class="pg-titulo">Ficha de ${esc(f.nome)}</h1><p class="pg-sub">A ficha não guarda cópia de item: só a mochila, com as quantidades, e o que está equipado. O Atacar da batalha lê daqui.</p></div></div>
  <div class="ficha-op" role="group" aria-label="Ver a ficha de">${qual}</div>
  <div class="ficha">
    <section class="painel retrato" aria-label="Quem é">
      <div class="retrato__cab"><span class="quem__av" style="width:52px;height:52px;font-size:24px" ${f.npc ? 'data-npc' : ''} aria-hidden="true">${esc(f.nome[0])}</span><div><h2 class="retrato__nome">${esc(f.nome)}</h2><p class="nota">${f.npc ? 'NPC do mestre' : 'Jogador'}</p></div></div>
      ${barraDeVida(f)}
      ${conds.length ? `<div class="combatente__conds">${conds.map(etiquetaCond).join('')}</div>` : ''}
      <div class="atribs">${Object.entries(f.atrib).map(([k, n]) => `<div><span>${k}</span><b>${n}</b></div>`).join('')}</div>
      <div class="berries"><span>Berries</span><b>${fmt(f.berries)}</b></div>
    </section>
    <section aria-label="Equipado e mochila">
      <div class="subtit"><h3>Equipado</h3><span class="nota">Uma coisa por lugar</span></div>
      <div class="vestido">${vestido}</div>
      <div class="subtit"><h3>Mochila</h3><span class="nota num">${f.mochila.reduce((s, v) => s + v.qtd, 0)} coisas em ${f.mochila.length} ${pl(f.mochila.length, 'vaga', 'vagas')}</span></div>
      <ul class="mochila">${linhas || vazia}</ul>
    </section>
    <aside class="ficha__lado lado" aria-label="Cartão do item">
      ${sel ? `${cartao(sel)}<button type="button" class="bt" data-acao="ver-no-acervo" data-id="${sel.id}" data-k="ver-acervo">Abrir no Acervo</button><p class="nota">O cartão vem do Acervo. Mudou lá, muda aqui.</p>` : ''}
    </aside>

}
function barraDeVida(f) {
  const pct = f.vidaMax ? f.vida / f.vidaMax : 0;
  return `<div class="vida"><div class="vida__rot"><span>Vida</span><b>${f.vida} / ${f.vidaMax}</b></div><div class="vida__barra" ${f.npc ? 'data-inimigo' : ''} role="img" aria-label="Vida ${f.vida} de ${f.vidaMax}"><i style="transform:scaleX(${pct})"></i></div></div>`;
}
function etiquetaCond(c) {
  const t = c.nome === 'Cura reduzida' ? `Cura reduzida ${c.pct}%` : c.nome;
  return `<span class="etiqueta etiqueta--selo" title="${esc(txtDur(c.dur))}">${esc(t)} <small>${c.dur === 'fim' ? 'até o fim' : `${c.dur} ${pl(c.dur, 'turno', 'turnos')}`}</small></span>`;
}
function linhaMochila(f, v, i) {
  const it = item(v.itemId);
  const acoes = [];
  if (it.tipo === 'consumivel') {
    acoes.push(it.onde.fora
      ? `<button type="button" class="bt bt--p bt--latao" data-acao="usar-fora" data-f="${f.id}" data-id="${it.id}" data-k="uf-${it.id}">Usar</button>`
      : '<span class="nota">Só na batalha</span><button type="button" class="bt bt--p" disabled>Usar</button>');
  }
  if (lugarDe(it)) acoes.push(`<button type="button" class="bt bt--p" data-acao="equipar" data-f="${f.id}" data-i="${i}" data-k="eq-${i}">${v.equipado ? 'Guardar' : 'Equipar'}</button>`);
  if (it.luz.ligada) acoes.push(`<button type="button" class="bt bt--p" data-acao="acender" data-f="${f.id}" data-i="${i}" data-k="ac-${i}" aria-pressed="${v.aceso}">${glifo('luz')}${v.aceso ? 'Apagar' : 'Acender'}</button>`);
  const extra = [v.equipado ? `Equipado: ${lugarDe(it)}` : '', v.aceso ? 'Aceso' : ''].filter(Boolean).join('. ');
  const s = it.id === UI.fichaSel;
  return `<li class="coisa" data-sel="${s}">
    <button type="button" class="coisa__abrir" data-acao="ver-coisa" data-id="${it.id}" data-k="vc-${i}" aria-pressed="${s}">
      <span class="medalhao">${glifo(it.foto)}</span>
      <span class="coisa__nome"><strong>${esc(it.nome)}</strong><small>${TIPOS[it.tipo].nome}${extra ? `. ${extra}` : ''}</small></span>
      <span class="coisa__qtd">${it.empilhavel ? `<small>x</small>${v.qtd}` : ''}</span>
    </button>
    <div class="coisa__acoes">${acoes.join('')}</div>
  </li>`;
}
function usarFora(f, it) {
  const det = [];
  const vis = [];
  const antes = quantos(f, it.id);
  const id = fazer(`${f.nome} usou ${it.nome}`, () => {
    tiraDaMochila(f, it.id, 1);
    aplicarUso(it, f.id, det, vis);
  });
  render();
  avisar(`${f.nome} usou ${it.nome}. ${det.join(' ')} ${it.nome}: ${antes} → ${antes - 1}.`, { desfazer: id });
}
function equipar(f, i) {
  const v = f.mochila[i];
  const it = item(v.itemId);
  const lugar = lugarDe(it);
  const ia = v.equipado;
  const id = fazer(ia ? `guardou ${it.nome}` : `equipou ${it.nome}`, () => {
    if (ia) { v.equipado = false; return; }
    f.mochila.forEach((o) => { if (o.equipado && lugarDe(item(o.itemId)) === lugar) o.equipado = false; });
    v.equipado = true;
  });
  render();
  avisar(ia ? `${it.nome} voltou para a mochila.` : `${f.nome} equipou ${it.nome} (${lugar}).`, { desfazer: id });
}

/* =============================================================== E) Batalha */
const posDe = (id) => D.batalha.pos[id];

function leituraDoModo() {

  const al = it.alcance;
  const [ax, ay] = posDe(m.ator);
  const usar = it.tipo === 'consumivel';
  const casas = new Map();
  for (let y = 0; y < LINHAS; y++) {
    for (let x = 0; x < COLS; x++) {
      const dx = x - ax;
      const dy = y - ay;
      const d = Math.max(Math.abs(dx), Math.abs(dy));
      let c = null;
      if (al.forma === 'alvo' && d <= al.b && d >= (usar ? 0 : 1)) c = 'alvo';
      if (al.forma === 'anel' && d >= al.a && d <= al.b) c = 'alvo';
      if (al.forma === 'explosao' && d >= al.a && d <= al.b) c = 'ponto';
      if (al.forma === 'linha' && (dx === 0 || dy === 0) && d >= 1 && d <= al.b) c = 'ponto';
      if ((al.forma === 'cruz' && (dx === 0 || dy === 0) && d >= 1 && d <= al.b) || (al.forma === 'volta' && d >= 1 && d <= al.b)) c = 'ponto';
      if (c) casas.set(`${x},${y}`, c);

let arrasto = null;
function casaSob(x, y) {
  const el = document.elementFromPoint(x, y);
  const c = el && el.closest('#tabuleiro .casa');
  return c ? [Number(c.dataset.x), Number(c.dataset.y)] : null;
}
document.addEventListener('pointerdown', (ev) => {
  const t = ev.target.closest('#tabuleiro .ficha-t');
  if (!t || UI.modo || ev.button !== 0) return;
  arrasto = { id: t.dataset.id, x0: ev.clientX, y0: ev.clientY, andando: false, el: t, fantasma: null, alvo: null };
});
document.addEventListener('pointermove', (ev) => {
  if (!arrasto) return;
  if (!arrasto.andando && Math.hypot(ev.clientX - arrasto.x0, ev.clientY - arrasto.y0) < 5) return;
  if (!arrasto.andando) {
    arrasto.andando = true;
    arrasto.fantasma = arrasto.el.cloneNode(true);
    arrasto.fantasma.classList.add('fantasma-t');
    document.body.appendChild(arrasto.fantasma);
    arrasto.el.setAttribute('data-arrastando', '');
  }
  arrasto.fantasma.style.transform = `translate(${ev.clientX}px, ${ev.clientY}px)`;
  arrasto.fantasma.style.left = '0';
  arrasto.fantasma.style.top = '0';
  const c = casaSob(ev.clientX, ev.clientY);
  $$('#tabuleiro [data-arrasto]').forEach((n) => n.removeAttribute('data-arrasto'));
  arrasto.alvo = null;
  if (c && !fichaNaCasa(c[0], c[1])) {
    arrasto.alvo = c;
    const n = $(`#tabuleiro .casa[data-x="${c[0]}"][data-y="${c[1]}"]`);
    if (n) n.setAttribute('data-arrasto', '');
  }
});
function terminarArrasto(cancelou) {
  if (!arrasto) return;
  const a = arrasto;
  arrasto = null;
  if (a.fantasma) a.fantasma.remove();
  if (!a.andando) {
    if (!cancelou && NA_BATALHA.includes(a.id)) { UI.ator = a.id; render(); }
    return;
  }
  if (cancelou || !a.alvo) { render(); return; }
  fazer(`moveu ${ficha(a.id).nome}`, () => { D.batalha.pos[a.id] = a.alvo; });
  render();
}
document.addEventListener('pointerup', () => terminarArrasto(false));
document.addEventListener('pointercancel', () => terminarArrasto(true));

/* =============================================================== avisos */
function anunciar(t) { $('#anuncio').textContent = t; }
function avisar(texto, opcoes = {}) {
  const { desfazer: idH = null, rotulo = 'Desfazer', acao = null } = opcoes;
  const box = $('#avisos');
  while (box.children.length >= 3) box.firstElementChild.remove();
  const el = document.createElement('div');
  el.className = 'aviso';
  el.setAttribute('role', 'status');
  el.setAttribute('data-entrando', '');
  const temAcao = idH || acao;
  el.innerHTML = `${glifo('visto')}<p>${esc(texto)}</p>${temAcao ? `<button type="button" class="bt bt--p bt--latao" data-av="acao">${glifo('desfazer')}${esc(rotulo)}</button>` : ''}<button type="button" class="bt bt--fantasma bt--ic" data-av="fechar" aria-label="Fechar aviso">${glifo('x')}</button>`;
  box.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.removeAttribute('data-entrando')));
  let restante = temAcao ? 7000 : 4500;
  let inicio = Date.now();
  let t = setTimeout(sair, restante);
  const pausar = () => { clearTimeout(t); restante -= Date.now() - inicio; };
  const seguir = () => { inicio = Date.now(); clearTimeout(t); t = setTimeout(sair, Math.max(1500, restante)); };
  el.addEventListener('pointerenter', pausar);
  el.addEventListener('pointerleave', seguir);
  el.addEventListener('focusin', pausar);
  el.addEventListener('focusout', seguir);
  function sair() {
    clearTimeout(t);
    if (!el.isConnected) return;
    el.setAttribute('data-saindo', '');
    setTimeout(() => el.remove(), 160);
  }
  el.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-av]');
    if (!b) return;
    sair();
    if (b.dataset.av === 'acao') { if (idH) desfazer(idH); else acao(); }
  });
}

  const t = ev.target.closest('[data-acao]');

  const { acao } = t.dataset;

    case 'recomecar':
      comecar();
      Object.assign(UI, { aba: 'acervo', sel: 'prata', filtro: 'todos', busca: '', rascunho: null, editId: null, sujo: false, modo: null, escolhidos: [], conhecidos: {}, contagens: {}, fichaVer: 'vincent', ator: 'vincent', balaDe: {} });
      if ($('#janela-dar').open) fecharDar();
      render();
      avisar('Tudo voltou ao começo.');
      break;
    case 'aba': irPara(v); break;
    case 'ir': irPara(v); break;
    case 'filtro': UI.filtro = v; render(); break;
    case 'limpar-busca': UI.busca = ''; render(); $('#busca').focus(); break;
    case 'selecionar': UI.sel = id; render(); break;
    case 'novo': abrirEditor(null, v && TIPOS[v] ? v : null); break;
    case 'editar': case 'abrir-editor': abrirEditor(id); break;
    case 'dar': abrirDar(id); break;
    case 'dar40': abrirDar(id, 40); break;
    case 'ver-no-acervo': UI.sel = id; UI.filtro = 'todos'; UI.busca = ''; irPara('acervo'); { const n = $(`[data-k="sel-${id}"]`); if (n) { n.focus({ preventScroll: true }); n.scrollIntoView({ block: 'center' }); } } break;
    /* editor */
    case 'tipo': { const r = UI.rascunho; const ant = r.tipo; if (ant === v) break; aplicarTipo(r, v, ant); UI.sujo = true; UI.amostra = null; render(); break; }
    case 'foto': UI.rascunho.foto = v; UI.sujo = true; render(); break;
    case 'forma': { const al = UI.rascunho.alcance; al.forma = v; if (v === 'explosao') { al.a = Math.max(0, Math.min(al.a, 2)); al.b = Math.max(al.b, 3); } UI.amostra = null; UI.sujo = true; render(); break; }
    case 'amostra': UI.amostra = [Number(t.dataset.x), Number(t.dataset.y)]; { const g = $('#grade-alc'); if (g) g.innerHTML = gradeAlcance(UI.rascunho); } break;
    case 'bala-modo': UI.rascunho.bala.modo = v; UI.sujo = true; render(); break;
    case 'cura-modo': UI.rascunho.efeitos[Number(t.dataset.i)].modo = v; UI.sujo = true; render(); break;
    case 'mais-efeito': {
      const base = { condicao: { tipo: 'condicao', cond: 'Cura reduzida', pct: 50, dur: 'fim' }, empurrar: { tipo: 'empurrar', n: 1 }, curar: { tipo: 'curar', modo: 'dados', dados: 2, faces: 6, fixo: 10 }, tirar: { tipo: 'tirar', cond: 'Envenenado' } };
      UI.rascunho.efeitos.push({ ...base[v] });
      UI.efeitoNovo = UI.rascunho.efeitos.length - 1;
      UI.sujo = true;
      render();
      const n = $(`[data-k="ef-${UI.rascunho.efeitos.length - 1}-${v === 'empurrar' ? 'n' : v === 'curar' ? 'md' : 'cond'}"]`);
      if (n) n.focus();
      break;
    }
    case 'tirar-efeito': UI.rascunho.efeitos.splice(Number(t.dataset.i), 1); UI.sujo = true; render(); { const n = $('[data-k^="mais-"]'); if (n) n.focus(); } break;
    case 'descartar': {
      const antes = { rascunho: clone(UI.rascunho), editId: UI.editId };
      UI.rascunho = UI.editId ? clone(item(UI.editId)) : null;
      UI.sujo = false;
      UI.erroNome = false;
      if (!UI.rascunho) { irPara('acervo'); } else render();
      avisar('Mudanças descartadas.', { rotulo: 'Voltar a elas', acao: () => { UI.rascunho = antes.rascunho; UI.editId = antes.editId; UI.sujo = true; irPara('editor'); } });
      break;
    }
    case 'salvar': salvarRascunho(); break;
    /* dar */
    case 'fechar-dar': fecharDar(); break;
    case 'dar-menos': UI.dar.qtd = Math.max(1, UI.dar.qtd - (ev.shiftKey ? 10 : 1)); renderDar(); break;
    case 'dar-mais': UI.dar.qtd = Math.min(999, UI.dar.qtd + (ev.shiftKey ? 10 : 1)); renderDar(); break;
    case 'dar-jogadores': UI.dar.para = D.fichas.filter((f) => !f.npc).map((f) => f.id); renderDar(); break;
    case 'dar-nenhum': UI.dar.para = []; renderDar(); break;
    case 'confirmar-dar': confirmarDar(); break;
    /* ficha */
    case 'ver-ficha': UI.fichaVer = v; UI.fichaSel = null; render(); break;
    case 'ver-coisa': UI.fichaSel = id; render(); break;
    case 'usar-fora': usarFora(ficha(t.dataset.f), item(id)); break;
    case 'equipar': equipar(ficha(t.dataset.f), Number(t.dataset.i)); break;
    case 'acender': {
      const f = ficha(t.dataset.f);
      const vg = f.mochila[Number(t.dataset.i)];
      const it = item(vg.itemId);
      const liga = !vg.aceso;
      const idH = fazer(liga ? `acendeu ${it.nome}` : `apagou ${it.nome}`, () => { vg.aceso = liga; });
      render();
      avisar(liga ? `${it.nome} acesa: ilumina ${it.luz.raio} casas em volta de ${f.nome}${NA_BATALHA.includes(f.id) ? ', também na Batalha' : ''}.` : `${it.nome} apagada.`, { desfazer: idH });
      break;
    }
    /* batalha */
    case 'ator': UI.ator = v; UI.modo = null; UI.escolhidos = []; render(); break;
    case 'arma': case 'usar': comecarModo(id); break;
    case 'bala': {
      const a = ficha(UI.ator);
      UI.balaDe[chavePente(a.id, t.dataset.arma)] = v;
      const arma = item(t.dataset.arma);
      if (quantos(a, arma.id) && penteDe(a.id, arma) > 0) { UI.modo = { ator: a.id, itemId: arma.id, balaId: v }; UI.escolhidos = []; }
      render();
      break;
    }
    case 'recarregar': recarregar(id); break;
    case 'casa': clicarCasa(Number(t.dataset.x), Number(t.dataset.y)); break;
    case 'confirmar-alvos': executar(UI.escolhidos.slice()); break;
    case 'cancelar-modo': UI.modo = null; UI.escolhidos = []; render(); break;
    case 'desfazer': desfazer(); break;
    case 'encerrar': encerrarBatalha(); break;
    default: break;
  }
});

document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.id === 'busca') { UI.busca = el.value; render(); return; }
  if (el.id === 'dar-qtd') {
    if (el.value === '') return;
    UI.dar.qtd = limitar(inteiro(el.value, 1), 1, 999);
    atualizarDarSemMexerNoCampo();
    return;
  }
  if (UI.aba === 'editor' && el.closest('#form-item') && el.tagName !== 'SELECT' && el.type !== 'checkbox' && (el.dataset.campo || el.dataset.ef != null)) aoDigitarNoEditor(el);
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset.darPara) {
    const fid = el.dataset.darPara;
    UI.dar.para = el.checked ? [...UI.dar.para, fid] : UI.dar.para.filter((x) => x !== fid);
    renderDar();
    return;
  }
  if (el.id === 'dar-qtd') { el.value = UI.dar.qtd; return; }
  if (UI.aba === 'editor' && el.closest('#form-item') && (el.tagName === 'SELECT' || el.type === 'checkbox')) aoMudarNoEditor(el);
});

const tab = $('#tela');
tab.addEventListener('pointerover', (ev) => {
  const c = ev.target.closest('#tabuleiro button.casa[data-c="ponto"]');
  if (c) mostrarArea(Number(c.dataset.x), Number(c.dataset.y));
});
tab.addEventListener('focusin', (ev) => {
  const c = ev.target.closest('#tabuleiro button.casa[data-c="ponto"]');
  if (c) mostrarArea(Number(c.dataset.x), Number(c.dataset.y));
});
tab.addEventListener('pointerout', (ev) => {
  if (ev.target.closest('#tabuleiro') && !(ev.relatedTarget && ev.relatedTarget.closest && ev.relatedTarget.closest('#tabuleiro'))) limparArea();
});

const dlg = $('#janela-dar');
dlg.addEventListener('cancel', (ev) => { ev.preventDefault(); fecharDar(); });
dlg.addEventListener('click', (ev) => { if (ev.target === dlg) fecharDar(); });
dlg.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && ev.target.id === 'dar-qtd') { ev.preventDefault(); confirmarDar(); }
});

function digitando(el) {
  return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable) && el.type !== 'checkbox';
}
document.addEventListener('keydown', (ev) => {
  const el = document.activeElement;
  /* abas: setas trocam, Home e End vão às pontas */
  if (el && el.classList.contains('aba') && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(ev.key)) {
    const abas = $$('.aba');
    const i = abas.indexOf(el);
    const j = ev.key === 'Home' ? 0 : ev.key === 'End' ? abas.length - 1 : (i + (ev.key === 'ArrowRight' ? 1 : -1) + abas.length) % abas.length;
    ev.preventDefault();
    irPara(abas[j].dataset.aba);
    $(`#aba-${abas[j].dataset.aba}`).focus();
    return;
  }
  /* grupos de escolha (tipo, foto, forma, bala...): setas andam e escolhem */
  if (el && el.getAttribute('role') === 'radio' && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(ev.key)) {
    const grupo = el.closest('[role="radiogroup"]');
    const ops = $$('[role="radio"]', grupo).filter((o) => o.getAttribute('aria-disabled') !== 'true');
    const i = ops.indexOf(el);
    const passo = ev.key === 'ArrowRight' || ev.key === 'ArrowDown' ? 1 : -1;
    const prox = ops[(i + passo + ops.length) % ops.length];
    if (!prox) return;
    ev.preventDefault();
    const k = prox.dataset.k;
    prox.click();
    const n = k && $(`[data-k="${CSS.escape(k)}"]`);
    if (n) n.focus();
    return;
  }
  if (ev.key === 'Escape') {
    if ($('#janela-dar').open) return;
    if (arrasto) { terminarArrasto(true); return; }
    if (UI.modo) { UI.modo = null; UI.escolhidos = []; render(); return; }
    if (el && el.id === 'busca' && UI.busca) { UI.busca = ''; render(); return; }
  }
  if (ev.key === 'F8') {
    const b = $('#avisos .aviso:last-child button');
    if (b) { ev.preventDefault(); b.focus(); }
    return;
  }
  if (digitando(el)) return;
  if (ev.key === '/' && UI.aba === 'acervo') { ev.preventDefault(); $('#busca').focus(); return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z' && !$('#janela-dar').open) { ev.preventDefault(); desfazer(); }
});

comecar();
render();
</script>
</body>
</html>
