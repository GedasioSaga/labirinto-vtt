<script>
'use strict'
;(() => {
/* ============================================================== utilidades */
const $ = (s, r = document) => r.querySelector(s)
const $$ = (s, r = document) => [...r.querySelectorAll(s)]
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const EASE_OUT = 'cubic-bezier(0.23, 1, 0.32, 1)'
const EASE_IN_OUT = 'cubic-bezier(0.77, 0, 0.175, 1)'
const palco = $('#palco')
const camada = $('#camada')
const mqRM = matchMedia('(prefers-reduced-motion: reduce)')
let rmManual = false
const reduzido = () => mqRM.matches || rmManual
const clone = (o) => JSON.parse(JSON.stringify(o))
const uid = (p) => `${p}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`
const limitar = (v, a, b) => Math.max(a, Math.min(b, v))
const ic = (id) => `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#ic-${id}"/></svg>`

function rng(semente) {
  let s = semente >>> 0
  return () => {
    s = (s + 0x6d2b79f5) >>> 0
    let t = s
    t = Math.imul(t ^ (t >>> 15), t | 1)
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}
/** Escurece ou clareia uma cor. O contorno do Meio-Termo é a própria cor a ~60%. */
function tom(hex, f) {
  const n = parseInt(String(hex).slice(1), 16) || 0
  const c = [n >> 16 & 255, n >> 8 & 255, n & 255].map((v) => Math.max(0, Math.min(255, Math.round(v * f))))
  return '#' + ((1 << 24) | (c[0] << 16) | (c[1] << 8) | c[2]).toString(16).slice(1)
}
/** WAAPI que respeita o movimento reduzido: no reduzido só a troca de opacidade (ou nada). */
function animar(el, quadros, opcoes, quadrosReduzidos) {
  if (!el || !el.animate) return null
  if (reduzido()) return quadrosReduzidos ? el.animate(quadrosReduzidos, { duration: 160, easing: 'ease' }) : null
  return el.animate(quadros, opcoes)
}
let avisoTimer = 0
function aviso(texto, tom_ = '') {
  const el = $('#aviso')
  el.textContent = texto
  el.dataset.tom = tom_
  el.classList.add('is-visivel')
  clearTimeout(avisoTimer)
  avisoTimer = setTimeout(() => el.classList.remove('is-visivel'), 3000)
}
function quando(t) {
  const d = new Date(t)
  const p = (n) => String(n).padStart(2, '0')
  return `${p(d.getDate())}/${p(d.getMonth() + 1)} ${p(d.getHours())}:${p(d.getMinutes())}`
}
function gerarGrao() {
  const c = document.createElement('canvas')
  c.width = c.height = 96
  const g = c.getContext('2d')
  const img = g.createImageData(96, 96)
  const r = rng(7)
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 110 + r() * 60
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v
    img.data[i + 3] = 255
  }
  g.putImageData(img, 0, 0)
  document.documentElement.style.setProperty('--pz-grao', `url(${c.toDataURL()})`)
}
/** Engrenagens desenhadas por código (dentes trapezoidais, contorno no tom escuro da cor). */
function engrenagem(id, dentes, rE, rI, cor, furoQuadrado) {
  const passo = (Math.PI * 2) / dentes
  const pt = (r, a) => `${(24 + Math.sin(a) * r).toFixed(2)} ${(24 - Math.cos(a) * r).toFixed(2)}`
  let d = ''
  for (let k = 0; k < dentes; k++) {
    const b = k * passo
    d += `${k ? 'L' : 'M'}${pt(rI, b)}L${pt(rE, b + passo * 0.14)}L${pt(rE, b + passo * 0.4)}L${pt(rI, b + passo * 0.54)}`

/** Imagem do mestre: lida no navegador (FileReader) e reduzida, para caber no localStorage. */
function lerImagem(arquivo, lado, formato = 'image/jpeg') {
  return new Promise((ok, falha) => {
    if (!arquivo || !arquivo.type.startsWith('image/')) { falha(new Error('Escolha um arquivo de imagem (PNG, JPG ou WebP).')); return }
    const leitor = new FileReader()
    leitor.onerror = () => falha(new Error('Não deu para ler o arquivo.'))
    leitor.onload = () => {
      const img = new Image()
      img.onerror = () => falha(new Error('O arquivo não abriu como imagem.'))
      img.onload = () => {
        const f = Math.min(1, lado / Math.max(img.width, img.height))
        const c = document.createElement('canvas')
        c.width = Math.max(1, Math.round(img.width * f))
        c.height = Math.max(1, Math.round(img.height * f))
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height)
        ok(c.toDataURL(formato, 0.82))
      }
      img.src = leitor.result
    }
    leitor.readAsDataURL(arquivo)
  })
}

/* ============================================================== arte dos modelos (SVG, Meio-Termo de perto), com as cores do mestre */
function parede(semente, y0, y1, base) {
  const r = rng(semente)
  let s = `<rect y="${y0}" width="1600" height="${y1 - y0}" fill="${tom(base, 0.62)}"/>`
  const alt = 66
  for (let y = y0, fila = 0; y < y1; y += alt, fila++) {
    let x = -(fila % 2) * 70 - r() * 40
    while (x < 1600) {
      const w = 120 + r() * 100
      s += `<rect x="${x.toFixed(1)}" y="${y + 3}" width="${(w - 6).toFixed(1)}" height="${Math.min(alt, y1 - y) - 6}" rx="8" fill="${tom(base, 0.88 + r() * 0.22)}"/>`
      x += w
    }
  }
  return s
}
function chao(semente, y0, base) {
  const r = rng(semente)
  let s = `<rect y="${y0}" width="1600" height="${1000 - y0}" fill="${tom(base, 0.6)}"/>`
  for (let y = y0, fila = 0; y < 1000; fila++) {
    const alt = 70 + fila * 18
    let x = -r() * 120
    while (x < 1600) {
      const w = 190 + r() * 120 + fila * 30
      s += `<rect x="${x.toFixed(1)}" y="${y + 4}" width="${(w - 8).toFixed(1)}" height="${alt - 8}" rx="10" fill="${tom(base, 0.86 + r() * 0.2)}"/>`
      x += w
    }
    y += alt
  }
  return s
}

</defs>`
const veu = (p) => `<rect width="1600" height="1000" fill="url(#${p}l)"/><rect width="1600" height="1000" fill="url(#${p}v)"/>`
const musgo = (pts) => pts.map(([x, y, rx]) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${rx * 0.45}" fill="#7a9a5e" stroke="#4c5c3c" stroke-width="3"/>`).join('')
/** Texto do mestre gravado na arte: quebra em linhas pela largura e encolhe se precisar. */
function textoSvg(t, x, y, tam, cor, largura, maxLinhas = 1, extra = '') {
  const txt = String(t || '').trim()
  if (!txt) return ''
  const porLinha = Math.max(6, Math.floor(largura / (tam * 0.5)))
  const palavras = txt.split(/\s+/)
  const linhas = []
  let atual = ''
  for (const p of palavras) {
    if ((atual + ' ' + p).trim().length > porLinha && atual) { linhas.push(atual); atual = p } else atual = (atual + ' ' + p).trim()
  }
  if (atual) linhas.push(atual)
  const usadas = linhas.slice(0, maxLinhas)
  if (linhas.length > maxLinhas) usadas[maxLinhas - 1] = usadas[maxLinhas - 1].replace(/.{0,2}$/, '…')
  const maior = Math.max(...usadas.map((l) => l.length))
  const f = Math.min(1, porLinha / maior)
  const tt = tam * f
  return `<text x="${x}" y="${y - ((usadas.length - 1) * tt * 1.2) / 2}" text-anchor="middle" style="font:400 ${tt.toFixed(1)}px 'Sitka Banner', Constantia, Georgia, serif" fill="${cor}" ${extra}>${usadas.map((l, i) => `<tspan x="${x}" dy="${i ? tt * 1.2 : 0}">${esc(l)}</tspan>`).join('')}</text>`
}

}

/* ============================================================== a tela de perto (jogador): a mesma para o teste e para o jogo */
const nao = (motivo = 'Não encaixa aqui.') => ({ ok: false, motivo })
const SIM = { ok: true }
function progInicial(c) {
  return {
    pos: Object.fromEntries(c.encaixes.map((e) => [e.id, null])),
    rodas: c.resposta.numeros.map(() => 0), simb: c.resposta.simbolos.map(() => 0),
    rel: { h: 12, m: 0, angH: 0, angM: 0 }, seq: 0, resolvido: false, erros: 0, ganhador: null,
  }
}
/** As peças do teste: as da resposta e duas que não servem, numa mochila de mentira. */
function pecasDeTeste(c) {
  const certas = [...new Set(c.encaixes.map((e) => e.peca).filter(Boolean))]
  const r = rng(certas.length * 31 + c.encaixes.length)
  const outras = todasPecas().filter((p) => !certas.includes(p)).sort(() => r() - 0.5).slice(0, 2)
  const lista = TIPOS_PECA.has(c.tipo) ? [...certas, ...outras].sort(() => r() - 0.5) : []
  while (lista.length < 8) lista.push(null)
  return lista
}
function novaSessao(cfg, modo, extra = {}) {
  const s = { cfg, modo, lugarId: extra.lugarId || null, lugar: extra.lugar || '', jogador: estado.jogadorAtual, sel: null, abrindo: false, cartao: false, docNovo: false, novos: new Set() }
  if (modo === 'teste') {
    s.prog = progInicial(cfg)
    s.mochila = pecasDeTeste(cfg)
  } else {
    const pg = estado.progresso[s.lugarId]
    const valido = pg && Object.keys(pg.pos).length === cfg.encaixes.length && pg.rodas.length === cfg.resposta.numeros.length && pg.simb.length === cfg.resposta.simbolos.length
    if (!valido) estado.progresso[s.lugarId] = progInicial(cfg)
    s.prog = estado.progresso[s.lugarId]
    s.mochila = estado.jogadores[s.jogador].mochila
  }
  return s
}
const ehTeste = (s) => s.modo === 'teste'
function guardarSessao(s) { if (!ehTeste(s)) salvar() }
const conjunto = (c) => c.encaixes.map((e) => e.peca).filter(Boolean)
function tirarDaMochila(s, peca) { const i = s.mochila.indexOf(peca); if (i >= 0) s.mochila[i] = null }
function porNaMochila(s, peca) {
  const i = s.mochila.indexOf(null)
  if (i < 0) { s.mochila.push(peca); return s.mochila.length - 1 }
  s.mochila[i] = peca

}

/* ---------------------------------------------------------------- castigo e desfecho */
function castigarPz(s, motivo) {
  const k = s.cfg.castigo, teste = ehTeste(s)
  s.prog.erros++
  const fim = teste ? ' (No teste, nada acontece de verdade.)' : ''
  if (k.tipo === 'nada') aviso(`${motivo} Nada acontece.`)
  else if (k.tipo === 'dano') {
    if (!teste) { const j = estado.jogadores[s.jogador]; j.pv = Math.max(0, j.pv - k.dano); pintarMochilaPz(s) }
    piscar('dano'); sacudirQuadro()
    aviso(`${motivo} ${k.texto || CASTIGO_PADRAO.dano}: −${k.dano} PV.${fim}`, 'perigo')
  } else if (k.tipo === 'armadilha') { piscar('armadilha'); sacudirQuadro(); aviso(`${motivo} ${k.texto || CASTIGO_PADRAO.armadilha}${fim}`, 'perigo') }
  else if (k.tipo === 'barulho') { piscar('barulho'); aviso(`${motivo} ${k.texto || CASTIGO_PADRAO.barulho}${fim}`, 'latao') }
  if (!teste) { registrar(`${s.jogador} errou em ${s.cfg.nome}${k.tipo === 'nada' ? '' : ` (${NOME_CASTIGO[k.tipo].toLowerCase()})`}`); salvar() }
}
function resolverPz(s) {
  const c = s.cfg, p = s.prog
  if (p.resolvido) return
  p.resolvido = true
  p.ganhador = s.jogador
  s.sel = null
  if (!ehTeste(s)) {
    const j = estado.jogadores[s.jogador]
    for (const it of c.desfecho.itens) j.itens.push(it)
    s.docNovo = c.desfecho.doc ? darDocumento(s.jogador, c.desfecho.doc, 'puzzle', c.nome) : false
    registrar(`${s.jogador} resolveu ${c.nome}`)
    if (ehPortaVisual(c) && portaMapa(c.desfecho.porta)) { registrar(`A ${portaMapa(c.desfecho.porta).nome.toLowerCase()} se abriu (${portaMapa(c.desfecho.porta).onde})`); ui.portaAbriu = s.lugarId }
    salvar()
    pintarBarraJ()
  }
  s.abrindo = c.visual.tipo === 'modelo'
  pintarQuadroPz(s); pintarEstadoPz(s); pintarMochilaPz(s)
  const espera = reduzido() ? 160 : s.abrindo ? 1000 : 260
  setTimeout(() => {
    s.abrindo = false
    s.cartao = true
    if (ui.sessao === s) mostrarCartaoPz(s)
  }, espera)
}
function mostrarCartaoPz(s) {
  const q = pzEl('.quadro')
  if (!q || q.querySelector('[data-resultado]')) return
  q.insertAdjacentHTML('beforeend', htmlResultadoPz(s))
  const card = q.querySelector('[data-resultado]')
  animar(q.querySelector('[data-veu]'), [{ opacity: 0 }, { opacity: 1 }], { duration: 240, easing: EASE_OUT }, [{ opacity: 0 }, { opacity: 1 }])
  animar(card, [{ opacity: 0, transform: 'translate(-50%, -50%) scale(0.96)' }, { opacity: 1, transform: 'translate(-50%, -50%) scale(1)' }], { duration: 260, easing: EASE_OUT }, [{ opacity: 0 }, { opacity: 1 }])
  card.querySelector('.bt--primario')?.focus()
}
function fecharResultadoPz(s) {
  s.cartao = false
  palco.querySelectorAll('[data-pz] [data-resultado], [data-pz] [data-veu]').forEach((n) => n.remove())
}

/* ---------------------------------------------------------------- arrastar uma peça da mochila (com a pausa que já mostra o alvo) */
let arrasto = null
let ignorarClique = false
function comecarArrasto() {
  const a = arrasto
  a.ativo = true
  a.fantasma = document.createElement('div')
  a.fantasma.className = 'fantasma'
  a.fantasma.innerHTML = svgPeca(a.peca)
  document.body.appendChild(a.fantasma)
  a.item.classList.add('is-levantado')
  document.body.classList.add('arrastando')
  palco.querySelectorAll('[data-pz] [data-alvo]').forEach((el) => { if (el.getAttribute('aria-disabled') !== 'true') el.classList.toggle('is-pode', aceita(ui.sessao, el.dataset.enc, a.peca).ok) })
}
function marcarAlvo(el) {
  const a = arrasto
  if (el === a.alvo) return
  a.alvo?.classList.remove('is-pairando-ok', 'is-pairando-nao')
  a.alvo = el
  if (el) el.classList.add(aceita(ui.sessao, el.dataset.enc, a.peca).ok ? 'is-pairando-ok' : 'is-pairando-nao')
}
function limparArrasto() {
  document.body.classList.remove('arrastando')
  palco.querySelectorAll('.is-pairando-ok, .is-pairando-nao, [data-pz] [data-alvo].is-pode').forEach((el) => el.classList.remove('is-pairando-ok', 'is-pairando-nao', 'is-pode'))
}
function devolverFantasma(a) {
  const f = a.fantasma
  const r = a.item.isConnected ? a.item.getBoundingClientRect() : null
  if (!r || reduzido()) { f.remove(); a.item.classList.remove('is-levantado'); return }
  const anim = f.animate([{ transform: f.style.transform }, { transform: `translate3d(${r.left + r.width / 2 - 32}px, ${r.top + r.height / 2 - 32}px, 0) scale(1)` }], { duration: 200, easing: EASE_OUT })
  anim.onfinish = () => { f.remove(); a.item.classList.remove('is-levantado') }
}
function soltarArrasto() {
  const a = arrasto
  arrasto = null
  limparArrasto()
  ignorarClique = true
  setTimeout(() => { ignorarClique = false }, 0)
  const s = ui.sessao
  if (a.alvo && aceita(s, a.alvo.dataset.enc, a.peca).ok) { a.fantasma.remove(); porPz(s, a.alvo.dataset.enc, a.peca); return }
  if (a.alvo) recusar(a.alvo, aceita(s, a.alvo.dataset.enc, a.peca).motivo)
  devolverFantasma(a)
}
function cancelarArrasto() {
  if (!arrasto) return false
  const a = arrasto
  arrasto = null
  limparArrasto()
  if (a.ativo) devolverFantasma(a)
  return true
}
let arrastoPonteiro = null
palco.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0 || !ui.sessao) return
  const g = ev.target.closest('[data-pz] [data-ponteiro]')
  if (g && !ui.sessao.prog.resolvido) {
    arrastoPonteiro = { q: g.dataset.ponteiro, svg: g.ownerSVGElement, id: ev.pointerId }
    g.ownerSVGElement.setPointerCapture(ev.pointerId)
    ev.preventDefault()
    return
  }
  const item = ev.target.closest('[data-pz] .item[data-peca]')
  if (!item || arrasto) return
  arrasto = { peca: item.dataset.peca, item, x0: ev.clientX, y0: ev.clientY, id: ev.pointerId, ativo: false, alvo: null, fantasma: null }
  try { item.setPointerCapture(ev.pointerId) } catch { /* ponteiro já solto */ }
})
palco.addEventListener('pointermove', (ev) => {
  const p = arrastoPonteiro
  if (p && ev.pointerId === p.id && ui.sessao) {
    const r = p.svg.getBoundingClientRect()
    let ang = (Math.atan2(ev.clientX - (r.left + r.width / 2), -(ev.clientY - (r.top + r.height / 2))) * 180) / Math.PI
    if (ang < 0) ang += 360
    const a = ui.sessao.prog.rel
    if (p.q === 'm') {
      const mNovo = (Math.round(ang / 30) * 5) % 60
      if (mNovo === a.m) return
      let T = (a.h % 12) * 60 + mNovo
      if (a.m >= 45 && mNovo < 15) T += 60
      if (a.m < 15 && mNovo >= 45) T -= 60
      relogioPor(ui.sessao, T, false)
    } else {
      const hNovo = ((Math.round((ang - a.m / 2) / 30) % 12) + 12) % 12
      if (hNovo === a.h % 12) return
      relogioPor(ui.sessao, hNovo * 60 + a.m, false)
    }
    return
  }
  if (!arrasto || ev.pointerId !== arrasto.id) return
  if (!arrasto.ativo) {
    if (Math.hypot(ev.clientX - arrasto.x0, ev.clientY - arrasto.y0) < 6) return
    comecarArrasto()
  }
  arrasto.fantasma.style.transform = `translate3d(${ev.clientX - 32}px, ${ev.clientY - 32}px, 0) scale(1.08)`
  const sob = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-pz] [data-alvo]')
  marcarAlvo(sob && sob.getAttribute('aria-disabled') !== 'true' ? sob : null)
})
palco.addEventListener('pointerup', (ev) => {
  if (arrastoPonteiro && ev.pointerId === arrastoPonteiro.id) { arrastoPonteiro = null; return }
  if (!arrasto || ev.pointerId !== arrasto.id) return
  if (arrasto.ativo) soltarArrasto()
  else arrasto = null
})
palco.addEventListener('pointercancel', () => { arrastoPonteiro = null; cancelarArrasto() })
let rodaAcumulado = 0
palco.addEventListener('wheel', (ev) => {
  const jan = ev.target.closest('[data-pz] [data-roda]')
  if (!jan || jan.tabIndex < 0 || !ui.sessao) return
  ev.preventDefault()
  rodaAcumulado += ev.deltaY
  if (Math.abs(rodaAcumulado) < 40) return
  girarRodaPz(ui.sessao, +jan.dataset.k, rodaAcumulado < 0 ? 1 : -1, true)
  rodaAcumulado = 0
}, { passive: false })

function repintarEditor(foco) {

function marcarSujo() {

  const s = palco.querySelector('[data-sujo]')
  if (s) { s.classList.add('is-sujo'); s.textContent = 'Mudanças guardadas no editor, ainda não salvas no puzzle' }

/** Toda mudança de estrutura passa aqui: guarda o antes para o Desfazer e grava no navegador. */
function mudarEd(fn, foco) {
  ui.desfazer.push(clone(ed()))
  if (ui.desfazer.length > 40) ui.desfazer.shift()
  fn(ed())
  marcarSujo()
  salvar()
  repintarEditor(foco)
}
function desfazerEd() {
  const antes = ui.desfazer.pop()
  if (!antes) { aviso('Nada para desfazer.'); return }
  // o encaixe que volta fica escolhido (Delete logo depois tira o mesmo); um que some sai da seleção
  const atuais = new Set(ed().encaixes.map((e) => e.id))
  const voltou = antes.encaixes.find((e) => !atuais.has(e.id))
  if (voltou) ui.encSel = voltou.id
  else if (ui.encSel && !antes.encaixes.some((e) => e.id === ui.encSel)) ui.encSel = null
  estado.ed.cfg = antes
  marcarSujo()
  salvar()
  repintarEditor(ui.encSel ? `[data-enc-ed="${ui.encSel}"]` : undefined)
  aviso('Desfeito.')
}
function abrirNoEditor(alvo, cfg) {
  estado.ed = { alvo, cfg: clone(cfg), sujo: false }
  ui.desfazer = []
  ui.encSel = null
  salvar()
  ir('editor')
}
function salvarEd(como) {
  const c = ed()
  if (!c.nome.trim()) { aviso('Dê um nome ao puzzle antes de salvar.', 'perigo'); return }
  if (como === 'novo') {
    const novo = clone(c)
    novo.id = uid('pz')
    estado.modelos.push(novo)
    estado.ed.alvo = { tipo: 'modelo', id: novo.id }
    estado.ed.cfg.id = novo.id
    aviso(`“${c.nome}” guardado em Meus puzzles.`, 'feito')
  } else if (como === 'modelo') {
    const i = estado.modelos.findIndex((m) => m.id === estado.ed.alvo.id)
    if (i < 0) { aviso('O modelo foi apagado. Use “Salvar como novo”.', 'perigo'); return }
    estado.modelos[i] = clone(c)
    aviso('Modelo salvo. As cópias que já estão nos lugares não mudam.', 'feito')
  } else if (como === 'copia') {
    const l = lugarPorId(estado.ed.alvo.id)
    if (!l) { aviso('Esse lugar não existe mais.', 'perigo'); return }
    l.cfg = clone(c)
    delete estado.progresso[l.id]
    aviso(`Cópia salva em ${l.lugar.split(' · ')[0]}. O modelo continua igual.`, 'feito')
  }
  estado.ed.sujo = false
  registrar(`O mestre salvou ${c.nome}`)
  salvar()
  repintarEditor()
}
function aplicarModeloEd(m) {
  mudarEd((c) => {
    const b = BASE[m]
    c.visual = { tipo: 'modelo', modelo: m, imagem: null, cores: { ...b.cores }, inscricao: b.inscricao, moldura: c.visual.moldura || 'original' }
    c.tipo = b.tipo
    c.qualquer = b.qualquer
    c.encaixes = encaixesDoModelo(m)
    c.controle = { ...b.controle }
  })
  aviso(`Modelo ${NOME_MODELO[m]} aplicado. Desfazer volta ao que estava.`)
}
async function usarImagemEd(arquivo) {

    mudarEd((c) => { c.visual = { ...c.visual, tipo: 'imagem', imagem: img } })

/* ---------------------------------------------------------------- arrastar e redimensionar na imagem */
let edArrasto = null
function iniciarEdArrasto(ev, tipo, el, id) {
  const q = palco.querySelector('[data-ed-quadro]')
  const r = q.getBoundingClientRect()
  const c = ed()
  const alvo = tipo === 'controle' ? c.controle : c.encaixes.find((e) => e.id === id)
  edArrasto = { tipo, el, id, r, x0: ev.clientX, y0: ev.clientY, bx: alvo.x, by: alvo.y, bt: alvo.t, bs: alvo.s, ponteiro: ev.pointerId, moveu: false, antes: clone(c) }
  try { el.setPointerCapture(ev.pointerId) } catch { /* já solto */ }
  ev.preventDefault()
}
function moverEdArrasto(ev) {
  const a = edArrasto
  const dx = ev.clientX - a.x0, dy = ev.clientY - a.y0
  if (!a.moveu && Math.hypot(dx, dy) < 3) return
  a.moveu = true
  if (a.tipo === 'alca') {
    a.novoT = limitar(a.bt + ((Math.max(dx, dy) * 2) / a.r.width) * 100, 3, 22)
    a.el.style.width = `${a.novoT}cqw`
    return
  }
  a.el.classList.add('is-arrastando')
  const nx = limitar(a.bx + (dx / a.r.width) * 100, 0, 100), ny = limitar(a.by + (dy / a.r.height) * 100, 0, 100)
  a.nx = nx; a.ny = ny
  const px = ((nx - a.bx) / 100) * a.r.width, py = ((ny - a.by) / 100) * a.r.height
  a.el.style.transform = `translate(calc(-50% + ${px.toFixed(1)}px), calc(-50% + ${py.toFixed(1)}px))${a.tipo === 'controle' ? ` scale(${a.bs})` : ''}`
}
function soltarEdArrasto() {
  const a = edArrasto
  edArrasto = null
  if (!a.moveu) return
  ui.desfazer.push(a.antes)
  const c = ed()
  if (a.tipo === 'alca') { const e = c.encaixes.find((x) => x.id === a.id); if (e) e.t = +a.novoT.toFixed(1) }
  else if (a.tipo === 'controle') { c.controle.x = +a.nx.toFixed(1); c.controle.y = +a.ny.toFixed(1) }
  else { const e = c.encaixes.find((x) => x.id === a.id); if (e) { e.x = +a.nx.toFixed(1); e.y = +a.ny.toFixed(1) } }
  marcarSujo()
  salvar()
  repintarEditor(a.tipo === 'controle' ? '[data-ctl-ed]' : `[data-enc-ed="${a.id}"]`)
}
/* arrastar uma peça da biblioteca até um encaixe: o encaixe acende durante a pausa antes de soltar */
let bibArrasto = null
function moverBibArrasto(ev) {
  const a = bibArrasto
  if (!a.ativo) {
    if (Math.hypot(ev.clientX - a.x0, ev.clientY - a.y0) < 6) return
    a.ativo = true
    a.fantasma = document.createElement('div')
    a.fantasma.className = 'fantasma'
    a.fantasma.innerHTML = svgPeca(a.peca)
    document.body.appendChild(a.fantasma)
    document.body.classList.add('arrastando')
  }
  a.fantasma.style.transform = `translate3d(${ev.clientX - 32}px, ${ev.clientY - 32}px, 0) scale(1.08)`
  const sob = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-enc-ed]')
  if (sob !== a.alvo) { a.alvo?.classList.remove('is-pairando-ok'); a.alvo = sob; sob?.classList.add('is-pairando-ok') }
}
function soltarBibArrasto() {
  const a = bibArrasto
  bibArrasto = null
  document.body.classList.remove('arrastando')
  if (!a.ativo) return
  ignorarClique = true
  setTimeout(() => { ignorarClique = false }, 0)
  a.fantasma.remove()
  if (!a.alvo) return
  const id = a.alvo.dataset.encEd
  const i = ed().encaixes.findIndex((e) => e.id === id)
  ui.encSel = id
  mudarEd((c) => { c.encaixes[i].peca = a.peca }, `[data-enc-ed="${id}"]`)
  aviso(`${infoPeca(a.peca).nome} é a peça certa do encaixe ${i + 1}.`, 'feito')
}
palco.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0 || vistaAtual !== 'editor') return
  const alca = ev.target.closest('[data-alca]')
  if (alca) { ui.encSel = alca.dataset.alca; iniciarEdArrasto(ev, 'alca', alca.parentElement, alca.dataset.alca); return }
  const enc = ev.target.closest('[data-enc-ed]')
  if (enc) {
    if (ui.encSel !== enc.dataset.encEd) { ui.encSel = enc.dataset.encEd; ui.ctlSel = false; palco.querySelectorAll('.enc-ed.is-escolhido').forEach((x) => x.classList.remove('is-escolhido')); enc.classList.add('is-escolhido') }
    iniciarEdArrasto(ev, 'encaixe', enc, enc.dataset.encEd)
    return
  }
  const ctl = ev.target.closest('[data-ctl-ed]')
  if (ctl) { ui.ctlSel = true; ctl.classList.add('is-escolhido'); iniciarEdArrasto(ev, 'controle', ctl, null); return }
  const pb = ev.target.closest('[data-peca-b]')
  if (pb) { bibArrasto = { peca: pb.dataset.pecaB, x0: ev.clientX, y0: ev.clientY, ativo: false, alvo: null, ponteiro: ev.pointerId }; try { pb.setPointerCapture(ev.pointerId) } catch { /* já solto */ } }
})
palco.addEventListener('pointermove', (ev) => {
  if (edArrasto && ev.pointerId === edArrasto.ponteiro) moverEdArrasto(ev)
  else if (bibArrasto && ev.pointerId === bibArrasto.ponteiro) moverBibArrasto(ev)
})
palco.addEventListener('pointerup', (ev) => {
  if (edArrasto && ev.pointerId === edArrasto.ponteiro) { const moveu = edArrasto.moveu; soltarEdArrasto(); if (!moveu) repintarEditor(`[data-enc-ed="${ui.encSel}"]`) }
  else if (bibArrasto && ev.pointerId === bibArrasto.ponteiro) soltarBibArrasto()
})
palco.addEventListener('pointercancel', () => {
  if (edArrasto) { edArrasto = null; repintarEditor() }
  if (bibArrasto) { bibArrasto.fantasma?.remove(); bibArrasto = null; document.body.classList.remove('arrastando') }
})
/* soltar um arquivo de imagem sobre a tela do editor */
palco.addEventListener('dragover', (ev) => {
  const q = ev.target.closest?.('[data-ed-quadro]')
  if (!q || !ev.dataTransfer?.types?.includes('Files')) return
  ev.preventDefault()
  q.classList.add('is-solta')
})
palco.addEventListener('dragleave', (ev) => { ev.target.closest?.('[data-ed-quadro]')?.classList.remove('is-solta') })
palco.addEventListener('drop', (ev) => {
  const q = ev.target.closest?.('[data-ed-quadro]')
  if (!q) return
  ev.preventDefault()
  q.classList.remove('is-solta')
  const f = ev.dataTransfer?.files?.[0]
  if (f) usarImagemEd(f)
})
/** Teclado no editor: mover, redimensionar, tirar, desfazer. */
function teclaEditor(ev) {
  const emCampo = ev.target.closest?.('input, textarea, select')
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z' && !emCampo) { ev.preventDefault(); desfazerEd(); return true }
  if (emCampo) return false
  const c = ed()
  const noCtl = ev.target.closest?.('[data-ctl-ed]')
  const enc = ui.encSel && c.encaixes.find((e) => e.id === ui.encSel)
  if (!noCtl && !enc) return false
  const passo = ev.shiftKey ? 2 : 0.5
  const d = { ArrowLeft: [-passo, 0], ArrowRight: [passo, 0], ArrowUp: [0, -passo], ArrowDown: [0, passo] }[ev.key]
  if (noCtl) {
    if (d) { ev.preventDefault(); mudarEd((cc) => { cc.controle.x = limitar(cc.controle.x + d[0], 0, 100); cc.controle.y = limitar(cc.controle.y + d[1], 0, 100) }, '[data-ctl-ed]'); return true }
    if (ev.key === '+' || ev.key === '=' || ev.key === '-') { ev.preventDefault(); mudarEd((cc) => { cc.controle.s = +limitar(cc.controle.s + (ev.key === '-' ? -0.05 : 0.05), 0.6, 1.6).toFixed(2) }, '[data-ctl-ed]'); return true }
    return false
  }
  if (!ev.target.closest?.('[data-enc-ed]')) return false
  const sel = `[data-enc-ed="${enc.id}"]`
  if (d) { ev.preventDefault(); mudarEd((cc) => { const e = cc.encaixes.find((x) => x.id === enc.id); e.x = +limitar(e.x + d[0], 0, 100).toFixed(1); e.y = +limitar(e.y + d[1], 0, 100).toFixed(1) }, sel); return true }
  if (ev.key === '+' || ev.key === '=' || ev.key === '-') { ev.preventDefault(); mudarEd((cc) => { const e = cc.encaixes.find((x) => x.id === enc.id); e.t = +limitar(e.t + (ev.key === '-' ? -0.5 : 0.5), 3, 22).toFixed(1) }, sel); return true }
  if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); tirarEncaixe(enc.id); return true }
  if (ev.key === 'Escape') { ui.encSel = null; repintarEditor(); return true }
  return false
}

const COLS = 16, LINHAS = 10, CEL = 60
const MOVEIS = [{ x: 3, y: 6, w: 3, h: 1, tipo: 'mesa' }, { x: 14, y: 8, w: 1, h: 1, tipo: 'barril' }, { x: 0, y: 8, w: 1, h: 2, tipo: 'estante' }]

function papeisNaCena() { return estado.docs.filter((d) => d.noMapa && !d.sumiu && d.pos) }
function bloqueado(x, y, quem) {
  if (x < 0 || x >= COLS || y < 2 || y >= LINHAS) return true
  if (MOVEIS.some((m) => x >= m.x && x < m.x + m.w && y >= m.y && y < m.y + m.h)) return true
  if (papeisNaCena().some((d) => d.pos.x === x && d.pos.y === y)) return true
  return NOMES_J.some((n) => n !== quem && estado.jogadores[n].pos.x === x && estado.jogadores[n].pos.y === y)
}
const vizinho = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y)) <= 1
/** O objeto em que a ficha encosta (o mais perto, o papel antes do puzzle). */
function objetoPerto(nome = estado.jogadorAtual) {
  const p = estado.jogadores[nome].pos
  const d = papeisNaCena().find((x) => vizinho(p, x.pos))
  if (d) return { tipo: 'papel', id: d.id, x: d.pos.x, y: d.pos.y, nome: d.titulo }
  const z = puzzlesNaCena().find((x) => vizinho(p, x))

}

let fundoCenaCache = ''

function pintarCena() {

/** Andar uma casa: a ficha desliza (transform), o resto da cena só troca o que mudou. */
function andar(dx, dy) {
  const n = estado.jogadorAtual, p = estado.jogadores[n].pos
  const x = p.x + dx, y = p.y + dy
  if (bloqueado(x, y, n)) return false
  p.x = x; p.y = y
  const g = palco.querySelector(`[data-ficha="${n}"]`)
  if (g) g.style.transform = `translate(${x * CEL + 30}px, ${y * CEL + 30}px)`
  const perto = objetoPerto()
  palco.querySelectorAll('[data-cena] [data-obj]').forEach((el) => el.classList.toggle('is-perto', !!perto && el.dataset.id === perto.id))
  const t = palco.querySelector('[data-cena] .tocar')
  if (t) { const tmp = document.createElement('div'); tmp.innerHTML = htmlTocar(); t.replaceWith(tmp.firstElementChild) }

  return true
}
let timerSalvar = 0
function salvarDepois() { clearTimeout(timerSalvar); timerSalvar = setTimeout(salvar, 250) }
let timerCaminho = 0
function caminhoAte(alvos) {
  const n = estado.jogadorAtual, ini = estado.jogadores[n].pos
  const chave = (x, y) => `${x},${y}`
  const ok = new Set(alvos.map((a) => chave(a.x, a.y)))
  const vindo = new Map([[chave(ini.x, ini.y), null]])
  const fila = [ini]
  while (fila.length) {
    const c = fila.shift()
    if (ok.has(chave(c.x, c.y))) {
      const passos = []
      let k = chave(c.x, c.y)
      while (vindo.get(k)) { const [x, y] = k.split(',').map(Number); passos.unshift({ x, y }); k = vindo.get(k) }
      return passos
    }
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const x = c.x + dx, y = c.y + dy, k = chave(x, y)
      if (vindo.has(k) || bloqueado(x, y, n)) continue
      vindo.set(k, chave(c.x, c.y))
      fila.push({ x, y })
    }
  }
  return null
}
function seguir(passos) {
  clearTimeout(timerCaminho)
  const n = estado.jogadorAtual
  const passo = () => {
    const prox = passos.shift()
    if (!prox) return
    const p = estado.jogadores[n].pos
    if (!andar(prox.x - p.x, prox.y - p.y)) return
    if (passos.length) timerCaminho = setTimeout(passo, reduzido() ? 40 : 110)
  }
  passo()
}
function clicarCena(ev) {
  const obj = ev.target.closest('[data-obj]')
  const svg = palco.querySelector('[data-cena-svg]')
  if (!svg) return
  if (obj) {
    const alvo = obj.dataset.obj === 'papel' ? docPorId(obj.dataset.id)?.pos : puzzlesNaCena().find((z) => z.l.id === obj.dataset.id)
    const perto = objetoPerto()
    if (perto && perto.id === obj.dataset.id) { tocarObjeto(perto); return }
    if (!alvo) return
    const lados = []
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) if (dx || dy) lados.push({ x: alvo.x + dx, y: alvo.y + dy })
    const c = caminhoAte(lados.filter((l) => !bloqueado(l.x, l.y, estado.jogadorAtual)))
    if (c) { seguir(c); aviso(obj.dataset.obj === 'papel' ? 'Encoste a ficha no papel e toque nele para ler.' : 'Encoste a ficha e toque para abrir.') }
    else aviso('Não há caminho até lá.')
    return
  }
  const pt = svg.createSVGPoint()
  pt.x = ev.clientX; pt.y = ev.clientY
  const loc = pt.matrixTransform(svg.getScreenCTM().inverse())
  const x = Math.floor(loc.x / CEL), y = Math.floor(loc.y / CEL)
  if (bloqueado(x, y, estado.jogadorAtual)) return
  const c = caminhoAte([{ x, y }])
  if (c) seguir(c)
}
function tocarObjeto(p = objetoPerto()) {
  if (!p) { aviso('Encoste a ficha num papel ou num objeto para tocar.'); return }
  if (p.tipo === 'papel') {
    const el = palco.querySelector(`[data-cena] [data-obj="papel"][data-id="${p.id}"]`)
    lerDoMapa(p.id, el?.getBoundingClientRect())
    return
  }
  ui.mapaPuzzle = p.id
  ui.gaveta = null
  vistaMapa()
  palco.querySelector('[data-pz] .item, [data-pz] .roda__janela, [data-pz] .botao-p, [data-pz] [data-ponteiro], [data-acao="sair-puzzle"]')?.focus()
}

/** Põe o documento na lista do jogador. Devolve false se ele já tinha. */
function darDocumento(nome, docId, origem, de = '') {
  const j = estado.jogadores[nome]
  if (!docPorId(docId)) return false
  if (j.docs.some((d) => d.doc === docId)) return false
  j.docs.push({ doc: docId, em: Date.now(), origem, de, novo: origem !== 'mapa' })
  registrar(`${nome} ${origem === 'mapa' ? 'leu' : 'recebeu'} “${docPorId(docId).titulo}”`)
  return true
}
function lerDoMapa(docId, de) {
  const doc = docPorId(docId), n = estado.jogadorAtual
  const primeira = darDocumento(n, docId, 'mapa')
  if (doc.depois === 'some') doc.sumiu = true
  salvar()
  abrirLeitura(docId, { de, voar: primeira, sumir: doc.depois === 'some', guardado: primeira, jaTinha: !primeira })
}

function formatarTexto(k, m) {
  const ta = palco.querySelector(`textarea[data-campo="pag-texto"][data-k="${k}"]`)

  if (!ta || !d) return
  const a = ta.selectionStart, b = ta.selectionEnd

  ta.value = ta.value.slice(0, a) + m + meio + m + ta.value.slice(b)

  pintarPrevia()

  'enc-t'(el) {

  'ctl-s'(el) {

    if (b) b.style.transform = `translate(-50%, -50%) scale(${el.value})`
  },
  'peca-nome'(el) {
    const id = ui.pecaSel
    if (estado.pecasProprias[id]) estado.pecasProprias[id].nome = el.value
    else estado.nomesPecas[id] = { ...(estado.nomesPecas[id] || {}), nome: el.value }

    clearTimeout(timerGuardar); timerGuardar = setTimeout(salvar, 300)

  'peca-desc'(el) {
    const id = ui.pecaSel

  'doc-titulo'(el) { const d = docAtual(); d.titulo = el.value; const li = palco.querySelector(`[data-acao="escolher-doc"][data-doc="${d.id}"] .mg-linha__nome`); if (li) li.textContent = el.value || 'Sem título'; pintarPrevia(); clearTimeout(timerGuardar); timerGuardar = setTimeout(salvar, 300) },

  cor() { salvar(); repintarEditor() },
  'n-rodas': (el) => mudarEd((c) => { const n = +el.value; c.resposta.numeros = Array.from({ length: n }, (_, i) => c.resposta.numeros[i] ?? 0) }),
  'n-simbolos': (el) => mudarEd((c) => { const n = +el.value; c.resposta.simbolos = Array.from({ length: n }, (_, i) => c.resposta.simbolos[i] ?? SIMBOLOS[i % SIMBOLOS.length]) }),
  simbolo: (el) => mudarEd((c) => { c.resposta.simbolos[+el.dataset.k] = el.value }),
  hora: (el) => mudarEd((c) => { c.resposta.hora.h = +el.value }),
  minuto: (el) => mudarEd((c) => { c.resposta.hora.m = +el.value }),
  rotulos: () => repintarEditor(),
  'dica-tipo': (el) => mudarEd((c) => { c.dica.tipo = el.value }),
  'dica-doc': (el) => mudarEd((c) => { c.dica.doc = el.value || null }),
  'desfecho-doc': (el) => mudarEd((c) => { c.desfecho.doc = el.value || null }),
  'desfecho-porta': (el) => mudarEd((c) => { c.desfecho.porta = el.value || null }, '[data-campo="desfecho-porta"]'),
  moldura: (el) => mudarEd((c) => { c.visual.moldura = el.value }, `[data-campo="moldura"][value="${el.value}"]`),
  castigo: (el) => mudarEd((c) => { c.castigo.tipo = el.value }),
  dano: (el) => mudarEd((c) => { c.castigo.dano = limitar(+el.value || 1, 1, 20) }),
  imagem: (el) => { const f = el.files?.[0]; if (f) usarImagemEd(f) },
  async 'peca-img'(el) {
    const f = el.files?.[0]
    if (!f) return
    try {
      const img = await lerImagem(f, 160, 'image/png')
      const id = uid('pp')
      estado.pecasProprias[id] = { nome: 'Peça nova', desc: '', img }
      ui.pecaSel = id
      salvar()
      repintarEditor('[data-campo="peca-nome"]')
      palco.querySelector('[data-campo="peca-nome"]')?.select()
      aviso('Peça nova na biblioteca. Dê nome e descrição.', 'feito')
    } catch (e) { aviso(e.message, 'perigo') }
  },
  'ver-como'(el) {
    estado.jogadorAtual = el.value
    ui.gaveta = null
    salvar()
    vistaMapa()
    palco.querySelector(`[data-campo="ver-como"][value="${el.value}"]`)?.focus()
    aviso(`Agora você vê como ${el.value}.`)
  },
  'doc-papel'(el) { docAtual().papel = el.value; salvar(); repintarDocs(`[data-campo="doc-papel"][value="${el.value}"]`) },
  async 'doc-papel-img'(el) {
    const f = el.files?.[0]
    if (!f) return
    try { docAtual().imagemPapel = await lerImagem(f, 900); salvar(); repintarDocs() } catch (e) { aviso(e.message, 'perigo') }
  },
  async 'pag-img'(el) {
    const f = el.files?.[0]
    if (!f) return
    try { const d = docAtual(); d.paginas[+el.dataset.k].imagem = await lerImagem(f, 720); ui.pagPrevia = +el.dataset.k; salvar(); repintarDocs() } catch (e) { aviso(e.message, 'perigo') }
  },
  'doc-no-mapa'(el) {
    const d = docAtual()
    if (el.checked) {
      const v = d.pos && !d.sumiu ? d.pos : vagaDePapel(d)
      if (!v) { el.checked = false; aviso('Não há parede livre no mapa para mais um papel.', 'perigo'); return }
      Object.assign(d, { noMapa: true, sumiu: false, pos: v })
      aviso('O papel está no mapa da casa do capitão.', 'feito')
    } else { d.noMapa = false; aviso('O papel saiu do mapa. Quem já leu continua com ele.') }
    salvar()
    repintarDocs('[data-campo="doc-no-mapa"]')
  },
  'doc-depois'(el) { docAtual().depois = el.value; salvar(); repintarDocs(`[data-campo="doc-depois"][value="${el.value}"]`) },
  'doc-dica'(el) {
    const d = docAtual()
    d.dicaDe = el.value || null
    const m = d.dicaDe && modeloPorId(d.dicaDe)
    if (m) { m.dica = { ...m.dica, tipo: 'documento', doc: d.id }; aviso(`“${m.nome}” agora aponta a dica para “${d.titulo}”.`, 'feito') }
    salvar()
    repintarDocs('[data-campo="doc-dica"]')
  },
}
function pintarArteEd() {
  const a = palco.querySelector('[data-ed-quadro] .quadro__arte')
  if (!a) return
  cancelAnimationFrame(pintarArteEd.q)
  pintarArteEd.q = requestAnimationFrame(() => { a.innerHTML = htmlArte(ed(), 'ed') })
}

/* ---------------------------------------------------------------- eventos gerais */
document.addEventListener('click', (ev) => {
  if (ignorarClique) return
  const nav = ev.target.closest('.topo__bt[data-vista]')
  if (nav) { ir(nav.dataset.vista); return }
  const a = ev.target.closest('[data-acao]')
  if (a && !a.disabled) { ACOES[a.dataset.acao]?.(a, ev); return }
  if (vistaAtual === 'editor') {
    const pb = ev.target.closest('[data-peca-b]')
    if (pb) { ui.pecaSel = ui.pecaSel === pb.dataset.pecaB ? null : pb.dataset.pecaB; repintarEditor(`[data-peca-b="${pb.dataset.pecaB}"]`); return }
    if (ev.target.closest('[data-ed-quadro]') && !ev.target.closest('[data-enc-ed], [data-ctl-ed]') && (ui.encSel || ui.ctlSel)) { ui.encSel = null; ui.ctlSel = false; repintarEditor() }
    return
  }
  const s = ui.sessao
  if (s && ev.target.closest('[data-pz]')) {
    const item = ev.target.closest('.item[data-peca]')
    if (item) { escolherPz(s, item.dataset.peca, ev.detail === 0); return }
    const enc = ev.target.closest('.encaixe[data-enc]')
    if (enc && enc.getAttribute('aria-disabled') !== 'true') { clicarEncaixePz(s, enc.dataset.enc); return }
    return
  }
  if (vistaAtual === 'mapa' && ev.target.closest('[data-cena]')) clicarCena(ev)
})
palco.addEventListener('input', (ev) => {
  const el = ev.target.closest('[data-campo]')
  if (el && DIGITAR[el.dataset.campo]) DIGITAR[el.dataset.campo](el, ev)
})
palco.addEventListener('change', (ev) => {
  const el = ev.target.closest('[data-campo]')
  if (el && ESCOLHER[el.dataset.campo]) ESCOLHER[el.dataset.campo](el, ev)
})
palco.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && ev.target.matches?.('[data-campo="novo-item"]')) { ev.preventDefault(); ACOES['dar-item']() }
})
document.addEventListener('keydown', (ev) => {
  if (ui.leitura) {
    if (ev.key === 'Escape') { ev.preventDefault(); fecharLeitura(); return }
    if (ev.key === 'ArrowRight') { trocarPagina(1); return }
    if (ev.key === 'ArrowLeft') { trocarPagina(-1); return }
    if (ev.key === 'Tab') {
      const f = $$('[data-leitura] button:not(:disabled)')
      if (!f.length) return
      const i = f.indexOf(document.activeElement)
      if (ev.shiftKey && i <= 0) { ev.preventDefault(); f[f.length - 1].focus() }
      else if (!ev.shiftKey && i === f.length - 1) { ev.preventDefault(); f[0].focus() }
    }
    return
  }
  if (ev.key === 'Escape' && cancelarArrasto()) return
  if (vistaAtual === 'editor') { teclaEditor(ev); return }
  const emCampo = ev.target.closest?.('input:not([type=radio]):not([type=checkbox]), textarea, select')
  const s = ui.sessao
  if (s) {
    if (ev.key === 'Escape') {
      if (s.cartao) { ACOES['fechar-resultado'](); return }
      if (s.sel) { s.sel = null; pintarMochilaPz(s); pintarEncaixesPz(s); return }
      if (!ehTeste(s)) { ACOES['sair-puzzle'](); return }
    }
    const jan = ev.target.closest?.('[data-roda]')
    if (jan && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) { ev.preventDefault(); girarRodaPz(s, +jan.dataset.k, ev.key === 'ArrowUp' ? 1 : -1, false); return }
    const pt = ev.target.closest?.('[data-ponteiro]')
    if (pt && /^Arrow/.test(ev.key)) { ev.preventDefault(); const a = s.prog.rel; const d = (ev.key === 'ArrowUp' || ev.key === 'ArrowRight' ? 1 : -1) * (pt.dataset.ponteiro === 'h' ? 60 : 5); relogioPor(s, (a.h % 12) * 60 + a.m + d, false); return }
    return
  }
  if (vistaAtual !== 'mapa' || emCampo) return
  if (ev.key === 'Escape' && ui.gaveta) { const qual = ui.gaveta; alternarGaveta(qual); palco.querySelector(`[data-acao="bj-${qual}"]`)?.focus(); return }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return
  const k = ev.key.toLowerCase()
  if (k === 'd') { ev.preventDefault(); alternarGaveta('docs'); return }
  if (k === 'i') { ev.preventDefault(); alternarGaveta('inv'); return }
  if (k === 'e' || (ev.key === 'Enter' && ev.target.closest?.('[data-cena]'))) { ev.preventDefault(); clearTimeout(timerCaminho); tocarObjeto(); return }
  const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key]
  if (d && !ev.target.closest?.('.seg, .gaveta-j')) { ev.preventDefault(); clearTimeout(timerCaminho); andar(d[0], d[1]) }
})

/* ---------------------------------------------------------------- arranque */
function aplicarRM() {
  rmManual = $('#rm').checked
  document.documentElement.classList.toggle('rm', reduzido())
}
$('#rm').addEventListener('change', aplicarRM)
mqRM.addEventListener?.('change', aplicarRM)
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v !== vistaAtual && VISTAS[v]) ir(v) })
window.addEventListener('storage', (ev) => { if (ev.key === CHAVE) { estado = carregar(); ir(vistaAtual) } })
$('svg defs').insertAdjacentHTML('beforeend', engrenagem('engr-bronze', 8, 19, 14.5, '#b07a45', false) + engrenagem('engr-ferro', 6, 16, 12, '#8a8f93', true))
gerarGrao()
aplicarRM()
salvar()
ir(location.hash.slice(1) || 'editor')
window.__prototipo = { estado: () => estado, ui, chave: CHAVE }
})()
</script>
