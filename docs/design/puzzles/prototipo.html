<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzles · protótipo do Labirinto</title>
<!--
  PROTÓTIPO dos minigames de PUZZLE (pedido de 19/11/2026 17h49, PEDIDOS.md).
  Avulso: não é código do app. Os tokens abaixo são cópia fiel de client/src/theme.ts
  (mesmos nomes --lb-*), para o porte ser só trocar o bloco :root pelo do app.
  A arte das telas de perto segue o Meio-Termo (docs/design/ESTILO-DO-RPG.md):
  contorno no tom escuro da própria cor, cores contidas, pedra assentada pedra a pedra.
  Puzzles, nomes e arte originais; a referência ao Resident Evil é só o jeito de jogar.
-->
<style>
:root {
  --lb-color-ink: #121214; --lb-color-stone: rgba(19, 19, 23, 0.94); --lb-color-stone-solid: #1a1a1e;
  --lb-color-stone-raised: #232328; --lb-color-stone-hover: #2c2c33; --lb-color-stone-sunken: #141417;
  --lb-color-line: rgba(255, 255, 255, 0.08); --lb-color-line-strong: rgba(255, 255, 255, 0.16);
  --lb-color-line-panel: rgba(255, 255, 255, 0.13); --lb-color-line-divider: rgba(255, 255, 255, 0.26);
  --lb-color-parchment: #eceae4; --lb-color-parchment-dim: #a2a09a; --lb-color-parchment-faint: #858480;
  --lb-color-brass: #e0a44a; --lb-color-brass-bright: #f3ba66; --lb-color-brass-soft: rgba(224, 164, 74, 0.14); --lb-color-brass-contrast: #1c1608;
  --lb-color-ember: #e2645a; --lb-color-ember-soft: rgba(226, 100, 90, 0.14);
  --lb-color-online: #7fb48a; --lb-color-online-soft: rgba(127, 180, 138, 0.14);
  --lb-font-display: 'Sitka Banner', 'Sitka Display', Sitka, Constantia, Georgia, 'Times New Roman', serif;
  --lb-font-sans: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
  --lb-font-utility: 'Bahnschrift', 'DIN Alternate', 'Segoe UI Variable Small', 'Segoe UI', system-ui, sans-serif;
  --lb-font-size-xs: 10.5px; --lb-font-size-sm: 11.5px; --lb-font-size-md: 13px; --lb-font-size-lg: 15px; --lb-font-size-xl: 20px;
  --lb-radius-sm: 6px; --lb-radius-md: 9px; --lb-radius-lg: 14px;
  --lb-shadow-lg: 0 18px 44px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.34);
  --lb-shadow-float: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 14px rgba(0, 0, 0, 0.44), 0 20px 46px rgba(0, 0, 0, 0.55);
  --lb-motion-fast: 110ms; --lb-motion-base: 170ms;
  --lb-gr-ease-out: cubic-bezier(0.23, 1, 0.32, 1); --lb-gr-ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --lb-gr-papel-alto: #1b1711; --lb-gr-papel-baixo: #13100c; --lb-gr-cartao: #211c15; --lb-gr-cartao-alto: #29231a; --lb-gr-campo: #15120e;
  --lb-gr-filete: rgba(236, 234, 228, 0.09); --lb-gr-filete-forte: rgba(236, 234, 228, 0.16); --lb-gr-filete-latao: rgba(224, 164, 74, 0.26);
  --lb-gr-couro-1: #17100a; --lb-gr-couro-2: #251a11; --lb-gr-couro-3: #2f2216; --lb-gr-gravado: #c8b089;
  --lb-gr-latao-1: #f6cb84; --lb-gr-latao-2: #e0a44a; --lb-gr-latao-3: #b87d2e;
  --lb-gr-largura-lombada: 52px; --lb-gr-largura-pagina: 262px;
  /* do protótipo: curva de movimento na tela (ease-in-out forte do Emil) */
  --pz-ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--lb-color-ink); color: var(--lb-color-parchment); font: 400 var(--lb-font-size-md)/1.45 var(--lb-font-sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--lb-color-brass-bright); outline-offset: 2px; }
kbd { font: 500 var(--lb-font-size-xs)/1 var(--lb-font-utility); color: var(--lb-color-parchment-dim); border: 1px solid var(--lb-gr-filete-forte); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; }

/* ---------------------------------------------------------------- botões (o gr-bt do app) */
.bt { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: var(--lb-radius-sm); background: var(--lb-gr-cartao-alto); color: var(--lb-color-parchment); border: 1px solid var(--lb-gr-filete-forte); font-weight: 500; white-space: nowrap; cursor: pointer; transition: background-color var(--lb-motion-fast) ease, border-color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-gr-ease-out), opacity var(--lb-motion-fast) ease; }
.bt svg { width: 16px; height: 16px; flex: none; }
.bt:active:not(:disabled) { transform: scale(0.97); }
.bt:disabled { opacity: 0.45; cursor: not-allowed; }
.bt--primario { background: linear-gradient(180deg, var(--lb-gr-latao-1), var(--lb-gr-latao-2) 60%, #cf9440); color: var(--lb-color-brass-contrast); border-color: rgba(0, 0, 0, 0.35); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35); font-weight: 600; }
.bt--latao { background: transparent; border-color: var(--lb-gr-filete-latao); color: var(--lb-color-brass-bright); }
.bt--fantasma { background: transparent; border-color: transparent; color: var(--lb-color-parchment-dim); }
.bt--perigo { background: transparent; border-color: rgba(226, 100, 90, 0.4); color: #f0897f; }
.bt--p { min-height: 28px; padding: 0 9px; font-size: var(--lb-font-size-sm); }
.bt--largo { width: 100%; }
@media (hover: hover) and (pointer: fine) {
  .bt:hover:not(:disabled) { border-color: var(--lb-color-line-divider); }
  .bt--fantasma:hover:not(:disabled) { background: rgba(255, 236, 200, 0.06); border-color: transparent; color: var(--lb-color-parchment); }
  .bt--primario:hover:not(:disabled) { border-color: rgba(0, 0, 0, 0.35); }
}

/* ---------------------------------------------------------------- topo do protótipo */
.topo { height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--lb-color-stone-solid); border-bottom: 1px solid var(--lb-color-line-panel); position: relative; z-index: 5; }
.topo__marca { flex: none; line-height: 1.1; }
.topo__marca b { display: block; font: 400 17px/1.1 var(--lb-font-display); }
.topo__marca span { font-size: var(--lb-font-size-xs); color: var(--lb-color-parchment-faint); }
.topo__nav { display: flex; gap: 10px; flex: 1; min-width: 0; }
.topo__grupo { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: var(--lb-radius-md); background: var(--lb-color-stone-sunken); border: 1px solid var(--lb-color-line); }
.topo__rot { font: 500 var(--lb-font-size-xs)/1 var(--lb-font-utility); letter-spacing: 0.14em; text-transform: uppercase; color: var(--lb-color-parchment-faint); padding: 0 6px 0 5px; }
.topo__bt { min-height: 30px; padding: 0 10px; border-radius: var(--lb-radius-sm); border: 0; background: transparent; color: var(--lb-color-parchment-dim); cursor: pointer; white-space: nowrap; transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease; }
.topo__bt[aria-current='page'] { background: var(--lb-color-brass-soft); color: var(--lb-color-brass-bright); }
@media (hover: hover) and (pointer: fine) { .topo__bt:hover:not([aria-current='page']) { color: var(--lb-color-parchment); background: rgba(255, 236, 200, 0.06); } }
.topo__rm { flex: none; display: flex; align-items: center; gap: 7px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); white-space: nowrap; cursor: pointer; }
.topo__rm input { accent-color: var(--lb-color-brass); width: 15px; height: 15px; margin: 0; }
@media (max-width: 1240px) {
  .topo__marca span { display: none; }
  .topo__bt { padding: 0 7px; font-size: var(--lb-font-size-sm); }
  .topo__rot { display: none; }
}

/* ---------------------------------------------------------------- tela de perto (jogador) */
.pz { height: calc(100vh - 52px); display: grid; grid-template-columns: minmax(0, 1fr) 316px; grid-template-rows: minmax(0, 1fr) auto; gap: 10px 16px; padding: 12px 16px 12px; }
@media (max-width: 1180px) { .pz { grid-template-columns: minmax(0, 1fr) 276px; gap: 10px 12px; padding: 10px 12px; } }
.pz__cena { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; min-height: 0; gap: 8px; }
.pz__cab { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.pz__titulo { min-width: 0; }
.pz__titulo h1 { font: 400 var(--lb-font-size-xl)/1.15 var(--lb-font-display); overflow-wrap: anywhere; }
.pz__titulo p { margin-top: 2px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }
.pz__quem { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px 0 3px; border-radius: 999px; background: var(--lb-color-stone-raised); border: 1px solid var(--lb-color-line); font-size: var(--lb-font-size-sm); white-space: nowrap; }
.chip__av { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font: 600 10px/1 var(--lb-font-utility); color: #15120e; }
.chip--vazio { color: var(--lb-color-parchment-faint); padding-left: 9px; }
.pz__palco { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
.pz__pe { display: flex; align-items: baseline; gap: 14px; min-height: 36px; }
.pz__estado { flex: none; font: 500 var(--lb-font-size-md)/1.3 var(--lb-font-utility); color: var(--lb-color-parchment); }
.pz__estado b { color: var(--lb-color-brass-bright); font-weight: 600; }
.pz__dica { font-size: var(--lb-font-size-sm); line-height: 1.45; color: var(--lb-color-parchment-dim); min-width: 0; }
.pz__dica em { font-style: normal; color: var(--lb-gr-gravado); font-family: var(--lb-font-display); font-size: 13.5px; }

.quadro { position: relative; width: min(100cqw, 160cqh); aspect-ratio: 16 / 10; border-radius: var(--lb-radius-lg); overflow: hidden; background: #221d18; box-shadow: var(--lb-shadow-lg), 0 0 0 1px rgba(0, 0, 0, 0.5); container-type: inline-size; isolation: isolate; }
.quadro__arte, .quadro__arte > svg, .quadro__arte > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.quadro__arte > img { object-fit: cover; }
.quadro__grao { position: absolute; inset: 0; pointer-events: none; background-image: var(--pz-grao); background-size: 192px; mix-blend-mode: soft-light; opacity: 0.55; }
.quadro__camada { position: absolute; inset: 0; }
.quadro__veu { position: absolute; inset: 0; background: rgba(10, 8, 6, 0.5); }
.quadro__flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(226, 100, 90, 0) 30%, rgba(226, 100, 90, 0.62) 100%); }
.quadro__flash[data-tom='armadilha'] { background: radial-gradient(ellipse at center, rgba(150, 160, 170, 0) 30%, rgba(150, 160, 170, 0.55) 100%); }
.quadro__flash[data-tom='barulho'] { background: radial-gradient(ellipse at center, rgba(243, 186, 102, 0) 40%, rgba(243, 186, 102, 0.35) 100%); }
.quadro__vazio { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--lb-color-parchment-faint); font-size: var(--lb-font-size-sm); background: repeating-linear-gradient(135deg, #1d1914 0 14px, #211c16 14px 28px); }

/* encaixe: um botão de verdade por cima da arte, posicionado em % (o mesmo modelo da imagem do mestre) */
.encaixe { position: absolute; transform: translate(-50%, -50%); width: 9.4cqw; min-width: 44px; aspect-ratio: 1; border-radius: 50%; border: 0; padding: 0; cursor: pointer; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 40%, #2f2b25 0 52%, #46413a 72%, #6d685c 100%);
  box-shadow: inset 0 0.5cqw 1.1cqw rgba(0, 0, 0, 0.6), 0 0 0 0.28cqw #75736b, 0 0.25cqw 0 0.32cqw rgba(255, 248, 230, 0.09);
  transition: transform 150ms var(--lb-gr-ease-out); touch-action: none; }
.encaixe::after { content: ''; position: absolute; inset: -0.7cqw; border-radius: inherit; border: max(2px, 0.26cqw) solid var(--lb-color-brass-bright); opacity: 0; transition: opacity 120ms ease; pointer-events: none; }
.encaixe--brasao { width: 8.4cqw; aspect-ratio: 0.86; border-radius: 12% 12% 50% 50% / 10% 10% 58% 58%; }
.encaixe--estatua { width: 7.6cqw; aspect-ratio: 0.72; border-radius: 1.4cqw 1.4cqw 0.8cqw 0.8cqw; }
.encaixe--lua { width: 10.6cqw; }
.encaixe--joia { width: 6.4cqw; border-radius: 1.4cqw; }
.encaixe--quadrado { border-radius: 1.2cqw; }
.encaixe.is-pode::after { opacity: 0.6; border-style: dashed; }
.encaixe.is-pairando-ok { transform: translate(-50%, -50%) scale(1.07); }
.encaixe.is-pairando-ok::after { opacity: 1; border-style: solid; }
.encaixe.is-pairando-nao::after { opacity: 1; border-style: solid; border-color: var(--lb-color-ember); }
.encaixe[aria-disabled='true'] { cursor: default; }
.encaixe__peca, .encaixe__metade { position: absolute; inset: 8%; display: grid; place-items: center; pointer-events: none; }
.encaixe__peca svg, .encaixe__metade svg { width: 100%; height: 100%; filter: drop-shadow(0 0.35cqw 0.35cqw rgba(0, 0, 0, 0.5)); }
.encaixe__brilho { position: absolute; inset: -0.4cqw; border-radius: inherit; pointer-events: none; opacity: 0; box-shadow: 0 0 2.4cqw 0.6cqw rgba(243, 186, 102, 0.75), inset 0 0 1.2cqw rgba(255, 230, 180, 0.6); }
.encaixe__quem { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 0.5cqw); padding: 2px 6px; border-radius: 999px; background: rgba(14, 12, 10, 0.78); font: 500 var(--lb-font-size-xs)/1.2 var(--lb-font-utility); color: var(--lb-color-parchment-dim); white-space: nowrap; pointer-events: none; }
@media (hover: hover) and (pointer: fine) { .encaixe:not([aria-disabled='true']):hover::after { opacity: 0.45; border-style: solid; } }

/* resultado (resolver) */
.resultado { position: absolute; left: 50%; top: 50%; width: min(440px, 76%); transform: translate(-50%, -50%); padding: 18px 18px 16px; border-radius: var(--lb-radius-lg); background: rgba(21, 18, 14, 0.95); border: 1px solid var(--lb-gr-filete-latao); box-shadow: var(--lb-shadow-lg); text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.resultado__selo { font: 500 var(--lb-font-size-xs)/1 var(--lb-font-utility); letter-spacing: 0.14em; text-transform: uppercase; color: var(--lb-color-brass-bright); }
.resultado h2 { font: 400 22px/1.15 var(--lb-font-display); }
.resultado__texto { font: 400 15px/1.5 var(--lb-font-display); color: var(--lb-color-parchment); max-width: 36ch; }
.resultado__itens { width: 100%; border-top: 1px solid var(--lb-gr-filete); padding-top: 10px; }
.resultado__itens p { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); margin-bottom: 8px; }
.resultado__itens ul { list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.resultado__itens li { display: flex; align-items: center; gap: 7px; padding: 5px 10px 5px 6px; border-radius: var(--lb-radius-md); background: var(--lb-gr-cartao); border: 1px solid var(--lb-gr-filete); font-size: var(--lb-font-size-md); }
.resultado__itens svg { width: 26px; height: 26px; }

/* fora: o puzzle visto do mapa, com o progresso guardado */
.fora { position: relative; width: min(100cqw, 160cqh); aspect-ratio: 16 / 10; border-radius: var(--lb-radius-lg); overflow: hidden; box-shadow: var(--lb-shadow-lg), 0 0 0 1px rgba(0, 0, 0, 0.5); }
.fora > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.fora__cartao { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); width: min(460px, 80%); padding: 14px 16px; border-radius: var(--lb-radius-lg); background: rgba(19, 19, 23, 0.94); border: 1px solid var(--lb-color-line-panel); box-shadow: var(--lb-shadow-float); display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: center; }
.fora__cartao h2 { font: 400 var(--lb-font-size-lg)/1.25 var(--lb-font-display); }
.fora__cartao p { grid-column: 1; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }
.fora__cartao .bt { grid-column: 2; grid-row: 1 / span 2; }

/* bancada: controles que só existem no protótipo */
.bancada { grid-column: 1 / -1; grid-row: 2; display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 6px 10px; border: 1px dashed var(--lb-gr-filete-forte); border-radius: var(--lb-radius-md); font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }
.bancada__rot { font: 500 var(--lb-font-size-xs)/1 var(--lb-font-utility); letter-spacing: 0.14em; text-transform: uppercase; color: var(--lb-color-parchment-faint); }
.bancada__sep { width: 1px; height: 18px; background: var(--lb-gr-filete-forte); }

/* ---------------------------------------------------------------- mochila (a grade do pp-inv) */
.mochila { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: auto; background: var(--lb-color-stone); border: 1px solid var(--lb-color-line-panel); border-radius: var(--lb-radius-lg); padding: 12px; box-shadow: var(--lb-shadow-float); }
.mochila__cab { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.mochila__cab h2 { font: 400 var(--lb-font-size-lg)/1.2 var(--lb-font-display); }
.mochila__cab span { font: 500 var(--lb-font-size-xs)/1 var(--lb-font-utility); letter-spacing: 0.1em; text-transform: uppercase; color: var(--lb-color-brass-bright); }
.mochila__nota { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); line-height: 1.4; }
.mochila__grade { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.vaga { aspect-ratio: 1; min-width: 0; }
.vaga--vazia { border: 1px dashed var(--lb-color-line); border-radius: var(--lb-radius-sm); }
.item { position: relative; width: 100%; height: 100%; margin: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; align-items: center; gap: 1px; padding: 6px 3px 5px; font: 500 var(--lb-font-size-xs)/1.1 var(--lb-font-utility); color: var(--lb-color-parchment-dim); background: var(--lb-color-stone); border: 1px solid var(--lb-color-line-strong); border-radius: var(--lb-radius-sm); cursor: grab; touch-action: none; transition: transform var(--lb-motion-fast) var(--lb-gr-ease-out), opacity 120ms ease; }
.item svg { width: 74%; height: 100%; min-height: 0; pointer-events: none; }
.item__nome { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
@media (hover: hover) and (pointer: fine) { .item:hover { color: var(--lb-color-parchment); border-color: var(--lb-color-line-divider); } }
.item:active { transform: scale(0.97); transition-duration: 0ms; }
.item[aria-pressed='true'] { color: var(--lb-color-parchment); background: var(--lb-color-stone-raised); border-color: var(--lb-color-parchment); box-shadow: inset 0 0 0 1px var(--lb-color-parchment); }
.item.is-levantado { opacity: 0.3; }
.item.is-novo::after { content: ''; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--lb-color-brass-bright); box-shadow: 0 0 0 2px var(--lb-color-stone); }
.mochila__detalhe { min-height: 76px; padding: 10px; border-radius: var(--lb-radius-md); background: var(--lb-color-stone-sunken); border: 1px solid var(--lb-color-line); }
.mochila__detalhe h3 { font: 400 var(--lb-font-size-lg)/1.2 var(--lb-font-display); margin-bottom: 3px; }
.mochila__detalhe p { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); line-height: 1.45; }
.mochila__ganhos { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); line-height: 1.45; }
.mochila__ganhos b { color: var(--lb-color-parchment); font-weight: 500; }
.pv { margin-top: auto; display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font: 500 var(--lb-font-size-sm)/1 var(--lb-font-utility); color: var(--lb-color-parchment-dim); }
.pv__barra { height: 6px; border-radius: 999px; background: var(--lb-color-stone-sunken); overflow: hidden; box-shadow: inset 0 0 0 1px var(--lb-color-line); }
.pv__barra i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #b4493c, #c75a4c); transform-origin: left center; transition: transform 260ms var(--lb-gr-ease-out); }

.fantasma { position: fixed; left: 0; top: 0; width: 64px; height: 64px; pointer-events: none; z-index: 50; filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.55)); will-change: transform; }
.fantasma svg { width: 100%; height: 100%; }
body.arrastando, body.arrastando * { cursor: grabbing !important; }

/* aviso (o Torrada do app, simplificado) */
.aviso { position: fixed; left: 50%; bottom: 72px; transform: translate(-50%, 8px); opacity: 0; pointer-events: none; z-index: 60; max-width: min(560px, 80vw); padding: 9px 14px; border-radius: var(--lb-radius-md); background: var(--lb-color-stone-solid); border: 1px solid var(--lb-color-line-panel); box-shadow: var(--lb-shadow-float); font-size: var(--lb-font-size-md); text-align: center; transition: opacity 150ms ease, transform 150ms var(--lb-gr-ease-out); }
.aviso.is-visivel { opacity: 1; transform: translate(-50%, 0); transition-duration: 200ms; }
.aviso[data-tom='perigo'] { border-color: rgba(226, 100, 90, 0.45); color: #f3b2aa; }
.aviso[data-tom='latao'] { border-color: var(--lb-gr-filete-latao); color: var(--lb-color-brass-bright); }
.aviso[data-tom='feito'] { border-color: rgba(127, 180, 138, 0.45); color: #b9dcc0; }

/* ---------------------------------------------------------------- cofre: rodas */
.rodas { position: absolute; display: flex; justify-content: center; align-items: center; gap: 1.1cqw; }
.rodas__rot { position: absolute; left: 0; right: 0; top: -0.2cqw; text-align: center; font: 500 max(10px, 0.95cqw)/1 var(--lb-font-utility); letter-spacing: 0.14em; text-transform: uppercase; color: #4a3b1f; }
.roda { display: flex; flex-direction: column; align-items: center; gap: 0.45cqw; margin-top: 1.4cqw; }
.roda__seta { width: max(30px, 4.4cqw); height: max(24px, 2.6cqw); border: 0; border-radius: 0.6cqw; background: rgba(60, 46, 20, 0.35); color: #3b2f17; cursor: pointer; display: grid; place-items: center; padding: 0; transition: background-color 110ms ease, transform 110ms var(--lb-gr-ease-out); }
.roda__seta svg { width: 60%; height: 60%; }
.roda__seta:active { transform: scale(0.94); }
@media (hover: hover) and (pointer: fine) { .roda__seta:hover { background: rgba(60, 46, 20, 0.55); } }
.roda__janela { width: max(34px, 4.8cqw); height: max(44px, 6.4cqw); border-radius: 0.8cqw; background: linear-gradient(180deg, #171512, #3a3732 48%, #171512); box-shadow: inset 0 0.3cqw 0.7cqw rgba(0, 0, 0, 0.75), 0 0 0 0.22cqw #6e5931; display: grid; place-items: center; overflow: hidden; font: 600 max(18px, 3.4cqw)/1 var(--lb-font-utility); color: #efe4c8; cursor: ns-resize; }
.roda__valor { display: grid; place-items: center; width: 100%; height: 100%; }
.roda__valor svg { width: 70%; height: 70%; }
.macaneta { position: absolute; left: 50%; top: 70%; width: 10.5cqw; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 0; padding: 0; background: none; cursor: pointer; }
.macaneta svg { width: 100%; height: 100%; transition: transform 260ms var(--lb-gr-ease-out); }
.macaneta__rot { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 0.6cqw); white-space: nowrap; font: 500 var(--lb-font-size-xs)/1 var(--lb-font-utility); letter-spacing: 0.08em; text-transform: uppercase; color: var(--lb-color-parchment-dim); background: rgba(14, 12, 10, 0.7); padding: 4px 7px; border-radius: 999px; }

/* ---------------------------------------------------------------- altar: troca de peso */
.troca { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 1cqw; }
.troca__joia { width: 7cqw; aspect-ratio: 1; border: 0; padding: 0; border-radius: 1.2cqw; background: none; cursor: pointer; display: grid; place-items: center; }
.troca__joia svg { width: 100%; height: 100%; filter: drop-shadow(0 0.4cqw 0.4cqw rgba(0, 0, 0, 0.5)); }
.troca__joia--vazia { cursor: default; }
.troca__pedestal { transition: transform 300ms var(--pz-ease-in-out); display: flex; flex-direction: column; align-items: center; gap: 1cqw; }
.mostrador { width: 12cqw; }
.mostrador svg { width: 100%; display: block; }
.mostrador .agulha { transform-box: view-box; transform-origin: 60px 60px; transition: transform 320ms var(--pz-ease-in-out); }
.bandeja { position: relative; width: 15cqw; min-height: 6.4cqw; border: 0; padding: 0.6cqw; border-radius: 1cqw; background: linear-gradient(180deg, #7c6a49, #5d4e35); box-shadow: inset 0 0.3cqw 0.6cqw rgba(0, 0, 0, 0.5), 0 0 0 0.22cqw #473a26; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4cqw; flex-wrap: wrap; }
.bandeja svg { width: 4cqw; height: 4cqw; pointer-events: none; }
.bandeja__vazia { font: 500 max(10px, 0.95cqw)/1.2 var(--lb-font-utility); color: #e9dcc0; opacity: 0.8; pointer-events: none; }
.bandeja::after { content: ''; position: absolute; inset: -0.6cqw; border-radius: 1.4cqw; border: max(2px, 0.26cqw) solid var(--lb-color-brass-bright); opacity: 0; transition: opacity 120ms ease; pointer-events: none; }
.bandeja.is-pode::after { opacity: 0.6; border-style: dashed; }
.bandeja.is-pairando-ok::after { opacity: 1; }
.bandeja.is-pairando-nao::after { opacity: 1; border-color: var(--lb-color-ember); }
.troca__soma { font: 500 max(10px, 1cqw)/1.2 var(--lb-font-utility); color: var(--lb-color-parchment); background: rgba(14, 12, 10, 0.72); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }

/* ---------------------------------------------------------------- arte: estados animados (raros: resolver) */
.folha-e, .folha-d, .porta-cofre { transform-box: fill-box; }
.folha-e, .porta-cofre { transform-origin: left center; }
.folha-d { transform-origin: right center; }
.is-resolvido .folha-e, .is-resolvido .folha-d, .is-resolvido .porta-cofre { transform: scaleX(0.12); }
.is-abrindo .folha-e, .is-abrindo .folha-d, .is-abrindo .porta-cofre { animation: pz-abre 900ms var(--pz-ease-in-out) both; }
@keyframes pz-abre { from { transform: scaleX(1); } to { transform: scaleX(0.12); } }
.agua { opacity: 0; }
.is-resolvido .agua { opacity: 0.9; }
.is-abrindo .agua--fio { animation: pz-fio 700ms var(--lb-gr-ease-out) both; stroke-dasharray: 700; }
.is-abrindo .agua--bacia { transform-box: fill-box; transform-origin: center bottom; animation: pz-enche 900ms 250ms var(--lb-gr-ease-out) both; }
@keyframes pz-fio { from { stroke-dashoffset: 700; opacity: 0.9; } to { stroke-dashoffset: 0; opacity: 0.9; } }
@keyframes pz-enche { from { opacity: 0; transform: scaleY(0.3); } to { opacity: 0.9; transform: scaleY(1); } }
.gaveta { transform-box: fill-box; }
.is-resolvido .gaveta { transform: translateY(46px); }
.is-abrindo .gaveta { animation: pz-gaveta 700ms var(--lb-gr-ease-out) both; }
@keyframes pz-gaveta { from { transform: translateY(0); } to { transform: translateY(46px); } }
.is-resolvido .some-ao-resolver { opacity: 0; pointer-events: none; transition: opacity 240ms ease; }

/* ---------------------------------------------------------------- outras mecânicas (amostras) */
.amostras { height: calc(100vh - 52px); overflow: auto; padding: 14px 16px 24px; }
.amostras__cab { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.amostras__cab h1 { font: 400 var(--lb-font-size-xl)/1.15 var(--lb-font-display); }
.amostras__cab p { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }
.amostras__grade { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1180px) { .amostras__grade { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.amostra { background: var(--lb-color-stone); border: 1px solid var(--lb-color-line-panel); border-radius: var(--lb-radius-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; box-shadow: var(--lb-shadow-float); }
.amostra--larga { grid-column: span 2; }
@media (max-width: 1180px) { .amostra--larga { grid-column: 1 / -1; } }
.amostra__cab { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.amostra__cab h2 { font: 400 var(--lb-font-size-lg)/1.2 var(--lb-font-display); }
.amostra__tipo { font: 500 var(--lb-font-size-xs)/1 var(--lb-font-utility); letter-spacing: 0.1em; text-transform: uppercase; color: var(--lb-color-brass-bright); white-space: nowrap; }
.amostra__dica { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); line-height: 1.45; }
.amostra__dica em { font-style: normal; font-family: var(--lb-font-display); color: var(--lb-gr-gravado); font-size: 13.5px; }
.amostra__corpo { flex: 1; display: grid; place-items: center; min-height: 230px; border-radius: var(--lb-radius-md); background: radial-gradient(ellipse at 50% 35%, #3a3329, #241f19 70%); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.4); padding: 12px; position: relative; overflow: hidden; }
.amostra__pe { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
.amostra__estado { font: 500 var(--lb-font-size-sm)/1.3 var(--lb-font-utility); color: var(--lb-color-parchment-dim); }
.amostra__estado.is-feito { color: #b9dcc0; }
.amostra.is-resolvida .amostra__corpo { box-shadow: inset 0 0 0 1px rgba(127, 180, 138, 0.5), inset 0 0 24px rgba(127, 180, 138, 0.18); }

.relogio { display: flex; align-items: center; gap: 14px; }
.relogio svg { width: 200px; height: 200px; touch-action: none; }
.ponteiro { cursor: grab; transition: transform 150ms var(--lb-gr-ease-out); }
.ponteiro.is-solto { transition: none; }
.ponteiro:focus { outline: none; }
.ponteiro:focus-visible .ponteiro__haste { stroke: var(--lb-color-brass-bright); }
.relogio__bts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

.piano { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.piano__teclas { display: flex; gap: 3px; padding: 8px 8px 10px; border-radius: 8px; background: linear-gradient(180deg, #5b3f27, #3f2b1a); box-shadow: inset 0 2px 0 rgba(255, 220, 170, 0.12), 0 6px 14px rgba(0, 0, 0, 0.45); }
.tecla { width: 34px; height: 128px; border: 0; border-radius: 0 0 6px 6px; background: linear-gradient(180deg, #e9e2cf, #f6f1e3 70%, #d9d0b9); box-shadow: inset 0 -5px 0 #c5bba2, 0 0 0 1px #8b8270; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px; font: 500 var(--lb-font-size-xs)/1 var(--lb-font-utility); color: #6b6250; cursor: pointer; transition: transform 90ms var(--lb-gr-ease-out); transform-origin: top center; }
.tecla:active, .tecla.is-tocada { transform: scaleY(0.97); box-shadow: inset 0 -2px 0 #c5bba2, 0 0 0 1px #8b8270; background: linear-gradient(180deg, #ddd4bd, #ebe4d2 70%, #d0c6ad); }
.piano__ouvido { display: flex; gap: 8px; }
.piano__ouvido i { width: 12px; height: 12px; border-radius: 50%; background: #2a2620; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12); transition: background-color 120ms ease; }
.piano__ouvido i.is-certa { background: var(--lb-color-brass-bright); box-shadow: 0 0 8px rgba(243, 186, 102, 0.6); }

.giratorio { display: grid; grid-template-columns: repeat(3, 72px); gap: 3px; padding: 8px; border-radius: 6px; background: linear-gradient(180deg, #6e5638, #4d3b26); box-shadow: inset 0 0 0 2px #3b2c1b, 0 6px 14px rgba(0, 0, 0, 0.45); }
.tile { width: 72px; height: 72px; border: 0; padding: 0; overflow: hidden; cursor: pointer; background: #1b2230; display: block; border-radius: 2px; }
.tile__img { display: block; width: 100%; height: 100%; transition: transform 180ms var(--lb-gr-ease-out); }

.luzes { display: grid; grid-template-columns: repeat(3, 58px); gap: 10px; padding: 14px; border-radius: 10px; background: linear-gradient(180deg, #4a4f53, #34383b); box-shadow: inset 0 0 0 2px #26292b, 0 6px 14px rgba(0, 0, 0, 0.45); }
.luz { width: 58px; height: 58px; border-radius: 50%; border: 0; cursor: pointer; background: radial-gradient(circle at 50% 40%, #4b4537, #2b2721 70%); box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6), 0 0 0 3px #5d6164; transition: background-color 120ms ease, box-shadow 120ms ease, transform 110ms var(--lb-gr-ease-out); }
.luz[aria-pressed='true'] { background: radial-gradient(circle at 50% 40%, #ffe3a8, #f3ba66 45%, #b8782c 100%); box-shadow: 0 0 18px rgba(243, 186, 102, 0.55), 0 0 0 3px #7a7f83; }
.luz:active { transform: scale(0.95); }

.empurra { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }
.empurra__mapa { position: relative; outline-offset: 4px; border-radius: 6px; }
.empurra__mapa svg { display: block; }
.empurra__peca { transition: transform 110ms var(--lb-gr-ease-out); }
.empurra__ctrl { display: grid; grid-template-columns: repeat(3, 36px); grid-template-rows: repeat(2, 36px); gap: 4px; }
.empurra__ctrl .bt { min-height: 36px; padding: 0; }
.empurra__ctrl .bt svg { width: 18px; height: 18px; }
.empurra__lado { display: flex; flex-direction: column; gap: 10px; align-items: center; }

/* ---------------------------------------------------------------- mestre: livro, página Jogos, editor, ao vivo */
.mestre { position: relative; height: calc(100vh - 52px); overflow: hidden; background: #6f8f55; }
.mestre__mapa { position: absolute; inset: 0; }
.mestre__mapa svg { width: 100%; height: 100%; display: block; }
.mestre__mapa::after { content: ''; position: absolute; inset: 0; background: rgba(12, 10, 8, 0.38); }
.livro { position: absolute; left: 12px; top: 12px; bottom: 12px; display: flex; border-radius: var(--lb-radius-md); overflow: hidden; box-shadow: var(--lb-shadow-float); z-index: 2; }
.livro__lombada { width: var(--lb-gr-largura-lombada); background: linear-gradient(90deg, var(--lb-gr-couro-3), var(--lb-gr-couro-2) 60%, var(--lb-gr-couro-1)); display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 12px; }
.livro__marca { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--lb-gr-gravado); opacity: 0.4; }
.livro__marca svg { width: 18px; height: 18px; }
.livro__marca--ativa { opacity: 1; background: linear-gradient(180deg, var(--lb-gr-latao-1), var(--lb-gr-latao-2) 55%, var(--lb-gr-latao-3)); color: var(--lb-color-brass-contrast); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 1px 3px rgba(0, 0, 0, 0.6); }
.livro__pagina { width: var(--lb-gr-largura-pagina); background: linear-gradient(180deg, var(--lb-gr-papel-alto), var(--lb-gr-papel-baixo)); overflow-y: auto; overflow-x: hidden; padding: 14px 12px 20px; }
.titulo-pag h2 { font: 400 var(--lb-font-size-xl)/1.15 var(--lb-font-display); }
.titulo-pag p { margin-top: 3px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); line-height: 1.4; }

.mg-secao { font: 400 15px/1.2 var(--lb-font-display); color: var(--lb-color-parchment); margin: 18px 0 8px; display: flex; align-items: baseline; gap: 8px; }
.mg-secao small { font: 400 var(--lb-font-size-sm)/1 var(--lb-font-sans); color: var(--lb-color-parchment-faint); }
.mg-lista { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.mg-linha { width: 100%; display: grid; grid-template-columns: 30px 1fr auto; gap: 2px 9px; align-items: center; text-align: left; padding: 8px 8px 8px 9px; border-radius: var(--lb-radius-md); background: var(--lb-gr-cartao); border: 1px solid var(--lb-gr-filete); color: var(--lb-color-parchment); font: inherit; cursor: pointer; transition: background-color var(--lb-motion-fast) ease, border-color var(--lb-motion-fast) ease, transform 160ms var(--lb-gr-ease-out); }
div.mg-linha { cursor: default; opacity: 0.62; }
@media (hover: hover) and (pointer: fine) { button.mg-linha:hover { border-color: var(--lb-gr-filete-forte); } }
button.mg-linha:active { transform: scale(0.985); }
.mg-linha__med { grid-row: span 2; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: #2a1d12; color: var(--lb-color-brass-bright); box-shadow: inset 0 0 0 1px var(--lb-gr-filete-latao); }
.mg-linha__med svg { width: 17px; height: 17px; }
.mg-linha__nome { font-weight: 600; font-size: var(--lb-font-size-md); line-height: 1.25; min-width: 0; overflow-wrap: anywhere; }
.mg-linha__onde { grid-column: 2; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); line-height: 1.3; overflow-wrap: anywhere; }
.mg-linha__seta { grid-row: 1 / span 2; grid-column: 3; color: var(--lb-color-parchment-faint); display: grid; }
.mg-linha__seta svg { width: 16px; height: 16px; }
.mg-linha__tags { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.mg-tag { font: 500 var(--lb-font-size-xs)/1 var(--lb-font-utility); padding: 3px 6px; border-radius: 5px; background: rgba(236, 234, 228, 0.07); color: var(--lb-color-parchment-dim); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.mg-tag--latao { background: var(--lb-color-brass-soft); color: var(--lb-color-brass-bright); }
.mg-tag--perigo { background: var(--lb-color-ember-soft); color: #f0a198; }
.mg-tag--feito { background: var(--lb-color-online-soft); color: #a8d4b0; }
.mg-pulsando { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--lb-color-brass-bright); margin-right: 2px; animation: mg-pulso 1.1s ease-in-out infinite; }
@keyframes mg-pulso { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.mg-aviso { border: 1px solid var(--lb-gr-filete-latao); background: rgba(224, 164, 74, 0.06); border-radius: var(--lb-radius-md); padding: 10px 11px; display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
.mg-aviso p { font-size: var(--lb-font-size-sm); line-height: 1.45; }
.mg-nota-pe { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.mg-vazio { padding: 12px; border: 1px dashed var(--lb-gr-filete-forte); border-radius: var(--lb-radius-md); font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); line-height: 1.45; }

.voltar { display: inline-flex; align-items: center; gap: 4px; min-height: 28px; padding: 0 6px 0 2px; margin: -4px 0 6px -2px; border: 0; background: none; color: var(--lb-color-parchment-dim); font-size: var(--lb-font-size-sm); cursor: pointer; border-radius: var(--lb-radius-sm); }
.voltar svg { width: 15px; height: 15px; transform: scaleX(-1); }
@media (hover: hover) and (pointer: fine) { .voltar:hover { color: var(--lb-color-parchment); } }
.cabeca { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 2px 0 12px; }
.cabeca__med { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(180deg, var(--lb-gr-latao-1), var(--lb-gr-latao-2) 55%, var(--lb-gr-latao-3)); color: var(--lb-color-brass-contrast); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 1px 3px rgba(0, 0, 0, 0.6); }
.cabeca__med svg { width: 22px; height: 22px; }
.cabeca h2 { font: 400 19px/1.15 var(--lb-font-display); overflow-wrap: anywhere; }
.cabeca p { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); margin-top: 2px; }
.fichas { display: flex; flex-direction: column; gap: 8px; }
.ficha { background: var(--lb-gr-cartao); border: 1px solid var(--lb-gr-filete); border-radius: var(--lb-radius-md); padding: 10px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 1px 0 rgba(255, 236, 200, 0.04); }
.ficha > h3 { font-weight: 600; font-size: var(--lb-font-size-md); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.ficha > h3 small { font-weight: 400; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); }
.campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.campo__rot { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); display: flex; justify-content: space-between; gap: 6px; }
.entrada { width: 100%; min-height: 30px; padding: 5px 8px; border-radius: var(--lb-radius-sm); background: var(--lb-gr-campo); border: 1px solid var(--lb-gr-filete-forte); color: var(--lb-color-parchment); font-size: var(--lb-font-size-md); }
textarea.entrada { resize: vertical; min-height: 64px; line-height: 1.4; }
select.entrada { padding-right: 4px; }
.entrada:focus-visible { outline: 2px solid var(--lb-color-brass-bright); outline-offset: 1px; }
.nota { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-faint); line-height: 1.45; }
.liga { display: flex; align-items: flex-start; gap: 8px; font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); cursor: pointer; line-height: 1.35; }
.liga input { accent-color: var(--lb-color-brass); margin: 1px 0 0; width: 15px; height: 15px; flex: none; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: auto; gap: 2px; padding: 2px; border-radius: var(--lb-radius-sm); background: var(--lb-gr-campo); border: 1px solid var(--lb-gr-filete); }
.seg--grade { grid-auto-flow: row; grid-template-columns: 1fr 1fr; }
.seg__op { position: relative; display: grid; place-items: center; min-height: 26px; padding: 3px 4px; border-radius: 5px; color: var(--lb-color-parchment-dim); cursor: pointer; font-size: var(--lb-font-size-sm); line-height: 1.15; text-align: center; hyphens: auto; transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease; }
.seg__op input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
.seg__op:has(input:checked) { background: var(--lb-color-brass-soft); color: var(--lb-color-brass-bright); }
.seg__op:has(input:focus-visible) { outline: 2px solid var(--lb-color-brass-bright); outline-offset: 1px; }
@media (hover: hover) and (pointer: fine) { .seg__op:hover:not(:has(input:checked)) { color: var(--lb-color-parchment); } }

.modelos { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.modelo { position: relative; border: 1px solid var(--lb-gr-filete-forte); border-radius: 7px; padding: 0; overflow: hidden; cursor: pointer; background: #221d18; aspect-ratio: 16 / 10; }
.modelo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.modelo span { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 5px; font: 500 var(--lb-font-size-xs)/1.2 var(--lb-font-utility); background: linear-gradient(transparent, rgba(10, 8, 6, 0.85)); text-align: left; }
.modelo[aria-pressed='true'] { border-color: var(--lb-color-brass-bright); box-shadow: 0 0 0 1px var(--lb-color-brass-bright); }
.lista-enc { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.lista-enc li { display: grid; grid-template-columns: 22px 1fr; gap: 4px 8px; align-items: center; }
.lista-enc li.is-escolhido .num { background: var(--lb-color-brass); color: var(--lb-color-brass-contrast); }
.num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 600 11px/1 var(--lb-font-utility); background: var(--lb-color-brass-soft); color: var(--lb-color-brass-bright); }
.lista-enc .entrada { grid-column: 2; }
.lista-enc .sub { grid-column: 2; display: flex; gap: 6px; align-items: center; }
.chips-itens { display: flex; flex-wrap: wrap; gap: 5px; }
.chip-item { display: inline-flex; align-items: center; gap: 4px; padding: 2px 3px 2px 7px; border-radius: 999px; background: var(--lb-gr-cartao-alto); border: 1px solid var(--lb-gr-filete-forte); font-size: var(--lb-font-size-sm); }
.chip-item button { width: 22px; height: 22px; border: 0; border-radius: 50%; background: none; color: var(--lb-color-parchment-faint); cursor: pointer; display: grid; place-items: center; padding: 0; }
.chip-item button svg { width: 12px; height: 12px; }

.painel { position: absolute; left: calc(12px + 314px + 16px); top: 12px; right: 16px; max-width: 900px; z-index: 2; background: var(--lb-color-stone); border: 1px solid var(--lb-color-line-panel); border-radius: var(--lb-radius-lg); box-shadow: var(--lb-shadow-float); padding: 12px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100% - 24px); }
.painel__cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.painel__cab h2 { font: 400 var(--lb-font-size-lg)/1.2 var(--lb-font-display); }
.painel__cab p { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); }
.painel__quadro { position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: var(--lb-radius-md); overflow: hidden; background: #221d18; container-type: inline-size; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5); }
.painel__quadro .encaixe { pointer-events: none; }
.marco { position: absolute; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; background: rgba(19, 17, 14, 0.82); border: 2px solid var(--lb-color-brass-bright); color: var(--lb-color-brass-bright); font: 600 13px/1 var(--lb-font-utility); display: grid; place-items: center; cursor: grab; touch-action: none; padding: 0; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); transition: background-color 110ms ease, color 110ms ease; }
.marco[aria-disabled='true'] { cursor: default; border-style: dashed; }
.marco.is-escolhido { background: var(--lb-color-brass); color: var(--lb-color-brass-contrast); }
.registro { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.registro li { font-size: var(--lb-font-size-sm); color: var(--lb-color-parchment-dim); line-height: 1.35; display: grid; grid-template-columns: 46px 1fr; gap: 6px; }
.registro time { font: 500 var(--lb-font-size-xs)/1.35 var(--lb-font-utility); color: var(--lb-color-parchment-faint); }
.registro li.is-perigo { color: #f0a198; }
.pecas-vivo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pecas-vivo li { display: grid; grid-template-columns: 28px 1fr; gap: 0 8px; align-items: center; font-size: var(--lb-font-size-sm); }
.pecas-vivo svg { width: 28px; height: 28px; grid-row: span 2; }
.pecas-vivo .vazio-ico { width: 28px; height: 28px; grid-row: span 2; border-radius: 50%; border: 1px dashed var(--lb-gr-filete-forte); }
.pecas-vivo small { color: var(--lb-color-parchment-faint); }

/* ---------------------------------------------------------------- movimento reduzido: só opacidade e cor */
.rm .encaixe, .rm .item, .rm .bt, .rm .mg-linha, .rm .roda__seta, .rm .macaneta svg, .rm .troca__pedestal, .rm .mostrador .agulha,
.rm .ponteiro, .rm .tecla, .rm .tile__img, .rm .luz, .rm .empurra__peca, .rm .pv__barra i, .rm .aviso { transition-property: opacity, background-color, border-color, color !important; }
.rm .encaixe.is-pairando-ok, .rm .item:active, .rm .bt:active, .rm .mg-linha:active, .rm .roda__seta:active, .rm .luz:active, .rm .tecla:active, .rm .tecla.is-tocada { transform: translate(-50%, -50%); }
.rm .item:active, .rm .bt:active, .rm .mg-linha:active, .rm .roda__seta:active, .rm .luz:active, .rm .tecla:active, .rm .tecla.is-tocada { transform: none; }
.rm .aviso, .rm .aviso.is-visivel { transform: translate(-50%, 0); }
.rm .is-abrindo .folha-e, .rm .is-abrindo .folha-d, .rm .is-abrindo .porta-cofre, .rm .is-abrindo .agua--fio, .rm .is-abrindo .agua--bacia, .rm .is-abrindo .gaveta { animation: none; }
.rm .mg-pulsando { animation: none; }
</style>
</head>

/** Sorteio com semente (mesma semente, mesma arte). */
function rng(semente) {
  let s = semente >>> 0
  return () => {
    s = (s + 0x6d2b79f5) >>> 0
    let t = s
    t = Math.imul(t ^ (t >>> 15), t | 1)
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}
/** Escurece ou clareia uma cor (fator na luz). O contorno do Meio-Termo é a cor a 60%. */
function tom(hex, f) {
  const n = parseInt(hex.slice(1), 16)
  const c = [n >> 16 & 255, n >> 8 & 255, n & 255].map((v) => Math.max(0, Math.min(255, Math.round(v * f))))
  return '#' + ((1 << 24) | (c[0] << 16) | (c[1] << 8) | c[2]).toString(16).slice(1)
}
/** WAAPI que respeita o movimento reduzido: no reduzido, só a troca de opacidade (ou nada). */
function animar(el, quadros, opcoes, quadrosReduzidos) {
  if (!el || !el.animate) return null
  if (reduzido()) return quadrosReduzidos ? el.animate(quadrosReduzidos, { duration: 160, easing: 'ease' }) : null
  return el.animate(quadros, opcoes)
}

/** Grão fino (ruído em canvas, semente fixa) que passa por cima da arte: madeira e pedra com textura sem virar foto. */
function gerarGrao() {

  c.width = c.height = 96
  const g = c.getContext('2d')
  const img = g.createImageData(96, 96)
  const r = rng(7)
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 110 + r() * 60
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v
    img.data[i + 3] = 255
  }
  g.putImageData(img, 0, 0)

}

/** Parede de pedra assentada pedra a pedra (largura e tom sorteados), nunca ladrilho repetido. */
function parede(semente, y0, y1, base) {
  const r = rng(semente)
  let s = `<rect y="${y0}" width="1600" height="${y1 - y0}" fill="${tom(base, 0.62)}"/>`
  const alt = 66
  for (let y = y0, fila = 0; y < y1; y += alt, fila++) {
    let x = -(fila % 2) * 70 - r() * 40
    while (x < 1600) {
      const w = 120 + r() * 100
      s += `<rect x="${x.toFixed(1)}" y="${y + 3}" width="${(w - 6).toFixed(1)}" height="${Math.min(alt, y1 - y) - 6}" rx="8" fill="${tom(base, 0.88 + r() * 0.22)}"/>`
      x += w
    }
  }
  return s
}
function chao(semente, y0, base) {
  const r = rng(semente)
  let s = `<rect y="${y0}" width="1600" height="${1000 - y0}" fill="${tom(base, 0.6)}"/>`
  for (let y = y0, fila = 0; y < 1000; fila++) {
    const alt = 70 + fila * 18
    let x = -r() * 120

      const w = 190 + r() * 120 + fila * 30
      s += `<rect x="${x.toFixed(1)}" y="${y + 4}" width="${(w - 8).toFixed(1)}" height="${alt - 8}" rx="10" fill="${tom(base, 0.86 + r() * 0.2)}"/>`
      x += w
    }
    y += alt
  }
  return s
}

  const v = estado.jogo[id].pos[encId]

function temAlgo(id, encId) {

/** As regras de cada encaixe. Encaixe: só a peça dele (ou qualquer do puzzle, se o mestre ligou). Ordem certa: qualquer do conjunto, e confere no fim. */
function aceita(id, encId, peca) {
  const c = estado.cfg[id], j = estado.jogo[id]
  const e = c.encaixes.find((x) => x.id === encId)
  if (!e) return nao()
  if (j.resolvido) return nao('Preso: o puzzle já foi resolvido.')
  if (e.jeito === 'metades') {
    const v = j.pos[encId]
    if (v.inteira) return nao('Já tem uma peça inteira aqui.')
    if (peca === e.vira) return v.e || v.d ? nao('Tire a metade antes.') : SIM
    if (peca === e.pecas[0]) return v.e ? nao('Essa metade já está aqui.') : SIM
    if (peca === e.pecas[1]) return v.d ? nao('Essa metade já está aqui.') : SIM
    return nao()
  }
  if (!e.peca && c.tipo !== 'ordem' && !c.qualquerOrdem) return nao('Este encaixe ainda não tem peça: o mestre não escolheu.')
  if (c.tipo === 'ordem' || c.qualquerOrdem) return conjunto(c).includes(peca) ? SIM : nao()
  return peca === e.peca ? SIM : nao()
}
function aceitaBandeja(peca) {
  const j = estado.jogo[puzzleAtual]
  if (!j || !estado.cfg[puzzleAtual].troca) return nao()
  if (!j.joiaNoPedestal) return nao('A troca já foi feita.')
  return PECAS[peca]?.peso ? SIM : nao('Na bandeja só vão pedras com peso marcado.')

  return nao()
}
