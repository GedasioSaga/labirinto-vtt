    <button type="button" class="bt bt--primario" data-acao="entrar">Entrar <kbd>E</kbd></button></div></div>`
}
function rotuloBento() {
  const j = estado.jogo.fonte
  const onde = Object.keys(j.pos).find((k) => j.pos[k]?.peca === 'med-sapo')
  if (j.resolvido) return null
  if (onde && j.pos[onde].por === 'Bento') return 'Bento tira o Sapo'
  if (estado.bentoTemSapo) return 'Bento põe o Sapo'
  return null
}
function htmlBancada(id) {
  const c = estado.cfg[id]
  const bento = id === 'fonte' ? rotuloBento() : undefined
  return `<div class="bancada" role="group" aria-label="Controles que só existem no protótipo" data-bancada>
    <span class="bancada__rot">Só no protótipo</span>
    <span>Castigo do mestre ao errar:</span>
    ${seg('castigo-bancada', Object.entries(NOME_CASTIGO), c.castigo.tipo, 'Castigo ao errar')}
    <span class="bancada__sep" aria-hidden="true"></span>
    ${id === 'fonte' ? (bento ? `<button type="button" class="bt bt--p" data-acao="bento">${bento}</button>` : '<button type="button" class="bt bt--p" disabled title="O Sapo está com a Lara ou o puzzle acabou">Bento não tem peça</button>') : ''}
    <button type="button" class="bt bt--p" data-acao="recomecar">Recomeçar este puzzle</button>
    <span class="nota">O castigo é o mesmo campo “Se errar” do editor do mestre.</span>
  </div>`
}
let segSeq = 0
function seg(campo, opcoes, valor, rotulo, grade = false, desab = {}) {
  const nome = `${campo}-${++segSeq}`
  return `<div class="seg${grade ? ' seg--grade' : ''}" role="radiogroup" aria-label="${esc(rotulo)}">${opcoes.map(([v, t]) => `<label class="seg__op"${desab[v] ? ` title="${esc(desab[v])}" style="opacity:.45;cursor:not-allowed"` : ''}><input type="radio" name="${nome}" value="${v}" data-campo="${campo}"${v === valor ? ' checked' : ''}${desab[v] ? ' disabled' : ''}><span>${t}</span></label>`).join('')}</div>`
}

function htmlMochila() {
  return `<aside class="mochila" aria-label="Mochila de ${QUEM}">
    <div class="mochila__cab"><h2>Mochila</h2><span>Peças de puzzle</span></div>
    <p class="mochila__nota">Arraste a peça até um encaixe, ou toque nela e depois no encaixe. Tocar numa peça posta a devolve.</p>
    <div class="mochila__grade" data-grade role="group" aria-label="Peças de puzzle de ${QUEM}">${htmlGrade()}</div>
    <div class="mochila__detalhe" data-detalhe aria-live="polite">${htmlDetalhe()}</div>
    <p class="mochila__ganhos" data-ganhos>${htmlGanhos()}</p>
    <div class="pv" data-pv>${htmlPV()}</div>
  </aside>`
}
function htmlGrade() {
  return estado.mochila.map((p, i) => (p
    ? `<div class="vaga" data-vaga="${i}"><button type="button" class="item${estado.novos.has(p) ? ' is-novo' : ''}" data-peca="${p}" aria-pressed="${estado.sel === p}" aria-label="${esc(PECAS[p].nome)}${estado.novos.has(p) ? ' (nova)' : ''}">${ico(p)}<span class="item__nome">${esc(PECAS[p].curto)}</span></button></div>`
    : `<div class="vaga vaga--vazia" data-vaga="${i}" aria-hidden="true"></div>`)).join('')
}
function htmlDetalhe() {
  const p = estado.sel
  if (!p) return '<h3>Nada na mão</h3><p>Escolha uma peça. Aqui dentro só aparecem as peças de puzzle da mochila.</p>'
  return `<h3>${esc(PECAS[p].nome)}</h3><p>${esc(PECAS[p].desc)} <kbd>Esc</kbd> solta.</p>`
}
function htmlGanhos() { return estado.recebidos.length ? `Também na mochila: ${estado.recebidos.map((k) => `<b>${esc(PREMIOS[k])}</b>`).join(', ')}.` : '' }
function htmlPV() { return `<span>PV</span><span class="pv__barra"><i style="transform:scaleX(${estado.pv / estado.pvMax})"></i></span><span data-pv-n>${estado.pv}/${estado.pvMax}</span>` }

function vistaPuzzle(id) {
  puzzleAtual = id
  const c = estado.cfg[id]
  if (estado.fora[id] === undefined) entrar(id)
  const fora = estado.fora[id]
  palco.innerHTML = `<section class="pz" aria-labelledby="pz-t">
    <div class="pz__cena">
      <header class="pz__cab">
        ${fora ? '' : '<button type="button" class="bt bt--fantasma" data-acao="sair">Sair <kbd>Esc</kbd></button>'}
        <div class="pz__titulo"><h1 id="pz-t">${esc(c.nome)}</h1><p>${TIPO_NOME[c.tipo]} · ${esc(lugarTexto(c))}</p></div>
        <div class="pz__quem" data-quem aria-label="Quem está aqui dentro">${htmlQuem(id)}</div>
      </header>
      <div class="pz__palco" data-palco>${fora ? htmlFora(id) : htmlQuadro(id)}</div>
      <footer class="pz__pe"><p class="pz__estado" data-estado aria-live="polite">${rotuloEstado(id)}</p><p class="pz__dica"><em>Dica:</em> ${esc(c.dica || 'O mestre não escreveu dica.')}</p></footer>
    </div>
    ${htmlMochila()}
    ${htmlBancada(id)}
  </section>`
  if (!fora && estado.jogo[id].cartao) palco.querySelector('[data-acao="fechar-resultado"]')?.focus()
}
function pintarQuadro(id) {
  const p = palco.querySelector('.pz [data-palco]')
  if (p) p.innerHTML = estado.fora[id] ? htmlFora(id) : htmlQuadro(id)
}
function pintarEncaixes(id) {
  const camada = palco.querySelector('.pz [data-encaixes]')
  if (!camada) return
  const foco = document.activeElement?.dataset?.enc
  camada.innerHTML = htmlEncaixes(id)
  if (foco) camada.querySelector(`[data-enc="${foco}"]`)?.focus()
  const b = palco.querySelector('.pz .bandeja')
  if (b) b.classList.toggle('is-pode', !!estado.sel && aceitaBandeja(estado.sel).ok)
}
function pintarMochila() {
  const m = palco.querySelector('.mochila')
  if (!m) return
  const ativo = document.activeElement
  const focoPeca = ativo?.dataset?.peca
  const focoVaga = ativo?.closest?.('[data-vaga]')?.dataset.vaga
  m.querySelector('[data-grade]').innerHTML = htmlGrade()
  m.querySelector('[data-detalhe]').innerHTML = htmlDetalhe()
  m.querySelector('[data-ganhos]').innerHTML = htmlGanhos()
  if (focoPeca !== undefined || focoVaga !== undefined) (m.querySelector(`.item[data-peca="${focoPeca}"]`) ?? m.querySelector(`[data-vaga="${focoVaga}"] .item`) ?? m.querySelector('.item'))?.focus()
}
function pintarPV() {
  const i = palco.querySelector('.pv__barra i')
  if (!i) return
  i.style.transform = `scaleX(${estado.pv / estado.pvMax})`
  palco.querySelector('[data-pv-n]').textContent = `${estado.pv}/${estado.pvMax}`
}
function pintarEstado(id) {
  const e = palco.querySelector('.pz [data-estado]')
  if (e) e.innerHTML = rotuloEstado(id)
  const q = palco.querySelector('.pz [data-quem]')
  if (q) q.innerHTML = htmlQuem(id)
}
function pintarBancada(id) {
  const b = palco.querySelector('[data-bancada]')
  if (b) b.outerHTML = htmlBancada(id)
}

/* ---------------------------------------------------------------- entrar e sair (o progresso fica) */
function entrar(id) {
  for (const k of Object.keys(estado.jogo)) if (k !== id && estado.jogo[k].dentro.delete(QUEM)) { registrar(k, `${QUEM} saiu`); estado.fora[k] = true }
  const j = estado.jogo[id]
  if (!j.dentro.has(QUEM)) { j.dentro.add(QUEM); registrar(id, `${QUEM} entrou`) }
  estado.fora[id] = false
}
function sair(id) {
  if (estado.jogo[id].dentro.delete(QUEM)) registrar(id, `${QUEM} saiu`)
  estado.fora[id] = true
  estado.sel = null
  vistaPuzzle(id)
  palco.querySelector('[data-acao="entrar"]')?.focus()
}
function entrarEPintar(id) {
  entrar(id)
  vistaPuzzle(id)
  palco.querySelector('.item, .roda__janela, [data-acao="sair"]')?.focus()
}

/* ---------------------------------------------------------------- escolher, pôr, tirar */
function escolher(peca, peloTeclado) {
  estado.sel = estado.sel === peca ? null : peca
  estado.novos.delete(peca)
  pintarMochila()
  pintarEncaixes(puzzleAtual)
  if (estado.sel && peloTeclado) {
    const alvo = palco.querySelector('.pz .encaixe.is-pode, .pz .bandeja.is-pode') ?? palco.querySelector('.pz .encaixe:not([aria-disabled])')
    alvo?.focus()
  }
}
function clicarEncaixe(id, encId) {
  if (estado.sel) { por(id, encId, estado.sel); return }
  if (temAlgo(id, encId)) { tirar(id, encId); return }
  aviso('Encaixe vazio. Escolha uma peça na mochila primeiro.')
}
function por(id, encId, peca, quem = QUEM) {
  const r = aceita(id, encId, peca)
  if (!r.ok) { recusar(encaixeEl(encId), r.motivo); return false }
  const c = estado.cfg[id], j = estado.jogo[id]
  const e = c.encaixes.find((x) => x.id === encId)
  if (quem === QUEM) tirarDaMochila(peca)
  let juntou = false
  if (e.jeito === 'metades') {
    const v = j.pos[encId]
    if (peca === e.vira) Object.assign(v, { e: e.pecas[0], d: e.pecas[1], inteira: true })
    else if (peca === e.pecas[0]) v.e = peca
    else v.d = peca
    v.por = quem
    if (!v.inteira && v.e && v.d) { v.inteira = true; juntou = true }
  } else {
    const antes = j.pos[encId]
    if (antes) { porNaMochila(antes.peca); registrar(id, `${quem} trocou ${PECAS[antes.peca].nome} de volta para a mochila`) }
    j.pos[encId] = { peca, por: quem }
  }
  registrar(id, `${quem} pôs ${PECAS[peca].nome}`)
  if (quem === QUEM) estado.sel = null
  pintarEncaixes(id); pintarMochila(); pintarEstado(id)
  const el = encaixeEl(encId)
  if (juntou) {
    juntar(el)
    registrar(id, `As metades viraram ${PECAS[e.vira].nome}`, 'feito')
    aviso(`As duas metades se juntaram: ${PECAS[e.vira].nome}.`, 'feito')
  } else assentar(el)
  setTimeout(() => verificar(id, quem), juntou ? 520 : 280)
  return true
}
function tirar(id, encId) {
  const c = estado.cfg[id], j = estado.jogo[id]
  if (j.resolvido) { aviso('Preso: o puzzle já foi resolvido.'); return }
  const e = c.encaixes.find((x) => x.id === encId)
  const v = j.pos[encId]
  let peca = null
  if (e.jeito === 'metades') {
    if (v.inteira) { peca = e.vira; Object.assign(v, { e: null, d: null, inteira: false, por: null }) }
    else if (v.d) { peca = v.d; v.d = null } else if (v.e) { peca = v.e; v.e = null }
    if (!v.e && !v.d) v.por = null
  } else if (v) { peca = v.peca; j.pos[encId] = null }
  if (!peca) return
  const de = encaixeEl(encId)?.getBoundingClientRect()
  const idx = porNaMochila(peca)
  registrar(id, `${QUEM} tirou ${PECAS[peca].nome}`)
  pintarEncaixes(id); pintarMochila(); pintarEstado(id)
  voarParaMochila(idx, de)
  aviso(`${PECAS[peca].nome} voltou para a sua mochila.`)
  if (id === 'fonte') pintarBancada(id)
}
function verificar(id, quem = QUEM) {
  const c = estado.cfg[id], j = estado.jogo[id]
  if (j.resolvido || c.tipo === 'combinacao' || !c.encaixes.length) return
  if (!c.encaixes.every((e) => cheio(id, e.id))) return
  if (c.tipo === 'ordem' && !c.encaixes.every((e) => j.pos[e.id]?.peca === e.peca)) {
    castigar(id, 'A tranca não cede: a ordem está errada.')
    return
  }
  resolver(id, quem)
}

/* ---------------------------------------------------------------- movimento (WAAPI, respeita o reduzido) */
function assentar(el) {
  if (!el) return
  const p = el.querySelectorAll('.encaixe__peca, .encaixe__metade')
  animar(p[p.length - 1], [{ transform: 'scale(1.14)', opacity: 0.55 }, { transform: 'scale(1)', opacity: 1 }], { duration: 200, easing: EASE_OUT }, [{ opacity: 0.4 }, { opacity: 1 }])
  animar(el.querySelector('.encaixe__brilho'), [{ opacity: 0.85 }, { opacity: 0 }], { duration: 520, easing: 'ease-out' }, [{ opacity: 0.5 }, { opacity: 0 }])
}
function juntar(el) {
  if (!el) return
  animar(el.querySelector('.encaixe__peca'), [{ transform: 'scale(0.86)', opacity: 0.3, filter: 'brightness(1.9)' }, { transform: 'scale(1.06)', opacity: 1, filter: 'brightness(1.35)', offset: 0.55 }, { transform: 'scale(1)', opacity: 1, filter: 'brightness(1)' }], { duration: 460, easing: EASE_OUT }, [{ opacity: 0.3 }, { opacity: 1 }])
  animar(el.querySelector('.encaixe__brilho'), [{ opacity: 1 }, { opacity: 0 }], { duration: 700, easing: 'ease-out' }, [{ opacity: 0.6 }, { opacity: 0 }])
}
function recusar(el, motivo) {
  aviso(motivo, 'perigo')
  if (!el) return
  const base = el.classList.contains('encaixe') ? 'translate(-50%, -50%) ' : ''
  animar(el, [0, -5, 5, -3, 2, 0].map((x) => ({ transform: `${base}translateX(${x}px)` })), { duration: 280, easing: 'ease-out' })
}
function voarParaMochila(idx, de) {
  const item = palco.querySelector(`[data-vaga="${idx}"] .item`)
  if (!item || !de) return
  const para = item.getBoundingClientRect()
  const dx = de.left + de.width / 2 - (para.left + para.width / 2), dy = de.top + de.height / 2 - (para.top + para.height / 2)
  animar(item, [{ transform: `translate(${dx}px, ${dy}px) scale(0.85)`, opacity: 0.6 }, { transform: 'none', opacity: 1 }], { duration: 280, easing: EASE_OUT }, [{ opacity: 0 }, { opacity: 1 }])
}
function piscar(tom_) {
  const f = palco.querySelector('.pz .quadro__flash')
  if (!f) return
  f.dataset.tom = tom_
  const q = [{ opacity: 0 }, { opacity: 1, offset: 0.22 }, { opacity: 0 }]
  animar(f, q, { duration: 560, easing: 'ease-out' }, q)
}
function sacudirQuadro() {
  animar(palco.querySelector('.pz .quadro'), [0, -7, 6, -4, 2, 0].map((x) => ({ transform: `translateX(${x}px)` })), { duration: 340, easing: 'ease-out' })
}

/* ---------------------------------------------------------------- castigo, resolver */
function castigar(id, motivo) {
  const c = estado.cfg[id], j = estado.jogo[id], k = c.castigo
  j.erros++
  if (k.tipo === 'nada') { aviso(`${motivo} Nada acontece.`); registrar(id, `${QUEM} errou (sem castigo)`); return }
  if (k.tipo === 'dano') {
    estado.pv = Math.max(0, estado.pv - k.dano)
    pintarPV(); piscar('dano'); sacudirQuadro()
    aviso(`${motivo} ${k.texto || CASTIGO_PADRAO.dano}: −${k.dano} PV.`, 'perigo')
    registrar(id, `${QUEM} errou: −${k.dano} PV`, 'perigo')
  } else if (k.tipo === 'armadilha') {
    piscar('armadilha'); sacudirQuadro()
    aviso(`${motivo} ${k.texto || CASTIGO_PADRAO.armadilha}`, 'perigo')
    registrar(id, `${QUEM} errou: armadilha (${k.texto || 'sem texto'})`, 'perigo')
  } else if (k.tipo === 'barulho') {
    piscar('barulho')
    aviso(`${motivo} ${k.texto || CASTIGO_PADRAO.barulho}`, 'latao')
    registrar(id, `${QUEM} errou: barulho`, 'perigo')
    estado.alertas.push({ id, t: Date.now(), texto: `Barulho em ${c.nome}: ${QUEM} errou.` })
  }
}
function resolver(id, pelo = QUEM) {
  const c = estado.cfg[id], j = estado.jogo[id]
  if (j.resolvido) return
  j.resolvido = true
  j.ganhador = pelo
  j.cartao = false
  const ficaComLara = pelo === QUEM || (pelo === 'mestre' && j.dentro.has(QUEM))
  if (ficaComLara) for (const it of c.desfecho.itens) if (!estado.recebidos.includes(it)) estado.recebidos.push(it)
  registrar(id, pelo === 'mestre' ? 'O mestre deu como resolvido' : `${pelo} resolveu`, 'feito')
  estado.sel = null
  if (vistaAtual === id && !estado.fora[id]) {
    j.abrindo = true
    pintarQuadro(id); pintarEstado(id); pintarMochila()
    const espera = reduzido() ? 160 : c.desfecho.tipo === 'cena' ? 1050 : 260
    setTimeout(() => {
      j.abrindo = false
      j.cartao = true
      if (vistaAtual === id && !estado.fora[id]) mostrarCartao(id)
    }, espera)
  } else {
    j.cartao = j.dentro.has(QUEM)
  }
}
function mostrarCartao(id) {
  const q = palco.querySelector('.pz .quadro')
  if (!q || q.querySelector('[data-resultado]')) return
  q.insertAdjacentHTML('beforeend', htmlResultado(id))
  const card = q.querySelector('[data-resultado]')
  animar(q.querySelector('[data-veu]'), [{ opacity: 0 }, { opacity: 1 }], { duration: 240, easing: 'ease-out' }, [{ opacity: 0 }, { opacity: 1 }])
  animar(card, [{ opacity: 0, transform: 'translate(-50%, -50%) scale(0.96)' }, { opacity: 1, transform: 'translate(-50%, -50%) scale(1)' }], { duration: 260, easing: EASE_OUT }, [{ opacity: 0 }, { opacity: 1 }])
  card.querySelector('[data-acao="fechar-resultado"]').focus()
}
function fecharResultado() {
  const id = puzzleAtual, j = estado.jogo[id]
  j.cartao = false
  palco.querySelectorAll('.pz [data-resultado], .pz [data-veu]').forEach((n) => n.remove())
  palco.querySelector('.mochila .item')?.focus()
}

/* ---------------------------------------------------------------- arrastar (ponteiro), com a pausa que já mostra o alvo */
function comecarArrasto() {
  const a = arrasto
  a.ativo = true
  a.fantasma = document.createElement('div')
  a.fantasma.className = 'fantasma'
  a.fantasma.innerHTML = ico(a.peca)
  document.body.appendChild(a.fantasma)
  a.item.classList.add('is-levantado')
  document.body.classList.add('arrastando')
  palco.querySelectorAll('.pz [data-alvo]').forEach((el) => { if (el.getAttribute('aria-disabled') !== 'true') el.classList.toggle('is-pode', aceitaAlvo(el, a.peca).ok) })
}
function moverFantasma(x, y) { arrasto.fantasma.style.transform = `translate3d(${x - 32}px, ${y - 32}px, 0) scale(1.08)` }
function marcarAlvo(el) {
  const a = arrasto
  if (el === a.alvo) return
  a.alvo?.classList.remove('is-pairando-ok', 'is-pairando-nao')
  a.alvo = el
  if (el) el.classList.add(aceitaAlvo(el, a.peca).ok ? 'is-pairando-ok' : 'is-pairando-nao')
}
function limparArrasto() {
  document.body.classList.remove('arrastando')
  palco.querySelectorAll('.is-pairando-ok, .is-pairando-nao, .pz [data-alvo].is-pode').forEach((el) => el.classList.remove('is-pairando-ok', 'is-pairando-nao', 'is-pode'))
}
function devolverFantasma(a) {
  const f = a.fantasma
  const r = a.item.isConnected ? a.item.getBoundingClientRect() : null
  if (!r || reduzido()) { f.remove(); a.item.classList.remove('is-levantado'); return }
  const anim = f.animate([{ transform: f.style.transform }, { transform: `translate3d(${r.left + r.width / 2 - 32}px, ${r.top + r.height / 2 - 32}px, 0) scale(1)` }], { duration: 200, easing: EASE_OUT })
  anim.onfinish = () => { f.remove(); a.item.classList.remove('is-levantado') }
}
function soltar() {
  const a = arrasto
  arrasto = null
  limparArrasto()
  ignorarClique = true
  setTimeout(() => { ignorarClique = false }, 0)
  if (a.alvo && aceitaAlvo(a.alvo, a.peca).ok) {
    a.fantasma.remove()
    if (a.alvo.dataset.alvo === 'encaixe') por(puzzleAtual, a.alvo.dataset.enc, a.peca)
    else porNaBandeja(a.peca)
    return
  }
  if (a.alvo) recusar(a.alvo, aceitaAlvo(a.alvo, a.peca).motivo)
  devolverFantasma(a)
}
function cancelarArrasto() {
  if (!arrasto) return
  const a = arrasto
  arrasto = null
  limparArrasto()
  if (a.ativo) devolverFantasma(a)
}
palco.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0 || arrasto) return
  const item = ev.target.closest('.pz .item[data-peca]')
  if (!item) return
  arrasto = { peca: item.dataset.peca, item, x0: ev.clientX, y0: ev.clientY, id: ev.pointerId, ativo: false, alvo: null, fantasma: null }
  try { item.setPointerCapture(ev.pointerId) } catch { /* ponteiro já solto */ }
})
palco.addEventListener('pointermove', (ev) => {
  if (!arrasto || ev.pointerId !== arrasto.id) return
  if (!arrasto.ativo) {
    if (Math.hypot(ev.clientX - arrasto.x0, ev.clientY - arrasto.y0) < 6) return
    comecarArrasto()
  }
  moverFantasma(ev.clientX, ev.clientY)
  const sob = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.pz [data-alvo]')
  marcarAlvo(sob && sob.getAttribute('aria-disabled') !== 'true' ? sob : null)
})
palco.addEventListener('pointerup', (ev) => {
  if (!arrasto || ev.pointerId !== arrasto.id) return
  if (arrasto.ativo) soltar()
  else arrasto = null
})
palco.addEventListener('pointercancel', () => cancelarArrasto())

/* ---------------------------------------------------------------- cofre: rodas de números e de símbolos */
const RODAS_POS = { numeros: { left: 31.25, top: 28, w: 18.75, h: 30 }, simbolos: { left: 51.25, top: 28, w: 18.75, h: 30 } }
function valorDaRoda(grupo, v) { return grupo === 'numeros' ? String(v) : glifo(SIMBOLOS[v]) }
function textoDaRoda(grupo, v) { return grupo === 'numeros' ? String(v) : NOME_SIMBOLO[SIMBOLOS[v]] }
function htmlRodas(id, op = {}) {
  const j = estado.jogo[id]
  const dis = j.resolvido || op.miniatura
  const grupoHtml = (grupo) => {
    const p = RODAS_POS[grupo]
    const rodas = [0, 1, 2].map((k) => {
      const v = j[grupo][k]
      return `<div class="roda">
        <button type="button" class="roda__seta" data-acao="roda" data-grupo="${grupo}" data-k="${k}" data-d="1" tabindex="-1" aria-label="Roda ${k + 1}, para cima"${dis ? ' disabled' : ''}>${ic('cima')}</button>
        <div class="roda__janela" role="spinbutton" tabindex="${dis ? -1 : 0}" data-roda data-grupo="${grupo}" data-k="${k}" aria-label="Roda ${k + 1} de ${grupo === 'numeros' ? 'números' : 'símbolos'}" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="${grupo === 'numeros' ? 9 : SIMBOLOS.length - 1}" aria-valuetext="${textoDaRoda(grupo, v)}"><span class="roda__valor">${valorDaRoda(grupo, v)}</span></div>
        <button type="button" class="roda__seta" data-acao="roda" data-grupo="${grupo}" data-k="${k}" data-d="-1" tabindex="-1" aria-label="Roda ${k + 1}, para baixo"${dis ? ' disabled' : ''}><svg viewBox="0 0 24 24" style="transform:rotate(180deg)" aria-hidden="true"><use href="#ic-cima"/></svg></button>
      </div>`
    }).join('')
    return `<div class="rodas some-ao-resolver" style="left:${p.left}%;top:${p.top}%;width:${p.w}%;height:${p.h}%" role="group" aria-label="Trava de ${grupo === 'numeros' ? 'números' : 'símbolos'}"><span class="rodas__rot" aria-hidden="true">${grupo === 'numeros' ? 'Números' : 'Símbolos'}</span>${rodas}</div>`
  }
  return `${grupoHtml('numeros')}${grupoHtml('simbolos')}
    <button type="button" class="macaneta some-ao-resolver" data-acao="girar" aria-label="Girar a maçaneta e tentar abrir"${dis ? ' disabled tabindex="-1"' : ''}>
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="none" stroke="#383a3c" stroke-width="12"/><circle cx="50" cy="50" r="40" fill="none" stroke="#9aa0a5" stroke-width="6"/>
      <path d="M50 10v80M10 50h80M22 22l56 56M78 22 22 78" stroke="#383a3c" stroke-width="9" stroke-linecap="round"/><path d="M50 10v80M10 50h80M22 22l56 56M78 22 22 78" stroke="#8a8f93" stroke-width="4" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="12" fill="#b89552" stroke="#6e5931" stroke-width="4"/></svg>
      <span class="macaneta__rot">Tentar abrir</span></button>`
}
function girarRoda(grupo, k, d, animado) {
  const id = puzzleAtual, j = estado.jogo[id]
  if (!j || j.resolvido) return
  const n = grupo === 'numeros' ? 10 : SIMBOLOS.length
  j[grupo][k] = (j[grupo][k] + d + n) % n
  const jan = palco.querySelector(`.pz [data-roda][data-grupo="${grupo}"][data-k="${k}"]`)
  if (!jan) return
  const v = j[grupo][k]
  const val = jan.querySelector('.roda__valor')
  val.innerHTML = valorDaRoda(grupo, v)
  jan.setAttribute('aria-valuenow', v)
  jan.setAttribute('aria-valuetext', textoDaRoda(grupo, v))
  if (animado) animar(val, [{ transform: `translateY(${d > 0 ? 45 : -45}%)`, opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }], { duration: 150, easing: EASE_OUT })
}
function tentarAbrir() {
  const id = puzzleAtual, c = estado.cfg[id], j = estado.jogo[id]
  if (j.resolvido) return
  const okN = j.numeros.every((v, i) => v === c.combinacao.numeros[i])
  const okS = j.simbolos.every((v, i) => SIMBOLOS[v] === c.combinacao.simbolos[i])
  animar(palco.querySelector('.pz .macaneta svg'), [{ transform: 'rotate(0deg)' }, { transform: `rotate(${okN && okS ? 90 : 28}deg)`, offset: 0.5 }, { transform: okN && okS ? 'rotate(90deg)' : 'rotate(0deg)' }], { duration: 420, easing: EASE_IN_OUT })
  registrar(id, `${QUEM} tentou abrir (${j.numeros.join('')} · ${j.simbolos.map((v) => NOME_SIMBOLO[SIMBOLOS[v]]).join(', ')})`)
  if (okN && okS) { setTimeout(() => resolver(id), reduzido() ? 0 : 320); return }
  castigar(id, okN ? 'A trava dos números cede; a dos símbolos, não.' : okS ? 'A trava dos símbolos cede; a dos números, não.' : 'Nenhuma das travas cede.')
}
let rodaAcumulado = 0
palco.addEventListener('wheel', (ev) => {
  const jan = ev.target.closest('.pz [data-roda]')
  if (!jan || jan.tabIndex < 0) return
  ev.preventDefault()
  rodaAcumulado += ev.deltaY
  if (Math.abs(rodaAcumulado) < 50) return
  const d = rodaAcumulado < 0 ? 1 : -1
  rodaAcumulado = 0
  girarRoda(jan.dataset.grupo, +jan.dataset.k, d, true)
}, { passive: false })

/* ---------------------------------------------------------------- altar: troca de peso (bandeja + mostrador) */
const anguloPeso = (w) => (Math.min(8, Math.max(0, w)) / 8) * 180 - 90
function svgMostrador(peso, agora) {
  let marcas = ''
  for (let w = 0; w <= 8; w++) {
    const a = (w / 8) * Math.PI, alvo = w === peso
    const r1 = 46, r2 = alvo ? 32 : 39
    marcas += `<line x1="${(60 - Math.cos(a) * r1).toFixed(1)}" y1="${(60 - Math.sin(a) * r1).toFixed(1)}" x2="${(60 - Math.cos(a) * r2).toFixed(1)}" y2="${(60 - Math.sin(a) * r2).toFixed(1)}" stroke="${alvo ? '#f6dfa8' : '#4a3b1f'}" stroke-width="${alvo ? 5 : 2.5}" stroke-linecap="round"/>`
  }
  return `<svg viewBox="0 0 120 68"><path d="M6 62A54 54 0 0 1 114 62Z" fill="#b89552" stroke="#6e5931" stroke-width="3"/>${marcas}
    <g class="agulha" data-agulha style="transform:rotate(${anguloPeso(agora)}deg)"><path d="M60 60V22" stroke="#383a3c" stroke-width="4" stroke-linecap="round"/></g>
    <circle cx="60" cy="60" r="6" fill="#5d6164" stroke="#383a3c" stroke-width="2"/></svg>`
}
function htmlTroca(id, op = {}) {
  const c = estado.cfg[id], j = estado.jogo[id]
  const pedras = j.joiaNoPedestal ? j.bandeja : j.pedrasPresas
  const soma = pedras.reduce((s, p) => s + PECAS[p].peso, 0)
  const dis = op.miniatura
  const joia = j.joiaNoPedestal
    ? `<button type="button" class="troca__joia" data-acao="trocar" aria-label="Pegar a ${esc(PECAS[c.troca.guarda].nome)}, trocando pelo que está na bandeja"${dis ? ' disabled tabindex="-1"' : ''}>${ico(c.troca.guarda)}</button>`
    : '<span class="troca__joia troca__joia--vazia" aria-hidden="true"></span>'
  return `<div class="troca" style="left:69.4%;top:12%;width:19.4%;height:84%" data-troca>
    <div class="troca__pedestal" data-pedestal>${joia}<div class="mostrador" aria-hidden="true">${svgMostrador(c.troca.peso, c.troca.peso)}</div></div>
    <button type="button" class="bandeja${estado.sel && !dis && aceitaBandeja(estado.sel).ok ? ' is-pode' : ''}" data-alvo="bandeja" aria-label="Bandeja de troca: ${pedras.length ? `${pedras.map((p) => PECAS[p].curto).join(', ')}, peso ${soma}` : 'vazia'}"${dis || !j.joiaNoPedestal ? ' aria-disabled="true"' : ''}${dis ? ' tabindex="-1"' : ''}>
      ${pedras.length ? pedras.map((p) => ico(p)).join('') : '<span class="bandeja__vazia">Bandeja vazia</span>'}</button>
    <span class="troca__soma" data-soma>${j.joiaNoPedestal ? `Bandeja: ${romano(soma)} · o pedestal pede ${romano(c.troca.peso)}` : 'Trocada: as pedras ficaram no lugar da joia'}</span>
    ${j.joiaNoPedestal && !dis ? '<button type="button" class="bt bt--primario bt--p" data-acao="trocar">Trocar a joia pela bandeja</button>' : ''}
  </div>`
}
function pintarTroca(id) {
  const t = palco.querySelector('.pz [data-troca]')
  if (!t) return
  const foco = document.activeElement
  const eraBandeja = foco?.dataset?.alvo === 'bandeja', eraTrocar = foco?.dataset?.acao === 'trocar'
  t.outerHTML = htmlTroca(id)
  if (eraBandeja) palco.querySelector('.pz .bandeja')?.focus()
  else if (eraTrocar) (palco.querySelector('.pz .troca .bt[data-acao="trocar"]') ?? palco.querySelector('.pz .bandeja'))?.focus()
}
function porNaBandeja(peca) {
  const id = puzzleAtual, j = estado.jogo[id]
  tirarDaMochila(peca)
  j.bandeja.push(peca)
  registrar(id, `${QUEM} pôs ${PECAS[peca].nome} na bandeja`)
  estado.sel = null
  pintarTroca(id); pintarMochila(); pintarEncaixes(id)
  const ultima = palco.querySelectorAll('.pz .bandeja svg')
  animar(ultima[ultima.length - 1], [{ transform: 'translateY(-30%) scale(1.1)', opacity: 0.5 }, { transform: 'none', opacity: 1 }], { duration: 220, easing: EASE_OUT }, [{ opacity: 0.4 }, { opacity: 1 }])
}
function clicarBandeja() {
  const id = puzzleAtual, j = estado.jogo[id]
  if (estado.sel) {
    const r = aceitaBandeja(estado.sel)
    if (r.ok) porNaBandeja(estado.sel)
    else recusar(palco.querySelector('.pz .bandeja'), r.motivo)
    return
  }
  if (!j.joiaNoPedestal) { aviso('As pedras ficaram presas no lugar da joia.'); return }
  if (!j.bandeja.length) { aviso('Bandeja vazia. Ponha pedras de peso marcado.'); return }
  const peca = j.bandeja.pop()
  const de = palco.querySelector('.pz .bandeja')?.getBoundingClientRect()
  const idx = porNaMochila(peca)
  registrar(id, `${QUEM} tirou ${PECAS[peca].nome} da bandeja`)
  pintarTroca(id); pintarMochila()
  voarParaMochila(idx, de)
}
let trocando = false
function trocar() {
  const id = puzzleAtual, c = estado.cfg[id], j = estado.jogo[id]
  if (!j.joiaNoPedestal || trocando) return
  const soma = j.bandeja.reduce((s, p) => s + PECAS[p].peso, 0)
  const agulha = palco.querySelector('.pz [data-agulha]')
  if (agulha) agulha.style.transform = `rotate(${anguloPeso(soma)}deg)`
  trocando = true
  setTimeout(() => {
    trocando = false
    if (vistaAtual !== id) return
    if (soma === c.troca.peso) {
      j.joiaNoPedestal = false
      j.pedrasPresas = j.bandeja
      j.bandeja = []
      porNaMochila(c.troca.guarda)
      estado.novos.add(c.troca.guarda)
      registrar(id, `${QUEM} trocou ${PECAS[c.troca.guarda].nome} pelas pedras (peso ${soma})`, 'feito')
      aviso(`O pedestal nem se mexe. ${PECAS[c.troca.guarda].nome} está na sua mochila.`, 'feito')
      pintarTroca(id); pintarMochila(); pintarEncaixes(id); pintarEstado(id)
      return
    }
    animar(palco.querySelector('.pz [data-pedestal]'), [{ transform: 'translateY(0)' }, { transform: `translateY(${soma < c.troca.peso ? -1.4 : 1.4}cqw)`, offset: 0.4 }, { transform: 'translateY(0)' }], { duration: 520, easing: EASE_IN_OUT })
    castigar(id, soma === 0 ? 'Você tira a joia sem nada no lugar: o pedestal sobe de estalo.' : `O pedestal ${soma < c.troca.peso ? 'sobe' : 'afunda'}: ${romano(soma)} não é ${romano(c.troca.peso)}.`)
    setTimeout(() => { const a = palco.querySelector('.pz [data-agulha]'); if (a) a.style.transform = `rotate(${anguloPeso(c.troca.peso)}deg)` }, 380)
  }, reduzido() ? 0 : 400)
}

/* ---------------------------------------------------------------- Bento (outro jogador, simulado) e recomeçar */
function bentoAge() {
  const id = 'fonte', c = estado.cfg.fonte, j = estado.jogo.fonte
  if (j.resolvido) return
  const onde = Object.keys(j.pos).find((k) => j.pos[k]?.peca === 'med-sapo')
  if (onde && j.pos[onde].por === 'Bento') {
    j.pos[onde] = null
    estado.bentoTemSapo = true
    registrar(id, 'Bento tirou Medalhão do Sapo')
    aviso('Bento tirou o Medalhão do Sapo. Ele continua lá dentro.')
  } else if (estado.bentoTemSapo) {
    const livre = c.encaixes.find((e) => !j.pos[e.id] && aceita(id, e.id, 'med-sapo').ok)
    if (!livre) { aviso('Não há encaixe livre para o Bento.'); return }
    estado.bentoTemSapo = false
    por(id, livre.id, 'med-sapo', 'Bento')
    aviso('Bento pôs o Medalhão do Sapo.')
  } else return
  if (vistaAtual === id) { pintarEncaixes(id); pintarEstado(id); pintarBancada(id) }
}
function recomecar(id, quem = QUEM) {
  const c = estado.cfg[id], j = estado.jogo[id]
  const devolver = (peca, por_) => { if (por_ === 'Bento') estado.bentoTemSapo = true; else porNaMochila(peca) }
  for (const e of c.encaixes) {
    const v = j.pos[e.id]
    if (e.jeito === 'metades') { if (v.e) devolver(e.pecas[0], v.por); if (v.d) devolver(e.pecas[1], v.por) }
    else if (v) devolver(v.peca, v.por)
  }
  if (c.troca) {
    for (const p of [...j.bandeja, ...j.pedrasPresas]) porNaMochila(p)
    if (!j.joiaNoPedestal) tirarDaMochila(c.troca.guarda)
  }
  for (const e of c.encaixes) if (e.jeito === 'metades' && estado.mochila.includes(e.vira)) { tirarDaMochila(e.vira); porNaMochila(e.pecas[0]); porNaMochila(e.pecas[1]) }
  estado.recebidos = estado.recebidos.filter((k) => !c.desfecho.itens.includes(k))
  const novo = jogoInicial(c)
  novo.dentro = j.dentro
  estado.jogo[id] = novo
  if (estado.sel && !estado.mochila.includes(estado.sel)) estado.sel = null
  registrar(id, quem === 'mestre' ? 'O mestre recomeçou: as peças voltaram para quem pôs' : `${QUEM} recomeçou (protótipo)`)
}

function nivelInicial() {
  const est = [], marcas = [], paredes = new Set()
  let jog = null
  NIVEL.forEach((linha, y) => [...linha].forEach((ch, x) => {
    if (ch === '#') paredes.add(`${x},${y}`)
    if (ch === 'S') est.push({ x, y })
    if (ch === 'x') marcas.push({ x, y })
    if (ch === 'P') jog = { x, y }
  }))
  return { jog, est, marcas, paredes, hist: [], passos: 0, feito: false }
}
function amostrasIniciais() {
  return {
    relogio: { h: 12, m: 0, angH: 0, angM: 0, feito: false },
    piano: { ouvido: 0, feito: false, msg: '' },
    giro: { rot: [...GIRO_INICIO], feito: false },
    luzes: { acesas: [...LUZES_INICIO], toques: 0, feito: false },
    empurra: nivelInicial(),
  }
}
let AM = amostrasIniciais()
const perto = (alvo, ultimo) => alvo + 360 * Math.round((ultimo - alvo) / 360)
const horaTexto = (h, m) => `${h}:${String(m).padStart(2, '0')}`
const naMarca = (a) => a.est.filter((s) => a.marcas.some((m) => m.x === s.x && m.y === s.y)).length

function estadoAmostra(k) {
  const a = AM[k]
  if (k === 'relogio') return a.feito ? 'O relógio bate três vezes: uma gaveta abre.' : `Marca ${horaTexto(a.h, a.m)}.`
  if (k === 'piano') return a.feito ? 'A tampa do piano destrava.' : a.msg || `${a.ouvido} de ${SEQ_PIANO.length} notas certas.`
  if (k === 'giro') return a.feito ? 'O retrato desce: atrás dele, um nicho.' : `${a.rot.filter((r) => r % 360 === 0).length} de 9 peças em pé.`
  if (k === 'luzes') return a.feito ? 'As nove acesas: a grade do porão sobe.' : `${a.acesas.filter(Boolean).length} de 9 acesas · ${a.toques} toques.`
  return a.feito ? 'As duas estátuas assentaram: o portão do jardim abre.' : `${naMarca(a)} de ${a.marcas.length} nas marcas · ${a.passos} passos.`
}
function atualizarAmostra(k) {

function htmlRelogio() {

  for (let i = 0; i < 60; i++) {

  const ponteiro = (q, ang, haste, larg, alvoY, rot) => `<g class="ponteiro" data-ponteiro="${q}" tabindex="0" role="slider" aria-label="${rot}" ${q === 'h' ? `aria-valuemin="1" aria-valuemax="12" aria-valuenow="${a.h}" aria-valuetext="${a.h} horas"` : `aria-valuemin="0" aria-valuemax="55" aria-valuenow="${a.m}" aria-valuetext="${a.m} minutos"`} style="transform-box:view-box;transform-origin:100px 100px;transform:rotate(${ang}deg)">
      <line x1="100" y1="104" x2="100" y2="${alvoY}" stroke="transparent" stroke-width="22"/>
      <path class="ponteiro__haste" d="${haste}" stroke="${q === 'h' ? '#383a3c' : '#5d6164'}" stroke-width="${larg}" stroke-linecap="round" fill="none"/></g>`
  return `<div class="relogio"><svg viewBox="0 0 200 200" data-relogio role="group" aria-label="Mostrador do relógio">
    <circle cx="100" cy="100" r="97" fill="#b89552" stroke="#6e5931" stroke-width="4"/>
    <circle cx="100" cy="100" r="88" fill="#efe6d0" stroke="#8b8270" stroke-width="2"/>${marcas}
    ${ponteiro('h', a.angH, 'M100 112V54', 7, 46, 'Ponteiro das horas')}
    ${ponteiro('m', a.angM, 'M100 116V26', 4, 22, 'Ponteiro dos minutos')}
    <circle cx="100" cy="100" r="6" fill="#b89552" stroke="#6e5931" stroke-width="2" pointer-events="none"/></svg>
    <div class="relogio__bts" role="group" aria-label="Ajustar a hora">
      <button type="button" class="bt bt--p" data-acao="rel" data-d="-60">−1 h</button><button type="button" class="bt bt--p" data-acao="rel" data-d="60">+1 h</button>
      <button type="button" class="bt bt--p" data-acao="rel" data-d="-5">−5 min</button><button type="button" class="bt bt--p" data-acao="rel" data-d="5">+5 min</button></div></div>`
}
const totalRel = () => (AM.relogio.h % 12) * 60 + AM.relogio.m
function relogioPor(T, animado) {
  const a = AM.relogio
  if (a.feito) return
  T = ((T % 720) + 720) % 720
  a.h = Math.floor(T / 60) || 12
  a.m = T % 60
  a.angM = perto(a.m * 6, a.angM)
  a.angH = perto(T / 2, a.angH)
  for (const [q, ang] of [['h', a.angH], ['m', a.angM]]) {
    const g = palco.querySelector(`[data-ponteiro="${q}"]`)
    if (!g) continue
    g.classList.toggle('is-solto', !animado)
    g.style.transform = `rotate(${ang}deg)`
    g.setAttribute('aria-valuenow', q === 'h' ? a.h : a.m)
    g.setAttribute('aria-valuetext', q === 'h' ? `${a.h} horas` : `${a.m} minutos`)
  }
  if (a.h % 12 === 2 && a.m === 50) a.feito = true
  atualizarAmostra('relogio')
}
let arrastoPonteiro = null
palco.addEventListener('pointerdown', (ev) => {
  const g = ev.target.closest('[data-ponteiro]')
  if (!g || ev.button !== 0 || AM.relogio.feito) return
  const svg = g.ownerSVGElement
  arrastoPonteiro = { q: g.dataset.ponteiro, svg, id: ev.pointerId }
  svg.setPointerCapture(ev.pointerId)
  ev.preventDefault()
})
palco.addEventListener('pointermove', (ev) => {
  const p = arrastoPonteiro
  if (!p || ev.pointerId !== p.id) return
  const r = p.svg.getBoundingClientRect()
  let ang = (Math.atan2(ev.clientX - (r.left + r.width / 2), -(ev.clientY - (r.top + r.height / 2))) * 180) / Math.PI
  if (ang < 0) ang += 360
  const a = AM.relogio
  if (p.q === 'm') {
    const mNovo = (Math.round(ang / 30) * 5) % 60
    if (mNovo === a.m) return
    let T = (a.h % 12) * 60 + mNovo
    if (a.m >= 45 && mNovo < 15) T += 60
    if (a.m < 15 && mNovo >= 45) T -= 60
    relogioPor(T, false)
  } else {
    const hNovo = ((Math.round((ang - a.m / 2) / 30) % 12) + 12) % 12
    if (hNovo === a.h % 12) return
    relogioPor(hNovo * 60 + a.m, false)
  }
})
const soltarPonteiro = () => { arrastoPonteiro = null }
palco.addEventListener('pointerup', soltarPonteiro)
palco.addEventListener('pointercancel', soltarPonteiro)

/* peças giratórias */
const quartos = (r) => { const q = ((r % 360) + 360) % 360; return q === 0 ? 'em pé' : `girada ${q} graus` }
function htmlGiro() {
  const a = AM.giro
  return `<div class="giratorio" role="group" aria-label="Retrato em nove peças">${a.rot.map((r, i) => `<button type="button" class="tile" data-acao="girar-peca" data-i="${i}" aria-label="Peça ${i + 1}, ${quartos(r)}"${a.feito ? ' disabled' : ''}><svg class="tile__img" viewBox="${(i % 3) * 100} ${Math.floor(i / 3) * 100} 100 100" style="transform:rotate(${r}deg)" aria-hidden="true"><use href="#farol"/></svg></button>`).join('')}</div>`

function girarPeca(i) {
  const a = AM.giro
  if (a.feito) return
  a.rot[i] += 90
  const b = palco.querySelector(`.tile[data-i="${i}"]`)
  b.querySelector('svg').style.transform = `rotate(${a.rot[i]}deg)`
  b.setAttribute('aria-label', `Peça ${i + 1}, ${quartos(a.rot[i])}`)
  if (a.rot.every((r) => r % 360 === 0)) { a.feito = true; palco.querySelectorAll('.tile').forEach((t) => { t.disabled = true }) }
  atualizarAmostra('giro')
}

/* luzes */
function htmlLuzes() {
  const a = AM.luzes
  return `<div class="luzes" role="group" aria-label="Lamparinas">${a.acesas.map((on, i) => `<button type="button" class="luz" data-acao="luz" data-i="${i}" aria-pressed="${on}" aria-label="Lamparina ${i + 1}"${a.feito ? ' disabled' : ''}></button>`).join('')}</div>`
}
function tocarLuz(i) {
  const a = AM.luzes
  if (a.feito) return
  const x = i % 3, y = Math.floor(i / 3)
  for (const [dx, dy] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const nx = x + dx, ny = y + dy
    if (nx >= 0 && nx < 3 && ny >= 0 && ny < 3) a.acesas[ny * 3 + nx] = !a.acesas[ny * 3 + nx]
  }
  a.toques++
  if (a.acesas.every(Boolean)) a.feito = true
  palco.querySelectorAll('.luz').forEach((b, k) => { b.setAttribute('aria-pressed', a.acesas[k]); b.disabled = a.feito })
  atualizarAmostra('luzes')
}

function htmlEmpurra() {

  const jogador = `<g class="empurra__peca" data-jog style="transform:translate(${a.jog.x * CEL}px, ${a.jog.y * CEL}px)"><circle cx="20" cy="20" r="13" fill="#e8a2c4" stroke="#8b6176" stroke-width="3"/><text x="20" y="25" text-anchor="middle" style="font:600 14px Bahnschrift, 'Segoe UI', sans-serif" fill="#2a2620">L</text></g>`
  return `<div class="empurra"><div class="empurra__mapa" tabindex="0" role="application" aria-label="Jardim visto de cima. Setas andam e empurram; Z desfaz." data-empurra>

function posicionarEmpurra() {
  const a = AM.empurra
  const j = palco.querySelector('[data-jog]')
  if (!j) return
  j.style.transform = `translate(${a.jog.x * CEL}px, ${a.jog.y * CEL}px)`
  a.est.forEach((s, k) => {
    const g = palco.querySelector(`[data-est="${k}"]`)
    g.style.transform = `translate(${s.x * CEL}px, ${s.y * CEL}px)`
    g.querySelector('.empurra__ok').setAttribute('opacity', a.marcas.some((m) => m.x === s.x && m.y === s.y) ? '1' : '0')
  })
}
function andar(dx, dy) {
  const a = AM.empurra
  if (a.feito) return
  const nx = a.jog.x + dx, ny = a.jog.y + dy
  if (a.paredes.has(`${nx},${ny}`)) return
  const livre = (x, y) => !a.paredes.has(`${x},${y}`) && !a.est.some((s) => s.x === x && s.y === y)
  const k = a.est.findIndex((s) => s.x === nx && s.y === ny)
  if (k >= 0 && !livre(nx + dx, ny + dy)) { aviso('A estátua não passa: tem algo atrás dela.'); return }
  a.hist.push(JSON.stringify({ jog: a.jog, est: a.est, passos: a.passos }))
  if (k >= 0) a.est[k] = { x: nx + dx, y: ny + dy }
  a.jog = { x: nx, y: ny }
  a.passos++
  if (a.marcas.every((m) => a.est.some((s) => s.x === m.x && s.y === m.y))) a.feito = true
  posicionarEmpurra()
  atualizarAmostra('empurra')
}
function desfazerEmpurra() {
  const a = AM.empurra
  if (a.feito || !a.hist.length) return
  Object.assign(a, JSON.parse(a.hist.pop()))
  posicionarEmpurra()
  atualizarAmostra('empurra')
}
palco.addEventListener('keydown', (ev) => {
  const g = ev.target.closest?.('[data-ponteiro]')
  if (g) {
    const passo = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[ev.key]
    if (passo) { ev.preventDefault(); relogioPor(totalRel() + passo * (g.dataset.ponteiro === 'h' ? 60 : 5), false) }
    return
  }
  if (ev.target.closest?.('[data-empurra]')) {
    const d = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[ev.key]
    if (d) { ev.preventDefault(); andar(d[0], d[1]); return }
    if (ev.key === 'z' || ev.key === 'Z') { ev.preventDefault(); desfazerEmpurra() }
  }
})

    const v = j.pos[el.dataset.enc]
    if (v?.peca) porNaMochila(v.peca)
    c.encaixes = c.encaixes.filter((e) => e.id !== el.dataset.enc)
    delete j.pos[el.dataset.enc]
    c.encaixes.forEach((e, i) => { e.rot = String(i + 1) })
    repintarEditor('[data-acao="novo-enc"]')
  },
  'escolher-enc': (el) => {
    estado.encEscolhido = el.dataset.marco
    palco.querySelectorAll('.marco').forEach((m) => m.classList.toggle('is-escolhido', m.dataset.marco === estado.encEscolhido))
    palco.querySelectorAll('[data-enc-linha]').forEach((li) => li.classList.toggle('is-escolhido', li.dataset.encLinha === estado.encEscolhido))
  },
  testar: () => { const id = estado.editando; if (estado.fora[id] !== false) estado.fora[id] = undefined; ir(id) },
  apagar: (el) => {
    if (!confirmarApagar) { confirmarApagar = true; el.textContent = 'Apagar mesmo? Clique de novo'; return }
    confirmarApagar = false
    const id = estado.editando
    recomecar(id, 'mestre')
    delete estado.cfg[id]; delete estado.jogo[id]
    estado.ordemDosPuzzles = estado.ordemDosPuzzles.filter((k) => k !== id)
    ir('pagina')
    aviso('Puzzle apagado. As peças voltaram para quem pôs.')
  },
  'mestre-resolver': () => { resolver(estado.vivoDe, 'mestre'); vistaAoVivo(); aviso('Dado como resolvido. Os itens vão para quem está dentro.', 'feito') },
  'mestre-recomecar': () => { recomecar(estado.vivoDe, 'mestre'); vistaAoVivo(); aviso('Recomeçado: as peças voltaram para quem pôs.') },
  'bento-vivo': () => { bentoAge(); vistaAoVivo() },
})
Object.assign(MUDANCAS, {
  nome: (el) => { const c = estado.cfg[estado.editando]; c.nome = el.value; const h = palco.querySelector('[data-nome-cab]'); if (h) h.textContent = el.value || 'Puzzle sem nome' },
  lugar: (el) => {
    const c = estado.cfg[estado.editando]
    const base = BASE[c.visual.modelo]?.lugar
    c.lugar = el.value === 'objeto' ? { tipo: 'objeto', texto: base?.tipo === 'objeto' ? base.texto : 'num objeto do mapa' } : el.value === 'ponto' ? { tipo: 'ponto', texto: base?.tipo === 'ponto' ? base.texto : 'num ponto do mapa' } : { tipo: 'nenhum', texto: 'sem lugar no mapa' }
    repintarEditor(`[data-campo="lugar"][value="${el.value}"]`)
  },
  tipo: (el) => {
    const id = estado.editando, c = estado.cfg[id]
    recomecar(id, 'mestre')
    c.tipo = el.value
    if (c.tipo === 'combinacao' && !c.combinacao) c.combinacao = { numeros: [1, 2, 3], simbolos: ['coroa', 'olho', 'chave'] }
    const dentro = estado.jogo[id].dentro
    estado.jogo[id] = jogoInicial(c)
    estado.jogo[id].dentro = dentro
    repintarEditor(`[data-campo="tipo"][value="${el.value}"]`)
  },
  qualquer: (el) => { estado.cfg[estado.editando].qualquerOrdem = el.checked },
  visual: (el) => {
    const id = estado.editando, c = estado.cfg[id]
    if (el.value === 'modelo') aplicarModelo(id, c.visual.modelo || 'fonte')
    else c.visual.tipo = 'imagem'
    repintarEditor(`[data-campo="visual"][value="${el.value}"]`)
  },
  imagem: (el) => {
    const f = el.files?.[0]
    if (!f) return
    if (!f.type.startsWith('image/')) { aviso('Esse arquivo não é uma imagem.', 'perigo'); return }
    const leitor = new FileReader()
    leitor.onload = () => { estado.cfg[estado.editando].visual.imagem = leitor.result; repintarEditor(); aviso('Imagem carregada. Agora arraste os encaixes.', 'feito') }
    leitor.onerror = () => aviso('Não consegui ler a imagem.', 'perigo')
    leitor.readAsDataURL(f)
  },
  'enc-peca': (el) => { enc(estado.editando, el.dataset.enc).peca = el.value; const t = palco.querySelector(`[data-marco="${el.dataset.enc}"]`); if (t) t.setAttribute('aria-label', `Encaixe: ${PECAS[el.value]?.nome ?? 'sem peça'}`) },
  'enc-metade': (el) => { enc(estado.editando, el.dataset.enc).pecas[+el.dataset.k] = el.value },
  'segredo-num': (el) => { if (/^[0-9]{3}$/.test(el.value)) estado.cfg[estado.editando].combinacao.numeros = [...el.value].map(Number) },
  'segredo-sim': (el) => { estado.cfg[estado.editando].combinacao.simbolos[+el.dataset.k] = el.value },
  peso: (el) => { const v = Math.round(+el.value); if (v >= 1 && v <= 8) estado.cfg[estado.editando].troca.peso = v },
  dica: (el) => { estado.cfg[estado.editando].dica = el.value },
  desfecho: (el) => { estado.cfg[estado.editando].desfecho.tipo = el.value; repintarEditor(`[data-campo="desfecho"][value="${el.value}"]`) },
  'desfecho-texto': (el) => { estado.cfg[estado.editando].desfecho.texto = el.value },
  'dar-item': (el) => { if (!el.value) return; estado.cfg[estado.editando].desfecho.itens.push(el.value); repintarEditor('[data-campo="dar-item"]') },
  castigo: (el) => { estado.cfg[estado.editando].castigo.tipo = el.value; repintarEditor(`[data-campo="castigo"][value="${el.value}"]`) },
  dano: (el) => { const v = Math.round(+el.value); if (v >= 1 && v <= 20) estado.cfg[estado.editando].castigo.dano = v },
  'castigo-texto': (el) => { estado.cfg[estado.editando].castigo.texto = el.value },
  'vivo-de': (el) => { estado.vivoDe = el.value; vistaAoVivo(); palco.querySelector('[data-campo="vivo-de"]')?.focus() },
})

/* marcos de encaixe: arrastar e setas (imagem própria) */
let arrastoMarco = null
palco.addEventListener('pointerdown', (ev) => {
  const m = ev.target.closest('.marco[data-marco]')
  if (!m || ev.button !== 0 || m.getAttribute('aria-disabled') === 'true') return
  arrastoMarco = { el: m, encId: m.dataset.marco, caixa: m.parentElement.getBoundingClientRect(), id: ev.pointerId }
  m.setPointerCapture(ev.pointerId)
})
palco.addEventListener('pointermove', (ev) => {
  const a = arrastoMarco
  if (!a || ev.pointerId !== a.id) return
  const x = Math.min(97, Math.max(3, ((ev.clientX - a.caixa.left) / a.caixa.width) * 100))
  const y = Math.min(96, Math.max(4, ((ev.clientY - a.caixa.top) / a.caixa.height) * 100))
  moverMarco(a.el, a.encId, x, y)
})
const soltarMarco = () => { arrastoMarco = null }
palco.addEventListener('pointerup', soltarMarco)
palco.addEventListener('pointercancel', soltarMarco)
function moverMarco(el, encId, x, y) {
  const e = enc(estado.editando, encId)
  if (!e) return
  e.x = Math.round(x * 10) / 10
  e.y = Math.round(y * 10) / 10
  el.style.left = `${e.x}%`
  el.style.top = `${e.y}%`
}
palco.addEventListener('keydown', (ev) => {
  const m = ev.target.closest?.('.marco[data-marco]')
  if (!m || m.getAttribute('aria-disabled') === 'true') return
  const d = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[ev.key]
  if (!d) return
  ev.preventDefault()
  const e = enc(estado.editando, m.dataset.marco), passo = ev.shiftKey ? 5 : 1
  moverMarco(m, m.dataset.marco, Math.min(97, Math.max(3, e.x + d[0] * passo)), Math.min(96, Math.max(4, e.y + d[1] * passo)))
})

/* ============================================================== eventos gerais, roteador, arranque */
palco.addEventListener('click', (ev) => {
  if (ignorarClique) { ignorarClique = false; return }
  const acao = ev.target.closest('[data-acao]')
  if (acao && palco.contains(acao)) {
    if (acao.disabled) return
    const f = ACOES[acao.dataset.acao]
    if (f) { f(acao, ev); return }
  }
  const item = ev.target.closest('.pz .item[data-peca]')
  if (item) { escolher(item.dataset.peca, ev.detail === 0); return }
  const alvo = ev.target.closest('.pz [data-alvo]')
  if (alvo && puzzleAtual) {
    if (alvo.getAttribute('aria-disabled') === 'true') {
      if (estado.jogo[puzzleAtual].resolvido) aviso('Preso: o puzzle já foi resolvido.')
      else if (alvo.dataset.alvo === 'bandeja') aviso('As pedras ficaram presas no lugar da joia.')
      return
    }
    if (alvo.dataset.alvo === 'encaixe') clicarEncaixe(puzzleAtual, alvo.dataset.enc)
    else clicarBandeja()
  }
})
function despacharMudanca(ev) {
  const el = ev.target, campo = el.dataset?.campo
  if (!campo || !MUDANCAS[campo]) return
  const deTexto = el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'number'))
  if (deTexto !== (ev.type === 'input')) return
  MUDANCAS[campo](el, ev)
}
palco.addEventListener('input', despacharMudanca)
palco.addEventListener('change', despacharMudanca)
document.addEventListener('keydown', (ev) => {
  const emCampo = ev.target.closest?.('input, textarea, select')
  if (ev.key === 'Escape') {
    if (arrasto) { cancelarArrasto(); ev.preventDefault(); return }
    if (puzzleAtual && vistaAtual === puzzleAtual) {
      const j = estado.jogo[puzzleAtual]
      if (j.cartao && palco.querySelector('[data-resultado]')) { fecharResultado(); return }
      if (estado.sel) {
        const p = estado.sel
        estado.sel = null
        pintarMochila(); pintarEncaixes(puzzleAtual)
        palco.querySelector(`.item[data-peca="${p}"]`)?.focus()
        return
      }
      if (!estado.fora[puzzleAtual] && !emCampo) { sair(puzzleAtual); return }
    }
    if (!emCampo && (vistaAtual === 'editor' || vistaAtual === 'aovivo')) ir('pagina')
    return
  }
  if ((ev.key === 'e' || ev.key === 'E') && !emCampo && !ev.ctrlKey && !ev.metaKey && !ev.altKey && puzzleAtual && vistaAtual === puzzleAtual && estado.fora[puzzleAtual]) {
    ev.preventDefault()
    entrarEPintar(puzzleAtual)
  }
})

const VISTAS = { amostras: vistaAmostras, pagina: vistaPagina, editor: vistaEditor, aovivo: vistaAoVivo }
function ir(v) {
  // pushState não dispara hashchange: a tela nova já existe quando ir() volta (foco e aviso dependem disso)
  if (decodeURIComponent(location.hash.slice(1)) !== v) history.pushState(null, '', `#${v}`)
  render()
}
function render() {
  cancelarArrasto()
  let v = decodeURIComponent(location.hash.slice(1)) || 'fonte'
  if (!(v in VISTAS) && !(v in estado.cfg)) v = 'fonte'
  if (v !== vistaAtual) { estado.sel = null; confirmarApagar = false }
  vistaAtual = v
  if (v in estado.cfg) vistaPuzzle(v)
  else { puzzleAtual = null; VISTAS[v]() }
  $$('.topo__bt').forEach((b) => { if (b.dataset.vista === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current') })
}
function aplicarRM() {
  document.documentElement.classList.toggle('rm', reduzido())
  const cb = $('#rm')
  cb.checked = reduzido()
  cb.disabled = mqRM.matches
  cb.parentElement.title = mqRM.matches ? 'O sistema já pede movimento reduzido' : 'Simula o pedido de movimento reduzido do sistema'
}

gerarGrao()
$('svg defs').insertAdjacentHTML('beforeend', FAROL)
aplicarRM()
mqRM.addEventListener('change', aplicarRM)
$('#rm').addEventListener('change', (ev) => { rmManual = ev.target.checked; aplicarRM() })
$$('.topo__bt').forEach((b) => b.addEventListener('click', () => ir(b.dataset.vista)))
// voltar/avançar do navegador ou hash digitado: só repinta se a vista mudou (os dois eventos podem vir juntos)
const aoNavegar = () => { if ((decodeURIComponent(location.hash.slice(1)) || 'fonte') !== vistaAtual) render() }
window.addEventListener('hashchange', aoNavegar)
window.addEventListener('popstate', aoNavegar)
render()

/* para as provas (Playwright): só leitura do estado e um recomeço geral */
window.Proto = {
  estado: () => estado,
  amostras: () => AM,
  ir,
  reduzido,
  recomecarTudo() { estado = estadoInicial(); AM = amostrasIniciais(); mapaCache = ''; render() },
}
})()
</script>
