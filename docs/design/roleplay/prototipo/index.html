<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Roleplay do Labirinto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: tres colunas sob o "lampiao sobre a mesa" do app. O Palco (centro) fica sob a luz,
   o Elenco (esquerda) e os Bastidores (direita) ficam na penumbra.
   Tema unico escuro, como o app: os tokens --lb-* sao os mesmos nomes de client/src/theme.ts;
   os --rp-* sao a extensao desta tela (o papel iluminado onde o narrador escreve). */
:root {
  color-scheme: dark;
  --lb-color-ink: #121214;
  --lb-color-stone: rgba(19, 19, 23, 0.94);
  --lb-color-stone-solid: #1a1a1e;
  --lb-color-stone-raised: #232328;
  --lb-color-stone-hover: #2c2c33;
  --lb-color-stone-sunken: #141417;
  --lb-color-line: rgba(255, 255, 255, 0.08);
  --lb-color-line-strong: rgba(255, 255, 255, 0.16);
  --lb-color-line-panel: rgba(255, 255, 255, 0.13);
  --lb-color-parchment: #eceae4;
  --lb-color-parchment-dim: #a2a09a;
  --lb-color-parchment-faint: #858480;
  --lb-color-brass: #e0a44a;
  --lb-color-brass-bright: #f3ba66;
  --lb-color-brass-soft: rgba(224, 164, 74, 0.14);
  --lb-color-brass-contrast: #1c1608;
  --lb-color-ember: #e2645a;
  --lb-color-ember-soft: rgba(226, 100, 90, 0.14);
  --lb-color-online: #7fb48a;
  --lb-color-online-soft: rgba(127, 180, 138, 0.14);
  --lb-color-tide: #79a9cc;
  --lb-color-tide-soft: rgba(121, 169, 204, 0.14);
  --lb-color-arcane: #ab93d6;
  --lb-color-arcane-soft: rgba(171, 147, 214, 0.15);
  --rp-paper: #1f1a14;
  --rp-paper-edge: rgba(224, 164, 74, 0.2);
  --rp-paper-ink: #ebe0c9;
  --rp-shade: rgba(12, 12, 14, 0.86);

  --lb-font-display: 'Sitka Banner', 'Sitka Display', Sitka, 'Source Serif 4', Constantia, Georgia, serif;
  --rp-font-narration: 'Sitka Text', Sitka, 'Source Serif 4', Constantia, Georgia, serif;
  --lb-font-sans: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --lb-font-utility: Bahnschrift, 'DIN Alternate', Barlow, 'Segoe UI Variable Small', 'Segoe UI', system-ui, sans-serif;

  --lb-radius-sm: 6px;
  --lb-radius-md: 9px;
  --lb-radius-lg: 14px;
  --lb-shadow-float: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 14px rgba(0, 0, 0, 0.44), 0 20px 46px rgba(0, 0, 0, 0.55);
  --lb-shadow-focus: 0 0 0 2px var(--lb-color-stone-solid), 0 0 0 4px var(--lb-color-brass);
  --lb-shadow-bevel: inset 0 1px 0 rgba(255, 255, 255, 0.07);
  --lb-motion-fast: 110ms;
  --lb-motion-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --rp-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --rp-ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --rp-bar-h: 44px;
  --rp-cast-w: 284px;
  --rp-side-w: 344px;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--lb-color-ink);
  color: var(--lb-color-parchment);
  font: 13px/1.45 var(--lb-font-sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: none; box-shadow: var(--lb-shadow-focus); }
p, h1, h2, h3, h4, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.mark { width: 60%; height: 60%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; }
kbd { padding: 0 5px; border: 1px solid var(--lb-color-line-strong); border-radius: 4px; font: 500 10.5px/16px var(--lb-font-utility); color: var(--lb-color-parchment-dim); }
code { font: 500 11.5px var(--lb-font-utility); color: var(--lb-color-brass-bright); }

/* ---------------------------------------------------------------- botoes do app */
.lb-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 34px; padding: 0 12px;
  border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-md);
  background: var(--lb-color-stone-raised); color: var(--lb-color-parchment);
  font-size: 13px; font-weight: 500; white-space: nowrap;
  transition: background-color var(--lb-motion-fast) var(--lb-motion-ease), border-color var(--lb-motion-fast) var(--lb-motion-ease), color var(--lb-motion-fast) var(--lb-motion-ease), transform var(--lb-motion-fast) var(--lb-motion-ease);
}
.lb-btn:active:not(:disabled) { background: var(--lb-color-stone-sunken); transform: scale(0.97); }
.lb-btn:disabled { color: var(--lb-color-parchment-faint); background: transparent; border-color: var(--lb-color-line); }
.lb-btn--primary { background: var(--lb-color-brass); border-color: var(--lb-color-brass); color: var(--lb-color-brass-contrast); font-weight: 600; }
.lb-btn--primary:active:not(:disabled) { background: var(--lb-color-brass); }
.lb-btn--ghost { background: transparent; border-color: transparent; color: var(--lb-color-parchment-dim); }
.lb-btn--compact { min-height: 28px; padding: 0 10px; font-size: 12px; }
.lb-btn--block { width: 100%; }
.lb-btn--reveal { background: transparent; border-color: rgba(224, 164, 74, 0.42); color: var(--lb-color-brass-bright); }
@media (hover: hover) and (pointer: fine) {
  .lb-btn:hover:not(:disabled) { background: var(--lb-color-stone-hover); border-color: var(--lb-color-line-strong); }
  .lb-btn--primary:hover:not(:disabled) { background: var(--lb-color-brass-bright); border-color: var(--lb-color-brass-bright); }
  .lb-btn--ghost:hover:not(:disabled) { color: var(--lb-color-parchment); }
  .lb-btn--reveal:hover:not(:disabled) { background: var(--lb-color-brass-soft); border-color: var(--lb-color-brass); }
}
.icon-btn {
  display: inline-grid; place-items: center; width: 28px; height: 28px; flex: none;
  border: 1px solid transparent; border-radius: var(--lb-radius-sm);
  background: transparent; color: var(--lb-color-parchment-faint);
  transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-motion-ease);
}
.icon-btn:active:not(:disabled) { transform: scale(0.94); }
.icon-btn:disabled { opacity: 0.35; }
@media (hover: hover) and (pointer: fine) {
  .icon-btn:hover:not(:disabled) { background: var(--lb-color-stone-hover); color: var(--lb-color-parchment); }
}
.tag {
  display: inline-flex; align-items: center; gap: 4px; flex: none;
  padding: 1px 7px; border-radius: 999px;
  border: 1px solid var(--lb-color-line-strong);
  font: 500 10.5px/16px var(--lb-font-utility); letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--lb-color-parchment-faint);
}
.tag .i { width: 12px; height: 12px; }
.tag--arc { border-color: rgba(171, 147, 214, 0.4); color: var(--lb-color-arcane); }
.tag--brass { border-color: rgba(224, 164, 74, 0.4); color: var(--lb-color-brass-bright); }
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 999px;
  background: var(--lb-color-brass-soft); color: var(--lb-color-brass-bright);
  font: 500 10.5px/1 var(--lb-font-utility); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
}

/* ---------------------------------------------------------------- moldura */
.rp {
  position: relative; isolation: isolate;
  display: grid; grid-template-rows: var(--rp-bar-h) minmax(0, 1fr);
  height: 100%; overflow: hidden;
}
.rp::before {
  content: ''; position: absolute; inset: 0; z-index: -2; pointer-events: none;
  background-image: linear-gradient(var(--lb-color-line) 1px, transparent 1px), linear-gradient(90deg, var(--lb-color-line) 1px, transparent 1px);
  background-size: 64px 64px; opacity: 0.3;
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 32%, #000 0%, transparent 100%);
  mask-image: radial-gradient(ellipse 70% 60% at 50% 32%, #000 0%, transparent 100%);
}
.rp::after {
  content: ''; position: absolute; top: -240px; left: 50%; z-index: -1; pointer-events: none;
  width: 980px; height: 640px; transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(224, 164, 74, 0.12) 0%, transparent 68%);
}

/* ---------------------------------------------------------------- barra do topo */
.bar {
  position: relative; z-index: 10;
  display: flex; align-items: center; gap: 14px; min-width: 0;
  padding-inline: 16px;
  background: var(--lb-color-stone-solid); border-bottom: 1px solid var(--lb-color-line);
  animation: rp-fade 400ms ease both;
}
.bar__mark { display: grid; place-items: center; flex: none; color: var(--lb-color-brass); }
.bar__mark svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: square; }
.crumbs {
  display: flex; align-items: center; gap: 8px; flex: none;
  font: 11.5px/1 var(--lb-font-utility); letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--lb-color-parchment-faint); white-space: nowrap;
}
.crumbs span + span::before { content: '\203A'; margin-right: 8px; color: var(--lb-color-parchment-faint); }
.crumbs [aria-current] { color: var(--lb-color-parchment); }
.bar__sep { width: 1px; height: 20px; flex: none; background: var(--lb-color-line-strong); }
.session { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.session__name { font: 400 17px/1.2 var(--lb-font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.session__meta { font: 12px var(--lb-font-utility); color: var(--lb-color-parchment-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar__spacer { flex: 1; min-width: 0; }
.bar__right { display: flex; align-items: center; gap: 14px; flex: none; }
.presence { display: flex; align-items: center; gap: 6px; }
.pres {
  --tone: var(--lb-color-parchment-dim); --tone-soft: rgba(255, 255, 255, 0.06);
  position: relative; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  background: var(--tone-soft); color: var(--tone);
  font: 600 11px/1 var(--lb-font-utility); letter-spacing: 0.02em;
}
.pres[data-tom='tide'] { --tone: var(--lb-color-tide); --tone-soft: var(--lb-color-tide-soft); }
.pres[data-tom='arcane'] { --tone: var(--lb-color-arcane); --tone-soft: var(--lb-color-arcane-soft); }
.pres[data-tom='ember'] { --tone: var(--lb-color-ember); --tone-soft: var(--lb-color-ember-soft); }
.pres[data-tom='online'] { --tone: var(--lb-color-online); --tone-soft: var(--lb-color-online-soft); }
.pres[data-tom='brass'] { --tone: var(--lb-color-brass); --tone-soft: var(--lb-color-brass-soft); }
.pres__dot, .av__dot {
  position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--lb-color-online); box-shadow: 0 0 0 2px var(--lb-color-stone-solid);
  transition: background-color 160ms ease;
}
.pres[data-state='ausente'] { opacity: 0.55; }
[data-state='ausente'] > .pres__dot, .av__dot[data-state='ausente'] { background: var(--lb-color-stone-solid); box-shadow: inset 0 0 0 1.5px var(--lb-color-parchment-faint), 0 0 0 2px var(--lb-color-stone-solid); }
[data-state='digitando'] > .pres__dot, .av__dot[data-state='digitando'] { background: var(--lb-color-brass); }
.live {
  display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 11px 0 10px;
  border: 1px solid var(--lb-color-line); border-radius: 999px; background: transparent;
  font: 500 11.5px/1 var(--lb-font-utility); letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--lb-color-parchment); white-space: nowrap;
  transition: border-color var(--lb-motion-fast) ease, background-color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-motion-ease);
}
button.live:active { transform: scale(0.97); }
.live__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lb-color-ember); box-shadow: 0 0 0 3px var(--lb-color-ember-soft); animation: rp-live 2.4s ease-in-out infinite; }
.live[data-paused='true'] { color: var(--lb-color-parchment-dim); }
.live[data-paused='true'] .live__dot { animation: none; background: var(--lb-color-parchment-faint); box-shadow: none; }
@media (hover: hover) and (pointer: fine) { button.live:hover { border-color: var(--lb-color-line-strong); background: var(--lb-color-stone-raised); } }
.viewas { display: flex; align-items: center; gap: 8px; }
.viewas__lbl { font-size: 12px; color: var(--lb-color-parchment-faint); white-space: nowrap; }
.seg {
  display: inline-flex; gap: 2px; padding: 2px;
  border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-md); background: var(--lb-color-stone-sunken);
}
.seg button {
  height: 26px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent;
  color: var(--lb-color-parchment-dim); font-size: 12px; font-weight: 500; white-space: nowrap;
  transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-motion-ease);
}
.seg button:active:not(:disabled) { transform: scale(0.97); }
.seg button[aria-checked='true'] { background: var(--lb-color-stone-hover); color: var(--lb-color-parchment); box-shadow: var(--lb-shadow-bevel); }
.seg button:disabled { color: var(--lb-color-parchment-faint); opacity: 0.5; }
@media (hover: hover) and (pointer: fine) { .seg button:hover:not(:disabled):not([aria-checked='true']) { color: var(--lb-color-parchment); } }

/* balao de dica do app: espera so no primeiro, nada de loop */
.tipped { position: relative; }
.tipped::after {
  content: attr(data-tip); position: absolute; top: calc(100% + 8px); left: 50%; z-index: 40;
  padding: 5px 8px; border-radius: 6px; border: 1px solid var(--lb-color-line-strong);
  background: var(--lb-color-stone-raised); box-shadow: var(--lb-shadow-float);
  font: 400 12px/1.3 var(--lb-font-sans); letter-spacing: 0; text-transform: none; color: var(--lb-color-parchment); white-space: nowrap;
  opacity: 0; pointer-events: none; transform: translate(-50%, -3px);
  transition: opacity 120ms ease, transform 140ms var(--rp-ease-out);
}
.tipped--end::after { left: auto; right: 0; transform: translateY(-3px); }
.tipped--up::after { top: auto; bottom: calc(100% + 8px); transform: translate(-50%, 3px); }
.tipped--up.tipped--start::after, .tipped--start::after { left: 0; transform: translateY(3px); }
@media (hover: hover) and (pointer: fine) {
  .tipped:hover::after { opacity: 1; transform: translate(-50%, 0); transition-delay: 320ms; }
  .tipped--end:hover::after, .tipped--start:hover::after { transform: none; }
}
.tipped:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }
.tipped--end:focus-visible::after, .tipped--start:focus-visible::after { transform: none; }

/* ---------------------------------------------------------------- grade principal */
.main {
  position: relative; min-height: 0;
  display: grid; grid-template-columns: var(--rp-cast-w) minmax(0, 1fr) var(--rp-side-w); gap: 14px;
  padding: 14px 16px 16px;
}
.col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.cast { grid-column: 1; grid-row: 1; animation: rp-rise 560ms var(--rp-ease-out) 60ms both; }
.stage { grid-column: 2; grid-row: 1; animation: rp-rise 560ms var(--rp-ease-out) 120ms both; }
.side { grid-column: 3; grid-row: 1; animation: rp-rise 560ms var(--rp-ease-out) 180ms both; }
.scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--lb-color-line-strong) transparent; }

/* ---------------------------------------------------------------- Elenco */
.cast { gap: 8px; overflow-y: auto; overflow-x: hidden; padding: 2px 4px 4px 2px; scrollbar-width: thin; scrollbar-color: var(--lb-color-line-strong) transparent; }
.colhead { display: flex; align-items: center; gap: 8px; padding: 0 2px; min-height: 28px; }
.colhead__title { font: 400 20px/1.2 var(--lb-font-display); letter-spacing: -0.01em; }
.colhead__title--sm { font-size: 16px; }
.colhead__meta { margin-left: auto; font: 12px var(--lb-font-utility); color: var(--lb-color-parchment-faint); white-space: nowrap; }
.colhead--sub { margin-top: 2px; }
.rail-toggle { display: none; }
.pcs { display: flex; flex-direction: column; gap: 6px; }
.pc {
  position: relative; overflow: hidden;
  display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 10px; row-gap: 7px;
  padding: 9px 12px 10px;
  border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-lg);
  background: var(--lb-color-stone-solid); box-shadow: var(--lb-shadow-bevel);
}
.pc[data-me='true'] { border-color: rgba(171, 147, 214, 0.38); }
.pc__id { min-width: 0; align-self: center; }
.pc__name { display: flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc__sub { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 12px; color: var(--lb-color-parchment-dim); white-space: nowrap; overflow: hidden; }
.pc__player { flex: none; font: 600 10.5px/1 var(--lb-font-utility); letter-spacing: 0.08em; text-transform: uppercase; color: var(--lb-color-parchment-faint); }
.pc__player[data-away='true']::after { content: ', ausente'; text-transform: none; letter-spacing: 0; font-weight: 400; }
.me-tag { font: 500 10px/1 var(--lb-font-utility); letter-spacing: 0.08em; text-transform: uppercase; color: var(--lb-color-arcane); }
.pc__shield { display: inline-flex; align-items: center; gap: 4px; align-self: end; font: 500 12px/1 var(--lb-font-utility); color: var(--lb-color-parchment-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pc__shield .i { width: 13px; height: 13px; color: var(--lb-color-parchment-faint); }
.pc__res { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; }
.pc > .av { width: 40px; height: 40px; font-size: 16px; }
.res { display: grid; grid-template-columns: auto 1fr; align-items: baseline; row-gap: 4px; column-gap: 6px; min-width: 0; }
.res__lbl { font: 600 10.5px/1 var(--lb-font-utility); letter-spacing: 0.08em; color: var(--lb-color-parchment-faint); }
.res__num { justify-self: end; font: 500 12px/1 var(--lb-font-utility); color: var(--lb-color-parchment); font-variant-numeric: tabular-nums; white-space: nowrap; }
.res__num small { font-size: 11px; color: var(--lb-color-parchment-faint); }
.res__bar { grid-column: 1 / -1; height: 4px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
.res__bar i { display: block; height: 100%; border-radius: inherit; transform-origin: left center; transition: transform 300ms var(--rp-ease-out); }
.res[data-tom='vida'] .res__bar i { background: var(--lb-color-ember); }
.res[data-tom='energia'] .res__bar i { background: var(--lb-color-tide); }
.chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
.chip { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--lb-color-line); background: var(--lb-color-stone-raised); font-size: 11.5px; line-height: 16px; color: var(--lb-color-parchment-dim); white-space: nowrap; }
.chip[data-k='bom'] { border-color: transparent; background: var(--lb-color-online-soft); color: var(--lb-color-online); }
.chip[data-k='mal'] { border-color: transparent; background: var(--lb-color-ember-soft); color: var(--lb-color-ember); }
.chip[data-k='traco'] { border-color: transparent; background: var(--lb-color-brass-soft); color: var(--lb-color-brass-bright); }
/* holofote: ha quanto tempo o personagem nao age; a linha no pe do cartao cresce com a espera */
.spot { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; min-height: 22px; }
.spot__txt { flex: 1; min-width: 0; font-size: 12px; color: var(--lb-color-parchment-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.spot__txt b { font-weight: 600; }
.pc[data-wait='warn'] .spot__txt b { color: var(--lb-color-brass-bright); }
.pc[data-wait='alert'] .spot__txt b { color: var(--lb-color-ember); }
.spot__give {
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; flex: none;
  border: 1px solid var(--lb-color-line); border-radius: 999px; background: transparent;
  font-size: 11.5px; color: var(--lb-color-parchment-dim);
  opacity: 0; transition: opacity 140ms ease, background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-motion-ease);
}
.spot__give .i { width: 13px; height: 13px; }
.pc:hover .spot__give, .pc:focus-within .spot__give, .pc[data-wait='alert'] .spot__give { opacity: 1; }
.pc[data-wait='alert'] .spot__give { border-color: rgba(226, 100, 90, 0.4); color: var(--lb-color-ember); }
.spot__give:active { transform: scale(0.96); }
@media (hover: none) { .spot__give { opacity: 1; } }
@media (hover: hover) and (pointer: fine) { .spot__give:hover { background: var(--lb-color-stone-hover); color: var(--lb-color-parchment); } }
.spot__track { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255, 255, 255, 0.04); }
.spot__track i { display: block; height: 100%; transform-origin: left center; background: var(--lb-color-parchment-faint); transition: transform 600ms var(--rp-ease-out), background-color 300ms ease; }
.pc[data-wait='warn'] .spot__track i { background: var(--lb-color-brass); }
.pc[data-wait='alert'] .spot__track i { background: var(--lb-color-ember); }
.pc__mini { display: none; }

.av {
  --tone: var(--lb-color-parchment-dim); --tone-soft: rgba(255, 255, 255, 0.06);
  position: relative; display: grid; place-items: center; flex: none;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--tone-soft); color: var(--tone);
  font: 400 17px/1 var(--lb-font-display); letter-spacing: 0.02em; user-select: none;
}
.av[data-tom='tide'] { --tone: var(--lb-color-tide); --tone-soft: var(--lb-color-tide-soft); }
.av[data-tom='arcane'] { --tone: var(--lb-color-arcane); --tone-soft: var(--lb-color-arcane-soft); }
.av[data-tom='ember'] { --tone: var(--lb-color-ember); --tone-soft: var(--lb-color-ember-soft); }
.av[data-tom='online'] { --tone: var(--lb-color-online); --tone-soft: var(--lb-color-online-soft); }
.av--npc { border-radius: 11px; background: var(--lb-color-stone-raised); color: var(--lb-color-parchment-dim); box-shadow: inset 0 0 0 1px var(--lb-color-line-strong); }
.av--gm { background: var(--lb-color-brass-soft); color: var(--lb-color-brass); }
.av--ooc { background: transparent; color: var(--lb-color-parchment-faint); box-shadow: inset 0 0 0 1px var(--lb-color-line-strong); }
.av--lg { width: 56px; height: 56px; font-size: 22px; }
.av--sm { width: 32px; height: 32px; font-size: 13px; }
.av--sm.av--npc { border-radius: 9px; }
.av--xs { width: 22px; height: 22px; font-size: 9.5px; }
.av--xs.av--npc { border-radius: 6px; }
.av--xs .i { width: 13px; height: 13px; }

.npcs { display: flex; flex-direction: column; gap: 2px; }
.npc { position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 5px 4px 5px 6px; border-radius: var(--lb-radius-md); }
.npc__name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.npc__sub { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 11.5px; color: var(--lb-color-parchment-faint); white-space: nowrap; }
.npc__role { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.att { flex: none; color: var(--lb-color-parchment-dim); }
.att[data-k='bom'] { color: var(--lb-color-online); }
.att[data-k='mal'] { color: var(--lb-color-ember); }
.npc__act { display: flex; align-items: center; }
/* tirar de cena: selo no canto do retrato, aparece com o ponteiro ou o foco na linha */
.npc__x {
  position: absolute; left: 0; top: -1px; z-index: 1;
  display: grid; place-items: center; width: 24px; height: 24px; padding: 0;
  border: 0; border-radius: 50%; background: transparent; color: var(--lb-color-parchment-dim);
  opacity: 0; transition: opacity 140ms ease, transform var(--lb-motion-fast) var(--lb-motion-ease);
}
.npc__x::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--lb-color-stone-hover); box-shadow: 0 0 0 1px var(--lb-color-line-strong); }
.npc__x .i { position: relative; width: 10px; height: 10px; stroke-width: 2.2; }
.npc__x:active { transform: scale(0.92); }
.npc:hover .npc__x, .npc:focus-within .npc__x { opacity: 1; }
@media (hover: none) { .npc__x { opacity: 1; } }
@media (hover: hover) and (pointer: fine) { .npc__x:hover { color: var(--lb-color-ember); } }
.npc--empty { display: block; padding: 8px; font-size: 12px; color: var(--lb-color-parchment-faint); }
.npc__quick { display: none; }
.btn-mini {
  height: 26px; padding: 0 9px; border: 1px solid var(--lb-color-line); border-radius: 999px;
  background: var(--lb-color-stone-raised); font-size: 11.5px; color: var(--lb-color-parchment-dim); white-space: nowrap;
  transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-motion-ease);
}
.btn-mini:active { transform: scale(0.96); }
.btn-mini[aria-pressed='true'] { border-color: rgba(224, 164, 74, 0.45); color: var(--lb-color-brass-bright); background: var(--lb-color-brass-soft); }
@media (hover: hover) and (pointer: fine) { .btn-mini:hover { background: var(--lb-color-stone-hover); color: var(--lb-color-parchment); } }
.pophost { position: relative; }
.addnpc {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; margin-left: 2px;
  border: 1px dashed var(--lb-color-line-strong); border-radius: var(--lb-radius-md); background: transparent;
  font-size: 12px; color: var(--lb-color-parchment-dim);
  transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-motion-ease);
}
.addnpc:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .addnpc:hover { background: var(--lb-color-stone-raised); color: var(--lb-color-parchment); } }

/* ---------------------------------------------------------------- Palco: capa da cena */
.stage { gap: 0; }
.cover {
  position: relative; flex: none; height: 172px; overflow: hidden; isolation: isolate;
  border: 1px solid var(--lb-color-line-panel); border-radius: var(--lb-radius-lg);
  background: var(--lb-color-stone-sunken); box-shadow: var(--lb-shadow-float);
}
.cover__art { position: absolute; inset: 0; z-index: 0; }
.cover__art svg { display: block; width: 100%; height: 100%; }
.cover .lamp { animation: rp-ignite 900ms var(--rp-ease-out) 420ms both; }
.cover::after {
  content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse 80% 90% at 72% 120%, rgba(226, 100, 90, 0.34), transparent 62%);
  opacity: 0; transition: opacity 600ms ease;
}
.cover[data-tension='4']::after { opacity: 0.55; }
.cover[data-tension='5']::after { opacity: 1; }
.cover__shade {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(90deg, var(--rp-shade) 0%, rgba(12, 12, 14, 0.5) 40%, rgba(12, 12, 14, 0) 72%), linear-gradient(0deg, rgba(12, 12, 14, 0.66) 0%, rgba(12, 12, 14, 0) 58%);
}
.cover__seam { position: absolute; top: 0; bottom: 0; left: -24px; width: 48px; z-index: 3; pointer-events: none; opacity: 0; }
.cover__seam::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 50% 60% at 50% 50%, rgba(243, 186, 102, 0.45), transparent 70%); }
.cover__seam::after { content: ''; position: absolute; top: 0; bottom: 0; left: 23px; width: 2px; background: linear-gradient(transparent, var(--lb-color-brass-bright) 30%, var(--lb-color-brass-bright) 70%, transparent); }
.cover__info { position: absolute; left: 22px; right: 22px; bottom: 16px; z-index: 4; display: flex; flex-direction: column; gap: 2px; }
.cover__place { font: 500 11.5px/1.3 var(--lb-font-utility); letter-spacing: 0.14em; text-transform: uppercase; color: var(--lb-color-brass); }
.cover__title { font: 400 34px/1.08 var(--lb-font-display); letter-spacing: -0.01em; color: var(--lb-color-parchment); text-wrap: balance; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55); }
.cover__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin-top: 8px; }
.meta { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--lb-color-parchment-dim); white-space: nowrap; }
.meta .i { width: 14px; height: 14px; color: var(--lb-color-parchment-faint); }
.meta--btn {
  height: 26px; margin-left: -8px; padding: 0 8px; border: 1px solid transparent; border-radius: 999px; background: transparent;
  transition: background-color var(--lb-motion-fast) ease, border-color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-motion-ease);
}
.meta--btn:active { transform: scale(0.97); }
.meta__plus { font: 600 10.5px/1 var(--lb-font-utility); color: var(--lb-color-brass); opacity: 0.8; }
@media (hover: hover) and (pointer: fine) { .meta--btn:hover { background: rgba(255, 255, 255, 0.06); border-color: var(--lb-color-line-strong); } }
.tension { display: inline-flex; align-items: center; gap: 2px; }
.tension__lbl { margin-right: 6px; font-size: 12.5px; color: var(--lb-color-parchment-dim); }
.tension__seg { position: relative; width: 16px; height: 22px; padding: 0; border: 0; background: transparent; border-radius: 4px; }
.tension__seg::before {
  content: ''; position: absolute; left: 3px; right: 3px; top: 8px; height: 6px; border-radius: 2px;
  background: rgba(255, 255, 255, 0.14); transition: background-color 200ms ease;
}
.tension__seg[data-on='true']::before { background: var(--lb-color-brass); }
.tension[data-level='4'] .tension__seg[data-on='true']::before, .tension[data-level='5'] .tension__seg[data-on='true']::before { background: var(--lb-color-ember); }
.cover__amb { position: absolute; top: 12px; right: 12px; z-index: 5; }
.amb {
  display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 11px 0 10px;
  border: 1px solid var(--lb-color-line-strong); border-radius: 999px;
  background: rgba(18, 18, 20, 0.66); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  font-size: 12px; color: var(--lb-color-parchment); white-space: nowrap;
  transition: background-color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-motion-ease);
}
button.amb:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { button.amb:hover { background: rgba(35, 35, 40, 0.86); } }
.amb .i { width: 14px; height: 14px; color: var(--lb-color-brass); }
.amb__bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.amb__bars i { display: block; width: 3px; height: 12px; border-radius: 1px; background: var(--lb-color-brass); transform-origin: bottom; transition: transform 200ms var(--rp-ease-out); }

/* ---------------------------------------------------------------- Palco: registro */
.logwrap { position: relative; flex: 1; min-height: 0; margin-top: 10px; }
.log {
  height: 100%; overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column; gap: 12px;
  padding: 14px 8px 16px 2px;
  scrollbar-width: thin; scrollbar-color: var(--lb-color-line-strong) transparent;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 16px);
  mask-image: linear-gradient(to bottom, transparent 0, #000 16px);
}
.log:focus-visible { box-shadow: inset 0 0 0 2px var(--lb-color-brass); border-radius: var(--lb-radius-md); }
.e { position: relative; max-width: min(100%, 700px); flex: none; }
.e__mark {
  position: absolute; top: -4px; right: -4px; z-index: 2;
  display: grid; place-items: center; width: 26px; height: 26px; padding: 0;
  border: 1px solid var(--lb-color-line); border-radius: 8px; background: var(--lb-color-stone-raised);
  color: var(--lb-color-parchment-faint); opacity: 0;
  transition: opacity 120ms ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-motion-ease);
}
.e__mark .i { width: 14px; height: 14px; }
.e:hover .e__mark, .e:focus-within .e__mark, .e__mark[aria-pressed='true'] { opacity: 1; }
.e__mark[aria-pressed='true'] { color: var(--lb-color-brass); border-color: rgba(224, 164, 74, 0.4); }
.e__mark[aria-pressed='true'] .i { fill: currentColor; }
.e__mark:active { transform: scale(0.94); }
@media (hover: none) { .e__mark:not([aria-pressed='true']) { display: none; } }
.e__tag { font: 500 10.5px/1 var(--lb-font-utility); letter-spacing: 0.16em; text-transform: uppercase; color: var(--lb-color-brass); }
.e__meta { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.e__who { font-size: 13px; font-weight: 600; color: var(--tone, var(--lb-color-parchment)); white-space: nowrap; }
.e--npc .e__who { color: var(--lb-color-parchment); }
.e__sub { font-size: 11.5px; color: var(--lb-color-parchment-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* narracao: o papel sob o lampiao, serifa e capitular */
.e--narr {
  width: fit-content; padding: 13px 20px 15px 18px;
  border: 1px solid var(--rp-paper-edge); border-radius: var(--lb-radius-md);
  background: linear-gradient(180deg, rgba(243, 186, 102, 0.075), rgba(243, 186, 102, 0.02)), var(--rp-paper);
  box-shadow: var(--lb-shadow-bevel), 0 10px 30px -18px rgba(224, 164, 74, 0.35);
}
.e--narr .e__tag { display: block; margin-bottom: 8px; opacity: 0.85; }
.narr { max-width: 62ch; font: 400 16.5px/1.62 var(--rp-font-narration); color: var(--rp-paper-ink); text-wrap: pretty; }
.narr::first-letter { float: left; margin: 0.06em 0.1em 0 -0.02em; font: 400 3.2em/0.8 var(--lb-font-display); color: var(--lb-color-brass-bright); }
.e--fala { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: start; }
.e__body { min-width: 0; }
.bubble {
  display: inline-block; max-width: 60ch; margin-top: 4px; padding: 8px 13px 9px;
  border: 1px solid var(--lb-color-line); border-radius: 4px 14px 14px 14px;
  background: var(--lb-color-stone-raised); font-size: 14.5px; line-height: 1.5; color: var(--lb-color-parchment);
  overflow-wrap: anywhere;
}
.e--npc .bubble { background: var(--lb-color-stone-solid); border-color: var(--lb-color-line-strong); }
.e--acao { padding-left: 42px; }
.acao { max-width: 62ch; font-size: 14px; line-height: 1.55; font-style: italic; color: var(--lb-color-parchment-dim); overflow-wrap: anywhere; }
.acao b { font-style: normal; font-weight: 600; color: var(--tone, var(--lb-color-parchment)); }
.e--ooc { padding-left: 42px; }
.ooc { font-size: 12.5px; line-height: 1.5; color: var(--lb-color-parchment-faint); overflow-wrap: anywhere; }
.ooc__tag { display: inline-block; margin-right: 6px; padding: 0 5px; border: 1px solid var(--lb-color-line-strong); border-radius: 4px; font: 500 9.5px/15px var(--lb-font-utility); letter-spacing: 0.1em; text-transform: uppercase; vertical-align: 1px; }
.ooc b { margin-right: 4px; font-weight: 600; color: var(--lb-color-parchment-dim); }

/* rolagem: o d20 do sistema, total grande, carimbo de resultado */
.e--roll { --tone: var(--lb-color-brass); --tone-soft: var(--lb-color-brass-soft); display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: start; }
.roll {
  display: inline-flex; flex-direction: column; gap: 8px; justify-self: start; min-width: 0; max-width: 100%;
  padding: 10px 14px 11px; border: 1px solid var(--lb-color-line-panel); border-radius: var(--lb-radius-lg);
  background: var(--lb-color-stone-solid); box-shadow: var(--lb-shadow-bevel);
}
.roll__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.roll__what { font-size: 12.5px; color: var(--lb-color-parchment-dim); }
.roll__body { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.roll__dice { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.roll__op, .roll__mod, .roll__eq { font: 500 15px/1 var(--lb-font-utility); color: var(--lb-color-parchment-faint); }
.roll__mod { color: var(--lb-color-parchment-dim); }
.roll__total { min-width: 2ch; font: 600 30px/1 var(--lb-font-utility); color: var(--lb-color-brass-bright); font-variant-numeric: tabular-nums; }
.roll__vs { font-size: 12.5px; color: var(--lb-color-parchment-faint); white-space: nowrap; }
.roll__vs b { font: 600 14px var(--lb-font-utility); color: var(--lb-color-parchment-dim); }
.roll__res { padding: 4px 10px; border-radius: 999px; font: 600 11.5px/1 var(--lb-font-utility); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
[data-outcome='sucesso'] .roll__res { background: var(--lb-color-online-soft); color: var(--lb-color-online); }
[data-outcome='falha'] .roll__res { background: var(--lb-color-ember-soft); color: var(--lb-color-ember); }
[data-outcome='critico'] .roll__res { background: var(--lb-color-brass); color: var(--lb-color-brass-contrast); }
[data-outcome='desastre'] .roll__res { background: var(--lb-color-ember); color: var(--lb-color-brass-contrast); }
[data-outcome='critico'] .roll { border-color: rgba(224, 164, 74, 0.5); }
.roll__formula { font: 11.5px var(--lb-font-utility); letter-spacing: 0.02em; color: var(--lb-color-parchment-faint); }
.die { position: relative; display: grid; place-items: center; width: 38px; height: 38px; flex: none; }
.die--drop { opacity: 0.38; }
.die__in { position: relative; display: grid; place-items: center; width: 100%; height: 100%; color: var(--tone); }
.die__in svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.die__face { fill: var(--tone-soft); stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; }
.die__edge { fill: none; stroke: currentColor; stroke-width: 0.9; stroke-opacity: 0.5; stroke-linejoin: round; }
.die b { position: relative; margin-top: 3px; font: 600 13.5px/1 var(--lb-font-utility); color: var(--lb-color-parchment); font-variant-numeric: tabular-nums; }
.die__strike { position: absolute; left: 5px; right: 5px; top: 50%; height: 1.5px; margin-top: -1px; background: var(--lb-color-parchment); transform: rotate(-26deg); transform-origin: center; }

/* sussurro, revelacao, nota do mestre */
.sus { padding: 9px 14px 11px; border: 1px dashed rgba(171, 147, 214, 0.5); border-radius: var(--lb-radius-md); background: var(--lb-color-arcane-soft); }
.e--sus { width: fit-content; max-width: min(100%, 560px); }
.sus__head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--lb-color-arcane); }
.sus__head .i { width: 14px; height: 14px; }
.sus__txt { margin-top: 5px; font-size: 14px; line-height: 1.5; color: var(--lb-color-parchment); overflow-wrap: anywhere; }
.e--rev { width: fit-content; max-width: min(100%, 560px); }
.rev {
  display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 12px; padding: 12px 16px 13px 12px;
  border: 1px solid rgba(224, 164, 74, 0.4); border-radius: var(--lb-radius-md);
  background: linear-gradient(180deg, rgba(224, 164, 74, 0.11), rgba(224, 164, 74, 0.04)), var(--lb-color-stone-solid);
}
.rev__seal { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c4544a, #8e2f28 70%); box-shadow: inset 0 0 0 3px rgba(0, 0, 0, 0.18), 0 2px 6px rgba(0, 0, 0, 0.4); color: #f6d8c8; }
.rev__seal .i { width: 17px; height: 17px; }
.rev__eyebrow { font: 500 10.5px/1 var(--lb-font-utility); letter-spacing: 0.16em; text-transform: uppercase; color: var(--lb-color-brass); }
.rev__title { margin-top: 5px; font: 400 18px/1.25 var(--lb-font-display); color: var(--lb-color-parchment); }
.rev__txt { margin-top: 4px; font-size: 13.5px; line-height: 1.5; color: var(--lb-color-parchment-dim); }
.e--nota { width: fit-content; max-width: min(100%, 560px); }
.nota { display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px; border: 1px dashed var(--lb-color-line-strong); border-radius: var(--lb-radius-md); font-size: 13px; line-height: 1.45; color: var(--lb-color-parchment-dim); }
.nota .i { margin-top: 1px; color: var(--lb-color-parchment-faint); }
.nota__tag { margin-right: 4px; font: 600 10.5px/1 var(--lb-font-utility); letter-spacing: 0.08em; text-transform: uppercase; color: var(--lb-color-parchment-faint); }

/* eventos do sistema e capitulos de cena */
.e--sis { max-width: none; display: flex; align-items: center; gap: 12px; font: 12px/1.4 var(--lb-font-utility); letter-spacing: 0.02em; color: var(--lb-color-parchment-faint); }
.e--sis::before, .e--sis::after { content: ''; flex: 1; min-width: 16px; height: 1px; background: var(--lb-color-line); }
.sis { display: inline-flex; align-items: center; gap: 6px; max-width: 82%; text-align: center; }
.sis .i { width: 14px; height: 14px; }
.sis b { font-weight: 500; color: var(--lb-color-parchment-dim); }
.e--sis[data-k='relogio'] .i { color: var(--lb-color-ember); }
.e--sis[data-k='pausa'] .i { color: var(--lb-color-brass); }
.e--cena { max-width: none; display: grid; justify-items: center; gap: 3px; padding: 8px 0 2px; text-align: center; }
.cena__orn { display: flex; align-items: center; gap: 10px; width: min(260px, 70%); color: var(--lb-color-brass); }
.cena__orn::before, .cena__orn::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(224, 164, 74, 0.5)); }
.cena__orn::after { background: linear-gradient(90deg, rgba(224, 164, 74, 0.5), transparent); }
.cena__orn span { width: 6px; height: 6px; transform: rotate(45deg); background: var(--lb-color-brass); }
.cena__eyebrow { margin-top: 6px; font: 500 10.5px/1 var(--lb-font-utility); letter-spacing: 0.18em; text-transform: uppercase; color: var(--lb-color-brass); }
.cena__title { font: 400 22px/1.2 var(--lb-font-display); color: var(--lb-color-parchment); text-wrap: balance; }
.cena__meta { font-size: 12px; color: var(--lb-color-parchment-faint); }
.newpill {
  position: absolute; left: 50%; bottom: 10px; z-index: 3; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px;
  border: 1px solid rgba(224, 164, 74, 0.45); border-radius: 999px;
  background: var(--lb-color-stone-raised); box-shadow: var(--lb-shadow-float);
  font-size: 12px; color: var(--lb-color-brass-bright);
}
.newpill .i { width: 14px; height: 14px; }

/* ---------------------------------------------------------------- Palco: compositor */
.typing { display: flex; align-items: center; gap: 8px; height: 24px; padding-left: 4px; font-size: 12px; color: var(--lb-color-parchment-faint); }
.typing__dots { display: inline-flex; gap: 3px; }
.typing__dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--lb-color-brass); animation: rp-dot 1.2s ease-in-out infinite; }
.typing__dots i:nth-child(2) { animation-delay: 160ms; }
.typing__dots i:nth-child(3) { animation-delay: 320ms; }
.comp {
  position: relative; flex: none; display: flex; flex-direction: column; gap: 8px;
  padding: 10px 12px; border: 1px solid var(--lb-color-line-panel); border-radius: var(--lb-radius-lg);
  background: var(--lb-color-stone-solid); box-shadow: var(--lb-shadow-float);
  transition: border-color 160ms ease;
}
.comp[data-mode='narracao'] { border-color: rgba(224, 164, 74, 0.42); }
.comp[data-mode='sussurro'] { border-color: rgba(171, 147, 214, 0.55); border-style: dashed; }
.comp__row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.comp__lbl { font-size: 12px; color: var(--lb-color-parchment-faint); white-space: nowrap; }
.pick {
  display: inline-flex; align-items: center; gap: 7px; height: 30px; max-width: 100%; padding: 0 8px 0 4px;
  border: 1px solid var(--lb-color-line); border-radius: 999px; background: var(--lb-color-stone-raised);
  font-size: 12.5px; font-weight: 500; color: var(--lb-color-parchment); white-space: nowrap;
  transition: background-color var(--lb-motion-fast) ease, border-color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-motion-ease);
}
.pick:active { transform: scale(0.97); }
.pick__name { overflow: hidden; text-overflow: ellipsis; }
.pick > .i { width: 14px; height: 14px; color: var(--lb-color-parchment-faint); }
.pick--to { padding-left: 10px; }
@media (hover: hover) and (pointer: fine) { .pick:hover { background: var(--lb-color-stone-hover); border-color: var(--lb-color-line-strong); } }
.to { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--lb-color-arcane); }
.comp__hint { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--lb-color-parchment-faint); white-space: nowrap; }
.comp__field { position: relative; display: flex; align-items: flex-end; gap: 8px; }
.comp__field textarea {
  flex: 1; min-width: 0; min-height: 44px; max-height: 160px; resize: none; display: block; overflow-y: hidden;
  padding: 10px 12px; border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-md);
  background: var(--lb-color-stone-sunken); color: var(--lb-color-parchment);
  font-size: 14.5px; line-height: 1.45;
  transition: border-color var(--lb-motion-fast) ease;
}
.comp__field textarea::placeholder { color: var(--lb-color-parchment-faint); }
.comp__field textarea:focus-visible { border-color: rgba(224, 164, 74, 0.6); box-shadow: 0 0 0 3px rgba(224, 164, 74, 0.16); }
.comp[data-mode='narracao'] textarea { font-family: var(--rp-font-narration); font-size: 15.5px; }
.comp[data-mode='acao'] textarea { font-style: italic; }
.comp__field textarea:disabled { opacity: 0.6; }
.send { min-height: 44px; padding: 0 16px; }
.send .i { width: 15px; height: 15px; }
.dice { display: flex; align-items: center; gap: 6px; min-width: 0; }
.qd {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; flex: none;
  border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-sm); background: var(--lb-color-stone-raised);
  font-size: 12px; color: var(--lb-color-parchment-dim); white-space: nowrap;
  transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-motion-ease);
}
.qd .i { width: 14px; height: 14px; color: var(--lb-color-brass); }
.qd b { font: 600 11px/1 var(--lb-font-utility); color: var(--lb-color-brass); }
.qd:active:not(:disabled) { transform: scale(0.97); }
.qd:disabled { opacity: 0.45; }
.qd[aria-pressed='true'] { border-color: rgba(171, 147, 214, 0.5); color: var(--lb-color-arcane); background: var(--lb-color-arcane-soft); }
@media (hover: hover) and (pointer: fine) { .qd:hover:not(:disabled) { background: var(--lb-color-stone-hover); color: var(--lb-color-parchment); } }
.comp__keys { margin-left: auto; font-size: 12px; color: var(--lb-color-parchment-faint); white-space: nowrap; }
.comp__err { font-size: 12.5px; color: var(--lb-color-ember); }
.comp__paused { font-size: 12.5px; color: var(--lb-color-brass-bright); }
.slash {
  position: absolute; left: 0; bottom: calc(100% + 6px); z-index: 20; width: min(380px, 100%);
  padding: 6px; border: 1px solid var(--lb-color-line-panel); border-radius: var(--lb-radius-md);
  background: var(--lb-color-stone-raised); box-shadow: var(--lb-shadow-float);
}
.slash__opt { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 2px 10px; padding: 7px 9px; border-radius: 7px; cursor: pointer; }
.slash__opt[aria-selected='true'] { background: var(--lb-color-stone-hover); }
.slash__cmd { grid-row: span 2; font: 600 13px/1.6 var(--lb-font-utility); color: var(--lb-color-brass-bright); }
.slash__desc { font-size: 12.5px; color: var(--lb-color-parchment); }
.slash__ex { font: 11.5px var(--lb-font-utility); color: var(--lb-color-parchment-faint); }

/* ---------------------------------------------------------------- popovers */
.pop {
  position: absolute; z-index: 30; min-width: 220px; max-width: min(320px, calc(100vw - 32px));
  padding: 6px; border: 1px solid var(--lb-color-line-panel); border-radius: var(--lb-radius-md);
  background: var(--lb-color-stone-raised); box-shadow: var(--lb-shadow-float);
}
.pop--up { bottom: calc(100% + 6px); left: 0; transform-origin: bottom left; }
.pop--down-end { top: calc(100% + 8px); right: 0; transform-origin: top right; }
.pop__group { padding: 6px 8px 4px; font: 500 10.5px/1 var(--lb-font-utility); letter-spacing: 0.12em; text-transform: uppercase; color: var(--lb-color-parchment-faint); }
.opt {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 5px 8px;
  border: 0; border-radius: 7px; background: transparent; text-align: left; color: var(--lb-color-parchment);
}
.opt[aria-selected='true'] { background: var(--lb-color-brass-soft); }
.opt:focus-visible { box-shadow: inset 0 0 0 2px var(--lb-color-brass); }
.opt__txt { display: flex; flex-direction: column; min-width: 0; }
.opt__name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt__sub { font-size: 11.5px; color: var(--lb-color-parchment-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (hover: hover) and (pointer: fine) { .opt:hover { background: var(--lb-color-stone-hover); } .opt[aria-selected='true']:hover { background: var(--lb-color-brass-soft); } }
.pop--amb { width: 300px; padding: 12px 14px 14px; }
.pop__title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.pop__title .i { color: var(--lb-color-brass); }
.pop__note { margin: 4px 0 10px; font-size: 12px; color: var(--lb-color-parchment-faint); }
.layers { display: flex; flex-direction: column; gap: 8px; }
.layer { display: grid; grid-template-columns: 34px minmax(0, 1fr) 96px; align-items: center; gap: 10px; font-size: 12.5px; }
.layer--master { grid-template-columns: minmax(0, 1fr) 140px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--lb-color-line); color: var(--lb-color-parchment-dim); }
.layer input[type='range'] { width: 100%; accent-color: var(--lb-color-brass); }
.layer input[type='range']:disabled { opacity: 0.35; }
.switch { position: relative; width: 34px; height: 20px; padding: 0; border: 0; border-radius: 999px; background: var(--lb-color-stone-hover); transition: background-color 160ms ease; }
.switch__knob { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--lb-color-parchment-dim); transition: transform 180ms var(--rp-ease-out), background-color 160ms ease; }
.switch[aria-checked='true'] { background: var(--lb-color-brass); }
.switch[aria-checked='true'] .switch__knob { transform: translateX(14px); background: var(--lb-color-brass-contrast); }

/* ---------------------------------------------------------------- Bastidores */
.side {
  overflow: hidden;
  border: 1px solid var(--lb-color-line-panel); border-radius: var(--lb-radius-lg);
  background: var(--lb-color-stone-solid); box-shadow: var(--lb-shadow-float);
}
.side__head { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 0; }
.side__title { font: 400 20px/1.2 var(--lb-font-display); letter-spacing: -0.01em; }
.side__note { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--lb-color-parchment-faint); white-space: nowrap; }
.side__note .i { width: 14px; height: 14px; }
.tabs { position: relative; display: flex; gap: 2px; margin-top: 10px; padding: 0 10px; border-bottom: 1px solid var(--lb-color-line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 8px; flex: none;
  border: 0; border-radius: 7px 7px 0 0; background: transparent;
  font-size: 12.5px; font-weight: 500; color: var(--lb-color-parchment-faint); white-space: nowrap;
  transition: color var(--lb-motion-fast) ease;
}
.tab[aria-selected='true'] { color: var(--lb-color-parchment); }
.tab:focus-visible { box-shadow: inset 0 0 0 2px var(--lb-color-brass); }
@media (hover: hover) and (pointer: fine) { .tab:hover { color: var(--lb-color-parchment); } }
.tab__badge { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--lb-color-brass); color: var(--lb-color-brass-contrast); font: 600 10px/16px var(--lb-font-utility); text-align: center; }
.tabs__ink { position: absolute; left: 0; bottom: -1px; width: 100px; height: 2px; background: var(--lb-color-brass); transform-origin: 0 0; transition: transform 220ms var(--rp-ease-in-out); }
.panel { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 18px; scrollbar-width: thin; scrollbar-color: var(--lb-color-line-strong) transparent; }
.panel:focus-visible { box-shadow: inset 0 0 0 2px var(--lb-color-brass); }
.panel__intro { margin-bottom: 12px; font-size: 12.5px; line-height: 1.5; color: var(--lb-color-parchment-faint); }
.panel__hint { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 12px; color: var(--lb-color-parchment-faint); }
.panel__hint .i { width: 14px; height: 14px; }

.scenes { display: flex; flex-direction: column; gap: 8px; }
.scn { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; padding: 10px; border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-md); background: var(--lb-color-stone-raised); }
.scn[aria-current='true'] { border-color: rgba(224, 164, 74, 0.45); background: linear-gradient(var(--lb-color-brass-soft), var(--lb-color-brass-soft)), var(--lb-color-stone-raised); }
.scn__thumb { position: relative; display: block; width: 84px; height: 58px; border-radius: 7px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--lb-color-line); }
.scn__thumb svg { display: block; width: 100%; height: 100%; }
.scn__body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.scn__title { font: 400 16px/1.25 var(--lb-font-display); color: var(--lb-color-parchment); }
.scn__note { font-size: 12px; line-height: 1.45; color: var(--lb-color-parchment-dim); }
.scn__foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 8px; margin-top: 6px; }
.scn__when { font: 11.5px var(--lb-font-utility); color: var(--lb-color-parchment-faint); white-space: nowrap; }

.clocks { display: grid; grid-template-columns: 1fr; gap: 8px; }
.clk { --tone: var(--lb-color-brass); --tone-soft: var(--lb-color-brass-soft); display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-md); background: var(--lb-color-stone-raised); }
.clk[data-tom='ember'] { --tone: var(--lb-color-ember); --tone-soft: var(--lb-color-ember-soft); }
.clk[data-tom='tide'] { --tone: var(--lb-color-tide); --tone-soft: var(--lb-color-tide-soft); }
.clk[data-tom='arcane'] { --tone: var(--lb-color-arcane); --tone-soft: var(--lb-color-arcane-soft); }
.clk[data-tom='online'] { --tone: var(--lb-color-online); --tone-soft: var(--lb-color-online-soft); }
.clk__ring { position: relative; display: grid; place-items: center; width: 68px; height: 68px; padding: 0; border: 0; border-radius: 50%; background: transparent; transition: transform var(--lb-motion-fast) var(--lb-motion-ease); }
.clk__ring:active { transform: scale(0.96); }
.clk__ring svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.clk__ring .seg { fill: rgba(255, 255, 255, 0.07); stroke: rgba(255, 255, 255, 0.06); stroke-width: 0.5; transform-box: view-box; transform-origin: 32px 32px; transition: fill 200ms ease; }
.clk__ring .seg--on { fill: var(--tone); }
.clk__ring .seg--new { animation: rp-seg 260ms var(--rp-ease-out); }
.clk__n { position: relative; font: 600 14px/1 var(--lb-font-utility); color: var(--lb-color-parchment); font-variant-numeric: tabular-nums; }
.clk__n small { font-size: 11px; color: var(--lb-color-parchment-faint); }
.clk__n .i { width: 18px; height: 18px; color: var(--tone); stroke-width: 2.2; }
.clk[data-full='true'] { border-color: color-mix(in srgb, var(--tone) 45%, transparent); }
.clk[data-fresh-full='true'] .clk__ring::after { content: ''; position: absolute; inset: 2px; border-radius: 50%; box-shadow: 0 0 0 2px var(--tone); pointer-events: none; animation: rp-ring 640ms var(--rp-ease-out) both; }
.clk__name { font-size: 13px; font-weight: 600; line-height: 1.35; }
.clk__ctl { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.vis {
  display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px;
  border: 1px solid var(--lb-color-line); border-radius: 999px; background: transparent;
  font-size: 11.5px; color: var(--lb-color-parchment-dim); white-space: nowrap;
  transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-motion-ease);
}
.vis .i { width: 13px; height: 13px; }
.vis:active { transform: scale(0.96); }
.vis[aria-pressed='false'] { border-style: dashed; color: var(--lb-color-parchment-faint); }
@media (hover: hover) and (pointer: fine) { .vis:hover { background: var(--lb-color-stone-hover); color: var(--lb-color-parchment); } }

.secrets { display: flex; flex-direction: column; gap: 8px; }
.sec { padding: 11px 12px 12px; border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-md); background: var(--lb-color-stone-raised); }
.sec__title { font-size: 13.5px; font-weight: 600; line-height: 1.35; }
.sec__text { margin-top: 4px; font-size: 12.5px; line-height: 1.5; color: var(--lb-color-parchment-dim); }
.sec__foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
.sec__scene { font: 11.5px var(--lb-font-utility); color: var(--lb-color-parchment-faint); }
.sec__done { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--lb-color-online); }
.sec__done .i { width: 14px; height: 14px; }
.sec[data-revealed='true'] { background: transparent; }
.sec[data-revealed='true'] .sec__title { color: var(--lb-color-parchment-dim); }
.notes { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
.notes__lbl { font-size: 12.5px; font-weight: 600; }
.notes textarea { width: 100%; min-height: 96px; resize: vertical; padding: 9px 11px; border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-md); background: var(--lb-color-stone-sunken); font-size: 13px; line-height: 1.5; }
.notes textarea::placeholder { color: var(--lb-color-parchment-faint); }
.notes__hint { font-size: 11.5px; color: var(--lb-color-parchment-faint); }

.turns__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.turns__state { font: 400 17px/1.2 var(--lb-font-display); }
.turns__state b { font-weight: 400; color: var(--lb-color-brass-bright); }
.turns { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.turn { display: grid; grid-template-columns: 18px 22px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 40px; padding: 6px 10px; border: 1px solid transparent; border-radius: var(--lb-radius-md); background: var(--lb-color-stone-raised); }
.turn.is-current { border-color: rgba(224, 164, 74, 0.5); background: linear-gradient(var(--lb-color-brass-soft), var(--lb-color-brass-soft)), var(--lb-color-stone-raised); }
.turn__pos { font: 600 12px/1 var(--lb-font-utility); color: var(--lb-color-parchment-faint); font-variant-numeric: tabular-nums; }
.turn.is-current .turn__pos { color: var(--lb-color-brass-bright); }
.turn__name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.turn__spd { font: 500 11.5px/1 var(--lb-font-utility); color: var(--lb-color-parchment-faint); white-space: nowrap; }
.turns__ctl { display: grid; gap: 8px; }

.tl { position: relative; display: flex; flex-direction: column; }
.tl::before { content: ''; position: absolute; left: 51px; top: 8px; bottom: 8px; width: 1px; background: var(--lb-color-line-strong); }
.tl__item { position: relative; display: grid; grid-template-columns: 40px 22px minmax(0, 1fr); align-items: start; padding: 5px 0; }
.tl__time { padding-top: 1px; font: 500 11.5px/1.4 var(--lb-font-utility); color: var(--lb-color-parchment-faint); text-align: right; font-variant-numeric: tabular-nums; }
.tl__dot { justify-self: center; width: 9px; height: 9px; margin-top: 4px; border-radius: 50%; background: var(--lb-color-stone-solid); box-shadow: inset 0 0 0 1.5px var(--lb-color-parchment-faint); }
.tl__item[data-k='cena'] .tl__dot { background: var(--lb-color-brass); box-shadow: none; }
.tl__item[data-k='pista'] .tl__dot { background: #b8473e; box-shadow: none; }
.tl__item[data-k='relogio'] .tl__dot { background: var(--lb-color-ember); box-shadow: none; }
.tl__item[data-k='marco'] .tl__dot { box-shadow: inset 0 0 0 1.5px var(--lb-color-brass); }
.tl__txt { font-size: 13px; line-height: 1.45; color: var(--lb-color-parchment); overflow-wrap: anywhere; }
.tl__add { display: flex; gap: 6px; margin-top: 12px; }
.tl__add input { flex: 1; min-width: 0; height: 32px; padding: 0 10px; border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-md); background: var(--lb-color-stone-sunken); font-size: 13px; }
.tl__add input::placeholder { color: var(--lb-color-parchment-faint); }

/* ficha do jogador */
.sheet__head { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.sheet__name { font: 400 22px/1.15 var(--lb-font-display); }
.sheet__sub { margin-top: 2px; font-size: 12.5px; color: var(--lb-color-parchment-dim); }
.sheet__res { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.sheet__res .res__bar { height: 6px; }
.saga { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; margin-top: 16px; padding: 12px; border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-md); background: var(--lb-color-stone-raised); }
.saga__lbl { font-size: 13px; font-weight: 600; }
.saga__hint { font-size: 12px; color: var(--lb-color-parchment-faint); }
.saga__pips { display: flex; gap: 5px; }
.saga__pips i { width: 11px; height: 11px; transform: rotate(45deg); border: 1.5px solid var(--lb-color-brass); border-radius: 2px; }
.saga__pips i[data-on='true'] { background: var(--lb-color-brass); }
.saga .lb-btn { grid-column: 1 / -1; margin-top: 8px; }
.saga__why { grid-column: 1 / -1; font-size: 11.5px; color: var(--lb-color-parchment-faint); }
.sheet__h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 18px 0 8px; font-size: 13px; font-weight: 600; }
.sheet__h span { font-size: 11.5px; font-weight: 400; color: var(--lb-color-parchment-faint); }
.attrs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.attr {
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px 7px;
  border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-md); background: var(--lb-color-stone-raised);
  transition: background-color var(--lb-motion-fast) ease, border-color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-motion-ease);
}
.attr:active { transform: scale(0.96); }
.attr__ab { font: 600 10.5px/1 var(--lb-font-utility); letter-spacing: 0.1em; color: var(--lb-color-parchment-faint); }
.attr__rk { font: 600 18px/1 var(--lb-font-utility); color: var(--lb-color-parchment); }
.attr__pts { font: 11px/1 var(--lb-font-utility); color: var(--lb-color-parchment-faint); font-variant-numeric: tabular-nums; }
.attr__note { margin-left: 1px; font: 10px/1 'Segoe UI Symbol', 'Segoe UI', system-ui, sans-serif; }
@media (hover: hover) and (pointer: fine) { .attr:hover { background: var(--lb-color-stone-hover); border-color: rgba(224, 164, 74, 0.4); } .attr:hover .attr__rk { color: var(--lb-color-brass-bright); } }
.clues { display: flex; flex-direction: column; gap: 6px; }
.clue { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; padding: 9px 10px; border: 1px solid var(--lb-color-line); border-radius: var(--lb-radius-md); }
.clue__ic { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--lb-color-stone-raised); color: var(--lb-color-parchment-dim); }
.clue__ic .i { width: 14px; height: 14px; }
.clue[data-k='pista'] .clue__ic { background: rgba(184, 71, 62, 0.22); color: #e9a49c; }
.clue__t { font-size: 13px; font-weight: 600; }
.clue__d { margin-top: 2px; font-size: 12px; line-height: 1.45; color: var(--lb-color-parchment-dim); }
.whispers { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.whispers .sus { padding: 8px 11px 9px; }
.whispers .sus__txt { font-size: 13px; }
.empty { padding: 10px; border: 1px dashed var(--lb-color-line-strong); border-radius: var(--lb-radius-md); font-size: 12.5px; color: var(--lb-color-parchment-faint); }

/* ---------------------------------------------------------------- abas do celular, avisos */
.mtabs { display: none; gap: 4px; padding: 6px 16px; background: var(--lb-color-stone-solid); border-top: 1px solid var(--lb-color-line); }
.mtab {
  flex: 1; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 0; border-radius: 10px; background: transparent; font-size: 11.5px; font-weight: 500; color: var(--lb-color-parchment-faint);
  transition: background-color var(--lb-motion-fast) ease, color var(--lb-motion-fast) ease, transform var(--lb-motion-fast) var(--lb-motion-ease);
}
.mtab .i { width: 18px; height: 18px; }
.mtab:active { transform: scale(0.97); }
.mtab[aria-selected='true'] { background: var(--lb-color-stone-raised); color: var(--lb-color-parchment); }
.mtab[aria-selected='true'] .i { color: var(--lb-color-brass); }
.toasts { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: grid; justify-items: center; gap: 8px; transform: translateX(-50%); pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
.toast { padding: 9px 14px; border: 1px solid var(--lb-color-line-strong); border-radius: 10px; background: var(--lb-color-stone-raised); box-shadow: var(--lb-shadow-float); font-size: 13px; color: var(--lb-color-parchment); transition: opacity 200ms ease, transform 240ms var(--rp-ease-out); }
.toast[data-state='enter'] { opacity: 0; transform: translateY(10px); }
.toast[data-state='leave'] { opacity: 0; transform: translateY(6px); transition-duration: 160ms; }

/* ---------------------------------------------------------------- movimento */
@keyframes rp-fade { from { opacity: 0; } }
@keyframes rp-rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes rp-ignite { from { opacity: 0; } }
@keyframes rp-live { 50% { opacity: 0.4; } }
@keyframes rp-dot { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
@keyframes rp-seg { from { opacity: 0.2; transform: scale(0.86); } }
@keyframes rp-ring { from { opacity: 0.9; transform: scale(0.92); } to { opacity: 0; transform: scale(1.38); } }

  /* ------------------------------------------------------------ dados: parser e rolagem */
  function parseRoll(src) {
    let s = String(src).toLowerCase().trim();
    let alvo = null;
    const m = s.match(/(?:\s*>=|\s+(?:vs|cd|contra))\s*(\d{1,3})\s*$/);
    if (m) { alvo = Number(m[1]); s = s.slice(0, m.index); }
    s = s.replace(/\s+/g, '');
    if (!s) throw new Error('Faltou a rolagem. Exemplo: /r 2d6+3');
    const re = /([+-]?)(?:(\d{0,2})d(\d{1,4})(?:k([hl])(\d{0,2}))?|(\d{1,4}))/y;
    const termos = [];
    let mod = 0;
    let pos = 0;
    while (pos < s.length) {
      re.lastIndex = pos;
      const t = re.exec(s);
      if (!t || (pos > 0 && !t[1])) throw new Error('Não entendi "' + String(src).trim() + '". Use o formato 2d6+3 ou 1d20 vs 15.');
      pos = re.lastIndex;
      const sinal = t[1] === '-' ? -1 : 1;
      if (t[3]) {
        const n = t[2] ? Number(t[2]) : 1;
        const f = Number(t[3]);
        if (n < 1 || n > 30 || f < 2 || f > 1000) throw new Error('Use de 1 a 30 dados, de 2 a 1000 faces.');
        const keep = t[4] || null;
        termos.push({ n, f, sinal, keep, kn: keep ? Math.min(n, t[5] ? Number(t[5]) : 1) : n });
      } else {
        mod += sinal * Number(t[6]);
      }
    }
    if (!termos.length) throw new Error('Inclua pelo menos um dado, como 1d20.');
    return { termos, mod, alvo };
  }

  function finishRoll(spec) {
    let total = spec.mod;
    const d20 = [];
    spec.termos.forEach((t) => t.vals.forEach((v, i) => { if (t.kept[i]) { total += t.sinal * v; if (t.f === 20) d20.push(v); } }));
    let outcome = null;
    if (d20.length === 1 && spec.termos.length === 1) outcome = d20[0] === 20 ? 'critico' : d20[0] === 1 ? 'desastre' : null;
    if (!outcome && spec.alvo != null) outcome = total >= spec.alvo ? 'sucesso' : 'falha';
    const formula = spec.termos.map((t, i) => (i ? (t.sinal < 0 ? '− ' : '+ ') : t.sinal < 0 ? '−' : '') + t.n + 'd' + t.f + (t.keep ? (t.keep === 'h' ? ', fica o maior' : ', fica o menor') : '')).join(' ')
      + (spec.mod ? ' ' + (spec.mod > 0 ? '+' : '−') + ' ' + Math.abs(spec.mod) : '');
    return { termos: spec.termos, mod: spec.mod, alvo: spec.alvo, total, outcome, formula };
  }

  function rollDice(spec) {
    const termos = spec.termos.map((t) => {
      const vals = Array.from({ length: t.n }, () => 1 + Math.floor(Math.random() * t.f));
      let kept = vals.map(() => true);
      if (t.keep) {
        const order = vals.map((v, i) => i).sort((a, b) => (t.keep === 'h' ? vals[b] - vals[a] : vals[a] - vals[b]));
        kept = vals.map(() => false);
        order.slice(0, t.kn).forEach((i) => { kept[i] = true; });
      }
      return Object.assign({}, t, { vals, kept });
    });
    return finishRoll({ termos, mod: spec.mod, alvo: spec.alvo });
  }

  function summarize(e) {
    switch (e.tipo) {
      case 'fala': return shortOf(e.who) + ': “' + trunc(e.texto, 54) + '”';
      case 'acao': return shortOf(e.who) + ' ' + trunc(e.texto, 56);
      case 'narracao': return 'Narração: ' + trunc(e.texto, 56);
      case 'rolagem': return shortOf(e.who) + ', ' + e.rotulo + ': ' + e.r.total + (e.r.outcome ? ' (' + OUT[e.r.outcome].toLowerCase() + ')' : '');
      case 'sussurro': return 'Sussurro para ' + shortOf(e.to);
      case 'revelacao': return 'Pista revelada: ' + e.titulo;
      case 'ooc': return 'Fora do personagem: ' + trunc(e.texto, 48);

  /* ------------------------------------------------------------ registro: render e animação */
  const logEl = $('#log');

  function renderLog() {
    logEl.innerHTML = S.log.filter(visible).map(entryHTML).join('');
    logEl.scrollTop = logEl.scrollHeight;
    S.unread = 0;
    syncNewPill();
  }

  function appendEntry(e, opts) {
    const o = opts || {};
    const nearEnd = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 90;
    logEl.insertAdjacentHTML('beforeend', entryHTML(e));
    const node = logEl.lastElementChild;
    if (reduceMotion.matches) {
      node.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: 'ease-out' });
    } else {
      node.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 200, easing: EASE_OUT });
      if (e.tipo === 'rolagem') animateRoll(node);
    }
    if (o.own || nearEnd) {
      logEl.scrollTop = logEl.scrollHeight;
    } else {
      S.unread += 1;
      syncNewPill();
    }
  }

  function syncNewPill() {
    const pill = $('#newPill');
    pill.hidden = S.unread < 1;
    pill.innerHTML = icon('down') + (S.unread === 1 ? '1 entrada nova' : S.unread + ' entradas novas');
  }

  /* Face mostrada durante o giro: hash inteiro do passo de tempo, para não "contar" em sequência. */
  function spinFace(step, salt) {
    let h = Math.imul(step + 1, 0x9e3779b1) ^ Math.imul(salt, 0x85ebca77);
    h ^= h >>> 15;
    h = Math.imul(h, 0xc2b2ae3d);
    h ^= h >>> 13;
    return h >>> 0;
  }

  /* Dados: tudo na linha do tempo das animações (WAAPI). O sorteio visível durante o giro lê o
     currentTime da própria animação, então pausar ou desacelerar a página para conferir quadro a
     quadro mostra o mesmo que o usuário vê. */
  function animateRoll(node) {
    const dice = $$('.die', node).slice(0, 12);
    const TUMBLE = 440;
    const STEP = 50;
    const LOCK = 120;
    const items = dice.map((d, i) => {
      const inner = $('.die__in', d);
      const b = $('b', d);
      const start = i * STEP;
      const lock = start + TUMBLE - LOCK;
      const a = inner.animate([
        { transform: 'translateY(-12px) rotate(-80deg) scale(0.84)', opacity: 0 },
        { transform: 'translateY(2px) rotate(14deg) scale(1)', opacity: 1, offset: 0.55 },
        { transform: 'translateY(0) rotate(-5deg) scale(1)', opacity: 1, offset: 0.8 },
        { transform: 'none', opacity: 1 },
      ], { duration: TUMBLE, delay: start, easing: EASE_OUT, fill: 'backwards' });
      // o dado "assenta" (pulo curto) no mesmo instante em que o número para de sortear
      inner.animate([{ transform: 'scale(1.16)' }, { transform: 'scale(1)' }], { duration: 220, delay: lock, easing: EASE_OUT });
      if (d.classList.contains('die--drop')) {
        d.animate([{ opacity: 1 }, { opacity: 0.38 }], { duration: 220, delay: lock + 80, easing: 'ease-out', fill: 'both' });
        $('.die__strike', d).animate([{ transform: 'rotate(-26deg) scaleX(0)' }, { transform: 'rotate(-26deg) scaleX(1)' }], { duration: 220, delay: lock + 80, easing: EASE_OUT, fill: 'both' });
      }
      return { a, b, final: b.textContent, f: Number(d.dataset.f) || 20, lock, salt: i + 3 };
    });
    const tEnd = dice.length ? (dice.length - 1) * STEP + TUMBLE - LOCK : 0;
    const total = $('.roll__total', node);
    const res = $('.roll__res', node);
    const vs = $('.roll__vs', node);
    total.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 220, delay: tEnd + 60, easing: EASE_OUT, fill: 'backwards' });
    if (vs) vs.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, delay: tEnd + 90, easing: 'ease-out', fill: 'backwards' });
    if (res) res.animate([{ opacity: 0, transform: 'scale(1.35)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 240, delay: tEnd + 160, easing: EASE_OUT, fill: 'backwards' });
    // O laço vive enquanto alguma animação de giro não terminou (inclusive pausada).
    const tick = () => {
      if (!node.isConnected) return;
      let alive = false;
      items.forEach((it) => {
        const ct = it.a.currentTime;
        const st = it.a.playState;
        if (ct != null && st !== 'finished') alive = true;
        if (ct == null || st === 'finished' || ct >= it.lock) {
          if (it.b.textContent !== it.final) it.b.textContent = it.final;
        } else {
          it.b.textContent = String(1 + (spinFace(Math.floor(ct / 55), it.salt) % it.f));
        }
      });
      if (alive) requestAnimationFrame(tick);
    };
    tick();
  }

  /* ------------------------------------------------------------ postar */
  function post(e, opts) {
    const o = opts || {};
    e.id = 'e' + (++S.seq);
    e.t = e.t || Date.now();
    e.vis = e.vis || 'todos';
    S.log.push(e);
    const p = pcById(e.who);
    if (p && isIC(e)) { p.ultimo = e.t; refreshSpots(); }
    if (e.tipo === 'rolagem' && p) S.lastRoll[p.id] = { spec: e.spec, rotulo: e.rotulo.replace(/, repetido com Ponto Saga$/, '') };
    if (visible(e)) appendEntry(e, o);
    if (!gm() && (e.tipo === 'sussurro' || e.tipo === 'revelacao' || e.tipo === 'rolagem')) renderSide();
    return e;
  }

  function addSummary(item) {
    S.summary.push(item);
    S.summary.sort((a, b) => a.t - b.t);

  }

  function refreshCoverInfo() {
    const info = $('.cover__info:not(.is-old)');
    const had = document.activeElement && info.contains(document.activeElement) ? document.activeElement.dataset.act + (document.activeElement.dataset.n || '') : null;
    info.innerHTML = coverInfoHTML(scene());
    $('#cover').dataset.tension = S.tension;
    if (had) {
      const back = $$('[data-act]', info).find((b) => b.dataset.act + (b.dataset.n || '') === had);
