  /* Troca de cena: a capa nova entra por uma cortina da esquerda para a direita, com um fio de
     luz de latão na borda; a antiga escurece por baixo. Tudo criado no mesmo instante, para a
     coreografia poder ser pausada e conferida quadro a quadro. */
  function transitionCover(sc) {
    const cover = $('#cover');
    const oldArt = $('.cover__art:not(.is-old)', cover);
    const oldInfo = $('.cover__info:not(.is-old)', cover);
    const art2 = document.createElement('div');
    art2.className = 'cover__art';
    art2.innerHTML = art(sc.id, 'c' + (++artSeq));
    const info2 = document.createElement('div');
    info2.className = 'cover__info';
    info2.innerHTML = coverInfoHTML(sc);
    oldArt.classList.add('is-old');
    oldArt.removeAttribute('id');
    oldInfo.classList.add('is-old');
    oldInfo.removeAttribute('id');
    oldInfo.setAttribute('aria-hidden', 'true');
    oldInfo.inert = true;
    art2.id = 'coverArt';
    info2.id = 'coverInfo';
    oldArt.after(art2);
    oldInfo.after(info2);
    cover.dataset.tension = S.tension;
    const done = () => { oldArt.remove(); oldInfo.remove(); S.sceneBusy = false; };
    if (reduceMotion.matches) {
      art2.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'ease' });
      info2.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'ease' }).finished.then(done, done);
      return;
    }
    // Curva de gaveta (iOS): a cortina anda já no primeiro quadro e desacelera no fim.
    const D = 680;
    const wipe = art2.animate([{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)' }], { duration: D, easing: EASE_DRAWER, fill: 'backwards' });
    oldArt.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0.2, transform: 'scale(1.035)' }], { duration: D, easing: EASE_DRAWER, fill: 'forwards' });
    $('.cover__seam', cover).animate([
      { transform: 'translateX(0px)', opacity: 0 },
      { opacity: 1, offset: 0.06 },
      { opacity: 1, offset: 0.7 },
      { transform: 'translateX(' + cover.clientWidth + 'px)', opacity: 0 },
    ], { duration: D, easing: EASE_DRAWER });
    oldInfo.animate([{ opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(3px)' }], { duration: 180, easing: 'ease-out', fill: 'forwards' });
    info2.animate([{ opacity: 0, transform: 'translateY(10px)', filter: 'blur(2px)' }, { opacity: 1, transform: 'none', filter: 'blur(0px)' }], { duration: 420, delay: 260, easing: EASE_OUT, fill: 'backwards' });
    wipe.finished.then(done, done);
  }

  function openScene(id) {
    if (id === S.sceneId || S.sceneBusy) return;
    const sc = sceneById(id);
    closePop(false);
    S.sceneBusy = true;
    S.sceneId = id;
    S.hora = sc.hora;
    S.tension = sc.tensao;
    if (NPCS[S.speaker] && !sc.npcsNow.includes(S.speaker)) setSpeaker('narrador', true);
    transitionCover(sc);
    renderAmb();
    post({ tipo: 'cena', cena: id, minuto: sc.hora }, { own: true });
    addSummary({ t: Date.now(), txt: 'Cena aberta: ' + sc.titulo, k: 'cena' });
    renderCast();
    syncComposer();
    if (gm() && S.tab === 'cenas') renderPanel();
    if (gm() && S.tab === 'turnos' && !S.conflict.on) renderPanel();

  /* ------------------------------------------------------------ Elenco */
  function spotWait(p) {
    const min = Math.max(0, Math.floor((Date.now() - (p.ultimo || T0)) / MIN));
    return { min, level: min >= 10 ? 'alert' : min >= 5 ? 'warn' : 'ok' };
  }

  function presState(p) {
    if (S.typing === p.id) return 'digitando';
    return p.pres;
  }

  function resHTML(lbl, tom, v) {
    return '<div class="res" data-tom="' + tom + '"><span class="res__lbl">' + lbl + '</span><span class="res__num">' + v[0] + '<small>/' + v[1] + '</small></span><span class="res__bar"><i style="transform:scaleX(' + (v[0] / v[1]).toFixed(3) + ')"></i></span></div>';
  }

  function spotText(p, w) {
    if (w.level === 'ok') return w.min < 1 ? 'Acabou de agir' : 'Agiu há <b>' + w.min + ' min</b>';
    return 'Sem holofote há <b>' + w.min + ' min</b>';
  }

    return '<article class="pc" data-id="' + p.id + '" data-wait="' + w.level + '"' + (me ? ' data-me="true"' : '') + ' aria-label="' + esc(p.nome) + '">'
      + '<span class="av" data-tom="' + p.tom + '" aria-hidden="true">' + p.ini + '<span class="av__dot" data-state="' + presState(p) + '"></span></span>'
      + '<span class="pc__mini" aria-hidden="true">' + (gm() ? w.min + 'm' : '') + '</span>'
      + '<div class="pc__id"><h3 class="pc__name">' + esc(p.nome) + (me ? '<span class="me-tag">você</span>' : '') + '</h3><p class="pc__sub"><span class="pc__player" data-away="' + away + '">' + esc(p.jogador) + '</span><span>' + esc(p.raca) + ', ' + esc(p.oficio.toLowerCase()) + '</span></p></div>'
      + '<div class="pc__res">' + resHTML('HP', 'vida', p.hp) + resHTML('SP', 'energia', p.sp) + '<span class="pc__shield" title="Escudo">' + icon('shield') + '<span class="sr-only">Escudo </span>' + p.escudo + '</span></div>'
      + '<ul class="chips" aria-label="Condições">' + p.cond.map((c) => '<li class="chip" data-k="' + c[1] + '">' + esc(c[0]) + '</li>').join('') + '</ul>'
      + (gm() ? '<div class="spot"><span class="spot__txt">' + spotText(p, w) + '</span><button type="button" class="spot__give" data-act="darvez" data-id="' + p.id + '" aria-label="Dar a vez a ' + esc(p.curto) + '">' + icon('spot') + 'Dar a vez</button><span class="spot__track" aria-hidden="true"><i style="transform:scaleX(' + Math.min(1, w.min / 20).toFixed(3) + ')"></i></span></div>' : '')

        + '<button type="button" class="npc__x" data-act="tirar" data-id="' + id + '" aria-label="Tirar ' + esc(n.curto) + ' de cena" title="Tirar de cena">' + icon('x') + '</button>'

  /* ------------------------------------------------------------ compositor */
  const ta = $('#msg');

  function defaultModeFor(sp) {
    if (sp === 'ooc') return 'ooc';
    if (sp === 'narrador') return 'narracao';
    return 'fala';
  }

  function setSpeaker(id, silent) {
    S.speaker = id;
    if (!(S.mode === 'sussurro' && id !== 'ooc')) S.mode = defaultModeFor(id);
    if (!silent) syncComposer();
    $$('.btn-mini[data-act="falarcomo"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
  }

  function setMode(m) {
    if (m === 'narracao') S.speaker = 'narrador';
    if ((m === 'fala' || m === 'acao') && (S.speaker === 'narrador' || S.speaker === 'ooc')) {
      if (!gm()) S.speaker = S.me;
      else {
        const first = scene().npcsNow[0];
        if (!first) { showErr('Não há NPC nesta cena. Traga um pelo Elenco ou narre.'); return; }
        S.speaker = first;
      }
    }
    if (m === 'sussurro' && S.speaker === 'ooc') S.speaker = gm() ? 'narrador' : S.me;
    S.mode = m;
    if (m === 'sussurro' && !validTargets().includes(S.whisperTo)) S.whisperTo = validTargets()[0];
    syncComposer();
    $$('.btn-mini[data-act="falarcomo"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === S.speaker)));
  }

  function validTargets() {
    return gm() ? PCS.map((p) => p.id) : ['mestre'].concat(PCS.filter((p) => p.id !== S.me).map((p) => p.id));
  }

  function speakerChip(id) {
    if (id === 'narrador') return avatar('narrador', 'xs') + '<span class="pick__name">Narrador</span>' + icon('chev');
    if (id === 'ooc') return avatar('ooc', 'xs') + '<span class="pick__name">Fora do personagem</span>' + icon('chev');
    return avatar(id, 'xs') + '<span class="pick__name">' + esc(nameOf(id)) + '</span>' + icon('chev');
  }

  function placeholder() {
    if (S.speaker === 'ooc') return 'Conversa de mesa, fora da história. Regras, pausas, piadas.';
    if (S.mode === 'narracao') return 'Conte o que acontece agora…';
    if (S.mode === 'sussurro') return 'Só ' + (S.whisperTo === 'mestre' ? 'o Mestre' : shortOf(S.whisperTo)) + ' vai ler isto…';
    const who = shortOf(S.speaker);
    return S.mode === 'acao' ? 'O que ' + who + ' faz?' : 'O que ' + who + ' diz?';
  }

  function syncComposer() {
    const form = $('#comp');
    const isOoc = S.speaker === 'ooc';
    form.dataset.mode = isOoc ? 'ooc' : S.mode;
    $('#speakerBtn').innerHTML = speakerChip(S.speaker);
    const radios = $$('#modes [role="radio"]');
    radios.forEach((b) => {
      const m = b.dataset.mode;
      b.hidden = !gm() && m === 'narracao';
      const on = !isOoc && S.mode === m;
      b.setAttribute('aria-checked', String(on));
      b.tabIndex = on ? 0 : -1;
    });
    if (!radios.some((b) => b.tabIndex === 0)) radios.find((b) => !b.hidden).tabIndex = 0;
    $('#toHost').hidden = !(S.mode === 'sussurro' && !isOoc);
    $('#toBtn').innerHTML = '<span class="pick__name">' + (S.whisperTo === 'mestre' ? 'Mestre' : esc(nameOf(S.whisperTo))) + '</span>' + icon('chev');
    ta.placeholder = placeholder();
    const locked = !gm() && S.paused;
    ta.disabled = locked;
    $('#sendBtn').disabled = locked;
    $$('#dice button').forEach((b) => { b.disabled = locked; });
    $('#compPaused').hidden = !locked;
  }

  function renderDice() {
    $('#dice').innerHTML = QUICK.map((q) => '<button type="button" class="qd" data-act="quick" data-q="' + q.id + '" title="' + q.rot + (q.alvo ? ': 1d20, precisa de ' + q.alvo + (q.alvo < 20 ? ' ou mais' : '') : q.id === 'van' ? ': 2d20, fica o maior' : ': 1d20') + '">'
      + (q.id === 'd20' ? icon('d20') : '') + q.label + (q.extra ? '<b>' + q.extra + '</b>' : '') + '</button>').join('')
      + (gm() ? '<button type="button" class="qd" id="hiddenRoll" data-act="escondida" aria-pressed="' + S.hiddenRoll + '" title="Rolagens escondidas só aparecem para você">' + icon('eyeoff') + 'Escondida</button>' : '');
  }

  function autoGrow() {
    ta.style.height = 'auto';
    const h = ta.scrollHeight + 2;
    ta.style.height = Math.min(h, 160) + 'px';
    ta.style.overflowY = h > 160 ? 'auto' : 'hidden';
  }

  function showErr(msg) {
    const el = $('#compErr');
    el.textContent = msg;
    el.hidden = false;
  }

  function clearErr() { $('#compErr').hidden = true; }

  function findTarget(word) {
    const w = word.toLowerCase().replace(/^@/, '');
    if (w === 'mestre' || w === 'gm') return gm() ? null : 'mestre';
    const p = PCS.find((x) => x.curto.toLowerCase() === w || x.jogador.toLowerCase() === w || x.nome.toLowerCase().startsWith(w));
    if (!p || (!gm() && p.id === S.me)) return null;
    return p.id;
  }

  function whisperEntry(to, texto) {
    const from = gm() ? (NPCS[S.speaker] ? S.speaker : 'mestre') : S.me;
    const vis = ['mestre'];
    if (pcById(to)) vis.push(to);
    if (pcById(from) && !vis.includes(from)) vis.push(from);
    return { tipo: 'sussurro', from, to, texto, vis };
  }

  function buildEntry(raw) {
    const me = gm() ? 'mestre' : S.me;
    let m = raw.match(/^\/r(?:oll)?\s+([\s\S]+)$/i);
    if (m) return rollEntry(parseRoll(m[1]), 'Rolagem livre');
    m = raw.match(/^\/me\s+([\s\S]+)$/i);
    if (m) {
      if (gm() && !NPCS[S.speaker]) return { tipo: 'narracao', texto: m[1] };
      return { tipo: 'acao', who: gm() ? S.speaker : S.me, texto: m[1] };
    }
    m = raw.match(/^\/ooc\s+([\s\S]+)$/i);
    if (m) return { tipo: 'ooc', who: me, texto: m[1] };
    m = raw.match(/^\/n\s+([\s\S]+)$/i);
    if (m) {
      if (!gm()) throw new Error('Só o mestre narra. Use /me para descrever o que seu personagem faz.');
      return { tipo: 'narracao', texto: m[1] };
    }
    m = raw.match(/^\/s\s+(\S+)\s+([\s\S]+)$/i);
    if (m) {
      const to = findTarget(m[1]);
      if (!to) throw new Error('Não achei "' + m[1] + '" na mesa. Use o primeiro nome, como /s ' + (gm() ? 'Lia' : 'Mestre') + '.');
      return whisperEntry(to, m[2]);
    }
    if (raw.startsWith('/')) throw new Error('Comando desconhecido. Use /r, /me, /s, /ooc' + (gm() ? ' ou /n' : '') + '.');
    if (S.speaker === 'ooc') return { tipo: 'ooc', who: me, texto: raw };
    if (S.mode === 'sussurro') return whisperEntry(S.whisperTo, raw);
    if (S.mode === 'narracao') return { tipo: 'narracao', texto: raw };
    return { tipo: S.mode === 'acao' ? 'acao' : 'fala', who: gm() ? S.speaker : S.me, texto: raw };
  }

  function submit() {
    const raw = ta.value.trim();
    if (!raw) { ta.focus(); return; }
    if (!gm() && S.paused) return;
    try {
      const e = buildEntry(raw);
      post(e, { own: true });
      ta.value = '';
      autoGrow();
      clearErr();
      hideSlash();
    } catch (err) {
      showErr(err.message);
    }
  }

  /* menu de comandos com barra */
  function slashItems() {
    const v = ta.value;
    if (!/^\/\S*$/.test(v)) return [];
    return CMDS.filter((c) => (gm() || !c.gm) && c.nome.startsWith(v.toLowerCase()));
  }

  function renderSlash() {
    const items = slashItems();
    const box = $('#slash');
    if (!items.length) { hideSlash(); return; }
    S.slashIdx = Math.min(S.slashIdx, items.length - 1);
    box.innerHTML = items.map((c, i) => '<div class="slash__opt" role="option" id="slash-' + i + '" aria-selected="' + (i === S.slashIdx) + '" data-act="slash" data-cmd="' + c.cmd + '"><span class="slash__cmd">' + c.nome + '</span><span class="slash__desc">' + c.desc + '</span><span class="slash__ex">' + esc(c.ex) + '</span></div>').join('');
    box.hidden = false;
    ta.setAttribute('aria-controls', 'slash');
    ta.setAttribute('aria-activedescendant', 'slash-' + S.slashIdx);
  }

  function hideSlash() {
    $('#slash').hidden = true;
    ta.removeAttribute('aria-activedescendant');
    S.slashIdx = 0;
  }

  function applySlash(cmd) {
    ta.value = cmd;
    hideSlash();
    ta.focus();
    ta.setSelectionRange(cmd.length, cmd.length);
    syncHintForCmd(cmd);
  }

  function syncHintForCmd(cmd) {
    if (cmd === '/r ') ta.placeholder = '2d6+3, 1d20 vs 15, 2d20kh1';
  }

  /* ------------------------------------------------------------ popovers */
  function openPopover(trigger, host, html) {
    closePop(false);
    host.insertAdjacentHTML('beforeend', html);
    const el = host.lastElementChild;
    trigger.setAttribute('aria-expanded', 'true');
    openPop = { el, trigger };
    if (!reduceMotion.matches) el.animate([{ opacity: 0, transform: 'scale(0.96)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 150, easing: EASE_OUT });
    const first = $('[aria-selected="true"]', el) || $('[role="option"], button, input', el);
    if (first) first.focus();
    el.addEventListener('focusout', (ev) => {
      if (openPop && openPop.el === el && ev.relatedTarget && !el.contains(ev.relatedTarget) && ev.relatedTarget !== trigger) closePop(false);
    });
    return el;
  }

  function closePop(returnFocus) {
    if (!openPop) return false;
    const p = openPop;
    openPop = null;
    p.trigger.setAttribute('aria-expanded', 'false');
    p.el.remove();
    if (returnFocus !== false && p.trigger.isConnected) p.trigger.focus();
    return true;
  }

  function optionHTML(id, name, sub, selected, act) {
    return '<button type="button" class="opt" role="option" aria-selected="' + selected + '" data-act="' + act + '" data-id="' + id + '">' + avatar(id, 'sm') + '<span class="opt__txt"><span class="opt__name">' + esc(name) + '</span><span class="opt__sub">' + esc(sub) + '</span></span></button>';
  }

  function speakerPop() {
    const sc = scene();
    let html = '<div class="pop pop--up" role="listbox" aria-label="Falando como">';
    if (gm()) {
      html += optionHTML('narrador', 'Narrador', 'A voz da história', S.speaker === 'narrador', 'pickspeaker');
      if (sc.npcsNow.length) html += '<p class="pop__group">NPCs na cena</p>' + sc.npcsNow.map((id) => optionHTML(id, NPCS[id].nome, NPCS[id].papel, S.speaker === id, 'pickspeaker')).join('');
    } else {
      const p = pcById(S.me);
      html += optionHTML(p.id, p.nome, 'Seu personagem', S.speaker === p.id, 'pickspeaker');
    }
    html += '<p class="pop__group">Mesa</p>' + optionHTML('ooc', 'Fora do personagem', 'Conversa de mesa', S.speaker === 'ooc', 'pickspeaker') + '</div>';
    return html;
  }

  function toPop() {
    return '<div class="pop pop--up" role="listbox" aria-label="Sussurrar para">' + validTargets().map((id) => {
      if (id === 'mestre') return optionHTML('mestre', 'Mestre', 'Só o mestre lê', S.whisperTo === 'mestre', 'pickto');
      const p = pcById(id);
      return optionHTML(id, p.nome, p.jogador, S.whisperTo === id, 'pickto');
    }).join('') + '</div>';
  }

  function addNpcPop() {
    const sc = scene();
    const rest = Object.keys(NPCS).filter((id) => !sc.npcsNow.includes(id));
    return '<div class="pop pop--up" role="listbox" aria-label="Trazer à cena">' + (rest.length ? rest.map((id) => optionHTML(id, NPCS[id].nome, NPCS[id].papel, false, 'pickaddnpc')).join('') : '<p class="pop__group">Todos já estão em cena</p>') + '</div>';
  }

  function ambPop() {
    const sc = scene();
    return '<div class="pop pop--down-end pop--amb" role="dialog" aria-label="Ambiente sonoro"><p class="pop__title">' + icon('note') + esc(sc.amb) + '</p><p class="pop__note">Prévia visual. O protótipo não toca som.</p><ul class="layers">'
      + sc.camadasNow.map((c, i) => '<li class="layer"><button type="button" class="switch" role="switch" id="amb-on-' + i + '" aria-checked="' + c[2] + '" aria-label="' + esc(c[0]) + '" data-act="camada" data-i="' + i + '"><span class="switch__knob"></span></button><span>' + esc(c[0]) + '</span><input type="range" id="amb-vol-' + i + '" min="0" max="100" value="' + c[1] + '" data-vol="' + i + '" aria-label="Volume de ' + esc(c[0]) + '"' + (c[2] ? '' : ' disabled') + '></li>').join('')
      + '</ul><label class="layer layer--master" for="amb-master">Volume geral<input type="range" id="amb-master" min="0" max="100" value="' + S.ambMaster + '" data-vol="master"></label></div>';
  }

  /* ------------------------------------------------------------ painel lateral: Bastidores */
  const TABS = [['cenas', 'Cenas'], ['relogios', 'Relógios'], ['segredos', 'Segredos'], ['turnos', 'Turnos'], ['resumo', 'Resumo']];

  function arcPath(r0, r1, a0, a1) {
    const pt = (r, a) => { const t = ((a - 90) * Math.PI) / 180; return [(32 + r * Math.cos(t)).toFixed(2), (32 + r * Math.sin(t)).toFixed(2)]; };
    const p0 = pt(r1, a0); const p1 = pt(r1, a1); const p2 = pt(r0, a1); const p3 = pt(r0, a0);
    const big = a1 - a0 > 180 ? 1 : 0;
    return 'M' + p0[0] + ' ' + p0[1] + 'A' + r1 + ' ' + r1 + ' 0 ' + big + ' 1 ' + p1[0] + ' ' + p1[1] + 'L' + p2[0] + ' ' + p2[1] + 'A' + r0 + ' ' + r0 + ' 0 ' + big + ' 0 ' + p3[0] + ' ' + p3[1] + 'Z';
  }

  function clockSVG(c, fresh) {
    const gap = c.seg > 6 ? 5 : 7;
    const step = 360 / c.seg;
    let out = '<svg viewBox="0 0 64 64" aria-hidden="true">';
    for (let i = 0; i < c.seg; i += 1) out += '<path class="seg' + (i < c.val ? ' seg--on' : '') + (i === fresh ? ' seg--new' : '') + '" d="' + arcPath(19, 30, i * step + gap / 2, (i + 1) * step - gap / 2) + '"/>';
    return out + '</svg>';
  }

  function clockHTML(c, fresh) {
    const full = c.val >= c.seg;
    return '<li class="clk" data-id="' + c.id + '" data-tom="' + c.tom + '"' + (full ? ' data-full="true"' : '') + '>'
      + '<button type="button" class="clk__ring" data-act="clk+" data-id="' + c.id + '" aria-label="' + esc(c.nome) + ', ' + c.val + ' de ' + c.seg + '. ' + (full ? 'Completo' : 'Avançar um segmento') + '"' + (full ? ' aria-disabled="true"' : '') + '>' + clockSVG(c, fresh) + '<span class="clk__n" aria-hidden="true">' + (full ? icon('check') : c.val + '<small>/' + c.seg + '</small>') + '</span></button>'
      + '<div><p class="clk__name">' + esc(c.nome) + '</p><div class="clk__ctl"><button type="button" class="icon-btn" data-act="clk-" data-id="' + c.id + '" aria-label="Voltar um segmento de ' + esc(c.nome) + '" title="Voltar um segmento"' + (c.val === 0 ? ' disabled' : '') + '>' + icon('minus') + '</button>'
      + '<button type="button" class="vis" data-act="clkvis" data-id="' + c.id + '" aria-pressed="' + c.publico + '" title="' + (c.publico ? 'Os jogadores veem quando avança' : 'Avança em segredo') + '">' + icon(c.publico ? 'eye' : 'eyeoff') + '<span>' + (c.publico ? 'Jogadores veem' : 'Só você') + '</span></button></div></div></li>';
  }

  function turnOrder() {
    const ids = PCS.map((p) => p.id).concat(scene().npcsNow);
    return ids.sort((a, b) => agiOf(b) - agiOf(a) || (pcById(b) ? 1 : 0) - (pcById(a) ? 1 : 0));
  }

  function agiOf(id) {
    const p = pcById(id);
    return p ? rankOf(ATRIBUTOS[1], p.pts.agilidade) : NPCS[id].agi;
  }

  function panelHTML(tab) {
    if (tab === 'cenas') {
      return '<p class="panel__intro">A fila da noite. Abrir uma cena troca a capa para todos e marca a troca no registro.</p><ol class="scenes">'
        + SCENES.map((sc, i) => {
          const cur = sc.id === S.sceneId;
          return '<li class="scn"' + (cur ? ' aria-current="true"' : '') + '><span class="scn__thumb" aria-hidden="true">' + art(sc.id, 't' + i) + '</span><div class="scn__body"><p class="scn__title">' + esc(sc.titulo) + '</p><p class="scn__note">' + esc(sc.nota) + '</p><div class="scn__foot"><span class="scn__when">' + periodo(sc.hora) + ', ' + fmtHora(sc.hora) + '</span>'
            + (cur ? '<span class="badge">Em cena</span>' : '<button type="button" class="lb-btn lb-btn--compact" data-act="abrircena" data-id="' + sc.id + '" aria-label="Abrir cena ' + esc(sc.titulo) + '">Abrir cena</button>') + '</div></div></li>';
        }).join('') + '</ol>';
    }
    if (tab === 'relogios') {
      return '<p class="panel__intro">Clique no círculo para avançar. Relógios públicos aparecem no registro dos jogadores.</p><ul class="clocks">' + S.clocks.map((c) => clockHTML(c, -1)).join('') + '</ul>';
    }
    if (tab === 'segredos') {
      return '<ul class="secrets">' + S.secrets.map((s) => {
        const rev = !!s.revelado;
        return '<li class="sec"' + (rev ? ' data-revealed="true"' : '') + '><p class="sec__title">' + esc(s.titulo) + '</p><p class="sec__text">' + esc(s.texto) + '</p><div class="sec__foot"><span class="sec__scene">' + esc(sceneById(s.cena).titulo) + '</span>'
          + (rev ? '<span class="sec__done">' + icon('check') + 'Revelado em ' + fmtDur(s.revelado - S.sessionStart) + '</span>' : '<button type="button" class="lb-btn lb-btn--compact lb-btn--reveal" data-act="revelar" data-id="' + s.id + '">' + icon('eye') + 'Revelar aos jogadores</button>') + '</div></li>';
      }).join('') + '</ul><div class="notes"><label class="notes__lbl" for="gmNotes">Anotações do mestre</label><textarea id="gmNotes" placeholder="Nomes, ganchos, o que lembrar na próxima sessão">' + esc(S.notes) + '</textarea><p class="notes__hint">Ficam guardadas neste navegador.</p></div>';
    }
    if (tab === 'turnos') {
      const c = S.conflict;
      const order = c.on ? c.order : turnOrder();
      return '<div class="turns__head"><p class="turns__state">' + (c.on ? 'Rodada <b>' + c.round + '</b>' : 'Sem conflito agora') + '</p>' + (c.on ? '<button type="button" class="lb-btn lb-btn--ghost lb-btn--compact" data-act="fimconflito">Encerrar conflito</button>' : '') + '</div>'
        + '<p class="panel__intro">' + (c.on ? 'Ordem de velocidade pela Agilidade. A vez atual fica em destaque.' : 'Quando a conversa virar briga, a ordem sai da Agilidade de cada um. Os NPCs da cena entram junto.') + '</p>'
        + '<ol class="turns">' + order.map((id, i) => { const cur = c.on && i === c.turn; return '<li class="turn' + (cur ? ' is-current' : '') + '"' + (cur ? ' aria-current="step"' : '') + '><span class="turn__pos">' + (i + 1) + '</span>' + avatar(id, 'xs') + '<span class="turn__name">' + esc(nameOf(id)) + '</span><span class="turn__spd">AGI R' + agiOf(id) + '</span></li>'; }).join('') + '</ol>'
        + '<div class="turns__ctl">' + (c.on ? '<button type="button" class="lb-btn lb-btn--primary lb-btn--block" data-act="proxvez">Próxima vez</button>' : '<button type="button" class="lb-btn lb-btn--primary lb-btn--block" data-act="conflito">' + icon('sword') + 'Iniciar conflito</button>') + '</div>';
    }
    return '<ol class="tl">' + S.summary.map((it) => '<li class="tl__item" data-k="' + it.k + '"><span class="tl__time">' + fmtDur(it.t - S.sessionStart) + '</span><span class="tl__dot" aria-hidden="true"></span><p class="tl__txt">' + esc(it.txt) + '</p></li>').join('') + '</ol>'
      + '<form class="tl__add" data-form="marco"><label for="newMarco" class="sr-only">Novo marco</label><input id="newMarco" type="text" placeholder="Escreva um marco e aperte Enter" autocomplete="off"><button type="submit" class="lb-btn lb-btn--compact">Marcar</button></form>'
      + '<p class="panel__hint">' + icon('mark') + 'Também dá para marcar qualquer entrada do registro.</p>';
  }

  function renderBackstage() {
    $('#side').setAttribute('aria-label', 'Bastidores');
    $('#side').innerHTML = '<div class="side__head"><h2 class="side__title">Bastidores</h2><span class="side__note">' + icon('eyeoff') + 'Só você vê</span></div>'
      + '<div class="tabs" role="tablist" aria-label="Bastidores">' + TABS.map((t) => '<button type="button" role="tab" class="tab" id="tab-' + t[0] + '" aria-controls="panel" aria-selected="' + (S.tab === t[0]) + '" tabindex="' + (S.tab === t[0] ? 0 : -1) + '" data-act="tab" data-tab="' + t[0] + '">' + t[1] + '<span class="tab__badge" data-badge="' + t[0] + '" hidden></span></button>').join('') + '<span class="tabs__ink" aria-hidden="true"></span></div>'
      + '<div class="panel" id="panel" role="tabpanel" aria-labelledby="tab-' + S.tab + '" tabindex="0">' + panelHTML(S.tab) + '</div>';
    syncBadges();
    requestAnimationFrame(() => placeInk(false));
  }

  function renderPanel() {
    const panel = $('#panel');
    if (!panel || !gm()) return;
    const scroll = panel.scrollTop;
    panel.innerHTML = panelHTML(S.tab);
    panel.setAttribute('aria-labelledby', 'tab-' + S.tab);
    panel.scrollTop = scroll;
  }

  function placeInk(animate) {
    const tabs = $('.tabs');
    if (!tabs) return;
    const sel = $('.tab[aria-selected="true"]', tabs);
    const ink = $('.tabs__ink', tabs);
    if (!sel || !ink) return;
    ink.style.transition = animate && !reduceMotion.matches ? '' : 'none';
    ink.style.transform = 'translateX(' + sel.offsetLeft + 'px) scaleX(' + (sel.offsetWidth / 100).toFixed(3) + ')';
  }

  function setTab(id, focus) {
    S.tab = id;
    if (S.badges[id]) S.badges[id] = 0;
    $$('.tab').forEach((t) => {
      const on = t.dataset.tab === id;
      t.setAttribute('aria-selected', String(on));
      t.tabIndex = on ? 0 : -1;
      if (on && focus) t.focus();
    });
    syncBadges();
    placeInk(!focus);
    $('#panel').scrollTop = 0;
    renderPanel();
  }

  function syncBadges() {
    $$('.tab__badge').forEach((b) => {
      const n = S.badges[b.dataset.badge] || 0;
      b.hidden = n < 1;
      b.textContent = n;
    });
  }

  /* ------------------------------------------------------------ painel lateral: ficha do jogador */
  function renderSheet() {
    const p = pcById(S.me);
    const last = S.lastRoll[p.id];
    const sagaWhy = p.saga < 1 ? 'Sem Pontos Saga. O mestre dá mais quando você aceita uma complicação.' : !last ? 'Role um teste primeiro.' : 'Repete: ' + last.rotulo + '.';
    const clues = S.secrets.filter((s) => s.revelado).map((s) => ({ t: s.titulo, d: s.texto, k: 'pista' })).concat(ITENS[p.id] || []);
    const whispers = S.log.filter((e) => e.tipo === 'sussurro' && (e.to === p.id || e.from === p.id));
    $('#side').setAttribute('aria-label', 'Sua ficha');
    $('#side').innerHTML = '<div class="side__head"><h2 class="side__title">Sua ficha</h2><span class="side__note">' + icon('lock') + 'Só você vê</span></div>'
      + '<div class="panel" tabindex="0">'
      + '<div class="sheet__head">' + avatar(p.id, 'lg') + '<div><p class="sheet__name">' + esc(p.nome) + '</p><p class="sheet__sub">' + esc(p.raca) + ', ' + esc(p.oficio.toLowerCase()) + '. Jogada por ' + esc(p.jogador) + '.</p></div><span class="pc__shield" title="Escudo">' + icon('shield') + '<span class="sr-only">Escudo </span>' + p.escudo + '</span></div>'
      + '<div class="sheet__res">' + resHTML('HP', 'vida', p.hp) + resHTML('SP', 'energia', p.sp) + '</div>'
      + '<div class="saga"><div><p class="saga__lbl">Pontos Saga</p><p class="saga__hint">Repetem um teste que deu errado.</p></div><span class="saga__pips" role="img" aria-label="' + p.saga + ' de 3">' + [0, 1, 2].map((i) => '<i data-on="' + (i < p.saga) + '"></i>').join('') + '</span>'
      + '<button type="button" class="lb-btn lb-btn--block" data-act="saga" aria-describedby="sagaWhy"' + (p.saga < 1 || !last ? ' disabled' : '') + '>Usar Ponto Saga no último teste</button><p class="saga__why" id="sagaWhy">' + esc(sagaWhy) + '</p></div>'
      + '<h3 class="sheet__h">Atributos <span>clique para testar (1d20)</span></h3><div class="attrs">'
      + ATRIBUTOS.map((a) => { const v = p.pts[a.id]; const r = rankOf(a, v); return '<button type="button" class="attr" data-act="testar" data-attr="' + a.id + '" aria-label="Testar ' + a.nome + ', rank ' + r + '" title="Testar ' + a.nome + '"><span class="attr__ab">' + a.ab + '</span><span class="attr__rk">R' + r + '</span><span class="attr__pts">' + v + '<span class="attr__note">♪</span></span></button>'; }).join('') + '</div>'
      + '<h3 class="sheet__h">Pistas e itens <span>' + clues.length + '</span></h3><ul class="clues">' + clues.map((c) => '<li class="clue" data-k="' + c.k + '"><span class="clue__ic" aria-hidden="true">' + icon(c.k === 'pista' ? 'key' : 'item') + '</span><div><p class="clue__t">' + esc(c.t) + '</p><p class="clue__d">' + esc(c.d) + '</p></div></li>').join('') + '</ul>'
      + '<h3 class="sheet__h">Seus sussurros <span>só você e o mestre</span></h3><ul class="whispers">' + (whispers.length ? whispers.map((e) => '<li class="sus"><p class="sus__head">' + icon('lock') + '<span>' + esc(whisperHead(e)) + '</span></p><p class="sus__txt">' + esc(e.texto) + '</p></li>').join('') : '<li class="empty">Nenhum sussurro ainda.</li>') + '</ul>'
      + '<button type="button" class="lb-btn lb-btn--block" data-act="sussurrar">' + icon('lock') + 'Sussurrar ao mestre</button>'
      + '</div>';
  }

  function renderSide() { if (gm()) renderBackstage(); else renderSheet(); }

  /* ------------------------------------------------------------ ações */
  function goStage() {
    if (window.matchMedia('(max-width: 760px)').matches) setPane('stage');
    if (S.railOpen) { S.railOpen = false; renderCast(); }
  }

  function setPane(p) {
    S.pane = p;
    $('#main').dataset.pane = p;
    $$('.mtab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.pane === p)));
  }

  function setView(v) {
    if (v === S.view) return;
    closePop(false);
    S.view = v;
    S.railOpen = false;
    S.speaker = v === 'mestre' ? 'narrador' : S.me;
    S.mode = defaultModeFor(S.speaker);
    S.whisperTo = v === 'mestre' ? 'lia' : 'mestre';
    S.hiddenRoll = false;
    $$('#viewSeg [role="radio"]').forEach((b) => { const on = b.dataset.view === v; b.setAttribute('aria-checked', String(on)); b.tabIndex = on ? 0 : -1; });
    $('#mtabSide span').textContent = v === 'mestre' ? 'Bastidores' : 'Ficha';
    clearErr();
    renderAll();
    if (!reduceMotion.matches) $('#main').animate([{ opacity: 0.35 }, { opacity: 1 }], { duration: 200, easing: 'ease-out' });
  }

  function togglePause() {
    S.paused = !S.paused;
    if (S.paused) S.pausedAt = Date.now(); else S.pausedMs += Date.now() - S.pausedAt;
    post({ tipo: 'sistema', k: 'pausa', html: S.paused ? 'Mesa <b>pausada</b> pelo mestre' : 'Mesa <b>retomada</b>' }, { own: true });
    renderBar();
    $('#liveBtn').focus();
    syncComposer();
  }

  function bumpClock(id, delta) {
    const c = S.clocks.find((x) => x.id === id);
    const before = c.val;
    c.val = Math.max(0, Math.min(c.seg, c.val + delta));
    if (c.val === before) return;
    const li = $('.clk[data-id="' + id + '"]');
    const focusRing = li && li.contains(document.activeElement) ? document.activeElement.dataset.act : null;
    if (li) {
      li.outerHTML = clockHTML(c, delta > 0 ? c.val - 1 : -1);
      const fresh = $('.clk[data-id="' + id + '"]');
      if (delta > 0 && c.val === c.seg) fresh.dataset.freshFull = 'true';
      const back = focusRing ? $('[data-act="' + focusRing + '"]', fresh) : null;
      if (back && !back.disabled) back.focus(); else if (focusRing) $('.clk__ring', fresh).focus();
    }
    if (delta > 0) {
      const full = c.val === c.seg;
      post({ tipo: 'sistema', k: 'relogio', html: (full ? 'Relógio completo: <b>' + esc(c.nome) + '</b>' : 'Relógio avançou: <b>' + esc(c.nome) + '</b>, ' + c.val + ' de ' + c.seg), vis: c.publico ? 'todos' : ['mestre'], secreto: !c.publico });
      if (full) addSummary({ t: Date.now(), txt: 'Relógio completo: ' + c.nome, k: 'relogio' });
    }
  }

  function revealSecret(id) {
    const s = S.secrets.find((x) => x.id === id);
    if (!s || s.revelado) return;
    s.revelado = Date.now();
    post({ tipo: 'revelacao', titulo: s.titulo, texto: s.texto }, { own: true });
    addSummary({ t: s.revelado, txt: 'Pista revelada: ' + s.titulo, k: 'pista' });
    renderPanel();
    toast('Revelado aos jogadores. A pista está no registro e na ficha de cada um.');
  }

  function startConflict() {
    S.conflict = { on: true, round: 1, order: turnOrder(), turn: 0 };
    const names = S.conflict.order.map(shortOf).join(', ');
    post({ tipo: 'sistema', k: 'conflito', html: 'Conflito! Rodada 1. Ordem de velocidade: <b>' + esc(names) + '</b>' });
    post({ tipo: 'sistema', k: 'vez', html: 'Vez de <b>' + esc(nameOf(S.conflict.order[0])) + '</b>' });
    renderPanel();
    const next = $('[data-act="proxvez"]');
    if (next) next.focus();
  }

  function nextTurn() {
    const c = S.conflict;
    c.turn += 1;
    if (c.turn >= c.order.length) {
      c.turn = 0;
      c.round += 1;
      post({ tipo: 'sistema', k: 'conflito', html: 'Rodada <b>' + c.round + '</b>' });
    }
    post({ tipo: 'sistema', k: 'vez', html: 'Vez de <b>' + esc(nameOf(c.order[c.turn])) + '</b>' });
    renderPanel();
    const next = $('[data-act="proxvez"]');
    if (next) next.focus();
  }

  function endConflict() {
    const r = S.conflict.round;
    S.conflict = { on: false, round: 1, order: [], turn: 0 };
    post({ tipo: 'sistema', k: 'conflito', html: 'Conflito encerrado depois de <b>' + r + (r === 1 ? ' rodada' : ' rodadas') + '</b>' });
    addSummary({ t: Date.now(), txt: 'Conflito encerrado (' + r + (r === 1 ? ' rodada)' : ' rodadas)'), k: 'marco' });
    renderPanel();
    const start = $('[data-act="conflito"]');
    if (start) start.focus();
  }

  function toggleMark(id) {
    const e = S.log.find((x) => x.id === id);
    if (!e) return;
    e.marcado = !e.marcado;
    if (e.marcado) addSummary({ t: e.t, txt: summarize(e), k: 'marco', ref: e.id });
    else {
      S.summary = S.summary.filter((it) => it.ref !== e.id);
      if (S.tab === 'resumo') renderPanel();
    }
    const btn = $('.e__mark[data-id="' + id + '"]');
    if (btn) {
      const lbl = e.marcado ? 'Tirar do resumo' : 'Marcar no resumo';
      btn.setAttribute('aria-pressed', String(e.marcado));
      btn.setAttribute('aria-label', lbl);
      btn.title = lbl;
    }
  }

  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.dataset.state = 'enter';
    el.textContent = msg;
    $('#toasts').append(el);
    requestAnimationFrame(() => requestAnimationFrame(() => { el.dataset.state = ''; }));
    setTimeout(() => { el.dataset.state = 'leave'; setTimeout(() => el.remove(), 220); }, 2800);
  }

  function setTyping(who) {
    S.typing = who;
    const p = who ? pcById(who) : null;
    $('#typing').innerHTML = p ? '<span class="typing__dots" aria-hidden="true"><i></i><i></i><i></i></span><span>' + esc(p.jogador) + ' está escrevendo…</span>' : '';
    renderBar();
    refreshSpots();
  }

  /* ------------------------------------------------------------ eventos */
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-act]');
    if (!t || t.disabled) return;
    const act = t.dataset.act;
    const id = t.dataset.id;
    switch (act) {
      case 'view': setView(t.dataset.view); break;
      case 'pausa': togglePause(); break;
      case 'pane': setPane(t.dataset.pane); break;
      case 'rail': setRail(!S.railOpen); break;
      case 'mode': setMode(t.dataset.mode); break;
      case 'speaker': if (openPop && openPop.trigger === t) closePop(); else openPopover(t, $('#speakerHost'), speakerPop()); break;
      case 'to': if (openPop && openPop.trigger === t) closePop(); else openPopover(t, $('#toHost'), toPop()); break;
      case 'pickspeaker': closePop(false); setSpeaker(id); ta.focus(); break;
      case 'pickto': closePop(false); S.whisperTo = id; syncComposer(); ta.focus(); break;
      case 'addnpc': if (openPop && openPop.trigger === t) closePop(); else openPopover(t, $('#addHost'), addNpcPop()); break;
      case 'pickaddnpc': {
        closePop(false);
        scene().npcsNow.push(id);
        post({ tipo: 'sistema', k: 'npc', html: '<b>' + esc(NPCS[id].nome) + '</b> entrou na cena' });
        renderCast();
        const again = $('#addNpcBtn');
        if (again) again.focus();
        break;
      }
      case 'tirar': {
        const sc = scene();
        sc.npcsNow = sc.npcsNow.filter((x) => x !== id);
        post({ tipo: 'sistema', k: 'npc', html: '<b>' + esc(NPCS[id].nome) + '</b> saiu de cena' });
        if (S.speaker === id) setSpeaker('narrador');
        renderCast();
        break;
      }
      case 'falarcomo': setSpeaker(id); goStage(); ta.focus(); break;
      case 'darvez': {
        const p = pcById(id);
        S.speaker = 'narrador';
        S.mode = 'narracao';
        syncComposer();
        ta.value = p.curto + ', ';
        autoGrow();
        goStage();
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
        break;
      }
      case 'quick': {
        const q = QUICK.find((x) => x.id === t.dataset.q);
        const spec = parseRoll(q.expr + (q.alvo ? ' vs ' + q.alvo : ''));
        post(rollEntry(spec, q.rot), { own: true });
        break;
      }
      case 'escondida': S.hiddenRoll = !S.hiddenRoll; t.setAttribute('aria-pressed', String(S.hiddenRoll)); break;
      case 'marcar': toggleMark(id); break;
      case 'tofim': logEl.scrollTop = logEl.scrollHeight; S.unread = 0; syncNewPill(); break;
      case 'hora': {
        S.hora += 10;
        post({ tipo: 'sistema', k: 'hora', html: 'Hora avançou: <b>' + fmtHora(S.hora) + '</b>' });
        refreshCoverInfo();
        break;
      }
      case 'tensao': S.tension = Number(t.dataset.n); refreshCoverInfo(); break;
      case 'amb': if (openPop && openPop.trigger === t) closePop(); else openPopover(t, $('#ambHost'), ambPop()); break;
      case 'camada': {
        const c = scene().camadasNow[Number(t.dataset.i)];
        c[2] = !c[2];
        t.setAttribute('aria-checked', String(c[2]));
        const range = $('#amb-vol-' + t.dataset.i);
        if (range) range.disabled = !c[2];
        refreshAmbBars();
        break;
      }
      case 'tab': setTab(t.dataset.tab, false); break;
      case 'abrircena': openScene(id); break;
      case 'clk+': bumpClock(id, 1); break;
      case 'clk-': bumpClock(id, -1); break;
      case 'clkvis': {
        const c = S.clocks.find((x) => x.id === id);
        c.publico = !c.publico;
        const li = $('.clk[data-id="' + id + '"]');
        li.outerHTML = clockHTML(c, -1);
        $('.clk[data-id="' + id + '"] [data-act="clkvis"]').focus();
        break;
      }
      case 'revelar': revealSecret(id); break;
      case 'conflito': startConflict(); break;
      case 'proxvez': nextTurn(); break;
      case 'fimconflito': endConflict(); break;
      case 'slash': applySlash(t.dataset.cmd); break;
      case 'testar': {
        const a = ATRIBUTOS.find((x) => x.id === t.dataset.attr);
        const p = pcById(S.me);
        post(rollEntry(parseRoll('1d20'), 'Teste de ' + a.nome + ' (R' + rankOf(a, p.pts[a.id]) + ')', { who: S.me }), { own: true });
        goStage();
        break;
      }
      case 'saga': {
        const p = pcById(S.me);
        const last = S.lastRoll[p.id];
        if (!last || p.saga < 1) break;
        p.saga -= 1;
        post(rollEntry(last.spec, last.rotulo + ', repetido com Ponto Saga', { who: S.me, saga: true }), { own: true });
        goStage();
        break;
      }
      case 'sussurrar': {
        S.speaker = S.me;
        S.whisperTo = 'mestre';
        setMode('sussurro');
        goStage();
        ta.focus();
        break;
      }
      default: break;
    }
  });

  function refreshAmbBars() {
    const bars = $('.amb__bars');
    if (!bars) return;
    const sc = scene();
    $$('i', bars).forEach((i, n) => {
      const c = sc.camadasNow[n];
      i.style.transform = 'scaleY(' + (c[2] ? Math.max(0.18, (c[1] / 100) * (S.ambMaster / 100)).toFixed(2) : 0.12) + ')';
    });
  }

  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t === ta) { autoGrow(); clearErr(); renderSlash(); return; }
    if (t.dataset && t.dataset.vol) {
      if (t.dataset.vol === 'master') S.ambMaster = Number(t.value);
      else scene().camadasNow[Number(t.dataset.vol)][1] = Number(t.value);
      refreshAmbBars();
      return;
    }
    if (t.id === 'gmNotes') { S.notes = t.value; store.set('rp-notas', t.value); }
  });

  document.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const f = ev.target;
    if (f.id === 'comp') { submit(); return; }
    if (f.dataset.form === 'marco') {
      const input = $('#newMarco');
      const txt = input.value.trim();
      if (!txt) return;
      addSummary({ t: Date.now(), txt, k: 'marco' });
      const again = $('#newMarco');
      if (again) again.focus();
    }
  });

  ta.addEventListener('keydown', (ev) => {
    const slashOpen = !$('#slash').hidden;
    if (slashOpen) {
      const items = slashItems();
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        S.slashIdx = (S.slashIdx + (ev.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
        renderSlash();
        return;
      }
      if (ev.key === 'Enter' || ev.key === 'Tab') {
        ev.preventDefault();
        applySlash(items[S.slashIdx].cmd);
        return;
      }
      if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); hideSlash(); return; }
    }
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); submit(); }
  });

  logEl.addEventListener('scroll', () => {
    if (S.unread && logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40) { S.unread = 0; syncNewPill(); }
  }, { passive: true });

  document.addEventListener('keydown', (ev) => {
    const k = ev.key;
    const radio = ev.target.closest && ev.target.closest('[role="radio"]');
    if (radio && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(k)) {
      const group = radio.closest('[role="radiogroup"]');
      const items = $$('[role="radio"]', group).filter((b) => !b.hidden && !b.disabled);
      let i = items.indexOf(radio);
      if (k === 'ArrowLeft' || k === 'ArrowUp') i = (i - 1 + items.length) % items.length;
      else if (k === 'ArrowRight' || k === 'ArrowDown') i = (i + 1) % items.length;
      else i = k === 'Home' ? 0 : items.length - 1;
      ev.preventDefault();
      const target = items[i];
      const key = target.dataset.act + (target.dataset.n || target.dataset.mode || target.dataset.view || '');
      target.click();
      const again = $$('[role="radio"]').find((b) => b.dataset.act + (b.dataset.n || b.dataset.mode || b.dataset.view || '') === key);
      if (again) again.focus();
      return;
    }
    const tab = ev.target.closest && ev.target.closest('.tabs [role="tab"]');
    if (tab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(k)) {
      const tabs = $$('.tabs [role="tab"]');
      let i = tabs.indexOf(tab);
      if (k === 'ArrowLeft') i = (i - 1 + tabs.length) % tabs.length;
      else if (k === 'ArrowRight') i = (i + 1) % tabs.length;
      else i = k === 'Home' ? 0 : tabs.length - 1;
      ev.preventDefault();
      setTab(tabs[i].dataset.tab, true);
      return;
    }
    if (openPop && ['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(k) && openPop.el.getAttribute('role') === 'listbox') {
      const opts = $$('[role="option"]', openPop.el);
      let i = opts.indexOf(document.activeElement);
      if (k === 'ArrowDown') i = (i + 1) % opts.length;
      else if (k === 'ArrowUp') i = (i - 1 + opts.length) % opts.length;
      else i = k === 'Home' ? 0 : opts.length - 1;
      ev.preventDefault();
      if (opts[i]) opts[i].focus();
      return;
    }
    if (k === 'Escape') {
      if (closePop()) { ev.preventDefault(); return; }
      if (S.railOpen) { ev.preventDefault(); setRail(false); return; }
      if (S.mode === 'sussurro') { ev.preventDefault(); setMode(defaultModeFor(S.speaker)); return; }
    }
  });

  document.addEventListener('pointerdown', (ev) => {
    if (openPop && !openPop.el.contains(ev.target) && !openPop.trigger.contains(ev.target)) closePop(false);
    if (S.railOpen && !$('#cast').contains(ev.target)) { S.railOpen = false; renderCast(); }
  });

  window.addEventListener('resize', () => placeInk(false));

  /* ------------------------------------------------------------ começo: registro de exemplo */
  function seed() {
    const at = (m) => T0 + m * MIN;
    const add = (m, e) => {
      e.id = 'e' + (++S.seq);
      e.t = at(m);
      e.vis = e.vis || 'todos';
      if (e.tipo === 'rolagem') e.r = finishRoll(e.spec);
      S.log.push(e);
      const p = pcById(e.who);
      if (p && isIC(e)) p.ultimo = e.t;
      if (e.tipo === 'rolagem' && p) S.lastRoll[p.id] = { spec: { termos: e.spec.termos.map((t) => ({ n: t.n, f: t.f, sinal: t.sinal, keep: t.keep, kn: t.kn })), mod: e.spec.mod, alvo: e.spec.alvo }, rotulo: e.rotulo };
      return e;
    };
    const d20 = (vals, kept, keep, alvo) => ({ termos: [{ n: vals.length, f: 20, sinal: 1, keep: keep || null, kn: 1, vals, kept }], mod: 0, alvo });
    add(-18, { tipo: 'cena', cena: 'cais', minuto: 23 * 60 + 5 });
    add(-18, { tipo: 'narracao', texto: 'A neblina sobe do mar como fumaça de cachimbo velho. No fim do cais, as lanternas do Albatroz de Ferro balançam presas aos mastros, e cada estalo do casco soa alto demais para esta hora. Bento Âncora conta moedas sob um toldo remendado e não levanta os olhos.' });
    add(-17, { tipo: 'fala', who: 'bento', texto: 'Se vieram pela caixa do selo azul, chegaram tarde. Ou cedo demais. Depende de quem pergunta.' });
    add(-16, { tipo: 'fala', who: 'kaito', texto: 'A gente só quer saber em qual navio ela embarcou, velho. Sem confusão.' });
    add(-15, { tipo: 'acao', who: 'dom', texto: 'encosta no poste de amarração, que range sob o peso, e oferece a Bento um pastel de peixe ainda quente.' });
    add(-15, { tipo: 'ooc', who: 'dom', texto: 'o pastel é suborno, deixa claro rs' });
    add(-14, { tipo: 'rolagem', who: 'kaito', rotulo: 'Carisma, para convencer Bento', spec: d20([13], [true], null, 12) });
    const marked = add(-13, { tipo: 'fala', who: 'bento', texto: 'Peixe-espada? Hm. O navio é o Albatroz. Mas ninguém sobe a bordo sem passar pela Tenente Quessada.', marcado: true });
    add(-12, { tipo: 'narracao', texto: 'Bento suspira e aponta com o queixo para um barril marcado com um X de piche, quase escondido entre as redes de pesca.' });
    add(-12, { tipo: 'sussurro', from: 'mestre', to: 'lia', texto: 'Seu faro de Mink pega cheiro de pólvora fresca vindo do barril marcado. Só você percebeu.', vis: ['mestre', 'lia'] });
    add(-11, { tipo: 'sistema', k: 'relogio', html: 'Relógio avançou: <b>Patrulha da Marinha chega ao cais</b>, 3 de 6' });
    add(-10, { tipo: 'ooc', who: 'iara', texto: 'volto em 5 min, vou pegar água' });
    add(-9, { tipo: 'nota', texto: 'Se abrirem o barril, a patrulha avança 1 no relógio.', vis: ['mestre'] });
    add(-8, { tipo: 'acao', who: 'lia', texto: 'se agacha entre as redes, orelhas em pé, e chega perto do barril sem fazer barulho.' });
    add(-7, { tipo: 'rolagem', who: 'lia', rotulo: 'Furtividade (Agilidade), com vantagem', spec: d20([7, 16], [false, true], 'h', 15) });
    add(-6, { tipo: 'fala', who: 'zuri', texto: 'Quem chega primeiro na carga leva a melhor parte. Ou a pior. Eu vendo as duas informações, se quiserem.' });
    add(-4, { tipo: 'rolagem', who: 'kaito', rotulo: 'Intuição, para ler as intenções de Zuri', spec: d20([9], [true], null, 14) });
    add(-3, { tipo: 'sistema', k: 'hora', html: 'Hora avançou: <b>23h40</b>. A maré está alta.' });
    add(-2, { tipo: 'narracao', texto: 'O sino do farol toca duas vezes. Do outro lado da baía, uma lanterna azul acende no convés do Albatroz e começa a descer em direção às escadas do cais.' });
    S.summary = [
      { t: S.sessionStart, txt: 'Sessão começou', k: 'sessao' },
      { t: S.sessionStart + 12 * MIN, txt: 'Desembarque em Sal Partido', k: 'marco' },
      { t: T0 - 61 * MIN, txt: 'Pista revelada: Carta com selo de cera azul', k: 'pista' },
      { t: T0 - 18 * MIN, txt: 'Cena aberta: Cais da Vela Rubra', k: 'cena' },
      { t: marked.t, txt: summarize(marked), k: 'marco', ref: marked.id },
    ];
  }

  /* Dois jogadores escrevem sozinhos logo depois de abrir, para a mesa parecer viva. */
  function startScript() {
    const steps = [
      { at: 9000, who: 'dom', dur: 4200, e: { tipo: 'acao', who: 'dom', texto: 'guarda o resto dos pastéis no avental e encara a lanterna azul que se aproxima.' } },
      { at: 32000, who: 'kaito', dur: 3800, e: { tipo: 'fala', who: 'kaito', texto: 'Bento, quem mais sabe desse barril? Fala rápido.' } },
    ];
    steps.forEach((st) => {
      setTimeout(() => {
        if (S.paused) return;
        setTyping(st.who);
        setTimeout(() => { setTyping(null); if (!S.paused) post(st.e); }, st.dur);
      }, st.at);
    });
  }

  function renderAll() {
    renderBar();
    renderCast();
    renderCover();
    renderLog();
    renderDice();
    syncComposer();
    renderSide();
  }

  seed();
  renderAll();
  autoGrow();
  startScript();
  setInterval(() => { $('#sessTime').textContent = fmtDur(sessionNow() - S.sessionStart); refreshSpots(); }, 15000);
})();
</script>

</body></html>
