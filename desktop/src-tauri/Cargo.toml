[package]
name = "labirinto"
version = "0.5.63"
description = "Labirinto VTT"
edition = "2021"

[lib]
name = "labirinto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt", "process", "fs", "io-util"] }
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
sha2 = "0.10"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
minisign-verify = "0.2.5"
base64 = "0.22.1"
futures-core = { version = "0.3", default-features = false }
http-body = "1"
# Já vinha na árvore (png do tauri-codegen); o protocolo minigame:// descompacta o pacote do jogo.
flate2 = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[profile.release]
panic = "abort"
# LTO fino + 16 unidades: o LTO completo com 1 unidade compilava em 1 núcleo,
# levava ~33 min e estourou a memória na 0.5.42 (rustc-LLVM out of memory).
codegen-units = 16
lto = "thin"
opt-level = "s"

[target."cfg(windows)".dependencies]
keyring-core = "1.0.0"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
