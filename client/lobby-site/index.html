<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#121214" />
    <meta name="robots" content="noindex" />
    <!-- Ícone embutido: o site não tem o public/ do app, e sem ícone a aba
         fica com a folha branca de página sem dono. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e0a44a' stroke-width='1.7' stroke-linecap='square'%3E%3Cpath d='M12 21H3V3h18v18h-6V7H7v10h4'/%3E%3C/svg%3E"
    />
    <title>Lobby do Labirinto</title>

    <!--
      O escuro da casa nasce aqui, sem depender de script (mesmo motivo do
      player.html). A CSP do site (public-lobby/_headers) aceita <style>
      embutido e recusa <script> embutido: script só em arquivo.
    -->
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        background: var(--lb-color-ink, #121214);
      }

      body {
        margin: 0;
        color: var(--lb-color-parchment, #eceae4);
        font-family: var(
          --lb-font-sans,
          'Segoe UI Variable Text',
          'Segoe UI',
          system-ui,
          -apple-system,
          'Inter',
          'Roboto',
          'Helvetica Neue',
          Arial,
          sans-serif
        );
        line-height: 1.45;
        -webkit-text-size-adjust: 100%;
      }

      .lobby-esqueleto {
        box-sizing: border-box;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px 16px;
        text-align: center;
      }

      .lobby-esqueleto__titulo {
        margin: 0;
        font-family: var(--lb-font-display, 'Sitka Banner', Constantia, Georgia, 'Times New Roman', serif);
        font-size: 30px;
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }

      .lobby-esqueleto__texto {
        margin: 0;
        max-width: 46ch;
        font-size: 15px;
        color: var(--lb-color-parchment-dim, #a2a09a);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <main class="lobby-esqueleto">
        <h1 class="lobby-esqueleto__titulo">Ative o JavaScript</h1>
        <p class="lobby-esqueleto__texto">
          O Lobby mostra as fichas da campanha aqui dentro do navegador e precisa de JavaScript. Ative nas configurações
          do navegador, ou libere este site na extensão que o bloqueia, e recarregue a página.
        </p>
      </main>
    </noscript>

    <script type="module" src="/src/lobby-site/main.tsx"></script>
  </body>
</html>
